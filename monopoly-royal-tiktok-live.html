<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Monopoly Royal — TikTok Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Reset and vertical 9:16 stage layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #04060c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f4f6fb;
    }

    #stage-wrap {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      max-height: 100vh;
      background: radial-gradient(circle at 50% 25%, #192638 0%, #090e17 75%);
      box-shadow: 0 0 75px rgba(0, 0, 0, 0.95), 0 0 28px rgba(212, 175, 55, 0.16);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* Discrete top-right toggle button */
    #toggle-panel-btn {
      position: absolute;
      top: 3px;
      right: 3px;
      opacity: 0.4;
      z-index: 30;
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 215, 110, 0.45);
      background: rgba(12, 17, 29, 0.78);
      color: #ffd56b;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    #toggle-panel-btn:hover {
      opacity: 1;
      transform: scale(1.06);
      background: rgba(24, 33, 54, 0.95);
    }

    /* Draggable control panel (hidden by default) */
    #control-panel {
      display: none;
      position: absolute;
      top: 64px;
      right: 12px;
      width: 312px;
      max-width: calc(100% - 24px);
      max-height: calc(100% - 80px);
      overflow-y: auto;
      z-index: 25;
      background: rgba(11, 16, 28, 0.95);
      border: 1px solid rgba(255, 213, 110, 0.36);
      border-radius: 14px;
      padding: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.82);
      font-size: 12px;
    }

    #control-panel.open {
      display: block;
    }

    #panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      cursor: grab;
      font-weight: 700;
      color: #ffd56b;
      touch-action: none;
    }

    #panel-header:active {
      cursor: grabbing;
    }

    .section {
      margin-bottom: 11px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .section-title {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #9bb0d4;
      margin-bottom: 6px;
      font-weight: 700;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: #dce6f7;
      font-size: 11.5px;
    }

    input, select {
      width: 100%;
      padding: 7px 9px;
      margin-bottom: 7px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.07);
      color: #ffffff;
      font-size: 12px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #ffd56b;
    }

    select option {
      background: #10172a;
      color: #ffffff;
    }

    .row-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    button.action-btn {
      padding: 7px 8px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #e6a82e, #c87d14);
      color: #111111;
      font-weight: 700;
      font-size: 11.5px;
      cursor: pointer;
    }

    button.action-btn:hover {
      filter: brightness(1.08);
    }

    button.secondary-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      margin-top: 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef5350;
      display: inline-block;
      flex-shrink: 0;
    }

    .dot.ok {
      background: #66bb6a;
      box-shadow: 0 0 8px #66bb6a;
    }

    .gift-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .gift-btn {
      padding: 7px 7px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.07);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .gift-btn:hover {
      background: rgba(255, 213, 110, 0.18);
      border-color: #ffd56b;
    }

    .gift-btn.span-2 {
      grid-column: span 2;
      text-align: center;
      background: rgba(255, 193, 7, 0.15);
    }

    #event-log {
      max-height: 78px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.36);
      border-radius: 8px;
      padding: 6px;
      font-size: 11px;
      color: #cfd8dc;
      line-height: 1.42;
    }
  </style>
</head>
<body>
  <div id="stage-wrap">
    <canvas id="boardCanvas" width="1280" height="720"></canvas>

    <!-- Eye button in top-right corner to toggle the live control panel -->
    <button id="toggle-panel-btn" type="button" title="Ouvrir / fermer la régie (H)" aria-label="Ouvrir ou fermer la régie">👁️</button>

    <!-- Floating draggable control drawer -->
    <aside id="control-panel" aria-label="Régie Monopoly Live">
      <div id="panel-header">
        <span>🎩 Régie Monopoly Live</span>
        <span id="close-panel" style="cursor:pointer;padding:0 4px;" title="Fermer">✕</span>
      </div>

      <div class="section">
        <div class="section-title">Connexion TikTok Live</div>
        <label for="tt-username">Pseudo TikTok (sans @)</label>
        <input id="tt-username" type="text" placeholder="moncompte_tiktok" maxlength="32" pattern="[A-Za-z0-9._]{1,32}" autocomplete="off" />
        <div style="font-size:10px;color:#9bb0d4;margin:-2px 0 7px;">Pour les jeux gratuits, utilise le pseudo du compte TikTok connecté à la vitrine.</div>

        <div class="row-btns">
          <button class="action-btn" id="connect-btn" type="button">Connecter</button>
          <button class="action-btn secondary-btn" id="disconnect-btn" type="button">Déconnecter</button>
        </div>

        <div class="status-line">
          <span id="status-dot" class="dot"></span>
          <span id="status-text">Déconnecté</span>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Actions & Simulateur Cadeaux</div>
        <div class="row-btns" style="margin-bottom:6px;">
          <button class="action-btn" id="roll-manual-btn" type="button">🎲 Lancer les dés</button>
          <button class="action-btn secondary-btn" id="chance-manual-btn" type="button">🃏 Carte Chance</button>
        </div>
        <div class="row-btns" style="margin-bottom:6px;">
          <button class="action-btn secondary-btn" id="win-test-btn" type="button">⭐ Tester Victoire</button>
          <button class="action-btn secondary-btn" id="reset-game-btn" type="button">🔄 Nouvelle Partie</button>
        </div>
        <div class="gift-grid">
          <button class="gift-btn" data-gift="rose" type="button">🌹 Rose (Lancer dés)</button>
          <button class="gift-btn" data-gift="heart" type="button">💖 Cœur (+200 jetons)</button>
          <button class="gift-btn" data-gift="donut" type="button">🍩 Donut (Construire)</button>
          <button class="gift-btn" data-gift="galaxy" type="button">🌌 Galaxie (Carte)</button>
          <button class="gift-btn span-2" data-gift="lion" type="button">🦁 Lion (+300 jetons & Lancer)</button>
        </div>
        <div class="row-btns" style="margin-top:6px;">
          <button class="action-btn secondary-btn" id="simulate-big-gift-btn" type="button">Simuler gros cadeau</button>
          <button class="action-btn secondary-btn" id="simulate-share-btn" type="button">Simuler partage</button>
        </div>
        <div class="section-title" style="margin-top:10px;">Partie</div>
        <div data-save-key="monopoly-royal-tiktok-live-save"></div>
      </div>

      <div class="section">
        <div class="section-title">Journal Live</div>
        <div id="event-log">Plateau prêt. Objectif : 2 500 jetons pour devenir Étoile ⭐.</div>
      </div>
    </aside>
  </div>

  <script>
    (() => {
      "use strict";

      const canvas = document.getElementById("boardCanvas");
      let ctx = canvas.getContext("2d");
      const S = 2; // netteté : résolution interne doublée
      const W = 1280;
      const H = 720;
      canvas.width = W * S;
      canvas.height = H * S;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";

      // Token threshold that triggers transformation into golden stars
      const WIN_THRESHOLD = 2500;
      const PAYMENT_MULTIPLIER = 2;
      const HOUSE_PRICE = 200;

      // 40 classic Monopoly spaces around the square board
      const RAW_TILES = [
        { name: "DÉPART", type: "start", color: null, price: 0, rent: 0 },
        { name: "Belleville", type: "prop", color: "#6d3b27", price: 60, rent: 15 },
        { name: "Communauté", type: "chest", color: null, price: 0, rent: 0 },
        { name: "Lecourbe", type: "prop", color: "#6d3b27", price: 60, rent: 20 },
        { name: "Impôts", type: "tax", color: null, price: 0, rent: 100 },
        { name: "Gare Montparnasse", type: "rail", color: "#263238", price: 200, rent: 50 },
        { name: "Vaugirard", type: "prop", color: "#4da3d9", price: 100, rent: 30 },
        { name: "Chance", type: "chance", color: null, price: 0, rent: 0 },
        { name: "Courcelles", type: "prop", color: "#4da3d9", price: 100, rent: 30 },
        { name: "République", type: "prop", color: "#4da3d9", price: 120, rent: 40 },
        { name: "Prison / Visite", type: "jail", color: null, price: 0, rent: 0 },
        { name: "La Villette", type: "prop", color: "#c84b8a", price: 140, rent: 50 },
        { name: "Électricité", type: "util", color: "#546e7a", price: 150, rent: 45 },
        { name: "Neuilly", type: "prop", color: "#c84b8a", price: 140, rent: 50 },
        { name: "Paradis", type: "prop", color: "#c84b8a", price: 160, rent: 60 },
        { name: "Gare de Lyon", type: "rail", color: "#263238", price: 200, rent: 50 },
        { name: "Mozart", type: "prop", color: "#df7822", price: 180, rent: 70 },
        { name: "Communauté", type: "chest", color: null, price: 0, rent: 0 },
        { name: "Saint-Michel", type: "prop", color: "#df7822", price: 180, rent: 70 },
        { name: "Pigalle", type: "prop", color: "#df7822", price: 200, rent: 80 },
        { name: "Parc Gratuit", type: "parking", color: null, price: 0, rent: 0 },
        { name: "Matignon", type: "prop", color: "#c62828", price: 220, rent: 90 },
        { name: "Chance", type: "chance", color: null, price: 0, rent: 0 },
        { name: "Malesherbes", type: "prop", color: "#c62828", price: 220, rent: 90 },
        { name: "Henri-Martin", type: "prop", color: "#c62828", price: 240, rent: 100 },
        { name: "Gare du Nord", type: "rail", color: "#263238", price: 200, rent: 50 },
        { name: "Faubourg", type: "prop", color: "#e6b800", price: 260, rent: 110 },
        { name: "Place Vendôme", type: "prop", color: "#e6b800", price: 260, rent: 110 },
        { name: "Eaux", type: "util", color: "#546e7a", price: 150, rent: 45 },
        { name: "La Fayette", type: "prop", color: "#e6b800", price: 280, rent: 120 },
        { name: "Allez en Prison", type: "gotojail", color: null, price: 0, rent: 0 },
        { name: "Breteuil", type: "prop", color: "#2e7d32", price: 300, rent: 130 },
        { name: "Foch", type: "prop", color: "#2e7d32", price: 300, rent: 130 },
        { name: "Communauté", type: "chest", color: null, price: 0, rent: 0 },
        { name: "Capucines", type: "prop", color: "#2e7d32", price: 320, rent: 150 },
        { name: "Gare Saint-Lazare", type: "rail", color: "#263238", price: 200, rent: 50 },
        { name: "Chance", type: "chance", color: null, price: 0, rent: 0 },
        { name: "Champs-Élysées", type: "prop", color: "#1565c0", price: 350, rent: 175 },
        { name: "Taxe Luxe", type: "tax", color: null, price: 0, rent: 150 },
        { name: "Rue de la Paix", type: "prop", color: "#1565c0", price: 400, rent: 200 }
      ];

      const CHANCE_CARDS = [
        "Avancez jusqu'à la Rue de la Paix !",
        "La banque vous verse un bonus de 150 jetons.",
        "Taxe spéciale : -150 jetons.",
        "Entretien des propriétés : -100 jetons.",
        "Avancez jusqu'à DÉPART et recevez 200 jetons !"
      ];

      let TILES = [];
      let PLAYERS = [];

      const state = {
        time: 0,
        turn: 0,
        diceRolling: false,
        diceTimer: 0,
        d1: 4,
        d2: 3,
        cardPopup: null,
        winner: null,
        starBursts: [],
        ws: null,
        reconnectTimer: null,
        manualDisconnect: false
      };

      const BOARD = {
        x: 22,
        y: 20,
        w: 1236,
        h: 680,
        corner: 88
      };

      function initGame() {
        TILES = RAW_TILES.map((t, i) => ({
          ...t,
          price: t.price * PAYMENT_MULTIPLIER,
          rent: t.rent * PAYMENT_MULTIPLIER,
          index: i,
          owner: null,
          houses: 0
        }));
        PLAYERS = [
          { id: 0, name: "Joueur 1", color: "#ff5252", tokens: 1500, stars: 0, pos: 0, tokenIcon: "🎩", isStarWinner: false },
          { id: 1, name: "Joueur 2", color: "#40c4ff", tokens: 1500, stars: 0, pos: 0, tokenIcon: "🏎️", isStarWinner: false }
        ];
        state.turn = 0;
        state.winner = null;
        state.starBursts = [];
        state.cardPopup = null;
      }

      function getTileRect(index) {
        const c = BOARD.corner;
        const stepX = (BOARD.w - c * 2) / 9;
        const stepY = (BOARD.h - c * 2) / 9;
        const R = BOARD.x + BOARD.w - c, B = BOARD.y + BOARD.h - c;

        if (index === 0) return { x: R, y: B, w: c, h: c, side: "bottom-right" };
        if (index >= 1 && index <= 9) {
          const i = index - 1;
          return { x: R - (i + 1) * stepX, y: B, w: stepX, h: c, side: "bottom" };
        }
        if (index === 10) return { x: BOARD.x, y: B, w: c, h: c, side: "bottom-left" };
        if (index >= 11 && index <= 19) {
          const i = index - 11;
          return { x: BOARD.x, y: B - (i + 1) * stepY, w: c, h: stepY, side: "left" };
        }
        if (index === 20) return { x: BOARD.x, y: BOARD.y, w: c, h: c, side: "top-left" };
        if (index >= 21 && index <= 29) {
          const i = index - 21;
          return { x: BOARD.x + c + i * stepX, y: BOARD.y, w: stepX, h: c, side: "top" };
        }
        if (index === 30) return { x: R, y: BOARD.y, w: c, h: c, side: "top-right" };
        const i = index - 31;
        return { x: R, y: BOARD.y + c + i * stepY, w: c, h: stepY, side: "right" };
      }
      function getTileCenter(index) {
        const r = getTileRect(index);
        return { x: r.x + r.w / 2, y: r.y + r.h / 2 };
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (m) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[m]));
      }

      function logEvent(msg) {
        const el = document.getElementById("event-log");
        const t = new Date().toLocaleTimeString("fr-FR", { hour12: false });
        if (!el) { state.log = state.log || []; state.log.unshift({ t, msg }); if (state.log.length > 8) state.log.pop(); return; }
        el.innerHTML = `<div>[${t}] ${escapeHtml(msg)}</div>` + el.innerHTML;
        state.log = state.log || [];
        state.log.unshift({ t, msg });
        if (state.log.length > 8) state.log.pop();
      }

      function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
      }

      function drawStarPath(c, cx, cy, spikes, outerR, innerR) {
        let rot = (Math.PI / 2) * 3;
        const step = Math.PI / spikes;
        c.beginPath();
        c.moveTo(cx, cy - outerR);
        for (let i = 0; i < spikes; i++) {
          c.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
          rot += step;
          c.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
          rot += step;
        }
        c.closePath();
      }

      // Draws a Monopoly chip or a golden star when transformed on victory
      function drawMonopolyChip(cx, cy, radius, asStar = false, pulse = 0) {
        ctx.save();
        ctx.translate(cx, cy);
        if (pulse > 0) {
          const s = 1 + Math.sin(state.time * 12) * 0.14 * pulse;
          ctx.scale(s, s);
        }
        if (asStar) {
          ctx.shadowColor = "#ffd54f";
          ctx.shadowBlur = 14;
          drawStarPath(ctx, 0, 0, 5, radius * 1.18, radius * 0.52);
          const starGrad = ctx.createRadialGradient(0, -radius * 0.2, 2, 0, 0, radius * 1.2);
          starGrad.addColorStop(0, "#fff9c4");
          starGrad.addColorStop(0.55, "#ffd54f");
          starGrad.addColorStop(1, "#ff8f00");
          ctx.fillStyle = starGrad;
          ctx.fill();
          ctx.lineWidth = 1.6;
          ctx.strokeStyle = "#ffffff";
          ctx.stroke();
        } else {
          ctx.fillStyle = "rgba(0,0,0,0.38)";
          ctx.beginPath(); ctx.ellipse(1.5, 2.6, radius, radius * 0.92, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = lg(-radius, -radius, radius, radius, [[0, "#ffe9a0"], [0.5, "#ffb300"], [1, "#a85f00"]]);
          ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
          const seg = 16;
          for (let i = 0; i < seg; i += 2) {
            const a0 = (i / seg) * Math.PI * 2, a1 = ((i + 1) / seg) * Math.PI * 2;
            ctx.fillStyle = "#fff3c4";
            ctx.beginPath(); ctx.arc(0, 0, radius, a0, a1); ctx.arc(0, 0, radius * 0.8, a1, a0, true); ctx.closePath(); ctx.fill();
          }
          ctx.fillStyle = rg(-radius * 0.3, -radius * 0.3, 0.5, 0, 0, radius * 0.8, [[0, "#ffe082"], [0.7, "#ffb300"], [1, "#b26a00"]]);
          ctx.beginPath(); ctx.arc(0, 0, radius * 0.76, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = "#8d4e00"; ctx.lineWidth = Math.max(0.6, radius * 0.08);
          ctx.beginPath(); ctx.arc(0, 0, radius * 0.6, 0, Math.PI * 2); ctx.stroke();
          if (radius >= 7) {
            ctx.fillStyle = "#8d4e00"; ctx.font = `900 ${radius * 0.95}px Georgia, serif`;
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText("J", 0, radius * 0.06);
            ctx.textBaseline = "alphabetic";
          }
          ctx.strokeStyle = "rgba(255,255,255,0.65)"; ctx.lineWidth = Math.max(0.7, radius * 0.1);
          ctx.beginPath(); ctx.arc(0, 0, radius * 0.9, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
        }
        ctx.restore();
      }

      // Dedicated artwork drawn on every space type
      function drawTileArtwork(tile, r) {
        ctx.save();
        const cx = r.x + r.w / 2;
        const cy = r.y + r.h / 2 - 4;

        if (tile.type === "jail") {
          ctx.fillStyle = "#cfd8dc";
          ctx.fillRect(r.x + 12, r.y + 12, r.w - 24, r.h - 24);
          ctx.fillStyle = "#37474f";
          ctx.fillRect(r.x + 22, r.y + 20, 16, 16);
          ctx.strokeStyle = "#263238";
          ctx.lineWidth = 2.5;
          for (let bx = r.x + 18; bx <= r.x + r.w - 18; bx += 11) {
            ctx.beginPath();
            ctx.moveTo(bx, r.y + 12);
            ctx.lineTo(bx, r.y + r.h - 12);
            ctx.stroke();
          }
        } else if (tile.type === "gotojail") {
          ctx.fillStyle = "#e53935";
          ctx.beginPath();
          ctx.arc(cx - 10, cy - 8, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#1e88e5";
          ctx.beginPath();
          ctx.arc(cx + 10, cy - 8, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#37474f";
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(cx - 8, cy + 10, 6, 0, Math.PI * 2);
          ctx.arc(cx + 8, cy + 10, 6, 0, Math.PI * 2);
          ctx.stroke();
        } else if (tile.type === "start") {
          ctx.fillStyle = "#d32f2f";
          ctx.beginPath();
          ctx.arc(cx, cy - 4, 22, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ffd54f";
          ctx.font = "900 10px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("GO", cx, cy - 1);

      function spawnStarTransformation(player) {

        state.winner = { player };

        const center = getTileCenter(player.pos);
        for (let i = 0; i < 42; i++) {
          const ang = (Math.PI * 2 * i) / 42 + Math.random() * 0.3;
          const spd = 90 + Math.random() * 280;
          state.starBursts.push({
            x: center.x,
            y: center.y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 70,
            size: 7 + Math.random() * 8,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 8,
            life: 1.4 + Math.random() * 0.6

        }
        logEvent(`⭐ VICTOIRE de ${player.name} ! Ses jetons se transforment en étoiles !`);
      }

        if (state.winner) return;

        const p = PLAYERS[state.turn % PLAYERS.length];
        const text = CHANCE_CARDS[Math.floor(Math.random() * CHANCE_CARDS.length)];
        state.cardPopup = { title: "🃏 CARTE CHANCE", text, timer: 3.4 };

        if (text.includes("150 jetons")) p.tokens += 150;
        else if (text.includes("-150 jetons")) p.tokens = Math.max(0, p.tokens - 150);
        else if (text.includes("-100 jetons")) p.tokens = Math.max(0, p.tokens - 100);
        else if (text.includes("DÉPART")) { p.pos = 0; p.tokens += 200; }
        else if (text.includes("Rue de la Paix")) { p.pos = 39; }

        logEvent(`${p.name} : ${text}`);
        checkWinCondition();
      }

      function resolveMove(steps) {
        const p = PLAYERS[state.turn % PLAYERS.length];
        const oldPos = p.pos;
        const nextPos = (p.pos + steps) % 40;
        if (oldPos + steps >= 40) {
          p.tokens += 200;
          logEvent(`${p.name} passe par DÉPART (+200 jetons)`);
        }
        p.pos = nextPos;
        const tile = TILES[nextPos];

        if (tile.type === "prop" || tile.type === "rail" || tile.type === "util") {
          if (tile.owner === null && p.tokens >= tile.price) {
            p.tokens -= tile.price;
            tile.owner = p.id;
            logEvent(`${p.name} acquiert ${tile.name} (${tile.price} jetons)`);
          } else if (tile.owner !== null && tile.owner !== p.id) {
            const owner = PLAYERS[tile.owner];
            const rent = Math.round(tile.rent * (1 + tile.houses * 0.6));
            const paid = Math.min(p.tokens, rent);
            p.tokens -= paid;
            owner.tokens += paid;
            logEvent(`${p.name} verse ${paid} jetons à ${owner.name}`);
          } else if (tile.owner === p.id && tile.type === "prop" && tile.houses < 5 && p.tokens >= HOUSE_PRICE) {

            logEvent(`${p.name} améliore ${tile.name} (niv. ${tile.houses})`);

        } else if (tile.type === "tax") {

        } else if (tile.type === "chance" || tile.type === "chest") {
          drawChanceCard();
        }

        checkWinCondition();
        state.turn += 1;
      }

          state.d1 = 1 + Math.floor(Math.random() * 6);
          state.d2 = 1 + Math.floor(Math.random() * 6);
          if (state.diceTimer <= 0) {
            state.diceRolling = false;
            const total = state.d1 + state.d2;
            logEvent(`Dés : ${state.d1} + ${state.d2} = ${total}`);
            resolveMove(total);
          }
        }

        if (state.cardPopup) {
          state.cardPopup.timer -= dt;
          if (state.cardPopup.timer <= 0) state.cardPopup = null;
        }

        for (let i = state.starBursts.length - 1; i >= 0; i--) {
          const s = state.starBursts[i];
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          s.vy += 240 * dt;
          s.rot += s.vRot * dt;
          s.life -= dt;
          if (s.life <= 0) state.starBursts.splice(i, 1);

          activePlayer.tokens += 300;

          checkWinCondition();
          rollDice(user);

          logEvent(`${user} envoie GALAXIE 🌌 -> Carte Chance !`);
          drawChanceCard();
        } else if (k.includes("donut") || k.includes("doughnut")) {
          const prop = TILES.find((t) => t.owner === activePlayer.id && t.type === "prop" && t.houses < 5);
          if (prop) {
            prop.houses += 1;
            logEvent(`${user} envoie DONUT 🍩 -> Maison ajoutée sur ${prop.name} !`);
          } else {
            rollDice(user);
          }
        } else if (k.includes("heart") || k.includes("cœur") || k.includes("coeur")) {
          activePlayer.tokens += 200;

        logEvent("Partie réinitialisée.");
      });
      document.querySelectorAll(".gift-btn").forEach((btn) => {
        btn.addEventListener("click", () => handleGift(btn.dataset.gift, "TestLive"));
      });

      // TikTok Live WebSocket connection
      const usernameInput = document.getElementById("tt-username");
      const statusDot = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");

      usernameInput.value = (localStorage.getItem("mono_tt_user") || "").replace(/^@+/, "");
      localStorage.removeItem("mono_tt_mode");
      localStorage.removeItem("mono_tt_ws");

      function setStatus(ok, txt) {
        statusDot.classList.toggle("ok", ok);
        statusText.textContent = txt;
      }

      function connectTikTok() {
        const user = usernameInput.value.trim();
        if (!/^[A-Za-z0-9._]{1,32}$/.test(user)) {
          setStatus(false, "Saisis un pseudo TikTok valide, sans @ (1 à 32 caractères).");
          usernameInput.focus();
          return;
        }
        localStorage.setItem("mono_tt_user", user);
        state.manualDisconnect = false;
        clearTimeout(state.reconnectTimer);
        if (state.ws) {
          state.ws.onclose = null;
          state.ws.close();
          state.ws = null;
        }

        setStatus(false, "Connexion...");
        try {
          const protocol = location.protocol === "https:" ? "wss:" : "ws:";
          const gameId = "/monopoly-royal-tiktok-live.html";
          const ws = new WebSocket(`${protocol}//${location.host}/free-game-live-relay?gameId=${encodeURIComponent(gameId)}`);
          state.ws = ws;
          ws.onopen = () => {
            setStatus(true, `Connexion au direct de @${user}…`);
            ws.send(JSON.stringify({ action: "CONNECT_TIKTOK", username: user, gameId }));
          };
          ws.onmessage = (ev) => {
            try {
              const msg = JSON.parse(ev.data);
              const eventType = String(msg.type || msg.event || "").toLowerCase();
              if (eventType === "status") {
                const message = String(msg.message || "État du direct mis à jour.");
                const failed = /erreur|invalide|refus|impossible|atteint|correspondre|suspendu|expiré/i.test(message);
                setStatus(!failed, message);
                if (failed) {
                  state.manualDisconnect = true;
                  clearTimeout(state.reconnectTimer);
                  if (ws.readyState < WebSocket.CLOSING) ws.close();
                }
                return;
              }
              const data = msg.gift || msg.giftData || msg.commentData || msg.data || msg;
              const sender = data.uniqueId || data.username || data.nickname || "Spectateur";
              if (eventType === "gift" || data.giftName || data.giftId) {
                handleGift(data.giftName || data.name || data.giftId || "rose", sender);
              } else if (eventType === "comment" || eventType === "chat") {
                const comment = String(data.comment || data.content || "").toLowerCase().trim();
                if (comment === "!roll" || comment === "!de" || comment === "!dé") rollDice(sender);
                else if (comment === "!chance") drawChanceCard();
              }
            } catch (error) {
              console.error("Événement TikTok illisible.", error);
              setStatus(false, "Le relais a envoyé un événement illisible.");
            }
          };
          ws.onclose = () => {
            if (state.ws === ws) state.ws = null;
            setStatus(false, "Déconnecté du direct.");
            if (!state.manualDisconnect) {
              clearTimeout(state.reconnectTimer);
              state.reconnectTimer = setTimeout(connectTikTok, 4000);
            }
          };
          ws.onerror = () => {
            if (ws.readyState === WebSocket.CONNECTING) state.manualDisconnect = true;
            setStatus(false, "Relais TikTok inaccessible ou accès refusé.");
          };
        } catch (error) {
          setStatus(false, `Connexion impossible : ${error.message}`);
        }
      }

      document.getElementById("connect-btn").addEventListener("click", connectTikTok);
      document.getElementById("simulate-big-gift-btn").addEventListener("click", () => {
        window.ArcadeEffects?.simulateBigGift(usernameInput.value.trim() || "Spectateur test", 100);
      });
      document.getElementById("simulate-share-btn").addEventListener("click", () => {
        window.ArcadeEffects?.simulateShare();
      });
      document.getElementById("disconnect-btn").addEventListener("click", () => {
        state.manualDisconnect = true;
        clearTimeout(state.reconnectTimer);
        if (state.ws) {
          try { state.ws.close(); } catch (_) {}
          state.ws = null;
        }
        setStatus(false, "Déconnecté");
      });

      initGame();
    })();
  </script>
</body>
</html>
