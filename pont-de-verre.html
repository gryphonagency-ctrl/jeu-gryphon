<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Pont de Verre — Griffon Arcade</title>
<style>
:root{--bg:#030106;--fg:#fff;--pink:#ec4899;--panel:rgba(10,10,12,.85)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at center,#11071f 0%,#030106 100%);color:var(--fg);font-family:Inter,system-ui,-apple-system,sans-serif;user-select:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px))}
header{width:100%;max-width:900px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid rgba(236,72,153,.3);border-radius:12px;padding:8px 56px 8px 14px}
h1{margin:0;font-size:16px;font-weight:900;letter-spacing:.15em;color:var(--pink);text-transform:uppercase;text-shadow:0 0 10px rgba(255,0,127,.7)}
.stats{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;font-weight:600}
.stats div{background:rgba(0,0,0,.6);border:1px solid #262626;border-radius:8px;padding:4px 10px}
main{position:relative;flex:1;min-height:0;width:100%;max-width:900px;background:rgba(0,0,0,.8);border:2px solid rgba(236,72,153,.4);border-radius:16px;box-shadow:0 0 35px rgba(255,0,127,.25);overflow:hidden}
svg{position:relative;z-index:1;width:100%;height:100%;display:block}
#background-video{width:100%;height:100%;object-fit:cover;opacity:.42;pointer-events:none;display:none}
#background-video.is-active{display:block}
#banner{position:absolute;z-index:3;top:14px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:8px 20px;border-radius:12px;background:rgba(0,0,0,.9);border:1px solid var(--pink);font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.bar{width:100%;max-width:900px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bar button{min-height:36px;padding:6px 12px;border:1px solid #554455;border-radius:8px;color:#fff;background:#211722;font-size:11px;font-weight:800;cursor:pointer}
.bar button:hover{border-color:var(--pink)}
#status{flex-basis:100%;text-align:center;font-size:12px;color:#f3d9e8}
#configuration-toggle{position:fixed;top:12px;right:12px;z-index:80;width:40px;height:40px;border:1px solid var(--pink);border-radius:50%;color:#fff;background:rgba(10,10,12,.95);font-size:19px;cursor:pointer}
#configuration-panel{position:fixed;top:60px;right:12px;z-index:90;display:flex;flex-wrap:wrap;gap:8px;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 76px);overflow:auto;padding:12px;color:#fff;background:rgba(10,10,12,.97);border:1px solid var(--pink);border-radius:12px;box-shadow:0 0 24px rgba(0,0,0,.75);font:12px Arial,sans-serif}
#configuration-panel[hidden]{display:none}
#configuration-panel button{min-height:36px;padding:7px 10px;border:1px solid #554455;border-radius:8px;color:#fff;background:#211722;font-size:11px;font-weight:800;cursor:pointer}
#configuration-panel button:hover{border-color:var(--pink)}
#configuration-panel button[hidden]{display:none}
#configuration-panel h4{flex-basis:100%;margin:2px 0 0;color:var(--pink);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#live-connection-row{flex-basis:100%;display:flex;gap:8px}
#tiktok-username{flex:1;min-width:0;height:36px;padding:6px 9px;border:1px solid #554455;border-radius:8px;color:#fff;background:#15121a}
#live-status,#background-video-status,#fullscreen-status{flex-basis:100%;text-align:center;color:#f3d9e8}
body.is-fullscreen{display:block;height:100vh;overflow:hidden;padding:0}
body.is-fullscreen main{position:fixed;inset:0;width:100vw;height:100vh;max-width:none;min-height:0;border:0;border-radius:0;box-shadow:none}
body.is-fullscreen header{position:fixed;top:10px;left:50%;transform:translateX(-50%);width:calc(100vw - 84px);max-width:900px;z-index:10;background:rgba(10,10,12,.9)}
body.is-fullscreen .bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(900px,calc(100vw - 24px));max-height:25vh;overflow:auto;padding:8px;background:rgba(10,10,12,.9);border:1px solid rgba(236,72,153,.45);border-radius:12px;z-index:10}
</style>

function guardSVG(x, y, body, skin, mask){

}

}

const GEO = {w:190, gap:8};
const feet = new Map(all.map(p => [p, [500, 520]]));
function pers(y){ return .62 + .38 * (y - 345) / 155; }
function hp(y){ return .9 + .1 * (y - 345) / 155; }
function tilePts(i, side){
  const h = (500 - 345) / totalRows, yT = 500 - (i + 1) * h, yB = 500 - i * h;
  const a = GEO.gap, b = GEO.gap + GEO.w, sg = side === "left" ? -1 : 1, pT = hp(yT), pB = hp(yB);
  return {yT, yB, pts:[[500 + sg*a*pT, yT],[500 + sg*b*pT, yT],[500 + sg*b*pB, yB],[500 + sg*a*pB, yB]]};
}
function tileCenter(i, side){ const t = tilePts(i, side); return [t.pts.reduce((s,p) => s + p[0], 0) / 4, (t.yT + t.yB) / 2]; }

function makeGlassPattern(){
  const pattern = Array.from({length: totalRows}, () => Math.random() < .5 ? "left" : "right");
  if (previousGlass){
    const same = () => pattern.filter((side, i) => side === previousGlass[i]).length;
    while (same() > 2){
      const i = Math.floor(Math.random() * pattern.length);
      if (pattern[i] === previousGlass[i]) pattern[i] = pattern[i] === "left" ? "right" : "left";
    }
    if (pattern[0] === previousGlass[0]) pattern[0] = pattern[0] === "left" ? "right" : "left";
  }
  previousGlass = pattern.slice();
  return pattern;
}

function renderBridge(pattern){
  const g = $("bridge"); g.innerHTML = ""; glass = pattern; brokenRows.clear();
  const h = (500 - 345) / totalRows, W = GEO.gap + GEO.w + 7;
  el("polygon", {points:`${500-W*hp(500)},500 ${500+W*hp(500)},500 ${500+W*hp(345)},345 ${500-W*hp(345)},345`, fill:"#0a1a33", opacity:.55}, g);
  for (let k = 0; k < 14; k++){ const yy = 345 + Math.random()*155, pp = hp(yy); el("circle", {cx:500+(Math.random()-.5)*2*W*pp, cy:yy, r:1+Math.random()*1.5, fill:"#7dd3fc", opacity:.35}, g); }
  for (let i = 0; i <= totalRows; i++){ const y = 500 - i*h, p = hp(y); el("line", {x1:500-W*p, y1:y, x2:500+W*p, y2:y, stroke:"#3b4658", "stroke-width":3.5*p}, g); }
  for (let i = 0; i < totalRows; i++){
    const yT = 500 - (i+1)*h, yB = 500 - i*h, pT = hp(yT), pB = hp(yB), pm = hp((yT+yB)/2);
    el("polygon", {points:`${500-GEO.gap*pT},${yT} ${500+GEO.gap*pT},${yT} ${500+GEO.gap*pB},${yB} ${500-GEO.gap*pB},${yB}`, fill:"#cc0033"}, g);
    for (const side of ["left", "right"]){
      const tg = el("g", {id:`tg-${i}-${side}`}, g), t = tilePts(i, side), [a,b,c,d] = t.pts;
      el("polygon", {points:t.pts.map(p => `${p[0]},${p[1]+4}`).join(" "), fill:"rgba(130,200,240,.55)"}, tg);
      el("polygon", {points:t.pts.map(p => `${p[0]},${p[1]}`).join(" "), fill:"rgba(150,215,255,.10)", stroke:"rgba(180,235,255,.9)", "stroke-width":3.5, "stroke-linejoin":"round", filter:"none"}, tg);
      el("polygon", {points:t.pts.map(p => p.join(",")).join(" "), fill:"url(#glass)", stroke:"rgba(255,255,255,.85)", "stroke-width":1.6, id:`tile-${i}-${side}`}, tg);
      el("polygon", {points:`${a[0]+(b[0]-a[0])*.15},${a[1]+1} ${a[0]+(b[0]-a[0])*.35},${a[1]+1} ${d[0]+(c[0]-d[0])*.2},${d[1]-1} ${d[0]+(c[0]-d[0])*.05},${d[1]-1}`, fill:"#fff", opacity:.38}, tg);
      const [cx, cy] = tileCenter(i, side);
      t.pts.forEach(p => el("circle", {cx:p[0]+(cx-p[0])*.1, cy:p[1]+(cy-p[1])*.18, r:2, fill:"#94a3b8"}, tg));
      el("g", {id:`crk-${i}-${side}`}, tg);
      el("circle", {cx:500+(side==="left"?-1:1)*(W+4)*pm, cy:(yT+yB)/2, r:3.5, fill:(i+(side==="left"?0:1))%2 ? "#ff007f" : "#00ffff"}, g);
    }
  }
}

function drawCracks(i, side, n){
  const grp = $(`crk-${i}-${side}`); if (!grp) return;
  const [cx, cy] = tileCenter(i, side), ox = (Math.random()-.5)*20;
  for (let k = 0; k < n; k++){
    const ang = Math.random() * 6.28; let x = cx + ox, y = cy, d = `M${x},${y}`;
    for (let s = 0; s < 3; s++){ const len = 8 + Math.random()*16; x += Math.cos(ang + (Math.random()-.5)*.8)*len; y += Math.sin(ang + (Math.random()-.5)*.8)*len*.5; d += ` L${x},${y}`; }
    el("path", {d, fill:"none", stroke:"#fff", "stroke-width":1.2, opacity:.9}, grp);
  }
}
function tween(ms, fn, done){
  const t0 = performance.now();
  (function f(t){ const k = Math.min(1, Math.max(0, (t - t0) / ms)); fn(k); if (k < 1) requestAnimationFrame(f); else if (done) done(); })(t0);
}
function shatter(r, side){
  const [cx, cy] = tileCenter(r, side), fx = $("fx"), shards = [];
  const tg = $(`tg-${r}-${side}`); if (tg) tg.style.display = "none"; brokenRows.add(r);
  for (let i = 0; i < 24; i++){
    const sz = 4 + Math.random()*9;
    const p = el("polygon", {points:`0,0 ${sz},${sz*.3} ${sz*.4},${sz}`, fill:"rgba(200,240,255,.7)", stroke:"#fff", "stroke-width":.8}, fx);
    shards.push({p, x:cx+(Math.random()-.5)*90*pers(cy), y:cy+(Math.random()-.5)*16, vx:(Math.random()-.5)*3, vy:Math.random()*2-1, rot:0, vr:(Math.random()-.5)*20});
  }
  tween(1300, k => shards.forEach(s => { s.vy += .5; s.x += s.vx; s.y += s.vy; s.rot += s.vr; s.p.setAttribute("transform", `translate(${s.x},${s.y}) rotate(${s.rot})`); s.p.style.opacity = 1 - k*k; }), () => shards.forEach(s => s.p.remove()));
}
function impact(x){
  const e = el("ellipse", {cx:x, cy:678, rx:8, ry:3, fill:"none", stroke:"#cbd5e1", "stroke-width":2}, $("fx"));
  tween(500, k => { e.setAttribute("rx", 8 + 60*k); e.setAttribute("ry", 3 + 14*k); e.setAttribute("opacity", 1 - k); }, () => { e.remove(); $("active").innerHTML = ""; nextTurn(); });
}
function fall(tx, ty){
  let vy = 0, y = ty, x = tx, rot = 0; const dir = Math.random() < .5 ? -1 : 1;
  (function step(){
    vy += .9; y += vy; rot += dir*6; x += dir*.6;
    if (y >= 690){ impact(x); return; }
    drawAt(x, y, rot, 1 - .35 * (y - ty) / (690 - ty));
    requestAnimationFrame(step);
  })();
}
function breakTile(r, side, tx, ty){
  setStatus("Chute", "#f43f5e");
  banner(`❌ Joueur ${alive[idx]} : la vitre se fissure…`, "#fb7185");
  const tg = $(`tg-${r}-${side}`); let c1 = false, c2 = false;
  drawCracks(r, side, 4);
  tween(700, k => {
    const j = (Math.random() - .5) * 2.5 * k;
    tg.setAttribute("transform", `translate(${j},${j/2})`); drawAt(tx + j, ty + (k > .75 ? (k - .75) * 28 : 0));
    if (k > .4 && !c1){ c1 = true; drawCracks(r, side, 6); }
    if (k > .75 && !c2){ c2 = true; drawCracks(r, side, 8); }
  }, () => { tg.setAttribute("transform", ""); shatter(r, side); fall(tx, ty); });
}

function choose(side){
  if (!active || row >= totalRows) return;
  if (brokenRows.has(row) && side === glass[row]){ banner("🧊 Cette vitre est déjà brisée !", "#fbbf24"); return; }
  active = false;
  const r = row, player = alive[idx], broken = side === glass[r];
  const [x0, y0] = feet.get(player), [tx, ty] = tileCenter(r, side);
  tween(1100, k => { const ph = k * Math.PI * 4; drawAt(x0 + (tx-x0)*k, y0 + (ty-y0)*k - Math.abs(Math.sin(ph))*4, 0, 1, ph); }, () => {
    feet.set(player, [tx, ty]);
    if (broken){ breakTile(r, side, tx, ty); return; }
    $(`tile-${r}-${side}`).setAttribute("fill", "rgba(120,255,200,.3)");
    row++; progress.set(player, row); updateUI();
    if (row >= totalRows){
      tween(1000, k => drawAt(tx + (500-tx)*k, ty + (336-ty)*k, 0, 1, k * Math.PI * 4), () => {
        feet.set(player, [500, 336]); setStatus("Victoire", "#22d3ee");
        banner(`🏆 Joueur ${player} a traversé le pont !`, "#67e8f9"); setTimeout(() => finishPlayer(player), 2200);
      });
    } else { active = true; banner("✨ Bon choix ! Continuez…", "#34d399"); }
  });
}

function chooseOld(side){
  const g = $("bridge"); g.innerHTML = ""; glass = [];
  const startY = 500, endY = 345, h = (startY - endY) / totalRows, w = 120, gap = 8;
  for (let i = 0; i < totalRows; i++){
    const yT = startY - (i + 1) * h, yB = startY - i * h;
    glass.push(Math.random() < .5 ? "left" : "right");
    const grp = el("g", {}, g);
    const L = 500 - gap - w, R = 500 + gap;
    el("polygon", {points:`${L},${yT} ${500-gap},${yT} ${500-gap},${yB} ${L},${yB}`, fill:"rgba(180,230,255,.45)", stroke:"#fff", "stroke-width":2, id:`tile-${i}-left`}, grp);
    el("polygon", {points:`${R},${yT} ${R+w},${yT} ${R+w},${yB} ${R},${yB}`, fill:"rgba(180,230,255,.45)", stroke:"#fff", "stroke-width":2, id:`tile-${i}-right`}, grp);
    el("polygon", {points:`${500-gap},${yT} ${500+gap},${yT} ${500+gap},${yB} ${500-gap},${yB}`, fill:"#cc0033"}, grp);
    el("circle", {cx:L-5, cy:(yT+yB)/2, r:4, fill:i%2?"#ff007f":"#00ffff"}, grp);
    el("circle", {cx:R+w+5, cy:(yT+yB)/2, r:4, fill:i%2?"#00ff99":"#ffcc00"}, grp);
  }
}

function setStatus(msg, color){ const s = $("game-status"); s.textContent = msg; s.style.color = color; }
let bannerT;
function banner(t, color){
  const b = $("banner"); b.textContent = t; b.style.color = color; b.style.opacity = 1;
  clearTimeout(bannerT); bannerT = setTimeout(() => b.style.opacity = 0, 1800);
}
function say(t){ $("status").textContent = t; }

function drawActive(x, y, s, rot = 0, ph = 0){
  const a = $("active"); a.setAttribute("transform", `translate(${x},${y}) rotate(${rot}) scale(${s})`);
  a.innerHTML = alive[idx] ? playerSVG(alive[idx], true, ph) : "";
}
function drawAt(fx, fy, rot = 0, k = 1, ph = 0){
  const s = Math.max(.3, .7 * Math.min(1.05, pers(fy))) * k;
  drawActive(fx, fy - 136 * s, s, rot, ph);
}
function drawActiveOld(x, y, s){
  const a = $("active"); a.setAttribute("transform", `translate(${x},${y}) scale(${s})`);
  a.innerHTML = alive[idx] ? playerSVG(alive[idx], true) : "";
}
const SLOTS = [290,710,235,765,180,820,125,875,70,930];
function updateBench(){
  const waiting = alive.filter((_, i) => i !== idx);
  $("bench").innerHTML = waiting.slice(0, SLOTS.length).map((p, n) => `<g transform="translate(${SLOTS[n]},420) scale(.7)">${playerSVG(p)}</g>`).join("");
}
function posY(r){ const h = (500 - 345) / totalRows; return r === totalRows ? 335 : 500 - r * h - h / 2; }
function loadBridgeFor(p){
  if (!patterns.has(p)) patterns.set(p, makeGlassPattern());
  renderBridge(patterns.get(p)); bridgeOwner = p;
  for (let r = 0; r < (progress.get(p) || 0); r++){
    const safe = glass[r] === "left" ? "right" : "left", t = $(`tile-${r}-${safe}`);
    if (t) t.setAttribute("fill", "rgba(120,255,200,.3)");
  }
}
function place(){
  if (alive[idx] && bridgeOwner !== alive[idx]) loadBridgeFor(alive[idx]);
  const f = feet.get(alive[idx]); if (f) drawAt(f[0], f[1]);
  updateBench();
}
function placeOld(){
  if (row === 0) drawActive(500, 420, .7);
  else drawActive(500, posY(row), Math.max(.45, .75 - row * .04));
  updateBench();
}
function updateUI(){
  $("cur-player").textContent = alive[idx] || "—";
  $("cur-step").textContent = Math.min(row + 1, totalRows);
  $("alive").textContent = `${alive.length} / ${all.length}`;
  $("arrived-count").textContent = arrived.length;
}

function switchTo(p){
  const i = alive.indexOf(p);
  if (i < 0 || !active) return false;
  idx = i; row = progress.get(p) || 0; place(); updateUI(); return true;
}
function reset(full){
  active = true;
  if (full){ alive = [...all]; arrived.length = 0; idx = 0; all.forEach(p => { progress.set(p, 0); feet.set(p, [500, 520]); }); $("fx").innerHTML = ""; patterns.clear(); bridgeOwner = null; }
  row = progress.get(alive[idx]) || 0;
  setStatus("En cours", "#34d399"); place(); updateUI();
}
function finishPlayer(p){
  const i = alive.indexOf(p);
  if (i >= 0) alive.splice(i, 1);
  progress.delete(p); arrived.push(p); $("active").innerHTML = "";
  if (!alive.length){
    updateUI(); setStatus("Manche terminée", "#22d3ee");
    banner("🔁 Tous ont traversé : nouvelle manche !", "#f0abfc");
    setTimeout(() => reset(true), 2500);
    return;
  }
  if (idx >= alive.length) idx = 0;
  row = progress.get(alive[idx]) || 0; active = true;
  place(); updateUI(); setStatus("En cours", "#34d399");
  banner(`Tour du Joueur ${alive[idx]}`, "#fbbf24");
}
function nextTurn(){
  const dead = alive.splice(idx, 1)[0]; progress.delete(dead);
  if (!alive.length){
    setStatus("Fin de partie", "#f43f5e");
    banner("🔁 Tous sont passés : nouvelle manche !", "#f0abfc");
    setTimeout(() => reset(true), 2500);
    return;
  }
  if (idx >= alive.length) idx = 0;
  banner(`⚠️ Joueur ${dead} éliminé ! Tour du Joueur ${alive[idx]} (nouvelles vitres)`, "#fbbf24");
  setTimeout(() => {
    row = progress.get(alive[idx]) || 0; active = true;
    place(); updateUI(); setStatus("En cours", "#34d399");
  }, 1500);
}

let chosen = null;
function pickPlayer(p){ chosen = p; say(`Joueur ${p} choisi. Envoie un cadeau pour le faire avancer.`); if (active) switchTo(p); }
function gift(side){
  const p = chosen || alive[idx];
  if (!alive.includes(p)){ say(`Le joueur ${p} est éliminé. Choisis un autre numéro.`); return; }
  if (!switchTo(p)) return;
  say(`🎁 Cadeau : le joueur ${p} avance côté ${side === "left" ? "gauche" : "droit"}.`);
  choose(side);
}

function normalizeTikTokUsername(value){
  return String(value || "").trim().replace(/^@/, "");
}
function handleTikTokMessage(message){
  if (!message || typeof message !== "object") return;
  const data = message.data && typeof message.data === "object" ? message.data : message;
  const type = String(message.type || message.event || data.type || "").toLowerCase();
  if (type === "status"){
    $("live-status").textContent = String(data.message || "Statut TikTok reçu.");
    return;
  }
  if (type === "comment" || type === "chat" || type === "tiktok-comment"){
    const commentData = data.commentData && typeof data.commentData === "object" ? data.commentData : data;
    const username = normalizeTikTokUsername(commentData.username || commentData.uniqueId || commentData.nickname);
    const command = String(commentData.comment || commentData.text || commentData.message || "").trim().replace(/^!/, "").trim().toLowerCase();
    const player = all.find(p => p === command);
    if (player){
      pickPlayer(player);
      say(`@${username || "Spectateur"} a choisi le joueur ${player}.`);
    } else if (command === "gauche" || command === "left"){
      if (username) liveSideChoices.set(username.toLowerCase(), "left");
      say(`@${username || "Spectateur"} a choisi le côté gauche pour son prochain cadeau.`);
    } else if (command === "droite" || command === "right"){
      if (username) liveSideChoices.set(username.toLowerCase(), "right");
      say(`@${username || "Spectateur"} a choisi le côté droit pour son prochain cadeau.`);
    }
    return;
  }
  if (type === "gift" || type === "tiktok-gift"){
    const giftData = data.gift && typeof data.gift === "object" ? data.gift : data;
    if (giftData.repeatEnd !== undefined && giftData.repeatEnd !== true && giftData.repeatEnd !== 1) return;
    const messageId = String(giftData.messageId || giftData.msgId || "");
    if (messageId){
      if (seenLiveGiftIds.has(messageId)) return;
      seenLiveGiftIds.add(messageId);
      if (seenLiveGiftIds.size > 1000) seenLiveGiftIds.delete(seenLiveGiftIds.values().next().value);
    }
    const username = normalizeTikTokUsername(giftData.username || giftData.uniqueId || giftData.nickname || message.username) || "Spectateur";
    const key = username.toLowerCase();
    const side = liveSideChoices.get(key) || (Math.random() < 0.5 ? "left" : "right");
    liveSideChoices.delete(key);
    gift(side);
  }
}
function connectTikTok(){
  const username = normalizeTikTokUsername($("tiktok-username").value);
  if (!/^[a-zA-Z0-9._]{1,32}$/.test(username)){
    $("live-status").textContent = "Pseudo TikTok invalide : saisis 1 à 32 lettres, chiffres, points ou tirets bas.";
    $("tiktok-username").focus();
    return;
  }
  if (liveSocket && liveSocket.readyState < WebSocket.CLOSING) return;
  let socket;
  try {
    socket = new WebSocket(LIVE_WEBSOCKET_URL);
  } catch (error) {
    console.error("Impossible d’ouvrir la connexion TikTok :", error);
    $("live-status").textContent = "Impossible d’ouvrir la connexion TikTok.";
    return;
  }
  liveSocket = socket;
  $("connect-live").disabled = true;
  $("disconnect-live").hidden = false;
  $("disconnect-live").textContent = "ANNULER";
  $("live-status").textContent = `Connexion à @${username}…`;
  socket.addEventListener("open", () => {
    if (liveSocket !== socket) return;
    try {
      socket.send(JSON.stringify({ action: "CONNECT_TIKTOK", username }));
    } catch (error) {
      console.error("Impossible d’envoyer la demande de connexion TikTok :", error);
      $("live-status").textContent = "La demande de connexion TikTok n’a pas pu être envoyée.";
      socket.close();
      return;
    }
    $("connect-live").hidden = true;
    $("connect-live").disabled = false;
    $("disconnect-live").textContent = "DÉCONNECTER";
    $("live-status").textContent = `Connexion au LIVE @${username}…`;
  });
  socket.addEventListener("message", event => {
    if (liveSocket !== socket) return;
    try {
      handleTikTokMessage(JSON.parse(String(event.data)));
    } catch (error) {
      console.error("Message TikTok impossible à traiter :", error);
      $("live-status").textContent = "Un message TikTok n’a pas pu être lu.";
    }
  });
  socket.addEventListener("error", error => {
    if (liveSocket !== socket) return;
    console.error("Erreur de connexion WebSocket TikTok :", error);
    $("live-status").textContent = "Erreur de connexion TikTok.";
  });
  socket.addEventListener("close", () => {
    if (liveSocket !== socket) return;
    liveSocket = null;
    $("connect-live").hidden = false;
    $("connect-live").disabled = false;
    $("disconnect-live").hidden = true;
    $("live-status").textContent = "Connexion TikTok fermée.";
  });
}
function disconnectTikTok(){
  const socket = liveSocket;
  liveSocket = null;
  $("connect-live").hidden = false;
  $("connect-live").disabled = false;
  $("disconnect-live").hidden = true;
  $("live-status").textContent = "HORS LIGNE";
  if (socket && socket.readyState < WebSocket.CLOSING) socket.close();
}

$("b-left").onclick = () => choose("left");
$("b-right").onclick = () => choose("right");
$("g-left").onclick = () => gift("left");
$("g-right").onclick = () => gift("right");
all.forEach(p => { const b = document.createElement("button"); b.id = "p-" + p; b.textContent = "CHOISIR " + p; b.onclick = () => pickPlayer(p); $("pick-buttons").appendChild(b); });
$("connect-live").addEventListener("click", connectTikTok);
$("disconnect-live").addEventListener("click", disconnectTikTok);
$("tiktok-username").addEventListener("keydown", event => {
  if (event.key === "Enter") connectTikTok();
});

const backgroundVideo = $("background-video");
const backgroundVideoInput = $("background-video-input");
const backgroundVideoStatus = $("background-video-status");
let backgroundVideoUrl = null;

function clearBackgroundVideo(message){
  backgroundVideo.pause();
  backgroundVideo.removeAttribute("src");
  backgroundVideo.classList.remove("is-active");
  backgroundVideoInput.value = "";
  if (backgroundVideoUrl) URL.revokeObjectURL(backgroundVideoUrl);
  backgroundVideoUrl = null;
  backgroundVideo.load();
  backgroundVideoStatus.textContent = message;
}

$("configuration-toggle").addEventListener("click", () => {
  const panel = $("configuration-panel");
  panel.hidden = !panel.hidden;
});
$("choose-background-video").addEventListener("click", () => backgroundVideoInput.click());
backgroundVideoInput.addEventListener("change", async () => {
  const file = backgroundVideoInput.files && backgroundVideoInput.files[0];
  if (!file) return;
  if (backgroundVideoUrl) URL.revokeObjectURL(backgroundVideoUrl);
  backgroundVideoUrl = URL.createObjectURL(file);
  backgroundVideo.src = backgroundVideoUrl;
  backgroundVideo.classList.add("is-active");
  backgroundVideo.load();
  try {
    await backgroundVideo.play();
    backgroundVideoStatus.textContent = `Vidéo active : ${file.name}`;
  } catch (error) {
    console.warn("Lecture de la vidéo d’arrière-plan impossible :", error);
    backgroundVideoStatus.textContent = error && (error.name === "AbortError" || error.name === "NotAllowedError")
      ? "Le navigateur a bloqué ou suspendu la lecture automatique."
      : "Lecture impossible. Essaie un format vidéo compatible.";
  }
});
backgroundVideo.addEventListener("error", () => {
  if (backgroundVideoUrl) clearBackgroundVideo("Format ou codec vidéo non pris en charge par ce navigateur.");
});
$("remove-background-video").addEventListener("click", () => clearBackgroundVideo("Aucune vidéo sélectionnée."));

function updateFullscreenState(){
  const isFullscreen = Boolean(document.fullscreenElement);
  document.body.classList.toggle("is-fullscreen", isFullscreen);
  $("fullscreen-toggle").textContent = isFullscreen ? "QUITTER LE PLEIN ÉCRAN" : "PLEIN ÉCRAN";
  $("fullscreen-status").textContent = "";
  if (isFullscreen) $("configuration-panel").hidden = true;
}
async function toggleFullscreen(){
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    else {
      $("fullscreen-status").textContent = "Le plein écran n’est pas disponible dans ce navigateur.";
      return;
    }
    updateFullscreenState();
  } catch (error) {
    console.warn("Impossible de changer le mode plein écran :", error);
    $("fullscreen-status").textContent = "Impossible de changer le mode plein écran.";
  }
}
$("fullscreen-toggle").addEventListener("click", toggleFullscreen);
document.addEventListener("fullscreenchange", updateFullscreenState);

reset(false);
</script>
