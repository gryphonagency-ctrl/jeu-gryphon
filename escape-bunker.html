const sectorBackgroundFiles={
  hub:'bunker-player-original.jpg',
  vent_north:'bunker-route-02.jpg',
  main_east:'bunker-route-03.jpg',
  lift_south:'bunker-route-04.jpg',

  surface_fail:'bunker-route-06.jpg',
  victory:'bunker-route-06.jpg',
  defeat:'bunker-route-06.jpg'
};
const sectorBackgrounds=new Map(),backgroundImages=new Map();
for(const [sector,src] of Object.entries(sectorBackgroundFiles)){
  let image=backgroundImages.get(src);
  if(!image){
    image=new Image();
    image.src=src;
    backgroundImages.set(src,image);
    image.addEventListener('load',()=>{
      for(const [id,background] of sectorBackgrounds){
        if(background===image)sceneCanvases.delete(id);
      }
    });
  }
  sectorBackgrounds.set(sector,image);
}
const backgroundsReady=Promise.all(Array.from(backgroundImages,([src,image])=>
  new Promise((resolve,reject)=>{
    const loaded=()=>image.naturalWidth
      ?resolve(image)
      :reject(new Error(`Image de décor invalide : ${src}`));
    if(image.complete)loaded();
    else{
      image.addEventListener('load',loaded,{once:true});
      image.addEventListener('error',()=>reject(new Error(`Impossible de charger l’image ${src}`)),{once:true});
    }
  })
));

function polygon(c,points,fill,stroke){
  c.beginPath();c.moveTo(points[0][0],points[0][1]);
  for(let i=1;i<points.length;i++)c.lineTo(points[i][0],points[i][1]);
  c.closePath();c.fillStyle=fill;c.fill();
  if(stroke){c.strokeStyle=stroke;c.stroke()}
}
function makeSectorCanvas(id,W,H){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');
  const image=sectorBackgrounds.get(id);
  if(image&&image.complete&&image.naturalWidth){
    const coverScale=Math.max(W/image.naturalWidth,H/image.naturalHeight);
    const coverWidth=image.naturalWidth*coverScale,coverHeight=image.naturalHeight*coverScale;
    g.save();
    g.filter=`blur(${Math.max(16,Math.round(W*.02))}px) brightness(.38)`;
    g.drawImage(image,(W-coverWidth)/2,(H-coverHeight)/2,coverWidth,coverHeight);
    g.restore();
    const scale=Math.min(W/image.naturalWidth,H/image.naturalHeight);
    const iw=image.naturalWidth*scale,ih=image.naturalHeight*scale;
    g.drawImage(image,(W-iw)/2,(H-ih)/2,iw,ih);
    return c;
  }
  const p=sectorPalettes[id]||sectorPalettes.hub;
  const horizon=H*p.horizon,center=W*.5;
  const ceiling=g.createLinearGradient(0,0,0,horizon);
  ceiling.addColorStop(0,p.shadow);ceiling.addColorStop(1,p.wall);
  g.fillStyle=ceiling;g.fillRect(0,0,W,H);
  polygon(g,[[0,horizon],[center-W*.12,horizon*.77],[center+W*.12,horizon*.77],[W,horizon]],p.wall);
  polygon(g,[[0,horizon],[center-W*.12,horizon*.77],[center-W*.12,horizon*1.03],[0,H]],p.shadow);
  polygon(g,[[W,horizon],[center+W*.12,horizon*.77],[center+W*.12,horizon*1.03],[W,H]],p.shadow);
  polygon(g,[[0,H],[center-W*.12,horizon*1.03],[center+W*.12,horizon*1.03],[W,H]],p.floor);

  const floorGrad=g.createLinearGradient(0,horizon,0,H);
  floorGrad.addColorStop(0,'rgba(0,0,0,.05)');floorGrad.addColorStop(1,'rgba(0,0,0,.58)');
  g.fillStyle=floorGrad;g.fillRect(0,horizon,W,H-horizon);

/* ---------- Voix ---------- */
function say(txt){
  if(!voiceOn||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';u.rate=.95;u.pitch=.8;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('fr'));if(v)u.voice=v;
  speechSynthesis.speak(u);
}

let votes=new Map(),locked=false,voteTimer=null,cur=null,activeSocket=null,transitionTimer=null;
function go(id){
  if(!document.body.classList.contains('travelling'))cameraView={...sceneViews[id]};
  clearInterval(voteTimer);currentSector=id;cur=labyrinth[id];locked=false;votes=new Map();
  $('sector-hud').textContent=cur.name;$('danger-hud').textContent=cur.danger;$('narrative-screen').textContent=cur.text;
  const box=$('button-container');box.innerHTML='';
  cur.options.forEach((o,i)=>{
    const b=document.createElement('button');b.className='action-btn';
    b.innerHTML='<div class="fill"></div><span></span>';b.querySelector('span').textContent=o.text;
    b.onclick=()=>cast('Streamer',i);box.appendChild(b);
  });
  const narration=demoI?cur.text:cur.text+' '+cur.options.map(o=>o.text.replace(/^\[(.)\]/,'Choix $1 :')).join('. ');
  say(narration);
  startVoteClock(demoI?10:VOTE_TIME);
}
function startVoteClock(seconds){
  clearInterval(voteTimer);
  if(['victory','defeat','surface_fail'].includes(currentSector)){
    $('clock').textContent='--';
    $('timer').querySelector('i').style.transform='scaleX(0)';
    return;
  }
  let left=seconds;const bar=$('timer').querySelector('i');bar.style.transform='scaleX(1)';
  $('clock').textContent=left+' s';
  voteTimer=setInterval(()=>{left=Math.max(0,left-.1);bar.style.transform=`scaleX(${left/seconds})`;if(Math.ceil(left)!==Math.ceil(left+.1))$('clock').textContent=Math.ceil(left)+' s';if(left<=0)resolve()},100);
}
function cast(user,i){
  if(locked||!cur||i<0||i>=cur.options.length)return;
  votes.set(user,i);
  const n=cur.options.map(()=>0);votes.forEach(v=>n[v]++);const tot=Math.max(1,votes.size);
  document.querySelectorAll('.action-btn').forEach((b,k)=>b.querySelector('.fill').style.width=(n[k]/tot*100)+'%');
}
function resolve(){
  clearInterval(voteTimer);locked=true;
  const n=cur.options.map(()=>0);votes.forEach(v=>n[v]++);
  const max=Math.max(...n);const best=n.map((c,i)=>c===max?i:-1).filter(i=>i>=0);
  const w=best[Math.random()*best.length|0],opt=cur.options[w];
  document.querySelectorAll('.action-btn')[w].classList.add('win');
  setTimeout(()=>{
    if(opt.action)opt.action();
    const destination=ammunition>0||opt.target==='surface_fail'?opt.target:'surface_fail';
    transitionTo(destination);
  },800);
}

function drawPassageTransition(W,H){
  if(!document.body.classList.contains('travelling'))return;
  const strength=Math.sin(Math.PI*travelProgress);
  if(strength<.01)return;
  const cx=W*(.5+passageDirection.x*.13*travelProgress);
  const cy=H*(.43+passageDirection.y*.12*travelProgress);

  const walls=ctx.createLinearGradient(0,0,0,H);
  walls.addColorStop(0,`rgba(0,4,2,${strength*.08})`);
  walls.addColorStop(.55,`rgba(0,5,2,${strength*.14})`);
  walls.addColorStop(1,`rgba(0,0,0,${strength*.34})`);
  ctx.fillStyle=walls;ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalAlpha=strength*.72;
  ctx.lineWidth=Math.max(2,W*.002);
  ctx.strokeStyle='rgba(134,177,127,.72)';
  ctx.shadowColor='rgba(88,255,124,.65)';
  ctx.shadowBlur=14*strength;
  for(let i=0;i<4;i++){
    const z=(i/4+travelProgress*1.35)%1;
    const scale=.12+z*.9;
    const width=W*scale;
    const height=H*scale*.72;
    const top=cy-height*.56;
    const bottom=cy+height*.48;
    ctx.globalAlpha=strength*(.18+z*.42);
    ctx.beginPath();
    ctx.moveTo(cx-width*.48,top);
    ctx.lineTo(cx-width*.42,bottom);
    ctx.lineTo(cx+width*.42,bottom);
    ctx.lineTo(cx+width*.48,top);
    ctx.closePath();
    ctx.stroke();
  }
  ctx.shadowBlur=0;
  ctx.globalAlpha=strength*.35;
  ctx.strokeStyle='rgba(202,180,112,.7)';
  for(let i=0;i<8;i++){
    const spread=(i+1)/8;
    const startX=cx+passageDirection.x*W*.1;
    const startY=cy+passageDirection.y*H*.08;
    ctx.beginPath();
    ctx.moveTo(startX,startY);
    ctx.lineTo(W*(spread-.5),H);
    ctx.stroke();
  }
  ctx.restore();
}
function drawSectorEffects(id,W,H,alpha,offsetX=0,offsetY=0,zoom=1){

    const beam=ctx.createLinearGradient(source.x,source.y,target.x,target.y);

    beam.addColorStop(1,'rgba(255,244,211,0)');
    ctx.fillStyle=beam;
    ctx.beginPath();
    ctx.moveTo(source.x,source.y);
    ctx.lineTo(target.x-Math.sin(angle)*beamWidth,target.y+Math.cos(angle)*beamWidth);
    ctx.lineTo(target.x+Math.sin(angle)*beamWidth,target.y-Math.cos(angle)*beamWidth);
    ctx.closePath();

    const haloRadius=beamWidth*.9;
    const halo=ctx.createRadialGradient(source.x,source.y,1,source.x,source.y,haloRadius);
    halo.addColorStop(0,`rgba(255,242,205,${.2*beamPulse})`);
    halo.addColorStop(1,'rgba(255,242,205,0)');
    ctx.fillStyle=halo;

      for(let x=330;x<=1380;x+=35){
        const point=toScreen(x,y+Math.sin(t*1.25+i*.83+x*.013)*4);
        if(x===330)ctx.moveTo(point.x,point.y);
        else ctx.lineTo(point.x,point.y);
      }
      ctx.strokeStyle=`rgba(190,224,230,${.045+(i%3)*.018})`;
      ctx.lineWidth=Math.max(1,scale*(i%3===0?2:1));
      ctx.stroke();
    }
    const glintX=390+(t*74%900);
    const glint=toScreen(glintX,468+Math.sin(t*.9)*12);
    const glintWidth=105*scale;
    const reflection=ctx.createRadialGradient(glint.x,glint.y,1,glint.x,glint.y,glintWidth);
    reflection.addColorStop(0,'rgba(225,245,247,.14)');
    reflection.addColorStop(1,'rgba(225,245,247,0)');
    ctx.fillStyle=reflection;
    ctx.fillRect(glint.x-glintWidth,glint.y-glintWidth*.35,glintWidth*2,glintWidth*.7);
    ctx.restore();
  }
  for(const [index,panel] of (effects.flickerPanels||[]).entries()){
    const {x,y}=toScreen(panel.x,panel.y);
    const width=panel.w*scale,height=panel.h*scale;
    const flicker=Math.sin(t*(8+index*1.7)+index*2.4)>.88?.18:1;
    const pulse=.18+.17*(.5+.5*Math.sin(t*4.2+index*1.8));
    ctx.save();
    ctx.globalCompositeOperation='screen';
    ctx.globalAlpha=alpha*flicker;
    const screenGlow=ctx.createRadialGradient(
      x+width*.5,y+height*.48,1,x+width*.5,y+height*.48,width*.86
    );
    screenGlow.addColorStop(0,`rgba(${panel.color},${pulse*.72})`);
    screenGlow.addColorStop(1,`rgba(${panel.color},0)`);
    ctx.fillStyle=screenGlow;
    ctx.fillRect(x-width*.25,y-height*.25,width*1.5,height*1.5);
    ctx.fillStyle=`rgba(${panel.color},${pulse*.22})`;
    ctx.fillRect(x,y,width,height);
    ctx.restore();
  }
  for(let i=0;i<(effects.lights||[]).length;i++){
    const light=effects.lights[i];
    const variation=light.flicker===undefined?0.11:light.flicker;
    const flickerWave=Math.sin(t*(light.speed||3)+i*2.7)
      +variation*.45*Math.sin(t*7.1+i*4.3);
    const blink=light.flicker>=.18&&Math.sin(t*(light.speed||3)*.37+i*1.9)>.94?0.42:1;
    const flicker=Math.max(.48,1+variation*flickerWave)*blink;
    const {x,y}=toScreen(light.x,light.y);
    const radius=light.r*scale;
    const glow=ctx.createRadialGradient(x,y,1,x,y,radius);
    glow.addColorStop(0,`rgba(${light.color},${light.power*flicker*.3*alpha})`);
    glow.addColorStop(.32,`rgba(${light.color},${light.power*flicker*.11*alpha})`);
    glow.addColorStop(1,`rgba(${light.color},0)`);
    ctx.fillStyle=glow;ctx.fillRect(x-radius,y-radius,radius*2,radius*2);
    const coreRadius=Math.max(2,5*scale);
    const core=ctx.createRadialGradient(x,y,0,x,y,coreRadius*2);
    core.addColorStop(0,`rgba(${light.color},${Math.min(.8,light.power*flicker)*alpha})`);
    core.addColorStop(1,`rgba(${light.color},0)`);
    ctx.fillStyle=core;
    ctx.fillRect(x-coreRadius*2,y-coreRadius*2,coreRadius*4,coreRadius*4);
  }
  for(const vent of effects.steam||[]){
    const count=vent.count||20;
    const source=toScreen(vent.x,vent.y);
    const sourceRadius=Math.max(2,vent.size*scale*.3);
    const pulse=.82+.18*Math.sin(t*2.4);
    const leak=ctx.createRadialGradient(
      source.x,source.y,1,source.x,source.y,sourceRadius
    );
    leak.addColorStop(0,`rgba(205,219,207,${alpha*.16*pulse})`);
    leak.addColorStop(.38,`rgba(176,197,183,${alpha*.09*pulse})`);
    leak.addColorStop(1,'rgba(148,170,155,0)');
    ctx.fillStyle=leak;
    ctx.fillRect(source.x-sourceRadius,source.y-sourceRadius,sourceRadius*2,sourceRadius*2);
    for(let i=0;i<count;i++){
      const phase=(t*.34+i/count)%1;
      const drift=Math.sin(t*1.8+i*2.17)*vent.spread*phase;
      const {x,y}=toScreen(
        vent.x+vent.dx*phase+drift,
        vent.y+vent.dy*phase
      );
      const radius=Math.max(2,vent.size*scale*(.12+phase*.88));
      const opacity=alpha*(.025+Math.sin(phase*Math.PI)*.12)*(1-phase*.5)*pulse;
      const vapor=ctx.createRadialGradient(x-radius*.2,y-radius*.25,1,x,y,radius);
      vapor.addColorStop(0,`rgba(191,211,197,${opacity})`);
      vapor.addColorStop(.55,`rgba(143,174,157,${opacity*.55})`);
      vapor.addColorStop(1,'rgba(129,156,141,0)');
      ctx.fillStyle=vapor;
      ctx.beginPath();ctx.ellipse(x,y,radius,radius*.62,drift*4,0,Math.PI*2);ctx.fill();
    }
  }
  for(let i=0;i<(effects.ripples||[]).length;i++){
    const ripple=effects.ripples[i];
    const phase=(t*.55+i*.37)%1;
    const {x,y}=toScreen(ripple.x,ripple.y);
    const radius=ripple.r*scale*(.2+phase);
    ctx.globalAlpha=alpha*(1-phase)*.32;
    ctx.strokeStyle='rgba(190,218,222,.72)';
    ctx.lineWidth=Math.max(.7,scale*.9);
    ctx.beginPath();
    ctx.ellipse(x,y,radius,radius*.16,0,0,Math.PI*2);
    ctx.stroke();
  }
  if(effects.exitSign){
    const sign=effects.exitSign;
    const {x,y}=toScreen(sign.x,sign.y);
    const width=sign.w*scale,height=sign.h*scale;
    const pulse=.82+.18*Math.sin(t*2.3);
    ctx.save();
    ctx.globalCompositeOperation='screen';
    ctx.globalAlpha=alpha;
    ctx.shadowColor='rgba(81,255,133,.9)';
    ctx.shadowBlur=18*scale*pulse;
    ctx.fillStyle=`rgba(8,76,34,${.88*pulse})`;
    ctx.fillRect(x,y,width,height);
    ctx.strokeStyle=`rgba(180,255,199,${.95*pulse})`;
    ctx.lineWidth=Math.max(1.5,2.5*scale);
    ctx.strokeRect(x,y,width,height);
    ctx.shadowBlur=8*scale;
    ctx.fillStyle='#edfff1';
    ctx.font=`700 ${Math.max(14,48*scale)}px "Segoe UI",sans-serif`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText('SORTIE',x+width*.43,y+height*.51);
    const arrowX=x+width*.82,arrowY=y+height*.51;
    ctx.lineWidth=Math.max(2,5*scale);
    ctx.beginPath();
    ctx.moveTo(arrowX-width*.075,arrowY);
    ctx.lineTo(arrowX+width*.065,arrowY);
    ctx.lineTo(arrowX+width*.015,arrowY-height*.14);
    ctx.moveTo(arrowX+width*.065,arrowY);
    ctx.lineTo(arrowX+width*.015,arrowY+height*.14);
    ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function drawDoorAnimation(W,H){
  if(!document.body.classList.contains('travelling'))return;
  const progress=travelProgress;
  const open=progress<.2
    ?1-(1-Math.max(0,Math.min(1,progress/.2)))**3
    :progress<.7?1:1-Math.max(0,Math.min(1,(progress-.7)/.3))**2;
  const retreat=progress<.7?1:1-Math.max(0,Math.min(1,(progress-.7)/.3))*.45;
  const alpha=progress<.7?1:1-Math.max(0,Math.min(1,(progress-.7)/.3));
  if(alpha<=.01)return;
  const cx=W*.52,cy=H*.52,doorW=W*.56*retreat,doorH=H*.72*retreat;
  const left=cx-doorW/2,top=cy-doorH/2;
  const half=doorW/2,travel=half*open;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=18;
  ctx.strokeStyle='rgba(146,169,143,.8)';ctx.lineWidth=Math.max(3,W*.006);
  ctx.strokeRect(left,top,doorW,doorH);
  ctx.shadowBlur=0;
  for(const side of [-1,1]){
    const x=side<0?cx-half-travel:cx+travel;
    const panel=ctx.createLinearGradient(x,0,x+half,0);
    panel.addColorStop(0,'#101715');panel.addColorStop(.22,'#36413a');
    panel.addColorStop(.5,'#202a25');panel.addColorStop(.82,'#465247');
    panel.addColorStop(1,'#111815');
    ctx.fillStyle=panel;ctx.fillRect(x,top+doorH*.025,half,doorH*.95);
    ctx.strokeStyle='rgba(173,190,166,.62)';ctx.lineWidth=Math.max(1,W*.002);
    ctx.strokeRect(x+half*.08,top+doorH*.07,half*.84,doorH*.86);
    for(let rib=1;rib<5;rib++){
      const rx=x+half*(((rib-1)%2)*.7+.15);
      ctx.beginPath();ctx.moveTo(rx,top+doorH*.1);ctx.lineTo(rx,top+doorH*.9);ctx.stroke();
    }
    ctx.fillStyle='#9ca68c';
    ctx.fillRect(side<0?x+half*.78:x+half*.12,cy-doorH*.035,Math.max(3,W*.004),doorH*.07);
  }
  ctx.fillStyle='rgba(158,255,162,.7)';
  ctx.shadowColor='#69ff7c';ctx.shadowBlur=12;
  ctx.fillRect(cx-W*.006,top+doorH*.12,W*.012,H*.018);
  ctx.shadowBlur=0;ctx.restore();
}
function drawSceneLayer(id,W,H,alpha,offsetX,offsetY,zoom){
  if(alpha<=0)return;
  const scene=getSectorCanvas(id,W,H);
  const scale=Math.max(W/scene.width,H/scene.height)*zoom;
  const width=scene.width*scale,height=scene.height*scale;
  ctx.globalAlpha=alpha;
  ctx.drawImage(scene,(W-width)/2+cameraView.x*W+offsetX,
    (H-height)/2+cameraView.y*H+offsetY,width,height);
  ctx.globalAlpha=1;
}
function onComment(d){
  const text=String(d.comment??d.text??'').trim();
  const m=/^!?\s*([a-d1-4])$/i.exec(text);if(!m)return;
  const user=String(d.username??d.nickname??'anonyme').replace(/^@/,'');
  cast(user,isNaN(m[1])?'abcd'.indexOf(m[1].toLowerCase()):m[1]-1);
}
function connect(){
  const u=$('user').value.trim().replace(/^@/,'');if(!u){setStatus('Saisissez votre pseudo TikTok.','error');$('user').focus();return}
  if(activeSocket&&activeSocket.readyState<2){activeSocket.close();return}
  let ws;try{ws=new WebSocket(CONNECTOR_URL)}catch(e){setStatus('Connexion impossible : adresse invalide.','error');return}
  activeSocket=ws;setStatus('Connexion au live…','');
  $('connect').textContent='Déconnecter';
  localStorage.setItem('bunker-tiktok-user',u);
  ws.onopen=()=>ws.send(JSON.stringify({action:'CONNECT_TIKTOK',username:u}));
  ws.onmessage=ev=>{try{const d=JSON.parse(ev.data);
    if(d.type==='STATUS'){const connected=/direct tiktok connecté/i.test(d.message||'');setStatus(d.message||'Statut reçu',connected?'connected':'');}
    else if(d.type==='comment'||d.type==='tiktok-comment')onComment(d.commentData??d)}catch(e){console.error('Message du connecteur invalide',e)}};
  ws.onerror=()=>setStatus('Connexion impossible au connecteur.','error');
  ws.onclose=()=>{if(activeSocket===ws)activeSocket=null;$('connect').textContent='Connecter TikTok';setStatus('Hors ligne','')};
}

const interactionPanel=$('interaction-panel'),panelDragHandle=$('panel-drag-handle');
let panelPointer=null,panelHasCustomPosition=false;
function clampPanelPosition(left,top){
  const rect=interactionPanel.getBoundingClientRect();
  return{
    left:Math.max(0,Math.min(left,innerWidth-rect.width)),
    top:Math.max(0,Math.min(top,innerHeight-rect.height))
  };
}
function fitInteractionPanel(){
  if(document.body.classList.contains('travelling'))return;
  const previousRect=interactionPanel.getBoundingClientRect();
  interactionPanel.style.scale='1';
  const width=interactionPanel.offsetWidth,height=interactionPanel.offsetHeight;
  const scale=Math.min(1,(innerWidth-16)/width,(innerHeight-16)/height);
  interactionPanel.style.scale=String(Math.max(.35,scale));
  if(panelHasCustomPosition){
    moveInteractionPanel(previousRect.left,previousRect.top);
  }else{
    const rect=interactionPanel.getBoundingClientRect();
    interactionPanel.style.left=Math.max(0,innerWidth-rect.width-14)+'px';
    interactionPanel.style.top=Math.max(0,innerHeight-rect.height-26)+'px';
    interactionPanel.style.right='auto';
    interactionPanel.style.bottom='auto';
  }
}
function moveInteractionPanel(left,top){
  const position=clampPanelPosition(left,top);
  interactionPanel.style.left=position.left+'px';
  interactionPanel.style.top=position.top+'px';
  interactionPanel.style.right='auto';
  interactionPanel.style.bottom='auto';
  panelHasCustomPosition=true;
}
panelDragHandle.addEventListener('pointerdown',event=>{
  if(event.button!==0||!event.isPrimary)return;
  event.preventDefault();
  const rect=interactionPanel.getBoundingClientRect();
  panelPointer={id:event.pointerId,startX:event.clientX,startY:event.clientY,left:rect.left,top:rect.top};
  panelDragHandle.setPointerCapture(event.pointerId);
});
panelDragHandle.addEventListener('pointermove',event=>{
  if(!panelPointer||event.pointerId!==panelPointer.id)return;
  moveInteractionPanel(
    panelPointer.left+event.clientX-panelPointer.startX,
    panelPointer.top+event.clientY-panelPointer.startY
  );
});
function finishPanelDrag(event){
  if(panelPointer&&event.pointerId===panelPointer.id)panelPointer=null;
}
panelDragHandle.addEventListener('pointerup',finishPanelDrag);
panelDragHandle.addEventListener('pointercancel',finishPanelDrag);
panelDragHandle.addEventListener('keydown',event=>{
  const directions={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  const direction=directions[event.key];
  if(!direction)return;
  event.preventDefault();
  const rect=interactionPanel.getBoundingClientRect(),step=event.shiftKey?40:12;
  moveInteractionPanel(rect.left+direction[0]*step,rect.top+direction[1]*step);
});
addEventListener('resize',()=>{

});
new ResizeObserver(fitInteractionPanel).observe(interactionPanel);

function drawScene(){
  t+=.016;mx+=(tmx-mx)*.05;my+=(tmy-my)*.05;
  const sx=Math.sin(t*.9)*6+mx*-40,sy=Math.cos(t*1.7)*4+my*-24;
  const W=canvas.width,H=canvas.height;
  const isTravelling=document.body.classList.contains('travelling');
  if(isTravelling)travelProgress=Math.min(1,(performance.now()-travelStartedAt)/TRAVEL_DURATION);
  const walkEnvelope=isTravelling?Math.sin(Math.PI*travelProgress):0;
  const easedTravel=travelProgress**3*(travelProgress*(travelProgress*6-15)+10);
  if(isTravelling){
    for(const key of ['x','y','zoom','light','radius']){
      cameraView[key]=cameraFrom[key]+(cameraTo[key]-cameraFrom[key])*easedTravel;
    }
    cameraView.tint=cameraFrom.tint.map((channel,index)=>
      channel+(cameraTo.tint[index]-channel)*easedTravel
    );
  }
  const travelZoom=walkEnvelope*.1;
  const step=Math.sin(t*15)*walkEnvelope;
  const travelX=isTravelling
    ?passageDirection.x*W*.045*walkEnvelope+step*W*.008
    :0;
  const travelY=isTravelling
    ?passageDirection.y*H*.035*walkEnvelope+Math.abs(step)*H*.012
    :0;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const landingBounce=!isTravelling&&travelProgress>0
    ?Math.sin((performance.now()-travelStartedAt-TRAVEL_DURATION)/320)*Math.exp(-(performance.now()-travelStartedAt-TRAVEL_DURATION)/150)*.025
    :0;
  const sceneZoom=(cameraView.zoom+travelZoom+landingBounce)/1.12;
  const jx=shake>0?(Math.random()-.5)*30*shake:0,jy=shake>0?(Math.random()-.5)*20*shake:0;
  const sceneTravelX=isTravelling?passageDirection.x*W*.035*easedTravel:0;
  const sceneTravelY=isTravelling?passageDirection.y*H*.035*easedTravel:0;
  const transitionZoom=sceneZoom*(1+walkEnvelope*.025);
  if(isTravelling){
    drawSceneLayer(transitionFrom,W,H,1-easedTravel,
      sx+jx+sceneTravelX,sy+jy+sceneTravelY,transitionZoom);
    drawSceneLayer(transitionToScene,W,H,easedTravel,
      sx+jx+sceneTravelX,sy+jy+sceneTravelY,transitionZoom);
  }else{
    drawSceneLayer(currentSector,W,H,1,sx+jx,sy+jy,sceneZoom);
  }
  const tint=cameraView.tint;
  ctx.fillStyle=`rgba(${tint[0]},${tint[1]},${tint[2]},${tint[3]})`;
  ctx.fillRect(0,0,W,H);
  if(shake>0)shake=Math.max(0,shake-.04);
  drawPassageTransition(W,H);
  // Poussière en parallaxe (plus proche = plus de déplacement)
  for(let i=0;i<60;i++){
    const z=.3+(i%5)*.25;
    const x=((i*173.3+t*8*z+mx*-80*z+travelX*(.5+z))%W+W)%W;
    const y=((i*97.7+t*5*z+my*-50*z+travelY*(.5+z))%H+H)%H;
    ctx.fillStyle=`rgba(220,230,200,${.08*z})`;ctx.fillRect(x,y,1+z*1.5,1+z*1.5);
  }
  if(isTravelling){
    drawSectorEffects(transitionFrom,W,H,1-easedTravel,
      sx+jx+sceneTravelX,sy+jy+sceneTravelY,transitionZoom);
    drawSectorEffects(transitionToScene,W,H,easedTravel,
      sx+jx+sceneTravelX,sy+jy+sceneTravelY,transitionZoom);
  }else{
    drawSectorEffects(currentSector,W,H,1,sx+jx,sy+jy,sceneZoom);
  }
  drawDoorAnimation(W,H);
  // Scanlines et cadre
  ctx.fillStyle='rgba(0,255,65,.04)';for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,1);
  ctx.strokeStyle='rgba(0,255,65,.15)';ctx.lineWidth=2;ctx.strokeRect(20,20,W-40,H-40);
  requestAnimationFrame(drawScene);
}
