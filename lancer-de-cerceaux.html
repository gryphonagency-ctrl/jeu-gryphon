<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gryphon Agency — Lancer de Cerceaux — TikTok Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Orbitron:wght@700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; overflow: hidden; background: #1a0033; font-family: Poppins, system-ui, sans-serif; color: #f5f0ff; user-select: none; }
        body { display: flex; }
        #stage { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 1.5vh;
            background: radial-gradient(ellipse at 50% 30%, #ff3d8f 0%, #8a1a8f 45%, #2a0650 100%); }
        #scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
        .tent { position: absolute; z-index: 0; inset: 0 0 auto 0; height: 14vh; background: repeating-linear-gradient(90deg, #ffd23f 0 4vw, #e8312f 4vw 8vw); clip-path: polygon(0 0, 100% 0, 100% 70%, 97% 100%, 94% 70%, 91% 100%, 88% 70%, 85% 100%, 82% 70%, 79% 100%, 76% 70%, 73% 100%, 70% 70%, 67% 100%, 64% 70%, 61% 100%, 58% 70%, 55% 100%, 52% 70%, 49% 100%, 46% 70%, 43% 100%, 40% 70%, 37% 100%, 34% 70%, 31% 100%, 28% 70%, 25% 100%, 22% 70%, 19% 100%, 16% 70%, 13% 100%, 10% 70%, 7% 100%, 4% 70%, 1% 100%, 0 70%); filter: drop-shadow(0 6px 8px rgba(0,0,0,.5)); }
        .beam { position: absolute; z-index: 0; top: 0; width: 22vw; height: 100%; background: linear-gradient(180deg, rgba(255,255,200,.3), transparent 80%); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); mix-blend-mode: screen; animation: beam 7s ease-in-out infinite alternate; transform-origin: 50% 0; }
        .beam.b1 { left: 4vw; } .beam.b2 { right: 4vw; animation-delay: -3s; animation-direction: alternate-reverse; }
        @keyframes beam { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
        .bulbs { position: absolute; z-index: 0; top: 12.5vh; left: 0; right: 0; height: 12px; background: radial-gradient(circle, #fff7b0 0 3px, transparent 4px) 0 0 / 28px 12px repeat-x; animation: blink 1s steps(2) infinite; }
        @keyframes blink { 50% { filter: hue-rotate(160deg) brightness(.6); } }
        .title { position: relative; z-index: 2; margin: 9vh 0 0; font: 400 clamp(22px, 4vw, 52px) Rye, serif; color: #ffe27a; text-shadow: 0 3px 0 #a1141b, 0 0 18px rgba(255,200,60,.7); text-align: center; }
        #scoreboard { position: relative; z-index: 2; padding: 6px 18px; border: 2px solid #ffd36b; border-radius: 999px; background: rgba(20,0,45,.75); font: 800 clamp(13px, 1.6vw, 22px) Poppins, sans-serif; text-shadow: 2px 2px #000; text-align: center; }
        #scoreboard b { color: #ffd36b; }
        .clowns { position: absolute; left: 0; right: 0; bottom: 1vh; height: 12vh; pointer-events: none; z-index: 3; }
        .clown { position: absolute; bottom: 0; font-size: clamp(36px, 8vh, 80px); animation: walk 18s linear infinite, hop .6s ease-in-out infinite alternate; }
        .clown:nth-child(2) { animation-duration: 25s, .5s; animation-delay: -9s, 0s; }
        @keyframes walk { from { left: -10vw; } to { left: 110vw; } }
        @keyframes hop { to { margin-bottom: 14px; rotate: 8deg; } }
        .float { position: absolute; z-index: 6; font: 900 clamp(22px, 3vw, 44px) Orbitron, sans-serif; color: #ffe27a; text-shadow: 0 0 14px #ff9d00, 0 3px 0 #000; pointer-events: none; animation: rise 1.6s ease-out forwards; transform: translate(-50%, 0); }
        @keyframes rise { to { transform: translate(-50%, -90px) scale(1.3); opacity: 0; } }
        #board { position: absolute; z-index: 4; left: 10px; top: 20vh; width: 190px; padding: 8px 10px; border: 1px solid rgba(255,255,255,.25); border-radius: 12px; background: rgba(15,0,40,.7); font-size: 12px; }
        #board h4 { margin: 0 0 4px; color: #ffd36b; font: 900 11px Orbitron, sans-serif; }
        #board ol { margin: 0; padding-left: 20px; } #board li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .toast { position: fixed; z-index: 9; left: 16px; bottom: 16px; max-width: 70vw; padding: 8px 14px; border: 1px solid rgba(255,200,80,.6); border-radius: 12px; background: rgba(40,12,85,.88); font-size: 14px; opacity: 0; transform: translateY(14px); transition: .25s; pointer-events: none; }
        .toast.show { opacity: 1; transform: none; }
        .panel { flex: 0 0 300px; width: 300px; height: 100%; display: flex; flex-direction: column; border-left: 1px solid rgba(255,255,255,.2); background: rgba(15,6,38,.97); z-index: 5; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 11px; border-bottom: 1px solid rgba(255,255,255,.14); font: 900 11px Orbitron, sans-serif; letter-spacing: .06em; }
        .eye { width: 32px; height: 28px; border: 1px solid rgba(0,243,255,.5); border-radius: 8px; background: rgba(0,70,92,.4); color: #9dfaff; font-size: 16px; cursor: pointer; }
        .panel-body { overflow-y: auto; padding: 11px; display: grid; gap: 10px; align-content: start; }
        .panel.hidden-panel { flex-basis: 48px; width: 48px; }
        .panel.hidden-panel .panel-head { padding: 4px; border: 0; }
        .panel.hidden-panel .panel-title, .panel.hidden-panel .panel-body { display: none; }
        .box { display: grid; gap: 6px; padding: 9px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; background: rgba(255,255,255,.04); }
        .box h3 { margin: 0; color: #ffd36b; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
        .row { display: flex; gap: 6px; } .row > * { flex: 1; min-width: 0; }
        label { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11px; color: #cfc6ee; }
        label.check { justify-content: flex-start; cursor: pointer; } label.check input { width: auto; }
        input[type=text], input[type=number], input[type=url] { width: 100%; padding: 6px 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; background: rgba(0,0,0,.35); color: #fff; font: inherit; font-size: 12px; user-select: text; }
        input[type=range] { width: 100%; accent-color: #ff4fa3; }
        button.btn { min-height: 34px; padding: 6px 8px; border: 1px solid rgba(255,255,255,.25); border-radius: 9px; background: linear-gradient(135deg, #d6226f, #7b1fd1); color: #fff; font: 700 12px Poppins, sans-serif; cursor: pointer; }
        button.btn.alt { background: rgba(0,70,92,.5); border-color: rgba(0,243,255,.4); color: #aafaff; }
        button.btn.danger { background: #5a1b2b; border-color: #ff8d87; }
        .status { margin: 0; font-size: 11px; color: #b7ffcf; min-height: 15px; }
        .private-board { margin: 0; padding: 6px 8px 6px 26px; border-radius: 8px; background: rgba(0,0,0,.35); font-size: 12px; color: #ffe9a0; }
        .private-board[hidden] { display: none; }
        .qwin { container-type: inline-size; display: flex; flex-direction: column; border: 1px solid rgba(255,211,107,.45); border-radius: 12px; background: rgba(15,6,38,.96); overflow: hidden; }
        .qwin.docked { height: 220px; resize: vertical; min-height: 120px; }
        .qwin.floating { position: fixed; z-index: 30; resize: both; min-width: 200px; min-height: 140px; max-width: 95vw; max-height: 95vh; box-shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 18px rgba(255,211,107,.25); }
        .qhead { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: rgba(255,211,107,.12); font: 900 11px Orbitron, sans-serif; color: #ffd36b; letter-spacing: .06em; }
        .qwin.floating .qhead { cursor: move; touch-action: none; }
        .qhead span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .qhead button { border: 1px solid rgba(255,255,255,.25); border-radius: 7px; background: rgba(0,70,92,.5); color: #aafaff; font-size: 12px; padding: 3px 8px; cursor: pointer; }
        .qlist { flex: 1; margin: 0; padding: 6px 8px; list-style: none; overflow-y: auto; font-size: clamp(11px, 4.2cqw, 40px); }
        .qlist li { display: flex; align-items: center; gap: .5em; padding: .3em .5em; margin-bottom: .25em; border-radius: .6em; background: rgba(255,255,255,.06); }
        .qlist li.now { background: rgba(255,79,163,.28); border: 1px solid #ff4fa3; }
        .qlist .rank { color: #ffd36b; font-weight: 900; min-width: 1.6em; }
        .qlist .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
        .qlist .cnt { color: #b7ffcf; font-weight: 900; }
        .qempty { color: #cfc6ee; text-align: center; padding: 1em; }
    </style>
</head>
<body>
    <main id="stage" aria-label="Lancer de cerceaux Gryphon Agency">
        <div class="tent"></div><div class="beam b1"></div><div class="beam b2"></div><div class="bulbs"></div>
        <canvas id="scene"></canvas>
        <h1 class="title">Lancer de Cerceaux</h1>
        <div id="scoreboard" role="status">En attente d'un joueur…</div>
        <aside id="board" aria-label="Classement"><h4>🏆 CLASSEMENT</h4><ol id="board-list"></ol></aside>
        <div class="clowns" aria-hidden="true"><span class="clown">🤡</span><span class="clown">🎪</span></div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <aside id="panel" class="panel" aria-label="Panneau de contrôle du streamer">
        <header class="panel-head">
            <span class="panel-title">PANNEAU DE CONTRÔLE</span>
            <button id="eye" class="eye" type="button" aria-expanded="true" aria-label="Masquer le panneau">👁</button>
        </header>
        <div id="panel-body" class="panel-body">
            <section class="box">
                <h3>Vitesse du jeu</h3>
                <label for="speed">Lancers de cerceaux <output id="speed-out">1×</output></label>
                <input id="speed" type="range" min="0.5" max="4" step="0.25" value="1">
                <button id="speed-reset" class="btn alt" type="button">↺ Vitesse normale</button>
            </section>
            <div id="qwin" class="qwin docked" aria-label="File d'attente des joueurs">
                <div id="qhead" class="qhead"><span id="qtitle">⏳ FILE D'ATTENTE (0)</span><button id="qdock" type="button" aria-label="Détacher la file d'attente">⧉ Détacher</button></div>
                <ul id="qlist" class="qlist" aria-live="polite"></ul>
            </div>
            <section class="box">
                <h3>Connexion TikTok</h3>
                <input id="username" type="text" maxlength="32" placeholder="Pseudo TikTok" autocomplete="off">
                <input id="ws-url" type="url" value="wss://jeu6boite.onrender.com" aria-label="Adresse WebSocket">
                <button id="connect" class="btn" type="button">Connecter le live</button>
                <p id="live-status" class="status" role="status"></p>
            </section>
            <section class="box">
                <h3>Réglages</h3>
                <label for="hit">Chance de réussir <output id="hit-out">45 %</output></label>
                <input id="hit" type="range" min="0" max="100" step="1" value="45">
                <div class="row">
                    <label>⭐ par quille<input id="ring-stars" type="number" min="1" max="30" value="1"></label>
                    <label>⭐ bonus rack<input id="bonus" type="number" min="0" max="100" value="5"></label>
                </div>
                <label>Cerceaux max par tour<input id="batch" type="number" min="1" max="500" value="15"></label>
            </section>
            <section class="box">
                <h3>Simulateur (sans étoiles réelles)</h3>
                <input id="sim-name" type="text" maxlength="32" value="Alex_TikTok 🚀" aria-label="Pseudo simulé">
                <div class="row">
                    <button id="sim-gift" class="btn" type="button">🎁 1 pièce</button>
                    <button id="sim-burst" class="btn" type="button">💥 ×10</button>
                </div>
                <button id="sim-big" class="btn" type="button">💎 100 pièces = 100 cerceaux</button>
                <button id="sim-share" class="btn" type="button">✈️ Partage du live</button>
            </section>
            <section class="box">
                <h3>Partie</h3>
                <label class="check"><input id="hide-board" type="checkbox"> Masquer le classement à l'écran</label>
                <ol id="private-board" class="private-board" hidden></ol>
                <button id="reset-rack" class="btn alt" type="button">🎳 Remettre les quilles</button>
                <button id="reset-board" class="btn danger" type="button">Remettre à zéro le classement</button>
            </section>
        </div>
    </aside>

    <script>
        'use strict';
        const $ = id => document.getElementById(id);
        const SAVE_KEY = 'lancer-de-cerceaux-save';
        const settings = { hit: 45, ringStars: 1, bonus: 5, batch: 15, speed: 1, hideBoard: false };
        const viewers = new Map();
        const queue = [];
        const COLORS = ['#ff3d6e', '#ffd23f', '#2de2e6', '#7cff6b', '#ff8a00', '#b388ff'];
        const ROWS = [4, 3, 2, 1];
        const THROW_GAP = 0.8, FLIGHT = 0.85;
        let run = null, pins = [], rings = [], clock = 0, nextThrow = 0, rackResetAt = 0;

        const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
        let toastTimer;
        function say(text) { const t = $('toast'); t.textContent = text; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

        function getViewer(raw) {
            const username = String(raw || 'Spectateur').replace(/^@/, '').trim().slice(0, 32) || 'Spectateur';
            const key = username.toLowerCase();
            if (!viewers.has(key)) viewers.set(key, { username, stars: 0 });
            return viewers.get(key);
        }

        /* ---------- sons simples ---------- */
        let actx = null;
        function beep(freq, to, dur, type, gain) {
            try {
                actx = actx || new (window.AudioContext || window.webkitAudioContext)();
                if (actx.state === 'suspended') actx.resume();
                const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
                o.type = type || 'sine';
                o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(to, t + dur);
                g.gain.setValueAtTime(gain || 0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
            } catch (e) { }
        }
        const sndThrow = () => beep(500, 220, 0.25, 'triangle', 0.1);
        const sndHit = () => { beep(1568, 1568, 0.25, 'triangle', 0.18); setTimeout(() => beep(2093, 2093, 0.3, 'triangle', 0.12), 90); };
        const sndMiss = () => beep(180, 90, 0.2, 'square', 0.07);

        /* ---------- quilles ---------- */
        function buildPins() {
            pins = [];
            ROWS.forEach((n, r) => { for (let i = 0; i < n; i++) pins.push({ row: r, nx: (i - (n - 1) / 2) * 0.13, filled: false, pending: false, color: '#fff' }); });
        }

        const canvas = $('scene'), ctx = canvas.getContext('2d');
        function resize() { const s = $('stage'); canvas.width = s.clientWidth; canvas.height = s.clientHeight; }
        addEventListener('resize', resize);

        function pinGeom(p) {
            const w = canvas.width, h = canvas.height, k = 0.78 + p.row * 0.13;
            const u = Math.min(w, h * 1.3);
            return { x: w / 2 + p.nx * u * (0.9 + p.row * 0.12) * 1.25, y: h * (0.5 + p.row * 0.085), s: u * 0.03 * k };
        }
        function throwOrigin() { return { x: canvas.width / 2, y: canvas.height * 0.97 }; }

        function drawLane() {
            const w = canvas.width, h = canvas.height, top = h * 0.36;
            const g = ctx.createLinearGradient(0, top, 0, h);
            g.addColorStop(0, '#9b5a2a'); g.addColorStop(1, '#d99a55');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.moveTo(w * 0.26, top); ctx.lineTo(w * 0.74, top); ctx.lineTo(w * 1.02, h); ctx.lineTo(-w * 0.02, h); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = 'rgba(70,30,0,.35)'; ctx.lineWidth = 2;
            for (let i = 1; i < 8; i++) {
                const t = i / 8;
                ctx.beginPath(); ctx.moveTo(w * (0.26 + 0.48 * t), top); ctx.lineTo(w * (-0.02 + 1.04 * t), h); ctx.stroke();
            }
            ctx.strokeStyle = '#ffd36b'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(w * 0.26, top); ctx.lineTo(-w * 0.02, h); ctx.moveTo(w * 0.74, top); ctx.lineTo(w * 1.02, h); ctx.stroke();
        }

        function drawPin(p) {
            const { x, y, s } = pinGeom(p);
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,.28)';
            ctx.beginPath(); ctx.ellipse(x, y + s * 1.05, s * 0.8, s * 0.22, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.strokeStyle = '#3a2a4a'; ctx.lineWidth = Math.max(1, s * 0.07);
            ctx.beginPath(); ctx.ellipse(x, y + s * 0.15, s * 0.58, s * 0.95, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillRect(x - s * 0.2, y - s * 1.15, s * 0.4, s * 0.7);
            ctx.beginPath(); ctx.arc(x, y - s * 1.2, s * 0.36, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#e8312f';
            ctx.fillRect(x - s * 0.21, y - s * 0.95, s * 0.42, s * 0.12);
            ctx.fillRect(x - s * 0.24, y - s * 0.72, s * 0.48, s * 0.1);
            if (p.filled) {
                ctx.strokeStyle = p.color; ctx.lineWidth = s * 0.28;
                ctx.shadowColor = p.color; ctx.shadowBlur = s * 0.6;
                ctx.beginPath(); ctx.ellipse(x, y - s * 0.62, s * 0.78, s * 0.3, 0, 0, Math.PI * 2); ctx.stroke();
            }
            ctx.restore();
        }

        function drawRing(r) {
            ctx.save();
            ctx.strokeStyle = r.color; ctx.lineWidth = r.size * 0.2; ctx.globalAlpha = r.alpha;
            ctx.shadowColor = r.color; ctx.shadowBlur = r.size * 0.4;
            ctx.beginPath(); ctx.ellipse(r.x, r.y, r.size, r.size * 0.38, r.rot, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
        }

        /* ---------- logique de lancer ---------- */
        function award(viewer, amount, sim) {
            viewer.stars += amount;
            if (!sim && window.ArcadeStars) {
                window.ArcadeStars.award({ username: viewer.username, amount })
                    .catch(error => { console.error('Étoiles non enregistrées :', error); say('Étoiles non enregistrées : ' + error.message); });
            }
            saveGame(); refreshBoards();
        }

        function throwRing() {
            const free = pins.filter(p => !p.filled && !p.pending);
            const hit = free.length > 0 && Math.random() * 100 < settings.hit;
            const target = hit ? free[rand(0, free.length - 1)] : pins[rand(0, pins.length - 1)];
            if (hit) target.pending = true;
            const color = COLORS[rand(0, COLORS.length - 1)], o = throwOrigin(), g = pinGeom(target);
            const miss = hit ? 0 : (Math.random() < 0.5 ? -1 : 1) * g.s * (1.7 + Math.random() * 1.2);
            rings.push({ t: 0, hit, pin: target, color, ox: o.x, oy: o.y, tx: g.x + miss, ty: hit ? g.y - g.s * 0.62 : g.y + g.s * 0.9, x: o.x, y: o.y, size: 40, rot: 0, alpha: 1, phase: 'fly', run });
            run.left--; run.thrown++;
            sndThrow();
        }

        function landed(r) {
            const owner = r.run.entry;
            if (r.hit) {
                r.pin.pending = false; r.pin.filled = true; r.pin.color = r.color;
                r.run.hits++;
                award(owner.viewer, settings.ringStars, owner.sim);
                const g = pinGeom(r.pin);
                floatText(`+${settings.ringStars} ⭐`, g.x, g.y - g.s * 2);
                sndHit();
                r.phase = 'done';
                if (pins.every(p => p.filled)) rackComplete(r.run);
            } else {
                r.phase = 'bounce'; r.bt = 0; r.bx = r.tx; r.by = r.ty; r.vx = (r.tx - r.ox) * 0.4;
                sndMiss();
            }
        }

        function rackComplete(rn) {
            const owner = rn.entry;
            award(owner.viewer, settings.bonus, owner.sim);
            say(`🎳 @${owner.viewer.username} remplit toutes les quilles : +${settings.bonus} ⭐ bonus !`);
            const g = pinGeom(pins[pins.length - 1]);
            floatText(`🎳 +${settings.bonus} ⭐`, canvas.width / 2, g.y - g.s * 4);
            if (window.ArcadeEffects) ArcadeEffects.fireworks(canvas.width / 2, canvas.height * 0.45, true);
            rackResetAt = clock + 2.4;
        }

        function stepRing(r, dt) {
            if (r.phase === 'fly') {
                r.t += dt / FLIGHT;
                const t = Math.min(1, r.t), arc = canvas.height * 0.3;
                r.x = r.ox + (r.tx - r.ox) * t;
                r.y = r.oy + (r.ty - r.oy) * t - 4 * arc * t * (1 - t);
                r.size = 40 + (Math.max(10, pinGeom(r.pin).s * 0.85) - 40) * t;
                r.rot = Math.sin(t * 9) * 0.25;
                if (t >= 1) landed(r);
            } else if (r.phase === 'bounce') {
                r.bt += dt;
                r.x = r.bx + r.vx * r.bt;
                r.y = r.by - Math.abs(Math.sin(r.bt * 8)) * 30 * Math.max(0, 1 - r.bt);
                r.alpha = Math.max(0, 1 - r.bt / 0.9);
                if (r.bt > 0.9) r.phase = 'done';
            }
        }

        function floatText(text, x, y) {
            const el = document.createElement('div');
            el.className = 'float'; el.textContent = text;
            el.style.left = x + 'px'; el.style.top = y + 'px';
            $('stage').appendChild(el);
            setTimeout(() => el.remove(), 1700);
        }

        /* ---------- file d'attente : 1 pièce = 1 cerceau ---------- */
        function enqueue(viewer, coins, sim) {
            coins = Math.min(500, Math.max(1, Math.floor(coins)));
            let entry = queue.find(q => q.viewer === viewer && q.sim === sim) || (run && run.entry.viewer === viewer && run.entry.sim === sim ? run.entry : null);
            if (!entry) {
                if (queue.length >= 80) return;
                entry = { viewer, sim, credits: 0 };
                queue.push(entry);
            }
            entry.credits += coins;
            nextRun();
        }

        function nextRun() {
            if (run || !queue.length) return;
            const entry = queue.shift();
            const n = Math.min(entry.credits, Math.max(1, settings.batch));
            entry.credits -= n;
            run = { entry, left: n, total: n, thrown: 0, hits: 0 };
            nextThrow = clock + 0.4;
            say(`🎯 @${entry.viewer.username} lance ${n} cerceau${n > 1 ? 'x' : ''} !`);
            updateScoreboard();
        }

        function endRun() {
            const r = run;
            run = null;
            if (r && r.entry.credits > 0) queue.push(r.entry);
            updateScoreboard();
            nextRun();
        }

        function updateScoreboard() {
            const sb = $('scoreboard'), filled = pins.filter(p => p.filled).length;
            if (run) {
                sb.innerHTML = `Joueur : <b></b> | Cerceaux : ${run.left} | Quilles : ${filled}/${pins.length}`;
                sb.querySelector('b').textContent = '@' + run.entry.viewer.username;
            } else sb.textContent = `En attente d'un joueur | Quilles : ${filled}/${pins.length}`;
        }

        let last = performance.now();
        function frame(now) {
            const dt = Math.min(0.05, (now - last) / 1000) * settings.speed;
            last = now;
            clock += dt;
            if (rackResetAt && clock >= rackResetAt) { rackResetAt = 0; buildPins(); }
            const canThrow = pins.some(p => !p.filled && !p.pending) || !pins.some(p => p.pending);
            if (run && !rackResetAt && run.left > 0 && canThrow && clock >= nextThrow) { throwRing(); nextThrow = clock + THROW_GAP; }
            rings.forEach(r => stepRing(r, dt));
            rings = rings.filter(r => r.phase !== 'done');
            if (run && run.left <= 0 && !rings.some(r => r.run === run) && !rackResetAt) endRun();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawLane();
            [...pins].sort((a, b) => a.row - b.row).forEach(drawPin);
            rings.forEach(drawRing);
            updateScoreboard();
            requestAnimationFrame(frame);
        }

        function topViewers(n) { return [...viewers.values()].filter(v => v.stars > 0).sort((a, b) => b.stars - a.stars).slice(0, n); }
        function fillList(ol, list) {
            ol.textContent = '';
            for (const v of list) { const li = document.createElement('li'); li.textContent = `@${v.username} — ${v.stars} ⭐`; ol.appendChild(li); }
        }
        function refreshBoards() {
            $('board').hidden = settings.hideBoard;
            $('private-board').hidden = !settings.hideBoard;
            if (settings.hideBoard) fillList($('private-board'), topViewers(10));
            else fillList($('board-list'), topViewers(5));
        }

        /* ---------- TikTok ---------- */
        let socket = null, reconnectTimer = null;
        const setStatus = m => { $('live-status').textContent = m; };
        /* Les cadeaux d'une pièce valent 1 cerceau ; un gros cadeau en vaut autant que de pièces */
        function coinsOf(g) {
            if (Number.isFinite(Number(g.coinCount)) && Number(g.coinCount) >= 1) return Math.floor(Number(g.coinCount));
            const d = Math.max(1, Math.floor(Number(g.diamondCount ?? g.diamonds ?? g.coinValue) || 1));
            const r = Math.max(1, Math.floor(Number(g.repeatCount) || 1));
            return d * r;
        }
        function handleMessage(data) {
            if (data.type === 'STATUS') setStatus(data.message || 'Statut TikTok reçu.');
            else if (data.type === 'gift' || data.type === 'tiktok-gift') {
                const g = data.gift ?? data;
                enqueue(getViewer(g.uniqueId || g.username || g.nickname), coinsOf(g), false);
            }
        }
        function connect() {
            const name = $('username').value.trim().replace(/^@/, ''), url = $('ws-url').value.trim();
            if (!name || !url) { setStatus('Pseudo TikTok et adresse requis.'); return; }
            clearTimeout(reconnectTimer);
            if (socket) { socket.onclose = null; socket.close(); }
            try { socket = new WebSocket(url); } catch (e) { setStatus('Adresse invalide.'); return; }
            const active = socket;
            setStatus(`Connexion au live de @${name}…`);
            active.addEventListener('open', () => active.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username: name })));
            active.addEventListener('message', ev => { try { handleMessage(JSON.parse(ev.data)); } catch (e) { console.warn('Message invalide', e); } });
            active.addEventListener('error', () => setStatus('Connexion impossible.'));
            active.addEventListener('close', () => { if (socket !== active) return; setStatus('Reconnexion…'); reconnectTimer = setTimeout(connect, 3000); });
        }
        /* RUN : le serveur a déjà débité le portefeuille global, une étoile = un cerceau */
        window.addEventListener('arcade:wallet-run', e => {
            const p = e.detail && e.detail.player, spent = Math.floor(Number(e.detail && e.detail.spent) || 0);
            const name = p && (p.username || p.uniqueId || p.nickname);
            if (name && spent > 0) enqueue(getViewer(name), spent, false);
        });

        /* ---------- Sauvegarde ---------- */
        function saveGame() {
            try { localStorage.setItem(SAVE_KEY, JSON.stringify({ settings, username: $('username').value, wsUrl: $('ws-url').value, viewers: [...viewers.values()] })); } catch (e) { }
        }
        function loadGame() {
            try {
                const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
                if (!s) return;
                Object.assign(settings, s.settings || {});
                if (s.username) $('username').value = s.username;
                if (s.wsUrl) $('ws-url').value = s.wsUrl;
                for (const v of s.viewers || []) getViewer(v.username).stars = Number(v.stars) || 0;
            } catch (e) { }
        }

        /* ---------- Interface ---------- */
        function syncControls() {
            $('speed').value = settings.speed; $('speed-out').textContent = settings.speed + '×';
            $('hit').value = settings.hit; $('hit-out').textContent = settings.hit + ' %';
            $('ring-stars').value = settings.ringStars; $('bonus').value = settings.bonus; $('batch').value = settings.batch;
            $('hide-board').checked = settings.hideBoard;
        }
        function bindUi() {
            $('connect').addEventListener('click', () => { connect(); saveGame(); });
            const simName = () => $('sim-name').value.trim() || 'Spectateur démo';
            const sim = n => enqueue(getViewer(simName()), n, true);
            $('sim-gift').addEventListener('click', () => sim(1));
            $('sim-burst').addEventListener('click', () => sim(10));
            $('sim-big').addEventListener('click', () => {
                sim(100);
                if (window.ArcadeEffects) ArcadeEffects.simulateBigGift(simName(), 100);
            });
            $('sim-share').addEventListener('click', () => { if (window.ArcadeEffects) ArcadeEffects.simulateShare(); });
            $('speed').addEventListener('input', e => { settings.speed = Number(e.target.value) || 1; syncControls(); saveGame(); });
            $('speed-reset').addEventListener('click', () => { settings.speed = 1; syncControls(); saveGame(); });
            $('hit').addEventListener('input', e => { settings.hit = Math.min(100, Math.max(0, Number(e.target.value) || 0)); syncControls(); saveGame(); });
            const nums = () => {
                settings.ringStars = Math.min(30, Math.max(1, Math.floor(Number($('ring-stars').value) || 1)));
                const b = Math.floor(Number($('bonus').value));
                settings.bonus = Number.isFinite(b) ? Math.min(100, Math.max(0, b)) : 5;
                settings.batch = Math.min(500, Math.max(1, Math.floor(Number($('batch').value) || 15)));
                saveGame();
            };
            ['ring-stars', 'bonus', 'batch'].forEach(id => $(id).addEventListener('input', nums));
            $('reset-rack').addEventListener('click', () => { if (rings.some(r => r.hit)) say('Des cerceaux sont en vol.'); else { buildPins(); rackResetAt = 0; } });
            $('hide-board').addEventListener('change', e => { settings.hideBoard = e.target.checked; refreshBoards(); saveGame(); });
            $('reset-board').addEventListener('click', () => { if (confirm('Remettre le classement à zéro ?')) { viewers.forEach(v => { v.stars = 0; }); refreshBoards(); saveGame(); } });
            $('eye').addEventListener('click', () => {
                const hidden = $('panel').classList.toggle('hidden-panel');
                $('eye').setAttribute('aria-expanded', String(!hidden));
                $('eye').setAttribute('aria-label', hidden ? 'Afficher le panneau' : 'Masquer le panneau');
                setTimeout(resize, 50);
            });
            document.addEventListener('keydown', e => { if (e.code === 'Space' && !/INPUT|BUTTON/.test(e.target.tagName)) { e.preventDefault(); sim(1); } });
        }

        function bindQueueWindow() {
            const win = $('qwin'), head = $('qhead'), list = $('qlist'), btn = $('qdock'), home = $('panel-body');
            const KEY = 'lancer-de-cerceaux-queue-win';
            const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));
            let geo = { floating: false, x: 40, y: 80, w: 320, h: 380 };
            try { geo = Object.assign(geo, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { }
            const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(geo)); } catch (e) { } };
            function applyGeo() {
                geo.w = clamp(geo.w, 200, innerWidth - 10); geo.h = clamp(geo.h, 140, innerHeight - 10);
                geo.x = clamp(geo.x, 0, innerWidth - geo.w); geo.y = clamp(geo.y, 0, innerHeight - 40);
                Object.assign(win.style, { left: geo.x + 'px', top: geo.y + 'px', width: geo.w + 'px', height: geo.h + 'px' });
            }
            function setFloating(on) {
                geo.floating = on;
                win.classList.toggle('floating', on); win.classList.toggle('docked', !on);
                if (on) { document.body.appendChild(win); applyGeo(); btn.textContent = '⇲ Rattacher'; }
                else { home.children[0] ? home.children[0].after(win) : home.prepend(win); Object.assign(win.style, { left: '', top: '', width: '', height: '' }); btn.textContent = '⧉ Détacher'; }
                persist();
            }
            btn.addEventListener('click', () => setFloating(!geo.floating));
            head.addEventListener('pointerdown', e => {
                if (!geo.floating || e.target === btn) return;
                const dx = e.clientX - geo.x, dy = e.clientY - geo.y;
                head.setPointerCapture(e.pointerId);
                const move = ev => { geo.x = ev.clientX - dx; geo.y = ev.clientY - dy; applyGeo(); };
                const up = () => { head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up); persist(); };
                head.addEventListener('pointermove', move); head.addEventListener('pointerup', up);
            });
            new ResizeObserver(() => {
                if (!geo.floating) return;
                const r = win.getBoundingClientRect();
                if (Math.abs(r.width - geo.w) > 1 || Math.abs(r.height - geo.h) > 1) { geo.w = r.width; geo.h = r.height; persist(); }
            }).observe(win);
            addEventListener('resize', () => geo.floating && applyGeo());

            let lastSig = null;
            function refresh() {
                const rows = [];
                if (run) rows.push({ now: true, viewer: run.entry.viewer, tag: `${run.left + run.entry.credits} 🎯`, n: 1 });
                for (const q of queue) rows.push({ viewer: q.viewer, tag: '×' + q.credits, n: q.credits });
                const sig = rows.map(r => (r.now ? '*' : '') + r.viewer.username + r.tag).join('|');
                if (sig === lastSig) return;
                lastSig = sig;
                $('qtitle').textContent = `⏳ FILE D'ATTENTE (${queue.length})`;
                list.textContent = '';
                if (!rows.length) { const li = document.createElement('li'); li.className = 'qempty'; li.textContent = 'Aucun joueur en attente'; list.appendChild(li); return; }
                let rank = 0;
                for (const r of rows) {
                    const li = document.createElement('li');
                    if (r.now) li.className = 'now';
                    const a = document.createElement('span'); a.className = 'rank'; a.textContent = r.now ? '▶' : '#' + (++rank);
                    const b = document.createElement('span'); b.className = 'name'; b.textContent = '@' + r.viewer.username;
                    li.append(a, b);
                    if (r.now || r.n > 1) { const c = document.createElement('span'); c.className = 'cnt'; c.textContent = r.tag; li.appendChild(c); }
                    list.appendChild(li);
                }
            }
            setInterval(refresh, 200); refresh();
            if (geo.floating) setFloating(true);
        }

        loadGame();
        syncControls();
        resize();
        buildPins();
        bindUi();
        bindQueueWindow();
        refreshBoards();
        requestAnimationFrame(frame);
    </script>
</body>
</html>
