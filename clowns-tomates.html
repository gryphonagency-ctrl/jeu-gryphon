<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les Clowns et les Tomates — Gryphon Agency</title>
<script src="/arcade-effects.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,0) 30%),url(/images-vitrine/decheterie.jpg) center bottom/cover no-repeat #2a2f33;color:#fff;font-family:"Trebuchet MS",Arial,sans-serif;overflow:hidden}

  #duo{position:relative;display:flex;width:min(100vw,calc((100vh - 10vmin)*.7464));aspect-ratio:768/1029}
  .frame{position:relative;width:50%;height:100%;z-index:1}
  #frameR{z-index:2}
  .clown{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 100%;user-select:none;-webkit-user-drag:none;will-change:transform,filter}
  #sep{position:absolute;left:50%;top:0;height:100%;width:.7%;min-width:3px;transform:translateX(-50%);z-index:5;pointer-events:none;background:linear-gradient(90deg,#ffd978,#ff2e93);box-shadow:0 0 8px #0009}
  .paint{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  .paint .pp{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
  .paint .pp.on{opacity:1;animation:ppop .5s cubic-bezier(.3,1.6,.5,1)}
  @keyframes ppop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .bubble{position:absolute;z-index:9;top:20%;width:34%;padding:.6em .8em;border-radius:1.1em;background:#fff;color:#222;font:700 clamp(11px,1.3vw,19px)/1.25 system-ui,sans-serif;text-align:center;box-shadow:0 4px 14px #0006;opacity:0;transform:scale(.6);transition:opacity .25s,transform .25s;pointer-events:none}
  .bubble.show{opacity:1;transform:scale(1)}
  .bubble::after{content:"";position:absolute;top:55%;border:.7em solid transparent}
  .bubble.l{right:100%;margin-right:1.2em}.bubble.l::after{left:100%;border-left-color:#fff}
  .bubble.r{left:100%;margin-left:1.2em}.bubble.r::after{right:100%;border-right-color:#fff}
  .face{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;opacity:0;transition:opacity .8s}
  .face.cry{opacity:1;transition:opacity .15s}
  .face .streak{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
  .face.cry .streak{animation:streak .7s ease-out forwards}
  .face .tear{animation:tear 1.1s ease-in infinite}
  .face .wail{transform-box:fill-box;transform-origin:50% 30%;animation:wail .22s ease-in-out infinite alternate}
  @keyframes streak{to{transform:scaleY(1)}}
  @keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(120px);opacity:0}}
  @keyframes wail{from{transform:scaleY(.8)}to{transform:scaleY(1.2)}}
  .fx{position:absolute;pointer-events:none;width:22%;aspect-ratio:1;transform:translate(-50%,-50%)}
  .fx svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 4px #0008)}
  .fx.fall{transition:top .38s cubic-bezier(.5,0,1,.6)}
  .fx.stuck{transition:opacity .6s}
  .splat{position:absolute;pointer-events:none;transform:translate(-50%,-50%) scale(.2);opacity:.9;border-radius:50%;transition:transform .15s ease-out,opacity .6s}
  #who{position:fixed;left:50%;top:1.2vmin;transform:translateX(-50%);font-weight:800;font-size:clamp(13px,2.6vmin,26px);text-shadow:0 2px 8px #000;z-index:5;max-width:90vw;text-align:center}
  #panelBtn{position:fixed;right:10px;top:10px;z-index:30;padding:8px 12px;border:0;border-radius:10px;background:#ff2e93;color:#fff;font-weight:800;cursor:pointer}
  #panel{position:fixed;right:10px;top:54px;z-index:30;width:min(300px,92vw);max-height:calc(100% - 70px);overflow:auto;background:#1c0f33ee;border:1px solid #ff2e9366;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
  #panel.hide{display:none}
  #panel h3{margin:4px 0 0;font-size:14px;color:#ffd978}
  #panel input[type=text]{width:100%;padding:8px;border-radius:8px;border:1px solid #666;background:#0d0719;color:#fff}
  #panel button{padding:8px 10px;border:0;border-radius:8px;background:#ff2e93;color:#fff;font-weight:700;cursor:pointer}
  #panel .row{display:flex;gap:6px;flex-wrap:wrap}
  #panel .row button{flex:1}
  #status{font-size:12px;color:#bbb}

    const s = sides[i], bw = s.frame.clientWidth, bh = s.frame.clientHeight, dir = i === 0 ? 1 : -1, tx = (i * 0.5 + FACE[i].x / 100 * 0.5) * W;
    setTimeout(() => cry(i, 5200), 2100);
    for (let k = 0; k < 46; k++) setTimeout(() => dropJunk(s, i, tx + rnd(-0.09, 0.09) * W, H * 0.12, bw, bh, dir), 2100 + k * 50 + rnd(0, 30));
    setTimeout(() => sludge(i), 2300);
    setTimeout(() => sludge(i), 3300);
  });
}

function throwItem(entry) {
  if (entry.kind === 1000) return throwBags(entry);
  if (entry.kind === 500) return throwTruck(entry);
  if (entry.kind === 100) return throwTrash(entry);
  const kind = entry.kind, item = ITEMS[kind], i = entry.side;
  const dw = duo.clientWidth, dh = duo.clientHeight, size = dw * 0.17;
  const tx = (i * 0.5 + FACE[i].x / 100 * 0.5) * dw + rnd(-0.01, 0.01) * dw, ty = FACE[i].y / 100 * dh + rnd(-0.012, 0.012) * dh;
  const sx = i === 0 ? -0.18 * dw : 1.18 * dw, sy = rnd(0.5, 0.7) * dh;
  const el = document.createElement('div'); el.className = 'fx'; el.innerHTML = item.svg;
  el.style.cssText = 'position:absolute;z-index:6;pointer-events:none;width:' + size + 'px;height:' + size + 'px;left:0;top:0;will-change:transform';
  duo.appendChild(el);
  // le poisson bat de la queue en plein vol
  const tail = el.querySelector('.tail');
  if (tail) { tail.style.transformBox = 'fill-box'; tail.style.transformOrigin = '0% 50%'; tail.animate([{ transform: 'rotate(-30deg)' }, { transform: 'rotate(30deg)' }], { duration: 90, iterations: Infinity, direction: 'alternate' }); }
  const t0 = performance.now(), dur = 460, spin = (i ? -1 : 1) * (kind === 5 ? 300 : kind === 2 ? 540 : 720), arc = rnd(0.22, 0.34) * dh;
  $('who').textContent = '@' + entry.user + ' lance ' + item.name + ' !';
  (function fly(now) {
    const k = Math.min(1, (now - t0) / dur), e = k * k * (3 - 2 * k) * 0.35 + k * 0.65;
    const x = sx + (tx - sx) * e, y = sy + (ty - sy) * e - 4 * arc * k * (1 - k), sc = 0.55 + 0.6 * k;
    const wob = kind === 5 ? Math.sin(k * 30) * 14 : 0, stretch = 1 + 0.25 * Math.sin(Math.PI * k);
    el.style.transform = 'translate(' + (x - size / 2) + 'px,' + (y - size / 2) + 'px) rotate(' + (spin * k + wob) + 'deg) scale(' + sc * stretch + ',' + sc / stretch + ')';
    if (k < 1) return requestAnimationFrame(fly);
    el.remove(); if (kind === 10) { paintFace(i, tx, ty); speak(i); } else impact(entry, tx, ty);
  })(t0);
}

function tick() {
  $('queueInfo').textContent = "File d'attente : " + queue.length;
  if (queue.length) throwItem(queue.shift());
}
function setRate(ms) { delay = ms; clearInterval(timer); timer = setInterval(tick, delay); $('rateOut').textContent = (ms / 1000).toFixed(2).replace('.', ','); }

const choices = new Map(), pendingTrash = new Map();
function parseSide(text) {
  const t = String(text || '').toLowerCase().trim();
  if (/^(1|g|gauche|left)$/.test(t)) return 0;
  if (/^(2|d|droite|right)$/.test(t)) return 1;
  return null;
}
function queueItem(kind, user, side) {
  queue.push({ kind, user, side });
  if (queue.length > 200) queue.shift();
  $('queueInfo').textContent = "File d'attente : " + queue.length;
}
// 100 étoiles : le spectateur choisit sa cible en écrivant 1 / gauche ou 2 / droite dans le chat
function requestTrash(user, forcedSide, kind) {
  kind = kind || 100;
  if (forcedSide === 0 || forcedSide === 1) return queueItem(kind, user, forcedSide);
  const c = choices.get(user.toLowerCase());
  if (c && Date.now() - c.t < 120000) return queueItem(kind, user, c.side);
  const key = user.toLowerCase();
  if (pendingTrash.has(key)) return;
  $('who').textContent = '@' + user + ' : écris 1 (gauche) ou 2 (droite) pour choisir ton clown !';
  const timeout = setTimeout(() => { pendingTrash.delete(key); queueItem(kind, user, Math.random() < .5 ? 0 : 1); }, 15000);
  pendingTrash.set(key, { user, timeout, kind });
}
function onComment(user, text) {
  const side = parseSide(text);
  if (side === null || !user) return;
  const key = String(user).replace(/^@/, '').toLowerCase(), p = pendingTrash.get(key);
  if (p) { clearTimeout(p.timeout); pendingTrash.delete(key); queueItem(p.kind, p.user, side); }
  else choices.set(key, { side, t: Date.now() });
}

function onGift(user, coins, forcedSide) {
  const name = String(user || 'spectateur').replace(/^@/, '');
  if (coins >= 1000) return requestTrash(name, forcedSide, 1000);
  if (coins >= 500) return queueItem(500, name, 0);
  if (coins >= 100) return requestTrash(name, forcedSide);
  if (coins === 10) { queueItem(10, name, next); next = 1 - next; return; }
  if (!ITEMS[coins]) return;
  queueItem(coins, name, next);
  next = 1 - next;
}

function onWalletRun(data) {
  const player = data.player || {};
  const user = String(player.username || player.nickname || player.uniqueId || 'spectateur').replace(/^@/, '');
  let remaining = Math.floor(Number(data.spent));
  if (!Number.isSafeInteger(remaining) || remaining < 1) {
    console.warn('RUN ignoré : montant d’étoiles invalide.');
    return;
  }

  const effects = [];
  for (const kind of [1000, 500, 100, 10, 5, 2, 1]) {
    while (remaining >= kind && effects.length < 200) {
      effects.push(kind);
      remaining -= kind;
    }
  }

  effects.forEach(kind => {
    const side = Math.random() < 0.5 ? 0 : 1;
    queueItem(kind, user, side);
    if (kind < 100) next = 1 - side;
  });

  $('who').textContent = remaining > 0
    ? '@' + user + ' : RUN limité à 200 effets (' + effects.length + ' ajoutés, surplus non représenté).'
    : '@' + user + ' lance ' + effects.length + ' effet' + (effects.length > 1 ? 's' : '') + ' sur les clowns !';
}

let ws = null, retry = null;
function setStatus(t) { $('status').textContent = t; }
function connect() {
  const name = $('user').value.trim().replace(/^@/, '');
  if (!name) { setStatus('Entre ton pseudo TikTok.'); return; }
  clearTimeout(retry); if (ws) { ws.onclose = null; ws.close(); }
  try { ws = new WebSocket(RELAY_URL); } catch (e) { setStatus('Adresse invalide.'); return; }
  setStatus('Connexion à @' + name + '…');
  ws.onopen = () => { ws.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username: name })); setStatus('Connecté à @' + name); };
  ws.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'gift' || d.type === 'tiktok-gift') {
        const g = d.gift || d;
        onGift(g.username || g.nickname || g.uniqueId, Math.floor(Number(g.coinCount) || (Number(g.coinValue ?? g.diamondCount ?? g.diamonds) || 0) * (Number(g.repeatCount) || 1)));
      }
      if (d.type === 'WALLET_RUN') onWalletRun(d);
      if (d.type === 'comment' && d.commentData) {
        const c = d.commentData;
        onComment(c.username || c.uniqueId || c.nickname, c.comment);
      }
    } catch (err) { }
  };
  ws.onerror = () => setStatus('Connexion impossible.');
  ws.onclose = () => { setStatus('Reconnexion…'); retry = setTimeout(connect, 3000); };
  try { localStorage.setItem('clowns-tomates-user', name); } catch (e) { }
}
$('connect').onclick = connect;
$('disconnect').onclick = () => { clearTimeout(retry); if (ws) { ws.onclose = null; ws.close(); ws = null; } setStatus('Déconnecté.'); };
$('rate').oninput = e => setRate(+e.target.value);
$('panelBtn').onclick = () => $('panel').classList.toggle('hide');
$('s1').onclick = () => onGift('Alex', 1);
$('s2').onclick = () => onGift('Alex', 2);
$('s5').onclick = () => onGift('Alex', 5);
$('s10').onclick = () => onGift('Alex', 10);
$('sBig').onclick = () => { ArcadeEffects.simulateBigGift('Alex', 100); onGift('Alex', 100, Math.random() < .5 ? 0 : 1); };
$('sBigL').onclick = () => onGift('Alex', 100, 0);
$('sBigR').onclick = () => onGift('Alex', 100, 1);
$('sTruck').onclick = () => { ArcadeEffects.simulateBigGift('Alex', 500); onGift('Alex', 500); };
$('sBagL').onclick = () => { ArcadeEffects.simulateBigGift('Alex', 1000); onGift('Alex', 1000, 0); };
$('sBagR').onclick = () => { ArcadeEffects.simulateBigGift('Alex', 1000); onGift('Alex', 1000, 1); };
$('sShare').onclick = () => ArcadeEffects.simulateShare();
setRate(600);
try { $('user').value = localStorage.getItem('clowns-tomates-user') || ''; } catch (e) { }
if ($('user').value.trim()) connect();
</script>
