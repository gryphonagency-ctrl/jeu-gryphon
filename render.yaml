services:
  - type: web
    name: dessiner-cest-gagne
    runtime: node
    plan: free
    rootDir: dessiner-gagne
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-flare
      - key: MAX_DAILY_DRAWS
        value: "10"
      - key: TIKTOK_CONNECTOR_URL
        value: wss://jeu6boite.onrender.com
