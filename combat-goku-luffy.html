<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duel Goku vs Luffy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<script src="/arcade-effects.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0b0720; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3; background: #000; }
  #panelBtn { position: fixed; top: 8px; right: 8px; z-index: 30; border: 0; border-radius: 8px; padding: 8px 12px; background: #ff7a00; color: #fff; font-weight: 700; cursor: pointer; }
  #panel { position: fixed; top: 48px; right: 8px; width: 270px; max-height: calc(100% - 60px); overflow: auto; z-index: 30; background: rgba(15,8,40,.94); border: 1px solid #ff7a00; border-radius: 10px; padding: 10px; font-size: 13px; }
  #panel.hidden, #board.hidden { display: none; }
  #panel h3 { margin: 10px 0 4px; font-size: 13px; color: #ffb25e; }
  #panel button { margin: 2px 2px 2px 0; padding: 6px 9px; border: 0; border-radius: 6px; background: #3b2a80; color: #fff; cursor: pointer; }
  #panel input[type=text] { width: 100%; box-sizing: border-box; padding: 5px; margin-bottom: 4px; }
  #live { color: #9fe; margin-top: 4px; }
  #board { position: fixed; left: 8px; bottom: 8px; z-index: 20; background: rgba(15,8,40,.8); border: 1px solid #ff7a00; border-radius: 10px; padding: 8px 10px; min-width: 190px; font-size: 13px; }
  #board h4 { margin: 0 0 4px; color: #ffb25e; }
  #board div { display: flex; justify-content: space-between; gap: 10px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="960" height="720"></canvas></div>
<button id="panelBtn" type="button">⚙ Panneau</button>
<div id="panel" class="hidden">
  <h3>Partie</h3>
  <button id="reset" type="button">🔄 Nouveau combat</button>
  <div data-save-key="combat-goku-luffy-save"></div>
  <h3>Vitesse du jeu</h3>
  <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" style="width:100%">
  <h3>Connexion TikTok</h3>
  <input id="user" type="text" placeholder="@pseudo TikTok">
  <input id="url" type="text" value="wss://jeu6boite.onrender.com">
  <button id="connect" type="button">Connecter</button>
  <div id="live">Hors ligne</div>
  <h3>Simulateur</h3>
  <button data-sim="1:luffy" type="button">👊 Luffy</button>
  <button data-sim="1:goku" type="button">👊 Goku</button>
  <button data-sim="5:luffy" type="button">🥊 Combo Luffy</button>
  <button data-sim="5:goku" type="button">🥊 Combo Goku</button>
  <button data-sim="10:luffy" type="button">🦾 Gum-Gum</button>
  <button data-sim="10:goku" type="button">🔵 Kamehameha</button>
  <button data-sim="50:goku" type="button">⚡ Super Saiyan</button>
  <button data-sim="50:luffy" type="button">🔥 Gear 5</button>
  <button id="simBig" type="button">💎 Gros cadeau</button>
  <button id="simShare" type="button">✈️ Partage</button>
  <h3>Classement</h3>
  <button id="toggleBoard" type="button">Afficher / masquer</button>
  <p style="margin:6px 0 0;color:#bbb">Chat : « 1 » = équipe Luffy, « 2 » = équipe Goku. Les étoiles ne sont jamais créditées en simulation.</p>
</div>
<div id="board"><h4>🏆 Meilleurs dégâts</h4><span id="boardRows"></span></div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, GROUND = 650;
const SAVE = 'combat-goku-luffy-save';
const IMG = {};
const ready = i => i.complete && i.naturalWidth;

/* ---------- Séquences image par image (flipbook 24 i/s) ----------
   Dépose des PNG transparents dans /sequences/ : <perso>_<action>_<NN>.png (01, 02, …), cellules tournées vers la droite.
   Actions : idle, walk, jump, punch, knee, headbutt, kame, pistol, transform, hurt, ko, win.
   /sequences/manifest.json (optionnel) : { "luffy_punch": { "hit": 12 } } = frame (à partir de 1) où le coup touche. */
const SEQ_MS = 1000 / 24, SEQ_DT = SEQ_MS / 16.67;
const SEQ = { goku: {}, luffy: {} }, SEQ_META = {};
(function () {
  const ACTIONS = ['idle', 'walk', 'jump', 'punch', 'knee', 'headbutt', 'kame', 'pistol', 'transform', 'hurt', 'ko', 'win'];
  fetch('/sequences/manifest.json').then(r => r.ok ? r.json() : {}).catch(() => ({})).then(m => { Object.assign(SEQ_META, m); });
  ['goku', 'luffy'].forEach(k => ACTIONS.forEach(a => {
    const list = SEQ[k][a] = [];
    const next = n => {
      const im = new Image(), nn = String(n).padStart(2, '0');
      im.onload = () => { list.push(im); next(n + 1); };
      im.src = '/sequences/' + k + '_' + a + '_' + nn + '.png';
    };
    next(1);
  }));
})();
const seqLen = (k, a) => (SEQ[k] && SEQ[k][a] ? SEQ[k][a].length : 0);
const seqHit = (k, a) => { const n = seqLen(k, a), m = SEQ_META[k + '_' + a]; return Math.min(n, Math.max(1, (m && m.hit) || Math.round(n / 2))); };

/* ---------- Squelettes : chaque personnage est découpé en jambes, torse, tête et bras ---------- */
const GOKU_ARM_L_UP = [[108, 228], [58, 234], [34, 270], [26, 330], [30, 395], [98, 395], [100, 330], [112, 270]];
const GOKU_ARM_L_FORE = [[26, 380], [98, 380], [95, 420], [78, 448], [76, 548], [22, 548], [20, 440]];
const mirror = poly => poly.map(([x, y]) => [356 - x, y]);
const RIG = {
  goku: {
    img: 'goku', torsoImg: 'goku', ih: 945, foot: 931, hb: 42, h: 370, ax: 172, hip: [176, 430], neck: [172, 205], front: 'L',
    legs: [[96, 425], [258, 425], [258, 548], [345, 548], [345, 945], [0, 945], [0, 548], [96, 548]],
    torso: [[98, 185], [256, 185], [262, 232], [258, 458], [96, 458], [92, 232]],
    head: [[0, 0], [345, 0], [345, 208], [0, 208]],
    arms: {
      L: { up: GOKU_ARM_L_UP, fore: GOKU_ARM_L_FORE, sh: [68, 262], el: [60, 385], fist: [48, 525] },
      R: { up: mirror(GOKU_ARM_L_UP), fore: mirror(GOKU_ARM_L_FORE), sh: [288, 262], el: [296, 385], fist: [308, 525] }
    },
    rest: { Fs: .55, Fe: 1.15, Bs: .4, Be: 1.3 },
    strike: { Fs: 1.55, Fe: 0, Bs: -1.5, Be: 0 }, wind: { Fs: .25, Fe: 2.1, Bs: .9, Be: 1.9 }
  },
  luffy: {
    img: 'luffy', torsoImg: 'luffyT', ih: 725, foot: 724, hb: 46, h: 360, ax: 200, hip: [200, 405], neck: [200, 190], front: 'R',
    legs: [[0, 398], [400, 398], [400, 725], [0, 725]],
    torso: [[100, 165], [300, 165], [300, 425], [100, 425]],
    head: [[60, 0], [340, 0], [340, 150], [275, 196], [125, 196], [60, 150]],
    arms: {
      L: { up: [[125, 215], [75, 225], [25, 270], [0, 310], [3, 350], [45, 400], [115, 400], [150, 388], [205, 385], [205, 300], [160, 285], [130, 250]], sh: [115, 245], fist: [175, 345] },
      R: { up: [[275, 215], [325, 225], [375, 270], [400, 310], [397, 350], [355, 400], [285, 400], [250, 388], [195, 385], [195, 300], [240, 285], [270, 250]], sh: [290, 245], fist: [225, 345] }
    },
    rest: { Fs: 0, Fe: 0, Bs: 0, Be: 0 },
    strike: { Fs: 2.18, Fe: 0, Bs: -1.05, Be: 0 }, wind: { Fs: -.9, Fe: 0, Bs: .7, Be: 0 }
  }
};

const mkFighter = (key, name, x, dir, color) => ({
  key, name, home: x, x, sx: x, vx: 0, jy: 0, jv: 0, dir, color, hp: 100, hpShown: 100,
  pose: { lean: 0, torso: 0, head: 0, leg: 0, crouch: 0, dash: 0, Fs: 0, Fe: 0, Bs: 0, Be: 0 },
  anim: null, todo: [], push: 0, pushV: 0, pushTarget: null, hurt: 0, flash: 0, ssj: 0, rage: 0,
  fistF: { x, y: 400 }, fistB: { x, y: 400 }, shF: { x, y: 400 }
});
const fighters = {
  luffy: mkFighter('luffy', 'LUFFY', 230, 1, '#ff3b3b'),
  goku: mkFighter('goku', 'GOKU', 730, -1, '#ff9a1f')
};
const other = k => k === 'luffy' ? 'goku' : 'luffy';

let particles = [], rings = [], scorches = [], texts = [], bolts = [], callouts = [];
let ghostMode = false, whiteFrames = 0, combo = { who: null, n: 0, t: 0, s: 1 }, blueFlash = 0, shake = 0, flash = 0, speed = 1, hitstop = 0, camZoom = 1, camX = 0;
let over = null, overT = 0, teams = {}, dmg = {}, lastWinMsg = '', baseInv = new DOMMatrix();
let state = JSON.parse(localStorage.getItem(SAVE) || '{"wins":{"luffy":0,"goku":0},"dmg":{}}');
dmg = state.dmg || {};
function save() { state.dmg = dmg; localStorage.setItem(SAVE, JSON.stringify(state)); }

const rnd = (a, b) => a + Math.random() * (b - a);
const mixv = (a, b, k) => a + (b - a) * k;
const ease = k => { k = Math.max(0, Math.min(1, k)); return k * k * (3 - 2 * k); };
const clamp01 = k => Math.max(0, Math.min(1, k));

/* ---------- Particules ---------- */
function spark(x, y, n, cols, power = 8, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = o.angle !== undefined ? o.angle + rnd(-(o.spread || 6.28) / 2, (o.spread || 6.28) / 2) : rnd(0, 6.283), s = rnd(1, power);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (o.up || 0), alpha: 1, color: cols[i % cols.length], size: rnd(1.5, 4), decay: rnd(.02, .05), add: true, g: o.g ?? .12, streak: true, grow: 0 });
  }
}
function smoke(x, y, n, col = '60,40,30') {
  for (let i = 0; i < n; i++) particles.push({ x: x + rnd(-20, 20), y: y + rnd(-10, 10), vx: rnd(-1.4, 1.4), vy: rnd(-2.2, -.2), alpha: .5, color: col, size: rnd(14, 30), decay: .01, add: false, g: -.01, grow: .6, smoke: true });
}
function ring(x, y, col, vr = 14, a = .9) { rings.push({ x, y, r: 10, vr, a, col }); }
const MANGA = "'Bangers', Impact, 'Arial Black', sans-serif";
if (document.fonts) document.fonts.load('40px Bangers').catch(() => {});
function say(t, x, y, color, size = 44, life = 0) { texts.push({ t, x, y, a: 1, color: color || '#fff', size, life, age: 0 }); }
function bolt(x1, y1, x2, y2, col, w = 2, seg = 9) {
  const pts = [[x1, y1]];
  for (let i = 1; i < seg; i++) { const k = i / seg; pts.push([mixv(x1, x2, k) + rnd(-14, 14), mixv(y1, y2, k) + rnd(-14, 14)]); }
  pts.push([x2, y2]);
  bolts.push({ pts, col, w, a: 1 });
}

/* ---------- Combat ---------- */
function hit(who, amount, user, big) {
  const f = fighters[who];
  if (over) return;
  f.hp = Math.max(0, f.hp - amount);
  f.hurt = 1; f.flash = 1;
  if (big) whiteFrames = 1;
  if (combo.who === who && combo.t > 0) combo.n++; else combo.n = 1;
  combo.who = who; combo.t = 120; combo.s = 1.5;
  if (f.jy <= 0) f.jv = big ? 11 : 6;
  const air = fighters[other(who)].jy > 20 ? 1.6 : 1;
  shake = Math.min(32, Math.max(shake, (2 + amount * 1.1) * air));
  hitstop = Math.max(hitstop, big ? 5 : Math.min(5, 3 + Math.floor(amount / 9)));
  const bx = f.x, by = GROUND - RIG[who].h * .62 - f.jy;
  spark(bx, by, 26, ['#fff6b0', '#ffb300', '#ff6a00'], 11, { g: .18 });
  ring(bx, by, '255,220,120', 12, .8);
  say('-' + amount, bx + rnd(-30, 30), by - 90, '#ffe14d', 64, 30);
  if (user) { dmg[user] = (dmg[user] || 0) + amount; save(); renderBoard(); }
  if (f.hp <= 0) endMatch(other(who));
}
const mult = k => (fighters[k].ssj > 0 || fighters[k].rage > 0) ? 1.6 : 1;

function endMatch(winner) {
  over = winner; overT = 0;
  state.wins[winner]++;
  const top = Object.entries(dmg).filter(([u]) => teams[u] === winner).sort((a, b) => b[1] - a[1])[0];
  say('K.O. !', W / 2 + camX, 300, '#ff3b3b', 90);
  shake = 30; flash = 1; hitstop = 10;
  lastWinMsg = fighters[winner].name + ' GAGNE !';
  if (top && !top[0].startsWith('sim_') && window.ArcadeStars) {
    ArcadeStars.award({ username: top[0], amount: 1 }).catch(() => {});
    lastWinMsg += ' — ⭐ ' + top[0];
  }
  save();
}
function newMatch() {
  for (const k in fighters) { const f = fighters[k]; f.hp = f.hpShown = 100; f.ssj = f.rage = 0; f.anim = null; f.todo = []; f.push = f.pushV = 0; f.pushTarget = null; f.hurt = 0; f.sx = f.x = f.home; f.vx = f.jy = f.jv = 0; }
  over = null; dmg = {}; scorches = []; save(); renderBoard();
}

function act(who, coins, user, avatar, giftName) {
  if (over) return;
  const fh = /finger\s*heart|doigt.*c[oœ]ur/i.test(giftName || '');
  if (fh) who = 'goku';
  callout(who, user, avatar);
  const f = fighters[who];
  if (f.todo.length > 6) return;
  if (fh) f.todo.push({ kind: 'kame', user, dmg: 22 });
  else if (coins >= 50) f.todo.push({ kind: 'transform', user });
  else if (coins >= 10) f.todo.push({ kind: who === 'goku' ? 'kame' : 'pistol', user, dmg: 22 });
  else if (coins >= 5) {
    f.todo.push({ kind: 'punch', hand: 'F', dmg: 4, dur: 17, user });
    f.todo.push({ kind: 'knee', dmg: 5, dur: 38, hitT: 16, user });
    f.todo.push({ kind: 'headbutt', dmg: 7, dur: 40, hitT: 18, user });
  } else {
    // petits cadeaux : poing, genou, tête en rotation
    const m = (f.combo = (f.combo || 0) + 1) % 3;
    if (m === 1) f.todo.push({ kind: 'punch', hand: 'F', dmg: 6, dur: 23, user });
    else if (m === 2) f.todo.push({ kind: 'knee', dmg: 7, dur: 38, hitT: 16, user });
    else f.todo.push({ kind: 'headbutt', dmg: 9, dur: 40, hitT: 18, user });
  }
}

function startAnim(f, job) {
  f.anim = Object.assign({ t: 0, done: false }, job);
  // le dessin dicte la physique : durée et frame d'impact viennent de la séquence
  if (['punch', 'knee', 'headbutt'].includes(job.kind) && seqLen(f.key, job.kind)) {
    f.anim.dur = seqLen(f.key, job.kind) * SEQ_DT;
    f.anim.hitT = (seqHit(f.key, job.kind) - 1) * SEQ_DT;
  }
  if (job.kind === 'kame') {
    f.anim.fireDur = 95;
    say('KA…', f.x, 230, '#9be3ff', 46);
  }
  if (job.kind === 'pistol') say('GUM-GUM…', f.x, 230, '#ff6a6a', 46);
  if (job.kind === 'transform') say(f.key === 'goku' ? 'AAAAAH !!!' : 'GEAR 5 !', f.x, 230, f.key === 'goku' ? '#ffe14d' : '#ff6a6a', 50);
}

function stepAnim(f, foe, dt) {
  const a = f.anim;
  a.t += dt;
  const fk = f.key, ok = other(fk), foeBodyY = GROUND - RIG[ok].h * .62;
  if (a.kind === 'punch') {
    if (!a.done && a.t >= (a.hitT || 10)) {
      a.done = true;
      hit(ok, Math.round(a.dmg * mult(fk)), a.user);
      foe.pushV += f.dir * 9;
    }
    if (a.t >= a.dur) f.anim = null;
  } else if (a.kind === 'knee' || a.kind === 'headbutt') {
    // hitbox d'impact propre à chaque coup : genou = bas du corps, tête = très court, en haut
    const R1 = RIG[fk], R2 = RIG[ok], knee = a.kind === 'knee', sd = f.dir;
    const reach = R1.hb + (knee ? 38 : 22);
    const y0 = knee ? .1 : .78, y1 = knee ? .42 : .98;
    const x0 = f.x + sd * (R1.hb * .3), x1 = f.x + sd * reach;
    f.atk = { x0: Math.min(x0, x1), x1: Math.max(x0, x1), y0: GROUND - f.jy - R1.h * y1, y1: GROUND - f.jy - R1.h * y0 };
    if (!a.done && a.t >= a.hitT && a.t < a.dur - 4) {
      const fb = { x0: foe.x - R2.hb, x1: foe.x + R2.hb, y0: GROUND - foe.jy - R2.h, y1: GROUND - foe.jy };
      if (f.atk.x0 < fb.x1 && f.atk.x1 > fb.x0 && f.atk.y0 < fb.y1 && f.atk.y1 > fb.y0) {
        a.done = true;
        const ix = (Math.max(f.atk.x0, fb.x0) + Math.min(f.atk.x1, fb.x1)) / 2, iy = (f.atk.y0 + f.atk.y1) / 2;
        hit(ok, Math.round(a.dmg * mult(fk)), a.user);
        if (knee) { whiteFrames = 1; foe.pushV += sd * 6; foe.jv = Math.max(foe.jv, 8); say('BAM !', ix, iy - 40, '#ffd34d', 54, 28); }
        else { foe.pushV += sd * 15; say('BONK !', ix, iy - 40, '#ff9b4d', 56, 28); }
        ring(ix, iy, '255,230,160', 9, .8); smoke(ix, iy, 3, '200,170,120');
        for (let i = 0; i < 8; i++) particles.push({ x: ix, y: iy, vx: rnd(-5, 5) + sd * 2, vy: rnd(-5, 3), alpha: 1, color: '#fff2a0', size: rnd(1.5, 3), decay: .06, add: true, g: .1, streak: true });
      }
    } else if (!a.done && a.t >= a.dur - 4 && !a.miss) { a.miss = 1; say('RATÉ', f.x, 200, '#cccccc', 34, 20); }
    if (a.t >= a.dur) { f.anim = null; f.atk = null; }
  } else if (a.kind === 'kame') {
    const sd = f.dir, t = a.t;
    if (t < 75) {
      const k = t / 75, c = midFist(f);
      if (t > 22 && !a.t2) { a.t2 = 1; say('ME…', f.x, 200, '#9be3ff', 52); }
      if (t > 46 && !a.t3) { a.t3 = 1; say('HA…', f.x, 170, '#9be3ff', 58); }
      f.crouchBoost = 1;
      for (let i = 0; i < 2; i++) {
        const an = rnd(0, 6.283), d = rnd(60, 130) * (1.2 - k * .5);
        particles.push({ x: c.x + Math.cos(an) * d, y: c.y + Math.sin(an) * d, vx: -Math.cos(an) * d * .09, vy: -Math.sin(an) * d * .09, alpha: 1, color: Math.random() < .5 ? '#7fd8ff' : '#ffffff', size: rnd(1.5, 3.5), decay: .05, add: true, g: 0, streak: true });
      }
      if (Math.random() < .5) smoke(f.x + rnd(-80, 80), GROUND - 4, 1, '120,90,60');
      if (Math.random() < .35) { const an = rnd(0, 6.283); bolt(c.x, c.y, c.x + Math.cos(an) * 80 * (.4 + k), c.y + Math.sin(an) * 80 * (.4 + k), '#bfe9ff', 2); }
      if (t % 10 < dt) ring(c.x, c.y, '110,200,255', -3, .6);
      shake = Math.max(shake, 2 + k * 4);
    } else {
      const tt = t - 75, x0 = f.fistF.x, y0 = f.fistF.y;
      if (!a.shouted) { a.shouted = 1; say('HAAAAA !!!', f.x, 190, '#ffffff', 70); flash = 1; blueFlash = 1; shake = 22; foe.pushV += sd * 6; }
      const dist = Math.abs(foe.x - x0) - RIG[ok].hb, head = Math.min(dist, tt * 55);
      a.head = head;
      const impact = head >= dist - 1;
      for (let i = 0; i < 3; i++) {
        const xx = x0 + sd * rnd(0, Math.max(10, head));
        particles.push({ x: xx, y: y0 + rnd(-50, 50), vx: rnd(-1, 1) - sd * 2, vy: rnd(-3, 3), alpha: 1, color: Math.random() < .5 ? '#8fdcff' : '#fff', size: rnd(1.5, 3.5), decay: .06, add: true, g: 0, streak: true });
      }
      if (Math.random() < .5) bolt(x0 + sd * rnd(0, head), y0 - 30, x0 + sd * rnd(0, head), y0 + 30, '#e6f7ff', 2, 6);
      if (impact) {
        const ix = foe.x - sd * 20;
        if (!a.done) { a.done = true; hit(ok, Math.round(a.dmg * mult(fk)), a.user, true); }
        foe.pushTarget = sd * 140; foe.hurt = Math.max(foe.hurt, .8);
        spark(ix, y0, 5, ['#ffffff', '#ffd45a', '#7fd8ff', '#ff8a1f'], 13, { angle: -sd * 0 + (sd > 0 ? 0 : Math.PI), spread: 3.2, g: .16 });
        if (Math.random() < .5) smoke(ix, GROUND - 10, 1, '90,70,60');
        if (tt % 9 < dt) ring(ix, y0, '160,220,255', 16, .8);
        if (tt % 12 < dt) { scorches.push({ x: ix + rnd(-30, 30), w: rnd(40, 90), a: .5 }); if (scorches.length > 14) scorches.shift(); }
        shake = Math.max(shake, 11); camZoom = Math.min(1.1, camZoom + .004 * dt);
      }
      if (tt > a.fireDur) f.anim = null, foe.pushTarget = null;
    }
  } else if (a.kind === 'pistol') {
    const t = a.t, sd = f.dir;
    if (t > 8 && !a.said) { a.said = 1; say('PISTOL !', f.x, 200, '#ff6a6a', 60); }
    if (!a.done) a.tgt = foe.x - sd * (RIG[ok].hb + 4);
    if (t >= 24 && !a.done) {
      a.done = true;

  [W / 2 - EDGE_L + 120].forEach(cx => { g.beginPath(); g.ellipse(cx, top + 46, 340, 34, 0, 0, 6.283); g.stroke(); g.beginPath(); g.ellipse(cx, top + 46, 210, 20, 0, 0, 6.283); g.stroke(); });
  g.restore();
  g.fillStyle = 'rgba(255,240,250,.55)'; g.fillRect(x0, top, x1 - x0, 3);
  const edge = (x, s) => { g.fillStyle = '#2a1a2e'; g.beginPath(); g.moveTo(x, top); g.lineTo(x + s * 26, H); g.lineTo(x + s * 26, H + 4); g.lineTo(x, top + 8); g.closePath(); };
  edge(x0, 1); g.fill(); edge(x1, -1); g.fill();
})();
const clouds = Array.from({ length: 6 }, () => ({ x: rnd(0, W), y: rnd(60, 280), s: rnd(.6, 1.4), v: rnd(.05, .18) }));
function drawBG(dt) {
  ctx.drawImage(bg_sky, camX * (1 - PAR_SKY) - 50, 0);
  ctx.save(); ctx.translate(camX * .85, 0);
  for (const c of clouds) {
    c.x += c.v * dt; if (c.x > W + 200) c.x = -200;
    ctx.fillStyle = 'rgba(255,215,240,.2)';
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.ellipse(c.x + i * 40 * c.s, c.y + Math.sin(i * 2) * 10, 70 * c.s, 22 * c.s, 0, 0, 6.283); ctx.fill(); }
  }
  ctx.restore();
  ctx.drawImage(bg_distant, camX * (1 - PAR_FAR) - 120, 0);
  ctx.drawImage(stage_floor, EDGE_L - 120, 0);
  for (const s of scorches) { ctx.fillStyle = 'rgba(0,0,0,' + s.a + ')'; ctx.beginPath(); ctx.ellipse(s.x, GROUND + 10, s.w, 10, 0, 0, 6.283); ctx.fill(); s.a = Math.max(0, s.a - .0004 * dt); }
  scorches = scorches.filter(s => s.a > 0);
}

/* ---------- Boucle ---------- */
function updateAll(dt, time) {
  for (const k in fighters) {
    const f = fighters[k], foe = fighters[other(k)];
    f.hurt = Math.max(0, f.hurt - .035 * dt); f.flash = Math.max(0, f.flash - .09 * dt);
    if (!over) {
      if (!f.anim && f.todo.length) startAnim(f, f.todo.shift());
      if (f.anim) stepAnim(f, foe, dt);
    } else f.anim = null;
    const target = computePose(f, foe, time), kk = 1 - Math.pow(.5, dt);
    // vie au repos : petits pas de patrouille et sauts occasionnels (machine d'états WALK / JUMP)
    if (!over && !f.anim && !f.todo.length) {
      f.wanderT = (f.wanderT ?? rnd(40, 120)) - dt;
      if (f.wanderT <= 0) {
        f.wanderT = rnd(70, 170); f.wander = Math.random() < .3 ? 0 : rnd(-70, 70);
        if (f.jy <= 0 && Math.random() < .22) f.jv = rnd(9, 12);
      }
      target.dash += f.wander || 0;
    } else f.wander = 0;
    if (!over && !ghostMode) {
      const a = f.anim, charging = a && (a.kind === 'kame' && a.t < 75 || a.kind === 'transform');
      const rush = Math.abs(f.vx) > 3 || a && (a.kind === 'knee' || a.kind === 'headbutt') && a.t >= 6 && a.t < a.dur - 4;
      if ((charging || rush) && f.ssj <= 0 && f.rage <= 0) {
        const pal = k === 'goku' ? (charging ? ['#7fd0ff', '#bfeaff', '#3aa0ff'] : ['#ffd21a', '#ff9a1a', '#ff6a00']) : ['#ff5030', '#ff9a30', '#ffd060'];
        const hb = RIG[k].hb, hh = RIG[k].h;
        for (let i = 0; i < 2; i++) particles.push({ x: f.x + rnd(-hb * 1.3, hb * 1.3), y: GROUND - f.jy - rnd(10, hh * .9), vx: rnd(-.6, .6) - Math.sign(f.vx) * 1.5, vy: -rnd(2, 5), alpha: .8, color: pal[Math.floor(Math.random() * 3)], size: rnd(4, 9), decay: .035, add: true, g: -.04, w: rnd(0, 6) });
      }
    }
    f.state = stateOf(f);
    for (const p in target) f.pose[p] += (target[p] - f.pose[p]) * kk;
    if (f.pushTarget !== null) f.push += (f.pushTarget - f.push) * .12 * dt;
    else f.push += (-f.push * .012 + f.pushV) * dt;
    f.pushV *= Math.pow(f.jy > 0 ? .96 : .85, dt);
    if (over && over !== k) f.push += (-f.dir * 90 - f.push) * .05 * dt;
    f.sx += f.vx * dt; f.vx += ((f.home + f.dir * f.pose.dash - f.sx) * .12 - f.vx * .45) * dt;
    const wasAir = f.jy > 0;
    if (over === k && f.jy <= 0 && overT > 20) f.jv = 12;
    f.jv -= (Math.abs(f.jv) < 3 ? .22 : f.jv > 0 ? .85 : 1.3) * dt; f.jy += f.jv * dt;
    if (f.jy <= 0) {
      if (wasAir && f.jv < -4) { smoke(f.x, GROUND - 4, 4, '120,90,60'); shake = Math.max(shake, Math.min(8, -f.jv * .5)); }
      f.jy = 0; f.jv = 0;
    }
    if (Math.abs(f.vx) > 3 && f.jy <= 0 && Math.random() < .35 * dt) smoke(f.x - Math.sign(f.vx) * 30, GROUND - 4, 1, '120,90,60');
    f.x = f.sx + f.push;
    const lim = f.x < EDGE_L + 80 ? EDGE_L + 80 : f.x > EDGE_R - 80 ? EDGE_R - 80 : null;
    if (lim !== null) {
      f.x = lim; f.push = f.x - f.sx; f.vx = 0; f.pushV = 0;
      if (Math.random() < .6 * Math.min(2, dt)) for (let i = 0; i < 2; i++) particles.push({ x: f.x + rnd(-30, 30), y: GROUND - f.jy - rnd(0, 14), vx: rnd(-1.5, 1.5), vy: -rnd(1, 4), alpha: .9, color: Math.random() < .5 ? '#b400ff' : '#e6a0ff', size: rnd(2, 5), decay: .03, add: true, g: -.03, streak: true });
    }
    if (f.ssj > 0) { f.ssj -= dt; if (Math.random() < .6) particles.push({ x: f.x + rnd(-90, 90), y: GROUND - rnd(0, 120), vx: rnd(-.5, .5), vy: rnd(-3, -1), alpha: .9, color: '#ffd21a', size: rnd(1.5, 3.5), decay: .02, add: true, g: -.02, streak: true });
      if (Math.random() < .08) bolt(f.x + rnd(-60, 60), GROUND - rnd(60, 380), f.x + rnd(-90, 90), GROUND - rnd(60, 380), '#fff2a0', 2, 6); }
    if (f.rage > 0) { f.rage -= dt; if (Math.random() < .6) particles.push({ x: f.x + rnd(-90, 90), y: GROUND - rnd(0, 120), vx: rnd(-.5, .5), vy: rnd(-3, -1), alpha: .9, color: '#ff5030', size: rnd(1.5, 3.5), decay: .02, add: true, g: -.02, streak: true }); }
  }
  for (const p of particles) { p.x += p.vx * dt + (p.w !== undefined ? Math.sin(p.alpha * 11 + p.w) * 1.1 * dt : 0); p.y += p.vy * dt; p.vy += (p.g || 0) * dt; p.vx *= Math.pow(.985, dt); p.size += (p.grow || 0) * dt; p.alpha -= p.decay * dt; }
  particles = particles.filter(p => p.alpha > 0).slice(-700);
  for (const r of rings) { r.r += r.vr * dt; r.a -= .03 * dt; }
  rings = rings.filter(r => r.a > 0 && r.r > 0);
  for (const b of bolts) b.a -= .25 * dt;
  bolts = bolts.filter(b => b.a > 0);
  texts.forEach(t => {
    t.age += dt;
    if (t.life) { t.y -= dt * 1.1; t.a = t.age < t.life * .3 ? 1 : 1 - (t.age - t.life * .3) / (t.life * .7); if (t.age >= t.life) t.a = 0; }
    else { t.y -= dt * .6; t.a -= dt * .01; }
  });
  texts = texts.filter(t => t.a > 0);
  callouts.forEach(c => { c.a -= dt * .006; });
  while (callouts.length && callouts[0].a <= 0) callouts.shift();
  shake *= Math.pow(.9, dt); flash *= Math.pow(.9, dt);
  if (combo.t > 0) { combo.t -= dt; combo.s = Math.max(1, combo.s - .05 * dt); } else combo.n = 0;
  const kame = ['luffy', 'goku'].some(k => fighters[k].anim && fighters[k].anim.kind === 'kame' && fighters[k].anim.t > 75);
  camZoom += ((kame ? 1.08 : 1) - camZoom) * .05 * dt;
  if (over) { overT += dt; if (overT > 420) newMatch(); }
}

function drawFX() {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const r of rings) { ctx.strokeStyle = 'rgba(' + r.col + ',' + Math.max(0, r.a) + ')'; ctx.lineWidth = 5; ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * .85, 0, 0, 6.283); ctx.stroke(); }
  for (const p of particles) {
    if (!p.add) continue;
    ctx.globalAlpha = Math.min(1, p.alpha);
    if (p.streak) { ctx.strokeStyle = p.color; ctx.lineWidth = p.size; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2); ctx.stroke(); }
    else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.283); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 12;
  for (const b of bolts) { ctx.shadowColor = b.col; ctx.strokeStyle = b.col; ctx.globalAlpha = Math.max(0, b.a); ctx.lineWidth = b.w; ctx.beginPath(); b.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); }
  ctx.restore();
}
function drawSmoke() {
  for (const p of particles) {
    if (p.add) continue;
    ctx.globalAlpha = Math.max(0, p.alpha * .6);
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
    g.addColorStop(0, 'rgba(' + p.color + ',.8)'); g.addColorStop(1, 'rgba(' + p.color + ',0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawBars() {
  [['luffy', 20], ['goku', W / 2 + 10]].forEach(([k, x]) => {
    const f = fighters[k], bw = W / 2 - 30;
    ctx.fillStyle = '#000a'; ctx.fillRect(x, 24, bw, 28);
    ctx.fillStyle = f.hp > 30 ? f.color : '#ff2e2e'; ctx.fillRect(x, 24, bw * f.hpShown / 100, 28);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(x, 24, bw, 28);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'left';
    ctx.fillText(f.name + '  ·  ' + state.wins[k] + ' victoire' + (state.wins[k] > 1 ? 's' : ''), x + 4, 78);
  });
}
function drawCombo(time) {
  if (combo.n < 2 || combo.t <= 0 || over) return;
  const x = combo.who === 'goku' ? W * .72 : W * .28, vib = combo.s > 1 ? (combo.s - 1) * 14 : 1.5;
  ctx.save(); ctx.translate(x + (Math.random() - .5) * vib, 190 + (Math.random() - .5) * vib);
  ctx.rotate(-.14); ctx.scale(combo.s, combo.s); ctx.globalAlpha = Math.min(1, combo.t / 30);
  ctx.font = '78px ' + MANGA; ctx.textAlign = 'center'; ctx.lineJoin = 'round'; ctx.lineWidth = 11; ctx.strokeStyle = '#000';
  const t = combo.n + ' HITS !'; ctx.strokeText(t, 0, 0); ctx.fillStyle = combo.n >= 4 ? '#ff5a2a' : '#ffb400'; ctx.fillText(t, 0, 0);
  ctx.restore();
}
function drawCallouts() {
  ['luffy', 'goku'].forEach(side => {
    callouts.filter(c => c.who === side).forEach((c, i) => {
      const x = side === 'luffy' ? 20 : W - 240, y = 110 + i * 54;
      ctx.globalAlpha = Math.max(0, Math.min(1, c.a));
      ctx.fillStyle = '#000b'; ctx.fillRect(x, y, 220, 46);
      ctx.strokeStyle = fighters[side].color; ctx.lineWidth = 2; ctx.strokeRect(x, y, 220, 46);
      if (c.img && ready(c.img)) {
        ctx.save(); ctx.beginPath(); ctx.arc(x + 23, y + 23, 18, 0, 6.283); ctx.clip();
        ctx.drawImage(c.img, x + 5, y + 5, 36, 36); ctx.restore();
      } else { ctx.fillStyle = fighters[side].color; ctx.beginPath(); ctx.arc(x + 23, y + 23, 18, 0, 6.283); ctx.fill(); }
      ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'left';
      ctx.fillText(c.user, x + 48, y + 29);
    });
  });
  ctx.globalAlpha = 1;
}

function drawSpeedLines(time) {
  for (const k in fighters) {
    const f = fighters[k], a = f.anim;
    if (!a) continue;
    const on = (a.kind === 'kame' && a.t >= 75) || (a.kind === 'pistol' && a.t > 10 && a.t < 36) || (a.kind === 'punch' && a.t > 5 && a.t < 14);
    if (!on) continue;
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
    for (let i = 0; i < 14; i++) {
      const y = GROUND - rnd(60, 420), l = rnd(120, 360), x = f.x - f.dir * rnd(40, 300);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - f.dir * l, y); ctx.stroke();
    }
    ctx.restore();
  }
}

let last = 0, frozenT = 0;
function frame(rawTime) {
  let dt = Math.min(3, (rawTime - (last || rawTime)) / 16.67) * speed; last = rawTime;
  const frozen = hitstop > 0 && speed > 0;
  if (frozen) { hitstop -= 1; dt = 0; frozenT += Math.min(50, rawTime - (frame.prev || rawTime)); }
  frame.prev = rawTime;
  const time = rawTime - frozenT;
  updateAll(dt, time);
  if (dt > 0) for (const k in fighters) {
    const f = fighters[k];
    if (f.px !== undefined && Math.abs(f.x - f.px) / dt > 6) (f.ghosts = f.ghosts || []).push({ x: f.px, jy: f.pjy, a: .32 });
    f.px = f.x; f.pjy = f.jy;
    if (f.ghosts) { f.ghosts.forEach(g => g.a -= .09 * dt); f.ghosts = f.ghosts.filter(g => g.a > 0).slice(-3); }
  }
  for (const k in fighters) fighters[k].hpShown += (fighters[k].hp - fighters[k].hpShown) * Math.min(1, .1 * dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  const camTarget = Math.max(EDGE_L, Math.min(EDGE_R - W, (fighters.luffy.x + fighters.goku.x) / 2 - W / 2));
  camX += (camTarget - camX) * (1 - Math.pow(.9, dt));
  ctx.translate(W / 2 + sx, GROUND - 120 + sy); ctx.scale(camZoom, camZoom); ctx.translate(-W / 2 - camX, -(GROUND - 120));
  baseInv = ctx.getTransform().inverse();
  drawBG(dt);
  const order = ['luffy', 'goku'];
  order.forEach(k => {
    const f = fighters[k];
    if (f.ghosts && f.ghosts.length) {
      const x0 = f.x, y0 = f.jy;
      ghostMode = true;
      f.ghosts.forEach(g => { f.x = g.x; f.jy = g.jy; ctx.globalAlpha = g.a; drawFighter(f, time); });
      ghostMode = false; ctx.globalAlpha = 1; f.x = x0; f.jy = y0;
    }
  });
  order.forEach(k => drawFighter(fighters[k], time));
  ctx.save(); ctx.translate(camX, 0); drawSpeedLines(time); ctx.restore();
  drawSmoke();
  order.forEach(k => { drawKame(fighters[k], fighters[other(k)], time); drawPistol(fighters[k], fighters[other(k)]); });
  drawFX();
  texts.forEach(t => {
    const pop = t.life ? 1 + Math.max(0, 1 - t.age / 6) * .9 : 1;
    ctx.save(); ctx.globalAlpha = Math.max(0, t.a); ctx.translate(t.x, t.y); ctx.scale(pop, pop);
    if (t.life) ctx.rotate(-.08);
    ctx.font = t.size + 'px ' + MANGA; ctx.textAlign = 'center'; ctx.lineJoin = 'round'; ctx.lineWidth = 8; ctx.strokeStyle = '#000';
    ctx.strokeText(t.t, 0, 0); ctx.fillStyle = t.color; ctx.fillText(t.t, 0, 0); ctx.restore();
  });
  ctx.globalAlpha = 1;
  ctx.restore();
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (blueFlash > .03) { const g = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, W * .75); g.addColorStop(0, 'rgba(255,255,255,' + blueFlash * .5 + ')'); g.addColorStop(1, 'rgba(60,150,255,' + blueFlash * .45 + ')'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); blueFlash *= .9; }
  if (flash > .05) { ctx.fillStyle = 'rgba(255,255,255,' + flash * .4 + ')'; ctx.fillRect(0, 0, W, H); }
  drawBars(); drawCallouts(); drawCombo(time);
  if (whiteFrames > 0) { whiteFrames--; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); }
  if (over) {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 260, W, 150);
    ctx.fillStyle = '#ffd21a'; ctx.font = 'bold 64px Arial'; ctx.textAlign = 'center'; ctx.fillText(lastWinMsg, W / 2, 350);
    ctx.fillStyle = '#fff'; ctx.font = '24px Arial'; ctx.fillText('Nouveau combat dans quelques secondes…', W / 2, 392);
  }
  requestAnimationFrame(frame);
}

/* ---------- Spectateurs, TikTok, interface ---------- */
const avatars = {};
function callout(who, user, avatar) {
  if (!user || user === 'sim_test') return;
  let img = null;
  if (avatar) img = avatars[avatar] || (avatars[avatar] = Object.assign(new Image(), { src: avatar }));
  callouts.push({ who, user: String(user).slice(0, 18), img, a: 1 });
  if (callouts.length > 4) callouts.shift();
}
function teamOf(user) {
  if (!teams[user]) teams[user] = Math.random() < .5 ? 'luffy' : 'goku';
  return teams[user];
}
function onGift(user, coins, avatar, giftName) { act(teamOf(user), coins, user, avatar, giftName); }
function renderBoard() {
  const rows = Object.entries(dmg).sort((a, b) => b[1] - a[1]).slice(0, 5);
  document.getElementById('boardRows').innerHTML = rows.map(([u, d]) => '<div><span>' + u.replace(/[<>&]/g, '') + '</span><b>' + d + '</b></div>').join('') || '<i>—</i>';
}
function handleMessage(d) {
  if (d.type === 'chat' || d.type === 'tiktok-chat') {
    const t = String(d.comment || d.message || '').trim(), u = d.uniqueId || d.username || d.nickname;
    if (u && t === '1') teams[u] = 'luffy'; else if (u && t === '2') teams[u] = 'goku';
  } else if (d.type === 'gift' || d.type === 'tiktok-gift') {
    const x = d.gift || d;
    onGift(x.uniqueId || x.username || x.nickname || 'inconnu', x.coinCount ?? ((x.coinValue ?? x.diamondCount ?? x.diamonds ?? 1) * (x.repeatCount || 1)), x.avatarDataUri || x.profilePictureUrl || '', x.giftName || x.name || x.gift_name || '');
  }
}
let ws;
document.getElementById('connect').onclick = () => {
  const u = document.getElementById('user').value.replace('@', '').trim(), live = document.getElementById('live');
  if (!u) return;
  try { ws = new WebSocket(document.getElementById('url').value); } catch (e) { live.textContent = 'URL invalide'; return; }
  ws.onopen = () => { ws.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username: u })); live.textContent = 'Connexion à @' + u + '…'; };
  ws.onmessage = e => { try { handleMessage(JSON.parse(e.data)); } catch (err) { } };
  ws.onclose = () => { live.textContent = 'Déconnecté'; };
};
document.getElementById('panelBtn').onclick = () => document.getElementById('panel').classList.toggle('hidden');
document.getElementById('toggleBoard').onclick = () => document.getElementById('board').classList.toggle('hidden');
document.getElementById('speed').oninput = e => { speed = +e.target.value; };
document.getElementById('reset').onclick = newMatch;
document.querySelectorAll('[data-sim]').forEach(b => b.onclick = () => { const [c, w] = b.dataset.sim.split(':'); teams.sim_test = w; act(w, +c, 'sim_test'); });
document.getElementById('simBig').onclick = () => ArcadeEffects.simulateBigGift('Alex_TikTok', 100);
document.getElementById('simShare').onclick = () => ArcadeEffects.simulateShare();
window.DuelAPI = { act, onGift, newMatch, fighters };
renderBoard();
requestAnimationFrame(frame);
</script>
