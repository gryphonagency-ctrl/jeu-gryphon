<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duel Goku vs Luffy</title>
<script src="/arcade-effects.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0b0720; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100%; max-height: 100%; aspect-ratio: 4 / 3; background: #000; }
  #panelBtn { position: fixed; top: 8px; right: 8px; z-index: 30; border: 0; border-radius: 8px; padding: 8px 12px; background: #ff7a00; color: #fff; font-weight: 700; cursor: pointer; }
  #panel { position: fixed; top: 48px; right: 8px; width: 270px; max-height: calc(100% - 60px); overflow: auto; z-index: 30; background: rgba(15,8,40,.94); border: 1px solid #ff7a00; border-radius: 10px; padding: 10px; font-size: 13px; }
  #panel.hidden, #board.hidden { display: none; }
  #panel h3 { margin: 10px 0 4px; font-size: 13px; color: #ffb25e; }
  #panel button { margin: 2px 2px 2px 0; padding: 6px 9px; border: 0; border-radius: 6px; background: #3b2a80; color: #fff; cursor: pointer; }
  #panel input[type=text] { width: 100%; box-sizing: border-box; padding: 5px; margin-bottom: 4px; }
  #live { color: #9fe; margin-top: 4px; }
  #board { position: fixed; left: 8px; bottom: 8px; z-index: 20; background: rgba(15,8,40,.8); border: 1px solid #ff7a00; border-radius: 10px; padding: 8px 10px; min-width: 190px; font-size: 13px; }
  #board h4 { margin: 0 0 4px; color: #ffb25e; }
  #board div { display: flex; justify-content: space-between; gap: 10px; }
  #boardBtn { position: fixed; left: 8px; bottom: 8px; z-index: 21; display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="960" height="720"></canvas></div>
<button id="panelBtn" type="button">⚙ Panneau</button>
<div id="panel" class="hidden">
  <h3>Partie</h3>
  <button id="reset" type="button">🔄 Nouveau combat</button>
  <div data-save-key="combat-goku-luffy-save"></div>
  <h3>Vitesse du jeu</h3>
  <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" style="width:100%">
  <h3>Connexion TikTok</h3>
  <input id="user" type="text" placeholder="@pseudo TikTok">
  <input id="url" type="text" value="wss://jeu6boite.onrender.com">
  <button id="connect" type="button">Connecter</button>
  <div id="live">Hors ligne</div>
  <h3>Simulateur</h3>
  <button data-sim="1:luffy" type="button">👊 Luffy</button>
  <button data-sim="1:goku" type="button">👊 Goku</button>
  <button data-sim="5:luffy" type="button">🦵 Luffy</button>
  <button data-sim="5:goku" type="button">🦵 Goku</button>
  <button data-sim="10:luffy" type="button">🦾 Bras</button>
  <button data-sim="10:goku" type="button">🔵 Kamehameha</button>
  <button data-sim="50:goku" type="button">⚡ Super Saiyan</button>
  <button id="simBig" type="button">💎 Gros cadeau</button>
  <button id="simShare" type="button">✈️ Partage</button>
  <h3>Classement</h3>
  <button id="toggleBoard" type="button">Afficher / masquer</button>
  <p style="margin:6px 0 0;color:#bbb">Chat : « 1 » = équipe Luffy, « 2 » = équipe Goku. Les étoiles ne sont jamais créditées en simulation.</p>
</div>
<div id="board"><h4>🏆 Meilleurs dégâts</h4><span id="boardRows"></span></div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, GROUND = 650;
const SAVE = 'combat-goku-luffy-save';
const IMG = {};
['luffy', 'goku', 'goku-ssj', 'goku-ssj-atk'].forEach(n => { const i = new Image(); i.src = '/duel-' + n + '.png'; IMG[n] = i; });

const fighters = {
  luffy: { name: 'LUFFY', x: 230, hp: 100, hpShown: 100, atk: 0, atkT: 0, tilt: 0, dir: 1, h: 400, color: '#ff3b3b' },
  goku:  { name: 'GOKU',  x: 730, hp: 100, hpShown: 100, atk: 0, atkT: 0, tilt: 0, dir: -1, h: 420, color: '#ff9a1f', ssj: 0 }
};
const other = k => k === 'luffy' ? 'goku' : 'luffy';
let particles = [], texts = [], beam = null, arm = null, shake = 0, flash = 0, speed = 1;
let over = null, overT = 0, teams = {}, dmg = {}, lastWinMsg = '';
let state = JSON.parse(localStorage.getItem(SAVE) || '{"wins":{"luffy":0,"goku":0},"dmg":{}}');
dmg = state.dmg || {};
function save() { state.dmg = dmg; localStorage.setItem(SAVE, JSON.stringify(state)); }

function burst(x, y, n, cols, power = 8) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, alpha: 1, color: cols[i % cols.length], size: 2 + Math.random() * 4, decay: .02 + Math.random() * .02 });
  }
}
function say(t, x, y, color) { texts.push({ t, x, y, a: 1, color: color || '#fff' }); }

function hit(who, amount, user) {
  const f = fighters[who];
  if (over) return;
  f.hp = Math.max(0, f.hp - amount);
  shake = Math.min(25, shake + amount * .9);
  flash = 1;
  burst(f.x, GROUND - f.h * .55, 18, ['#ffb300', '#ffe14d', '#ff6a00']);
  say('-' + amount, f.x + (Math.random() * 60 - 30), GROUND - f.h * .8, '#ffdd55');
  if (user) { dmg[user] = (dmg[user] || 0) + amount; save(); renderBoard(); }
  if (f.hp <= 0) endMatch(other(who));
}

function lunge(who, power) { const f = fighters[who]; f.atk = 1; f.atkT = 0; f.atkPower = power; }

function act(who, coins, user) {
  if (over) return;
  const foe = other(who), f = fighters[who];
  if (coins >= 50) {
    if (who === 'goku') { f.ssj = 1800; burst(f.x, GROUND - 200, 60, ['#ffe14d', '#ffb300'], 14); say('SUPER SAIYAN !', f.x, 250, '#ffe14d'); }
    else { f.rage = 1800; burst(f.x, GROUND - 200, 60, ['#ff3b3b', '#ffb300'], 14); say('GEAR 5 !', f.x, 250, '#ff6a6a'); }
    flash = 1;
    hit(foe, 25, user);
  } else if (coins >= 10) {
    if (who === 'goku') beam = { t: 0, user, dmg: 22 };
    else arm = { t: 0, user, dmg: 22 };
    say(who === 'goku' ? 'KAMEHAMEHA !' : 'GUM-GUM PISTOL !', f.x, 220, who === 'goku' ? '#4dd2ff' : '#ff6a6a');
  } else {
    lunge(who, coins >= 5 ? 10 : 6);
    f.atkUser = user;
  }
  if (user) log(user, who);
}
function mult(who) { const f = fighters[who]; return (f.ssj > 0 || f.rage > 0) ? 1.6 : 1; }
function log() {}

function endMatch(winner) {
  over = winner; overT = 0;
  state.wins[winner]++;
  const top = Object.entries(dmg).filter(([u]) => teams[u] === winner).sort((a, b) => b[1] - a[1])[0];
  say('K.O. !', W / 2, 300, '#ff3b3b');
  shake = 30; flash = 1;
  lastWinMsg = fighters[winner].name + ' GAGNE !';
  if (top && top[0] !== 'simulation' && window.ArcadeStars && !top[0].startsWith('sim_')) {
    ArcadeStars.award({ username: top[0], amount: 1 }).catch(() => {});
    lastWinMsg += ' — ⭐ ' + top[0];
  }
  save();
}
function newMatch() {
  fighters.luffy.hp = fighters.goku.hp = 100;
  fighters.goku.ssj = 0; fighters.luffy.rage = 0; fighters.goku.hpShown = fighters.luffy.hpShown = 100;
  over = null; beam = arm = null; dmg = {}; save(); renderBoard();
}

function teamOf(user) {
  if (!teams[user]) teams[user] = Math.random() < .5 ? 'luffy' : 'goku';
  return teams[user];
}
function onGift(user, coins) { act(teamOf(user), coins, user); }

function renderBoard() {
  const rows = Object.entries(dmg).sort((a, b) => b[1] - a[1]).slice(0, 5);
  document.getElementById('boardRows').innerHTML = rows.map(([u, d]) => '<div><span>' + u.replace(/[<>&]/g, '') + '</span><b>' + d + '</b></div>').join('') || '<i>—</i>';
}

function update(dt) {
  for (const k in fighters) {
    const f = fighters[k];
    f.hpShown += (f.hp - f.hpShown) * .1;
    if (f.atk) {
      f.atkT += dt;
      const p = f.atkT / 10;
      if (p >= 0.5 && !f.hitDone) { f.hitDone = true; hit(other(k), Math.round(f.atkPower * mult(k)), f.atkUser); }
      if (p >= 1) { f.atk = 0; f.hitDone = false; }
    }
    if (f.ssj > 0) { f.ssj -= dt; if (Math.random() < .6) particles.push({ x: f.x + (Math.random() - .5) * 200, y: GROUND, vx: (Math.random() - .5), vy: -2 - Math.random() * 3, alpha: .9, color: '#ffd21a', size: 3 + Math.random() * 3, decay: .012 }); }
    if (f.rage > 0) { f.rage -= dt; if (Math.random() < .5) particles.push({ x: f.x + (Math.random() - .5) * 200, y: GROUND, vx: 0, vy: -2 - Math.random() * 3, alpha: .9, color: '#ff4d2e', size: 3 + Math.random() * 3, decay: .012 }); }
  }
  if (beam) {
    beam.t += dt;
    const g = fighters.goku, l = fighters.luffy;
    for (let i = 0; i < 4; i++) particles.push({ x: g.x - 80 - Math.random() * (g.x - l.x - 80), y: GROUND - 250 + (Math.random() - .5) * 60, vx: (Math.random() - .5) * 6, vy: (Math.random() - .5) * 6, alpha: 1, color: Math.random() < .5 ? '#4dd2ff' : '#fff', size: 2 + Math.random() * 3, decay: .05 });
    if (beam.t > 40 && !beam.hit) { beam.hit = true; hit('luffy', Math.round(beam.dmg * mult('goku')), beam.user); burst(l.x, GROUND - 250, 40, ['#4dd2ff', '#fff'], 12); }
    if (beam.t > 70) beam = null;
  }
  if (arm) {
    arm.t += dt;
    if (arm.t > 25 && !arm.hit) { arm.hit = true; hit('goku', Math.round(arm.dmg * mult('luffy')), arm.user); }
    if (arm.t > 50) arm = null;
  }
  particles.forEach(p => { p.x += p.vx * dt * .6; p.y += p.vy * dt * .6; p.alpha -= p.decay * dt; });
  particles = particles.filter(p => p.alpha > 0);
  texts.forEach(t => { t.y -= dt * .8; t.a -= dt * .012; });
  texts = texts.filter(t => t.a > 0);
  shake *= Math.pow(.9, dt); flash *= Math.pow(.9, dt);
  if (over) { overT += dt; if (overT > 420) newMatch(); }
}

function drawFighter(k, time) {
  const f = fighters[k];
  let img = IMG[k];
  if (k === 'goku' && f.ssj > 0) img = (beam || f.atk) ? IMG['goku-ssj-atk'] : IMG['goku-ssj'];
  if (!img.complete || !img.naturalWidth) return;
  const h = f.h, w = img.naturalWidth * h / img.naturalHeight;
  const breathe = Math.sin(time / 300 + (k === 'goku' ? 2 : 0)) * 6;
  let dx = 0, rot = 0;
  if (f.atk) { const p = Math.min(1, f.atkT / 10); const s = Math.sin(p * Math.PI); dx = f.dir * -1 * 0 + (k === 'luffy' ? 1 : -1) * 50 * s; rot = (k === 'luffy' ? 1 : -1) * .12 * s; }
  if (over && over !== k) rot = (k === 'luffy' ? -1 : 1) * 1.3;
  ctx.save();
  ctx.translate(f.x + dx, GROUND + (over && over !== k ? 0 : breathe));
  ctx.rotate(rot);
  if (f.ssj > 0 || f.rage > 0) { ctx.shadowColor = f.ssj > 0 ? '#ffd21a' : '#ff3b3b'; ctx.shadowBlur = 40 + Math.sin(time / 80) * 15; }
  ctx.drawImage(img, -w / 2, -h, w, h);
  ctx.restore();
}

function drawBeam() {
  const g = fighters.goku, l = fighters.luffy, y = GROUND - 250, x0 = g.x - 80;
  if (beam) {
    const len = Math.min(1, beam.t / 20) * (x0 - l.x), th = 50 + Math.sin(beam.t) * 12;
    const gr = ctx.createLinearGradient(0, y - th, 0, y + th);
    gr.addColorStop(0, 'rgba(0,150,255,0)'); gr.addColorStop(.5, '#fff'); gr.addColorStop(1, 'rgba(0,150,255,0)');
    ctx.fillStyle = gr; ctx.shadowColor = '#4dd2ff'; ctx.shadowBlur = 40;
    ctx.fillRect(x0 - len, y - th, len, th * 2);
    ctx.beginPath(); ctx.arc(x0, y, 40 + Math.sin(beam.t) * 6, 0, 6.283); ctx.fillStyle = '#c8f3ff'; ctx.fill();
    ctx.shadowBlur = 0;
  }
  if (arm) {
    const reach = Math.sin(Math.min(1, arm.t / 50) * Math.PI), x1 = l.x + 90 + reach * (g.x - l.x - 190), ya = GROUND - 220;
    ctx.strokeStyle = '#f0a070'; ctx.lineWidth = 34; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(l.x + 90, ya); ctx.lineTo(x1, ya); ctx.stroke();
    ctx.fillStyle = '#f0a070'; ctx.beginPath(); ctx.arc(x1, ya, 40, 0, 6.283); ctx.fill();
  }
}

function drawBars() {
  [['luffy', 20, 'right'], ['goku', W / 2 + 10, 'left']].forEach(([k, x]) => {
    const f = fighters[k], bw = W / 2 - 30;
    ctx.fillStyle = '#000a'; ctx.fillRect(x, 24, bw, 28);
    ctx.fillStyle = f.hp > 30 ? f.color : '#ff2e2e'; ctx.fillRect(x, 24, bw * f.hpShown / 100, 28);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(x, 24, bw, 28);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'left';
    ctx.fillText(f.name + '  ·  ' + state.wins[k] + ' victoire' + (state.wins[k] > 1 ? 's' : ''), x + 4, 78);
  });
}

function frame(time) {
  const dt = Math.min(3, (time - (frame.last || time)) / 16.67) * speed; frame.last = time;
  update(dt);
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  ctx.translate(sx, sy);
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#2a0b5e'); bg.addColorStop(.6, '#ff7a3d'); bg.addColorStop(1, '#3a1a0a');
  ctx.fillStyle = bg; ctx.fillRect(-30, -30, W + 60, H + 60);
  ctx.fillStyle = '#2b1608'; ctx.fillRect(-30, GROUND, W + 60, H - GROUND + 30);
  drawFighter('luffy', time); drawFighter('goku', time);
  drawBeam();
  particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.alpha); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.283); ctx.fill(); });
  ctx.globalAlpha = 1;
  texts.forEach(t => { ctx.globalAlpha = Math.max(0, t.a); ctx.font = 'bold 44px Arial'; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.strokeText(t.t, t.x, t.y); ctx.fillStyle = t.color; ctx.fillText(t.t, t.x, t.y); });
  ctx.globalAlpha = 1;
  if (flash > .05) { ctx.fillStyle = 'rgba(255,255,255,' + flash * .35 + ')'; ctx.fillRect(-30, -30, W + 60, H + 60); }
  ctx.restore();
  drawBars();
  if (over) {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 260, W, 150);
    ctx.fillStyle = '#ffd21a'; ctx.font = 'bold 64px Arial'; ctx.textAlign = 'center'; ctx.fillText(lastWinMsg, W / 2, 350);
    ctx.fillStyle = '#fff'; ctx.font = '24px Arial'; ctx.fillText('Nouveau combat dans quelques secondes…', W / 2, 392);
  }
  requestAnimationFrame(frame);
}

function handleMessage(d) {
  if (d.type === 'chat' || d.type === 'tiktok-chat') {
    const t = String(d.comment || d.message || '').trim(), u = d.uniqueId || d.username || d.nickname;
    if (u && t === '1') teams[u] = 'luffy'; else if (u && t === '2') teams[u] = 'goku';
  } else if (d.type === 'gift' || d.type === 'tiktok-gift') {
    const x = d.gift || d;
    onGift(x.uniqueId || x.username || x.nickname || 'inconnu', x.coinCount ?? ((x.coinValue ?? x.diamondCount ?? x.diamonds ?? 1) * (x.repeatCount || 1)));
  }
}
let ws;
document.getElementById('connect').onclick = () => {
  const u = document.getElementById('user').value.replace('@', '').trim(), live = document.getElementById('live');
  if (!u) return;
  try { ws = new WebSocket(document.getElementById('url').value); } catch (e) { live.textContent = 'URL invalide'; return; }
  ws.onopen = () => { ws.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username: u })); live.textContent = 'Connexion à @' + u + '…'; };
  ws.onmessage = e => { try { handleMessage(JSON.parse(e.data)); } catch (err) { } };
  ws.onclose = () => { live.textContent = 'Déconnecté'; };
};

document.getElementById('panelBtn').onclick = () => document.getElementById('panel').classList.toggle('hidden');
document.getElementById('toggleBoard').onclick = () => document.getElementById('board').classList.toggle('hidden');
document.getElementById('speed').oninput = e => { speed = +e.target.value; };
document.getElementById('reset').onclick = newMatch;
document.querySelectorAll('[data-sim]').forEach(b => b.onclick = () => { const [c, w] = b.dataset.sim.split(':'); teams.sim_test = w; act(w, +c, 'sim_test'); });
document.getElementById('simBig').onclick = () => ArcadeEffects.simulateBigGift('Alex_TikTok', 100);
document.getElementById('simShare').onclick = () => ArcadeEffects.simulateShare();
window.DuelAPI = { act, onGift, newMatch, fighters };
renderBoard();
requestAnimationFrame(frame);
</script>
</body>
</html>
