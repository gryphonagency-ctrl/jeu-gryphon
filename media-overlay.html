<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Overlay Griffon Arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage video, #stage img { display: none; }
#stage video { object-fit: contain; }
#status { position: fixed; left: 8px; bottom: 8px; font: 12px sans-serif; color: #fff; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 6px; }
#status.hide { display: none; }
#live-effects { position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
#live-stats { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); display: none; align-items: center; gap: 12px; max-width: calc(100vw - 20px); padding: 9px 13px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; background: rgba(14,18,30,.86); box-shadow: 0 4px 18px rgba(0,0,0,.3); color: #fff; font: 700 14px/1.2 Arial,sans-serif; transform: translateX(-50%); white-space: nowrap; }
#live-stats.visible { display: flex; }
body.likes-only #live-stats { display: none !important; }
body.mode-chat #stage, body.mode-chat #live-effects, body.mode-chat #live-stats, body.mode-chat #status,
body.mode-leaderboard #stage, body.mode-leaderboard #live-effects, body.mode-leaderboard #live-stats, body.mode-leaderboard #status,
body.mode-stats #stage, body.mode-stats #live-effects, body.mode-stats #status { display: none !important; }
body.mode-stats #live-stats.visible { position: fixed; top: 18px; left: 18px; bottom: auto; display: grid; transform: none; white-space: normal; border-radius: 14px; }
.live-stat { display: flex; align-items: center; gap: 5px; }
.live-stat strong { color: #ffd45a; font-variant-numeric: tabular-nums; }
.chat-overlay { position: fixed; left: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 9px; width: min(460px, calc(100vw - 36px)); color: #fff; font: 700 20px/1.3 Arial,sans-serif; }
.chat-message { display: flex; align-items: flex-start; gap: 10px; padding: 10px 13px; border: 1px solid rgba(255,255,255,.2); border-radius: 14px; background: rgba(8,12,24,.82); box-shadow: 0 4px 16px rgba(0,0,0,.24); overflow-wrap: anywhere; animation: chat-in .2s ease-out both; }
.chat-avatar { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: linear-gradient(135deg,#ff2e93,#ffd45a); }
.chat-copy { min-width: 0; display: grid; gap: 3px; }
.chat-name { color: #ffd45a; font-size: .78em; }
.chat-text { font-weight: 500; }
@keyframes chat-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.gift-leaderboard { position: fixed; top: 18px; right: 18px; width: min(360px, calc(100vw - 36px)); padding: 14px; border: 1px solid rgba(255,255,255,.24); border-radius: 16px; background: rgba(8,12,24,.86); box-shadow: 0 8px 26px rgba(0,0,0,.3); color: #fff; font: 700 16px/1.3 Arial,sans-serif; }
.gift-leaderboard[hidden] { display: none; }
.gift-leaderboard h2 { margin: 0 0 10px; color: #ffd45a; font-size: 1.05em; }
.gift-leaderboard-list { display: grid; gap: 8px; }
.gift-leaderboard-row { display: grid; grid-template-columns: 28px 34px minmax(0,1fr) auto; align-items: center; gap: 8px; min-height: 38px; }
.gift-leaderboard-rank { color: #ffd45a; text-align: center; }
.gift-leaderboard-avatar { width: 34px; height: 34px; border: 2px solid rgba(255,255,255,.75); border-radius: 50%; object-fit: cover; background: linear-gradient(135deg,#ff2e93,#ffd45a); }
.gift-leaderboard-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gift-leaderboard-coins { color: #9dffb0; white-space: nowrap; font-size: .85em; }
.like-bubble { position: absolute; bottom: calc(-1 * var(--like-avatar-size) - 44px); left: var(--bubble-x); display: flex; flex-direction: column; align-items: center; gap: 5px; width: var(--like-avatar-size); animation: like-float 2.8s ease-out forwards; }
.like-avatar { display: flex; align-items: center; justify-content: center; width: var(--like-avatar-size); height: var(--like-avatar-size); padding: 4px; border: 2px solid rgba(255,255,255,.9); border-radius: 50%; background: linear-gradient(135deg,#ff2e93,#ffd45a); box-shadow: 0 0 18px rgba(255,46,147,.65); box-sizing: border-box; }
.like-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.like-initial { color: #fff; font: 900 30px/1 Arial,sans-serif; }
.like-name { max-width: 130px; overflow: hidden; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,.7); color: #fff; font: 700 12px/1.4 Arial,sans-serif; text-overflow: ellipsis; white-space: nowrap; }
@keyframes like-float { 0% { transform: translateY(0) scale(.65); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(calc(-100vh - 150px)) scale(1.05); opacity: 0; } }
@media(max-width:480px) { #live-stats { gap: 8px; padding: 8px 10px; font-size: 12px; } }
</style>
</head>
<body>
<div id="stage"><video id="video" playsinline></video></div>
<div id="live-effects" aria-hidden="true"></div>
<div id="live-stats" aria-live="polite"></div>
<div id="chat-overlay" class="chat-overlay" aria-live="polite"></div>
<section id="gift-leaderboard" class="gift-leaderboard" aria-live="polite" hidden>
  <h2>🏆 Meilleurs donateurs</h2>
  <div id="gift-leaderboard-list" class="gift-leaderboard-list"></div>
</section>
<div id="status">Connexion…</div>
<script src="/overlay-firework.js"></script>
<script>
const token = location.pathname.split('/').pop();
const statusEl = document.getElementById('status');
const video = document.getElementById('video');
const params = new URLSearchParams(location.search);
const showStatus = params.get('statut') !== '0';
const requestedMode = params.get('mode');
const overlayMode = ['likes', 'chat', 'leaderboard', 'stats'].includes(requestedMode) ? requestedMode : 'alerts';
const showLiveEffects = overlayMode === 'likes';
const showAlertOverlay = overlayMode === 'alerts';
const showStatsOverlay = overlayMode === 'stats';
const chatRows = Math.max(3, Math.min(10, Math.floor(Number(params.get('rows')) || 5)));
const chatDuration = Math.max(3, Math.min(30, Math.floor(Number(params.get('duration')) || 8))) * 1000;
const leaderboardRows = Math.max(3, Math.min(10, Math.floor(Number(params.get('rows')) || 5)));
const requestedAvatarSize = Number(params.get('avatarSize'));
const likeAvatarSize = Number.isFinite(requestedAvatarSize)
  ? Math.max(44, Math.min(180, requestedAvatarSize))
  : 76;
document.documentElement.style.setProperty('--like-avatar-size', `${likeAvatarSize}px`);
if (showLiveEffects) document.body.classList.add('likes-only');
if (overlayMode === 'chat' || overlayMode === 'leaderboard') document.body.classList.add(`mode-${overlayMode}`);
const liveStatsEl = document.getElementById('live-stats');
const liveEffectsEl = document.getElementById('live-effects');
const chatOverlayEl = document.getElementById('chat-overlay');
const giftLeaderboardEl = document.getElementById('gift-leaderboard');
const giftLeaderboardListEl = document.getElementById('gift-leaderboard-list');
// Feu d'artifice : tous les cadeaux par défaut. ?seuil=50 pour changer, ?feu=0 pour désactiver, ?test=1 pour un aperçu.
const fireworkEnabled = params.get('feu') !== '0';
const fireworkThreshold = Math.max(1, Number(params.get('seuil')) || 1);
if (showAlertOverlay && params.get('test') === '1') {
  const demo = () => window.OverlayFirework.launch({ name: 'Username' });
  setTimeout(demo, 500);
  setInterval(demo, 4000);
}
let alerts = {};
let queue = [];
let playing = false;
let reconnectDelay = 3000;
let hideTimer = null;
const viewerAvatars = new Map();
const seenLiveEvents = new Set();
const liveStats = { followers: 0, likes: 0, gifts: 0, shares: 0, subscribers: 0 };
const giftLeaderboard = new Map();

function viewerKey(profile) {
  return String(profile?.uniqueId || profile?.username || profile?.nickname || '')
    .trim().replace(/^@/, '').toLocaleLowerCase();
}

function validImageUrl(value) {
  if (typeof value !== 'string' || value.length > 700000) return '';
  if (/^data:image\/(?:jpeg|png|webp|gif);base64,[a-z0-9+/]+=*$/i.test(value)) return value;
  try {
    const url = new URL(value, location.href);
    return url.protocol === 'https:' || url.origin === location.origin ? url.href : '';
  } catch {
    return '';
  }
}

function updateLiveStats(type, amount) {
  const count = Math.floor(Number(amount) || 0);
  if (!Number.isSafeInteger(count) || count < 1) return;
  liveStats[type] = Math.min(Number.MAX_SAFE_INTEGER, liveStats[type] + count);
  liveStatsEl.replaceChildren();
  for (const [key, label, icon] of [
    ['followers', 'Abonnés', '👥'],
    ['likes', 'J’aime', '❤️'],
    ['gifts', 'Pièces reçues', '🎁'],
    ['shares', 'Partages', '📣'],
    ['subscribers', 'Abonnements', '⭐']
  ]) {
    const item = document.createElement('span');
    item.className = 'live-stat';
    item.append(document.createTextNode(`${icon} ${label} `));
    const value = document.createElement('strong');
    value.textContent = liveStats[key].toLocaleString('fr-FR');
    item.appendChild(value);
    liveStatsEl.appendChild(item);
  }
  liveStatsEl.classList.add('visible');
}

function showLikeBubble(profile) {
  if (liveEffectsEl.children.length >= 10) liveEffectsEl.children[0].remove();
  const name = String(profile.uniqueId || profile.username || profile.nickname || 'Spectateur').replace(/^@/, '').slice(0, 40);
  const key = viewerKey(profile);
  const avatarUrl = Array.isArray(profile.avatarUrls)
    ? profile.avatarUrls.find(url => validImageUrl(url))
    : '';
  const avatar = validImageUrl(profile.avatarDataUri || profile.avatarUrl || viewerAvatars.get(key) || avatarUrl);
  const bubble = document.createElement('div');
  bubble.className = 'like-bubble';
  bubble.style.setProperty('--bubble-x', `${Math.random() * Math.max(0, window.innerWidth - likeAvatarSize)}px`);
  const orb = document.createElement('div');
  orb.className = 'like-avatar';
  if (avatar) {
    const sources = [
      validImageUrl(profile.avatarDataUri),
      validImageUrl(viewerAvatars.get(key)),
      validImageUrl(profile.avatarUrl),
      avatarUrl && validImageUrl(avatarUrl)
    ].filter(Boolean);
    const showAvatar = index => {
      if (index >= sources.length) {
        const initial = document.createElement('span');
        initial.className = 'like-initial';
        initial.textContent = (name[0] || '?').toUpperCase();
        orb.appendChild(initial);
        return;
      }
      const image = document.createElement('img');
      image.alt = '';
      image.referrerPolicy = 'no-referrer';
      image.src = sources[index];
      image.onerror = () => { image.remove(); showAvatar(index + 1); };
      orb.appendChild(image);
    };
    showAvatar(0);
  } else {
    const initial = document.createElement('span');
    initial.className = 'like-initial';
    initial.textContent = (name[0] || '?').toUpperCase();
    orb.appendChild(initial);
  }
  const label = document.createElement('span');
  label.className = 'like-name';
  label.textContent = `@${name}`;
  bubble.append(orb, label);
  liveEffectsEl.appendChild(bubble);
  bubble.addEventListener('animationend', () => bubble.remove(), { once: true });
}

function addChatMessage(commentData) {
  const text = String(commentData.comment || '').trim().slice(0, 500);
  if (!text) return;
  const name = String(commentData.nickname || commentData.uniqueId || commentData.username || 'Spectateur')
    .replace(/^@/, '').slice(0, 80);
  const message = document.createElement('article');
  message.className = 'chat-message';
  const avatarUrl = validImageUrl(commentData.avatarUrl || commentData.avatarDataUri);
  const avatar = document.createElement(avatarUrl ? 'img' : 'span');
  avatar.className = 'chat-avatar';
  if (avatarUrl) {
    avatar.alt = '';
    avatar.referrerPolicy = 'no-referrer';
    avatar.src = avatarUrl;
  } else {
    avatar.textContent = (name[0] || '?').toUpperCase();
    avatar.style.display = 'grid';
    avatar.style.placeItems = 'center';
  }
  const copy = document.createElement('div');
  copy.className = 'chat-copy';
  const author = document.createElement('strong');
  author.className = 'chat-name';
  author.textContent = `@${name}`;
  const content = document.createElement('span');
  content.className = 'chat-text';
  content.textContent = text;
  copy.append(author, content);
  message.append(avatar, copy);
  chatOverlayEl.appendChild(message);
  while (chatOverlayEl.children.length > chatRows) chatOverlayEl.firstElementChild.remove();
  setTimeout(() => message.remove(), chatDuration);
}

function renderGiftLeaderboard() {
  const leaders = Array.from(giftLeaderboard.values())
    .sort((a, b) => b.coins - a.coins || a.name.localeCompare(b.name))
    .slice(0, leaderboardRows);
  giftLeaderboardListEl.replaceChildren();
  giftLeaderboardEl.hidden = leaders.length === 0;
  leaders.forEach((leader, index) => {
    const row = document.createElement('div');
    row.className = 'gift-leaderboard-row';
    const rank = document.createElement('strong');
    rank.className = 'gift-leaderboard-rank';
    rank.textContent = String(index + 1);
    const avatarUrl = validImageUrl(leader.avatar || viewerAvatars.get(leader.key));
    const avatar = document.createElement(avatarUrl ? 'img' : 'span');
    avatar.className = 'gift-leaderboard-avatar';
    if (avatarUrl) {
      avatar.alt = '';
      avatar.referrerPolicy = 'no-referrer';
      avatar.src = avatarUrl;
    } else {
      avatar.textContent = (leader.name[0] || '?').toUpperCase();
      avatar.style.display = 'grid';
      avatar.style.placeItems = 'center';
    }
    const name = document.createElement('span');
    name.className = 'gift-leaderboard-name';
    name.textContent = leader.name;
    const coins = document.createElement('strong');
    coins.className = 'gift-leaderboard-coins';
    coins.textContent = `${leader.coins.toLocaleString('fr-FR')} pièces`;
    row.append(rank, avatar, name, coins);
    giftLeaderboardListEl.appendChild(row);
  });
}

function addGiftToLeaderboard(gift) {
  const key = viewerKey(gift) || String(gift.userId || '').trim();
  const coins = Math.floor(Number(gift.coinCount) || 0);
  if (!key || !Number.isSafeInteger(coins) || coins < 1) return;
  const current = giftLeaderboard.get(key) || {
    key,
    name: String(gift.nickname || gift.uniqueId || gift.username || 'Spectateur').replace(/^@/, '').slice(0, 80),
    coins: 0,
    avatar: ''
  };
  current.coins = Math.min(Number.MAX_SAFE_INTEGER, current.coins + coins);
  current.avatar = validImageUrl(gift.avatarUrl || gift.avatarDataUri || gift.avatarUrls?.[0]) || current.avatar;
  giftLeaderboard.set(key, current);
  renderGiftLeaderboard();
}

function firstLiveEvent(type, data) {
  const id = String(data.messageId || '');
  if (!id) return true;
  const key = `${type}:${id}`;
  if (seenLiveEvents.has(key)) return false;
  seenLiveEvents.add(key);
  if (seenLiveEvents.size > 2000) seenLiveEvents.delete(seenLiveEvents.values().next().value);
  return true;
}

function setStatus(text) {
  statusEl.textContent = text;
  statusEl.classList.toggle('hide', !showStatus);
  clearTimeout(hideTimer);
  if (/connecté/i.test(text) && !/erreur/i.test(text)) hideTimer = setTimeout(() => statusEl.classList.add('hide'), 5000);
}

async function loadAlerts() {
  try {
    const res = await fetch(`/api/overlay-alerts?token=${encodeURIComponent(token)}`, { cache: 'no-store' });
    if (res.ok) alerts = (await res.json()).alerts || {};
    else setStatus('Lien overlay invalide ou révoqué.');
  } catch (error) { console.warn('Alertes indisponibles :', error); }
}

const slug = text => String(text || '').trim().toLowerCase().replace(/[^a-z0-9_ -]/g, '').replace(/ +/g, '_');

function pickAlert(event, allowMultipliers) {
  const keys = [];
  if (event.type === 'follow') keys.push('follow');
  else if (event.type === 'subscribe') keys.push('sub');
  else if (event.type === 'share') keys.push('share');
  else if (event.type === 'gift') {
    const name = String(event.gift?.giftName || '');
    const fromName = /(?:^|[\s_-])x\s?(\d{1,3})$/i.exec(name);
    const multiplier = Math.max(Number(event.gift?.repeatCount) || 1, fromName ? Number(fromName[1]) : 1);
    const item = slug(name.replace(/[\s_-]*x\s?\d{1,3}$/i, ''));
    if (allowMultipliers && multiplier > 1) keys.push(`gift_${item}_x${multiplier}`);
    if (allowMultipliers && multiplier > 1) keys.push(`multi_x${multiplier}`);
    keys.push(`gift_${item}`, `gift_${slug(name)}`);
    keys.push('gift_tous');
  }
  for (const key of keys) {
    const alert = alerts[key];
    if (alert && (alert.audioUrl || alert.videoUrl)) return alert;
  }
  return null;
}

function playAlert(alert) {
  return new Promise(resolve => {
    let pending = 0;
    let finished = false;
    const done = () => {
      if (finished) return;
      if (--pending > 0) return;
      finished = true;
      video.style.display = 'none';
      video.removeAttribute('src');
      resolve();
    };
    const guard = setTimeout(() => { pending = 1; done(); }, 60000);
    const end = () => { clearTimeout(guard); done(); };
    if (alert.audioUrl) {
      pending++;
      const audio = new Audio(alert.audioUrl);
      audio.onended = audio.onerror = end;
      audio.play().catch(end);
    }
    if (alert.videoUrl) {
      pending++;
      video.volume = Number.isFinite(alert.videoVolume)
        ? Math.min(1, Math.max(0, alert.videoVolume))
        : 1;
      const width = Number.isFinite(alert.videoWidth) ? Math.min(150, Math.max(25, alert.videoWidth)) : 100;
      const height = Number.isFinite(alert.videoHeight) ? Math.min(150, Math.max(25, alert.videoHeight)) : 100;
      video.style.width = `${width}vw`;
      video.style.height = `${height}vh`;
      video.style.objectFit = alert.videoFit === 'cover' ? 'cover' : 'contain';
      video.src = alert.videoUrl;
      video.style.display = 'block';
      video.onended = video.onerror = end;
      video.play().catch(end);
    }
    if (!pending) { clearTimeout(guard); resolve(); }
  });
}

async function drain() {
  if (playing) return;
  playing = true;
  while (queue.length) await playAlert(queue.shift());
  playing = false;
}

function connect() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const socket = new WebSocket(`${protocol}//${location.host}/media-overlay-relay?token=${encodeURIComponent(token)}`);
  socket.addEventListener('open', () => { reconnectDelay = 3000; loadAlerts(); });
  socket.addEventListener('message', async event => {
    let data;
    try { data = JSON.parse(event.data); } catch { return; }
    if (data.type === 'TTS_CONFIG') {
      socket.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username: data.username }));
    } else if (data.type === 'STATUS') {
      setStatus(data.message || '');
    } else if (data.type === 'LIVE_END') {
      giftLeaderboard.clear();
      renderGiftLeaderboard();
      chatOverlayEl.replaceChildren();
      for (const key of Object.keys(liveStats)) liveStats[key] = 0;
      liveStatsEl.replaceChildren();
      liveStatsEl.classList.remove('visible');
    } else if (data.type === 'viewer' && data.viewer) {
      const key = viewerKey(data.viewer);
      const avatar = validImageUrl(data.viewer.avatarDataUri || data.viewer.avatarUrl);
      if (key && avatar) {
        viewerAvatars.set(key, avatar);
        if (viewerAvatars.size > 500) viewerAvatars.delete(viewerAvatars.keys().next().value);
        if (overlayMode === 'leaderboard' && giftLeaderboard.has(key)) renderGiftLeaderboard();
      }
    } else {
      if (overlayMode === 'chat' && data.type === 'comment' && data.commentData &&
          firstLiveEvent('comment', data.commentData)) {
        addChatMessage(data.commentData);
      } else if (overlayMode === 'leaderboard' && data.type === 'gift' && data.gift &&
          firstLiveEvent('gift', data.gift)) {
        addGiftToLeaderboard(data.gift);
      }
      if (showStatsOverlay) {
        if (data.type === 'follow' && firstLiveEvent('follow', data.followData || data.eventData || {})) {
          updateLiveStats('followers', 1);
        } else if (data.type === 'like' && data.likeData && firstLiveEvent('like', data.likeData)) {
          updateLiveStats('likes', data.likeData.likeCount);
        } else if (data.type === 'gift' && data.gift && firstLiveEvent('gift', data.gift)) {
          updateLiveStats('gifts', data.gift.coinCount);
        } else if (data.type === 'share' && firstLiveEvent('share', data.shareData || {})) {
          updateLiveStats('shares', 1);
        } else if (data.type === 'subscribe' && firstLiveEvent('subscribe', data.subscribeData || {})) {
          updateLiveStats('subscribers', 1);
        }
      }
      if (showLiveEffects && data.type === 'follow' &&
          firstLiveEvent('follow', data.followData || data.eventData || {})) {
        updateLiveStats('followers', 1);
      } else if (showLiveEffects && data.type === 'like' && data.likeData &&
          firstLiveEvent('like', data.likeData)) {
        const like = data.likeData;
        const count = Math.floor(Number(like.likeCount) || 0);
        if (Number.isSafeInteger(count) && count > 0) {
          updateLiveStats('likes', count);
          showLikeBubble(like);
        }
      }
      if (showAlertOverlay &&
          (data.type === 'follow' || data.type === 'subscribe' || data.type === 'share' || data.type === 'gift')) {
        if (data.type === 'gift' && fireworkEnabled && Number(data.gift?.coinCount) >= fireworkThreshold) {
          const gift = data.gift;
          const giftKey = viewerKey(gift);
          window.OverlayFirework.launch({
            name: gift.nickname || gift.uniqueId || gift.username,
            imageUrl: validImageUrl(gift.giftImageUrl || gift.giftImageUrls?.[0]),
            avatarUrl: validImageUrl(
              gift.avatarDataUri ||
              viewerAvatars.get(giftKey) ||
              gift.avatarUrls?.find(url => validImageUrl(url)) ||
              gift.avatarUrl
            )
          });
        }
        await loadAlerts();
        const alert = pickAlert(data, data.matchLive === true);
        if (alert && queue.length < 20) { queue.push(alert); drain(); }
      }
    }
  });
  socket.addEventListener('close', () => {
    setStatus('Overlay déconnecté. Nouvelle tentative…');
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
  });
}

if (overlayMode === 'chat' && params.get('test') === '1') {
  ['Salut tout le monde !', 'Super live 🦁', 'On joue à quoi ?', 'Bravo pour le jeu !', 'Coucou !'].forEach((comment, index) => {
    addChatMessage({ uniqueId: `spectateur_${index + 1}`, nickname: `Spectateur ${index + 1}`, comment });
  });
} else if (overlayMode === 'leaderboard' && params.get('test') === '1') {
  [
    { uniqueId: 'lion_test', nickname: 'Lion Test', coinCount: 500 },
    { uniqueId: 'rose_test', nickname: 'Rose Test', coinCount: 250 },
    { uniqueId: 'etoile_test', nickname: 'Étoile Test', coinCount: 100 }
  ].forEach(addGiftToLeaderboard);
} else if (showStatsOverlay && params.get('test') === '1') {
  updateLiveStats('followers', 23);
  updateLiveStats('likes', 1840);
  updateLiveStats('gifts', 1250);
