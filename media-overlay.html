<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Overlay Griffon Arcade</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#stage video, #stage img { display: none; }
#stage video { object-fit: contain; }
#status { position: fixed; left: 8px; bottom: 8px; font: 12px sans-serif; color: #fff; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 6px; }
#status.hide { display: none; }
#alert-audio-unlock { position: fixed; z-index: 31; top: max(10px, env(safe-area-inset-top)); right: 12px; padding: 9px 14px; border: 1px solid rgba(255,255,255,.55); border-radius: 999px; background: rgba(8,12,24,.9); color: #fff; font: 700 14px Arial,sans-serif; cursor: pointer; }
#alert-audio-unlock[hidden] { display: none; }
#alert-video-unlock { position: fixed; z-index: 30; top: max(10px, env(safe-area-inset-top)); left: 50%; padding: 9px 14px; border: 1px solid rgba(255,255,255,.55); border-radius: 999px; background: rgba(8,12,24,.9); color: #fff; font: 700 14px Arial,sans-serif; cursor: pointer; transform: translateX(-50%); }
#alert-video-unlock[hidden] { display: none; }
#live-effects { position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
#live-stats { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); display: none; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; max-width: calc(100vw - 20px); padding: 18px 13px 9px; border: 1px solid rgba(82,231,224,.78); border-radius: 16px; background: radial-gradient(150px 70px at 88% 0,rgba(49,220,207,.24),transparent 80%),linear-gradient(130deg,rgba(6,34,65,.96),rgba(7,78,82,.94)); box-shadow: 0 7px 25px rgba(0,12,24,.55),0 0 18px rgba(49,220,207,.18); color: #f0ffff; font: 700 13px/1.2 "Trebuchet MS",Arial,sans-serif; transform: translateX(-50%); white-space: normal; }
#live-stats.visible { display: flex; }
#live-stats::before { content: "COMPTEURS DU LIVE"; position: absolute; top: -11px; left: 13px; padding: 4px 10px; border: 1px solid rgba(135,255,239,.75); border-radius: 999px; background: linear-gradient(100deg,#087d92,#18b8a7); color: #f0ffff; font: 800 10px/1 "Trebuchet MS",Arial,sans-serif; letter-spacing: .12em; box-shadow: 0 3px 9px rgba(0,0,0,.35); }
body.likes-only #live-stats { display: none !important; }
body.mode-chat #stage, body.mode-chat #live-effects, body.mode-chat #live-stats, body.mode-chat #status,
body.mode-leaderboard #stage, body.mode-leaderboard #live-effects, body.mode-leaderboard #live-stats, body.mode-leaderboard #status,
body.mode-stats #stage, body.mode-stats #live-effects, body.mode-stats #status,
body.mode-timer #stage, body.mode-timer #live-effects, body.mode-timer #live-stats, body.mode-timer #chat-overlay, body.mode-timer #gift-leaderboard, body.mode-timer #status,
body.mode-wheel #stage, body.mode-wheel #live-effects, body.mode-wheel #live-stats, body.mode-wheel #chat-overlay, body.mode-wheel #gift-leaderboard, body.mode-wheel #status,
body.mode-carousel #stage, body.mode-carousel #live-effects, body.mode-carousel #live-stats, body.mode-carousel #chat-overlay, body.mode-carousel #gift-leaderboard, body.mode-carousel #status { display: none !important; }
body.mode-stats #live-stats.visible { position: fixed; top: 18px; left: 18px; bottom: auto; display: grid; transform: none; white-space: normal; border-radius: 14px; }
.tool-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 18px; color: #fff; font: 700 20px/1.3 Arial,sans-serif; }
.tool-overlay[hidden] { display: none; }
.tool-card { display: grid; justify-items: center; gap: 16px; max-width: min(94vw, 680px); padding: 24px; border: 1px solid rgba(255,255,255,.32); border-radius: 22px; background: rgba(8,12,24,.88); box-shadow: 0 8px 30px rgba(0,0,0,.35); text-align: center; }
.tool-title { margin: 0; color: #ffd45a; font-size: clamp(20px, 4vw, 34px); }
.mode-timer .tool-card { border-color: rgba(255,190,115,.78); background: radial-gradient(170px 100px at 80% 0,rgba(255,182,95,.2),transparent 75%),linear-gradient(145deg,rgba(67,28,12,.97),rgba(31,18,41,.96)); box-shadow: 0 10px 34px rgba(0,0,0,.48),0 0 22px rgba(255,155,67,.2); font-family: "Courier New",monospace; }
.mode-timer .tool-card::before { content: "COMPTE À REBOURS · AMBRE"; display: block; width: 100%; padding: 9px 12px; border: 1px solid rgba(255,214,155,.45); border-radius: 10px; background: linear-gradient(100deg,#8b381e,#d8722c,#edae57); color: #fff5e8; font: 800 11px/1.2 "Courier New",monospace; letter-spacing: .12em; }
.mode-timer .tool-title { color: #ffd59d; font-family: "Trebuchet MS",Arial,sans-serif; }
.mode-timer .timer-display { color: #fff6eb; font-family: "Courier New",monospace; text-shadow: 0 0 24px rgba(255,160,79,.6); }
.mode-wheel .tool-card { border-color: rgba(176,240,154,.75); background: radial-gradient(190px 110px at 50% 0,rgba(154,225,129,.2),transparent 78%),linear-gradient(145deg,rgba(18,55,42,.96),rgba(17,25,55,.96)); box-shadow: 0 10px 34px rgba(0,0,0,.45),0 0 24px rgba(159,239,125,.18); font-family: "Lucida Sans",Arial,sans-serif; }
.mode-wheel .tool-card::before { content: "ROUE INTERACTIVE · VERT PRAIRIE"; display: block; width: 100%; padding: 9px 12px; border: 1px solid rgba(208,255,180,.45); border-radius: 10px; background: linear-gradient(100deg,#267749,#6bae52,#b7d875); color: #0d2b19; font: 800 11px/1.2 "Lucida Sans",Arial,sans-serif; letter-spacing: .1em; }
.timer-display { color: #fff; font-size: clamp(52px, 14vw, var(--timer-font-size, 112px)); font-variant-numeric: tabular-nums; line-height: 1; text-shadow: 0 0 24px rgba(114,220,255,.45); }
.timer-controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.timer-controls button, .wheel-spin { padding: 10px 18px; border: 0; border-radius: 999px; background: var(--tool-accent, #72dcff); color: #04101f; font: 800 16px Arial,sans-serif; cursor: pointer; }
.timer-controls button:focus-visible, .wheel-spin:focus-visible { outline: 3px solid #ffd45a; outline-offset: 3px; }
.wheel-wrap { position: relative; width: min(var(--wheel-size, 72vw), 440px); aspect-ratio: 1; }
.wheel-svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); }
.wheel-segment { stroke-width: 4; filter: drop-shadow(0 0 4px var(--segment-neon)); transition: filter .35s ease, stroke .35s ease, stroke-width .35s ease; }
.wheel-segment.wheel-winner { stroke: #fff5a6; stroke-width: 8; filter: drop-shadow(0 0 8px #fff5a6); }
.wheel-rim { fill: none; stroke: url(#wheel-neon-gradient); stroke-width: 5; stroke-dasharray: 1 10; stroke-linecap: round; opacity: .78; filter: drop-shadow(0 0 3px rgba(114,220,255,.32)); pointer-events: none; }
.wheel-neon { opacity: .58; animation: wheel-neon-pulse 1.2s ease-in-out infinite alternate; }
.wheel-logo { position: absolute; z-index: 1; top: 50%; left: 50%; display: grid; width: 50px; aspect-ratio: 1; place-items: center; border-radius: 50%; color: #081224; font: 900 34px/1 Arial,sans-serif; transform: translate(-50%,-50%); pointer-events: none; }
@keyframes wheel-neon-pulse {
  from { opacity: .45; filter: drop-shadow(0 0 2px var(--neon-color)); }
  to { opacity: 1; filter: drop-shadow(0 0 8px var(--neon-color)); }
}
@media (prefers-reduced-motion: reduce) { .wheel-neon { animation: none; opacity: .9; } }
.wheel-pointer { position: absolute; z-index: 1; top: -4px; left: 50%; width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 34px solid var(--wheel-pointer-color, #fff); filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); transform: translateX(-50%); }
.wheel-spin:disabled { opacity: .6; cursor: wait; }
#gift-carousel { position: fixed; inset: 0; display: flex; align-items: center; overflow: hidden; }
#gift-carousel[hidden] { display: none; }
.gift-carousel-track { display: flex; align-items: center; width: max-content; will-change: transform; animation: gift-carousel-scroll var(--carousel-duration, 30s) linear infinite; }
.gift-carousel-card { position: relative; display: flex; flex: 0 0 min(var(--carousel-item-size, 220px), 55vw); width: min(var(--carousel-item-size, 220px), 55vw); height: min(var(--carousel-item-height, 250px), 45vh); margin-right: 12px; align-items: center; justify-content: center; overflow: visible; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
.gift-carousel-card img { display: block; width: 100%; height: 100%; border: 0; outline: 0; object-fit: contain; filter: none; box-shadow: none; }
.gift-carousel-placeholder { color: #ffd45a; font-size: 112px; line-height: 1; }
.gift-carousel-action { position: absolute; right: 4px; bottom: 8px; left: 4px; padding: 5px 8px; color: var(--carousel-text-color, #fff); font: 900 clamp(18px, 3vw, 28px)/1.1 Arial,sans-serif; text-align: center; text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000, 0 4px 8px #000; overflow-wrap: anywhere; }
.gift-carousel-empty { padding: 16px; border-radius: 12px; background: rgba(8,12,24,.82); color: #fff; font: 700 18px Arial,sans-serif; }
#gift-carousel-title { position: absolute; z-index: 1; top: 16px; left: 50%; max-width: calc(100vw - 72px); margin: 0; padding: 10px 20px; border: 1px solid rgba(202,180,255,.7); border-radius: 12px; background: linear-gradient(105deg,rgba(59,38,103,.96),var(--carousel-panel-color,rgba(8,12,24,.86)),rgba(24,78,96,.94)); color: var(--carousel-text-color, #fff); font: 900 clamp(20px, 4vw, 36px)/1.1 "Trebuchet MS",Arial,sans-serif; text-align: center; text-shadow: 0 2px 6px #000; box-shadow: 0 5px 20px rgba(0,0,0,.45); transform: translateX(-50%); }
#gift-carousel-arrow { position: absolute; z-index: 1; top: 50%; right: 18px; color: var(--carousel-arrow-color, #ffd45a); font: 900 clamp(32px, 6vw, 64px)/1 Arial,sans-serif; text-shadow: 0 2px 8px #000; transform: translateY(-50%); pointer-events: none; }
#gift-carousel-audio-unlock { position: absolute; z-index: 2; top: 16px; left: 16px; max-width: calc(50vw - 24px); padding: 9px 13px; border: 1px solid rgba(255,255,255,.55); border-radius: 999px; background: rgba(8,12,24,.88); color: #fff; font: 700 14px Arial,sans-serif; cursor: pointer; }
#gift-carousel-audio-unlock[hidden] { display: none; }
#gift-carousel-audio-unlock:disabled { opacity: .8; }
@keyframes gift-carousel-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.live-stat { display: flex; align-items: center; gap: 5px; padding: 5px 8px; border: 1px solid rgba(120,248,232,.23); border-radius: 999px; background: rgba(1,24,44,.64); }
.live-stat strong { color: #8dffe6; font-variant-numeric: tabular-nums; }
.chat-overlay { position: fixed; left: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 9px; width: min(460px, calc(100vw - 36px)); color: #f2ffff; font: 700 19px/1.3 "Trebuchet MS",Arial,sans-serif; }
.chat-overlay:not(:empty)::before { content: "CHAT DU LIVE"; align-self: flex-start; padding: 7px 13px; border: 1px solid rgba(126,242,235,.65); border-radius: 10px 10px 10px 3px; background: linear-gradient(105deg,rgba(8,104,121,.96),rgba(25,74,130,.94) 58%,rgba(102,61,154,.94)); color: #ecffff; font: 800 11px/1.1 "Trebuchet MS",Arial,sans-serif; letter-spacing: .14em; box-shadow: 0 4px 12px rgba(0,0,0,.38); }
.chat-message { display: flex; align-items: flex-start; gap: 10px; padding: 10px 13px; border: 1px solid rgba(112,226,228,.48); border-left: 4px solid #6be4d0; border-radius: 4px 14px 14px 14px; background: linear-gradient(110deg,rgba(6,42,66,.96),rgba(26,38,80,.92) 68%,rgba(69,34,87,.9)); box-shadow: 0 5px 18px rgba(0,0,0,.32); overflow-wrap: anywhere; animation: chat-in .2s ease-out both; }
.chat-avatar { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: linear-gradient(135deg,#ff2e93,#ffd45a); }
.chat-copy { min-width: 0; display: grid; gap: 3px; }
.chat-name { color: #93f5e2; font-size: .78em; }
.chat-text { font-weight: 500; }
@keyframes chat-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.gift-leaderboard { position: fixed; top: 18px; right: 18px; width: min(360px, calc(100vw - 36px)); padding: 12px; border: 1px solid rgba(213,178,255,.78); border-radius: 6px 18px 18px 18px; background: radial-gradient(160px 90px at 100% 0,rgba(212,161,255,.23),transparent 75%),linear-gradient(145deg,rgba(36,20,68,.97),rgba(23,26,56,.96)); box-shadow: 0 9px 28px rgba(0,0,0,.42),0 0 18px rgba(183,139,255,.15); color: #fff8e9; font: 700 16px/1.3 Georgia,"Times New Roman",serif; }
.gift-leaderboard[hidden] { display: none; }
.gift-leaderboard h2 { margin: 0 0 10px; padding: 9px 11px; border: 1px solid rgba(255,219,145,.48); border-radius: 5px 12px 12px 12px; background: linear-gradient(105deg,#624291,#9d70c7 58%,#b98146); color: #fff4d8; font: 800 1em/1.2 Georgia,"Times New Roman",serif; text-shadow: 0 2px 4px rgba(0,0,0,.45); }
.gift-leaderboard-list { display: grid; gap: 8px; }
.gift-leaderboard-row { display: grid; grid-template-columns: 28px 34px minmax(0,1fr) auto; align-items: center; gap: 8px; min-height: 38px; padding: 5px 8px; border: 1px solid rgba(221,192,255,.2); border-radius: 10px; background: rgba(18,13,44,.72); }
.gift-leaderboard-rank { color: #ffe09a; text-align: center; font-family: Georgia,"Times New Roman",serif; }
.gift-leaderboard-avatar { width: 34px; height: 34px; border: 2px solid rgba(255,255,255,.75); border-radius: 50%; object-fit: cover; background: linear-gradient(135deg,#ff2e93,#ffd45a); }
.gift-leaderboard-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gift-leaderboard-coins { color: #b7ffca; white-space: nowrap; font-size: .85em; }
.like-bubble { position: absolute; bottom: calc(-1 * var(--like-avatar-size) - 44px); left: var(--bubble-x); display: flex; flex-direction: column; align-items: center; gap: 5px; width: var(--like-avatar-size); animation: like-float 2.8s ease-out forwards; }
.like-avatar { display: flex; align-items: center; justify-content: center; width: var(--like-avatar-size); height: var(--like-avatar-size); padding: 4px; border: 2px solid rgba(255,255,255,.9); border-radius: 50%; background: linear-gradient(135deg,#ff2e93,#ffd45a); box-shadow: 0 0 18px rgba(255,46,147,.65); box-sizing: border-box; }
.like-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.like-initial { color: #fff; font: 900 30px/1 Arial,sans-serif; }
.like-name { max-width: 130px; overflow: hidden; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,.7); color: #fff; font: 700 12px/1.4 Arial,sans-serif; text-overflow: ellipsis; white-space: nowrap; }
@keyframes like-float { 0% { transform: translateY(0) scale(.65); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(calc(-100vh - 150px)) scale(1.05); opacity: 0; } }
@media(max-width:480px) { #live-stats { gap: 6px; padding: 18px 9px 8px; font-size: 11px; } .live-stat { padding: 4px 6px; } .chat-overlay { left: 10px; bottom: 10px; width: min(430px,calc(100vw - 20px)); font-size: 16px; } .gift-leaderboard { top: 12px; right: 10px; width: min(330px,calc(100vw - 20px)); } }
</style>
</head>
<body>
<div id="stage"><video id="video" playsinline></video></div>
<div id="live-effects" aria-hidden="true"></div>
<div id="live-stats" aria-live="polite"></div>
<div id="chat-overlay" class="chat-overlay" aria-live="polite"></div>
<section id="gift-leaderboard" class="gift-leaderboard" aria-live="polite" hidden>
  <h2>🏆 Meilleurs donateurs</h2>
  <div id="gift-leaderboard-list" class="gift-leaderboard-list"></div>
</section>
<section id="timer-overlay" class="tool-overlay" aria-label="Compte à rebours" hidden>
  <div class="tool-card">
    <h1 id="timer-title" class="tool-title">Compte à rebours</h1>
    <output id="timer-display" class="timer-display" aria-live="off">05:00</output>
    <div class="timer-controls">
      <button id="timer-start" type="button">Démarrer</button>
      <button id="timer-pause" type="button">Pause</button>
      <button id="timer-reset" type="button">Remettre à zéro</button>
    </div>
  </div>
</section>
<section id="wheel-overlay" class="tool-overlay" aria-label="Roue" hidden>
  <div class="tool-card">
    <div class="wheel-wrap">
      <div class="wheel-pointer" aria-hidden="true"></div>
      <span class="wheel-logo" aria-hidden="true">G</span>
      <div id="wheel-visual">
        <svg id="wheel-svg" class="wheel-svg" viewBox="0 0 500 500" role="img" aria-label="Roue à cases colorées"></svg>
      </div>
    </div>
    <button id="wheel-spin" class="wheel-spin" type="button">Lancer la roue</button>
  </div>
</section>
<section id="gift-carousel" aria-label="Carrousel de cadeaux TikTok" hidden>
  <button id="gift-carousel-audio-unlock" type="button">🔊 Activer et tester les sons</button>
  <h1 id="gift-carousel-title"></h1>
  <div id="gift-carousel-track" class="gift-carousel-track"></div>
  <span id="gift-carousel-arrow" aria-hidden="true">→</span>
</section>
<div id="status">Connexion…</div>
<button id="alert-audio-unlock" type="button" hidden>🔊 Activer le son des alertes</button>
<button id="alert-video-unlock" type="button" hidden>🔊 Activer le son de la vidéo</button>
<script src="/overlay-firework.js"></script>
<script>
const token = location.pathname.split('/').pop();
const statusEl = document.getElementById('status');
const video = document.getElementById('video');
const alertAudioUnlockEl = document.getElementById('alert-audio-unlock');
const alertVideoUnlockEl = document.getElementById('alert-video-unlock');
let alertVideoForUnlock = null;
const blockedAlertAudio = new Map();
const params = new URLSearchParams(location.search);
const showStatus = params.get('statut') !== '0';
const requestedMode = params.get('mode');
const overlayMode = ['likes', 'chat', 'leaderboard', 'stats', 'timer', 'wheel', 'carousel'].includes(requestedMode) ? requestedMode : 'alerts';
const showLiveEffects = overlayMode === 'likes';
const showAlertOverlay = overlayMode === 'alerts';
const showStatsOverlay = overlayMode === 'stats';
const showTimerOverlay = overlayMode === 'timer';
const showWheelOverlay = overlayMode === 'wheel';
const showGiftCarousel = overlayMode === 'carousel';
function colorParam(name, fallback) {
  const value = params.get(name);
  return value && /^#[0-9a-f]{6}$/i.test(value) ? value : fallback;
}
const chatRows = Math.max(3, Math.min(10, Math.floor(Number(params.get('rows')) || 5)));
const chatDuration = Math.max(3, Math.min(30, Math.floor(Number(params.get('duration')) || 8))) * 1000;
const leaderboardRows = Math.max(3, Math.min(10, Math.floor(Number(params.get('rows')) || 5)));
const requestedAvatarSize = Number(params.get('avatarSize'));
const likeAvatarSize = Number.isFinite(requestedAvatarSize)
  ? Math.max(44, Math.min(180, requestedAvatarSize))
  : 76;
document.documentElement.style.setProperty('--like-avatar-size', `${likeAvatarSize}px`);
if (showLiveEffects) document.body.classList.add('likes-only');
if (['chat', 'leaderboard', 'stats', 'timer', 'wheel', 'carousel'].includes(overlayMode)) document.body.classList.add(`mode-${overlayMode}`);
const liveStatsEl = document.getElementById('live-stats');
const liveEffectsEl = document.getElementById('live-effects');
const chatOverlayEl = document.getElementById('chat-overlay');
const giftLeaderboardEl = document.getElementById('gift-leaderboard');
const giftLeaderboardListEl = document.getElementById('gift-leaderboard-list');
const timerOverlayEl = document.getElementById('timer-overlay');
const wheelOverlayEl = document.getElementById('wheel-overlay');
const giftCarouselEl = document.getElementById('gift-carousel');
const giftCarouselTrackEl = document.getElementById('gift-carousel-track');
const giftCarouselTitleEl = document.getElementById('gift-carousel-title');
const giftCarouselArrowEl = document.getElementById('gift-carousel-arrow');
const giftCarouselAudioUnlockEl = document.getElementById('gift-carousel-audio-unlock');
timerOverlayEl.hidden = !showTimerOverlay;
wheelOverlayEl.hidden = !showWheelOverlay;
giftCarouselEl.hidden = !showGiftCarousel;
giftCarouselAudioUnlockEl.hidden = !showGiftCarousel;
// Feu d'artifice : tous les cadeaux par défaut. ?seuil=50 pour changer, ?feu=0 pour désactiver, ?test=1 pour un aperçu.
const fireworkEnabled = params.get('feu') !== '0';
const fireworkThreshold = Math.max(1, Number(params.get('seuil')) || 1);
if (showAlertOverlay && params.get('test') === '1') {
  const demo = () => window.OverlayFirework.launch({ name: 'Username' });
  setTimeout(demo, 500);
  setInterval(demo, 4000);
}
let alerts = {};
let queue = [];
let playing = false;
let reconnectDelay = 3000;
let hideTimer = null;
const viewerAvatars = new Map();
const seenLiveEvents = new Set();
const liveStats = { followers: 0, likes: 0, gifts: 0, shares: 0, subscribers: 0 };
const giftLeaderboard = new Map();

function viewerKey(profile) {
  return String(profile?.uniqueId || profile?.username || profile?.nickname || '')
    .trim().replace(/^@/, '').toLocaleLowerCase();
}

function validImageUrl(value) {
  if (typeof value !== 'string' || value.length > 700000) return '';
  if (/^data:image\/(?:jpeg|png|webp|gif);base64,[a-z0-9+/]+=*$/i.test(value)) return value;
  try {
    const url = new URL(value, location.href);
    return url.protocol === 'https:' || url.origin === location.origin ? url.href : '';
  } catch {
    return '';
  }
}

function renderGiftCarousel() {
  const title = String(params.get('title') || 'Cadeaux du direct').trim().slice(0, 60) || 'Cadeaux du direct';
  const direction = params.get('direction') === 'right' ? 'right' : 'left';
  const itemSize = Math.max(100, Math.min(320, Math.floor(Number(params.get('itemSize')) || 220)));
  giftCarouselTitleEl.textContent = title;
  giftCarouselArrowEl.textContent = direction === 'right' ? '←' : '→';
  document.documentElement.style.setProperty('--carousel-item-size', `${itemSize}px`);
  document.documentElement.style.setProperty('--carousel-item-height', `${Math.round(itemSize * 1.14)}px`);
  document.documentElement.style.setProperty('--carousel-text-color', colorParam('textColor', '#ffffff'));
  document.documentElement.style.setProperty('--carousel-panel-color', `${colorParam('panelColor', '#080c18')}d9`);

function formatTimer(seconds) {
  const safeSeconds = Math.max(0, Math.ceil(seconds));
  const hours = Math.floor(safeSeconds / 3600);
  const minutes = Math.floor((safeSeconds % 3600) / 60);
  const remainder = safeSeconds % 60;
  return hours > 0
    ? `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`
    : `${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`;
}

timerDisplayEl.value = formatTimer(timerRemaining);

function updateTimer() {
  timerRemaining = Math.max(0, (timerDeadline - Date.now()) / 1000);
  timerDisplayEl.value = formatTimer(timerRemaining);
  if (timerRemaining <= 0) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function startTimer() {
  if (!showTimerOverlay || timerInterval) return;
  if (timerRemaining <= 0) timerRemaining = timerInitialSeconds;
  timerDeadline = Date.now() + timerRemaining * 1000;
  updateTimer();
  timerInterval = setInterval(updateTimer, 200);
}

  if (!timerInterval) return;
  timerRemaining = Math.max(0, (timerDeadline - Date.now()) / 1000);
  clearInterval(timerInterval);
  timerInterval = null;
  timerDisplayEl.value = formatTimer(timerRemaining);
}

function resetTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerRemaining = timerInitialSeconds;
  timerDisplayEl.value = formatTimer(timerRemaining);
}

function renderWheel() {
  const svg = document.getElementById('wheel-svg');
  const namespace = 'http://www.w3.org/2000/svg';
  const center = 250;
  const radius = 238;
  const anglePerItem = (2 * Math.PI) / wheelItems.length;
  const elements = [];
  const defs = document.createElementNS(namespace, 'defs');
  const gradient = document.createElementNS(namespace, 'linearGradient');
  gradient.setAttribute('id', 'wheel-neon-gradient');
  gradient.setAttribute('gradientUnits', 'userSpaceOnUse');
  gradient.setAttribute('x1', '12');
  gradient.setAttribute('y1', '250');
  gradient.setAttribute('x2', '488');
  gradient.setAttribute('y2', '250');
  for (const [offset, color] of [
    ['0%', '#ff6b7a'],
    ['25%', '#ffd45a'],
    ['50%', '#72dcff'],
    ['75%', '#9dffb0'],
    ['100%', '#d58cff']
  ]) {
    const stop = document.createElementNS(namespace, 'stop');
    stop.setAttribute('offset', offset);
    stop.setAttribute('stop-color', color);
    gradient.appendChild(stop);
  }
  defs.appendChild(gradient);
  elements.push(defs);
  wheelItems.forEach((item, index) => {
    const startAngle = -Math.PI / 2 + index * anglePerItem;
    const endAngle = startAngle + anglePerItem;
    const startX = center + radius * Math.cos(startAngle);
    const startY = center + radius * Math.sin(startAngle);
    const endX = center + radius * Math.cos(endAngle);
    const endY = center + radius * Math.sin(endAngle);
    const path = document.createElementNS(namespace, 'path');
    path.setAttribute('d', `M ${center} ${center} L ${startX} ${startY} A ${radius} ${radius} 0 ${anglePerItem > Math.PI ? 1 : 0} 1 ${endX} ${endY} Z`);
    path.setAttribute('class', 'wheel-segment');
    path.dataset.index = String(index);
    path.setAttribute('fill', item.color);
    path.setAttribute('stroke', item.color);
    path.style.setProperty('--segment-neon', item.color);
    elements.push(path);

    const middleAngle = startAngle + anglePerItem / 2;
    const labelRadius = radius * 0.63;
    const label = document.createElementNS(namespace, 'text');
    label.setAttribute('x', String(center + labelRadius * Math.cos(middleAngle)));
    label.setAttribute('y', String(center + labelRadius * Math.sin(middleAngle)));
    label.setAttribute('fill', wheelTextColor);
    label.setAttribute('font-family', 'Arial,sans-serif');
    label.setAttribute('font-size', String(Math.max(12, Math.min(21, 240 / wheelItems.length))));
    label.setAttribute('font-weight', '800');
    label.setAttribute('text-anchor', 'middle');
    label.setAttribute('dominant-baseline', 'middle');
    const rotation = (middleAngle * 180 / Math.PI) + 90;
    label.setAttribute('transform', `rotate(${rotation} ${label.getAttribute('x')} ${label.getAttribute('y')})`);
    label.textContent = item.label;
    elements.push(label);
  });
  const neonCount = 32;
  for (let index = 0; index < neonCount; index++) {
    const angle = -Math.PI / 2 + index * (2 * Math.PI / neonCount);
    const color = `hsl(${Math.round(index * 360 / neonCount)} 100% 65%)`;
    const neon = document.createElementNS(namespace, 'circle');
    neon.setAttribute('class', 'wheel-neon');
    neon.setAttribute('cx', String(center + 246 * Math.cos(angle)));
    neon.setAttribute('cy', String(center + 246 * Math.sin(angle)));
    neon.setAttribute('r', '5');
    neon.setAttribute('fill', color);
    neon.setAttribute('stroke', '#fff');
    neon.setAttribute('stroke-width', '1');
    neon.style.setProperty('--neon-color', color);
    neon.style.animationDelay = `${-index * 0.075}s`;
    elements.push(neon);
  }
  const rim = document.createElementNS(namespace, 'circle');
  rim.setAttribute('class', 'wheel-rim');
  rim.setAttribute('cx', String(center));
  rim.setAttribute('cy', String(center));
  rim.setAttribute('r', String(radius));
  elements.push(rim);
  const hub = document.createElementNS(namespace, 'circle');
  hub.setAttribute('cx', String(center));
  hub.setAttribute('cy', String(center));
  hub.setAttribute('r', '27');
  hub.setAttribute('fill', '#fff');
  hub.setAttribute('stroke', '#081224');
  hub.setAttribute('stroke-width', '5');
  elements.push(hub);
  svg.replaceChildren(...elements);
}

let wheelRotation = 0;
let wheelSpinning = false;
function spinWheel() {
  if (!showWheelOverlay || wheelSpinning) return;
  wheelSpinning = true;
  const chosenIndex = Math.floor(Math.random() * wheelItems.length);
  const sliceDegrees = 360 / wheelItems.length;
  const chosenCenter = -90 + chosenIndex * sliceDegrees + sliceDegrees / 2;
  const currentAngle = ((chosenCenter + wheelRotation) % 360 + 360) % 360;
  const alignment = ((270 - currentAngle) % 360 + 360) % 360;
  wheelRotation += alignment + 360 * (5 + Math.floor(Math.random() * 3));
  const svg = document.getElementById('wheel-svg');
  svg.style.transition = 'transform 6s cubic-bezier(.12,.72,.12,1)';
  svg.style.transform = `rotate(${wheelRotation}deg)`;
  svg.querySelector('.wheel-winner')?.classList.remove('wheel-winner');
  window.setTimeout(() => {
    svg.querySelector(`.wheel-segment[data-index="${chosenIndex}"]`)?.classList.add('wheel-winner');
    wheelSpinning = false;
  }, 6200);
}
document.getElementById('wheel-spin').addEventListener('click', spinWheel);

const slug = text => String(text || '').trim().toLowerCase().replace(/[^a-z0-9_ -]/g, '').replace(/ +/g, '_');

function pickAlert(event, allowMultipliers) {
  const keys = [];
  if (event.type === 'follow') keys.push('follow');
  else if (event.type === 'subscribe') keys.push('sub');
  else if (event.type === 'share') keys.push('share');
  else if (event.type === 'level-up') keys.push('level_up');
  else if (
    event.type === 'comment' &&
    /(?:^|[^\p{L}\p{N}_])bobo(?:$|[^\p{L}\p{N}_])/iu.test(String(event.commentData?.comment || ''))
  ) {
    keys.push('comment_bobo');
  }
  else if (event.type === 'gift') {
    const name = String(event.gift?.giftName || '');
    const fromName = /(?:^|[\s_-])x\s?(\d{1,3})$/i.exec(name);
    const multiplier = Math.max(Number(event.gift?.repeatCount) || 1, fromName ? Number(fromName[1]) : 1);
    const item = slug(name.replace(/[\s_-]*x\s?\d{1,3}$/i, ''));
    if (allowMultipliers && multiplier > 1) keys.push(`gift_${item}_x${multiplier}`);
    if (allowMultipliers && multiplier > 1) keys.push(`multi_x${multiplier}`);
    const normalizedName = name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
    if (Number(event.gift?.giftId) === 7934 || normalizedName === 'heart me' || normalizedName === 'coeur du jour') {
      keys.push('gift_heart_me');
    }
    if (Number.isSafeInteger(event.gift?.giftId) && event.gift.giftId > 0) keys.push(`gift_id_${event.gift.giftId}`);
    keys.push(`gift_${item}`, `gift_${slug(name)}`);
    keys.push('gift_tous');
  }
  for (const key of keys) {
    const alert = alerts[key];
    if (alert && (alert.audioUrl || alert.videoUrl)) {
      return key === 'level_up' || key === 'comment_bobo' ? { ...alert, fullScreen: true } : alert;
    }
  }
  return null;
}

alertVideoUnlockEl.addEventListener('click', async () => {
  const alertVideo = alertVideoForUnlock;
  if (!alertVideo) return;
  alertVideo.muted = false;
  try {
    await alertVideo.play();
    alertVideoUnlockEl.hidden = true;
    setStatus('Son de la vidéo activé.');
  } catch (error) {
    alertVideo.muted = true;
    console.warn('Impossible d’activer le son de la vidéo.', error);
    setStatus('La vidéo reste affichée sans son. Vérifie les autorisations audio de la source navigateur.');
  }
});

alertAudioUnlockEl.addEventListener('click', () => {
  for (const retry of blockedAlertAudio.values()) retry();
});

function playAlertAudio(audio, onEnd) {
  let finished = false;
  const finishAudio = () => {
    if (finished) return;
    finished = true;
    blockedAlertAudio.delete(audio);
    alertAudioUnlockEl.hidden = blockedAlertAudio.size === 0;
    onEnd();
  };
  audio.onended = audio.onerror = finishAudio;
  const retry = () => {
    audio.play().then(() => {
      blockedAlertAudio.delete(audio);
      alertAudioUnlockEl.hidden = blockedAlertAudio.size === 0;
      if (alertAudioUnlockEl.hidden) setStatus('Son de l’alerte activé.');
    }, error => {
      if (error.name === 'NotAllowedError') {
        blockedAlertAudio.set(audio, retry);
        alertAudioUnlockEl.hidden = false;
        setStatus('Son de l’alerte bloqué par le navigateur. Clique sur « Activer le son des alertes ».');
        return;
      }
      console.warn('Impossible de lire l’effet sonore de l’alerte.', error);
      finishAudio();
    });
  };
  retry();
}

function playAlert(alert) {
  return new Promise(resolve => {
    let pending = 0;
    let finished = false;
    const done = () => {
      if (finished) return;
      if (--pending > 0) return;
      finished = true;
      video.style.display = 'none';
      video.removeAttribute('src');
      resolve();
    };
    const guard = setTimeout(() => { pending = 1; done(); }, 60000);
    const end = () => { clearTimeout(guard); done(); };
    if (alert.audioUrl) {
      pending++;
      const audio = new Audio(alert.audioUrl);
      playAlertAudio(audio, end);
    }
    if (alert.videoUrl) {
      pending++;
      video.volume = Number.isFinite(alert.videoVolume)
        ? Math.min(1, Math.max(0, alert.videoVolume))
        : 1;
      const width = Number.isFinite(alert.videoWidth) ? Math.min(150, Math.max(25, alert.videoWidth)) : 100;
      const height = Number.isFinite(alert.videoHeight) ? Math.min(150, Math.max(25, alert.videoHeight)) : 100;
      video.style.width = `${width}vw`;
      video.style.height = alert.fullScreen && window.CSS?.supports('height', '100dvh')
        ? `${height}dvh`
        : `${height}vh`;
      video.style.objectFit = alert.fullScreen ? 'contain' : alert.videoFit === 'cover' ? 'cover' : 'contain';
      video.muted = false;
      video.src = alert.videoUrl;
      video.style.display = 'block';
      alertVideoForUnlock = video;
      const endVideo = () => {
        if (alertVideoForUnlock === video) alertVideoForUnlock = null;
        alertVideoUnlockEl.hidden = true;
        end();
      };
      video.onended = video.onerror = endVideo;
      video.play().catch(error => {
        if (error.name !== 'NotAllowedError') {
          console.warn('Impossible de lire la vidéo de l’alerte.', error);
          endVideo();
          return;
        }
        video.muted = true;
        video.play().then(() => {
          if (alertVideoForUnlock === video) {
            alertVideoUnlockEl.hidden = false;
            setStatus('Vidéo lancée sans son. Clique sur « Activer le son » pour l’entendre.');
          }
        }).catch(retryError => {
          console.warn('Impossible de lancer la vidéo, même sans son.', retryError);
          endVideo();
        });
      });
    }
    if (!pending) { clearTimeout(guard); resolve(); }
  });
}

async function drain() {
  if (playing) return;
  playing = true;
  while (queue.length) await playAlert(queue.shift());
  playing = false;
}

function connect() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const socket = new WebSocket(`${protocol}//${location.host}/media-overlay-relay?token=${encodeURIComponent(token)}&mode=${encodeURIComponent(overlayMode)}`);
  socket.addEventListener('open', () => { reconnectDelay = 3000; loadAlerts(); });
  socket.addEventListener('message', async event => {
    let data;
    try { data = JSON.parse(event.data); } catch { return; }
    if (data.type === 'TTS_CONFIG') {
      socket.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username: data.username }));
    } else if (data.type === 'STATUS') {
      setStatus(data.message || '');
    } else if (data.type === 'LIVE_END') {
      giftLeaderboard.clear();
      renderGiftLeaderboard();
      chatOverlayEl.replaceChildren();
      for (const key of Object.keys(liveStats)) liveStats[key] = 0;
      liveStatsEl.replaceChildren();
      liveStatsEl.classList.remove('visible');
    } else if (data.type === 'viewer' && data.viewer) {
      const key = viewerKey(data.viewer);
      const avatar = validImageUrl(data.viewer.avatarDataUri || data.viewer.avatarUrl);
      if (key && avatar) {
        viewerAvatars.set(key, avatar);
        if (viewerAvatars.size > 500) viewerAvatars.delete(viewerAvatars.keys().next().value);
        if (overlayMode === 'leaderboard' && giftLeaderboard.has(key)) renderGiftLeaderboard();
      }
    } else {
      if (overlayMode === 'chat' && data.type === 'comment' && data.commentData &&
          firstLiveEvent('comment', data.commentData)) {
        addChatMessage(data.commentData);
      } else if (showWheelOverlay && data.type === 'comment' && data.commentData) {
        handleWheelComment(data.commentData);
      } else if (overlayMode === 'leaderboard' && data.type === 'gift' && data.gift &&
          firstLiveEvent('gift', data.gift)) {
        addGiftToLeaderboard(data.gift);
      }
      if (showStatsOverlay) {
        if (data.type === 'follow' && firstLiveEvent('follow', data.followData || data.eventData || {})) {
          updateLiveStats('followers', 1);
        } else if (data.type === 'like' && data.likeData && firstLiveEvent('like', data.likeData)) {
          updateLiveStats('likes', data.likeData.likeCount);
        } else if (data.type === 'gift' && data.gift && firstLiveEvent('gift', data.gift)) {
          updateLiveStats('gifts', data.gift.coinCount);
        } else if (data.type === 'share' && firstLiveEvent('share', data.shareData || {})) {
          updateLiveStats('shares', 1);
        } else if (data.type === 'subscribe' && firstLiveEvent('subscribe', data.subscribeData || {})) {
          updateLiveStats('subscribers', 1);
        }
      }
      if (showLiveEffects && data.type === 'follow' &&
          firstLiveEvent('follow', data.followData || data.eventData || {})) {
        updateLiveStats('followers', 1);
      } else if (showLiveEffects && data.type === 'like' && data.likeData &&
          firstLiveEvent('like', data.likeData)) {
        const like = data.likeData;
        const count = Math.floor(Number(like.likeCount) || 0);
        if (Number.isSafeInteger(count) && count > 0) {
          updateLiveStats('likes', count);
          showLikeBubble(like);
        }
      }
      const isNewLevelUp = data.type !== 'level-up' ||
        firstLiveEvent('level-up', data.levelUp || {});
      const isBoboComment = data.type === 'comment' &&
        /(?:^|[^\p{L}\p{N}_])bobo(?:$|[^\p{L}\p{N}_])/iu.test(String(data.commentData?.comment || '')) &&
        firstLiveEvent('comment-bobo', data.commentData || {});
      if (isNewLevelUp &&
          (showAlertOverlay || (showGiftCarousel && data.type === 'gift')) &&
          (data.type === 'follow' || data.type === 'subscribe' || data.type === 'share' ||
            data.type === 'gift' || data.type === 'level-up' || isBoboComment)) {
        if (showAlertOverlay && data.type === 'gift' && fireworkEnabled &&
            Number(data.gift?.coinCount) >= fireworkThreshold) {
          const gift = data.gift;
          const giftKey = viewerKey(gift);
          window.OverlayFirework.launch({
            name: gift.nickname || gift.uniqueId || gift.username,
            imageUrl: validImageUrl(gift.giftImageUrl || gift.giftImageUrls?.[0]),
            avatarUrl: validImageUrl(
              gift.avatarDataUri ||
              viewerAvatars.get(giftKey) ||
              gift.avatarUrls?.find(url => validImageUrl(url)) ||
              gift.avatarUrl
            )
          });
        }
        await loadAlerts();
        const alert = pickAlert(data, data.matchLive === true);
        if (alert && (queue.length < 20 || isBoboComment)) { queue.push(alert); drain(); }
      }
    }
  });
  socket.addEventListener('close', () => {
    setStatus('Overlay déconnecté. Nouvelle tentative…');
    setTimeout(connect, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
  });
}

if (overlayMode === 'chat' && params.get('test') === '1') {
  ['Salut tout le monde !', 'Super live 🦁', 'On joue à quoi ?', 'Bravo pour le jeu !', 'Coucou !'].forEach((comment, index) => {
    addChatMessage({ uniqueId: `spectateur_${index + 1}`, nickname: `Spectateur ${index + 1}`, comment });
  });
} else if (overlayMode === 'leaderboard' && params.get('test') === '1') {
  [
    { uniqueId: 'lion_test', nickname: 'Lion Test', coinCount: 500 },
    { uniqueId: 'rose_test', nickname: 'Rose Test', coinCount: 250 },
    { uniqueId: 'etoile_test', nickname: 'Étoile Test', coinCount: 100 }
  ].forEach(addGiftToLeaderboard);
} else if (showStatsOverlay && params.get('test') === '1') {
  updateLiveStats('followers', 23);
  updateLiveStats('likes', 1840);
  updateLiveStats('gifts', 1250);
  updateLiveStats('shares', 8);
  updateLiveStats('subscribers', 3);
} else if (showTimerOverlay && params.get('test') === '1') {
  startTimer();
} else if (showWheelOverlay && params.get('test') === '1') {
  handleWheelComment({ messageId: `wheel-test-${Date.now()}`, comment: 'SPIN' });
} else if (showLiveEffects && params.get('test') === 'follow') {
  updateLiveStats('followers', 1);
} else if (showLiveEffects && params.get('test') === 'like') {
  updateLiveStats('likes', 25);
  showLikeBubble({
    uniqueId: 'spectateur_test',
    nickname: 'Spectateur test',
    avatarDataUri: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADUlEQVR4nGP4z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC'
  });
}

loadAlerts().then(() => {
  if (params.get('test') === 'level-up') {
    const alert = pickAlert({ type: 'level-up' }, false);
    if (alert) {
      if (queue.length < 20) { queue.push(alert); drain(); }
    } else {
      setStatus('Configure d’abord la vidéo Niveau Fan Club dans Mes médias.');
    }
  } else if (params.get('test') === 'comment-bobo') {
    const alert = pickAlert({ type: 'comment', commentData: { comment: 'bobo' } }, false);
    if (alert) {
      queue.push(alert);
      drain();
    } else {
      setStatus('Configure d’abord la vidéo du commentaire « bobo » dans Mes médias.');
    }
  }
  connect();
});
</script>
