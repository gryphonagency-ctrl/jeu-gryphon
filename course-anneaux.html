<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pico Turbo - Course aux Anneaux - Gryphon Agency</title>
<script src="/arcade-effects.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0a1030; color: #fff; font-family: 'Arial Black', Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, 177.7vh); aspect-ratio: 16/9; max-height: 100vh; }
  canvas { width: 100%; height: 100%; display: block; background: #4aa8ff; image-rendering: auto; }
  #intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: radial-gradient(circle, #1e3799 0%, #0a1030 100%); z-index: 5; transition: opacity .5s; }
  #intro img { height: 55%; object-fit: contain; filter: drop-shadow(0 6px 18px rgba(0,140,255,.7)); }
  #intro h1 { margin: 0; font-size: clamp(18px, 3.4vw, 38px); color: #ffd23f; text-shadow: 3px 3px 0 #0b3a8a; text-align: center; }
  #intro p { margin: 0; font: 13px Arial; color: #9fc4ff; }
  .btn { background: #ffd23f; color: #000; border: 0; padding: 10px 26px; font: bold 18px 'Arial Black'; border-radius: 22px; cursor: pointer; box-shadow: 0 4px 0 #b8901a; }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  #sim { position: fixed; right: 10px; bottom: 44px; display: flex; flex-direction: column; gap: 5px; z-index: 6; }
  #sim button { padding: 7px 10px; border-radius: 8px; border: 0; background: #ff2e93; color: #fff; font: bold 12px Arial; cursor: pointer; }
  #rules { position: fixed; left: 0; right: 0; bottom: 0; height: 30px; background: #c8210c; border-top: 2px solid #fff; overflow: hidden; z-index: 6; display: flex; align-items: center; }
  #rules span { white-space: nowrap; font: bold 14px Arial; animation: slide 28s linear infinite; padding-left: 100%; }
  @keyframes slide { to { transform: translateX(-100%); } }
  #live { position: fixed; left: 8px; bottom: 36px; font: 12px Arial; z-index: 6; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  #live input { padding: 4px 6px; font-size: 12px; }
  #live button { padding: 4px 8px; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="intro">
    <img src="sonic-accueil.png" alt="Aperçu">
    <h1>PICO TURBO — LA COURSE AUX ANNEAUX</h1>
    <p>Vos cadeaux font sauter, foncer et transformer la mascotte !</p>
    <button class="btn" id="go">LANCER LE JEU</button>
  </div>
</div>

<div id="live">
  <input id="in-user" placeholder="@pseudo TikTok du live" size="18">
  <input id="in-url" size="26" value="wss://jeu6boite.onrender.com">
  <button id="in-go">Connecter</button>
  <span id="live-status">Non connecté</span>
  <button id="snd">🔊</button>
</div>
<aside id="sim" aria-label="Simulateur">
  <button id="s1" type="button">🎁 1 pièce : Saut</button>
  <button id="s5" type="button">🔥 5 pièces : Turbo</button>
  <button id="s100" type="button">💎 100 pièces : Super Pico</button>
  <button id="sshare" type="button">✈️ Partage du live</button>
</aside>
<div id="rules"><span>🎁 1 pièce = SAUT &nbsp;★&nbsp; 🔥 5 pièces = TURBO (invincible 3 s) &nbsp;★&nbsp; 💎 100 pièces = SUPER PICO (10 s, anneaux ×2) &nbsp;★&nbsp; ✈️ Partagez le live pour l'avion en papier &nbsp;★&nbsp; GRYPHON AGENCY</span></div>

<script>
const BIG_GIFT = 100;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 960, H = 540, GROUND = 430;

/* ---- Sons ---- */
let soundOn = localStorage.getItem('pico-sound') !== '0', actx = null;
const sndBtn = document.getElementById('snd');
const refreshSnd = () => sndBtn.textContent = soundOn ? '🔊' : '🔇';
refreshSnd();
sndBtn.onclick = () => { soundOn = !soundOn; localStorage.setItem('pico-sound', soundOn ? '1' : '0'); refreshSnd(); };
function tone(f, d = 0.1, type = 'square', f2) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), v = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, actx.currentTime);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, actx.currentTime + d);
    v.gain.setValueAtTime(0.08, actx.currentTime); v.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
    o.connect(v); v.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}

/* ---- État ---- */
const S = { run: false, speed: 5, dist: 0, rings: 0, lives: 3, t: 0, over: 0, boost: 0, superT: 0, inv: 0 };
const P = { x: 220, y: GROUND, vy: 0, air: 0, ang: 0 };
let obstacles = [], rings = [], loops = [], bridges = [], clouds = [], toasts = [], donors = {}, spawnIn = 60, shake = 0;
for (let i = 0; i < 6; i++) clouds.push({ x: i * 190, y: 40 + (i * 53) % 110, s: .6 + (i % 3) * .3 });

function reset() {
  Object.assign(S, { speed: 5, dist: 0, rings: 0, lives: 3, over: 0, boost: 0, superT: 0, inv: 0 });
  Object.assign(P, { y: GROUND, vy: 0, air: 0 });
  obstacles = []; rings = []; loops = []; bridges = []; S.loop = null; spawnIn = 60;
}
function toast(t) { toasts.push({ t, life: 140 }); if (toasts.length > 4) toasts.shift(); }

/* ---- Actions déclenchées par les cadeaux ---- */
function jump() {
  if (!S.run || S.over || S.loop) return;
  if (P.y >= GROUND) { P.vy = -15; P.air = 1; tone(520, .15, 'square', 900); }
  else if (P.air < 2) { P.vy = -13; P.air = 2; tone(700, .15, 'square', 1100); }
}
function turbo() { if (!S.run || S.over) return; S.boost = 180; S.inv = Math.max(S.inv, 180); tone(200, .35, 'sawtooth', 800); }
function superMode() { if (!S.run || S.over) return; S.superT = 600; S.inv = Math.max(S.inv, 600); tone(300, .6, 'sawtooth', 1200); }

function onGift(user, coins) {
  coins = Number(coins) || 1; user = user || 'inconnu';
  donors[user] = (donors[user] || 0) + coins;
  if (coins >= BIG_GIFT) { superMode(); toast('💎 @' + user + ' → SUPER PICO !'); }
  else if (coins >= 5) { turbo(); toast('🔥 @' + user + ' → TURBO !'); }
  else { jump(); toast('🎁 @' + user + ' → SAUT'); }
}

/* ---- Génération du niveau ---- */
function spawn() {
  const r = Math.random(), x = W + 40;
  if (r < .15 && !loops.length) { loops.push({ x, w: 244, ri: 95, used: false }); return 330; }
  if (r < .32) {
    const b = { x, w: 220, y: GROUND - 120 }; bridges.push(b);
    obstacles.push({ kind: 'spike', x: x + 60, w: 38, h: 34 }, { kind: 'bot', x: x + 130, w: 40, h: 40, ph: 1 });
    for (let i = 0; i < 6; i++) rings.push({ x: x + 25 + i * 34, y: b.y - 30, got: false });
    return 280;
  }
  if (r < .5) obstacles.push({ kind: 'spike', x, w: 38, h: 34 });
  else if (r < .75) obstacles.push({ kind: 'bot', x, w: 40, h: 40, ph: Math.random() * 6 });
  else if (r < .88) { obstacles.push({ kind: 'spike', x, w: 38, h: 34 }); obstacles.push({ kind: 'spike', x: x + 38, w: 38, h: 34 }); }
  const high = Math.random() < .5, base = high ? GROUND - 140 : GROUND - 30;
  for (let i = 0; i < 5; i++) rings.push({ x: x + 90 + i * 36, y: base - (high ? Math.sin(i / 4 * Math.PI) * 40 : 0), got: false });
}

/* ---- Mise à jour ---- */
function update() {
  S.t++;
  if (!S.run) return;
  if (S.over) { S.over--; if (S.over === 0) reset(); return; }
  if (S.loop) {
    // le looping : le décor se fige, la mascotte roule en boule le long de l'anneau
    const L = S.loop; L.phi += .09; P.ang += .5; S.dist += 2;
    clouds.forEach(c => { c.x -= c.s * .6; if (c.x < -120) c.x = W + 60; });
    while (L.got < 12 && L.phi > .5 + L.got * Math.PI * 2 / 12.5) { L.got++; S.rings += S.superT > 0 ? 2 : 1; tone(1000 + L.got * 70, .06, 'sine', 1800); }
    if (S.boost > 0) S.boost--; if (S.superT > 0) S.superT--;
    if (L.phi >= Math.PI * 2) { S.loop = null; P.y = GROUND; P.vy = 0; S.inv = Math.max(S.inv, 30); }
    return;
  }
  const mult = (S.boost > 0 ? 1.9 : 1) * (S.superT > 0 ? 1.4 : 1);
  S.speed = Math.min(9, 5 + S.dist / 4000);
  const v = S.speed * mult;
  S.dist += v;
  if (S.boost > 0) S.boost--; if (S.superT > 0) S.superT--; if (S.inv > 0) S.inv--;
  const prevY = P.y;
  P.vy += .7; P.y += P.vy;
  for (const b of bridges) {
    if (P.vy >= 0 && prevY <= b.y + 1 && P.y >= b.y && P.x + 8 > b.x && P.x - 8 < b.x + b.w) { P.y = b.y; P.vy = 0; P.air = 0; }
  }
  if (P.y >= GROUND) { P.y = GROUND; P.vy = 0; P.air = 0; }
  P.ang += P.y < GROUND ? .35 : 0;
  clouds.forEach(c => { c.x -= c.s * .6; if (c.x < -120) c.x = W + 60; });
  spawnIn -= v; if (spawnIn <= 0) { spawnIn = 240 + Math.random() * 220 + (spawn() || 0); }
  obstacles.forEach(o => o.x -= v); rings.forEach(r => r.x -= v); bridges.forEach(b => b.x -= v); loops.forEach(l => l.x -= v);
  obstacles = obstacles.filter(o => o.x > -80); rings = rings.filter(r => r.x > -30);
  bridges = bridges.filter(b => b.x + b.w > -30); loops = loops.filter(l => l.x + l.w > -30);
  for (const l of loops) {
    if (l.used) continue;
    const cx = l.x + l.w / 2;
    if (cx <= P.x && cx > P.x - 40 && P.y >= GROUND - 2) { l.used = true; l.x = P.x - l.w / 2; S.loop = { l, phi: 0, got: 0 }; tone(400, .5, 'sawtooth', 1000); return; }
    if (cx <= P.x - 40) l.used = true;
  }
  const px = P.x, pt = P.y - 44;
  for (const r of rings) if (!r.got && Math.hypot(px - r.x, (P.y - 24) - r.y) < 30) { r.got = true; S.rings += S.superT > 0 ? 2 : 1; tone(1200, .08, 'sine', 1800); }
  for (const o of obstacles) {
    if (o.hit) continue;
    const hit = px + 16 > o.x && px - 16 < o.x + o.w && P.y > GROUND - o.h + 6;
    if (!hit) continue;
    o.hit = true;
    if (S.inv > 0) { tone(150, .2, 'square', 60); continue; }
    S.lives--; S.inv = 90; shake = 12; P.vy = -9; tone(120, .4, 'sawtooth', 40);
    if (S.lives <= 0) { S.over = 420; toast('💥 Partie terminée — ' + S.rings + ' anneaux'); }
  }
  if (shake > 0) shake--;
  toasts.forEach(t => t.life--); toasts = toasts.filter(t => t.life > 0);
}

/* ---- Dessin ---- */
function hill(off, col, h, w, sp) {
  g.fillStyle = col; g.beginPath(); g.moveTo(0, GROUND);
  const o = (S.dist * sp) % w;
  for (let x = -w; x <= W + w; x += 20) g.lineTo(x - o, GROUND - h - Math.sin((x - o + off) / w * Math.PI * 2) * h * .5);
  g.lineTo(W + w, GROUND); g.closePath(); g.fill();
}
function drawPico(x, y, t) {
  const sup = S.superT > 0, body = sup ? '#ffd23f' : '#12b5c9', dark = sup ? '#e0a800' : '#0a7f94', skin = '#ffe7c2', shoe = '#ff7a1a';
  g.save(); g.translate(x, y);
  if (S.inv > 0 && S.superT <= 0 && S.boost <= 0 && (S.t >> 2) % 2) g.globalAlpha = .4;
  if (y < GROUND - 2) {
    g.translate(0, -26); g.rotate(P.ang);
    g.fillStyle = dark; g.beginPath(); g.arc(0, 0, 26, 0, 7); g.fill();
    g.fillStyle = body; g.beginPath(); g.arc(0, 0, 20, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.fillRect(-4, -20, 8, 10);
  } else {
    const sw = Math.sin(t * .5) * 12;
    g.fillStyle = dark; // piquants
    g.beginPath(); g.moveTo(-8, -58); g.lineTo(-44, -50); g.lineTo(-12, -42); g.lineTo(-46, -34); g.lineTo(-10, -28); g.lineTo(-38, -16); g.lineTo(-6, -18); g.fill();
    g.fillStyle = shoe; g.fillRect(-6 + sw, -8, 22, 10); g.fillRect(-14 - sw, -8, 22, 10);
    g.fillStyle = '#fff'; g.fillRect(-6 + sw, -12, 14, 4); g.fillRect(-14 - sw, -12, 14, 4);
    g.fillStyle = body; g.fillRect(-12, -40, 26, 30);
    g.fillStyle = skin; g.fillRect(-2, -34, 14, 20);
    g.fillStyle = '#ffd23f'; g.fillRect(-14, -50, 30, 8); g.fillRect(-20, -48, 8, 14);
    g.fillStyle = body; g.beginPath(); g.arc(4, -62, 20, 0, 7); g.fill();
    g.fillStyle = skin; g.beginPath(); g.ellipse(14, -56, 11, 8, 0, 0, 7); g.fill();
    g.fillStyle = '#000'; g.beginPath(); g.arc(22, -58, 3, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(8, -66, 8, 0, 7); g.fill();
    g.fillStyle = '#1b2a6b'; g.beginPath(); g.arc(10, -66, 4, 0, 7); g.fill();
    g.strokeStyle = '#ffd23f'; g.lineWidth = 3; g.beginPath(); g.arc(8, -66, 10, 0, 7); g.stroke();
  }
  g.restore();
}
function drawRing(x, y, t) {
  g.strokeStyle = '#ffd23f'; g.lineWidth = 4; g.beginPath(); g.ellipse(x, y, 10 * Math.abs(Math.cos(t * .08 + x)) + 2, 12, 0, 0, 7); g.stroke();
}
function checkerRect(x, y, w, h, c1, c2, s) {
  g.fillStyle = c1; g.fillRect(x, y, w, h); g.fillStyle = c2;
  for (let j = 0; j * s < h; j++) for (let i = 0; i * s < w; i++) if ((i + j) % 2 === 0) g.fillRect(x + i * s, y + j * s, Math.min(s, w - i * s), Math.min(s, h - j * s));
}
function scenery() {
  const wg = g.createLinearGradient(0, GROUND - 95, 0, GROUND); wg.addColorStop(0, '#3a8dff'); wg.addColorStop(1, '#1d5fc2');
  g.fillStyle = wg; g.fillRect(0, GROUND - 95, W, 95);
  g.fillStyle = 'rgba(255,255,255,.45)';
  for (let i = 0; i < 14; i++) g.fillRect((((i * 137 - S.dist * .5) % W) + W) % W, GROUND - 85 + (i * 29) % 75, 28, 2);
  // falaises en damier avec cascades
  const per = 720, cs = S.dist * .45, k0 = Math.floor(cs / per), off = cs - k0 * per;
  for (let k = -1; k < 3; k++) {
    const kk = k0 + k, x = k * per - off + 60, w = 190 + Math.abs(kk * 53) % 110, h = 95 + Math.abs(kk * 37) % 55;
    checkerRect(x, GROUND - h, w, h, '#b26a22', '#8c4e17', 20);
    g.fillStyle = '#43b54a'; g.fillRect(x - 6, GROUND - h - 10, w + 12, 14);
    g.fillStyle = '#2e8f3a'; g.fillRect(x - 6, GROUND - h + 2, w + 12, 4);
    if (Math.abs(kk) % 2 === 0) {
      const wx = x + w; g.fillStyle = '#d6efff'; g.fillRect(wx, GROUND - h + 4, 26, h - 4);
      g.fillStyle = '#8fc8ff'; for (let j = 0; j < 8; j++) g.fillRect(wx + 3 + (j * 7) % 20, GROUND - h + 4 + ((j * 23 + S.t * 3) % (h - 10)), 3, 16);
      g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.arc(wx + 13, GROUND - 2, 15, 0, 7); g.fill();
    }
  }
  // palmiers
  const pp = 560, ps = S.dist * .8, p0 = Math.floor(ps / pp), po = ps - p0 * pp;
  for (let k = -1; k < 3; k++) {
    const x = k * pp - po + 330;
    g.fillStyle = '#8a5a2b';
    for (let i = 0; i < 10; i++) { g.fillRect(x + Math.sin(i * .35) * 9 - 6, GROUND - (i + 1) * 17, 12, 18); g.fillStyle = i % 2 ? '#8a5a2b' : '#74481f'; }
    const tx = x + Math.sin(9 * .35) * 9, ty = GROUND - 170;
    g.strokeStyle = '#2f9e3f'; g.lineWidth = 8; g.lineCap = 'round';
    for (const a of [-3, -2.4, -1.8, -1.2, -.6, -.1]) { g.beginPath(); g.moveTo(tx, ty); g.quadraticCurveTo(tx + Math.cos(a) * 45, ty + Math.sin(a) * 45 - 26, tx + Math.cos(a) * 82, ty + Math.sin(a) * 82 + 14); g.stroke(); }
    g.lineCap = 'butt'; g.fillStyle = '#5b3513'; g.beginPath(); g.arc(tx - 6, ty + 8, 6, 0, 7); g.arc(tx + 7, ty + 9, 6, 0, 7); g.fill();
  }
}
function drawLoop(l) {
  const cx = l.x + l.w / 2, Ri = l.ri, Ro = Ri + 26, Cy = GROUND - Ri;
  g.save(); g.beginPath(); g.moveTo(cx + Ro, Cy); g.arc(cx, Cy, Ro, 0, 7); g.moveTo(cx + Ri, Cy); g.arc(cx, Cy, Ri, 0, 7, true); g.clip('evenodd');
  checkerRect(cx - Ro, Cy - Ro, Ro * 2, Ro * 2, '#b26a22', '#8c4e17', 22);
  g.restore();
  g.strokeStyle = '#e8b36a'; g.lineWidth = 3; g.beginPath(); g.arc(cx, Cy, Ri, 0, 7); g.stroke();
  if (!l.used || (S.loop && S.loop.l === l)) {
    for (let i = (S.loop && S.loop.l === l) ? S.loop.got : 0; i < 12; i++) { const ph = .5 + i * Math.PI * 2 / 12.5; drawRing(cx + (Ri - 34) * Math.sin(ph), Cy + (Ri - 34) * Math.cos(ph), S.t); }
  }
}
function drawBridge(b) {
  g.fillStyle = '#6b3f12'; g.fillRect(b.x + 8, b.y, 10, GROUND - b.y); g.fillRect(b.x + b.w - 18, b.y, 10, GROUND - b.y);
  for (let x = b.x; x < b.x + b.w; x += 22) {
    g.fillStyle = '#9a5b1e'; g.beginPath(); g.arc(x + 11, b.y + 11, 11, 0, 7); g.fill();
    g.strokeStyle = '#5e3510'; g.lineWidth = 2; g.stroke();
    g.fillStyle = '#c98a4b'; g.beginPath(); g.arc(x + 11, b.y + 11, 5, 0, 7); g.fill();
  }
}
function draw() {
  g.save();
  if (shake > 0) g.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  const sky = g.createLinearGradient(0, 0, 0, GROUND); sky.addColorStop(0, S.superT > 0 ? '#ffb347' : '#2f7bff'); sky.addColorStop(1, S.superT > 0 ? '#fff1b8' : '#a6d4ff');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,.9)';
  clouds.forEach(c => { g.beginPath(); g.arc(c.x, c.y, 24 * c.s, 0, 7); g.arc(c.x + 26 * c.s, c.y + 4, 20 * c.s, 0, 7); g.arc(c.x - 26 * c.s, c.y + 6, 18 * c.s, 0, 7); g.fill(); });
  hill(0, '#6fa7ee', 100, 620, .06);
  scenery();
  loops.forEach(drawLoop);
  const off = (S.dist) % 80;
  g.fillStyle = '#7a4a1e'; g.fillRect(0, GROUND, W, H - GROUND);
  g.fillStyle = '#4cc36b'; g.fillRect(0, GROUND, W, 14);
  g.fillStyle = '#5b3513';
  for (let x = -off; x < W; x += 80) { g.fillRect(x, GROUND + 14, 40, 26); g.fillRect(x + 40, GROUND + 54, 40, 26); }
  bridges.forEach(drawBridge);
  rings.forEach(r => { if (!r.got) drawRing(r.x, r.y, S.t); });
  obstacles.forEach(o => {
    if (o.kind === 'spike') {
      g.fillStyle = '#c9d2e0'; g.beginPath(); g.moveTo(o.x, GROUND); g.lineTo(o.x + o.w / 2, GROUND - o.h); g.lineTo(o.x + o.w, GROUND); g.fill();
      g.strokeStyle = '#5a6578'; g.lineWidth = 2; g.stroke();
    } else {
      const bob = Math.sin(S.t * .15 + o.ph) * 2;
      g.fillStyle = '#d63a3a'; g.beginPath(); g.arc(o.x + 20, GROUND - 22 + bob, 20, Math.PI, 0); g.fillRect(o.x, GROUND - 22 + bob, 40, 18); g.fill();
      g.fillStyle = '#fff'; g.fillRect(o.x + 8, GROUND - 32 + bob, 10, 10); g.fillRect(o.x + 22, GROUND - 32 + bob, 10, 10);
      g.fillStyle = '#000'; g.fillRect(o.x + 12, GROUND - 30 + bob, 4, 6); g.fillRect(o.x + 26, GROUND - 30 + bob, 4, 6);
      g.fillStyle = '#333'; g.fillRect(o.x + 2, GROUND - 4, 14, 4); g.fillRect(o.x + 24, GROUND - 4, 14, 4);
    }
  });
  if (S.boost > 0 || S.superT > 0) {
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 3;
    for (let i = 0; i < 8; i++) { const y = 80 + i * 45 + (S.t * 7 % 20), x = (S.t * 40 + i * 130) % W; g.beginPath(); g.moveTo(x, y); g.lineTo(x - 70, y); g.stroke(); }
  }
  if (S.loop) {
    const L = S.loop, cx = L.l.x + L.l.w / 2, Ri = L.l.ri;
    g.save(); g.translate(cx + Ri * Math.sin(L.phi), GROUND - Ri + Ri * Math.cos(L.phi)); g.rotate(-L.phi); drawPico(0, 0, S.t); g.restore();
  } else drawPico(P.x, P.y, S.t);
  g.restore();

  // HUD
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(12, 12, 250, 64);
  g.font = 'bold 22px Arial Black'; g.textBaseline = 'middle'; g.textAlign = 'left';
  g.fillStyle = '#ffd23f'; g.fillText('◯ ' + S.rings + ' anneaux', 24, 32);
  g.fillStyle = '#fff'; g.fillText('♥'.repeat(Math.max(0, S.lives)) + '  ' + Math.floor(S.dist / 10) + ' m', 24, 58);
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(W - 232, 12, 220, 22 + 22 * 5);
  g.font = 'bold 14px Arial'; g.fillStyle = '#ffd23f'; g.fillText('TOP DONATEURS', W - 222, 26);
  Object.entries(donors).sort((a, b) => b[1] - a[1]).slice(0, 5).forEach(([u, c], i) => {
    g.fillStyle = '#fff'; g.fillText((i + 1) + '. @' + u.slice(0, 14) + '  ' + c + ' 🪙', W - 222, 52 + i * 22);
  });
  g.textAlign = 'center';
  toasts.forEach((t, i) => { g.globalAlpha = Math.min(1, t.life / 40); g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(W / 2 - 190, 90 + i * 34, 380, 28); g.fillStyle = '#fff'; g.font = 'bold 16px Arial'; g.fillText(t.t, W / 2, 105 + i * 34); g.globalAlpha = 1; });
  if (S.over) {
    g.fillStyle = 'rgba(0,0,0,.65)'; g.fillRect(0, 190, W, 150);
    g.fillStyle = '#ffd23f'; g.font = 'bold 48px Arial Black'; g.fillText('GAME OVER', W / 2, 245);
    g.fillStyle = '#fff'; g.font = 'bold 22px Arial'; g.fillText(S.rings + ' anneaux — ' + Math.floor(S.dist / 10) + ' m — nouvelle partie dans ' + Math.ceil(S.over / 60) + ' s', W / 2, 295);
  }
}
function loop() { update(); draw(); requestAnimationFrame(loop); }

/* ---- Démarrage, simulateur, clavier ---- */
document.getElementById('go').onclick = () => {
  const el = document.getElementById('intro'); el.style.opacity = 0; setTimeout(() => el.style.display = 'none', 500);
  S.run = true; reset(); tone(600, .2, 'square', 1200);
};
document.getElementById('s1').onclick = () => onGift('Alex_TikTok', 1);
document.getElementById('s5').onclick = () => onGift('Alex_TikTok', 5);
document.getElementById('s100').onclick = () => { onGift('Alex_TikTok', BIG_GIFT); ArcadeEffects.simulateBigGift('Alex_TikTok', BIG_GIFT); };
document.getElementById('sshare').onclick = () => ArcadeEffects.simulateShare();
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === '1') { e.preventDefault(); onGift('Clavier', 1); }
  else if (e.key === '5') onGift('Clavier', 5);
  else if (e.key === '0') onGift('Clavier', 100);
});

/* ---- Connexion TikTok Live ---- */
let ws = null; const seen = new Set();
const setLive = t => document.getElementById('live-status').textContent = t;
document.getElementById('in-go').onclick = () => {
  const u = document.getElementById('in-user').value.trim().replace(/^@/, ''), url = document.getElementById('in-url').value.trim();
  if (!u || !url) { setLive('Entrez le pseudo TikTok'); return; }
  if (ws) ws.close();
  try { ws = new WebSocket(url); } catch (e) { setLive('URL invalide'); return; }
  ws.onopen = () => { ws.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username: u })); setLive('Connexion à @' + u + '…'); };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    const type = String(m.type || m.event || '').toLowerCase(), d = m.data || m;
    if (type === 'gift' || type === 'tiktok-gift') {
      const x = d.gift ?? d; if (x.messageId) { if (seen.has(x.messageId)) return; seen.add(x.messageId); }
      onGift(x.uniqueId || x.username || x.nickname || 'inconnu', x.coinCount ?? ((x.coinValue ?? x.diamondCount ?? x.diamonds ?? 1) * (x.repeatCount || 1)));
    } else if (type === 'status' && d.message) setLive(String(d.message));
  };
  ws.onerror = () => setLive('Erreur de connexion'); ws.onclose = () => setLive('Déconnecté');
};

requestAnimationFrame(loop);
</script>
