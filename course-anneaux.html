<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouvelle version de Sonic - Gryphon Agency</title>
<script src="/arcade-effects.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0a1030; color: #fff; font-family: 'Arial Black', Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, 177.7vh); aspect-ratio: 16/9; max-height: 100vh; }
  canvas { width: 100%; height: 100%; display: block; background: #4aa8ff; image-rendering: auto; }
  #intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: radial-gradient(circle, #1e3799 0%, #0a1030 100%); z-index: 5; transition: opacity .5s; }
  #intro img { height: 55%; object-fit: contain; filter: drop-shadow(0 6px 18px rgba(0,140,255,.7)); }
  #intro h1 { margin: 0; font-size: clamp(18px, 3.4vw, 38px); color: #ffd23f; text-shadow: 3px 3px 0 #0b3a8a; text-align: center; }
  #intro p { margin: 0; font: 13px Arial; color: #9fc4ff; }
  .btn { background: #ffd23f; color: #000; border: 0; padding: 10px 26px; font: bold 18px 'Arial Black'; border-radius: 22px; cursor: pointer; box-shadow: 0 4px 0 #b8901a; }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  #sim { position: fixed; right: 10px; bottom: 44px; display: flex; flex-direction: column; gap: 5px; z-index: 6; }
  #sim button { padding: 7px 10px; border-radius: 8px; border: 0; background: #ff2e93; color: #fff; font: bold 12px Arial; cursor: pointer; }
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; }

  #rules span { white-space: nowrap; font: bold 14px Arial; animation: slide 28s linear infinite; padding-left: 100%; }
  @keyframes slide { to { transform: translateX(-100%); } }
  #live { font: bold 17px Arial; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; margin: 6px 0;
    background: rgba(10,16,48,.88); border: 2px solid #ffd23f; border-radius: 14px; padding: 10px 14px; max-width: 94vw; box-shadow: 0 4px 18px rgba(0,0,0,.6); }
  #live input { padding: 9px 12px; font-size: 17px; border-radius: 8px; border: 2px solid #4a1d96; }
  #live button { padding: 9px 16px; font-size: 17px; font-weight: bold; border-radius: 8px; border: 0; cursor: pointer; background: #ffd23f; }
  #live #in-go { background: #fe2c55; color: #fff; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="intro">
    <img src="sonic-accueil.png" alt="Aperçu">
    <h1>NOUVELLE VERSION DE SONIC</h1>
    <p>Vos cadeaux font sauter, foncer et transformer la mascotte !</p>
    <button class="btn" id="go">LANCER LE JEU</button>
  </div>
</div>

<div id="bottom">
<div id="rules"><span>⭐ 1 étoile = SAUT &nbsp;★&nbsp; ⭐ 5 étoiles = TURBO &nbsp;★&nbsp; ⭐ 100 étoiles = SUPER PICO &nbsp;★&nbsp; ✈️ Partagez le live pour l'avion en papier &nbsp;★&nbsp; GRYPHON AGENCY</span></div>
<div id="live">
  <input id="in-user" placeholder="@pseudo TikTok du live" size="22">
  <input id="in-url" size="30" value="wss://jeu6boite.onrender.com">
  <button id="in-go">Connecter</button>
  <span id="live-status">Non connecté</span>
  <button id="snd">🔊</button>
  <button id="k-jump" title="Touche Espace ou 1">⭐ Saut</button>
  <button id="k-turbo" title="Touche 5">🔥 Turbo</button>
  <button id="k-super" title="Touche 0">💎 Super Pico</button>
</div>
</div>

<script>
const BIG_GIFT = 100;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 960, H = 540, GROUND = 430;

/* ---- Sons ---- */
let soundOn = localStorage.getItem('pico-sound') !== '0', actx = null;
const sndBtn = document.getElementById('snd');
const refreshSnd = () => sndBtn.textContent = soundOn ? '🔊' : '🔇';
refreshSnd();
sndBtn.onclick = () => { soundOn = !soundOn; localStorage.setItem('pico-sound', soundOn ? '1' : '0'); refreshSnd(); };
function tone(f, d = 0.1, type = 'square', f2) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), v = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, actx.currentTime);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, actx.currentTime + d);
    v.gain.setValueAtTime(0.08, actx.currentTime); v.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d);
    o.connect(v); v.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}

/* ---- État ---- */
const S = { run: false, speed: 5, dist: 0, rings: 0, lives: 3, t: 0, over: 0, boost: 0, superT: 0, inv: 0, level: 0, clear: 0, banner: 0, won: false };
const P = { x: 220, y: GROUND, vy: 0, air: 0, ang: 0, fall: false };
let obstacles = [], rings = [], loops = [], bridges = [], pits = [], clouds = [], toasts = [], donors = {}, spawnIn = 60, shake = 0;
for (let i = 0; i < 6; i++) clouds.push({ x: i * 190, y: 40 + (i * 53) % 110, s: .6 + (i % 3) * .3 });

/* ---- Les 8 niveaux (len en mètres, pit = probabilité de trou, pw = largeur min/max des trous) ---- */
const LEVELS = [
  { name: 'Colline Azur', diff: 'FACILE', deco: 'lake', len: 1000, speed: 5.0, pit: 0, pw: [0, 0], gap: [300, 220], loop: .15, sky: ['#2f7bff', '#a6d4ff'], far: '#6fa7ee', grass: '#4cc36b', dirt: '#7a4a1e', dirt2: '#5b3513', pitc: '#06101f', clouds: 1 },
  { name: 'Forêt Émeraude', diff: 'MOYEN', deco: 'forest', len: 1150, speed: 5.4, pit: .12, pw: [90, 120], gap: [285, 205], loop: .12, sky: ['#1f6b4a', '#a8e6b5'], far: '#2f8a5a', grass: '#3fae4c', dirt: '#5e4326', dirt2: '#3f2c16', pitc: '#04140c', clouds: 1 },
  { name: 'Désert Doré', diff: 'CORSÉ', deco: 'desert', len: 1300, speed: 5.8, pit: .18, pw: [100, 140], gap: [270, 190], loop: .12, sky: ['#ff9a3c', '#ffe3a0'], far: '#e9b866', grass: '#d9b25a', dirt: '#b9812f', dirt2: '#8e5f1c', pitc: '#2a1706', clouds: 0 },
  { name: 'Caverne de Cristal', diff: 'DIFFICILE', deco: 'cave', len: 1450, speed: 6.2, pit: .24, pw: [110, 160], gap: [255, 175], loop: .1, sky: ['#150a2e', '#3a1f6b'], far: '#2a1a50', grass: '#7b5bd6', dirt: '#3b2a63', dirt2: '#26194a', pitc: '#000008', clouds: 0 },
  { name: 'Pôle Glacé', diff: 'TRÈS DIFFICILE', deco: 'snow', len: 1600, speed: 6.6, pit: .3, pw: [120, 180], gap: [240, 160], loop: .1, sky: ['#8fb8e8', '#f2f9ff'], far: '#c5ddf5', grass: '#f4fbff', dirt: '#8fb4d6', dirt2: '#6b93b8', pitc: '#0a2a4a', clouds: 1 },
  { name: 'Cité Néon', diff: 'EXPERT', deco: 'city', len: 1750, speed: 7.0, pit: .36, pw: [130, 200], gap: [225, 145], loop: .08, sky: ['#0a0522', '#4a1a7a'], far: '#1a1040', grass: '#14e0c8', dirt: '#241a4a', dirt2: '#150f30', pitc: '#000000', clouds: 0 },
  { name: 'Volcan Ardent', diff: 'EXTRÊME', deco: 'volcano', len: 1900, speed: 7.4, pit: .42, pw: [140, 210], gap: [210, 130], loop: .08, sky: ['#3a0a0a', '#ff6a2a'], far: '#5a1a12', grass: '#6b5a52', dirt: '#3a2a26', dirt2: '#24181a', pitc: '#ff5a10', clouds: 0 },
  { name: 'Cosmos Infini', diff: 'LÉGENDAIRE', deco: 'space', len: 2050, speed: 7.8, pit: .48, pw: [150, 230], gap: [195, 115], loop: .06, sky: ['#02020f', '#1a0b3d'], far: '#241455', grass: '#9a7bff', dirt: '#3a2a7a', dirt2: '#241a55', pitc: '#000000', clouds: 0 }
];
const LV = () => LEVELS[S.level];

function startLevel(i) {
  levelDonors = {}; S.vip = null;
  S.level = i; S.dist = 0; S.lives = 3; S.loop = null; S.clear = 0; S.banner = 190; S.boost = 0;
  obstacles = []; rings = []; loops = []; bridges = []; pits = []; spawnIn = 60;
  Object.assign(P, { y: GROUND, vy: 0, air: 0, fall: false });
  S.inv = Math.max(S.inv, 60);
}
function reset() {
  Object.assign(S, { speed: 5, rings: 0, over: 0, boost: 0, superT: 0, inv: 0, won: false });
  startLevel(0);
}
function toast(t) { toasts.push({ t, life: 140 }); if (toasts.length > 4) toasts.shift(); }
function loseLife(msg) {
  S.lives--; S.inv = 120; shake = 12; tone(120, .4, 'sawtooth', 40);
  if (S.lives <= 0) { S.over = 420; toast('💥 Partie terminée — niveau ' + (S.level + 1) + ', ' + S.rings + ' anneaux'); return true; }
  if (msg) toast(msg);
  return false;
}

/* ---- Actions déclenchées par les cadeaux ---- */
function jump() {
  if (!S.run || S.over || S.loop || P.fall || S.clear) return;
  if (P.y >= GROUND) { P.vy = -15; P.air = 1; tone(520, .15, 'square', 900); }
  else if (P.air < 2) { P.vy = -13; P.air = 2; tone(700, .15, 'square', 1100); }
}
function turbo() { if (!S.run || S.over) return; S.boost = 180; S.inv = Math.max(S.inv, 180); tone(200, .35, 'sawtooth', 800); }
function superMode() { if (!S.run || S.over) return; S.superT = 600; S.inv = Math.max(S.inv, 600); tone(300, .6, 'sawtooth', 1200); }

const avatarUrls = {}, avatarImgs = {};
let levelDonors = {};
const prizeFor = lv => 10 + 5 * lv;
function avatarImg(user) {
  const url = avatarUrls[user]; if (!url) return null;
  if (!avatarImgs[user] || avatarImgs[user].src !== url) { const im = new Image(); im.src = url; avatarImgs[user] = im; }
  return avatarImgs[user];
}
function onGift(user, coins, avatar) {
  coins = Number(coins) || 1; user = user || 'inconnu';
  donors[user] = (donors[user] || 0) + coins;
  levelDonors[user] = (levelDonors[user] || 0) + coins;
  if (avatar) avatarUrls[user] = avatar;
  if (coins >= BIG_GIFT) { superMode(); toast('💎 @' + user + ' → SUPER PICO !'); }
  else if (coins >= 5) { turbo(); toast('🔥 @' + user + ' → TURBO !'); }
  else { jump(); toast('🎁 @' + user + ' → SAUT'); }
}

/* ---- Génération du niveau ---- */
function spawn() {
  const L = LV(), x = W + 40;
  let r = Math.random();
  if (r < L.pit) {
    const w = L.pw[0] + Math.random() * (L.pw[1] - L.pw[0]);
    pits.push({ x, w });
    for (let i = 0; i < 5; i++) rings.push({ x: x + w * (i + .5) / 5, y: GROUND - 70 - Math.sin(i / 4 * Math.PI) * 70, got: false });
    let total = w;
    if (S.level >= 4 && Math.random() < .4) {
      const w2 = L.pw[0] + Math.random() * (L.pw[1] - L.pw[0]), x2 = x + w + 120;
      pits.push({ x: x2, w: w2 });
      for (let i = 0; i < 5; i++) rings.push({ x: x2 + w2 * (i + .5) / 5, y: GROUND - 70 - Math.sin(i / 4 * Math.PI) * 70, got: false });
      total = w + 120 + w2;
    }
    return total;
  }
  r = (r - L.pit) / (1 - L.pit);
  if (r < L.loop && !loops.length) { loops.push({ x, w: 244, ri: 95, used: false }); return 330; }
  if (r < L.loop + .17) {
    const b = { x, w: 220, y: GROUND - 120 }; bridges.push(b);
    if (S.level >= 3 && Math.random() < .5) pits.push({ x: x + 10, w: 200 });
    else obstacles.push({ kind: 'spike', x: x + 60, w: 38, h: 34 }, { kind: 'bot', x: x + 130, w: 40, h: 40, ph: 1 });
    for (let i = 0; i < 6; i++) rings.push({ x: x + 25 + i * 34, y: b.y - 30, got: false });
    return 280;
  }
  const q = Math.random(), hard = S.level / 7;
  if (q < .4 - hard * .15) obstacles.push({ kind: 'spike', x, w: 38, h: 34 });
  else if (q < .75) obstacles.push({ kind: 'bot', x, w: 40, h: 40, ph: Math.random() * 6 });
  else { obstacles.push({ kind: 'spike', x, w: 38, h: 34 }); obstacles.push({ kind: 'spike', x: x + 38, w: 38, h: 34 }); if (hard > .5) obstacles.push({ kind: 'spike', x: x + 76, w: 38, h: 34 }); }
  const high = Math.random() < .5, base = high ? GROUND - 140 : GROUND - 30;
  for (let i = 0; i < 5; i++) rings.push({ x: x + 90 + i * 36, y: base - (high ? Math.sin(i / 4 * Math.PI) * 40 : 0), got: false });
}

/* ---- Mise à jour ---- */
function update() {
  S.t++;
  toasts.forEach(t => t.life--); toasts = toasts.filter(t => t.life > 0);
  if (shake > 0) shake--;
  if (S.banner > 0) S.banner--;
  if (!S.run) return;
  if (S.over) { S.over--; if (S.over === 0) reset(); return; }
  if (S.clear) {
    S.clear--; S.dist += 6; P.vy += .7; P.y = Math.min(GROUND, P.y + P.vy); if (P.y >= GROUND) P.vy = 0;
    clouds.forEach(c => { c.x -= c.s * .6; if (c.x < -120) c.x = W + 60; });
    if (S.clear === 0) { if (S.won) reset(); else startLevel(S.level + 1); }
    return;
  }
  if (P.fall) {
    P.vy += .7; P.y += P.vy; P.ang += .25;
    if (P.y > H + 60) {
      P.fall = false;
      if (!loseLife('🕳️ Tombé dans un trou !')) {
        pits = pits.filter(p => p.x + p.w < P.x - 60 || p.x > P.x + 440);
        bridges = bridges.filter(b => b.x + b.w < P.x - 60 || b.x > P.x + 440);
        P.y = -80; P.vy = 0; P.air = 1;
      }
    }
    return;
  }
  if (S.loop) {
    // le looping : le décor se fige, la mascotte roule en boule le long de l'anneau
    const L = S.loop; L.phi += .09; P.ang += .5; S.dist += 2;
    clouds.forEach(c => { c.x -= c.s * .6; if (c.x < -120) c.x = W + 60; });
    while (L.got < 12 && L.phi > .5 + L.got * Math.PI * 2 / 12.5) { L.got++; S.rings += S.superT > 0 ? 2 : 1; tone(1000 + L.got * 70, .06, 'sine', 1800); }
    if (S.boost > 0) S.boost--; if (S.superT > 0) S.superT--;
    if (L.phi >= Math.PI * 2) { S.loop = null; P.y = GROUND; P.vy = 0; S.inv = Math.max(S.inv, 30); }
    return;
  }
  const mult = (S.boost > 0 ? 1.9 : 1) * (S.superT > 0 ? 1.4 : 1);
  S.speed = LV().speed + S.dist / 9000;
  const v = S.speed * mult;
  S.dist += v;
  if (S.dist / 10 >= LV().len) {
    const top = Object.entries(levelDonors).sort((a, b) => b[1] - a[1])[0];
    S.vip = top ? { user: top[0], stars: prizeFor(S.level) } : null;
    S.clear = (S.level >= LEVELS.length - 1 ? 480 : 200) + (S.vip ? 280 : 0); S.won = S.level >= LEVELS.length - 1;
    obstacles = []; rings = []; pits = []; bridges = []; loops = [];
    toast(S.won ? '🏆 VICTOIRE ! Les 8 niveaux sont terminés' : '✅ Niveau ' + (S.level + 1) + ' terminé !');
    tone(700, .5, 'square', 1400);
    return;
  }
  if (S.boost > 0) S.boost--; if (S.superT > 0) S.superT--; if (S.inv > 0) S.inv--;
  const prevY = P.y;
  P.vy += .7; P.y += P.vy;
  for (const b of bridges) {
    if (P.vy >= 0 && prevY <= b.y + 1 && P.y >= b.y && P.x + 8 > b.x && P.x - 8 < b.x + b.w) { P.y = b.y; P.vy = 0; P.air = 0; }
  }
  if (P.y >= GROUND) { P.y = GROUND; P.vy = 0; P.air = 0; }
  P.ang += P.y < GROUND ? .35 : 0;
  clouds.forEach(c => { c.x -= c.s * .6; if (c.x < -120) c.x = W + 60; });
  const gp = LV().gap;
  spawnIn -= v; if (spawnIn <= 0) { spawnIn = gp[0] + Math.random() * gp[1] + (spawn() || 0); }
  obstacles.forEach(o => o.x -= v); rings.forEach(r => r.x -= v); bridges.forEach(b => b.x -= v); loops.forEach(l => l.x -= v); pits.forEach(p => p.x -= v);
  obstacles = obstacles.filter(o => o.x > -80); rings = rings.filter(r => r.x > -30); pits = pits.filter(p => p.x + p.w > -30);
  bridges = bridges.filter(b => b.x + b.w > -30); loops = loops.filter(l => l.x + l.w > -30);
  if (P.y >= GROUND && pits.some(p => P.x > p.x + 14 && P.x < p.x + p.w - 14)) { P.fall = true; P.vy = 2; tone(500, .7, 'sine', 80); return; }
  for (const l of loops) {
    if (l.used) continue;
    const cx = l.x + l.w / 2;
    if (cx <= P.x && cx > P.x - 40 && P.y >= GROUND - 2) { l.used = true; l.x = P.x - l.w / 2; S.loop = { l, phi: 0, got: 0 }; tone(400, .5, 'sawtooth', 1000); return; }
    if (cx <= P.x - 40) l.used = true;
  }
  const px = P.x, pt = P.y - 44;
  for (const r of rings) if (!r.got && Math.hypot(px - r.x, (P.y - 24) - r.y) < 30) { r.got = true; S.rings += S.superT > 0 ? 2 : 1; tone(1200, .08, 'sine', 1800); }
  for (const o of obstacles) {
    if (o.hit) continue;
    const hit = px + 16 > o.x && px - 16 < o.x + o.w && P.y > GROUND - o.h + 6;
    if (!hit) continue;
    o.hit = true;
    if (S.inv > 0) { tone(150, .2, 'square', 60); continue; }
    if (loseLife()) { /* game over */ } else P.vy = -9;
  }
}

/* ---- Dessin ---- */
function hill(off, col, h, w, sp) {
  g.fillStyle = col; g.beginPath(); g.moveTo(0, GROUND);
  const o = (S.dist * sp) % w;
  for (let x = -w; x <= W + w; x += 20) g.lineTo(x - o, GROUND - h - Math.sin((x - o + off) / w * Math.PI * 2) * h * .5);
  g.lineTo(W + w, GROUND); g.closePath(); g.fill();
}
function drawPico(x, y, t) {
  const sup = S.superT > 0, body = sup ? '#ffd23f' : '#4a1d96', dark = sup ? '#e0a800' : '#2a0f5c', skin = '#ffe7c2', shoe = '#e01b1b';
  g.save(); g.translate(x, y);
  g.shadowColor = 'rgba(255,255,255,.95)'; g.shadowBlur = 9;
  if (S.inv > 0 && S.superT <= 0 && S.boost <= 0 && (S.t >> 2) % 2) g.globalAlpha = .4;
  const air = y < GROUND - 2 || P.fall;
  if (air) {
    g.translate(0, -26); g.rotate(P.ang);
    const bg = g.createRadialGradient(-6, -8, 2, 0, 0, 26); bg.addColorStop(0, sup ? '#fff3b0' : '#9a63f0'); bg.addColorStop(.6, body); bg.addColorStop(1, dark);
    g.fillStyle = dark; g.beginPath(); g.arc(0, 0, 26, 0, 7); g.fill();
    g.fillStyle = bg; g.beginPath(); g.arc(0, 0, 21, 0, 7); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 3; g.beginPath(); g.arc(0, 0, 15, .3, 2.4); g.stroke();
    g.fillStyle = dark; for (let i = 0; i < 3; i++) { g.rotate(2.09); g.beginPath(); g.moveTo(-5, -20); g.lineTo(0, -34); g.lineTo(5, -20); g.fill(); }
  } else {
    const ph = t * .45, wv = Math.sin(t * .4) * 3, bob = Math.abs(Math.sin(ph)) * 2.5;
    g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(2, 0, 24, 5, 0, 0, 7); g.fill();
    g.translate(0, -bob); g.lineCap = 'round'; g.lineJoin = 'round';
    const limb = (x1, y1, x2, y2, x3, y3, w, c) => { g.strokeStyle = c; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo(x2, y2, x3, y3); g.stroke(); };
    const shoeAt = (fx, fy, c) => {
      g.fillStyle = c; g.beginPath(); g.ellipse(fx + 6, fy - 3, 15, 8, 0, 0, 7); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.ellipse(fx + 3, fy - 8, 9, 3.2, 0, 0, 7); g.fill();
      g.fillStyle = '#3a2210'; g.fillRect(fx - 8, fy, 28, 3);
    };
    const leg = (p, c, sc) => {
      const fx = Math.sin(p) * 16 + 2, fy = -6 - Math.max(0, Math.cos(p)) * 10;
      limb(0, -24, fx * .5 + 7, (-24 + fy) / 2, fx, fy - 4, 9, c); shoeAt(fx, fy, sc);
    };
    // piquants courbes
    g.fillStyle = dark;
    [[-70, -58, -88], [-58, -64, -64], [-46, -54, -44], [-36, -44, -26]].forEach(([by, tx, ty]) => {
      g.beginPath(); g.moveTo(-2, by - 10); g.quadraticCurveTo(-26, by - 16 + wv, tx + wv, ty); g.quadraticCurveTo(-24, by + 10, -2, by + 8); g.fill();
    });

  toasts.forEach((t, i) => { g.globalAlpha = Math.min(1, t.life / 40); g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(W / 2 - 190, 90 + i * 34, 380, 28); g.fillStyle = '#fff'; g.font = 'bold 16px Arial'; g.fillText(t.t, W / 2, 105 + i * 34); g.globalAlpha = 1; });
  if (S.banner > 0 && !S.over && !S.clear) {
    g.globalAlpha = Math.min(1, S.banner / 40); g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, 170, W, 110);
    g.fillStyle = '#ffd23f'; g.font = 'bold 40px Arial Black'; g.fillText(L.name.toUpperCase(), W / 2, 225); g.globalAlpha = 1;
  }
  if (S.clear) {
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, 90, W, 110);
    g.fillStyle = '#ffd23f'; g.font = 'bold 46px Arial Black'; g.fillText(S.won ? '🏆 VICTOIRE TOTALE !' : 'NIVEAU ' + (S.level + 1) + ' TERMINÉ !', W / 2, 135);
    g.fillStyle = '#fff'; g.font = 'bold 22px Arial'; g.fillText(S.won ? S.rings + ' anneaux au total' : 'Prochain : ' + LEVELS[S.level + 1].name, W / 2, 180);
    if (S.vip) {
      const bx = W / 2 - 330, by = 215, bw = 660, bh = 150, cxA = bx + 95, cyA = by + bh / 2;
      const bgG = g.createLinearGradient(bx, by, bx + bw, by + bh); bgG.addColorStop(0, '#3b2a00'); bgG.addColorStop(.5, '#7a5a00'); bgG.addColorStop(1, '#3b2a00');
      g.fillStyle = bgG; g.strokeStyle = '#ffd23f'; g.lineWidth = 5; g.shadowColor = '#ffd23f'; g.shadowBlur = 25;
      g.beginPath(); g.roundRect(bx, by, bw, bh, 22); g.fill(); g.stroke(); g.shadowBlur = 0;
      g.fillStyle = '#ffd23f'; g.font = 'bold 16px Arial Black'; g.textAlign = 'left'; g.fillText('👑 BANNIÈRE VIP — GAGNANT DU NIVEAU ' + (S.level + 1), bx + 190, by + 30);
      g.save(); g.beginPath(); g.arc(cxA, cyA, 55, 0, 7); g.closePath(); g.clip();
      const im = avatarImg(S.vip.user);
      if (im && im.complete && im.naturalWidth) g.drawImage(im, cxA - 55, cyA - 55, 110, 110);
      else { g.fillStyle = '#4a1d96'; g.fillRect(cxA - 55, cyA - 55, 110, 110); g.fillStyle = '#fff'; g.font = 'bold 54px Arial Black'; g.textAlign = 'center'; g.fillText(S.vip.user.charAt(0).toUpperCase(), cxA, cyA + 2); g.textAlign = 'left'; }
      g.restore();
      g.strokeStyle = '#ffd23f'; g.lineWidth = 5; g.beginPath(); g.arc(cxA, cyA, 57, 0, 7); g.stroke();
      g.fillStyle = '#fff'; g.font = 'bold 34px Arial Black'; g.fillText('@' + S.vip.user.slice(0, 20), bx + 190, by + 78);
      g.fillStyle = '#ffd23f'; g.font = 'bold 30px Arial Black'; g.fillText('⭐ ' + S.vip.stars + ' étoiles gagnées !', bx + 190, by + 122);
      g.textAlign = 'center';
    }
  }
  if (S.over) {
    g.fillStyle = 'rgba(0,0,0,.65)'; g.fillRect(0, 190, W, 150);
    g.fillStyle = '#ffd23f'; g.font = 'bold 48px Arial Black'; g.fillText('GAME OVER', W / 2, 245);
    g.fillStyle = '#fff'; g.font = 'bold 22px Arial'; g.fillText('Niveau ' + (S.level + 1) + ' — ' + S.rings + ' anneaux — nouvelle partie dans ' + Math.ceil(S.over / 60) + ' s', W / 2, 295);
  }
}
function loop() { update(); draw(); requestAnimationFrame(loop); }

/* ---- Démarrage, simulateur, clavier ---- */
document.getElementById('go').onclick = () => {
  const el = document.getElementById('intro'); el.style.opacity = 0; setTimeout(() => el.style.display = 'none', 500);
  S.run = true; reset(); tone(600, .2, 'square', 1200);
};
for (const [id, coins] of [['k-jump', 1], ['k-turbo', 5], ['k-super', BIG_GIFT]]) {
  document.getElementById(id).onclick = e => {
    e.currentTarget.blur();
    onGift('Clavier', coins);
    if (coins === BIG_GIFT) ArcadeEffects.simulateBigGift('Clavier', BIG_GIFT);
  };
}
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === '1') { e.preventDefault(); onGift('Clavier', 1); }
  else if (e.key === '5') onGift('Clavier', 5);
  else if (e.key === '0') { onGift('Clavier', BIG_GIFT); ArcadeEffects.simulateBigGift('Clavier', BIG_GIFT); }
  else if (e.key === 'p') ArcadeEffects.simulateShare();
});

/* ---- Connexion TikTok Live ---- */
let ws = null; const seen = new Set();
const setLive = t => document.getElementById('live-status').textContent = t;
document.getElementById('in-go').onclick = () => {
  const u = document.getElementById('in-user').value.trim().replace(/^@/, ''), url = document.getElementById('in-url').value.trim();
  if (!u || !url) { setLive('Entrez le pseudo TikTok'); return; }
  if (ws) ws.close();
  try { ws = new WebSocket(url); } catch (e) { setLive('URL invalide'); return; }
  ws.onopen = () => { ws.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username: u })); setLive('Connexion à @' + u + '…'); };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    const type = String(m.type || m.event || '').toLowerCase(), d = m.data || m;
    if (type === 'gift' || type === 'tiktok-gift') {
      const x = d.gift ?? d; if (x.messageId) { if (seen.has(x.messageId)) return; seen.add(x.messageId); }
      onGift(x.uniqueId || x.username || x.nickname || 'inconnu', x.coinCount ?? ((x.coinValue ?? x.diamondCount ?? x.diamonds ?? 1) * (x.repeatCount || 1)), x.avatarDataUri || x.avatarUrl || x.profilePictureUrl || x.profilePicture || '');
    } else if (type === 'viewer' && (d.viewer || d.uniqueId)) {
      const v = d.viewer || d, url = v.avatarDataUri || v.avatarUrl || v.profilePictureUrl || '';
      if (url) for (const id of [v.uniqueId, v.username, v.nickname]) if (id) avatarUrls[id] = url;
    } else if (type === 'status' && d.message) setLive(String(d.message));
  };
  ws.onerror = () => setLive('Erreur de connexion'); ws.onclose = () => setLive('Déconnecté');
};

requestAnimationFrame(loop);
</script>
