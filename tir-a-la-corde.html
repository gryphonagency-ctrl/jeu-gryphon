<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tir à la corde — Griffon Arcade</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #010203;
            font-family: 'Arial Black', Arial, sans-serif;
            color: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            user-select: none;
        }

        #top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 1000px;
            max-width: 95vw;
            margin-bottom: 12px;
            z-index: 60;
        }

        .action-btn {
            width: 170px;
            height: 48px;
            font-size: 15px;
            font-weight: 900;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: transform 0.05s ease;
            text-transform: uppercase;
        }
        .action-btn:active { transform: scale(0.95); }
        #btn-a { background: #00875a; border: 2px solid #00ffaa; box-shadow: 0 0 12px rgba(0,255,170,0.5); }
        #btn-b { background: #b00050; border: 2px solid #ff007f; box-shadow: 0 0 12px rgba(255,0,127,0.5); }

        #game-title {
            color: #ff007f;
            margin: 0;
            font-size: 26px;
            letter-spacing: 4px;
            text-shadow: 0 0 12px #ff007f;
        }

        #viewport {
            width: 1000px;
            height: 562px;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            border: 2px solid #ff007f;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 1366px;
            height: 768px;
            transform-origin: 0 0;
            background: #020406;
        }

        #background-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35;
            z-index: 2;
            pointer-events: none;
            display: none;
        }
        #background-video.is-active { display: block; }

        .bg-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .score-card {
            position: absolute;
            top: 25px;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            z-index: 20;
            background: rgba(0,0,0,0.8);
            padding: 8px 18px;
            border-radius: 8px;
        }
        #score-a { left: 40px; color: #00ffaa; border: 2px solid #00ffaa; box-shadow: 0 0 10px rgba(0,255,170,0.3); }
        #score-b { right: 40px; color: #ff007f; border: 2px solid #ff007f; box-shadow: 0 0 10px rgba(255,0,127,0.3); }

        #ui-meter {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: 900;
            color: #ffcc00;
            z-index: 20;
            background: rgba(0,0,0,0.85);
            padding: 4px 22px;
            border-radius: 20px;
            border: 2px solid #ffcc00;
        }

        #rope-svg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 1366px;
            height: 768px;
            z-index: 14;
            pointer-events: none;
        }

        .rope-layer { fill: none; stroke-linecap: round; }
        .rope-path {
            stroke: #4a2f17;
            stroke-width: 12.5;
            filter: drop-shadow(0px 5px 6px rgba(0,0,0,0.9));
        }
        .rope-base  { stroke: #c9904d; stroke-width: 10; }
        .rope-twist { stroke: url(#ropeTwist); stroke-width: 10; stroke-linecap: butt; }
        .rope-light { stroke: #ffe3b0; stroke-width: 2.2; opacity: .55; }
        .rope-shade { stroke: #5b3a1a; stroke-width: 2.6; opacity: .55; }

        #blade {
            transition: transform 0.15s ease-in;
        }

        /* Conteneurs d'équipe positionnés à Y=180px pour que la corde (Y=45px dans le conteneur) tombe exactement à 225px global */
        .team {
            position: absolute;
            top: 180px;
            width: 330px;
            height: 120px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 15;
            will-change: left;
        }
        #team-a { left: 50px; --lean: 1; }
        #team-b { left: 980px; --lean: -1; }

        .char {
            width: 90px;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transform-origin: bottom center;
            transition: transform 0.25s cubic-bezier(0.25, 0.8, 0.25, 1), top 0.5s ease;
        }

        /* Le corps pivote autour des pieds (skewX piloté par le JS) : les mains restent à la hauteur de la corde (Y=225) */
        .svg-char {
            width: 100%;
            height: 100%;
            overflow: visible;
            transform-origin: 50% 118px;
        }

        /* Les jambes pivotent autour de la hanche (origine posée en JS, en unités du viewBox) */
        .leg { transform-box: view-box; }

        @keyframes flail {
            0% { transform: rotate(35deg) scaleY(0.9); }
            25% { transform: rotate(-40deg) scaleY(1.1); }
            50% { transform: rotate(45deg) scaleY(0.8); }
            75% { transform: rotate(-30deg) scaleY(1.05); }
            100% { transform: rotate(35deg) scaleY(0.9); }
        }
        .char.falling .leg {
            animation: flail 0.15s ease-in-out infinite !important;
        }

        .char.falling .face-normal { display: none; }
        .char.falling .face-scared { display: block !important; }
        .face-scared { display: none; }
        .char.falling .shadow { display: none; }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(6px);
        }
        .btn-main {
            background: #ff007f;
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 22px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 900;
            box-shadow: 0 0 20px #ff007f;
            text-transform: uppercase;
            margin-top: 15px;
        }

        #toggle-controls {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 220;
            width: 38px;
            height: 38px;
            color: white;
            background: rgba(15, 17, 22, .9);
            border: 1px solid #ff007f;
            border-radius: 50%;
            font-size: 19px;
            cursor: pointer;
        }
        #fullscreen-exit {
            position: fixed;
            right: 12px;
            bottom: 12px;
            z-index: 310;
            padding: 10px 14px;
            color: white;
            background: rgba(15, 17, 22, .95);
            border: 1px solid #ff007f;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
        }
        #fullscreen-exit[hidden] { display: none; }
        #live-controls {
            position: fixed;
            z-index: 210;
            top: 58px;
            right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 7px;
            width: min(460px, calc(100vw - 24px));
            max-height: 75vh;
            overflow: auto;
            padding: 12px;
            color: white;
            background: rgba(1, 2, 3, .97);
            border: 1px solid #ff007f;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, .8);
            font: 12px Arial, sans-serif;
        }
        #live-controls[hidden], #team-roster[hidden] { display: none; }
        #live-controls input[type="text"] {
            width: 160px;
            height: 34px;
            padding: 6px 9px;
            color: white;
            background: #151a22;
            border: 1px solid #536071;
            border-radius: 6px;
        }
        #live-controls button, #live-controls label {
            min-height: 34px;
            padding: 7px 10px;
            color: white;
            background: #202a35;
            border: 1px solid #526172;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }
        #live-controls label { display: flex; align-items: center; gap: 6px; cursor: default; }
        #live-controls input[type="range"] { width: 75px; accent-color: #ff007f; }
        #live-status, #background-video-status, #fullscreen-status {
            flex-basis: 100%;
            color: #e8c8d7;
            text-align: center;
        }
        #team-roster {
            position: fixed;
            z-index: 230;
            top: 12px;
            left: 12px;
            width: 220px;
            max-height: 42vh;
            overflow: auto;
            padding: 10px;
            color: #fff;
            background: rgba(5, 9, 14, .94);
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 8px;
            font: 12px Arial, sans-serif;
        }
        #roster-title { margin: -2px -2px 8px; padding: 5px; background: #171e28; cursor: move; font-weight: 900; }
        .roster-green { color: #00ffaa; }
        .roster-pink { color: #ff78b6; }
        #score-a[hidden], #score-b[hidden] { display: none; }
        @media (max-width: 700px) {
            body { height: auto; min-height: 100vh; overflow: auto; justify-content: flex-start; padding: 12px 0; }
            #top-bar { width: 95vw; }
            #viewport { width: 95vw; height: auto; aspect-ratio: 1000 / 562; }
            #toggle-controls { top: auto; bottom: 12px; }
            #live-controls { top: 12px; right: 58px; width: min(460px, calc(100vw - 82px)); }
        }
        body.is-fullscreen {
            display: block;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            padding: 0;
        }
        body.is-fullscreen #top-bar {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100vw - 80px);
            max-width: 700px;
            gap: 6px;
            margin: 0;
            padding: 6px;
            background: rgba(1, 2, 3, .72);
            border-radius: 8px;
            z-index: 100;
        }
        body.is-fullscreen #top-bar .action-btn {
            flex: 0 1 auto;
            width: clamp(72px, 14vw, 170px);
            height: clamp(32px, 5vh, 48px);
            font-size: clamp(10px, 1.1vw, 15px);
        }
        body.is-fullscreen #game-title {
            font-size: clamp(14px, 2vw, 26px);
            letter-spacing: clamp(1px, .3vw, 4px);
            white-space: nowrap;
        }
        body.is-fullscreen #viewport {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            max-width: none;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            z-index: 0;
        }
        body.is-fullscreen #toggle-controls { top: 10px; bottom: auto; }
        body.is-fullscreen #live-controls { top: 58px; right: 10px; }
    </style>
</head>
<body>
    <div id="top-bar">
        <button id="btn-a" class="action-btn" onclick="pullA()">TIRER ◄ (A)</button>
        <h2 id="game-title">TIR À LA CORDE</h2>
        <button id="btn-b" class="action-btn" onclick="pullB()">► TIRER (B)</button>
    </div>

    <button id="toggle-controls" type="button" aria-label="Afficher ou masquer les commandes" title="Commandes">⚙</button>
    <div id="live-controls" aria-label="Commandes du LIVE" hidden>
        <input id="tiktok-username" type="text" maxlength="24" placeholder="@nom_utilisateur" aria-label="Pseudo TikTok Live">
        <button id="connect-live" type="button">CONNECTER LIVE</button>
        <span id="live-status" role="status">HORS LIGNE</span>
        <button id="toggle-roster" type="button">ÉQUIPES</button>
        <button id="toggle-score" type="button" hidden>MASQUER SCORE</button>
        <label for="ai-force">Adversaire <input id="ai-force" type="range" min="0" max="10" step="0.5" value="4.5"></label>
        <label for="pull-speed">Vitesse <input id="pull-speed" type="range" min="0.5" max="2.5" step="0.1" value="1"><span id="speed-value">1,0×</span></label>
        <button id="sim-vert" type="button">TEST VERT</button>
        <button id="sim-rose" type="button">TEST ROSE</button>
        <button id="sim-gift-vert" type="button">CADEAU VERT</button>
        <button id="sim-gift-rose" type="button">CADEAU ROSE</button>
        <button id="sim-big-vert" type="button">GROS CADEAU VERT</button>
        <button id="sim-big-rose" type="button">GROS CADEAU ROSE</button>
        <label for="sound-enabled">Sons <input id="sound-enabled" type="checkbox" checked></label>
        <label for="sound-volume">Volume <input id="sound-volume" type="range" min="0" max="1" step="0.05" value="0.6"></label>
        <button id="choose-background-video" type="button">CHOISIR UNE VIDÉO</button>
        <input id="background-video-input" type="file" accept="video/*" hidden>
        <button id="remove-background-video" type="button">RETIRER LA VIDÉO</button>
        <span id="background-video-status" role="status">Aucune vidéo sélectionnée.</span>
        <button id="fullscreen-toggle" type="button">PLEIN ÉCRAN LARGE</button>
        <span id="fullscreen-status" role="status"></span>
        <div data-save-key="tir-a-la-corde-save"></div>
    </div>
    <button id="fullscreen-exit" type="button" hidden>QUITTER LE PLEIN ÉCRAN</button>
    <aside id="team-roster" hidden aria-label="File des équipes">
        <div id="roster-title">JOUEURS · GLISSER POUR DÉPLACER</div>
        <div id="roster-list">En attente des choix dans le chat.</div>
    </aside>

    <div id="viewport">
        <div id="game-container">
            <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
                <radialGradient id="g-skin" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#ffe6cb"/><stop offset=".6" stop-color="#f3c398"/><stop offset="1" stop-color="#d79a68"/></radialGradient>
                <linearGradient id="g-green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#087a56"/><stop offset=".5" stop-color="#0d6a4b"/><stop offset="1" stop-color="#06392a"/></linearGradient>
                <linearGradient id="g-pants" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f7a58"/><stop offset=".55" stop-color="#0a5a41"/><stop offset="1" stop-color="#063a2b"/></linearGradient>
                <linearGradient id="g-pink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5c92"/><stop offset=".5" stop-color="#f0286c"/><stop offset="1" stop-color="#a80f46"/></linearGradient>
                <radialGradient id="g-hood" cx=".4" cy=".3" r=".85"><stop offset="0" stop-color="#ff6b9d"/><stop offset=".6" stop-color="#f0286c"/><stop offset="1" stop-color="#a80f46"/></radialGradient>
                <radialGradient id="g-mask" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#3a3a44"/><stop offset=".5" stop-color="#15151a"/><stop offset="1" stop-color="#050507"/></radialGradient>
            </defs></svg>
            <!-- DÉCOR DE LA SCÈNE -->
            <svg class="bg-svg" viewBox="0 0 1366 768" preserveAspectRatio="none">
                <defs>
                    <radialGradient id="cyanLamp" cx="50%" cy="0%" r="90%">
                        <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8"/>
                        <stop offset="35%" stop-color="#00b386" stop-opacity="0.25"/>
                        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
                    </radialGradient>

                    <linearGradient id="yellowSteel" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffd000"/>
                        <stop offset="50%" stop-color="#e6b800"/>
                        <stop offset="100%" stop-color="#997a00"/>
                    </linearGradient>

                    <linearGradient id="fadeDown" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#111822" stop-opacity="1"/>
                        <stop offset="70%" stop-color="#080c12" stop-opacity="0.95"/>
                        <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
                    </linearGradient>

                    <linearGradient id="voidG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08121f"/><stop offset=".35" stop-color="#050b17"/><stop offset=".7" stop-color="#02040a"/><stop offset="1" stop-color="#000"/></linearGradient>
                    <radialGradient id="voidBlue" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2f6bff" stop-opacity=".32"/><stop offset=".6" stop-color="#2a1a8a" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
                    <radialGradient id="voidPink" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff2d95" stop-opacity=".28"/><stop offset="1" stop-color="#ff2d95" stop-opacity="0"/></radialGradient>
                    <linearGradient id="cableG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b8fb8" stop-opacity=".55"/><stop offset="1" stop-color="#3b8fb8" stop-opacity="0"/></linearGradient>
                    <linearGradient id="wallFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08121f" stop-opacity="0"/><stop offset="1" stop-color="#08121f" stop-opacity="1"/></linearGradient>
                    <linearGradient id="voidVeil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></linearGradient>
                    <radialGradient id="lampGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".2" stop-color="#d9fff6" stop-opacity=".85"/><stop offset=".55" stop-color="#27ffd0" stop-opacity=".28"/><stop offset="1" stop-color="#00ffcc" stop-opacity="0"/></radialGradient>
                    <linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6fffa" stop-opacity=".5"/><stop offset=".45" stop-color="#4dffd8" stop-opacity=".16"/><stop offset="1" stop-color="#00ffcc" stop-opacity="0"/></linearGradient>
                    <radialGradient id="lampPool" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#eafff9" stop-opacity=".6"/><stop offset=".5" stop-color="#3dffd0" stop-opacity=".22"/><stop offset="1" stop-color="#00ffcc" stop-opacity="0"/></radialGradient>
                    <linearGradient id="lampMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b7587"/><stop offset=".5" stop-color="#2a313d"/><stop offset="1" stop-color="#12161d"/></linearGradient>
                    <filter id="beamBlur" x="-30%" y="-10%" width="160%" height="130%"><feGaussianBlur stdDeviation="7"/></filter>
                    <linearGradient id="bladeSteel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#c3ccd8"/><stop offset=".6" stop-color="#8a95a6"/><stop offset="1" stop-color="#eef3f9"/></linearGradient>
                    <linearGradient id="postSteel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7f8a9c"/><stop offset=".5" stop-color="#3a4250"/><stop offset="1" stop-color="#171b23"/></linearGradient>
                    <pattern id="hazard" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(45)"><rect width="16" height="16" fill="#111"/><rect width="8" height="16" fill="#ffd000"/></pattern>
                    <pattern id="yellowTruss" width="40" height="40" patternUnits="userSpaceOnUse">
                        <line x1="0" y1="0" x2="40" y2="40" stroke="#ffd000" stroke-width="4"/>
                        <line x1="40" y1="0" x2="0" y2="40" stroke="#ffd000" stroke-width="4"/>
                        <rect x="0" y="0" width="40" height="40" fill="none" stroke="#b39000" stroke-width="2"/>
                    </pattern>
                </defs>

                <rect width="1366" height="768" fill="#020508"/>

                <!-- LE VIDE -->
                <g id="void">
                    <rect x="0" y="280" width="1366" height="488" fill="url(#voidG)"/>
                    <ellipse cx="683" cy="610" rx="460" ry="190" fill="url(#voidBlue)"/>
                    <ellipse cx="683" cy="735" rx="360" ry="90" fill="url(#voidPink)"/>
                    <rect x="455" y="300" width="4" height="420" fill="url(#cableG)"/><circle cx="457" cy="380" r="3" fill="#7dd3fc" opacity=".6"/><rect x="520" y="300" width="4" height="420" fill="url(#cableG)"/><circle cx="522" cy="450" r="3" fill="#7dd3fc" opacity=".6"/><rect x="590" y="300" width="4" height="420" fill="url(#cableG)"/><circle cx="592" cy="350" r="3" fill="#7dd3fc" opacity=".6"/><rect x="776" y="300" width="4" height="420" fill="url(#cableG)"/><circle cx="778" cy="350" r="3" fill="#7dd3fc" opacity=".6"/><rect x="846" y="300" width="4" height="420" fill="url(#cableG)"/><circle cx="848" cy="450" r="3" fill="#7dd3fc" opacity=".6"/><rect x="911" y="300" width="4" height="420" fill="url(#cableG)"/><circle cx="913" cy="380" r="3" fill="#7dd3fc" opacity=".6"/>

    <script>
        let pos = 0, shown = 0, ropeCut = false, active = false, ca = 0, cb = 0, tA, tB, speed = 1, socket = null;
        const limit = 220;
        const teams = new Map();
        const seenGiftIds = new Set();
        const tA_el = document.getElementById('team-a'), tB_el = document.getElementById('team-b');
        const ropeSide = side => { const els = [...document.querySelectorAll('.rope-layer[data-side="' + side + '"]')]; return { setAttribute: (k, v) => els.forEach(e => e.setAttribute(k, v)) }; };
        const rLeft = ropeSide('left'), rRight = ropeSide('right'), rMarker = document.getElementById('rope-marker-svg');
        const ropeTwistPattern = document.getElementById('ropeTwist');
        const blade = document.getElementById('blade');
        const liveStatus = document.getElementById('live-status');
        const roster = document.getElementById('team-roster');
        const rosterList = document.getElementById('roster-list');
        const backgroundVideo = document.getElementById('background-video');
        const backgroundVideoInput = document.getElementById('background-video-input');
        const backgroundVideoStatus = document.getElementById('background-video-status');
        let backgroundVideoUrl = null;

        function resizeViewport() {
            const vp = document.getElementById('viewport');
            const gc = document.getElementById('game-container');
            const scale = Math.min(vp.clientWidth / 1366, vp.clientHeight / 768);
            gc.style.transform = `scale(${scale})`;
            gc.style.left = `${(vp.clientWidth - 1366 * scale) / 2}px`;
            gc.style.top = `${(vp.clientHeight - 768 * scale) / 2}px`;
        }
        window.addEventListener('resize', resizeViewport);
        resizeViewport();

        function clearBackgroundVideo(message) {
            backgroundVideo.pause();
            backgroundVideo.removeAttribute('src');
            backgroundVideo.classList.remove('is-active');
            backgroundVideoInput.value = '';
            if (backgroundVideoUrl) URL.revokeObjectURL(backgroundVideoUrl);
            backgroundVideoUrl = null;
            backgroundVideo.load();
            backgroundVideoStatus.textContent = message;
        }

        document.getElementById('choose-background-video').addEventListener('click', () => {
            backgroundVideoInput.click();
        });
        backgroundVideoInput.addEventListener('change', async () => {
            const file = backgroundVideoInput.files && backgroundVideoInput.files[0];
            if (!file) return;

            if (backgroundVideoUrl) URL.revokeObjectURL(backgroundVideoUrl);
            backgroundVideoUrl = URL.createObjectURL(file);
            backgroundVideo.src = backgroundVideoUrl;
            backgroundVideo.classList.add('is-active');
            backgroundVideo.load();
            try {
                await backgroundVideo.play();
                backgroundVideoStatus.textContent = `Vidéo active : ${file.name}`;
            } catch (error) {
                console.warn('Lecture de la vidéo d’arrière-plan impossible :', error);
                backgroundVideoStatus.textContent = 'Lecture impossible. Essaie un format vidéo compatible.';
            }
        });
        backgroundVideo.addEventListener('error', () => {
            if (backgroundVideoUrl) {
                clearBackgroundVideo('Format ou codec vidéo non pris en charge par ce navigateur.');
            }
        });
        document.getElementById('remove-background-video').addEventListener('click', () => {
            clearBackgroundVideo('Aucune vidéo sélectionnée.');
        });

        const fullscreenToggle = document.getElementById('fullscreen-toggle');
        const fullscreenExit = document.getElementById('fullscreen-exit');
        const fullscreenStatus = document.getElementById('fullscreen-status');
        async function toggleFullscreen() {
            try {
                if (document.fullscreenElement) {
                    await document.exitFullscreen();
                } else if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else {
                    fullscreenStatus.textContent = 'Le plein écran n’est pas disponible dans ce navigateur.';
                }
            } catch (error) {
                console.warn('Impossible de changer le mode plein écran :', error);
                fullscreenStatus.textContent = 'Impossible de changer le mode plein écran.';
            }
        }
        fullscreenToggle.addEventListener('click', toggleFullscreen);
        fullscreenExit.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', () => {
            const isFullscreen = Boolean(document.fullscreenElement);
            document.body.classList.toggle('is-fullscreen', isFullscreen);
            fullscreenToggle.textContent = isFullscreen ? 'QUITTER LE PLEIN ÉCRAN' : 'PLEIN ÉCRAN LARGE';
            fullscreenExit.hidden = !isFullscreen;
            if (isFullscreen) document.getElementById('live-controls').hidden = true;
            resizeViewport();
        });

        function resetChars() {
            document.querySelectorAll('.char').forEach(c => {
                c.classList.remove('falling');
                c.style.top = "0px";
                c.style.transform = "rotate(0deg)";
            });
            blade.style.transform = "translateY(0px)";
            ropeCut = false;
            rLeft.setAttribute('y1', 225);
            rLeft.setAttribute('y2', 225);
            rRight.setAttribute('y1', 225);
            rRight.setAttribute('y2', 225);
            render();
        }

        /* Affichage fluide : la position affichée (shown) rattrape la position réelle (pos) à chaque image */
        function render() {
            const centerPos = 683 + shown;
            tA_el.style.left = (50 + shown) + "px";
            tB_el.style.left = (980 + shown) + "px";
            if (!ropeCut) {
                rLeft.setAttribute('x1', 90 + shown);
                rLeft.setAttribute('x2', centerPos);
                rRight.setAttribute('x1', centerPos);
                rRight.setAttribute('x2', 1276 + shown);
            }
            rMarker.setAttribute('cx', centerPos);
            ropeTwistPattern.setAttribute('patternTransform', `translate(${shown.toFixed(2)} 0) rotate(-32)`);
        }

        /* ===== Animation des joueurs =====
           Chaque joueur a : une inclinaison (lean) qui suit une cible par ressort, et deux jambes qui font de vrais pas
           (le pied se lève de quelques pixels puis se repose, il ne balance plus dans le vide). */
        const rig = [];
        [['a', 1, 77], ['b', -1, 81]].forEach(([t, s, hip]) => {
            document.querySelectorAll(`#team-${t} .char`).forEach((c, i) => {
                const l = c.querySelector('.leg-l'), r = c.querySelector('.leg-r');
                l.style.transformOrigin = `38.5px ${hip}px`;
                r.style.transformOrigin = `51.5px ${hip}px`;
                rig.push({ c, t, s, i, svg: c.querySelector('.svg-char'), l, r, e: 0, lean: 0, ph: i * 1.9, vs: 0 });
            });
        });
        let prevShown = 0, clock = 0;

        function pulse(team, amount) {
            rig.filter(p => p.t === team).forEach(p => {
                setTimeout(() => { p.e = Math.min(1.6, p.e + amount); }, p.i * 55);
            });
        }

        function animateRig(v) {
            clock += 1;
            rig.forEach(p => {
                p.e *= 0.94;
                const sway = active ? 1.3 * Math.sin(clock / 26 + p.i * 1.7) : 0;
                const target = active ? 8 + 11 * p.e + sway : 0;
                p.lean += (target - p.lean) * 0.2;
                p.svg.style.transform = `skewX(${(p.s * p.lean).toFixed(2)}deg)`;

                /* pas : la phase avance avec la vitesse réelle de l'équipe */
                p.vs += (Math.abs(v) - p.vs) * 0.15;
                p.ph += p.vs * 0.55;
                const amp = Math.min(1, p.vs / 1.2) * 6;
                const liftL = Math.max(0, Math.sin(p.ph)) * amp;
                const liftR = Math.max(0, -Math.sin(p.ph)) * amp;
                /* posture : jambe avant vers la corde, jambe arrière en appui, pieds au sol */
                const front = -p.s * 8, back = p.s * 8;
                const dir = Math.sign(v) * p.s;   /* >0 : l'équipe recule */
                const aL = (p.s === 1 ? back : front) + (liftL > 0 ? -dir * 3 : 0);
                const aR = (p.s === 1 ? front : back) + (liftR > 0 ? -dir * 3 : 0);
                p.l.style.transform = `translateY(${(-liftL).toFixed(2)}px) rotate(${aL.toFixed(2)}deg)`;
                p.r.style.transform = `translateY(${(-liftR).toFixed(2)}px) rotate(${aR.toFixed(2)}deg)`;
            });
        }

        function frame() {
            const diff = pos - shown;
            shown = Math.abs(diff) < 0.05 ? pos : shown + diff * 0.2;
            render();
            animateRig(shown - prevShown);
            prevShown = shown;
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        function startGame() {
            pos = 0; shown = 0; ca = 0; cb = 0; active = true;
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('game-container').classList.add('playing');
            resetChars();
            tA_el.style.top = "180px"; tB_el.style.top = "180px";
            update();
        }

        function update() {
            document.getElementById('ui-meter').innerText = Math.abs(Math.round(pos / 5));
            document.getElementById('ui-meter').style.color = pos < 0 ? "#00ffaa" : (pos > 0 ? "#ff007f" : "#ffcc00");
            document.getElementById('fa').innerText = ca;
            document.getElementById('fb').innerText = cb;
        }

        function pullA(force = 10) {
            if (!active) return; pos -= force * speed; ca++; update();
            pulse('a', 0.9); pulse('b', 0.3); check();
        }

        function pullB(force = 10) {
            if (!active) return; pos += force * speed; cb++; update();
            pulse('b', 0.9); pulse('a', 0.3); check();
        }

        /* L'adversaire rose tire un petit peu tout seul (sans toucher au score des spectateurs) */
        let aiForce = 4.5;
        function aiPull() {
            if (!active || aiForce <= 0) return;
            pos += aiForce * (0.6 + Math.random() * 0.8) * speed;
            update(); pulse('b', 0.45); check();
        }
        (function aiLoop() { aiPull(); setTimeout(aiLoop, 420 + Math.random() * 600); })();
        document.getElementById('ai-force').addEventListener('input', e => { aiForce = parseFloat(e.target.value); });

        function triggerChainFall(losingTeam) {
            const isTeamA = losingTeam === 'a';
            const chars = isTeamA ? ['a-1', 'a-2', 'a-3'] : ['b-1', 'b-2', 'b-3'];

            blade.style.transform = "translateY(88px)";

            setTimeout(() => {
                ropeCut = true;
                if (isTeamA) {
                    rLeft.setAttribute('x2', 450);
                    rLeft.setAttribute('y2', 500);
                } else {
                    rRight.setAttribute('x1', 916);
                    rRight.setAttribute('y1', 500);
                }

                const c1 = document.getElementById(chars[0]);
                c1.classList.add('falling');
                c1.style.transform = isTeamA ? "rotate(75deg)" : "rotate(-75deg)";
                c1.style.top = "180px";
            }, 150);

            setTimeout(() => {
                const c2 = document.getElementById(chars[1]);
                c2.classList.add('falling');
                c2.style.transform = isTeamA ? "rotate(65deg)" : "rotate(-65deg)";
                c2.style.top = "240px";
                document.getElementById(chars[0]).style.top = "360px";
            }, 400);

            setTimeout(() => {
                const c3 = document.getElementById(chars[2]);
                c3.classList.add('falling');
                c3.style.transform = isTeamA ? "rotate(55deg)" : "rotate(-55deg)";
                c3.style.top = "300px";
                document.getElementById(chars[1]).style.top = "420px";
                document.getElementById(chars[0]).style.top = "540px";
            }, 650);
        }

        function check() {
            if (pos >= limit) {
                end("LES GARDIENS GAGNENT !");
                triggerChainFall('a');
            } else if (pos <= -limit) {
                end("L'ÉQUIPE A GAGNE !");
                triggerChainFall('b');
            }
        }

        function end(txt) {
            active = false;
            document.getElementById('game-container').classList.remove('playing');
            document.getElementById('win-txt').innerText = txt;
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'flex';
                document.querySelector('.btn-main').innerText = "Rejouer";
            }, 2200);
        }

        function normalizeName(value) {
            return String(value || '').trim().replace(/^@/, '').slice(0, 40);
        }

        function normalizeComment(value) {
            return String(value || '').trim().toLocaleLowerCase('fr-FR').normalize('NFD').replace(/\p{Diacritic}/gu, '');
        }

        function renderRoster() {
            if (!teams.size) {
                rosterList.textContent = 'En attente des choix dans le chat.';
                return;
            }
            rosterList.replaceChildren();
            for (const [name, team] of teams) {
                const player = document.createElement('div');
                player.className = team === 'vert' ? 'roster-green' : 'roster-pink';
                player.textContent = `${team === 'vert' ? '● VERT' : '● ROSE'} · @${name}`;
                rosterList.appendChild(player);
            }
        }

        function chooseTeam(username, team) {
            const name = normalizeName(username);
            if (!name || !team) return false;
            teams.set(name.toLocaleLowerCase('fr-FR'), team);
            renderRoster();
            liveStatus.textContent = `@${name} rejoint l'équipe ${team.toUpperCase()}.`;
            return true;
        }

        function onTikTokComment(username, text) {
            const comment = normalizeComment(text);
            if (/^(?:!\s*)?(?:vert|verte|equipe\s+verte|green|1)$/.test(comment)) {
                chooseTeam(username, 'vert');
            } else if (/^(?:!\s*)?(?:rose|equipe\s+rose|pink|2)$/.test(comment)) {
                chooseTeam(username, 'rose');
            }
        }

        function teamFor(username) {
            const name = normalizeName(username) || 'visiteur';
            const key = name.toLocaleLowerCase('fr-FR');
            if (teams.has(key)) return teams.get(key);
            const greenCount = [...teams.values()].filter(team => team === 'vert').length;
            const team = greenCount <= teams.size - greenCount ? 'vert' : 'rose';
            chooseTeam(name, team);
            return team;
        }

        function onGift(gift, simulated = false) {
            const username = normalizeName(gift.uniqueId || gift.username || gift.nickname || gift.user) || 'visiteur';
            const messageId = String(gift.messageId || gift.msgId || '');
            const repetitions = Math.max(1, Number(gift.repeatCount) || 1);
            if (gift.repeatEnd !== undefined && ![true, 1, '1'].includes(gift.repeatEnd)) return;
            if (messageId) {
                if (seenGiftIds.has(messageId)) return;
                seenGiftIds.add(messageId);
                if (seenGiftIds.size > 1200) seenGiftIds.delete(seenGiftIds.values().next().value);
            }
            const coins = Math.max(1, Number(gift.coinCount) || ((Number(gift.coinValue) || Number(gift.diamondCount) || Number(gift.diamonds) || 1) * repetitions));
            const force = 10 * Math.min(5, 1 + Math.log2(coins) / 2);
            chooseTeam(username, 'vert');
            pullA(force);
            liveStatus.textContent = `🎁 @${username} tire pour l'équipe A (VERT) · ${coins} pièce${coins > 1 ? 's' : ''}.`;
            if (simulated && coins >= 100 && window.ArcadeEffects) {
                window.ArcadeEffects.simulateBigGift(username, coins);
            }
        }

        function handleLiveMessage(message) {
            if (!message || typeof message !== 'object') return;
            const data = message.data && typeof message.data === 'object' ? message.data : message;
            const type = String(message.type || message.event || data.type || '').toLowerCase();
            if (type === 'gift' || type === 'tiktok-gift') {
                onGift(data.gift || data);
            } else if (type === 'comment' || type === 'chat' || type === 'tiktok-comment') {
                const comment = data.commentData || data;
                onTikTokComment(comment.uniqueId || comment.username || comment.nickname, comment.comment || comment.text || comment.message);
            } else if (type === 'status') {
                liveStatus.textContent = String(data.message || 'État du LIVE mis à jour.');
            }
        }

        function connectLive() {
            if (socket) {
                socket.close();
                socket = null;
                liveStatus.textContent = 'HORS LIGNE';
                document.getElementById('connect-live').textContent = 'CONNECTER LIVE';
                return;
            }
            const username = normalizeName(document.getElementById('tiktok-username').value);
            if (!/^[\w.]{2,24}$/.test(username)) {
                liveStatus.textContent = 'Saisis un pseudo TikTok valide (2 à 24 caractères).';
                return;
            }
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const currentSocket = new WebSocket(`${protocol}//${window.location.host}`);
            socket = currentSocket;
            liveStatus.textContent = `Connexion au LIVE @${username}…`;
            currentSocket.addEventListener('open', () => {
                currentSocket.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username }));
                document.getElementById('connect-live').textContent = 'DÉCONNECTER';
            });
            currentSocket.addEventListener('message', event => {
                try {
                    handleLiveMessage(JSON.parse(String(event.data)));
                } catch (error) {
                    console.error('Message TikTok illisible :', error);
                    liveStatus.textContent = 'Un message LIVE illisible a été ignoré.';
                }
            });
            currentSocket.addEventListener('error', () => {
                liveStatus.textContent = 'Connexion au serveur TikTok impossible.';
            });
            currentSocket.addEventListener('close', () => {
                if (socket === currentSocket) socket = null;
                document.getElementById('connect-live').textContent = 'CONNECTER LIVE';
                liveStatus.textContent = 'HORS LIGNE';
            });
        }

        document.getElementById('connect-live').addEventListener('click', connectLive);
        document.getElementById('pull-speed').addEventListener('input', event => {
            speed = Number(event.target.value);
            document.getElementById('speed-value').textContent = speed.toFixed(1).replace('.', ',') + '×';
        });
        document.getElementById('toggle-score').addEventListener('click', event => {
            const hide = !document.getElementById('score-a').hidden;
            document.getElementById('score-a').hidden = hide;
            document.getElementById('score-b').hidden = hide;
            event.currentTarget.textContent = hide ? 'AFFICHER SCORE' : 'MASQUER SCORE';
        });
        document.getElementById('toggle-roster').addEventListener('click', () => {
            roster.hidden = !roster.hidden;
        });
        document.getElementById('toggle-controls').addEventListener('click', () => {
            const controls = document.getElementById('live-controls');
            controls.hidden = !controls.hidden;
        });
        function updateEffectSound() {
            if (window.ArcadeEffects) {
                window.ArcadeEffects.setSound(
                    document.getElementById('sound-enabled').checked,
                    Number(document.getElementById('sound-volume').value)
                );
            }
        }
        document.getElementById('sound-enabled').addEventListener('change', updateEffectSound);
        document.getElementById('sound-volume').addEventListener('input', updateEffectSound);
        updateEffectSound();
        document.getElementById('sim-vert').addEventListener('click', () => onTikTokComment('Simulation verte', 'vert'));
        document.getElementById('sim-rose').addEventListener('click', () => onTikTokComment('Simulation rose', 'rose'));
        document.getElementById('sim-gift-vert').addEventListener('click', () => {
            onTikTokComment('Simulation verte', 'vert');
            onGift({ uniqueId: 'Simulation verte', coinCount: 1, messageId: `sim-green-${Date.now()}` }, true);
        });
        document.getElementById('sim-gift-rose').addEventListener('click', () => {
            onTikTokComment('Simulation rose', 'rose');
            onGift({ uniqueId: 'Simulation rose', coinCount: 1, messageId: `sim-pink-${Date.now()}` }, true);
        });
        document.getElementById('sim-big-vert').addEventListener('click', () => {
            onTikTokComment('Simulation verte', 'vert');
            onGift({ uniqueId: 'Simulation verte', coinCount: 100, messageId: `sim-big-green-${Date.now()}` }, true);
        });
        document.getElementById('sim-big-rose').addEventListener('click', () => {
            onTikTokComment('Simulation rose', 'rose');
            onGift({ uniqueId: 'Simulation rose', coinCount: 100, messageId: `sim-big-pink-${Date.now()}` }, true);
        });
        document.getElementById('roster-title').addEventListener('pointerdown', event => {
            const bounds = roster.getBoundingClientRect();
            const offsetX = event.clientX - bounds.left, offsetY = event.clientY - bounds.top;
            function move(moveEvent) {
                roster.style.left = `${Math.max(0, moveEvent.clientX - offsetX)}px`;
                roster.style.top = `${Math.max(0, moveEvent.clientY - offsetY)}px`;
                roster.style.right = 'auto';
            }
            function stop() {
                document.removeEventListener('pointermove', move);
                document.removeEventListener('pointerup', stop);
            }
            document.addEventListener('pointermove', move);
            document.addEventListener('pointerup', stop);
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'A' || e.key === 'q' || e.key === 'Q' || e.key === 'ArrowLeft') pullA();
            if (e.key === 'l' || e.key === 'L' || e.key === 'p' || e.key === 'P' || e.key === 'ArrowRight') pullB();
        });
    </script>
</body>
</html>
