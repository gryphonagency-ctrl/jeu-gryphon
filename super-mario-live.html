<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mario</title>
<style>
:root{--bg:#111;--fg:#fff;--accent:#fe2c55;--cyan:#25f4ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;height:100vh}
#panel{background:rgba(0,0,0,.85);padding:10px;border-radius:12px;margin:10px;border:2px solid var(--accent);box-shadow:0 0 15px rgba(254,44,85,.4);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:100%}
.gift{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:20px;cursor:pointer;font-weight:bold;font-size:.85rem;text-transform:uppercase;transition:transform .1s}
.gift:hover{transform:scale(1.06)}
#wrap{position:fixed;inset:0;overflow:hidden;background:#000}
#game{position:absolute;left:50%;top:50%;width:800px;height:400px;transform-origin:center;overflow:hidden}
canvas{position:absolute;top:0;left:0;image-rendering:pixelated}
#welcome{position:absolute;inset:0;z-index:5;background:linear-gradient(rgba(10,10,40,.8),rgba(60,10,70,.85));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:#fff;text-shadow:0 3px 0 #000}
#welcome h1{margin:0;font-size:48px;color:#ffd21a;letter-spacing:1px}
#welcome p{margin:0;font-size:28px;font-weight:700;animation:wpulse 1.2s ease-in-out infinite}
#welcome small{opacity:.8;font-size:16px}
#welcome.off{display:none}
@keyframes wpulse{50%{transform:scale(1.07)}}
#hint{font-size:.8rem;opacity:.7;margin:8px;text-align:center}
#login{position:absolute;inset:0;z-index:5;background:rgba(10,10,20,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center}
#login h1{margin:0;font-size:1.6rem}
#login input{width:260px;padding:12px 14px;border-radius:10px;border:2px solid #25f4ee;background:#000;color:#fff;font-size:1.05rem;text-align:center;outline:none}
#login button{background:#fe2c55;color:#fff;border:none;padding:12px 28px;border-radius:24px;font-weight:bold;font-size:1rem;cursor:pointer}
#login small{opacity:.65;max-width:420px}
#loginErr{color:#ff6b6b;min-height:1.2em;font-size:.9rem}
#gear{position:absolute;right:8px;top:44px;z-index:7;background:#ff7a00;border:0;color:#fff;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;padding:6px 12px}
#settings{position:absolute;right:8px;top:80px;bottom:8px;width:290px;z-index:6;background:rgba(10,10,20,.95);color:#fff;border:2px solid #25f4ee;border-radius:10px;padding:10px 12px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:7px}
#settings[hidden]{display:none}
#settings label{display:flex;justify-content:space-between;align-items:center;gap:8px}
#settings input[type=number],#settings input[type=text]{width:90px;background:#000;color:#fff;border:1px solid #25f4ee;border-radius:6px;padding:3px 6px}
#settings button{background:#fe2c55;color:#fff;border:none;border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:bold}
#settings hr{border:0;border-top:1px solid #444;width:100%}
#rwLog{white-space:pre-wrap;font-size:12px;opacity:.85;min-height:40px}
.sh{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<script src="/arcade-effects.js"></script>
<div id="wrap"><div id="game"><canvas id="gameCanvas" width="800" height="400"></canvas>
  <div id="welcome"><h1>Bienvenue chez Mario</h1><p>Une ⭐ vous permettra de lancer la partie</p></div></div>
  <button id="gear" title="Panneau (F2)">⚙ Panneau</button>
  <div id="settings">
    <div class="sh"><b>⚙ Panneau de contrôle</b><button id="setClose">✕</button></div>
    <b>Partie</b>
    <button id="launch">▶ Lancer la partie</button>
    <button id="reset">🔄 Nouvelle partie</button>
    <div data-save-key="super-mario-live-save"></div>
    <hr>
    <b>Connexion TikTok</b>
    <input id="pseudoInput" type="text" maxlength="32" placeholder="@pseudo TikTok" autocomplete="off" style="width:100%">

      <button data-sim="Ice Cream">🍦 Reculer</button>

      <button data-sim="Pipe">🕳️ Tuyau</button>
      <button id="simBig">💎 Gros cadeau</button>
      <button id="simShare">✈️ Partage</button>

</div></div>

<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),game=document.getElementById('game'),wrap=document.getElementById('wrap');
const solY=350,MW=36,MH=48;
let logged=false,pseudo='',ws=null,wsOk=false;
const $=id=>document.getElementById(id);
let S={vol:60,mute:false,rtp:10,rwName:'Rose',rwVal:1,gv:{Rose:1,TikTok:1,'Ice Cream':1,Star:100,Pipe:0}};
try{const q=JSON.parse(localStorage.getItem('mtl_s')||'null');if(q)S={...S,...q,gv:{...S.gv,...(q.gv||{}),Star:100,Pipe:0},rtp:q.rtpV2?q.rtp:10,rtpV2:1};}catch(e){}
const saveS=()=>{try{localStorage.setItem('mtl_s',JSON.stringify(S));}catch(e){}};
/* ---------- Sons 8 bits synthétisés (WebAudio) ---------- */
let AC=null,master=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  if(master)master.gain.value=S.mute?0:S.vol/100*.5;
  return AC;
}
function tone(f,d,type,v,to,delay){
  const a=audio();if(!a)return;const t0=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);
  g.gain.setValueAtTime(v||.3,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+.02);
}
const seq=(fs,d,type,v,step)=>fs.forEach((f,i)=>tone(f,d,type,v,0,i*step));
const SFX={
  jump:()=>tone(260,.18,'square',.3,780),
  stomp:()=>{tone(200,.1,'square',.35,70);tone(500,.06,'square',.2,0,.05);},
  kick:()=>tone(150,.12,'sawtooth',.3,60),
  coin:()=>{tone(988,.08,'square',.25);tone(1319,.3,'square',.25,0,.08);},
  star:()=>seq([523,659,784,1047,784,1047],.07,'square',.22,.06),
  die:()=>seq([494,466,440,415,392,330,262],.12,'triangle',.35,.1),
  pipe:()=>tone(400,.4,'square',.28,90),
  clear:()=>seq([523,659,784,1047,1319,1568],.14,'square',.25,.11),
  over:()=>seq([392,330,262,196],.25,'triangle',.35,.22)
};
const sfx=n=>{try{SFX[n]&&SFX[n]();}catch(e){}};
/* ---------- Récompenses (RTP) ---------- */
let recvPool=0,contrib={},rwLog=[],rwMsg='',vip=[];
const avatars={};
function setAvatar(keys,src){if(!src)return;const im=new Image();im.src=src;keys.filter(Boolean).forEach(k=>{avatars[String(k).slice(0,20)]=im;});}
function updStats(){$('rwStats').textContent='Valeur reçue à reverser : '+Math.round(recvPool*10)/10+' pièces';$('rwLog').textContent=rwLog.slice(0,30).join('\n');}
function recv(g,user){const v=+S.gv[g]||0;if(!v)return;recvPool+=v;const u=user||pseudo||'Joueur';contrib[u]=(contrib[u]||0)+v;updStats();}
function levelReward(){
  const unit=Math.max(1,+S.rwVal||1),rate=Math.max(0,Math.min(100,+S.rtp||0))/100;
  const budget=recvPool*rate,n=Math.floor(budget/unit),total=Object.values(contrib).reduce((a,b)=>a+b,0);
  if(n>0&&total>0){
    const wins={};vip=[];
    for(let i=0;i<n;i++){let r=Math.random()*total,pick='';for(const [u,w] of Object.entries(contrib)){r-=w;if(r<=0){pick=u;break;}}pick=pick||Object.keys(contrib)[0];wins[pick]=(wins[pick]||0)+1;}
    rwMsg='🎁 '+n+' × '+S.rwName+' à offrir !';
    Object.entries(wins).forEach(([u,c])=>{rwLog.unshift('Niv. '+(cur+1)+' : '+c+' × '+S.rwName+' → '+u);if(ws&&wsOk){try{ws.send(JSON.stringify({type:'reward',gift:S.rwName,count:c,to:u}));}catch(e){}}});
    vip=Object.entries(wins).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([u,c])=>({u,c}));
    recvPool=rate>0?(budget-n*unit)/rate:0;
  }else{rwMsg='';vip=[];}
  contrib={};updStats();
}
/* ---------- Panneau de réglages ---------- */
function togglePanel(){const p=$('settings');p.hidden=!p.hidden;}
$('vol').value=S.vol;$('mute').checked=S.mute;$('rtp').value=S.rtp;$('rwName').value=S.rwName;$('rwVal').value=S.rwVal;
$('vol').addEventListener('input',e=>{S.vol=+e.target.value;audio();saveS();});
$('mute').addEventListener('change',e=>{S.mute=e.target.checked;audio();saveS();});
$('rtp').addEventListener('input',e=>{S.rtp=Math.max(0,Math.min(100,+e.target.value||0));saveS();});
$('rwName').addEventListener('input',e=>{S.rwName=e.target.value.slice(0,20)||'Rose';saveS();});
$('rwVal').addEventListener('input',e=>{S.rwVal=Math.max(1,+e.target.value||1);saveS();});
$('sndTest').addEventListener('click',()=>sfx('coin'));
$('gear').addEventListener('click',()=>{togglePanel();$('gear').blur();});
$('setClose').addEventListener('click',togglePanel);
window.addEventListener('keydown',e=>{if(e.code==='F2'){e.preventDefault();togglePanel();}});
Object.keys(S.gv).forEach(k=>{const l=document.createElement('label');l.textContent=k;const i=document.createElement('input');i.type='number';i.min='0';i.value=S.gv[k];i.addEventListener('input',()=>{S.gv[k]=+i.value||0;saveS();});l.appendChild(i);$('gvals').appendChild(l);});
updStats();
/* La connexion TikTok passe par le serveur qui héberge le jeu (même adresse) */
const serverUrl=()=>(location.protocol==='https:'?'wss://':'ws://')+location.host;
const GIFT_MAP={rose:'Rose',tiktok:'TikTok','ice cream':'Ice Cream','ice cream cone':'Ice Cream',icecream:'Ice Cream',glace:'Ice Cream'};
const PIPE_WORDS=/^\s*(entre|entrer|sors|sortir|sortie)\s*[!.]*\s*$/i;
function onServerMsg(raw){
  let d=raw;try{d=JSON.parse(raw);}catch(e){return;}
  if(!d||typeof d!=='object')return;
  if(d.type==='STATUS'){liveMsg=d.message||'';return;}
  if(d.type==='viewer'&&d.viewer){const v=d.viewer;setAvatar([v.nickname,v.uniqueId,v.username],v.avatarDataUri);return;}
  if(d.type==='gift'){
    const g=d.gift||d,user=String(g.nickname||g.uniqueId||g.username||'').slice(0,20),coins=Number(g.coinCount)||0;
    setAvatar([g.nickname,g.uniqueId,g.username],g.avatarDataUri||(g.avatarUrls&&g.avatarUrls[0]));
    const k=coins>=100?'Star':GIFT_MAP[String(g.giftName||'').trim().toLowerCase()];
    if(coins>=1){if(k)triggerGift(k,user);else startGame();}
  }else if(d.type==='comment'){
    const c=d.commentData||{};
    if(PIPE_WORDS.test(String(c.comment||'')))triggerGift('Pipe',String(c.nickname||c.uniqueId||'').slice(0,20));
  }
}
let liveMsg='',retry=0;
function connectLive(){
  if(ws){ws.onclose=null;try{ws.close();}catch(e){}}
  const st=$('loginErr');
  try{
    const mine=ws=new WebSocket(serverUrl());
    st.textContent='Connexion à @'+pseudo+'…';
    ws.onopen=()=>{wsOk=true;retry=0;liveMsg='';try{ws.send(JSON.stringify({action:'CONNECT_TIKTOK',username:pseudo}));}catch(e){}};
    ws.onmessage=ev=>{onServerMsg(ev.data);st.textContent=liveMsg||('Connecté · @'+pseudo);};
    ws.onclose=()=>{wsOk=false;st.textContent='Déconnecté, nouvelle tentative…';setTimeout(()=>{if(mine===ws)connectLive();},Math.min(15000,1500*++retry));};
  }catch(e){wsOk=false;st.textContent='Connexion impossible';}
}
function doLogin(){
  const v=$('pseudoInput').value.trim().replace(/^@/,'');
  if(!/^[A-Za-z0-9._]{1,32}$/.test(v)){$('loginErr').textContent='Pseudo TikTok invalide (lettres, chiffres, _ ou .).';return;}
  pseudo=v;audio();connectLive();
}
logged=true;
document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('pseudoInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
let userZoom=1;
$('zoom').addEventListener('input',e=>{userZoom=+e.target.value;});
function applySound(){if(window.ArcadeEffects&&ArcadeEffects.setSound)ArcadeEffects.setSound(!S.mute,S.vol/100);}
$('vol').addEventListener('input',applySound);$('mute').addEventListener('change',applySound);applySound();
document.querySelectorAll('[data-sim]').forEach(b=>b.addEventListener('click',()=>triggerGift(b.dataset.sim,'Simulation')));
$('simBig').addEventListener('click',()=>ArcadeEffects.simulateBigGift('Alex_TikTok',100));
$('simShare').addEventListener('click',()=>ArcadeEffects.simulateShare());
$('reset').addEventListener('click',()=>restart());
function saveGame(){try{localStorage.setItem('super-mario-live-save',JSON.stringify({cur,score,lives}));}catch(e){}}
setInterval(saveGame,3000);
function fit(){const s=Math.min(window.innerWidth/800,window.innerHeight/400);game.style.transform='translate(-50%,-50%) scale('+s+')';}
window.addEventListener('resize',fit);fit();

/* ---------- Sprites pixel-art ---------- */
function makeSprite(map,pal,sc){
  const c=document.createElement('canvas');c.width=map[0].length*sc;c.height=map.length*sc;
  const g=c.getContext('2d');
  map.forEach((row,y)=>[...row].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x*sc,y*sc,sc,sc);}}));
  return c;
}
const MARIO_MAP=["...RRRRR....","..RRRRRRRRR.","..KKKSSKS...",".KSKSSSKSSS.",".KSKKSSSKSSS",".KKSSSSKKKK.","...SSSSSSS..","..RRBRRR....",".RRRBRRBRRR.","RRRRBBBBRRRR","SSRBYBBYBRSS","SSSBBBBBBSSS","SSBBBBBBBBSS","..BBB..BBB..",".KKK....KKK.","KKKK....KKKK"];
const TOP=MARIO_MAP.slice(0,13);
const MARIO_FRAMES=[MARIO_MAP,TOP.concat(["...BBBBBB...","..KKKBBKKK..",".KKKK..KKKK."]),TOP.concat([".BBBB...BBB.","KKKKK...KKK.","KKKKK...KKK."])];

const marioSprites=REDS.map(r=>MARIO_FRAMES.map(f=>makeSprite(f,{R:r,B:'#0b4cd6',S:'#ffc98f',K:'#6b3a12',Y:'#ffd700'},3)));
const WALK_SEQ=[1,0,2,0];

const GOOMBA_TOP=["......DDDD......","....DDBBBBDD....","...DBBLLLLBBD...","..DBBLLLLLLBBD..",".DBBBBBBBBBBBBD.",".DBBKKBBBBKKBBD.",".DBWWWKBBKWWWBD.",".DBWKWWBBWWKWBD.","..DBBWWBBWWBBD..","..DDBBBBBBBBDD..","...DSSSSSSSSD...","...DSSSSSSSSD...","....DSSSSSSD...."];
const GP={D:'#4a2200',B:'#b5651d',L:'#d98c4a',S:'#f5c99a',W:'#fff',K:'#111',F:'#2b1500'};
const GOOMBA=[GOOMBA_TOP.concat(["..DFFFD..DFFFD..",".DFFFFD..DFFFFD.","..DDDD....DDDD.."]),GOOMBA_TOP.concat(["...DFFFD.DFFFD..","..DFFFFD.DFFFFD.","..DDDDDD.DDDDDD."])].map(m=>makeSprite(m,GP,2));
const KOOPA_TOP=["..KKKK..........",".KYYYYK.........","KYYWKYYK...KKKK.","KYYYYYYK.KGGGGK.",".KYYYYK.KGLLGGGK","..KYYK.KGLLGGHGK","..KYYKKGGGGHGGHK","..KYYKGGHGGGGHHK","..KYYKGGGGHGGHHK","..KYYKTTTTTTTTK.","...KKKTTOTTOTTK.","...KYYKTTTTTTK..","..KYYYYKKKKKK..."];
const KP={K:'#1a1a1a',Y:'#ffd36b',W:'#fff',G:'#2fbf4f',L:'#8ff5a6',H:'#1a7a35',T:'#f3e2a9',O:'#e8a020'};
const KOOPA=[KOOPA_TOP.concat(["..KOOOOK.KOOOK..","..KKKKKK.KKKKK.."]),KOOPA_TOP.concat([".KOOOOK..KOOOK..",".KKKKKK..KKKKK.."])].map(m=>makeSprite(m,KP,2));
const SHELL=makeSprite(["....KKKKKKKK....","...KGGLLGGGGK...","..KGLLGGGHGGGK..",".KGGGGGHGGGGHGK.",".KGGHGGGGGHGGGK.",".KKKKKKKKKKKKKK.",".KTTTTOTTTOTTTK.","..KTTTTTTTTTTK..","...KKKKKKKKKK..."],KP,2);
const SPR={GOOMBA,KOOPA};
function makePipe(h){
  const w=72,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const grad=(x0,x1,s)=>{const l=g.createLinearGradient(x0,0,x1,0);s.forEach((v,i)=>l.addColorStop(i/(s.length-1),v));return l;};
  g.fillStyle=grad(4,68,['#0a7a3c','#3ddc84','#7dffb0','#2ab566','#0a7a3c']);g.fillRect(4,24,64,h-24);
  g.fillStyle=grad(0,72,['#0a7a3c','#3ddc84','#9bffc4','#2ab566','#0a7a3c']);g.fillRect(0,0,72,24);
  g.strokeStyle='#064d25';g.lineWidth=3;g.strokeRect(1.5,1.5,69,21);g.strokeRect(5.5,24,61,h-25);
  return c;
}

/* ---------- Les 5 niveaux ---------- */
const E=(x,t,v)=>({x,type:t,vx:v});
const LEVELS=[
 {name:'Plaine ensoleillée',sky:['#66ccff','#b3e6ff'],gt:'#4cd137',gf:'#a0522d',deco:'hills',len:2100,flag:2000,pits:[],plats:[],spikes:[],

  plats:[{x:530,y:60,w:50},{x:1040,y:70,w:60,mv:40,sp:1.4},{x:1300,y:90,w:90},{x:1640,y:60,w:60,mv:30,sp:1.6}],
  spikes:[{x:780,w:48},{x:1300,w:72},{x:1900,w:48}],pipes:[{x:300,h:80},{x:1450,h:100}],

LEVELS.forEach((lv,i)=>{
  const f=1.5+0.12*i,spd=1+0.12*i,sx=x=>Math.round(x*f),oldPits=lv.pits.map(p=>[...p]);
  lv.len=sx(lv.len);lv.flag=sx(lv.flag);
  lv.pits=lv.pits.map(([a,w])=>[sx(a),Math.round(w*(1+0.04*i))]);
  lv.plats.forEach(p=>{const pit=oldPits.find(([a,w])=>p.x>=a-10&&p.x<=a+w);p.x=pit?sx(pit[0])+(p.x-pit[0]):sx(p.x);});
  lv.spikes.forEach(s=>{s.x=sx(s.x);});
  lv.pipes.forEach(p=>{p.x=sx(p.x);});
  lv.enemies.forEach(e=>{e.x=sx(e.x);e.vx*=spd;});
  const base=lv.enemies.slice(),clear=x=>
    !lv.pits.some(([a,w])=>x>a-90&&x<a+w+90)&&!lv.spikes.some(s=>x>s.x-90&&x<s.x+s.w+90)&&!lv.pipes.some(p=>x>p.x-90&&x<p.x+155);
  for(let k=0;k<base.length-1;k++){
    const x=Math.round((base[k].x+base[k+1].x)/2);
    if(clear(x))lv.enemies.push(E(x,k%2?'GOOMBA':'KOOPA',-(k%2?1.5:2)*spd));
  }
  const last=lv.flag-300;
  if(clear(last))lv.enemies.push(E(last,i%2?'KOOPA':'GOOMBA',-(i%2?2:1.5)*spd));
  lv.enemies.sort((a,b)=>a.x-b.x);
});

const mario={x:100,y:0,prevY:0,velX:0,velY:0,direction:1,isInvincible:false,starTimer:0,onPipe:null,warp:null,ride:null,grounded:true,inv:0,walkT:0};

  Object.assign(mario,{x:100,y:0,prevY:0,velX:0,velY:0,direction:1,isInvincible:false,starTimer:0,onPipe:null,warp:null,ride:null,grounded:true,inv:60});

function die(){if(state!=='play'||mario.warp)return;state='dead';deadT=0;sfx('die');mario.velY=11;mario.velX=0;mario.isInvincible=false;lives--;}

let started=false,winT=0,wheelQ=[],wheel=null;
const WSEG=[{t:'❤ +1 VIE',c:'#e52521',k:'life'},{t:'⏩ NIVEAU +1',c:'#2a7de1',k:'skip'},{t:'😅 RIEN',c:'#f2b01e',k:'none'}];
function wheelStep(){
  if(!wheel){
    if(wheelQ.length&&state==='play'&&!mario.warp){
      const k=Math.floor(Math.random()*3),jit=(Math.random()-.5)*1.2;
      const end=-(k*2*Math.PI/3+Math.PI/3)+jit;
      wheel={user:wheelQ.shift(),k,rot:0,start:0,end:end-Math.PI*2*(5+Math.floor(Math.random()*3)),t:0,dur:330,done:0,last:0,flick:0};
      sfx('star');
    }
    return false;
  }
  const w=wheel;
  if(w.t<w.dur){
    w.t++;const p=w.t/w.dur,e=1-Math.pow(1-p,3.2);w.rot=w.start+(w.end-w.start)*e;
    const seg=Math.floor(-w.rot/(2*Math.PI/3));
    if(seg!==w.last){w.last=seg;w.flick=1;tone(900+(seg%3)*120,.04,'square',.18);}
    w.flick*=.85;
    if(w.t===w.dur){sfx(w.k===2?'over':'clear');}
  }else if(++w.done>150){
    const k=WSEG[w.k].k;
    if(k==='life')lives=Math.min(9,lives+1);
    else if(k==='skip'){wheel=null;if(cur<4)loadLevel(cur+1);else{state='win';winT=0;}return true;}
    wheel=null;
  }
  return true;
}
function drawWheel(){

  txt('⭐ ROUE DE MARIO',400,32,26,'#ffd21a');

  ctx.translate(cx,cy);
  ctx.shadowColor=fin?WSEG[w.k].c:'#ffd21a';ctx.shadowBlur=fin?26+Math.sin(fr/4)*10:14;
  ctx.fillStyle='#ffd21a';ctx.beginPath();ctx.arc(0,0,R+12,0,7);ctx.fill();ctx.shadowBlur=0;
  WSEG.forEach((s,i)=>{
    const a0=w.rot+i*tw-Math.PI/2,a1=a0+tw;
    ctx.fillStyle=fin&&i!==w.k?'#555':s.c;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,a0,a1);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    ctx.save();ctx.rotate(a0+tw/2);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.fillText(s.t,R-12,6);ctx.restore();
  });
  for(let i=0;i<12;i++){const a=w.rot+i*Math.PI/6,x=Math.cos(a)*(R+6),y=Math.sin(a)*(R+6);ctx.fillStyle=i%2?'#fff':'#e52521';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();}
  ctx.fillStyle='#e52521';ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,34,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-1,19,0,7);ctx.fill();
  ctx.fillStyle='#e52521';ctx.font='bold 30px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('M',0,1);ctx.textBaseline='alphabetic';
  ctx.restore();
  ctx.save();ctx.translate(cx,cy-R-14);ctx.rotate(-w.flick*.5);
  ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-14,-16);ctx.lineTo(14,-16);ctx.lineTo(0,22);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  if(fin)txt(['❤ Une vie en plus !','⏩ Niveau sauté !','😅 Rien cette fois…'][w.k],400,376,26,'#fff');
}

function triggerGift(g,user){

function land(y){mario.y=y;mario.velY=0;mario.grounded=true;}

/* ---------- Logique ---------- */
function step(){
  fr++;
  plats.forEach(p=>{const nx=p.mv?p.x0+Math.sin(fr*.02*p.sp)*p.mv:p.x0;p.dx=nx-p.x;p.x=nx;});
  if(state==='dead'){mario.velY-=.65;mario.y+=mario.velY;if(++deadT>110)respawn();return;}
  if(state==='clear'){if(--clearT<=0){if(cur<4)loadLevel(cur+1);else{state='win';winT=0;}}return;}
  if(state==='win'){if(++winT>420)restart();return;}
  if(wheelStep())return;
  if(state!=='play')return;
  const w=mario.warp;
  mario.onPipe=null;
  if(mario.inv>0)mario.inv--;
  if(w){
    if(w.phase==='down'){
      mario.y-=1.6;
      if(mario.y<=w.from.h-MH-6){mario.x=w.to.x+(65-MW)/2;mario.y=w.to.h-MH-6;w.phase='up';score+=100;}
    }else{
      mario.y+=1.6;
      if(mario.y>=w.to.h){mario.y=w.to.h;mario.velY=0;mario.grounded=true;mario.warp=null;}
    }
  }else{
    if(mario.ride){mario.x+=mario.ride.dx;mario.ride=null;}
    mario.prevY=mario.y;mario.grounded=false;
    mario.velX*=0.88;if(Math.abs(mario.velX)<0.05)mario.velX=0;
    mario.x+=mario.velX;
    mario.x=Math.max(50,Math.min(L.len+250,mario.x));
    mario.velY-=0.65;mario.y+=mario.velY;
    if(mario.isInvincible&&--mario.starTimer<=0)mario.isInvincible=false;
    if(mario.y<=0&&mario.prevY>=-0.01&&!pitAt(mario.x+MW/2))land(0);
    plats.forEach(p=>{
      if(mario.x+MW>p.x&&mario.x<p.x+p.w&&mario.velY<=0&&mario.prevY>=p.y-0.01&&mario.y<=p.y){land(p.y);mario.ride=p;}
    });
    pipes.forEach(p=>{
      if(mario.x+MW>p.x&&mario.x<p.x+65){
        if(mario.velY<=0&&mario.prevY>=p.h-0.01&&mario.y<=p.h){land(p.h);mario.onPipe=p;}
        else if(mario.y<p.h){mario.x=mario.x+MW/2<p.x+32.5?p.x-MW:p.x+65;mario.velX=0;}
      }
    });
    L.spikes.forEach(s=>{if(mario.y<18&&mario.x+MW-8>s.x&&mario.x+8<s.x+s.w&&!mario.isInvincible&&!mario.inv)die();});
    if(mario.y<-90)die();
    if(mario.x+MW>L.flag&&state==='play'){state='clear';clearT=260;score+=1000;mario.velX=0;sfx('clear');levelReward();}
  }
  cameraX+=(mario.x-800/3-cameraX)*0.08;
  cameraX=Math.max(0,Math.min(L.len+400-800,cameraX));

  enemies.forEach(e=>{
    if(!e.alive)return;
    e.t++;
    if(e.st==='squash'){if(e.t>30)e.alive=false;return;}
    if(e.st==='fling'){e.vy-=.6;e.oy+=e.vy;e.x+=e.vx;if(e.oy<-300)e.alive=false;return;}
    if(e.st==='shell'){e.vx=0;if(e.t>480){e.st='walk';e.h=e.h0;e.vx=-e.sp;e.t=0;}}
    else{
      e.x+=e.vx;
      if(pitAt(e.x+e.w/2+Math.sign(e.vx)*(e.w/2+2))){e.vx=-e.vx;e.x+=e.vx*2;}
      if(e.st==='slide')enemies.forEach(o=>{if(o!==e&&o.alive&&(o.st==='walk'||o.st==='shell'||o.st==='slide')&&e.x<o.x+o.w&&e.x+e.w>o.x){o.st='fling';o.vy=6;o.oy=0;o.vx=Math.sign(e.vx)*2;score+=200;}});
    }
    pipes.forEach(p=>{if(e.x+e.w>p.x&&e.x<p.x+65){e.x=e.vx>0?p.x-e.w:p.x+65;e.vx=-e.vx;}});
    if(mario.warp||state!=='play')return;
    const m={x:mario.x,y:solY-mario.y-MH,w:MW,h:MH},r={x:e.x,y:solY-e.h,w:e.w,h:e.h};
    if(m.x<r.x+r.w&&m.x+m.w>r.x&&m.y<r.y+r.h&&m.y+m.h>r.y){
      const dir=mario.x+MW/2<e.x+e.w/2?1:-1;
      if(mario.velY<0&&mario.prevY>=e.h-16){
        mario.y=e.h;mario.velY=10;mario.grounded=false;mario.inv=Math.max(mario.inv,10);score+=200;sfx('stomp');
        if(e.type==='GOOMBA'){e.st='squash';e.t=0;e.vx=0;}
        else if(e.st==='shell'){e.st='slide';e.vx=dir*7;e.t=0;}
        else{e.st='shell';e.t=0;e.vx=0;e.h=18;}
      }
      else if(mario.isInvincible){e.st='fling';e.vy=6;e.oy=0;e.vx=dir*2;score+=200;sfx('kick');}
      else if(e.st==='shell'){e.st='slide';e.vx=dir*7;e.t=0;sfx('kick');}
      else if(e.st==='slide'&&e.t<=12){}
      else if(!mario.inv)die();
    }
  });
}

    const flip=shell?(e.st==='slide'&&Math.floor(fr/3)%2===1):(e.type==='KOOPA'&&e.vx>0);
    ctx.save();
    if(e.st==='squash'){ctx.translate(0,solY);ctx.scale(1,.3);ctx.translate(0,-solY);}
    if(e.st==='fling'){ctx.translate(sx+e.w/2,sy+e.h/2);ctx.scale(1,-1);ctx.drawImage(s,-e.w/2,-e.h/2);}
    else if(flip){ctx.translate(sx+e.w,0);ctx.scale(-1,1);ctx.drawImage(s,0,sy);}
    else ctx.drawImage(s,sx,sy);
    ctx.restore();
  });
  mario.walkT+=Math.abs(mario.velX)*0.08;
  let frame=0;
  if(state==='dead'||(!mario.warp&&!mario.grounded))frame=2;
  else if(!mario.warp&&Math.abs(mario.velX)>0.3)frame=WALK_SEQ[Math.floor(mario.walkT)%4];
  const spr=marioSprites[mario.isInvincible?Math.floor(t/80)%REDS.length:0][frame];
  ctx.save();
  if(mario.inv>0&&Math.floor(fr/5)%2)ctx.globalAlpha=.35;
  ctx.translate(mario.x-cameraX+MW/2,0);ctx.scale(mario.direction,1);
  ctx.drawImage(spr,-MW/2,solY-mario.y-MH);
  ctx.restore();
  pipes.forEach(p=>ctx.drawImage(p.img,p.x-4-cameraX,solY-p.h));
  if(mario.onPipe&&!mario.warp&&pipes.length>1)txt('▼ Écris « entre »',mario.onPipe.x+32-cameraX,solY-mario.onPipe.h-MH-14+Math.sin(fr/9)*3,16,'#fff');
  ctx.restore();
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 22px Arial';ctx.fillText('SCORE: '+score,16,34);ctx.fillText('❤ × '+Math.max(0,lives),16,62);
  ctx.font='bold 14px Arial';ctx.fillStyle=wsOk?'#2ed573':'#aaa';ctx.fillText((wsOk?'● Live connecté':'○ Hors ligne')+(pseudo?' · @'+pseudo:'')+(liveMsg?' · '+liveMsg:''),16,84);ctx.fillStyle='#fff';ctx.font='bold 22px Arial';
  ctx.textAlign='right';ctx.fillText('NIVEAU '+(cur+1)+'/5',784,34);ctx.textAlign='left';
  if(mario.isInvincible)txt('⚡ L’ÉTOILE EST ACTIVE !',400,34,20,'#ffd700');
  if(banner>0&&state==='play'){banner--;ctx.globalAlpha=Math.min(1,banner/40);txt('NIVEAU '+(cur+1)+' – '+L.name,400,150,30,'#fff');ctx.globalAlpha=1;}
  if(state==='dead'&&deadT>20)txt(lives>0?'Aïe ! Il vous reste '+lives+' vie'+(lives>1?'s':''):'Dernière vie perdue…',400,150,28,'#ff6b6b');
  if(state==='clear'){txt('NIVEAU TERMINÉ !  +1000',400,95,30,'#ffd700');if(rwMsg)txt(rwMsg,400,128,20,'#25f4ee');vipBanner();}
  drawWheel();
  if(state==='over'||state==='win'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,800,400);
    txt(state==='win'?'🏆 VICTOIRE ! 5 niveaux terminés':'GAME OVER',400,170,38,state==='win'?'#ffd700':'#ff4d4d');
    txt('Score final : '+score,400,215,26,'#fff');
    txt(state==='win'?'Retour au niveau 1…':'Une ⭐ relance la partie au niveau 1',400,265,24,'#ffd21a');
  }
}
function vipBanner(){
  if(!vip.length)return;
  const h=52,w=360,x=220,y=140;
  ctx.save();
  vip.forEach((v,i)=>{
    const yy=y+i*(h+8),g=ctx.createLinearGradient(x,yy,x+w,yy);
    g.addColorStop(0,'#5b3a00');g.addColorStop(.5,'#c99a1b');g.addColorStop(1,'#5b3a00');
    ctx.fillStyle=g;ctx.strokeStyle='#ffe27a';ctx.lineWidth=3;
    ctx.beginPath();ctx.roundRect(x,yy,w,h,14);ctx.fill();ctx.stroke();
    const cx=x+36,cy=yy+h/2,im=avatars[v.u];
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,24,0,7);ctx.clip();
    if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,cx-24,cy-24,48,48);
    else{ctx.fillStyle='#222';ctx.fillRect(cx-24,cy-24,48,48);ctx.fillStyle='#ffd21a';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.fillText((v.u[0]||'?').toUpperCase(),cx,cy+9);}
    ctx.restore();
    ctx.strokeStyle='#ffe27a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,24,0,7);ctx.stroke();
    ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.fillText('👑 VIP · GAGNANT',x+72,yy+20);
    ctx.font='bold 20px Arial';ctx.fillText(v.u.slice(0,16),x+72,yy+40);
    ctx.textAlign='right';ctx.fillStyle='#fff6c8';ctx.font='bold 18px Arial';ctx.fillText(v.c+' × '+S.rwName,x+w-14,yy+32);
  });
  ctx.restore();
}
function loop(){if(logged&&started)step();render();requestAnimationFrame(loop);}
loadLevel(0);
try{const sv=JSON.parse(localStorage.getItem('super-mario-live-save')||'null');if(sv&&LEVELS[sv.cur]){score=+sv.score||0;lives=Math.max(1,+sv.lives||3);loadLevel(sv.cur);}}catch(e){}
loop();
</script>
