<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ambiance Stade Maximale — Penalty 3D & TikTok Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050a12;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }
        .font-sport {
            font-family: 'Chakra Petch', sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .glass-panel {
            background: rgba(9, 16, 30, 0.86);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        @keyframes bannerPop {
            0% { transform: translate(-50%, -62%) scale(0.5); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.06); opacity: 1; }
            25% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            84% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -44%) scale(0.92); opacity: 0; }
        }
        .animate-banner {
            animation: bannerPop 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .hud-hidden {
            transform: translateY(125%) !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body class="relative w-full h-full flex flex-col justify-between">

    <!-- Canvas principal -->
    <canvas id="penaltyCanvas" class="fixed inset-0 z-0"></canvas>

    <!-- HUD supérieur -->
    <header class="relative z-20 w-full px-3 pt-3 sm:px-6 sm:pt-4 pointer-events-none">
        <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="glass-panel rounded-2xl px-3 py-2 sm:px-4 sm:py-2.5 flex flex-wrap items-center gap-2.5 sm:gap-3 shadow-2xl pointer-events-auto">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span id="mode-label" class="text-[10px] sm:text-xs font-extrabold uppercase tracking-wider text-emerald-300">SÉRIE DE 5</span>
                </div>
                <div class="h-5 w-px bg-white/15"></div>

                <div class="flex items-center gap-2">
                    <span id="shooter-badge" class="w-3.5 h-3.5 rounded-full border border-white shadow"></span>
                    <span id="shooter-hud-name" class="font-sport font-bold text-xs sm:text-sm tracking-wide text-white max-w-[140px] truncate">PARIS</span>
                </div>

                <div class="bg-slate-950/90 border border-white/15 rounded-xl px-2.5 py-1 flex items-center gap-2">
                    <span id="goals-count" class="font-sport font-bold text-lg sm:text-2xl text-emerald-400">0</span>
                    <span class="text-[10px] text-slate-400 font-bold">/</span>
                    <span id="attempts-count" class="font-sport font-bold text-sm sm:text-base text-slate-300">0</span>
                </div>

                <div id="shot-dots" class="hidden sm:flex items-center gap-1"></div>

                <!-- Badge statut TikTok Live dans le HUD -->
                <div id="hud-tiktok-pill" class="flex items-center gap-1.5 bg-slate-950/85 border border-pink-500/30 rounded-xl px-2.5 py-1 text-[11px]">
                    <span id="hud-tt-dot" class="w-2 h-2 rounded-full bg-slate-500"></span>
                    <span id="hud-tt-status" class="font-bold text-slate-300">LIVE OFF</span>
                    <span id="hud-tt-queue" class="hidden bg-pink-500/25 text-pink-200 border border-pink-400/40 rounded-md px-1.5 py-0.2 font-sport font-bold">0 tir</span>
                </div>
            </div>

            <div class="flex items-center gap-2 pointer-events-auto">
                <button id="btn-shoot-now" type="button" onclick="shootPenalty()" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-sport font-extrabold text-xs sm:text-sm px-3.5 py-2.5 rounded-xl shadow-lg transition active:scale-95">
                    ⚽ FRAPPER
                </button>
                <button id="btn-sound" type="button" title="Activer ou couper le son" class="glass-panel hover:bg-white/15 active:scale-95 transition rounded-xl p-2.5 text-sm font-bold flex items-center gap-1.5 shadow-lg">
                    <span id="sound-icon">🔇</span>
                    <span class="hidden sm:inline text-xs">Son</span>
                </button>
                <button id="btn-toggle-hud" type="button" onclick="toggleControlPanel()" title="Afficher ou masquer le panneau" class="glass-panel hover:bg-white/15 active:scale-95 transition rounded-xl p-2.5 text-sm font-bold flex items-center justify-center shadow-lg">
                    <span>⚙️</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Bannière centrale -->
    <div id="event-banner-container" class="pointer-events-none fixed inset-0 z-30 flex items-center justify-center"></div>

    <!-- Panneau de configuration en bas -->
    <section id="control-panel" class="relative z-20 w-full px-3 pb-3 sm:px-5 sm:pb-4 transition-all duration-300 max-h-[44vh] overflow-y-auto lg:overflow-visible">
        <div class="glass-panel rounded-2xl p-3 sm:p-4 shadow-2xl max-w-[1440px] mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-3.5 items-stretch">

                <!-- 1. TikTok Live & Cadeaux (1, 2, 5 pièces) -->
                <div class="lg:col-span-5 flex flex-col justify-between gap-2">
                    <div class="flex items-center justify-between gap-1">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-pink-400">📱 TikTok Live</span>
                            <span id="tt-conn-badge" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-white/10">Déconnecté</span>
                        </div>
                        <span id="tt-queue-counter" class="text-[10px] font-sport font-bold text-pink-300">File : 0 tir</span>
                    </div>

                    <!-- Connexion compte TikTok Live -->
                    <div class="flex items-center gap-1.5">
                        <input id="tt-username" type="text" placeholder="@mon_compte_tiktok" class="w-32 sm:w-40 bg-slate-950/90 border border-white/15 rounded-lg px-2 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-pink-400">
                        <input id="tt-ws-url" type="text" value="ws://localhost:21213/" title="URL WebSocket TikFinity / TikTok-Live-Connector" placeholder="ws://localhost:21213/" class="flex-1 min-w-0 bg-slate-950/90 border border-white/15 rounded-lg px-2 py-1.5 text-[11px] text-slate-300 placeholder-slate-500 focus:outline-none focus:border-pink-400">
                        <button id="btn-tt-connect" type="button" onclick="toggleTikTokConnection()" class="bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-500 hover:to-rose-400 text-white font-bold text-xs px-3 py-1.5 rounded-lg transition active:scale-95 shrink-0">
                            Connecter
                        </button>
                    </div>

                    <!-- Boutons de test cadeaux 1 / 2 / 5 pièces + dernier donateur -->
                    <div class="flex flex-wrap items-center justify-between gap-1.5">
                        <div class="flex items-center gap-1.5">
                            <button type="button" onclick="triggerTikTokGift(1, 'Viewer_Live', 'Rose')" title="Cadeau 1 pièce = 1 tir placé" class="bg-amber-500/20 hover:bg-amber-500/35 border border-amber-400/40 text-amber-200 font-bold text-[10px] sm:text-[11px] px-2.5 py-1 rounded-lg transition active:scale-95">
                                🪙 1 Pièce (1 Tir)
                            </button>
                            <button type="button" onclick="triggerTikTokGift(2, 'Fan_Foot', 'Cœur GG')" title="Cadeau 2 pièces = 2 tirs avec effet" class="bg-sky-500/20 hover:bg-sky-500/35 border border-sky-400/40 text-sky-200 font-bold text-[10px] sm:text-[11px] px-2.5 py-1 rounded-lg transition active:scale-95">
                                🪙 2 Pièces (2 Tirs)
                            </button>
                            <button type="button" onclick="triggerTikTokGift(5, 'Ultra_Supporter', 'Super Ballon')" title="Cadeau 5 pièces = 5 tirs rafale" class="bg-pink-500/25 hover:bg-pink-500/40 border border-pink-400/50 text-pink-200 font-bold text-[10px] sm:text-[11px] px-2.5 py-1 rounded-lg transition active:scale-95">
                                🪙 5 Pièces (5 Tirs)
                            </button>
                        </div>
                        <span id="tt-last-gift" class="text-[10px] text-slate-400 truncate max-w-[170px]">En attente de cadeaux...</span>
                    </div>
                </div>

                <!-- 2. Équipes & Ajout d'équipe -->
                <div class="lg:col-span-4 flex flex-col justify-between gap-2 border-t md:border-t-0 md:border-l border-white/10 pt-2 md:pt-0 md:pl-3.5">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">👕 Équipes</span>
                        <button type="button" onclick="randomizeMatchup()" class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-300 border border-white/10 transition">
                            🎲 Tirage Aléatoire
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-1.5 text-xs">
                        <div class="flex items-center gap-1.5">
                            <label for="select-shooter-team" class="text-[11px] text-slate-300 font-semibold shrink-0">Tireur:</label>
                            <select id="select-shooter-team" onchange="applyTeamSelection()" class="flex-1 min-w-0 bg-slate-900 border border-white/15 rounded-lg px-2 py-1.5 text-[11px] font-semibold text-sky-200 focus:outline-none"></select>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <label for="select-keeper-team" class="text-[11px] text-slate-300 font-semibold shrink-0">Gardien:</label>
                            <select id="select-keeper-team" onchange="applyTeamSelection()" class="flex-1 min-w-0 bg-slate-900 border border-white/15 rounded-lg px-2 py-1.5 text-[11px] font-semibold text-emerald-200 focus:outline-none"></select>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <input id="custom-team-name" type="text" placeholder="Nouvelle équipe..." class="flex-1 min-w-0 bg-slate-950/90 border border-white/15 rounded-lg px-2.5 py-1 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-400">
                        <input id="custom-team-color" type="color" value="#8b5cf6" title="Couleur principale" class="w-8 h-7 rounded cursor-pointer bg-transparent border border-white/15">
                        <button type="button" onclick="addCustomTeam()" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs px-2.5 py-1 rounded-lg transition active:scale-95">
                            + Ajouter
                        </button>
                    </div>
                </div>

                <!-- 3. Réglages & Séance -->
                <div class="lg:col-span-3 flex flex-col justify-between gap-2 border-t lg:border-t-0 lg:border-l border-white/10 pt-2 lg:pt-0 lg:pl-3.5">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400">⚙️ Paramètres</span>
                    <div class="grid grid-cols-2 gap-1.5 text-xs">
                        <div class="flex flex-col gap-0.5">
                            <label for="select-difficulty" class="text-[10px] text-slate-400">Gardien</label>
                            <select id="select-difficulty" onchange="updateRuleSettings()" class="bg-slate-900 border border-white/15 rounded-lg px-2 py-1.5 text-[11px] font-semibold text-amber-300 focus:outline-none">
                                <option value="0.32">Amateur</option>
                                <option value="0.54" selected>Pro</option>
                                <option value="0.76">Légende</option>
                            </select>
                        </div>
                        <div class="flex flex-col gap-0.5">
                            <label for="select-shootout-mode" class="text-[10px] text-slate-400">Format</label>
                            <select id="select-shootout-mode" onchange="updateRuleSettings()" class="bg-slate-900 border border-white/15 rounded-lg px-2 py-1.5 text-[11px] font-semibold text-sky-300 focus:outline-none">
                                <option value="5" selected>Série de 5</option>
                                <option value="ENDLESS">Mort Subite</option>
                            </select>
                        </div>
                    </div>
                    <button type="button" onclick="resetShootout()" class="w-full bg-slate-800/90 hover:bg-slate-700 border border-white/15 text-slate-100 text-xs font-bold py-1.5 px-3 rounded-xl transition active:scale-95">
                        🔄 Nouvelle Séance
                    </button>
                </div>

            </div>
        </div>
    </section>

<script>
// ============================================================================
// INITIALISATION DU CANVAS ET DU CONTEXTE
// ============================================================================
const canvas = document.getElementById('penaltyCanvas');
const ctx = canvas ? canvas.getContext('2d') : null;

// ============================================================================
// BASE D'ÉQUIPES (CLUBS FR / ES + SÉLECTIONS INTERNATIONALES)
// ============================================================================
const TEAMS = [
    { id: 'par', name: 'Paris', short: 'PSG', flagType: 'psg', primary: '#1e3a8a', secondary: '#dc2626', trim: '#ffffff', shorts: '#1e3a8a', number: '#ffffff', gkTop: '#a3e635', gkBot: '#4d7c0f' },
    { id: 'mar_club', name: 'Marseille', short: 'OM', flagType: 'om', primary: '#f8fafc', secondary: '#38bdf8', trim: '#38bdf8', shorts: '#f8fafc', number: '#38bdf8', gkTop: '#f97316', gkBot: '#c2410c' },
    { id: 'bar', name: 'Barcelone', short: 'FCB', flagType: 'barca', primary: '#991b1b', secondary: '#1e3a8a', trim: '#facc15', shorts: '#1e3a8a', number: '#facc15', gkTop: '#22c55e', gkBot: '#15803d' },
    { id: 'rma', name: 'Real Madrid', short: 'RMA', flagType: 'madrid', primary: '#f8fafc', secondary: '#e2e8f0', trim: '#eab308', shorts: '#f8fafc', number: '#1e293b', gkTop: '#38bdf8', gkBot: '#0284c7' },
    { id: 'fra', name: 'France', short: 'FRA', flagType: 'france', primary: '#1e40af', secondary: '#172554', trim: '#ffffff', shorts: '#ffffff', number: '#ffffff', gkTop: '#a3e635', gkBot: '#4d7c0f' },
    { id: 'esp', name: 'Espagne', short: 'ESP', flagType: 'spain', primary: '#dc2626', secondary: '#b91c1c', trim: '#facc15', shorts: '#1e3a8a', number: '#facc15', gkTop: '#38bdf8', gkBot: '#0369a1' },
    { id: 'bra', name: 'Brésil', short: 'BRA', flagType: 'brazil', primary: '#facc15', secondary: '#eab308', trim: '#15803d', shorts: '#1d4ed8', number: '#15803d', gkTop: '#22c55e', gkBot: '#15803d' },
    { id: 'arg', name: 'Argentine', short: 'ARG', flagType: 'argentina', primary: '#38bdf8', secondary: '#f8fafc', trim: '#111827', shorts: '#111827', number: '#111827', gkTop: '#f59e0b', gkBot: '#b45309' },
    { id: 'ger', name: 'Allemagne', short: 'GER', flagType: 'germany', primary: '#f8fafc', secondary: '#e2e8f0', trim: '#111827', shorts: '#111827', number: '#111827', gkTop: '#10b981', gkBot: '#047857' },
    { id: 'por', name: 'Portugal', short: 'POR', flagType: 'portugal', primary: '#991b1b', secondary: '#15803d', trim: '#facc15', shorts: '#991b1b', number: '#facc15', gkTop: '#38bdf8', gkBot: '#0284c7' },
    { id: 'eng', name: 'Angleterre', short: 'ENG', flagType: 'england', primary: '#f8fafc', secondary: '#e2e8f0', trim: '#1e3a8a', shorts: '#f8fafc', number: '#1e3a8a', gkTop: '#f59e0b', gkBot: '#d97706' },
    { id: 'mar', name: 'Maroc', short: 'MAR', flagType: 'morocco', primary: '#b91c1c', secondary: '#7f1d1d', trim: '#15803d', shorts: '#15803d', number: '#ffffff', gkTop: '#facc15', gkBot: '#ca8a04' }
];

// ============================================================================
// DIMENSIONS DE SCÈNE & ÉTAT GLOBAL DU JEU
// ============================================================================
const SCENE = {
    W: 1000,
    H: 600,
    goalCenterX: 500,
    goalY: 170,
    goalWidth: 276,
    goalHeight: 98,
    goalDepth: 56,
    spotX: 500,
    spotY: 438
};

const STATE = {
    width: window.innerWidth || 1280,
    height: window.innerHeight || 720,
    shooterTeamId: 'par',
    keeperTeamId: 'bar',
    gkSkill: 0.54,
    shootoutMode: '5',
    phase: 'AIMING', // 'AIMING' | 'RUNUP' | 'BALL_FLIGHT' | 'OUTCOME'
    phaseTimer: 0,
    soundEnabled: false,
    hudVisible: true,
    goals: 0,
    attempts: 0,
    history: [],
    aimU: 0.82,
    aimV: 0.22,
    aimLabel: 'Lucarne Droite',
    power: 84,
    curl: 12,
    cameraShake: 0,
    netRipple: 0,
    netRippleX: SCENE.goalCenterX,
    netRippleZ: 45,
    confetti: [],
    flashes: [],
    crowdLayers: [],
    stadiumFlags: [],
    grassPattern: null
};

// ============================================================================
// ÉTAT & GESTION DE LA CONNEXION TIKTOK LIVE (CADEAUX 1, 2 ET 5 PIÈCES)
// ============================================================================
const TIKTOK = {
    connected: false,
    socket: null,
    username: '',
    wsUrl: 'ws://localhost:21213/',
    shotQueue: [],
    autoDelayTimer: 0,
    currentShotMeta: null
};

const SHOT_PRESETS = [
    { u: 0.17, v: 0.20, power: 86, curl: -12, label: 'Lucarne Gauche' },
    { u: 0.83, v: 0.20, power: 86, curl: 12, label: 'Lucarne Droite' },
    { u: 0.18, v: 0.84, power: 80, curl: -8, label: 'Petit Filet Gauche' },
    { u: 0.82, v: 0.84, power: 80, curl: 8, label: 'Petit Filet Droit' },
    { u: 0.50, v: 0.28, power: 84, curl: 0, label: 'Pleine Lucarne' },
    { u: 0.50, v: 0.82, power: 76, curl: 0, label: 'Ras de Terre' }
];

function updateTikTokUI() {
    const connBadge = document.getElementById('tt-conn-badge');
    const connectBtn = document.getElementById('btn-tt-connect');
    const hudDot = document.getElementById('hud-tt-dot');
    const hudStatus = document.getElementById('hud-tt-status');
    const hudQueue = document.getElementById('hud-tt-queue');
    const queueCounter = document.getElementById('tt-queue-counter');

    const count = TIKTOK.shotQueue.length;
    if (queueCounter) {
        queueCounter.textContent = `File : ${count} tir${count > 1 ? 's' : ''}`;
    }

    if (hudQueue) {
        if (count > 0) {
            hudQueue.textContent = `${count} tir${count > 1 ? 's' : ''}`;
            hudQueue.classList.remove('hidden');
        } else {
            hudQueue.classList.add('hidden');
        }
    }

    if (TIKTOK.connected) {
        if (connBadge) {
            connBadge.textContent = `En direct${TIKTOK.username ? ' (' + TIKTOK.username + ')' : ''}`;
            connBadge.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-400/40';
        }
        if (connectBtn) {
            connectBtn.textContent = 'Déconnecter';
            connectBtn.className = 'bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs px-3 py-1.5 rounded-lg transition active:scale-95 shrink-0';
        }
        if (hudDot) hudDot.className = 'w-2 h-2 rounded-full bg-pink-500 animate-ping';
        if (hudStatus) {
            hudStatus.textContent = TIKTOK.username ? `LIVE ${TIKTOK.username}` : 'LIVE ON';
            hudStatus.className = 'font-bold text-pink-300';
        }
    } else {
        if (connBadge) {
            connBadge.textContent = 'Déconnecté';
            connBadge.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 border border-white/10';
        }
        if (connectBtn) {
            connectBtn.textContent = 'Connecter';
            connectBtn.className = 'bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-500 hover:to-rose-400 text-white font-bold text-xs px-3 py-1.5 rounded-lg transition active:scale-95 shrink-0';
        }
        if (hudDot) hudDot.className = 'w-2 h-2 rounded-full bg-slate-500';
        if (hudStatus) {
            hudStatus.textContent = 'LIVE OFF';
            hudStatus.className = 'font-bold text-slate-300';
        }
    }
}

function toggleTikTokConnection() {
    if (TIKTOK.connected || TIKTOK.socket) {
        disconnectTikTok();
        return;
    }

    const userInput = document.getElementById('tt-username');
    const urlInput = document.getElementById('tt-ws-url');
    const rawUser = (userInput?.value || '').trim();
    const formattedUser = rawUser ? (rawUser.startsWith('@') ? rawUser : `@${rawUser}`) : '@live';
    const wsUrl = (urlInput?.value || 'ws://localhost:21213/').trim();

    TIKTOK.username = formattedUser;
    TIKTOK.wsUrl = wsUrl;

    try {
        const ws = new WebSocket(wsUrl);
        TIKTOK.socket = ws;

        const connBadge = document.getElementById('tt-conn-badge');
        if (connBadge) {
            connBadge.textContent = 'Connexion...';
            connBadge.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-400/40';
        }

        ws.onopen = () => {
            TIKTOK.connected = true;
            updateTikTokUI();
            try {
                ws.send(JSON.stringify({ event: 'subscribe', uniqueId: formattedUser.replace('@', '') }));
            } catch (e) {}
            showBanner('📱 TIKTOK LIVE CONNECTÉ', `${formattedUser} • Cadeaux 1, 2 & 5 pièces actifs`, 'border-pink-400 text-pink-200');
        };

        ws.onmessage = (event) => {
            handleTikTokMessage(event.data);
        };

        ws.onerror = () => {
            showBanner('⚠️ PONT TIKTOK LOCAL INACTIF', 'Lancez TikFinity (port 21213) ou utilisez les boutons 1/2/5 pièces', 'border-amber-400 text-amber-200');
        };

        ws.onclose = () => {
            TIKTOK.connected = false;
            TIKTOK.socket = null;
            updateTikTokUI();
        };
    } catch (err) {
        TIKTOK.connected = false;
        TIKTOK.socket = null;
        updateTikTokUI();
        showBanner('⚠️ ERREUR WEBSOCKET', 'Vérifiez l’adresse ws://localhost:21213/', 'border-rose-400 text-rose-200');
    }
}

function disconnectTikTok() {
    if (TIKTOK.socket) {
        try {
            TIKTOK.socket.close();
        } catch (e) {}
        TIKTOK.socket = null;
    }
    TIKTOK.connected = false;
    updateTikTokUI();
}

function handleTikTokMessage(rawData) {
    let payload = null;
    try {
        payload = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
    } catch (e) {
        return;
    }
    if (!payload) return;

    // Compatibilité avec les formats TikFinity et TikTok-Live-Connector
    const eventType = payload.event || payload.type || '';
    const data = payload.data || payload;

    const isGift = eventType === 'gift' || data.giftId !== undefined || data.diamondCount !== undefined || data.coins !== undefined;
    if (!isGift) return;

    // Éviter le double comptage pendant un streak TikTok en cours (giftType === 1 && !repeatEnd)
    if (data.giftType === 1 && data.repeatEnd === false) return;

    const unitCoins = Number(data.diamondCount ?? data.coins ?? data.coinCount ?? data.value ?? 0);
    const repeatCount = Math.max(1, Number(data.repeatCount ?? 1));
    const totalCoins = unitCoins * repeatCount;
    const sender = data.nickname || data.uniqueId || data.username || 'Viewer TikTok';
    const giftName = data.giftName || data.name || `${unitCoins} pièce${unitCoins > 1 ? 's' : ''}`;

    // Déclenchement pour les cadeaux à hauteur de 1 pièce, 2 pièces et 5 pièces
    if (unitCoins === 1 || unitCoins === 2 || unitCoins === 5) {
        triggerTikTokGift(unitCoins, sender, giftName);
    } else if (totalCoins === 1 || totalCoins === 2 || totalCoins === 5) {
        triggerTikTokGift(totalCoins, sender, giftName);
    }
}

function triggerTikTokGift(coins, sender = 'Viewer_Live', giftName = 'Cadeau') {
    if (coins !== 1 && coins !== 2 && coins !== 5) return;

    const shotsToAdd = coins; // 1 pièce = 1 tir, 2 pièces = 2 tirs, 5 pièces = 5 tirs
    for (let i = 0; i < shotsToAdd; i++) {
        const preset = SHOT_PRESETS[Math.floor(Math.random() * SHOT_PRESETS.length)];
        const powerBoost = coins === 5 ? 6 : (coins === 2 ? 3 : 0);
        TIKTOK.shotQueue.push({
            u: Math.max(0.14, Math.min(0.86, preset.u + (Math.random() - 0.5) * 0.06)),
            v: Math.max(0.18, Math.min(0.86, preset.v + (Math.random() - 0.5) * 0.06)),
            power: Math.min(95, preset.power + powerBoost),
            curl: preset.curl,
            label: `${preset.label} (${sender})`,
            sender,
            coins,
            giftName
        });
    }

    const lastGiftEl = document.getElementById('tt-last-gift');
    if (lastGiftEl) {
        lastGiftEl.textContent = `🎁 ${sender} : ${giftName} (${coins} 🪙)`;
    }

    updateTikTokUI();
    showBanner(
        `🎁 +${shotsToAdd} TIR${shotsToAdd > 1 ? 'S' : ''} LIVE !`,
        `${sender} a envoyé ${giftName} (${coins} pièce${coins > 1 ? 's' : ''})`,
        'border-pink-400 text-pink-200'
    );

    if (STATE.phase === 'AIMING') {
        launchNextQueuedTikTokShot();
    }
}

function launchNextQueuedTikTokShot() {
    if (TIKTOK.shotQueue.length === 0 || STATE.phase !== 'AIMING') return;
    const nextShot = TIKTOK.shotQueue.shift();
    TIKTOK.currentShotMeta = nextShot;

    STATE.aimU = nextShot.u;
    STATE.aimV = nextShot.v;
    STATE.power = nextShot.power;
    STATE.curl = nextShot.curl;
    STATE.aimLabel = nextShot.label;

    updateTikTokUI();
    shootPenalty();
}

function shadeHex(hex, amt) {
    const clean = (hex || '#334155').replace('#', '');
    const num = parseInt(clean.length === 3 ? clean.split('').map(c => c + c).join('') : clean, 16);
    const r = Math.min(255, Math.max(0, ((num >> 16) & 255) + amt));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 255) + amt));
    const b = Math.min(255, Math.max(0, (num & 255) + amt));
    return `rgb(${r}, ${g}, ${b})`;
}

let audioCtx = null;

function initAudio() {
    if (audioCtx) return;
    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
    } catch (e) {
        audioCtx = null;
    }
}

function playSfx(type) {
    if (!STATE.soundEnabled) return;
    if (!audioCtx) initAudio();
    if (!audioCtx) return;
    try {
        if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'kick') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(145, now);
            osc.frequency.exponentialRampToValueAtTime(42, now + 0.16);
            gain.gain.setValueAtTime(0.24, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.start(now);
            osc.stop(now + 0.19);
        } else if (type === 'goal') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(587.33, now);
            osc.frequency.setValueAtTime(880, now + 0.14);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            osc.start(now);
            osc.stop(now + 0.46);
        } else if (type === 'save') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(185, now);
            osc.frequency.exponentialRampToValueAtTime(75, now + 0.12);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
            osc.start(now);
            osc.stop(now + 0.15);
        } else if (type === 'post') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(280, now + 0.12);
            gain.gain.setValueAtTime(0.16, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
            osc.start(now);
            osc.stop(now + 0.15);
        }
    } catch (e) {}
}

function toScreen(sx, sy, sz = 0) {
    const u = sx / SCENE.W;
    const v = sy / SCENE.H;
    const horizonTop = STATE.hudVisible ? STATE.height * 0.23 : STATE.height * 0.18;
    const bottomEdge = STATE.hudVisible ? STATE.height * 0.78 : STATE.height * 0.94;
    const pitchH = Math.max(180, bottomEdge - horizonTop);
    const wideBoost = STATE.width > 1200 ? Math.min(1.18, 1 + (STATE.width - 1200) / 3600) : 1.0;
    const spread = (0.68 + 0.44 * v) * wideBoost;
    const screenX = STATE.width * 0.5 + (u - 0.5) * STATE.width * spread;
    const groundY = horizonTop + Math.pow(v, 0.92) * pitchH;
    const scale = Math.max(0.45, Math.min(1.5, (0.62 + 0.52 * v) * (STATE.width / 1100)));
    return { x: screenX, y: groundY - sz * scale, groundY, scale };
}

function createGrassTexture() {
    if (!ctx) return;
    let seed = 1234567;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    const N = 128;
    const off = document.createElement('canvas');
    off.width = N;
    off.height = N;
    const o = off.getContext('2d');
    o.lineCap = 'round';
    for (let i = 0; i < 1100; i++) {
        const x = rnd() * N, y = rnd() * N;
        const len = 2 + rnd() * 3.2, lean = (rnd() - 0.5) * 1.6;
        const light = rnd() > 0.5;
        o.strokeStyle = light
            ? `rgba(190,255,160,${0.05 + rnd() * 0.08})`
            : `rgba(0,28,10,${0.07 + rnd() * 0.10})`;
        o.lineWidth = 0.7 + rnd() * 0.5;
        for (const ox of [-N, 0, N]) {
            for (const oy of [-N, 0, N]) {
                const px = x + ox, py = y + oy;
                if (px < -6 || px > N + 6 || py < -6 || py > N + 6) continue;
                o.beginPath();
                o.moveTo(px, py);
                o.lineTo(px + lean, py - len);
                o.stroke();
            }
        }
    }
    STATE.grassPattern = ctx.createPattern(off, 'repeat');
    STATE.grassPatternNear = ctx.createPattern(off, 'repeat');
    try {
        if (STATE.grassPatternNear && STATE.grassPatternNear.setTransform) {
            STATE.grassPatternNear.setTransform(new DOMMatrix().scale(2.1));
        }
    } catch (e) {}

    const M = 256;
    const mo = document.createElement('canvas');
    mo.width = M;
    mo.height = M;
    const m = mo.getContext('2d');
    for (let i = 0; i < 46; i++) {
        const x = rnd() * M, y = rnd() * M, r = 22 + rnd() * 46;
        const lightBlob = rnd() > 0.5;
        const a = 0.05 + rnd() * 0.05;
        for (const ox of [-M, 0, M]) {
            for (const oy of [-M, 0, M]) {
                const cx = x + ox, cy = y + oy;
                if (cx < -r || cx > M + r || cy < -r || cy > M + r) continue;
                const g = m.createRadialGradient(cx, cy, 0, cx, cy, r);
                g.addColorStop(0, lightBlob ? `rgba(200,255,150,${a})` : `rgba(0,25,10,${a * 1.2})`);
                g.addColorStop(1, 'rgba(0,0,0,0)');
                m.fillStyle = g;
                m.fillRect(cx - r, cy - r, r * 2, r * 2);
            }
        }
    }
    STATE.grassMottle = ctx.createPattern(mo, 'repeat');
}

function resizeCanvas() {
    if (!canvas || !ctx) return;
    const rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : null;
    const w = Math.max(320, (rect && rect.width) || window.innerWidth || document.documentElement.clientWidth || 1024);
    const h = Math.max(240, (rect && rect.height) || window.innerHeight || document.documentElement.clientHeight || 640);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    STATE.width = w;
    STATE.height = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ============================================================================
// PHYSIQUE DE FRAPPE, GARDIEN & FILET DE BUT
// ============================================================================
function executeKickPhysics() {
    STATE.phase = 'BALL_FLIGHT';
    shooter.kickAnim = 1.0;
    shooter.followThrough = 1.0;
    keeper.punchAnim = 0;
    ball.insideGoal = false;

    playSfx('kick');

    const leftPost = SCENE.goalCenterX - SCENE.goalWidth / 2;
    const rightPost = SCENE.goalCenterX + SCENE.goalWidth / 2;
    const rawTargetX = leftPost + STATE.aimU * SCENE.goalWidth + STATE.curl * 1.1;
    const rawTargetZ = Math.max(4, (1 - STATE.aimV) * (SCENE.goalHeight - 10) + 6);

    const insideX = rawTargetX > leftPost + 8 && rawTargetX < rightPost - 8;
    const nearLeftPost = Math.abs(rawTargetX - leftPost) <= 9;
    const nearRightPost = Math.abs(rawTargetX - rightPost) <= 9;
    const nearCrossbar = Math.abs(rawTargetZ - SCENE.goalHeight) <= 8 && rawTargetX >= leftPost - 4 && rawTargetX <= rightPost + 4;
    const insideZ = rawTargetZ <= SCENE.goalHeight - 4;

    const powerFactor = STATE.power / 100;
    const keeperReach = STATE.gkSkill * (1.25 - powerFactor * 0.30);

    let outcome = 'GOAL';
    let finalX = rawTargetX;
    let finalZ = rawTargetZ;

    if (!insideX || !insideZ) {
        if ((nearLeftPost || nearRightPost || nearCrossbar) && Math.random() < 0.65) {
            outcome = 'POST';
            if (nearLeftPost) finalX = leftPost;
            else if (nearRightPost) finalX = rightPost;
            else finalZ = SCENE.goalHeight;
        } else {
            outcome = 'WIDE';
        }
    } else {
        const gkGuessU = Math.max(0.10, Math.min(0.90, STATE.aimU + (Math.random() - 0.5) * (1.15 - STATE.gkSkill) * 0.68));
        const gkTargetX = leftPost + gkGuessU * SCENE.goalWidth;
        const distToKeeper = Math.abs(finalX - gkTargetX);

        keeper.diveDir = gkTargetX < SCENE.goalCenterX - 8 ? -1 : (gkTargetX > SCENE.goalCenterX + 8 ? 1 : 0);
        keeper.targetX = gkTargetX;
        keeper.diveProgress = 1.0;

        // Le gardien arrête le tir lorsqu'il plonge du bon côté et se trouve à portée du ballon
        if (distToKeeper < 38 * keeperReach && finalZ < SCENE.goalHeight * 0.88 && Math.random() < STATE.gkSkill * 1.18) {
            outcome = 'SAVE';
            finalX = gkTargetX + (finalX > gkTargetX ? -7 : 7);
            keeper.punchAnim = 1.0;
        }
    }

    if (outcome === 'GOAL' && keeper.diveProgress === 0) {
        keeper.diveDir = finalX < SCENE.goalCenterX ? -1 : 1;
        keeper.targetX = SCENE.goalCenterX + keeper.diveDir * 86;
        keeper.diveProgress = 1.0;
    }

    ball.startX = SCENE.spotX;
    ball.startY = SCENE.spotY;
    ball.targetX = finalX;
    ball.targetY = SCENE.goalY + 2;
    ball.targetZ = finalZ;
    ball.flightProgress = 0;
    ball.flightDuration = Math.max(0.30, 0.56 - powerFactor * 0.22);
    ball.outcome = outcome;
    ball.trail = [];
}

function resolveBallImpact() {
    STATE.attempts += 1;
    STATE.phase = 'OUTCOME';
    STATE.phaseTimer = TIKTOK.shotQueue.length > 0 ? 1.25 : 1.85;
    const kTeam = getTeamById(STATE.keeperTeamId);
    const speedMag = 130 + (STATE.power / 100) * 115;
    const meta = TIKTOK.currentShotMeta;
    const donorSuffix = meta ? ` • 🎁 ${meta.sender} (${meta.coins} 🪙)` : '';

    if (ball.outcome === 'GOAL') {
        STATE.goals += 1;
        STATE.history.push('GOAL');
        ball.insideGoal = true;
        ball.y = SCENE.goalY - SCENE.goalDepth * 0.52;
        STATE.netRipple = 1.0;
        STATE.netRippleX = ball.x;
        STATE.netRippleZ = ball.z;
        STATE.cameraShake = 8;
        ball.vx = (ball.x - SCENE.goalCenterX) * 0.22;
        ball.vy = -18;
        ball.vz = -35;
        spawnGoalConfetti();
        playSfx('goal');
        showBanner('⚽ BUUUUUUT !', `${STATE.aimLabel}${donorSuffix}`, 'border-emerald-400 text-emerald-300');
    } else if (ball.outcome === 'SAVE') {
        STATE.history.push('SAVE');
        ball.insideGoal = false;
        ball.y = Math.max(SCENE.goalY + 6, ball.y);
        STATE.cameraShake = 7;
        const dir = ball.x < SCENE.goalCenterX ? -1 : 1;
        ball.vx = dir * speedMag * 0.65;
        ball.vy = speedMag * 0.6;
        ball.vz = 85;
        playSfx('save');
        showBanner('🧤 ARRÊT DU GARDIEN !', `${kTeam.name} stoppe le tir${donorSuffix}`, 'border-sky-400 text-sky-300');
    } else if (ball.outcome === 'POST') {
        STATE.history.push('MISS');
        ball.insideGoal = false;
        ball.y = Math.max(SCENE.goalY + 6, ball.y);
        STATE.cameraShake = 9;
        const dir = ball.x < SCENE.goalCenterX ? -1.1 : 1.1;
        ball.vx = dir * speedMag * 0.7;
        ball.vy = speedMag * 0.65;
        ball.vz = ball.z > SCENE.goalHeight * 0.7 ? -90 : 90;
        playSfx('post');
        showBanner('💥 MONTANT !', `Le ballon heurte le cadre${donorSuffix}`, 'border-amber-400 text-amber-300');
    } else {
        STATE.history.push('MISS');
        ball.insideGoal = false;
        ball.vx = (ball.x - SCENE.goalCenterX) * 1.1;
        ball.vy = -45;
        ball.vz = 25;
        playSfx('kick');
        showBanner('💨 HORS CADRE', `Frappe à côté du but${donorSuffix}`, 'border-rose-400 text-rose-300');
    }

    TIKTOK.currentShotMeta = null;
    updateScoreboardUI();
}

function prepareNextShot() {
    if (STATE.shootoutMode === '5' && STATE.attempts >= 5) {
        const verdict = STATE.goals >= 3 ? '🏆 SÉRIE RÉUSSIE !' : '📋 FIN DE LA SÉRIE DE 5';
        showBanner(verdict, `Score final : ${STATE.goals} / 5 buts`, 'border-amber-300 text-amber-200');
        STATE.goals = 0;
        STATE.attempts = 0;
        STATE.history = [];
        updateScoreboardUI();
    }
    STATE.phase = 'AIMING';
    ball.x = SCENE.spotX;
    ball.y = SCENE.spotY;
    ball.z = 0;
    ball.vx = 0;
    ball.vy = 0;
    ball.vz = 0;
    ball.trail = [];
    ball.outcome = null;
    ball.insideGoal = false;

    shooter.x = shooter.startX;
    shooter.y = shooter.startY;
    shooter.kickAnim = 0;
    shooter.followThrough = 0;
    shooter.hipTwist = 0;

    keeper.x = SCENE.goalCenterX;
    keeper.y = SCENE.goalY + 7;
    keeper.vx = 0;
    keeper.targetX = SCENE.goalCenterX;
    keeper.diveProgress = 0;
    keeper.diveDir = 0;
    keeper.punchAnim = 0;

    if (TIKTOK.shotQueue.length > 0) {
        TIKTOK.autoDelayTimer = 0.28;
    }
}

function updateSimulation(rawDt) {
    const dt = Math.min(rawDt, 0.05);
    if (STATE.cameraShake > 0) STATE.cameraShake = Math.max(0, STATE.cameraShake - dt * 28);
    if (STATE.netRipple > 0) STATE.netRipple = Math.max(0, STATE.netRipple - dt * 1.35);

    STATE.flashes.forEach(f => {
        f.timer -= dt;
        if (f.timer <= 0) {
            f.timer = 1.4 + Math.random() * 4;
            f.rx = Math.random();
            f.ry = Math.random();
        }
    });

    for (let i = STATE.confetti.length - 1; i >= 0; i--) {
        const c = STATE.confetti[i];
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        c.vy += 460 * dt;
        c.rot += c.vrot * dt;
        c.life -= dt;
        if (c.life <= 0) STATE.confetti.splice(i, 1);
    }

    if (STATE.phase === 'AIMING') {
        const prevX = keeper.x;
        const desiredIdleX = SCENE.goalCenterX + Math.sin(performance.now() * 0.0032) * 16;
        keeper.x += (desiredIdleX - keeper.x) * Math.min(1, dt * 6);
        keeper.vx = dt > 0.0001 ? (keeper.x - prevX) / dt : 0;
        keeper.stepCycle += Math.abs(keeper.vx) * dt * 0.16;

        if (TIKTOK.shotQueue.length > 0) {
            if (TIKTOK.autoDelayTimer > 0) {
                TIKTOK.autoDelayTimer -= dt;
            } else {
                launchNextQueuedTikTokShot();
            }
        }
    } else if (STATE.phase === 'RUNUP') {
        const dx = shooter.targetX - shooter.x;
        const dy = shooter.targetY - shooter.y;
        const dist = Math.hypot(dx, dy);
        shooter.runCycle += dt * 20;
        shooter.hipTwist = Math.min(0.45, (1 - Math.min(1, dist / 75)) * 0.45);
        if (dist > 3) {
            shooter.x += (dx / dist) * 245 * dt;
            shooter.y += (dy / dist) * 245 * dt;
        } else {
            shooter.x = shooter.targetX;
            shooter.y = shooter.targetY;
            executeKickPhysics();
        }
    } else if (STATE.phase === 'BALL_FLIGHT') {
        ball.flightProgress += dt / ball.flightDuration;
        const u = Math.min(1, ball.flightProgress);
        const curve = Math.sin(u * Math.PI) * (STATE.curl * 1.15);
        ball.x = ball.startX + (ball.targetX - ball.startX) * u + curve;
        ball.y = ball.startY + (ball.targetY - ball.startY) * u;
        const arc = Math.sin(u * Math.PI) * 18 * (1 - u * 0.35);
        ball.z = ball.targetZ * u + arc;
        ball.spin += dt * 22;

        ball.trail.push({ x: ball.x, y: ball.y, z: ball.z, alpha: 0.9 });
        if (ball.trail.length > 14) ball.trail.shift();

        if (keeper.diveProgress > 0) {
            const prevX = keeper.x;
            keeper.x += (keeper.targetX - keeper.x) * Math.min(1, dt * 8.8);
            keeper.vx = dt > 0.0001 ? (keeper.x - prevX) / dt : 0;
            keeper.stepCycle += Math.abs(keeper.vx) * dt * 0.18;
        }
        if (u >= 1) resolveBallImpact();
    } else if (STATE.phase === 'OUTCOME') {
        if (shooter.kickAnim > 0) shooter.kickAnim = Math.max(0, shooter.kickAnim - dt * 3.2);
        if (shooter.followThrough > 0) shooter.followThrough = Math.max(0, shooter.followThrough - dt * 2.1);
        if (keeper.punchAnim > 0) keeper.punchAnim = Math.max(0, keeper.punchAnim - dt * 3.0);

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        ball.z += ball.vz * dt;
        ball.vz -= 320 * dt;

        const halfW = SCENE.goalWidth * 0.5 - 8;
        const minGoalX = SCENE.goalCenterX - halfW;
        const maxGoalX = SCENE.goalCenterX + halfW;
        const backNetY = SCENE.goalY - SCENE.goalDepth + 8;
        const frontLineY = SCENE.goalY - 2;

        if (ball.insideGoal) {
            if (ball.x < minGoalX) {
                ball.x = minGoalX;
                ball.vx = Math.abs(ball.vx) * 0.4;
            } else if (ball.x > maxGoalX) {
                ball.x = maxGoalX;
                ball.vx = -Math.abs(ball.vx) * 0.4;
            }
            if (ball.y < backNetY) {
                ball.y = backNetY;
                ball.vy = Math.abs(ball.vy) * 0.35;
            } else if (ball.y > frontLineY) {
                ball.y = frontLineY;
                ball.vy = -Math.abs(ball.vy) * 0.35;
            }
            if (ball.z > SCENE.goalHeight - 7) {
                ball.z = SCENE.goalHeight - 7;
                ball.vz = -Math.abs(ball.vz) * 0.35;
            }
        } else if (ball.outcome !== 'WIDE') {
            if (ball.y < SCENE.goalY + 5) {
                ball.y = SCENE.goalY + 5;
                ball.vy = Math.abs(ball.vy) * 0.55;
            }
        }

        if (ball.z <= 5) {
            ball.z = 5;
            ball.vz = Math.abs(ball.vz) * 0.45;
        }

        STATE.phaseTimer -= dt;
        if (STATE.phaseTimer <= 0) prepareNextShot();
    }

    ball.trail.forEach(t => { t.alpha *= 0.85; });
}

function paintFlagDesign(g, fl) {
    const W = 150, H = 100;
    const type = fl.flagType || 'custom';
    const rect = (c, x, y, w, h) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
    const txt = (s, x, y, size, color) => {
        g.font = `800 ${size}px "Chakra Petch", Arial, sans-serif`;
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillStyle = color;
        g.fillText(s, x, y);
    };
    const circle = (x, y, r, fill, stroke, lw) => {
        g.beginPath();
        g.arc(x, y, r, 0, Math.PI * 2);
        if (fill) { g.fillStyle = fill; g.fill(); }
        if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1; g.stroke(); }
    };

    switch (type) {
        case 'france':
            rect('#0055A4', 0, 0, 50, H); rect('#FFFFFF', 50, 0, 50, H); rect('#EF4135', 100, 0, 50, H);
            break;
        case 'germany':
            rect('#000000', 0, 0, W, 34); rect('#DD0000', 0, 33, W, 34); rect('#FFCE00', 0, 66, W, 34);
            break;
        case 'england':
            rect('#FFFFFF', 0, 0, W, H); rect('#CE1124', 62, 0, 26, H); rect('#CE1124', 0, 38, W, 24);
            break;
        case 'spain':
            rect('#AA151B', 0, 0, W, H); rect('#F1BF00', 0, 25, W, 50);
            g.fillStyle = '#C8A24A'; g.fillRect(36, 38, 18, 24);
            g.fillStyle = '#AA151B'; g.fillRect(38, 41, 6.5, 9); g.fillRect(45.5, 51, 6.5, 9);
            g.fillStyle = '#F8F4E3'; g.fillRect(45.5, 41, 6.5, 9); g.fillRect(38, 51, 6.5, 9);
            g.fillStyle = '#C8A24A'; g.fillRect(37, 33, 20, 5);
            break;
        case 'brazil': {
            rect('#009C3B', 0, 0, W, H);
            g.fillStyle = '#FFDF00';
            g.beginPath(); g.moveTo(75, 9); g.lineTo(141, 50); g.lineTo(75, 91); g.lineTo(9, 50); g.closePath(); g.fill();
            circle(75, 50, 25, '#002776');
            g.save();
            g.beginPath(); g.arc(75, 50, 25, 0, Math.PI * 2); g.clip();
            g.strokeStyle = '#FFFFFF'; g.lineWidth = 4.4;
            g.beginPath(); g.moveTo(48, 58); g.bezierCurveTo(60, 42, 86, 40, 104, 52); g.stroke();
            g.fillStyle = '#FFFFFF';
            for (let j = 0; j < 22; j++) {
                const a = j * 2.4, rr = Math.sqrt(j / 22) * 21;
                g.fillRect(75 + Math.cos(a) * rr, 50 + Math.sin(a) * rr, 1.2, 1.2);
            }
            g.restore();
            break;
        }
        case 'argentina': {
            rect('#75AADB', 0, 0, W, H); rect('#FFFFFF', 0, 33, W, 34);
            g.fillStyle = '#F6B40E';
            for (let i = 0; i < 16; i++) {
                const a = (i / 16) * Math.PI * 2, a2 = a + 0.2;
                g.beginPath();
                g.moveTo(75 + Math.cos(a) * 9, 50 + Math.sin(a) * 9);
                g.lineTo(75 + Math.cos(a + 0.1) * (i % 2 ? 16 : 19), 50 + Math.sin(a + 0.1) * (i % 2 ? 16 : 19));
                g.lineTo(75 + Math.cos(a2) * 9, 50 + Math.sin(a2) * 9);
                g.closePath(); g.fill();
            }
            circle(75, 50, 9, '#F6B40E', '#C98A06', 0.8);
            break;
        }
        case 'portugal':
            rect('#006600', 0, 0, 60, H); rect('#FF0000', 60, 0, 90, H);
            circle(60, 50, 16, '#FFE000', '#C9A800', 0.8);
            circle(60, 50, 12, '#FF0000');
            g.fillStyle = '#FFFFFF'; g.beginPath(); g.roundRect(53, 41, 14, 18, 3); g.fill();
            g.fillStyle = '#E00000'; g.beginPath(); g.roundRect(55, 43.5, 10, 12, 2); g.fill();
            g.fillStyle = '#003399';
            [[60, 46], [57.5, 49], [62.5, 49], [60, 52]].forEach(([x, y]) => g.fillRect(x - 1, y - 1, 2, 2));
            break;
        case 'morocco':
            rect('#C1272D', 0, 0, W, H);
            g.strokeStyle = '#006233'; g.lineWidth = 3.4; g.lineJoin = 'miter';
            g.beginPath();
            for (let k = 0; k < 5; k++) {
                const ang = -Math.PI / 2 + ((k * 2) % 5) * (Math.PI * 2 / 5);
                const px = 75 + Math.cos(ang) * 25, py = 52 + Math.sin(ang) * 25;
                if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
            }
            g.closePath(); g.stroke();
            break;
        case 'psg':
            rect('#004170', 0, 0, W, H); rect('#FFFFFF', 55, 0, 40, H); rect('#DA291C', 60, 0, 30, H);
            circle(75, 50, 21, '#004170', '#FFFFFF', 2.2);
            txt('PSG', 75, 51, 17, '#FFFFFF');
            break;
        case 'om':
            rect('#FFFFFF', 0, 0, W, H);
            g.strokeStyle = '#2FAEE0'; g.lineWidth = 7; g.strokeRect(3.5, 3.5, W - 7, H - 7);
            txt('OM', 75, 50, 48, '#2FAEE0');
            break;
        case 'barca':
            for (let i = 0; i < 8; i++) rect(i % 2 ? '#A50044' : '#004D98', i * (W / 8), 0, W / 8 + 0.6, H);
            g.fillStyle = '#EDBB00';
            g.beginPath(); g.moveTo(58, 22); g.lineTo(92, 22); g.lineTo(92, 58); g.quadraticCurveTo(92, 76, 75, 82); g.quadraticCurveTo(58, 76, 58, 58); g.closePath(); g.fill();
            g.fillStyle = '#004D98'; g.fillRect(62, 27, 13, 30);
            g.fillStyle = '#A50044'; g.fillRect(75, 27, 13, 30);
            g.beginPath(); g.moveTo(62, 57); g.quadraticCurveTo(75, 70, 75, 74); g.lineTo(75, 57); g.closePath(); g.fillStyle = '#004D98'; g.fill();
            g.beginPath(); g.moveTo(88, 57); g.quadraticCurveTo(75, 70, 75, 74); g.lineTo(75, 57); g.closePath(); g.fillStyle = '#A50044'; g.fill();
            break;
        case 'madrid':
            rect('#FFFFFF', 0, 0, W, H);
            g.strokeStyle = '#FEBE10'; g.lineWidth = 5; g.strokeRect(2.5, 2.5, W - 5, H - 5);
            g.fillStyle = '#FEBE10';
            g.beginPath(); g.moveTo(62, 26); g.lineTo(65, 14); g.lineTo(70, 22); g.lineTo(75, 11); g.lineTo(80, 22); g.lineTo(85, 14); g.lineTo(88, 26); g.closePath(); g.fill();
            circle(75, 56, 26, '#FFFFFF', '#FEBE10', 3);
            txt('RM', 75, 57, 26, '#00529F');
            break;
        default: {
            rect(fl.primary || '#1e3a8a', 0, 0, W / 2, H);
            rect(fl.secondary || '#dc2626', W / 2, 0, W / 2, H);
            g.globalAlpha = 0.85; rect(fl.trim || '#ffffff', 0, 40, W, 20); g.globalAlpha = 1;
            txt(String(fl.short || '').slice(0, 4).toUpperCase(), 75, 51, 22, '#0f172a');
        }
    }
}

function getFlagTexture(fl) {
    STATE.flagCache = STATE.flagCache || {};
    const key = [fl.flagType || 'custom', fl.primary, fl.secondary, fl.trim].join('|');
    if (STATE.flagCache[key]) return STATE.flagCache[key];
    const c = document.createElement('canvas');
    c.width = 150;
    c.height = 100;
    const g = c.getContext('2d');
    if (g) paintFlagDesign(g, fl);
    STATE.flagCache[key] = c;
    return c;
}

function drawTeamFlag(x, topY, height, width, wavePhase, flagData) {
    if (!ctx) return;
    const tex = getFlagTexture(flagData);
    const fh = height;
    const fw = Math.max(width, height * 1.5);
    const N = 30;
    const sliceW = fw / N;
    const texW = 150, texH = 100;

    const poleTop = topY - 9, poleBot = topY + fh + 9;
    const pg = ctx.createLinearGradient(x - 1.5, 0, x + 1.5, 0);
    pg.addColorStop(0, '#7f8ca0'); pg.addColorStop(0.45, '#ffffff'); pg.addColorStop(1, '#8996aa');
    ctx.fillStyle = pg;
    ctx.fillRect(x - 1.4, poleTop, 2.8, poleBot - poleTop);
    const fin = ctx.createRadialGradient(x - 0.8, poleTop - 2.4, 0.2, x, poleTop - 1.6, 3.2);
    fin.addColorStop(0, '#fff6c8'); fin.addColorStop(0.6, '#e0a82a'); fin.addColorStop(1, '#8a5d0c');
    ctx.fillStyle = fin;
    ctx.beginPath();
    ctx.arc(x, poleTop - 1.4, 2.8, 0, Math.PI * 2);
    ctx.fill();

    const amp = (u) => Math.pow(u, 1.15) * (1.4 + u * 5.6);
    const zAt = (u) => Math.sin(wavePhase - u * 3.6) * amp(u) + Math.sin(wavePhase * 1.7 - u * 6.4) * amp(u) * 0.28;
    const T = [], B = [], dzs = [];
    let curX = x;
    let zPrev = zAt(0);
    for (let i = 0; i <= N; i++) {
        const u = i / N;
        const z = zAt(u);
        const dz = z - zPrev;
        if (i > 0) curX += Math.sqrt(Math.max(0.2, sliceW * sliceW - dz * dz * 0.9));
        const sag = u * u * 2.4;
        const twist = Math.sin(wavePhase * 0.8 - u * 4.2 + 1.0) * amp(u) * 0.16;
        T.push({ x: curX, y: topY + z * 0.55 + sag });
        B.push({ x: curX, y: topY + fh * (1 - Math.min(0.06, Math.abs(dz) * 0.03)) + z * 0.5 + sag * 1.15 + twist });
        dzs.push(dz);
        zPrev = z;
    }

    ctx.fillStyle = 'rgba(0,0,0,0.26)';
    ctx.beginPath();
    ctx.moveTo(T[0].x + 2, T[0].y + 2.5);
    for (let i = 1; i <= N; i++) ctx.lineTo(T[i].x + 2.5, T[i].y + 3);
    for (let i = N; i >= 0; i--) ctx.lineTo(B[i].x + 2.5, B[i].y + 3);
    ctx.closePath();
    ctx.fill();

    const sw = texW / N;
    for (let i = 0; i < N; i++) {
        const t0 = T[i], t1 = T[i + 1], b0 = B[i];
        const srcX = i * sw;
        const srcW = Math.min(sw + 0.7, texW - srcX);
        ctx.save();
        ctx.transform((t1.x - t0.x) / sw, (t1.y - t0.y) / sw, 0, (b0.y - t0.y) / texH, t0.x, t0.y);
        ctx.drawImage(tex, srcX, 0, srcW, texH, 0, 0, srcW, texH);
        ctx.restore();

        const lit = -dzs[i + 1] / sliceW;
        const a = Math.min(0.34, Math.abs(lit) * 0.55) + (1 - i / N) * 0.05;
        ctx.fillStyle = lit > 0 ? `rgba(255,255,255,${a * 0.75})` : `rgba(0,0,0,${a})`;
        ctx.beginPath();
        ctx.moveTo(t0.x, t0.y);
        ctx.lineTo(t1.x + 0.4, t1.y);
        ctx.lineTo(B[i + 1].x + 0.4, B[i + 1].y);
        ctx.lineTo(b0.x, b0.y);
        ctx.closePath();
        ctx.fill();
    }

    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,0.28)';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(T[0].x, T[0].y);
    for (let i = 1; i <= N; i++) ctx.lineTo(T[i].x, T[i].y);
    ctx.moveTo(B[0].x, B[0].y);
    for (let i = 1; i <= N; i++) ctx.lineTo(B[i].x, B[i].y);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 0.6;
    ctx.setLineDash([2, 1.6]);
    ctx.beginPath();
    ctx.moveTo(T[0].x, T[0].y + 1.3);
    for (let i = 1; i <= N; i++) ctx.lineTo(T[i].x, T[i].y + 1.3);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.moveTo(T[0].x, T[0].y);
    ctx.lineTo(T[1].x + 1.2, T[1].y);
    ctx.lineTo(B[1].x + 1.2, B[1].y);
    ctx.lineTo(B[0].x, B[0].y);
    ctx.closePath();
    ctx.fill();
    [0.14, 0.86].forEach(f => {
        const gx = x + 1.2, gyy = T[0].y + (B[0].y - T[0].y) * f;
        ctx.fillStyle = '#d6dde8';
        ctx.beginPath(); ctx.arc(gx, gyy, 1.15, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth = 0.4;
        ctx.stroke();
    });
}

function drawStadiumAndPitch() {
    if (!ctx) return;
    const W = STATE.width;
    const H = STATE.height;

    const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.35);
    skyGrad.addColorStop(0, '#03060d');
    skyGrad.addColorStop(0.55, '#0b182e');
    skyGrad.addColorStop(1, '#152c4e');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    const standTop = H * 0.03;
    const standBot = toScreen(500, 128).groundY;
    const standH = Math.max(44, standBot - standTop);
    ctx.fillStyle = '#091222';
    ctx.fillRect(0, standTop, W, standH);

    const ledH = Math.max(22, Math.min(34, Math.round(H * 0.042)));
    const ledY = standBot - ledH;

    const nowSec = performance.now() * 0.001;
    STATE.crowdLayers.forEach(layer => {
        const rowRatio = (layer.row + 0.5) / 5;
        const ry = standTop + rowRatio * Math.max(14, ledY - standTop - 16);
        const rScale = 0.72 + rowRatio * 0.36;
        layer.heads.forEach(h => {
            const hx = h.u * W;
            const bounce = Math.sin(nowSec * h.speed + h.phase) * 2.1 * rScale;
            ctx.fillStyle = h.shirt;
            ctx.beginPath();
            ctx.ellipse(hx, ry + bounce + 4.5 * rScale, 4.2 * rScale, 3.2 * rScale, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = h.skin;
            ctx.beginPath();
            ctx.arc(hx, ry + bounce, 3.1 * rScale, 0, Math.PI * 2);
            ctx.fill();

            if (h.armsUp) {
                ctx.strokeStyle = h.skin;
                ctx.lineWidth = 1.5 * rScale;
                ctx.beginPath();
                ctx.moveTo(hx - 3.5 * rScale, ry + bounce + 3.5 * rScale);
                ctx.lineTo(hx - 5.2 * rScale, ry + bounce - 1.5 * rScale);
                ctx.moveTo(hx + 3.5 * rScale, ry + bounce + 3.5 * rScale);
                ctx.lineTo(hx + 5.2 * rScale, ry + bounce - 1.5 * rScale);
                ctx.stroke();
            }
        });
    });

    const flagH = Math.max(20, Math.min(36, (ledY - standTop) * 0.52));
    const flagW = Math.max(18, W * 0.024);
    const flagTop = ledY - flagH - 8;
    STATE.stadiumFlags.forEach(fl => {
        const fx = fl.u * W;
        drawTeamFlag(fx, flagTop, flagH, flagW, nowSec * fl.speed + fl.phase, fl);
    });

    STATE.flashes.forEach(f => {
        if (f.timer < f.dur) {
            const fx = f.rx * W;
            const fy = standTop + f.ry * Math.max(12, ledY - standTop - 4);
            const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, 18);
            g.addColorStop(0, 'rgba(255,255,255,0.98)');
            g.addColorStop(0.45, 'rgba(186,230,253,0.45)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(fx, fy, 18, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    const sTeam = getTeamById(STATE.shooterTeamId);
    const kTeam = getTeamById(STATE.keeperTeamId);
    const bannerGrad = ctx.createLinearGradient(0, ledY, 0, ledY + ledH);
    bannerGrad.addColorStop(0, '#040b17');
    bannerGrad.addColorStop(0.5, '#091933');
    bannerGrad.addColorStop(1, '#040b17');
    ctx.fillStyle = bannerGrad;
    ctx.fillRect(0, ledY, W, ledH);

    ctx.fillStyle = sTeam.primary || '#0ea5e9';
    ctx.fillRect(0, ledY, W, 2.2);
    ctx.fillStyle = kTeam.primary || '#38bdf8';
    ctx.fillRect(0, ledY + ledH - 2, W, 2);

    const fontSize = Math.max(13, Math.min(20, Math.round(ledH * 0.62)));
    ctx.font = `700 ${fontSize}px "Chakra Petch", sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f8fafc';
    const bannerMsg = TIKTOK.connected
        ? `★ TIKTOK LIVE (${TIKTOK.username})  •  1 / 2 / 5 PIÈCES = TIRS EN DIRECT  •  ${sTeam.name.toUpperCase()} VS ${kTeam.name.toUpperCase()}  `
        : `★ STADIUM ARENA  •  ${sTeam.name.toUpperCase()} VS ${kTeam.name.toUpperCase()}  •  LIVE PENALTY  `;
    const unitWidth = Math.max(360, ctx.measureText(bannerMsg).width + 48);
    const scrollX = (performance.now() * 0.065) % unitWidth;
    const textY = ledY + ledH * 0.52;
    for (let x = -scrollX; x < W + unitWidth; x += unitWidth) {
        ctx.fillText(bannerMsg, x, textY);
    }

    const pTL = toScreen(0, 130);
    const pBR = toScreen(SCENE.W, SCENE.H);
    const mixCol = (c1, c2, t) => {
        const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
        const mix = (sh) => Math.round(((a >> sh) & 255) + (((b >> sh) & 255) - ((a >> sh) & 255)) * t);
        return `rgb(${mix(16)},${mix(8)},${mix(0)})`;
    };
    const rnd01 = (i) => { const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, pTL.y, W, H - pTL.y);
    ctx.clip();

    const bands = 18;
    const XL = -1400, XR = SCENE.W + 1400;
    for (let i = 0; i < bands; i++) {
        const y0 = 130 + (i / bands) * (SCENE.H - 130);
        const y1 = 130 + ((i + 1) / bands) * (SCENE.H - 130);
        const a = toScreen(XL, y0), b = toScreen(XR, y0), c = toScreen(XR, y1), d = toScreen(XL, y1);
        const depthT = i / (bands - 1);
        const base = i % 2 === 0
            ? mixCol('#0f3d22', '#1e7c39', depthT)
            : mixCol('#14502b', '#29974a', depthT);
        ctx.beginPath();
        ctx.moveTo(a.x, a.groundY);
        ctx.lineTo(b.x, b.groundY);
        ctx.lineTo(c.x, c.groundY);
        ctx.lineTo(d.x, d.groundY);
        ctx.closePath();
        ctx.fillStyle = base;
        ctx.fill();
        const lean = ctx.createLinearGradient(0, a.groundY, 0, d.groundY);
        lean.addColorStop(0, i % 2 === 0 ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.02)');
        lean.addColorStop(1, i % 2 === 0 ? 'rgba(0,0,0,0.05)' : 'rgba(0,0,0,0.08)');
        ctx.fillStyle = lean;
        ctx.fill();
    }

    const pLine = (pts, wWorld = 3.2) => {
        for (let i = 0; i < pts.length - 1; i++) {
            const x1 = pts[i][0], y1 = pts[i][1], x2 = pts[i + 1][0], y2 = pts[i + 1][1];
            const n = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 18));
            for (let k = 0; k < n; k++) {
                const a = toScreen(x1 + (x2 - x1) * k / n, y1 + (y2 - y1) * k / n);
                const b = toScreen(x1 + (x2 - x1) * (k + 1) / n, y1 + (y2 - y1) * (k + 1) / n);
                const w = wWorld * ((a.scale + b.scale) / 2);
                ctx.lineCap = 'butt';
                ctx.strokeStyle = 'rgba(255,255,255,0.10)';
                ctx.lineWidth = w * 2.3;
                ctx.beginPath(); ctx.moveTo(a.x, a.groundY); ctx.lineTo(b.x, b.groundY); ctx.stroke();
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#eef4ea';
                ctx.lineWidth = w;
                ctx.beginPath(); ctx.moveTo(a.x, a.groundY); ctx.lineTo(b.x, b.groundY); ctx.stroke();
            }
        }
    };
    const gy0 = SCENE.goalY;
    pLine([[XL, gy0], [XR, gy0]]);
    pLine([[295, gy0], [295, 278], [705, 278], [705, gy0]]);
    pLine([[205, gy0], [205, 560], [795, 560], [795, gy0]]);
    const arc = [];
    const arcLimit = Math.acos(122 / 150);
    for (let k = 0; k <= 28; k++) {
        const th = -arcLimit + (2 * arcLimit * k) / 28;
        arc.push([SCENE.spotX + 190 * Math.sin(th), SCENE.spotY + 150 * Math.cos(th)]);
    }
    pLine(arc);

    const worn = (wx, wy, rx, ry, alpha) => {
        const c = toScreen(wx, wy);
        const sx = toScreen(wx + 1, wy).x - c.x;
        const sy = toScreen(wx, wy + 1).groundY - c.groundY;
        const rX = Math.abs(rx * sx), rY = Math.abs(ry * sy);
        if (rX < 1 || rY < 1) return;
        ctx.save();
        ctx.translate(c.x, c.groundY);
        ctx.scale(1, rY / rX);
        const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rX);
        g.addColorStop(0, `rgba(122,92,52,${alpha})`);
        g.addColorStop(0.55, `rgba(104,84,48,${alpha * 0.55})`);
        g.addColorStop(1, 'rgba(90,76,44,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, rX, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    };
    worn(500, 205, 175, 28, 0.36);
    worn(500, 238, 100, 22, 0.24);
    worn(330, 244, 44, 16, 0.14);
    worn(690, 252, 40, 15, 0.14);
    worn(500, 450, 80, 42, 0.22);
    worn(446, 505, 62, 30, 0.15);
    worn(552, 524, 44, 22, 0.10);
    worn(SCENE.spotX, SCENE.spotY, 38, 17, 0.62);

    const spot = toScreen(SCENE.spotX, SCENE.spotY);
    for (let i = 0; i < 46; i++) {
        const ang = rnd01(i + 1) * Math.PI * 2;
        const rad = Math.sqrt(rnd01(i + 90)) * 30;
        const q = toScreen(SCENE.spotX + Math.cos(ang) * rad * 1.4, SCENE.spotY + Math.sin(ang) * rad * 0.62);
        ctx.fillStyle = rnd01(i + 200) > 0.5 ? 'rgba(78,58,32,0.55)' : 'rgba(150,118,70,0.40)';
        ctx.fillRect(q.x, q.groundY, Math.max(1, 1.3 * q.scale), Math.max(1, 1.0 * q.scale));
    }
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(spot.x + 0.8, spot.groundY + 1.1, 5.3 * spot.scale, 2.9 * spot.scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f2f6ef';
    ctx.beginPath();
    ctx.ellipse(spot.x, spot.groundY, 4.6 * spot.scale, 2.5 * spot.scale, 0, 0, Math.PI * 2);
    ctx.fill();

    if (STATE.grassMottle) {
        ctx.fillStyle = STATE.grassMottle;
        ctx.fillRect(0, pTL.y, W, H - pTL.y);
    }
    if (STATE.grassPattern) {
        ctx.fillStyle = STATE.grassPattern;
        ctx.fillRect(0, pTL.y, W, H - pTL.y);
    }
    if (STATE.grassPatternNear) {
        const yA = pTL.y + (H - pTL.y) * 0.35;
        const steps = 6;
        const stepH = (H - yA) / steps;
        for (let i = 0; i < steps; i++) {
            ctx.globalAlpha = (i + 1) / steps * 0.85;
            ctx.fillStyle = STATE.grassPatternNear;
            ctx.fillRect(0, yA + i * stepH, W, stepH + 1);
        }
        ctx.globalAlpha = 1;
    }

    const haze = ctx.createLinearGradient(0, pTL.y, 0, pTL.y + (pBR.y - pTL.y) * 0.5);
    haze.addColorStop(0, 'rgba(8,24,52,0.46)');
    haze.addColorStop(1, 'rgba(8,24,52,0)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, pTL.y, W, (pBR.y - pTL.y) * 0.5);
    const ledShadow = ctx.createLinearGradient(0, pTL.y, 0, pTL.y + 16);
    ledShadow.addColorStop(0, 'rgba(0,0,0,0.40)');
    ledShadow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = ledShadow;
    ctx.fillRect(0, pTL.y, W, 16);

    const lcx = W * 0.5, lcy = pTL.y + (pBR.y - pTL.y) * 0.42;
    const pool = ctx.createRadialGradient(lcx, lcy, 0, lcx, lcy, W * 0.68);
    pool.addColorStop(0, 'rgba(255,252,225,0.15)');
    pool.addColorStop(0.55, 'rgba(255,252,225,0.04)');
    pool.addColorStop(1, 'rgba(0,6,16,0.34)');
    ctx.fillStyle = pool;
    ctx.fillRect(0, pTL.y, W, H - pTL.y);
    [W * 0.14, W * 0.86].forEach(hx => {
        const hot = ctx.createRadialGradient(hx, lcy, 0, hx, lcy, W * 0.26);
        hot.addColorStop(0, 'rgba(235,248,255,0.07)');
        hot.addColorStop(1, 'rgba(235,248,255,0)');
        ctx.fillStyle = hot;
        ctx.fillRect(0, pTL.y, W, H - pTL.y);
    });

    ctx.restore();

    const beams = [W * 0.14, W * 0.86];
    beams.forEach(bx => {
        const cone = ctx.createLinearGradient(bx, 0, bx + (W * 0.5 - bx) * 0.25, H * 0.75);
        cone.addColorStop(0, 'rgba(224, 242, 254, 0.12)');
        cone.addColorStop(0.6, 'rgba(186, 230, 253, 0.03)');
        cone.addColorStop(1, 'rgba(186, 230, 253, 0)');
        ctx.fillStyle = cone;
        ctx.beginPath();
        ctx.moveTo(bx - 18, 0);
        ctx.lineTo(bx + 18, 0);
        ctx.lineTo(bx + W * 0.24, H * 0.78);
        ctx.lineTo(bx - W * 0.16, H * 0.78);
        ctx.closePath();
        ctx.fill();
    });
}

function drawGoal3D() {
    if (!ctx) return;
    const halfW = SCENE.goalWidth / 2;
    const leftX = SCENE.goalCenterX - halfW;
    const rightX = SCENE.goalCenterX + halfW;
    const gy = SCENE.goalY;
    const gh = SCENE.goalHeight;
    const depth = SCENE.goalDepth;

    const fBL = { x: leftX, y: gy, z: 0 }, fBR = { x: rightX, y: gy, z: 0 };
    const fTL = { x: leftX, y: gy, z: gh }, fTR = { x: rightX, y: gy, z: gh };
    const bBL = { x: leftX + 12, y: gy - depth, z: 0 }, bBR = { x: rightX - 12, y: gy - depth, z: 0 };
    const bTL = { x: leftX + 14, y: gy - depth * 0.85, z: gh * 0.92 };
    const bTR = { x: rightX - 14, y: gy - depth * 0.85, z: gh * 0.92 };

    const S = (p) => toScreen(p.x, p.y, p.z);
    const sFBL = S(fBL), sFBR = S(fBR), sFTL = S(fTL), sFTR = S(fTR);
    const sBBL = S(bBL), sBBR = S(bBR), sBTL = S(bTL), sBTR = S(bTR);

    const sc = sFBL.scale;
    const postW = Math.max(5, 7.6 * sc);
    const barW = postW * 0.5;
    const netW = Math.max(0.6, 0.85 * sc);

    const rip = STATE.netRipple;
    const ripAmp = rip * Math.cos((1 - rip) * 9) * 13;
    const impX = STATE.netRippleX, impZ = STATE.netRippleZ;

    const lerp3 = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, z: a.z + (b.z - a.z) * t });
    const bil = (a, b, c, d, u, v) => lerp3(lerp3(a, b, u), lerp3(c, d, u), v);

    const disp = (p) => {
        if (rip <= 0.001) return p;
        const t = Math.max(0, Math.min(1, (gy - p.y) / depth));
        const anchor = t * t * (3 - 2 * t);
        const ground = Math.min(1, p.z / 14);
        const dx = (p.x - impX) / 42, dz = (p.z - impZ) / 32, dy = (p.y - (gy - depth * 0.5)) / 55;
        const g = Math.exp(-(dx * dx + dz * dz + dy * dy)) * anchor;
        return { x: p.x, y: p.y - ripAmp * g * ground, z: p.z + ripAmp * 0.2 * g * ground };
    };

    const mesh = (a, b, c, d, nu, nv, sag) => {
        const segs = 10;
        ctx.beginPath();
        for (let i = 0; i <= nu; i++) {
            const u = i / nu;
            for (let k = 0; k <= segs; k++) {
                const v = k / segs;
                const q = disp(sag(bil(a, b, c, d, u, v), u, v));
                const sp = S(q);
                if (k === 0) ctx.moveTo(sp.x, sp.y); else ctx.lineTo(sp.x, sp.y);
            }
        }
        for (let j = 0; j <= nv; j++) {
            const v = j / nv;
            for (let k = 0; k <= segs; k++) {
                const u = k / segs;
                const q = disp(sag(bil(a, b, c, d, u, v), u, v));
                const sp = S(q);
                if (k === 0) ctx.moveTo(sp.x, sp.y); else ctx.lineTo(sp.x, sp.y);
            }
        }
    };
    const strokeMesh = (alpha) => {
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(0,0,0,0.22)';
        ctx.lineWidth = netW + 0.9;
        ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = netW;
        ctx.stroke();
    };

    const sagBack = (p, u, v) => ({ x: p.x, y: p.y - Math.sin(Math.PI * u) * Math.sin(Math.PI * v) * 2.6, z: p.z });
    const sagRoof = (p, u, v) => ({ x: p.x, y: p.y, z: p.z - Math.sin(Math.PI * u) * Math.sin(Math.PI * v) * 3.4 });
    const sagLeft = (p, u, v) => ({ x: p.x - Math.sin(Math.PI * u) * Math.sin(Math.PI * v) * 2.8, y: p.y, z: p.z });
    const sagRight = (p, u, v) => ({ x: p.x + Math.sin(Math.PI * u) * Math.sin(Math.PI * v) * 2.8, y: p.y, z: p.z });

    const tube = (a, b, w, pal) => {
        const dx = b.x - a.x, dy = b.y - a.y;
        const len = Math.hypot(dx, dy) || 1;
        let nx = -dy / len, ny = dx / len;
        if (nx * CH_LIGHT.x + ny * CH_LIGHT.y < 0) { nx = -nx; ny = -ny; }
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(0,0,0,0.38)';
        ctx.lineWidth = w + 1.8;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        const g = ctx.createLinearGradient(mx - nx * w / 2, my - ny * w / 2, mx + nx * w / 2, my + ny * w / 2);
        g.addColorStop(0, pal[0]);
        g.addColorStop(0.58, pal[1]);
        g.addColorStop(0.82, pal[2]);
        g.addColorStop(1, pal[3]);
        ctx.strokeStyle = g;
        ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    };
    const palFront = ['#76849a', '#ffffff', '#e8edf4', '#a3afc0'];
    const palRear = ['#5d6b80', '#d5dce7', '#b8c2d1', '#7f8ca0'];

    const shg = ctx.createLinearGradient(0, sFBL.y, 0, sBBL.y + 8);
    shg.addColorStop(0, 'rgba(0,0,0,0.10)');
    shg.addColorStop(1, 'rgba(0,0,0,0.34)');
    ctx.fillStyle = shg;
    ctx.beginPath();
    ctx.moveTo(sFBL.x, sFBL.y);
    ctx.lineTo(sFBR.x, sFBR.y);
    ctx.lineTo(sBBR.x + 8, sBBR.y + 5);
    ctx.lineTo(sBBL.x - 8, sBBL.y + 5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.lineWidth = postW * 0.7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sFBL.x, sFBL.y + 1); ctx.lineTo(sFBL.x + 10 * sc, sFBL.y + 5 * sc);
    ctx.moveTo(sFBR.x, sFBR.y + 1); ctx.lineTo(sFBR.x + 10 * sc, sFBR.y + 5 * sc);
    ctx.stroke();

    const inner = ctx.createLinearGradient(0, sBTL.y, 0, sBBL.y);
    inner.addColorStop(0, 'rgba(3,8,18,0.50)');
    inner.addColorStop(1, 'rgba(3,8,18,0.26)');
    ctx.fillStyle = inner;
    ctx.beginPath();
    ctx.moveTo(sBBL.x, sBBL.y); ctx.lineTo(sBBR.x, sBBR.y); ctx.lineTo(sBTR.x, sBTR.y); ctx.lineTo(sBTL.x, sBTL.y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(3,8,18,0.14)';
    ctx.beginPath();
    ctx.moveTo(sFTL.x, sFTL.y); ctx.lineTo(sBTL.x, sBTL.y); ctx.lineTo(sBBL.x, sBBL.y); ctx.lineTo(sFBL.x, sFBL.y);
    ctx.closePath();
    ctx.moveTo(sFTR.x, sFTR.y); ctx.lineTo(sBTR.x, sBTR.y); ctx.lineTo(sBBR.x, sBBR.y); ctx.lineTo(sFBR.x, sFBR.y);
    ctx.closePath();
    ctx.fill();

    mesh(bTL, bTR, bBL, bBR, 26, 9, sagBack);
    strokeMesh(0.36);

    ctx.fillStyle = 'rgba(255,255,255,0.30)';
    for (let i = 0; i <= 26; i++) {
        for (let j = 0; j <= 9; j++) {
            const q = S(disp(sagBack(bil(bTL, bTR, bBL, bBR, i / 26, j / 9), i / 26, j / 9)));
            ctx.fillRect(q.x - 0.6, q.y - 0.6, 1.2, 1.2);
        }
    }

    mesh(fTL, bTL, fBL, bBL, 6, 9, sagLeft);
    strokeMesh(0.28);
    mesh(fTR, bTR, fBR, bBR, 6, 9, sagRight);
    strokeMesh(0.28);
    mesh(fTL, fTR, bTL, bTR, 26, 6, sagRoof);
    strokeMesh(0.30);

    tube(sFBL, sBBL, barW, palRear);
    tube(sFBR, sBBR, barW, palRear);
    tube(sBBL, sBBR, barW, palRear);
    tube(sFTL, sBTL, barW, palRear);
    tube(sFTR, sBTR, barW, palRear);
    tube(sBTL, sBTR, barW, palRear);
    tube(sBTL, sBBL, barW, palRear);
    tube(sBTR, sBBR, barW, palRear);

    ctx.fillStyle = '#cbd5e1';
    for (let i = 1; i < 9; i++) {
        const q = S(disp(bil(bBL, bBR, bBL, bBR, i / 9, 0)));
        ctx.beginPath();
        ctx.arc(q.x, q.y + 1, Math.max(0.9, 1.1 * sc), 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = 'rgba(0,0,0,0.38)';
    [sFBL, sFBR].forEach(p => {
        ctx.beginPath();
        ctx.ellipse(p.x, p.y + 1, postW * 0.85, postW * 0.30, 0, 0, Math.PI * 2);
        ctx.fill();
    });
    tube(sFBL, sFTL, postW, palFront);
    tube(sFBR, sFTR, postW, palFront);
    tube(sFTL, sFTR, postW, palFront);

    ctx.strokeStyle = 'rgba(15,23,42,0.85)';
    ctx.lineWidth = postW * 0.92;
    ctx.lineCap = 'butt';
    [[sFBL, sFTL], [sFBR, sFTR]].forEach(([a, b]) => {
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(a.x + (b.x - a.x) * 0.1, a.y + (b.y - a.y) * 0.1);
        ctx.stroke();
    });

    [sFTL, sFTR].forEach(p => {
        const rg = ctx.createRadialGradient(p.x - postW * 0.18, p.y - postW * 0.2, 0, p.x, p.y, postW * 0.62);
        rg.addColorStop(0, '#ffffff');
        rg.addColorStop(1, '#9aa7ba');
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.arc(p.x, p.y, postW * 0.56, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = Math.max(1, postW * 0.14);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sFTL.x + postW * 0.3, sFTL.y - postW * 0.16);
    ctx.lineTo(sFTR.x - postW * 0.3, sFTR.y - postW * 0.16);
    ctx.stroke();
}

const CH_LIGHT = { x: -0.55, y: -0.83 };

function chLimb(x1, y1, x2, y2, w1, w2, color, shade = 0.24, glow = 0.16) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
