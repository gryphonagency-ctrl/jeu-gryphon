        ctx.rotate(dir * 1.12 * diveEase);
    }
    ctx.scale(s * 0.97, s * 1.14);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const bounce = Math.sin(performance.now() * 0.007) * 1.4 * (1 - diveEase);
    const punch = keeper.punchAnim > 0 ? Math.sin(keeper.punchAnim * Math.PI) : 0;
    const hipY = -15 + bounce;
    const shoulderY = -31 + bounce;

    const legs = [-1, 1].map((side, i) => {
        const lift = stepLift[i];
        const shuffle = Math.sin(keeper.stepCycle + (i ? Math.PI : 0)) * 2.8 * lateralSpeed;
        let fx = side * (6.6 + 1.2 * lateralSpeed) + shuffle;
        let fy = -1.4 - lift * 4.2;
        if (diveEase > 0.05) {
            fx = side * 3.2 - dir * 3.5 * diveEase;
            fy = -1.4 - diveEase * (side === dir ? 3 : 8);
        }
        const hx = side * 4.2, hy = hipY;
        const k = chElbow(hx, hy, fx, fy - 1.2, 2.2 * (1 - diveEase * 0.7) + lift * 1.5, side);
        return { hx, hy, kx: k.x, ky: k.y, fx, fy, side };
    });

    legs.forEach(L => {
        chLimb(L.hx, L.hy, L.kx, L.ky, 6.4, 5.0, skin, 0.30, 0.20);
        const tx = chLerp(L.hx, L.kx, 0.55), ty = chLerp(L.hy, L.ky, 0.55);
        chLimb(L.hx, L.hy, tx, ty, 8.0, 7.4, shortsC, 0.32, 0.12);
        chLimb(L.kx, L.ky, L.fx, L.fy - 1.0, 4.7, 3.5, sockC, 0.30, 0.16);
        chLimb(L.kx, L.ky, chLerp(L.kx, L.fx, 0.17), chLerp(L.ky, L.fy - 1.0, 0.17), 4.9, 4.7, shadeHex(sockC, 45), 0.18, 0.10);
        chBootFront(L.fx, L.fy, L.side, top);
    });

    const wg = ctx.createLinearGradient(-8, 0, 8, 0);
    wg.addColorStop(0, shortsC); wg.addColorStop(0.5, shortsL); wg.addColorStop(1, shortsC);
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.roundRect(-8.3, hipY - 4.4, 16.6, 8.6, 2.6);
    ctx.fill();

    const waistY = hipY - 2.5;
    const tg = ctx.createLinearGradient(-9.4, 0, 9.4, 0);
    tg.addColorStop(0, topD); tg.addColorStop(0.26, top); tg.addColorStop(0.55, topL); tg.addColorStop(0.82, top); tg.addColorStop(1, topD);
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.moveTo(-9.4, shoulderY + 0.8);
    ctx.quadraticCurveTo(0, shoulderY - 3.0, 9.4, shoulderY + 0.8);
    ctx.lineTo(7.8, waistY + 1.2);
    ctx.quadraticCurveTo(0, waistY + 3.2, -7.8, waistY + 1.2);
    ctx.closePath();
    ctx.fill();

    ctx.font = '800 8.8px "Chakra Petch", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#0b1220';
    ctx.fillText('1', 0, shoulderY + 12.2);

    const gloveCuff = shadeHex(top, -70);
    [-1, 1].forEach(side => {
        const sx = side * 8.7, sy = shoulderY + 1.4;
        const readyX = side * (13.6 + 0.9 * punch);
        const readyY = -21.5 + bounce - punch * 9;
        const upX = side * (5.6 - (side === dir ? 0 : 1.2)) + dir * 1.5;
        const upY = -50 + bounce + (side === dir ? 0 : 4);
        const hx = chLerp(readyX, upX, diveEase) + side * punch * 1.5;
        const hy = chLerp(readyY, upY, diveEase);
        const el = chElbow(sx, sy, hx, hy, chLerp(4.8, 1.4, diveEase) * (1 - punch * 0.5), side);

        ctx.fillStyle = topD;
        ctx.beginPath(); ctx.arc(sx, sy, 3.5, 0, Math.PI * 2); ctx.fill();
        chLimb(sx, sy, el.x, el.y, 5.8, 4.9, top, 0.30, 0.20);
        chLimb(el.x, el.y, hx, hy, 4.9, 4.0, top, 0.30, 0.18);

        const ang = Math.atan2(hy - el.y, hx - el.x);
        chGlove(hx + Math.cos(ang) * 1.4, hy + Math.sin(ang) * 1.4, ang, 0.18 + diveEase * 0.55 + punch * 0.3, side, gloveCuff);
    });

    const hcY = -38.8 + bounce;
    chLimb(0, hcY + 4, 0, shoulderY - 1.2, 5.4, 6.8, skinD, 0.18, 0.04);

    ctx.save();
    ctx.translate(0, hcY + 1.2);
    ctx.scale(0.8, 0.8);
    const fg = ctx.createRadialGradient(-1.6, -2.2, 0.5, 0, 0, 7);
    fg.addColorStop(0, skinL); fg.addColorStop(0.55, skin); fg.addColorStop(1, skinD);
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.ellipse(0, 0, 5.0, 5.9, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = hairCol;
    ctx.beginPath();
    ctx.moveTo(-5.2, -1.2);
    ctx.bezierCurveTo(-6.0, -7.6, 6.0, -7.6, 5.2, -1.2);
    ctx.quadraticCurveTo(4.4, -3.6, 2.4, -3.8);
    ctx.quadraticCurveTo(0, -2.6, -2.4, -3.8);
    ctx.quadraticCurveTo(-4.4, -3.6, -5.2, -1.2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.restore();
}

function drawShooter() {
    if (!ctx) return;
    if (P3D.ready) { try { p3dShooter(); return; } catch (e) { console.error(e); p3dOff(); } }
    const team = getTeamById(STATE.shooterTeamId);
    const pos = toScreen(shooter.x, shooter.y, 0);
    const s = pos.scale * 1.62;

    const skin = shooter.skin, skinD = shadeHex(skin, -36);
    const shirt = team.primary, shirtD = shadeHex(shirt, -42), shirtL = shadeHex(shirt, 20);
    const shorts = team.shorts, shortsD = shadeHex(shorts, -36), shortsL = shadeHex(shorts, 16);
    const sock = team.trim;

    const isRunning = STATE.phase === 'RUNUP';
    const strideWave = Math.sin(shooter.runCycle);
    const stepLift = Math.max(0, Math.cos(shooter.runCycle));

    const kickPhase = shooter.kickAnim;
    const windup = kickPhase > 0.55 ? (kickPhase - 0.55) / 0.45 : 0;
    const strikeSnap = kickPhase > 0 ? Math.sin(Math.min(1, (1 - kickPhase) * 1.45) * Math.PI) : 0;
    const follow = shooter.followThrough;

    const bodyLeanForward = isRunning
        ? 0.26 + stepLift * 0.07
        : (-0.2 * windup + 0.3 * strikeSnap + 0.2 * follow);
    const hipAngle = shooter.hipTwist - follow * 0.18 + strikeSnap * 0.12;
    const verticalBob = isRunning ? -stepLift * 3.2 * s : (strikeSnap * 2.0 * s);
    const leanX = bodyLeanForward * 2.2;

    ctx.save();
    ctx.translate(pos.x, pos.groundY + verticalBob);
    chGroundShadow(2 * s, 2.5 * s, 19 * s, 6.8 * s, 0.5);
    ctx.scale(s * 0.97, s * 1.16);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const drawArm = (side, swing) => {
        const shX = side * 10.4 + leanX, shY = -30.8;
        let elX, elY, hX, hY;
        if (side < 0) {
            elX = shX - Math.sin(swing) * 6.5 - 2.2;
            elY = shY + Math.cos(swing) * 6.8;
            hX = elX - Math.sin(swing + 1.25) * 6.2;
            hY = elY + Math.cos(swing + 1.25) * 6.0;
        } else {
            elX = shX + Math.sin(swing) * 6.5 + 2.2;
            elY = shY + Math.cos(swing) * 6.6;
            hX = elX + Math.sin(swing - 1.2) * 6.2;
            hY = elY + Math.cos(swing - 1.2) * 5.8;
        }
        chLimb(elX, elY, hX, hY, 4.0, 3.1, skin, 0.30, 0.20);
        chLimb(shX, shY, elX, elY, 6.8, 5.4, side < 0 ? shirtD : shirt, 0.28, 0.14);
        chHand(hX, hY, Math.atan2(hY - elY, hX - elX), skin, skinD);
    };

    const drawLeg = (hx, hy, kx, ky, ax, ay, shinAng, near) => {
        chLimb(hx, hy, kx, ky, 8.0, 5.6, skin, 0.32, 0.22);
        const mx = chLerp(hx, kx, 0.55), my = chLerp(hy, ky, 0.55);
        chLimb(hx, hy, mx, my, 10.0, 8.8, near ? shorts : shortsD, 0.30, 0.14);
        chLimb(kx, ky + 0.6, ax, ay - 1.0, 5.2, 3.8, sock, 0.28, 0.20);
        chBootBack(ax, ay, shinAng, team.secondary);
    };

    drawArm(-1, isRunning ? strideWave * 0.95 : (-0.75 * windup + 0.65 * strikeSnap + 0.35 * follow));

    const lHipX = -3.9, lHipY = -16.5;
    const lThighSwing = isRunning ? strideWave * 0.95 : (0.14 * windup - 0.08 * strikeSnap);
    const lKneeX = lHipX + Math.sin(lThighSwing) * 7.8;
    const lKneeY = lHipY + Math.cos(lThighSwing) * 7.8;
    const lKneeBend = isRunning ? Math.max(0.2, -strideWave * 1.2) : 0.22;
    const lAnkleX = lKneeX + Math.sin(lThighSwing - lKneeBend) * 7.6;
    const lAnkleY = Math.min(-1.8, lKneeY + Math.cos(lThighSwing - lKneeBend) * 7.6);
    drawLeg(lHipX, lHipY, lKneeX, lKneeY, lAnkleX, lAnkleY, lThighSwing - lKneeBend, false);

    const rHipX = 3.9, rHipY = -16.5;
    const rThighAngle = isRunning ? (-strideWave * 1.0) : (-1.05 * windup + 0.95 * strikeSnap + 1.1 * follow);
    const rKneeX = rHipX + Math.sin(rThighAngle) * 8.2;
    const rKneeY = rHipY + Math.cos(rThighAngle) * 8.2;
    const rShinAngle = isRunning ? (rThighAngle - Math.max(0.2, strideWave * 1.25)) : (rThighAngle - 1.4 * windup + 0.35 * strikeSnap + 0.5 * follow);
    const rAnkleX = rKneeX + Math.sin(rShinAngle) * 8.0;
    const rAnkleY = rKneeY + Math.cos(rShinAngle) * 8.0;
    drawLeg(rHipX, rHipY, rKneeX, rKneeY, rAnkleX, rAnkleY, rShinAngle, true);

    ctx.save();
    ctx.translate(leanX * 0.4, -16.2);
    ctx.rotate(hipAngle * 0.45);
    const sg = ctx.createLinearGradient(-8, 0, 8, 0);
    sg.addColorStop(0, shortsD); sg.addColorStop(0.5, shortsL); sg.addColorStop(1, shortsD);
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.roundRect(-8.2, -3.0, 16.4, 8.2, 2.8);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(leanX, -24.5);
    ctx.rotate(hipAngle + bodyLeanForward * 0.45);
    const tg = ctx.createLinearGradient(-9.4, 0, 9.4, 0);
    tg.addColorStop(0, shirtD); tg.addColorStop(0.22, shirt); tg.addColorStop(0.5, shirtL); tg.addColorStop(0.8, shirt); tg.addColorStop(1, shirtD);
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.moveTo(-11.0, -7.4);
    ctx.quadraticCurveTo(0, -11.4, 11.0, -7.4);
    ctx.lineTo(6.9, 7.6);
    ctx.quadraticCurveTo(0, 9.0, -6.9, 7.6);
    ctx.closePath();
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.fillStyle = team.number;
    ctx.font = '700 3.3px "Chakra Petch", sans-serif';
    ctx.fillText(String(team.short || team.name || '').toUpperCase().slice(0, 5), 0, -3.2);
    ctx.font = '800 10.6px "Chakra Petch", sans-serif';
    ctx.fillText(String(shooter.num), 0, 5.6);
    ctx.restore();

    const headY = -40.5 + bodyLeanForward * 3.5;
    const headX = bodyLeanForward * 4.5 + leanX * 0.3;
    chLimb(headX * 0.6, headY + 3.6, leanX * 0.8, -33.4, 5.4, 7.2, skinD, 0.22, 0.04);

    ctx.save();
    ctx.translate(headX, headY + 1.2);
    ctx.scale(0.8, 0.8);
    ctx.fillStyle = shooter.hair;
    ctx.beginPath();
    ctx.ellipse(0, -0.9, 5.5, 5.3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    drawArm(1, isRunning ? (-strideWave * 0.98) : (0.95 * windup - 0.55 * strikeSnap - 0.32 * follow));
    ctx.restore();
}

// ============================================================================
let BALL_GEO = null;
function getBallGeometry() {
    if (BALL_GEO) return BALL_GEO;
    const phi = (1 + Math.sqrt(5)) / 2;
    const raw = [[0, 1, phi], [0, -1, phi], [0, 1, -phi], [0, -1, -phi], [1, phi, 0], [-1, phi, 0],
        [1, -phi, 0], [-1, -phi, 0], [phi, 0, 1], [-phi, 0, 1], [phi, 0, -1], [-phi, 0, -1]];
    const norm = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const verts = raw.map(norm);
    const angR = 0.365;

    const pents = verts.map((v, i) => {
        const nb = [];
        verts.forEach((w, j) => { if (j !== i && dot(v, w) > 0.4) nb.push(j); });
        const tangent = (j) => {
            const d = dot(v, verts[j]);
            return norm([verts[j][0] - v[0] * d, verts[j][1] - v[1] * d, verts[j][2] - v[2] * d]);
        };
        const e1 = tangent(nb[0]);
        const e2 = cross(v, e1);
        nb.sort((a, b) => {
            const ta = tangent(a), tb = tangent(b);
            return Math.atan2(dot(ta, e2), dot(ta, e1)) - Math.atan2(dot(tb, e2), dot(tb, e1));
        });
        const corners = {};
        nb.forEach(j => {
            const t = tangent(j);
            corners[j] = [
                v[0] * Math.cos(angR) + t[0] * Math.sin(angR),
                v[1] * Math.cos(angR) + t[1] * Math.sin(angR),
                v[2] * Math.cos(angR) + t[2] * Math.sin(angR)
            ];
        });
        return { c: v, order: nb, corners };
    });

    const seams = [];
    for (let i = 0; i < 12; i++) {
        pents[i].order.forEach(j => {
            if (j > i) seams.push([pents[i].corners[j], pents[j].corners[i]]);
        });
    }
    BALL_GEO = { pents, seams };
    return BALL_GEO;
}

function drawBall3D() {
    if (!ctx) return;

    const tl = ball.trail.length;
    if (tl > 1) {
        ctx.save();
        ctx.lineCap = 'round';
        for (let idx = 1; idx < tl; idx++) {
            const a = ball.trail[idx - 1], b = ball.trail[idx];
            const pa = toScreen(a.x, a.y, a.z), pb = toScreen(b.x, b.y, b.z);
            const t = idx / tl;
            ctx.strokeStyle = `rgba(255,255,255,${Math.max(0, b.alpha) * 0.22 * t})`;
            ctx.lineWidth = Math.max(1.2, 9 * pb.scale * t);
            ctx.beginPath();
            ctx.moveTo(pa.x, pa.y);
            ctx.lineTo(pb.x, pb.y);
            ctx.stroke();
        }
        ctx.restore();
    }

    const pos = toScreen(ball.x, ball.y, ball.z);
    const r = Math.max(5.5, 5.9 * pos.scale);

    const h = Math.max(0, ball.z);
    const lift = Math.min(1, h / 110);
    chGroundShadow(pos.x + h * 0.10 * pos.scale, pos.groundY + 1, r * (1.45 + lift * 0.7), r * (0.55 + lift * 0.2), 0.52 * (1 - lift * 0.55));

    const ax = ball.spin, ay = ball.spin * 0.37 + 0.6, az = ball.spin * 0.21;
    const cx = Math.cos(ax), sx = Math.sin(ax), cy = Math.cos(ay), sy = Math.sin(ay), cz = Math.cos(az), sz = Math.sin(az);
    const rot = (v) => {
        let x = v[0], y = v[1] * cx - v[2] * sx, z = v[1] * sx + v[2] * cx;
        const x2 = x * cy + z * sy, z2 = -x * sy + z * cy;
        return [x2 * cz - y * sz, x2 * sz + y * cz, z2];
    };
    const slerp = (a, b, t) => {
        const d = Math.max(-1, Math.min(1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2]));
        const om = Math.acos(d), so = Math.sin(om) || 1;
        const w1 = Math.sin((1 - t) * om) / so, w2 = Math.sin(t * om) / so;
        return [a[0] * w1 + b[0] * w2, a[1] * w1 + b[1] * w2, a[2] * w1 + b[2] * w2];
    };
    const geo = getBallGeometry();

    ctx.save();
    ctx.translate(pos.x, pos.y);

    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.save();
    ctx.clip();

    const base = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
    base.addColorStop(0, '#ffffff');
    base.addColorStop(1, '#d9dde3');
    ctx.fillStyle = base;
    ctx.fillRect(-r, -r, r * 2, r * 2);

    ctx.fillStyle = '#12151c';
    geo.pents.forEach(p => {
        const c = rot(p.c);
        if (c[2] < -0.45) return;
        const pts = [];
        const ring = p.order.map(j => rot(p.corners[j]));
        for (let k = 0; k < ring.length; k++) {
            const a = ring[k], b = ring[(k + 1) % ring.length];
            for (let s2 = 0; s2 < 3; s2++) {
                const q = slerp(a, b, s2 / 3);
                let qx = q[0], qy = q[1];
                if (q[2] < 0) { const l = Math.hypot(qx, qy) || 1; qx /= l; qy /= l; }
                pts.push([qx * r, qy * r]);
            }
        }
        ctx.beginPath();
        pts.forEach((q, i) => { if (i === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]); });
        ctx.closePath();
        ctx.fill();
    });

    ctx.strokeStyle = 'rgba(40,48,60,0.55)';
    ctx.lineWidth = Math.max(0.5, r * 0.07);
    ctx.lineCap = 'round';
    geo.seams.forEach(([A, B]) => {
        ctx.beginPath();
        let pen = false;
        for (let k = 0; k <= 8; k++) {
            const q = rot(slerp(A, B, k / 8));
            if (q[2] > 0) {
                if (!pen) { ctx.moveTo(q[0] * r, q[1] * r); pen = true; } else ctx.lineTo(q[0] * r, q[1] * r);
            } else pen = false;
        }
        ctx.stroke();
    });

    const shade = ctx.createRadialGradient(-r * 0.38, -r * 0.42, r * 0.05, -r * 0.1, -r * 0.1, r * 1.25);
    shade.addColorStop(0, 'rgba(255,255,255,0.50)');
    shade.addColorStop(0.35, 'rgba(255,255,255,0.08)');
    shade.addColorStop(0.7, 'rgba(0,0,0,0.12)');
    shade.addColorStop(1, 'rgba(0,0,0,0.58)');
    ctx.fillStyle = shade;
    ctx.fillRect(-r, -r, r * 2, r * 2);

    const bounce = ctx.createRadialGradient(r * 0.15, r * 1.05, 0, r * 0.15, r * 1.05, r * 0.85);
    bounce.addColorStop(0, 'rgba(70,160,70,0.30)');
    bounce.addColorStop(1, 'rgba(70,160,70,0)');
    ctx.fillStyle = bounce;
    ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.restore();

    ctx.save();
    ctx.translate(-r * 0.36, -r * 0.44);
    ctx.rotate(-0.6);
    const sp = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.3);
    sp.addColorStop(0, 'rgba(255,255,255,0.9)');
    sp.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.scale(1, 0.62);
    ctx.fillStyle = sp;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = 'rgba(15,23,42,0.45)';
    ctx.lineWidth = Math.max(0.6, r * 0.07);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
}

function drawConfetti() {
    if (!ctx) return;
    STATE.confetti.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.6);
        ctx.restore();
    });
}

function renderScene() {
    if (!ctx) return;
    if (!STATE.width || !STATE.height) resizeCanvas();

    ctx.save();
    if (STATE.cameraShake > 0) {
        ctx.translate((Math.random() - 0.5) * STATE.cameraShake, (Math.random() - 0.5) * STATE.cameraShake);
    }

    drawStadiumAndPitch();

    const drawables = [
        { type: 'KEEPER', y: keeper.y },
        { type: 'GOAL', y: SCENE.goalY + 2 },
        { type: 'SHOOTER', y: shooter.y },
        { type: 'BALL', y: ball.y }
    ].sort((a, b) => a.y - b.y);

    drawables.forEach(d => {
        if (d.type === 'KEEPER') drawGoalkeeper();
        else if (d.type === 'GOAL') drawGoal3D();
        else if (d.type === 'SHOOTER') drawShooter();
        else if (d.type === 'BALL') drawBall3D();
    });

    drawConfetti();
    ctx.restore();
    try { p3dRender(); } catch (e) { console.error(e); p3dOff(); }
}

let lastTime = performance.now();

function loop(now) {
    const currentNow = typeof now === 'number' ? now : performance.now();
    const rawDt = Math.max(0, (currentNow - lastTime) / 1000);
    lastTime = currentNow;

    try {
