<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar animé · suivi facial</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/+esm",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.min.js"
      }
    }
  </script>
  <script src="./face-avatar-rig.js"></script>
  <script src="./body-avatar-rig.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="stage" aria-label="Prévisualisation de l’avatar animé">
    <canvas id="scene"></canvas>
    <video id="webcam" autoplay muted playsinline></video>
    <button id="toggle-controls" class="panel-toggle" type="button" aria-controls="avatar-controls" aria-expanded="false" hidden>Options</button>

    <section id="avatar-controls" class="toolbar" aria-label="Commandes de l’avatar">
      <p id="status" role="status">Chargement du suivi facial…</p>
      <div class="buttons">
        <button id="start-camera" type="button" disabled>Activer la caméra</button>
        <button id="choose-avatar" type="button">Choisir un modèle 3D</button>
        <button id="load-luffy" type="button" disabled>Charger Luffy</button>
        <button id="toggle-background" type="button" aria-pressed="false">Fond transparent</button>
      </div>
      <input id="avatar-file" type="file" accept=".glb,.vrm,model/gltf-binary,model/vrm" hidden>
      <small>Le cadrage conserve la tête et le haut des épaules. Garde ton visage visible à la caméra.</small>
    </section>
  </main>
</body>
</html>
