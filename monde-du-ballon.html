        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, groundY, width, height - groundY);

        // Clôture en bois
        const fenceY = groundY + height * 0.012;
        const postH = height * 0.05;
        ctx.save();
        ctx.lineCap = 'butt';
        [0.78, 0.35].forEach(level => {
          const railY = fenceY - postH * level;
          ctx.strokeStyle = '#6b4f30';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(0, railY + 2.5); ctx.lineTo(width, railY + 2.5); ctx.stroke();
          ctx.strokeStyle = '#b08a5a';
          ctx.beginPath(); ctx.moveTo(0, railY); ctx.lineTo(width, railY); ctx.stroke();
        });
        const postStep = Math.max(60, width * 0.07);
        for (let px = width * 0.02; px < width; px += postStep) {
          ctx.fillStyle = '#9b7649';
          ctx.fillRect(px - 3, fenceY - postH, 6, postH + 4);
          ctx.fillStyle = '#7a5c38';
          ctx.fillRect(px + 1, fenceY - postH, 2, postH + 4);
          ctx.fillStyle = '#b08a5a';
          ctx.fillRect(px - 3.5, fenceY - postH - 1.5, 7, 2.5);
        }
        ctx.restore();

        // Herbes et fleurs ondulant au vent (plus grandes au premier plan)
        ctx.save();
        ctx.lineCap = 'round';
        dayBladeGroups.forEach((group, shade) => {
          ctx.strokeStyle = dayBladeColors[shade];
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          group.forEach(blade => {
            const bx = blade.x * width;
            const by = groundY + blade.t * (height - groundY);
            const scale = 0.45 + blade.t * 1.15;
            const bladeH = blade.h * scale;
            const sway = Math.sin(timestamp * 0.002 + blade.phase + blade.x * 6) * 3 * scale + wind * 2 * scale;
            ctx.moveTo(bx, by);
            ctx.quadraticCurveTo(bx + sway * 0.4, by - bladeH * 0.6, bx + sway, by - bladeH);
          });
          ctx.stroke();
        });
        dayFlowers.forEach(flower => {
          const fx = flower.x * width;
          const fy = groundY + flower.t * (height - groundY);
          const scale = (0.45 + flower.t * 1.15) * flower.size;
          const stem = 14 * scale;
          const sway = Math.sin(timestamp * 0.002 + flower.phase + flower.x * 6) * 3 * scale + wind * 2 * scale;
          ctx.strokeStyle = '#3e6d2b';
          ctx.lineWidth = 1.3;
          ctx.beginPath();
          ctx.moveTo(fx, fy);
          ctx.quadraticCurveTo(fx + sway * 0.4, fy - stem * 0.6, fx + sway, fy - stem);
          ctx.stroke();
          ctx.fillStyle = dayFlowerColors[flower.color];
          ctx.beginPath();
          ctx.arc(fx + sway, fy - stem, 2.6 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#e8a80f';
          ctx.beginPath();
          ctx.arc(fx + sway, fy - stem, 1 * scale, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();

        // Vignettage léger pour l'effet photographique
        if (!hasCustomBackground) {
          const vignette = ctx.createRadialGradient(width / 2, height / 2, Math.min(width, height) * 0.5, width / 2, height / 2, Math.hypot(width, height) * 0.55);
          vignette.addColorStop(0, 'rgba(10, 25, 40, 0)');
          vignette.addColorStop(1, 'rgba(10, 25, 40, 0.28)');
          ctx.fillStyle = vignette;
          ctx.fillRect(0, 0, width, height);
        }
      }

      function drawRealisticBalloon(balloon, px, py, radiusX, radiusY, timestamp) {
        const pal = balloon.palette;
        const rx = radiusX;
        const ry = radiusY;
        const maxR = Math.max(rx, ry);
        // Côté de la lumière principale : soleil à droite (partie 1), lune à gauche (partie 2)
        const lx = side === 1 ? 1 : -1;
        const tilt = balloon.tilt;

        ctx.save();
        ctx.translate(px, py);

        // 1. Ficelle accrochée au nœud (suit l'inclinaison), qui ondule avec le vent
        const knotDistance = ry + 10;
        const knotX = -Math.sin(tilt) * knotDistance;
        const knotY = Math.cos(tilt) * knotDistance;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        [[1.2, 2.4, 'rgba(0, 0, 0, 0.16)'], [0, 1.3, 'rgba(255, 250, 235, 0.74)']].forEach(([offset, lineWidth, color]) => {
          ctx.strokeStyle = color;
          ctx.lineWidth = lineWidth;
          ctx.beginPath();
          ctx.moveTo(knotX + offset, knotY + offset);
          for (let i = 1; i < balloon.stringNodes.length; i++) {
            const node = balloon.stringNodes[i];
            ctx.lineTo(knotX + node.dx + offset, knotY + node.dy + offset);
          }
          ctx.stroke();
        });
        ctx.restore();

        ctx.rotate(tilt);

        // 2. Forme de ballon en latex : goutte arrondie qui se resserre vers le col
        const bodyPath = () => {
          ctx.beginPath();
          ctx.moveTo(0, -ry);
          ctx.bezierCurveTo(rx * 1.28, -ry, rx * 1.12, ry * 0.45, rx * 0.12, ry * 0.98);
          ctx.quadraticCurveTo(0, ry * 1.03, -rx * 0.12, ry * 0.98);
          ctx.bezierCurveTo(-rx * 1.12, ry * 0.45, -rx * 1.28, -ry, 0, -ry);
          ctx.closePath();
        };

        // 3. Corps : couleur du latex éclairée par la source principale
        bodyPath();
        const body = ctx.createRadialGradient(lx * rx * 0.32, -ry * 0.4, maxR * 0.05, 0, 0, maxR * 1.3);
        body.addColorStop(0, pal.light);
        body.addColorStop(0.28, pal.base);
        body.addColorStop(1, pal.dark);
        ctx.fillStyle = body;
        ctx.fill();

        // 4. Effets de matière, limités à l'intérieur du ballon
        ctx.save();
        bodyPath();
        ctx.clip();

        // Bords plus épais et plus saturés (le latex est plus dense sur les côtés)
        const edge = ctx.createRadialGradient(0, -ry * 0.1, maxR * 0.55, 0, -ry * 0.05, maxR * 1.18);
        edge.addColorStop(0, `rgba(${pal.darkRgb}, 0)`);
        edge.addColorStop(1, `rgba(${pal.darkRgb}, 0.55)`);
        ctx.fillStyle = edge;
        ctx.fillRect(-rx * 1.6, -ry * 1.2, rx * 3.2, ry * 2.5);

        // Lumière qui traverse le latex translucide côté ombre
        const bounce = ctx.createRadialGradient(-lx * rx * 0.82, ry * 0.22, 0, -lx * rx * 0.82, ry * 0.22, rx * 0.95);
        bounce.addColorStop(0, `rgba(${pal.lightRgb}, 0.42)`);
        bounce.addColorStop(1, `rgba(${pal.lightRgb}, 0)`);
        ctx.fillStyle = bounce;
        ctx.fillRect(-rx * 1.6, -ry * 1.2, rx * 3.2, ry * 2.5);

        // Reflet de l'environnement en bas (herbe le jour, lampadaires la nuit)
        const groundBounce = ctx.createRadialGradient(0, ry * 0.98, 0, 0, ry * 0.98, rx * 1.15);
        groundBounce.addColorStop(0, side === 1 ? 'rgba(130, 195, 120, 0.24)' : 'rgba(255, 205, 130, 0.22)');
        groundBounce.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = groundBounce;
        ctx.fillRect(-rx * 1.6, -ry * 1.2, rx * 3.2, ry * 2.5);

        // Plis de tension du latex autour du col
        ctx.strokeStyle = `rgba(${pal.darkRgb}, 0.4)`;
        ctx.lineWidth = 0.9;
        ctx.lineCap = 'round';
        for (let k = -2; k <= 2; k++) {
          ctx.beginPath();
          ctx.moveTo(k * rx * 0.05, ry * 1.0);
          ctx.quadraticCurveTo(k * rx * 0.12, ry * 0.9, k * rx * 0.19, ry * 0.76);
          ctx.stroke();
        }

        // Fin liseré lumineux (effet Fresnel)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 2.6;
        bodyPath();
        ctx.stroke();
        ctx.restore();

        // 5. Reflets spéculaires
        ctx.save();
        ctx.rotate(lx * 0.38);
        const windowShine = ctx.createLinearGradient(0, -ry * 0.75, 0, -ry * 0.1);
        windowShine.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
        windowShine.addColorStop(1, 'rgba(255, 255, 255, 0.04)');
        ctx.fillStyle = windowShine;
        ctx.beginPath();
        ctx.ellipse(lx * rx * 0.30, -ry * 0.44, rx * 0.16, ry * 0.32, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Longue traînée de lumière le long de la courbure
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.34)';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        if (lx === 1) ctx.ellipse(0, -ry * 0.05, rx * 0.88, ry * 0.9, 0, -1.2, -0.6);
        else ctx.ellipse(0, -ry * 0.05, rx * 0.88, ry * 0.9, 0, Math.PI + 0.6, Math.PI + 1.2);
        ctx.stroke();

        // Point de lumière très net
        ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
        ctx.beginPath();
        ctx.ellipse(lx * rx * 0.50, -ry * 0.52, rx * 0.05, ry * 0.075, lx * 0.5, 0, Math.PI * 2);
        ctx.fill();

        // Reflet secondaire discret côté ombre (lumière du ciel)
        ctx.fillStyle = 'rgba(235, 245, 255, 0.22)';
        ctx.beginPath();
        ctx.ellipse(-lx * rx * 0.4, ry * 0.42, rx * 0.12, ry * 0.06, -lx * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 6. Col, collerette et nœud du ballon
        const neck = ctx.createLinearGradient(-5, 0, 5, 0);
        neck.addColorStop(0, pal.dark);
        neck.addColorStop(0.5, pal.base);
        neck.addColorStop(1, pal.dark);
        ctx.fillStyle = neck;
        ctx.beginPath();
        ctx.moveTo(-3.6, ry - 3);
        ctx.quadraticCurveTo(-2.4, ry + 1, -3.2, ry + 6);
        ctx.lineTo(3.2, ry + 6);
        ctx.quadraticCurveTo(2.4, ry + 1, 3.6, ry - 3);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = pal.dark;
        ctx.beginPath();
        ctx.ellipse(0, ry + 6, 5.4, 2.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = pal.base;
        ctx.beginPath();
        ctx.ellipse(0, ry + 5.6, 4.3, 1.5, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = pal.dark;
        ctx.beginPath();
        ctx.ellipse(0, ry + 8.6, 3.3, 2.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(${pal.lightRgb}, 0.75)`;
        ctx.beginPath();
        ctx.ellipse(lx * 0.9, ry + 8, 1.3, 1, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawProjectilesAndParticles(width, height, timestamp, elapsed) {
        // 1. Ondes de choc
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          const age = Math.max(0, (timestamp - sw.born) / 1000);
          if (age >= 0.42) {
            shockwaves.splice(i, 1);
            continue;
          }
          const t = Math.min(1, age / 0.42);
          const ease = 1 - Math.pow(1 - t, 3);
          const r = Math.max(0.1, sw.radius + (sw.maxRadius - sw.radius) * ease);
          ctx.save();
          ctx.strokeStyle = sw.color;
          ctx.globalAlpha = Math.max(0, (1 - t) * sw.alpha);
          ctx.lineWidth = Math.max(0.1, 3.5 * (1 - t));
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // 2. Lambeaux de latex tombant avec gravité et traînée
        for (let i = latexShards.length - 1; i >= 0; i--) {
          const s = latexShards[i];
          s.life += elapsed;
          if (s.life >= s.maxLife) {
            latexShards.splice(i, 1);
            continue;
          }
          s.vy += 420 * elapsed; // Gravité
          s.vx *= Math.pow(0.18, elapsed); // Résistance de l'air du caoutchouc léger
          s.x += s.vx * elapsed;
          s.y += s.vy * elapsed;
          s.rot += s.vRot * elapsed;
          const alpha = 1 - Math.pow(s.life / s.maxLife, 2);

          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.rotate(s.rot);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = s.color;
          ctx.beginPath();
          ctx.ellipse(0, 0, s.w * 0.5, s.h * 0.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 3. Étincelles dorées
        for (let i = sparkles.length - 1; i >= 0; i--) {
          const sp = sparkles[i];
          sp.life += elapsed;
          if (sp.life >= sp.maxLife) {
            sparkles.splice(i, 1);
            continue;
          }
          sp.vy += 190 * elapsed;
          sp.vx *= Math.pow(0.35, elapsed);
          sp.x += sp.vx * elapsed;
          sp.y += sp.vy * elapsed;
          const alpha = Math.max(0, 1 - sp.life / sp.maxLife);
          const radius = Math.max(0.1, sp.size * (0.4 + 0.6 * alpha));

          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.fillStyle = sp.color;
          ctx.shadowColor = '#ffd54f';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 4. Projectiles des joueurs avec traînée lumineuse
        shotEffects = shotEffects.filter(effect => timestamp - effect.startedAt < 1350);
        shotEffects.forEach(effect => {
          const age = Math.max(0, timestamp - effect.startedAt);
          const target = balloonPixels({ x: effect.x, y: effect.y }, width, height);
          const travelDuration = 260;

          if (age < travelDuration) {
            const travel = age / travelDuration;
            const eased = 1 - Math.pow(1 - travel, 2.2);
            const startX = width * 0.5;
            const startY = height * 0.92;
            const x = startX + (target.x - startX) * eased;
            const y = startY + (target.y - startY) * eased;

            ctx.save();
            // Traînée aérodynamique dégradée
            const tailX = startX + (target.x - startX) * Math.max(0, eased - 0.25);
            const tailY = startY + (target.y - startY) * Math.max(0, eased - 0.25);
            const trailGrad = ctx.createLinearGradient(tailX, tailY, x, y);
            trailGrad.addColorStop(0, 'rgba(255, 238, 150, 0)');
            trailGrad.addColorStop(1, 'rgba(255, 245, 190, 0.85)');
            ctx.strokeStyle = trailGrad;
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(tailX, tailY);
            ctx.lineTo(x, y);
            ctx.stroke();

            // Noyau du projectile
            ctx.fillStyle = '#fff5b8';
            ctx.shadowColor = '#ffdf6b';
            ctx.shadowBlur = 16;
            ctx.beginPath();
            ctx.arc(x, y, 9.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#3d280e';
            ctx.font = 'bold 8.5px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(String(effect.username || '??').slice(0, 2).toUpperCase(), x, y);
            ctx.restore();
          } else if (!effect.rewardShown) {
            effect.rewardShown = true;
            const pal = effect.palette || LATEX_PALETTES[effect.shotId % LATEX_PALETTES.length];
            spawnBalloonDestruction(target.x, target.y, pal, effect.earnedStars);
            SoundEngine.playBalloonPop(effect.earnedStars);
            showBalloonReward(effect);
          }
        });
      }

      /* ============================================================================
         7. BOUCLE D'ANIMATION PHYSIQUE (60 FPS)
         ============================================================================ */
      function animateScene(timestamp) {
        const elapsed = lastFrameAt ? Math.min((timestamp - lastFrameAt) / 1000, 0.05) : 0.016;
        lastFrameAt = timestamp;

        const width = scene.clientWidth;
        const height = scene.clientHeight;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        const canvasW = Math.round(width * ratio);
        const canvasH = Math.round(height * ratio);
        if (worldCanvas.width !== canvasW || worldCanvas.height !== canvasH) {
          worldCanvas.width = canvasW;
          worldCanvas.height = canvasH;
        }

        // Rafale de vent globale douce évoluant dans le temps
        const windGust = Math.sin(timestamp * 0.0007) * 4.5 + Math.cos(timestamp * 0.0016) * 2.2;

        const visibleCount = Math.min(balloons.length, MAX_VISIBLE_BALLOONS);

        // Physique des ballons : descente, vent, collisions élastiques douces, pendule et ficelle
        for (let i = 0; i < visibleCount; i++) {
          const b = balloons[i];
          const prevX = b.x;

          // Mouvement vertical et horizontal
          b.y += b.speed * elapsed * 0.24;
          const targetDrift = Math.sin(timestamp / 1000 + b.phase) * b.drift * 0.18 + windGust * 0.08;
          b.vx += (targetDrift - b.vx) * Math.min(1, elapsed * 4);
          b.x += b.vx * elapsed;

          // Répulsion élastique douce entre ballons voisins pour éviter qu'ils se traversent
          for (let j = i + 1; j < visibleCount; j++) {
            const other = balloons[j];
            const dx = b.x - other.x;
            const dy = b.y - other.y;
            const dist = Math.hypot(dx, dy);
            const minDist = 8.5; // Rayon d'interaction en % de l'arène
            if (dist > 0.01 && dist < minDist) {
              const push = (minDist - dist) * 14 * elapsed;
              const nx = dx / dist;
              const ny = dy / dist;
              b.x += nx * push;
              b.y += ny * push * 0.5;
              other.x -= nx * push;
              other.y -= ny * push * 0.5;
            }
          }

          // Maintien dans les limites horizontales
          if (b.x < 3.5) { b.x = 3.5; b.vx = Math.abs(b.vx) * 0.6; }
          if (b.x > 96.5) { b.x = 96.5; b.vx = -Math.abs(b.vx) * 0.6; }

          // Réapparition en haut si sorti en bas
          if (b.y > 105) {
            b.y = -8 - Math.random() * 16;
            b.x = 4 + Math.random() * 92;
            b.vx = 0;
          }

          // Pendule amorti pour l'inclinaison du ballon selon son déplacement latéral
          const lateralSpeed = (b.x - prevX) / Math.max(0.001, elapsed);
          const targetTilt = Math.max(-0.34, Math.min(0.34, -lateralSpeed * 0.018));
          b.angularVel += (targetTilt - b.tilt) * 18 * elapsed;
          b.angularVel *= Math.pow(0.08, elapsed);
          b.tilt += b.angularVel * elapsed;

          // Simulation de la ficelle souple (chaîne de segments réagissant au vent)
          let prevNodeX = 0;
          for (let s = 1; s < b.stringNodes.length; s++) {
            const node = b.stringNodes[s];
            const wave = Math.sin(timestamp * 0.004 + b.phase + s * 0.85) * (1.4 + s * 0.55) + windGust * 0.25 * s;
            node.dx += (prevNodeX + wave - node.dx) * Math.min(1, elapsed * 9);
            prevNodeX = node.dx;
          }
        }

        if (isRoomOwner && timestamp - lastGameSync >= 500) {
          synchronizeGameState();
        }

        // Rendu global sur le canvas unique
        ctx.save();
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

        // Tremblement de caméra subtil lors des gros gains
        if (cameraShake > 0.1) {
          const sx = (Math.random() - 0.5) * cameraShake;
          const sy = (Math.random() - 0.5) * cameraShake;
          ctx.translate(sx, sy);
          cameraShake *= Math.pow(0.04, elapsed);
        } else {
          cameraShake = 0;
        }

        ctx.clearRect(-20, -20, width + 40, height + 40);

        // Couche 1 : Décor fête foraine
        drawFairgroundEnvironment(width, height, timestamp);

        // Couche 2 : Ballons en latex 3D
        const radiusX = Math.max(21, Math.min(35, width * 0.027));
        const radiusY = radiusX * 1.22;
        for (let i = 0; i < visibleCount; i++) {
          const b = balloons[i];
          const pt = balloonPixels(b, width, height);
          const pulse = 1 + Math.sin(timestamp * 0.003 + b.phase) * 0.018;
          drawRealisticBalloon(b, pt.x, pt.y, radiusX * b.scalePulse * pulse, radiusY * b.scalePulse / pulse, timestamp);
        }

        // Couche 3 : Projectiles, ondes de choc et particules physiques
        drawProjectilesAndParticles(width, height, timestamp, elapsed);

        ctx.restore();
        requestAnimationFrame(animateScene);
      }

      /* ============================================================================
         8. INTERACTIONS SOURIS / TACTILE DIRECTES SUR LE CANVAS
         ============================================================================ */
      worldCanvas.addEventListener('pointerdown', event => {
        const rect = worldCanvas.getBoundingClientRect();
        const clickX = event.clientX - rect.left;
        const clickY = event.clientY - rect.top;
        const width = rect.width;
        const height = rect.height;
        const hitRadius = Math.max(28, Math.min(44, width * 0.036));

        const visibleCount = Math.min(balloons.length, MAX_VISIBLE_BALLOONS);
        let closestId = null;
        let closestDist = hitRadius;

        // Recherche du ballon le plus proche du clic / toucher (en partant du premier plan)
        for (let i = visibleCount - 1; i >= 0; i--) {
          const b = balloons[i];
          const pt = balloonPixels(b, width, height);
          const d = Math.hypot(pt.x - clickX, pt.y - clickY);
          if (d <= closestDist) {
            closestDist = d;
            closestId = b.id;
          }
        }

        if (closestId !== null) {
          shootBalloon(closestId);
        }
      });

      /* ============================================================================
         9. MÉCANIQUES DE TIR, CADEAUX ET INTERFACE
         ============================================================================ */
      function storeAvatar(username, avatarDataUri) {
        if (typeof avatarDataUri !== 'string' ||
            !/^(?:https:\/\/|\/api\/tiktok-avatars\/[a-z0-9_-]{1,128}|data:image\/(?:png|jpeg|webp|gif);base64,)/i.test(avatarDataUri) ||
            avatarDataUri.length > 350000) return;
        const playerKey = `user:${String(username || '').trim().replace(/^@/, '').toLocaleLowerCase('fr-FR')}`;
        if (playerKey !== 'user:') avatars.set(playerKey, avatarDataUri);
      }

      function formatNumber(value, maximumFractionDigits = 0) {
        return Number(value).toLocaleString('fr-FR', { maximumFractionDigits });
      }

      function showWalletBanner(player) {
        if (!player || typeof player !== 'object') return;
        const username = String(player.username || player.uniqueId || '').trim().replace(/^@/, '').slice(0, 32);
        const stars = Number(player.stars);
        if (!username || !Number.isSafeInteger(stars) || stars < 0) return;
        const banner = $('walletBanner');
        const avatar = $('walletBannerAvatar');
        const fallback = $('walletBannerAvatarFallback');
        const avatarUrl = typeof player.avatarUrl === 'string' &&
          (/^https:\/\//i.test(player.avatarUrl) || /^\/api\/tiktok-avatars\/[a-z0-9_-]{1,128}$/i.test(player.avatarUrl))
          ? player.avatarUrl
          : '';
        $('walletBannerUsername').textContent = `@${username}`;
        $('walletBannerStars').textContent =
          `${formatNumber(stars)} étoile${stars === 1 ? '' : 's'}`;
        fallback.textContent = username.slice(0, 2).toUpperCase();
        fallback.hidden = Boolean(avatarUrl);
        avatar.hidden = !avatarUrl;
        avatar.onerror = () => {
          avatar.hidden = true;
          fallback.hidden = false;
          avatar.removeAttribute('src');
        };
        if (avatarUrl) avatar.src = avatarUrl;
        banner.hidden = false;
        window.clearTimeout(walletBannerTimer);
        walletBannerTimer = window.setTimeout(() => {
          banner.hidden = true;
          walletBannerTimer = 0;
        }, 7000);
      }

      function showNextShotResultBanner() {
        if (shotResultBannerTimer || shotResultQueue.length === 0) return;
        const result = shotResultQueue.shift();
        const banner = $('shotResultBanner');
        const avatar = $('shotResultAvatar');
        const fallback = $('shotResultAvatarFallback');
        const avatarUrl = avatars.get(playerKeyFor(result.username)) || '';
        const hasAvatar = /^(?:https:\/\/|\/api\/tiktok-avatars\/[a-z0-9_-]{1,128}|data:image\/(?:png|jpeg|webp|gif);base64,)/i.test(avatarUrl);

        $('shotResultSide').textContent = side === 1 ? 'Écran gauche' : 'Écran droit';
        $('shotResultUsername').textContent = `@${result.username}`;
        $('shotResultStars').textContent =
          `${formatNumber(result.stars)} étoile${result.stars === 1 ? '' : 's'}`;
        fallback.textContent = result.username.slice(0, 2).toUpperCase();
        fallback.hidden = hasAvatar;
        avatar.hidden = !hasAvatar;
        avatar.onerror = () => {
          avatar.hidden = true;
          fallback.hidden = false;
          avatar.removeAttribute('src');
        };
        if (hasAvatar) avatar.src = avatarUrl;
        else avatar.removeAttribute('src');

        banner.hidden = false;
        shotResultBannerTimer = window.setTimeout(() => {
          banner.hidden = true;
          shotResultBannerTimer = 0;
          showNextShotResultBanner();
        }, 6000);
      }

      function finishPlayerTurnIfReady(username) {
        const playerKey = playerKeyFor(username);
        const result = turnStarsByPlayer[playerKey];
        if (!result || pendingGifts.some(gift => playerKeyFor(gift.username) === playerKey)) return;
        delete turnStarsByPlayer[playerKey];
        shotResultQueue.push(result);
        showNextShotResultBanner();
      }

      function renderPoolEditor() {
        const list = $('prizeList');
        list.replaceChildren();
        poolConfig.forEach((row, index) => {
          const item = document.createElement('div');
          item.className = 'prize-row';
          item.dataset.prizeIndex = String(index);
          const starsLabel = document.createElement('label');
          starsLabel.textContent = 'Étoiles dans le ballon';
          const starsInput = document.createElement('input');
          starsInput.type = 'number';
          starsInput.min = '0';
          starsInput.max = '100000';
          starsInput.value = String(row.stars);
          starsInput.dataset.prizeField = 'stars';
          starsInput.disabled = !isRoomOwner;
          starsInput.addEventListener('input', () => { poolConfig[index].stars = Number(starsInput.value); });
          starsLabel.append(starsInput);

          const countLabel = document.createElement('label');
          countLabel.textContent = 'Nombre de ballons';
          const countInput = document.createElement('input');
          countInput.type = 'number';
          countInput.min = '0';
          countInput.max = String(MAX_POOL_SIZE);
          countInput.value = String(row.count);
          countInput.dataset.prizeField = 'count';
          countInput.disabled = !isRoomOwner;
          countInput.addEventListener('input', () => {
            poolConfig[index].count = Number(countInput.value);
            $('poolEditorTotal').textContent =
              `${formatNumber(poolConfig.reduce((sum, prize) => sum + (Number.isFinite(prize.count) ? prize.count : 0), 0))} ballons · ${poolConfig.length} lots`;
          });
          countLabel.append(countInput);

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'prize-remove';
          remove.textContent = '×';
          remove.title = `Retirer le lot de ${row.stars} étoiles`;
          remove.disabled = !isRoomOwner;
          remove.addEventListener('click', () => {
            poolConfig.splice(index, 1);
            renderPoolEditor();
          });
          item.append(starsLabel, countLabel, remove);
          const left = document.createElement('span');
          left.className = 'prize-left';
          item.append(left);
          list.append(item);
        });
        updatePrizeRemaining();
        $('addPrizeButton').disabled = !isRoomOwner || poolConfig.length >= 200;
        $('savePoolButton').disabled = !isRoomOwner;
      }

      function readPrizeEditor() {
        return [...$('prizeList').querySelectorAll('.prize-row')].map((row, index) => ({
          id: poolConfig[index]?.id || `prize-${index + 1}`,
          stars: Number(row.querySelector('[data-prize-field="stars"]').value),
          count: Number(row.querySelector('[data-prize-field="count"]').value)
        }));
      }

      function savePrizeEditor() {
        if (!isRoomOwner) return;
        const cleaned = cleanPoolConfig(readPrizeEditor());
        if (!cleaned) {
          $('poolEditorStatus').textContent =
            'Vérifie les étoiles et quantités : il faut au moins un ballon et un maximum de 100 000.';
          return;
        }
        poolConfig = cleaned;
        startNewPool();
        balloons = [];
        pendingGifts = [];
        pendingShots = 0;
        fillBalloonField(true);
        renderMetrics();
        saveState();
        synchronizeGameState(true);
        $('poolEditorStatus').textContent =
          `Nouveau bassin enregistré : ${formatNumber(pool.length)} ballons. Les tirs en attente ont été annulés.`;
      }

      function updatePrizeRemaining() {
        const rows = $('prizeList').querySelectorAll('.prize-row');
        if (!rows.length || rows.length !== poolConfig.length) return;
        const left = new Map();
        for (let index = poolIndex; index < pool.length; index++) left.set(pool[index], (left.get(pool[index]) || 0) + 1);
        for (const balloon of balloons) left.set(balloon.reward, (left.get(balloon.reward) || 0) + 1);
        let exhausted = 0;
        rows.forEach((node, index) => {
          const row = poolConfig[index];
          const available = left.get(row.stars) || 0;
          const remaining = Math.min(row.count, available);
          left.set(row.stars, available - remaining);
          node.querySelector('.prize-left').textContent = `Restants : ${formatNumber(remaining)} / ${formatNumber(row.count)}`;
          const done = remaining === 0 && row.count > 0 && poolIndex > 0;
          node.classList.toggle('prize-done', done);
          if (done) exhausted++;
        });
        const hint = exhausted ? ` · ${exhausted} lot${exhausted > 1 ? 's' : ''} épuisé${exhausted > 1 ? 's' : ''}` : '';
        $('poolEditorTotal').textContent =
          `${formatNumber(pool.length - poolIndex + balloons.length)} ballons restants · ${poolConfig.length} lots${hint}`;
      }

      function renderMetrics() {
        $('starsTotal').textContent = formatNumber(totalStars);
        $('poppedTotal').textContent = formatNumber(totalPopped);
        $('shotsTotal').textContent = formatNumber(totalShots);
        $('poolRemaining').textContent = formatNumber(pool.length - poolIndex + balloons.length);
        updatePrizeRemaining();
        $('rtpValue').textContent = `${formatNumber(poolAverage, 2)} ⭐/tir`;
        const configuredPoolSize = poolConfig.reduce((sum, row) => sum + row.count, 0);
        const winningBalloonCount = poolConfig.reduce((sum, row) => sum + (row.stars > 0 ? row.count : 0), 0);
        const winningChance = configuredPoolSize ? winningBalloonCount / configuredPoolSize * 100 : 0;
        $('rtpDescription').textContent =
          `Chance de gagner un ballon récompensé : ${formatNumber(winningChance, 1)} %. RTP réel : ${formatNumber(poolAverage, 2)} étoile par tir sur un bassin complet.`;
        $('playerCount').textContent =
          `Joueurs connectés : ${roomPlayers}/${MAX_BALLOON_GAME_PLAYERS}`;
        const leaders = Object.values(players)
          .sort((first, second) => second.stars - first.stars)
          .slice(0, 5);
        const leaderboard = $('leaderboard');
        leaderboard.replaceChildren();
        if (!leaders.length) {
          const empty = document.createElement('li');
          empty.textContent = 'Les gains apparaîtront ici.';
          leaderboard.append(empty);
        } else {
          leaders.forEach(player => {
            const row = document.createElement('li');
            row.textContent = `${player.username} · ${formatNumber(player.stars)} ⭐`;
            leaderboard.append(row);
          });
        }
        $('setBalanceButton').disabled = !isRoomOwner;
      }

      function fireShot(username = 'Spectateur', selectedBalloonId = null, awardBatch = null) {
        const visibleCount = Math.min(balloons.length, MAX_VISIBLE_BALLOONS);
        if (!visibleCount) return false;
        const selectedIndex = selectedBalloonId === null
          ? -1
          : balloons.findIndex((balloon, index) => index < visibleCount && balloon.id === selectedBalloonId);
        const index = selectedIndex >= 0 ? selectedIndex : Math.floor(Math.random() * visibleCount);
        const [balloon] = balloons.splice(index, 1);
        const earnedStars = balloon.reward;
        const playerName = String(username || 'Spectateur').trim().replace(/^@/, '').slice(0, 32) || 'Spectateur';
        const playerKey = `user:${playerName.toLocaleLowerCase('fr-FR')}`;
        const player = players[playerKey] || (players[playerKey] = { username: playerName, stars: 0, shots: 0 });
        player.shots++;
        player.stars += earnedStars;
        totalStars += earnedStars;
        const turnResult = turnStarsByPlayer[playerKey] || { username: playerName, stars: 0 };
        turnResult.username = playerName;
        turnResult.stars += earnedStars;
        turnStarsByPlayer[playerKey] = turnResult;
        if (earnedStars > 0) {
          if (awardBatch) {
            const award = awardBatch.get(playerKey) || { username: playerName, amount: 0 };
            award.amount += earnedStars;
            awardBatch.set(playerKey, award);
          } else {
            awardGlobalStars(playerName, earnedStars);
          }
        }
        totalShots++;
        totalPopped++;

        SoundEngine.playShotLaunch();

        shotEffects.push({
          shotId: totalShots,
          username: playerName,
          x: balloon.x,
          y: balloon.y,
          earnedStars,
          color: balloon.palette.base,
          palette: balloon.palette,
          startedAt: performance.now()
        });
        if (shotEffects.length > MAX_VISIBLE_SHOT_EFFECTS) {
          shotEffects.splice(0, shotEffects.length - MAX_VISIBLE_SHOT_EFFECTS);
        }
        const exactStars = formatNumber(earnedStars);
        statusLine.textContent = balloon.reward
          ? `🎯 @${playerName} gagne exactement ${exactStars} étoile${earnedStars === 1 ? '' : 's'} !`
          : `💥 @${playerName} éclate un ballon vide.`;
        return true;
      }

      function shootBalloon(id) {
        const balloon = balloons.find(item => item.id === id);
        if (!balloon) return;
        if (!isRoomOwner) {
          if (socket?.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({
              action: 'BALLOON_GAME_SHOOT',
              balloonId: id,
              username: $('demoUsername').value || 'Spectateur'
            }));
          }
          return;
        }
        const username = $('demoUsername').value || 'Spectateur';
        if (!fireShot(username, id)) return;
        finishPlayerTurnIfReady(username);
        fillBalloonField();
        renderMetrics();
        saveState();
      }

      function runPlayerShot(username) {
        if (!isRoomOwner) return false;
        const playerName = String(username || '').trim().replace(/^@/, '').slice(0, 32);
        if (!playerName) return false;
        if (!balloons.length) fillBalloonField();
        if (!fireShot(playerName)) return false;
        finishPlayerTurnIfReady(playerName);
        const shotResult = statusLine.textContent;
        statusLine.textContent = `🏃 RUN : @${playerName} utilise son portefeuille global. ${shotResult}`;
        fillBalloonField();
        renderMetrics();
        saveState();
        synchronizeGameState(true);
        return true;
      }

      function setPlayerBalance() {
        if (!isRoomOwner) return;
        const username = $('balanceUsername').value.trim().replace(/^@/, '').slice(0, 32);
        const stars = Number($('balanceValue').value);
        const balanceStatus = $('balanceStatus');
        if (!/^[\p{L}\p{N}._-]{1,32}$/u.test(username) ||
            !Number.isSafeInteger(stars) || stars < 0 || stars > 1000000000) {
          balanceStatus.textContent = 'Saisis un pseudo valide et un nombre entier entre 0 et 1 000 000 000.';
          return;
        }
        const key = playerKeyFor(username);
        const player = players[key] || (players[key] = { username, stars: 0, shots: 0 });
        player.username = username;
        player.stars = stars;
        totalStars = sumPlayerStars(players);
        balanceStatus.textContent = `Solde de @${username} défini à ${formatNumber(stars)} étoile${stars === 1 ? '' : 's'}.`;
        renderMetrics();
        saveState();
        synchronizeGameState(true);
      }

      // Les tirs partent un par un, espacés de SHOT_INTERVAL_MS (quel que soit le nombre de pièces).
      const SHOT_INTERVAL_MS = 350;
      let lastShotAt = 0;

      function scheduleNextShot(delay) {
        shotProcessingTimer = window.setTimeout(() => {
          shotProcessingTimer = 0;
          processShots();
        }, Math.max(0, delay));
      }

      function processShots() {
        if (shotProcessingTimer || pendingShots <= 0) return;
        const wait = SHOT_INTERVAL_MS - (performance.now() - lastShotAt);
        if (wait > 0) {
          scheduleNextShot(wait);
          return;
        }
        if (!balloons.length) {
          fillBalloonField(false, false, false);
          if (!balloons.length) return;
        }
        const currentGift = pendingGifts[0];
        const globalAwards = new Map();
        if (!currentGift || !fireShot(currentGift.username, null, globalAwards)) return;
        lastShotAt = performance.now();
        pendingShots--;
        currentGift.remaining--;
        if (currentGift.remaining === 0) pendingGifts.shift();
        finishPlayerTurnIfReady(currentGift.username);
        fillBalloonField(false, false, false);
        renderMetrics();
        saveState();
        globalAwards.forEach(award => awardGlobalStars(award.username, award.amount));
        synchronizeGameState(pendingShots === 0);
        if (pendingShots > 0) scheduleNextShot(SHOT_INTERVAL_MS);
      }

      function receiveTikTokGift(giftName, coinValue, username = 'Spectateur', avatarDataUri = '', avatarUrl = '') {
        if (!isRoomOwner) return { accepted: false, shotsQueued: 0 };
        const coins = Number(coinValue);
        if (!Number.isSafeInteger(coins) || coins < 1 || coins > MAX_GIFT_COINS) {
          throw new RangeError(`Le cadeau doit valoir entre 1 et ${MAX_GIFT_COINS.toLocaleString('fr-FR')} pièces.`);
        }
        if (!Number.isSafeInteger(pendingShots + coins) || !Number.isSafeInteger(totalShots + pendingShots + coins)) {
          throw new RangeError('La file de tirs a atteint sa limite de comptage.');
        }
        pendingShots += coins;
        const playerName = String(username || 'Spectateur').trim().replace(/^@/, '').slice(0, 32) || 'Spectateur';
        const normalizedGiftName = String(giftName || 'Cadeau TikTok').slice(0, 60);
        storeAvatar(playerName, avatarDataUri || avatarUrl);
        const previousGift = pendingGifts[pendingGifts.length - 1];
        if (previousGift?.username === playerName && previousGift.giftName === normalizedGiftName &&
            previousGift.remaining <= Number.MAX_SAFE_INTEGER - coins) {
          previousGift.remaining += coins;
          if (avatarDataUri) previousGift.avatarDataUri = avatarDataUri;
          if (avatarUrl) previousGift.avatarUrl = avatarUrl;
        } else {
          pendingGifts.push({
            username: playerName,
            giftName: normalizedGiftName,
            remaining: coins,
            avatarDataUri,
            avatarUrl
          });
        }
        giftCount++;
        statusLine.textContent = `🎁 @${playerName} · ${normalizedGiftName} · ${formatNumber(coins)} pièce${coins === 1 ? '' : 's'} = ${formatNumber(coins)} tirs.`;
        saveState();
        processShots();
        return { accepted: true, shotsQueued: coins };
      }

      if (side === 1) window.receiveTikTokGift = receiveTikTokGift;
      window[`receiveTikTokGift${side}`] = receiveTikTokGift;

      function setConnection(message, state = '') {
        connection.dataset.state = state;
        connection.lastElementChild.textContent = message;
        $('liveBadge').textContent = state === 'online' ? 'Direct connecté' : 'Mode démo';
      }

      function connectLive() {
        const username = usernameInput.value.trim().replace(/^@/, '');
        if (!username) {
          setConnection('Saisis ton pseudo TikTok pour connecter le direct.', 'error');
          usernameInput.focus();
          return;
        }
        clearTimeout(reconnectTimer);
        if (socket) {
          const previousSocket = socket;
          socket = null;
          previousSocket.close();
        }
        setConnection('Connexion au relais TikTok…');
        try {
          socket = new WebSocket(WEBSOCKET_URL);
        } catch (error) {
          setConnection(`Connexion impossible : ${error.message}`, 'error');
          return;
        }
        const activeSocket = socket;
        activeSocket.addEventListener('open', () => {
          if (socket !== activeSocket) return;
          activeSocket.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username, gameMode: 'balloon' }));
          setConnection(`Direct demandé pour @${username} · attente des cadeaux`, 'online');
        });
        activeSocket.addEventListener('message', event => {
          try {
            const data = JSON.parse(event.data);
            const type = String(data.type || '').toUpperCase();
            if (type === 'WALLET_BALANCE') {
              if (data.source === 'chat') showWalletBanner(data.player);
              return;
            }
            if (type === 'BALLOON_GAME_ROLE') {
              isRoomOwner = Boolean(data.owner);
              roomPlayers = Number.isSafeInteger(data.players) ? data.players : 1;
              $('playerCount').textContent =
                `Joueurs connectés : ${roomPlayers}/${Number.isSafeInteger(data.maxPlayers) ? data.maxPlayers : MAX_BALLOON_GAME_PLAYERS}`;
              renderPoolEditor();
              if (isRoomOwner) {
                if (data.state) applySharedState(data.state);
                else {
                  if (!pool.length) {
                    if (!loadState()) startNewPool();
                    fillBalloonField(true);
                  }
                  synchronizeGameState(true);
                }
              } else if (data.state) applySharedState(data.state);
              $('demoButton').disabled = !isRoomOwner;
              $('salvoDemoButton').disabled = !isRoomOwner;
              $('connectionStatus').lastElementChild.textContent =
                isRoomOwner ? 'Hôte de la partie · les cadeaux alimentent cette arène.' : 'Participant · tes clics sont transmis à l’hôte.';
              return;
            }
            if (type === 'BALLOON_GAME_PLAYERS') {
              roomPlayers = Number.isSafeInteger(data.players) ? data.players : roomPlayers;
              renderMetrics();
              return;
            }
            if (type === 'BALLOON_GAME_STATE') {
              if (!isRoomOwner) applySharedState(data.state);
              return;
            }
            if (type === 'BALLOON_GAME_SHOOT') {
              if (isRoomOwner && fireShot(data.username, data.balloonId)) {
                finishPlayerTurnIfReady(data.username);
                fillBalloonField();
                renderMetrics();
                saveState();
                synchronizeGameState(true);
              }
              return;
            }
            if (type === 'BALLOON_GAME_ERROR') {
              setConnection(String(data.message || 'La partie ne peut pas accepter ce joueur.'), 'error');
              return;
            }
            if (type === 'STATUS') {
              const message = String(data.message || 'Statut du direct reçu.');
              setConnection(message, /connecté/i.test(message) ? 'online' : /erreur/i.test(message) ? 'error' : '');
              return;
            }
            if (type === 'VIEWER') {
              const viewer = data.viewer || data;
              storeAvatar(viewer.username, viewer.avatarDataUri);
              return;
            }
            if (type !== 'GIFT' && type !== 'TIKTOK-GIFT') return;
            const gift = data.gift || data;
            let coins = Number(gift.coinCount ?? gift.diamonds ?? gift.diamondCount);
            if (!Number.isSafeInteger(coins) || coins < 1) {
              const unitValue = Number(gift.coinValue);
              const repeatCount = Number(gift.repeatCount ?? 1);
              if (Number.isSafeInteger(unitValue) && unitValue > 0 &&
                  Number.isSafeInteger(repeatCount) && repeatCount > 0 &&
                  Number.isSafeInteger(unitValue * repeatCount)) coins = unitValue * repeatCount;
            }
            if (Number.isSafeInteger(coins) && coins > 0) {
              let remaining = coins;
              while (remaining > 0) {
                const batch = Math.min(remaining, MAX_GIFT_COINS);
                receiveTikTokGift(
                  gift.giftName || gift.gift || 'Cadeau TikTok',
                  batch,
                  gift.username || gift.nickname || gift.uniqueId || 'Spectateur',
                  gift.avatarDataUri || '',
                  Array.isArray(gift.avatarUrls) ? gift.avatarUrls[0] || '' : ''
                );
                remaining -= batch;
              }
            }
          } catch (error) {
            setConnection('Message du direct illisible.', 'error');
          }
        });
        activeSocket.addEventListener('error', () => {
          if (socket === activeSocket) setConnection('Relais inaccessible · vérifie le serveur TikTok.', 'error');
        });
        activeSocket.addEventListener('close', () => {
          if (socket !== activeSocket || closingPage) return;
          setConnection('Relais déconnecté · nouvelle tentative dans 3 secondes.');
          reconnectTimer = window.setTimeout(connectLive, 3000);
        });
      }

      $('liveForm').addEventListener('submit', event => {
        event.preventDefault();
        connectLive();
      });

      $('demoButton').addEventListener('click', () => {
        const coins = Number(demoCoins.value);
        try {
          const result = receiveTikTokGift('Cadeau de test', coins, $('demoUsername').value);
          statusLine.textContent = `Démo : ${formatNumber(result.shotsQueued)} tir${result.shotsQueued === 1 ? '' : 's'} envoyé${result.shotsQueued === 1 ? '' : 's'} pour ${formatNumber(coins)} pièce${coins === 1 ? '' : 's'}.`;
        } catch (error) {
          statusLine.textContent = error.message;
        }
      });

      $('salvoDemoButton').addEventListener('click', () => {
        try {
          receiveTikTokGift('Salve Spectacle', 25, $('demoUsername').value || 'Spectateur');
          cameraShake = Math.max(cameraShake, 6);
        } catch (error) {
          statusLine.textContent = error.message;
        }
      });

      $('addPrizeButton').addEventListener('click', () => {
        if (!isRoomOwner || poolConfig.length >= 200) return;
        const currentTotal = poolConfig.reduce((total, prize) => total + prize.count, 0);
        const roomLeft = MAX_POOL_SIZE - currentTotal;
        if (roomLeft <= 0) {
          $('poolEditorStatus').textContent = 'Le bassin atteint déjà la limite de 100 000 ballons.';
          return;
        }
        poolConfig.push({ id: `prize-${Date.now()}`, stars: 1, count: Math.min(1, roomLeft) });
        renderPoolEditor();
      });

      $('savePoolButton').addEventListener('click', savePrizeEditor);
      $('setBalanceButton').addEventListener('click', setPlayerBalance);

      const backgroundMediaInput = $('backgroundMediaInput');
      const backgroundMediaStatus = $('backgroundMediaStatus');
      const saveBackgroundMediaButton = $('saveBackgroundMediaButton');
      $('chooseBackgroundMediaButton').addEventListener('click', () => backgroundMediaInput.click());
      backgroundMediaInput.addEventListener('change', () => {
        const file = backgroundMediaInput.files?.[0];
        if (!file) return;
        if (!file.type.startsWith('video/') && !file.type.startsWith('image/')) {
          pendingBackgroundMedia = null;
          saveBackgroundMediaButton.disabled = true;
          backgroundMediaStatus.textContent = 'Choisis une image ou une vidéo.';
          backgroundMediaInput.value = '';
          return;
        }
        pendingBackgroundMedia = file;
        saveBackgroundMediaButton.disabled = false;
        backgroundMediaStatus.textContent = `${file.type.startsWith('image/') ? 'Image' : 'Vidéo'} sélectionnée : ${file.name}.`;
        backgroundMediaInput.value = '';
      });
      saveBackgroundMediaButton.addEventListener('click', async () => {
        if (!pendingBackgroundMedia) return;
        const file = pendingBackgroundMedia;
        saveBackgroundMediaButton.disabled = true;
        backgroundMediaStatus.textContent = 'Enregistrement du fond sur cet appareil…';
        try {
          await saveBackgroundMedia(file);
          displayBackgroundMedia(file);
          pendingBackgroundMedia = null;
          backgroundMediaStatus.textContent = `Fond enregistré : ${file.name}`;
        } catch (error) {
          saveBackgroundMediaButton.disabled = false;
          backgroundMediaStatus.textContent = 'Enregistrement impossible : vérifie l’espace disponible.';
        }
      });
      $('removeBackgroundMediaButton').addEventListener('click', async event => {
        event.currentTarget.disabled = true;
        try {
          await deleteBackgroundMedia();
          displayBackgroundMedia(null);
          pendingBackgroundMedia = null;
          saveBackgroundMediaButton.disabled = true;
          backgroundMediaStatus.textContent = 'Fond supprimé de cet appareil.';
        } catch (error) {
          event.currentTarget.disabled = false;
        }
      });

      function runPlayerShots(username, spent) {
        const shots = Number(spent);
        if (!Number.isSafeInteger(shots) || shots < 2) return runPlayerShot(username);
        const playerName = String(username || '').trim().replace(/^@/, '').slice(0, 32);
        if (!playerName) return false;
        if (!Number.isSafeInteger(pendingShots + shots) || !Number.isSafeInteger(totalShots + pendingShots + shots)) return false;
        pendingShots += shots;
        const lastGift = pendingGifts[pendingGifts.length - 1];
        if (lastGift?.username === playerName && lastGift.giftName === 'RUN') lastGift.remaining += shots;
        else pendingGifts.push({ username: playerName, giftName: 'RUN', remaining: shots, avatarDataUri: '', avatarUrl: '' });
        statusLine.textContent = `🏃 RUN : @${playerName} rejoue ${formatNumber(shots)} étoiles = ${formatNumber(shots)} tirs.`;
        saveState();
        processShots();
        return true;
      }

      window.addEventListener('arcade:wallet-run', event => {
        const username = event.detail?.player?.username;
        if (side === 1 && isRoomOwner && username) runPlayerShots(username, event.detail?.spent);
      });

      window.addEventListener('pagehide', () => {
        closingPage = true;
        clearTimeout(reconnectTimer);
        clearTimeout(shotResultBannerTimer);
        if (backgroundVideoObjectUrl) URL.revokeObjectURL(backgroundVideoObjectUrl);
        if (socket) {
          const activeSocket = socket;
          socket = null;
          activeSocket.close();
        }
      });

      /* ============================================================================
         10. INITIALISATION AU CHARGEMENT
         ============================================================================ */
      restoreBackgroundMedia();
      if (!loadState()) {
        startNewPool();
        fillBalloonField(true);
      } else if (poolIndex === pool.length && balloons.length === 0) {
        startNewPool();
        fillBalloonField(true);
      } else {
        fillBalloonField(balloons.length === 0);
      }
      renderMetrics();
      renderPoolEditor();
      saveState();
      if (pendingShots) processShots();
      requestAnimationFrame(animateScene);
  
    }

    const gameTemplate = document.getElementById('gameTemplate');
    [1, 2].forEach(side => {
      const half = document.getElementById(`half-${side}`);
      half.append(gameTemplate.content.cloneNode(true));
      createBalloonGame(side, half);
      const page = document.getElementById(`settingsPage-${side}`);
      page.dataset.side = String(side);
      document.getElementById('panelPages').append(page);
    });

    /* ============================================================================
       PANNEAU DE RÉGLAGES UNIQUE (une page par partie, choisie par onglet)
       ============================================================================ */
    (() => {
      const duo = document.getElementById('duo');
      const settingsPanel = document.getElementById('settingsPanel');
      const panelHandle = document.getElementById('panelHandle');
      const restorePanelButton = document.getElementById('restorePanelButton');
      const PANEL_KEY = 'monde-du-ballon-v1';
      const panelPositionKey = `${PANEL_KEY}-panel-position`;
      const panelPinnedKey = `${PANEL_KEY}-panel-pinned`;
      const panelHiddenKey = `${PANEL_KEY}-panel-hidden`;
      const panelTabKey = `${PANEL_KEY}-panel-tab`;
      let panelPointer = null;

      function showTab(side) {
        document.querySelectorAll('.panel-tab').forEach(tab => {
          const active = Number(tab.dataset.side) === side;
          tab.classList.toggle('active', active);
          tab.setAttribute('aria-selected', String(active));
        });
        document.querySelectorAll('.panel-page').forEach(page => { page.hidden = Number(page.dataset.side) !== side; });
        document.querySelectorAll('.half').forEach((half, index) => {
          half.querySelector('.half-tag')?.classList.toggle('active', index + 1 === side);
        });
        try { localStorage.setItem(panelTabKey, String(side)); } catch (error) {}
      }
      document.querySelectorAll('.panel-tab').forEach(tab => {
        tab.addEventListener('click', () => showTab(Number(tab.dataset.side)));
      });
      let startTab = 1;
      try { startTab = localStorage.getItem(panelTabKey) === '2' ? 2 : 1; } catch (error) {}
      showTab(startTab);

      settingsPanel.hidden = true;
      restorePanelButton.hidden = false;
      try {
        const savedPosition = JSON.parse(localStorage.getItem(panelPositionKey) || 'null');
        if (savedPosition && Number.isFinite(savedPosition.x) && Number.isFinite(savedPosition.y)) {
          settingsPanel.style.left = `${Math.max(0, Math.min(duo.clientWidth - 160, savedPosition.x))}px`;
          settingsPanel.style.top = `${Math.max(0, Math.min(duo.clientHeight - 120, savedPosition.y))}px`;
        }
        settingsPanel.classList.toggle('floating', localStorage.getItem(panelPinnedKey) === 'true');
        settingsPanel.hidden = localStorage.getItem(panelHiddenKey) !== 'false';
        restorePanelButton.hidden = !settingsPanel.hidden;
        restorePanelButton.setAttribute('aria-expanded', String(!settingsPanel.hidden));
      } catch (error) {}

      document.getElementById('pinPanelButton').addEventListener('click', () => {
        const pinned = !settingsPanel.classList.contains('floating');
        settingsPanel.classList.toggle('floating', pinned);
        try { localStorage.setItem(panelPinnedKey, String(pinned)); } catch (error) {}
      });
      document.getElementById('hidePanelButton').addEventListener('click', () => {
        settingsPanel.hidden = true;
        restorePanelButton.hidden = false;
        restorePanelButton.setAttribute('aria-expanded', 'false');
        try { localStorage.setItem(panelHiddenKey, 'true'); } catch (error) {}
      });
      restorePanelButton.addEventListener('click', () => {
        settingsPanel.hidden = false;
        restorePanelButton.hidden = true;
        restorePanelButton.setAttribute('aria-expanded', 'true');
        try { localStorage.setItem(panelHiddenKey, 'false'); } catch (error) {}
      });
      panelHandle.addEventListener('pointerdown', event => {
        if (!settingsPanel.classList.contains('floating') || event.target.closest('button')) return;
        panelPointer = { id: event.pointerId, offsetX: event.clientX - settingsPanel.offsetLeft, offsetY: event.clientY - settingsPanel.offsetTop };
        panelHandle.setPointerCapture(event.pointerId);
        settingsPanel.classList.add('editing');
      });
      panelHandle.addEventListener('pointermove', event => {
        if (!panelPointer || panelPointer.id !== event.pointerId) return;
        settingsPanel.style.left = `${Math.max(0, Math.min(duo.clientWidth - settingsPanel.offsetWidth, event.clientX - panelPointer.offsetX))}px`;
        settingsPanel.style.top = `${Math.max(0, Math.min(duo.clientHeight - settingsPanel.offsetHeight, event.clientY - panelPointer.offsetY))}px`;
      });
      const endPanelDrag = event => {
        if (!panelPointer || panelPointer.id !== event.pointerId) return;
        panelPointer = null;
        settingsPanel.classList.remove('editing');
        try {
          localStorage.setItem(panelPositionKey, JSON.stringify({ x: settingsPanel.offsetLeft, y: settingsPanel.offsetTop }));
        } catch (error) {}
      };
      panelHandle.addEventListener('pointerup', endPanelDrag);
      panelHandle.addEventListener('pointercancel', endPanelDrag);
      window.addEventListener('resize', () => {
        if (!settingsPanel.classList.contains('floating')) return;
        settingsPanel.style.left = `${Math.max(0, Math.min(duo.clientWidth - settingsPanel.offsetWidth, settingsPanel.offsetLeft))}px`;
        settingsPanel.style.top = `${Math.max(0, Math.min(duo.clientHeight - settingsPanel.offsetHeight, settingsPanel.offsetTop))}px`;
      });
    })();
  </script>
</body>
</html>
