<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#76c9dc">
  <title>Le Monde du Ballon — Double partie — Griffon Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background: #0d1b1e;
      color: #fff9e9;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { min-width: 320px; min-height: 0; margin: 0; padding: 0; background: radial-gradient(circle at top, #173036, #0b1619); }
    button, input { font: inherit; }
    .page { display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 0; margin: 0; }
    .topbar { position: absolute; z-index: 20; inset: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 15px; min-height: 58px; margin: 0; padding: 6px clamp(12px, 2vw, 28px); border-bottom: 1px solid #ffffff20; background: linear-gradient(180deg, #0b1619e8, #0b161999); }
    .brand { margin: 0; font-size: clamp(20px, 3.6vw, 32px); letter-spacing: -.04em; display: flex; align-items: center; gap: 8px; }
    .brand span { color: #ffe073; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .audio-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px; border: 1px solid #6c9b89;
      background: #162e26; color: #fff5ca; font-size: 12px; font-weight: 700; cursor: pointer;
      transition: background .15s ease, transform .1s ease;
    }
    .audio-toggle:hover { background: #224438; }
    .audio-toggle:active { transform: scale(.97); }
    .game-volume-control { display: grid; grid-template-columns: auto minmax(0, 1fr) 42px; align-items: center; gap: 10px; width: 100%; min-width: 0; padding: 10px 12px; border: 1px solid #6c9b89; border-radius: 12px; background: #162e26; color: #fff5ca; font-size: 12px; font-weight: 800; }
    .game-volume-control input { width: 100%; min-width: 0; height: 22px; accent-color: #ffe073; cursor: pointer; }
    .game-volume-control output { min-width: 42px; color: #ffe073; font-variant-numeric: tabular-nums; text-align: right; }
    .sound-settings { display: grid; justify-items: start; gap: 9px; }
    .link { color: #d5f4ff; font-size: 13px; text-decoration: none; }
    .link:hover { text-decoration: underline; }
    .duo { position: relative; flex: 1 1 auto; display: grid; grid-template-columns: minmax(0, 1fr) 8px minmax(0, 1fr); gap: 0; align-items: stretch; min-height: 0; }
    .half { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
    .half > .arena { flex: 1 1 auto; }
    .divider { position: relative; z-index: 5; background: linear-gradient(90deg, #0b1619, #ffe073 28%, #fff2b3 50%, #ffe073 72%, #0b1619); box-shadow: 0 0 0 1px #0b1619, 0 0 22px #ffe07399; }
    .panel-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; border: 1px solid #4f705c; border-radius: 12px; background: #0e1b17; }
    .panel-tab { min-height: 36px; border: 0; border-radius: 8px; background: transparent; color: #d4e3dc; cursor: pointer; font-weight: 800; transition: background .15s ease, color .15s ease; }
    .panel-tab:hover { background: #1c3529; }
    .panel-tab.active { background: #ffdc78; color: #32230c; }
    .panel-pages { display: grid; }
    .panel-page { display: grid; gap: 14px; min-width: 0; }
    .panel-page[hidden] { display: none; }
    .half-tag.active { background: #ffe073; border-color: #ffe073; color: #32230c; }
    .half-tag { display: none; position: absolute; z-index: 15; top: 12px; left: 12px; padding: 4px 11px; border: 1px solid #ffffff38; border-radius: 999px; background: #0b1619b3; color: #ffe073; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; pointer-events: none; }
    .arena, .panel { border: 1px solid #598574; border-radius: 19px; background: #12251f; box-shadow: 0 18px 48px #0007; }
    .arena { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; border: 0; border-radius: 0; box-shadow: none; }
    .arena-head { display: none; }
    .arena-head h2 { margin: 0; font-family: Georgia, serif; font-size: clamp(17px, 2.4vw, 24px); }
    .arena-head p { margin: 3px 0 0; color: #d6e4cc; font-size: 12px; }
    .pill { padding: 6px 12px; border: 1px solid #ffffff38; border-radius: 999px; color: #fff5ca; font-size: 11px; font-weight: 700; white-space: nowrap; background: #0d1c17; }

    /* Scène principale avec canvas réaliste */
    .scene { position: relative; flex: 1 1 auto; height: auto; min-height: 0; overflow: hidden; background: #6ec4d8; cursor: crosshair; user-select: none; touch-action: manipulation; }
    .scene.has-background-media { background: #0e1c20; }
    .scene-image, .scene-video { position: absolute; z-index: 0; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .world-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 2; }

    /* Effets DOM flottants (récompenses & bannières) */
    .pop-effect {
      position: absolute; z-index: 12; color: #fff9d2;
      font-size: clamp(28px, 4.5vw, 54px); font-weight: 950; line-height: 1; white-space: nowrap; pointer-events: none;
      text-shadow: 0 3px 0 #183026, -2px -2px 0 #183026, 2px -2px 0 #183026, -2px 2px 0 #183026, 2px 2px 0 #183026, 0 0 22px #ffdf6b;
      animation: pop-up 1.05s cubic-bezier(.16, .84, .32, 1) forwards;
    }
    @keyframes pop-up {
      0% { opacity: 0; transform: translate(-50%, -30%) scale(.45); }
      18% { opacity: 1; transform: translate(-50%, -65%) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -155%) scale(1.05); }
    }

    .wallet-banner { position: absolute; z-index: 100; top: 50%; left: 50%; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 22px; width: min(720px, calc(100% - 32px)); padding: 24px 30px; border: 3px solid #ffe073; border-radius: 24px; background: linear-gradient(135deg, #102126f5, #254b39f5); box-shadow: 0 0 0 100vmax #0610148c, 0 18px 70px #000b, 0 0 38px #ffe07366; color: #fff9e9; text-align: left; transform: translate(-50%, -50%); animation: wallet-banner-in .35s cubic-bezier(.2, .8, .2, 1) both; }
    .wallet-banner[hidden] { display: none; }
    .wallet-banner img, .wallet-avatar-fallback { grid-row: span 2; width: clamp(86px, 16vw, 132px); aspect-ratio: 1; border: 4px solid #fff2b3; border-radius: 50%; box-shadow: 0 0 28px #ffe07380; object-fit: cover; }
    .wallet-banner img[hidden], .wallet-avatar-fallback[hidden] { display: none; }
    .wallet-avatar-fallback { display: grid; place-items: center; background: #ffdc78; color: #32230c; font-size: clamp(30px, 6vw, 52px); font-weight: 950; }
    .wallet-kicker { align-self: end; color: #ffe073; font-size: clamp(14px, 2.3vw, 20px); font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    .wallet-name { overflow: hidden; color: #fff; font-size: clamp(30px, 6vw, 52px); font-weight: 950; line-height: 1.05; text-overflow: ellipsis; }
    .wallet-stars { grid-column: 1 / -1; justify-self: center; color: #fff1a8; font-size: clamp(30px, 6vw, 54px); font-weight: 950; text-align: center; text-shadow: 0 3px 0 #885b12, 0 0 22px #fff17a99; }
    @keyframes wallet-banner-in { from { opacity: 0; transform: translate(-50%, -46%) scale(.94); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    .shot-result-banner { position: absolute; z-index: 40; top: 50%; display: grid; grid-template-columns: clamp(48px, 6.5vw, 68px) minmax(0, 1fr); align-items: center; gap: 12px; width: min(340px, calc(100% - 24px)); padding: 12px; border: 2px solid #ffe073; border-radius: 16px; background: linear-gradient(135deg, #102126f2, #254b39f2); box-shadow: 0 12px 36px #000b, 0 0 26px #ffe07366; color: #fff9e9; transform: translateY(-50%); pointer-events: none; animation: shot-result-in .35s cubic-bezier(.2, .8, .2, 1) both; }
    .shot-result-banner[hidden], .shot-result-avatar[hidden], .shot-result-avatar-fallback[hidden] { display: none; }
    #half-1 .shot-result-banner { left: 12px; }
    #half-2 .shot-result-banner { right: 12px; }
    .shot-result-avatar, .shot-result-avatar-fallback { grid-row: span 3; width: clamp(48px, 6.5vw, 68px); aspect-ratio: 1; border: 3px solid #fff2b3; border-radius: 50%; box-shadow: 0 0 20px #ffe07380; object-fit: cover; }
    .shot-result-avatar-fallback { display: grid; place-items: center; background: #ffdc78; color: #32230c; font-size: 22px; font-weight: 950; }
    .shot-result-side { color: #ffe073; font-size: 10px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    .shot-result-name { overflow: hidden; color: #fff; font-size: clamp(17px, 2vw, 23px); font-weight: 950; text-overflow: ellipsis; }
    .shot-result-stars { color: #fff1a8; font-size: clamp(19px, 2.5vw, 28px); font-weight: 950; text-shadow: 0 2px 0 #885b12, 0 0 18px #fff17a99; }
    @keyframes shot-result-in { from { opacity: 0; transform: translateY(-44%) scale(.94); } to { opacity: 1; transform: translateY(-50%) scale(1); } }

    .panel { position: absolute; z-index: 50; top: 14px; right: 14px; display: grid; align-content: start; gap: 14px; width: min(370px, calc(100% - 28px)); min-height: 0; max-height: calc(100% - 28px); overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; padding: 16px; box-shadow: 0 18px 48px #000b; }
    .panel.floating { position: absolute; z-index: 50; top: 18px; right: 18px; width: min(370px, calc(100% - 36px)); max-height: calc(100% - 36px); overflow: auto; }
    .panel.editing { outline: 2px dashed #ffdc78; }
    .panel[hidden] { display: none; }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .panel-heading h2 { margin: 0; font-family: Georgia, serif; font-size: 20px; }
    .panel-actions { display: flex; gap: 6px; }
    .icon-button { min-width: 34px; min-height: 34px; border: 1px solid #668673; border-radius: 8px; background: #1b3226; color: #fff2c2; cursor: pointer; font-size: 16px; }
    .restore-panel { position: absolute; z-index: 50; right: 14px; bottom: 14px; min-width: 44px; min-height: 44px; padding: 8px 14px; border-radius: 999px; box-shadow: 0 8px 28px #000b; }
    .restore-panel[hidden] { display: none; }
    .panel-heading.edit-handle { cursor: grab; touch-action: none; }
    .panel.editing .panel-heading { cursor: grabbing; }
    .stats-panel { display: grid; gap: 9px; padding: 12px; border: 1px solid #4f705c; border-radius: 12px; background: #0e1b17; }
    .stats-panel h3 { margin: 0; color: #ffe073; font-family: Georgia, serif; font-size: 16px; }
    .shot-line { min-height: 19px; margin: 4px 0 0; color: #fff; font-size: 11.5px; line-height: 1.4; }
    .connection { display: flex; align-items: center; gap: 8px; color: #d4e3dc; font-size: 12px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #f1c657; box-shadow: 0 0 12px #f1c65766; flex-shrink: 0; }
    .connection[data-state="online"] .dot { background: #61e99e; }
    .connection[data-state="error"] .dot { background: #ff7777; }
    .gift-form { display: grid; gap: 8px; }
    .gift-form label, .rtp-label { color: #e4eadb; font-size: 12px; font-weight: 750; }
    .gift-form input { width: 100%; min-height: 40px; padding: 8px 11px; border: 1px solid #597767; border-radius: 9px; background: #0d1916; color: #fff; }
    .button { min-height: 40px; padding: 8px 13px; border: 0; border-radius: 9px; background: #ffdc78; color: #32230c; cursor: pointer; font-weight: 900; transition: transform .1s ease, background .15s ease; }
    .button:hover { background: #ffe8a5; }
    .button:active { transform: scale(.98); }
    .button.secondary { border: 1px solid #658b76; background: #1c3529; color: #e9f2e9; }
    .button.secondary:hover { background: #284b38; }
    .demo-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .rtp-wrap { display: grid; gap: 8px; padding: 13px; border: 1px solid #4f705c; border-radius: 12px; background: #0e1b17; }
    .rtp-heading { display: flex; justify-content: space-between; gap: 10px; }
    .rtp-heading output { color: #ffe073; font-weight: 900; }
    .help { margin: 0; color: #bfcdc1; font-size: 11px; line-height: 1.55; }
    .pool { display: grid; gap: 9px; padding: 12px; border: 1px solid #4f705c; border-radius: 12px; background: #0e1b17; }
    .pool h3 { margin: 0 0 4px; color: #ffe073; font-family: Georgia, serif; font-size: 15px; }
    .pool-total { margin: 0; color: #d4e3dc; font-size: 11px; }
    .pool > input { width: 100%; min-height: 38px; padding: 8px 10px; border: 1px solid #597767; border-radius: 8px; background: #0d1916; color: #fff; }
    .prize-list { display: grid; max-height: 260px; gap: 6px; overflow: auto; padding-right: 3px; }
    .prize-row { display: grid; grid-template-columns: minmax(68px, 1fr) minmax(74px, 1fr) 32px; align-items: center; gap: 7px; }
    .prize-row.prize-done { display: none; }
    .prize-left { grid-column: 1 / -1; color: #ffe073; font-size: 10px; font-weight: 800; }
    .prize-row label { display: grid; gap: 3px; color: #bacabe; font-size: 9px; }
    .prize-row input { width: 100%; min-width: 0; min-height: 34px; padding: 5px 7px; border: 1px solid #597767; border-radius: 7px; background: #0d1916; color: #fff; font-size: 11px; }
    .prize-remove { width: 30px; height: 30px; border: 1px solid #8b5d4e; border-radius: 7px; background: #39201c; color: #ffb7a3; cursor: pointer; }
    .prize-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .game-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .game-stat { padding: 8px; border-radius: 9px; background: #1a3025; }
    .game-stat span { display: block; color: #d8e3d1; font-size: 10px; }
    .game-stat strong { display: block; margin-top: 3px; color: #ffe7a0; font-size: 17px; }
    .player-limit { color: #d4e3dc; font-size: 11px; margin: 0; }
    .leaderboard { padding: 12px; border: 1px solid #4f705c; border-radius: 12px; background: #0e1b17; }
    .leaderboard h3 { margin: 0 0 8px; color: #ffe073; font-family: Georgia, serif; font-size: 15px; }
    .leaderboard ol { display: grid; gap: 5px; margin: 0; padding-left: 21px; color: #e4eadb; font-size: 11px; }
    .demo-note { margin: 0; color: #bbc9be; font-size: 11px; line-height: 1.55; }
    @media (max-width: 820px) {
      .arena-head { padding: 10px; }
      .wallet-banner { gap: 13px; padding: 18px; }
      .panel { padding: 12px; }
      .shot-result-banner { grid-template-columns: 44px minmax(0, 1fr); gap: 8px; padding: 9px; }
      .shot-result-avatar, .shot-result-avatar-fallback { width: 44px; }
      .shot-result-name { font-size: clamp(13px, 4vw, 18px); }
      .shot-result-stars { font-size: clamp(16px, 4.5vw, 22px); }
    }
    @media (max-width: 600px) {
      .topbar { align-items: flex-start; margin-bottom: 8px; }
      .brand { font-size: 19px; }
      .link { max-width: 100px; text-align: right; }
      .game-volume-control { grid-template-columns: auto minmax(0, 1fr) 40px; gap: 7px; padding: 9px; font-size: 11px; }
      .arena { width: 100%; height: 100%; }
      .arena-head { flex: 0 0 auto; }
      .panel:not(.floating) { position: absolute; z-index: 50; top: 10px; right: 10px; width: min(370px, calc(100% - 20px)); max-height: calc(100% - 20px); }
      .panel.floating { top: 10px; right: 10px; width: min(370px, calc(100% - 20px)); max-height: calc(100% - 20px); }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Le Monde du Ballon</h1>
    <div class="duo" id="duo">
      <div class="half" id="half-1"></div>
      <div class="divider" role="separator" aria-orientation="vertical" aria-label="Séparation entre les deux parties"></div>
      <div class="half" id="half-2"></div>
      <aside class="panel" id="settingsPanel" aria-label="Direct et réglages des deux parties">
        <header class="panel-heading edit-handle" id="panelHandle">
          <h2>Direct et réglages</h2>
          <div class="panel-actions">
            <button class="icon-button" id="pinPanelButton" type="button" aria-label="Épingler et déplacer le panneau" title="Épingler et déplacer">📌</button>
            <button class="icon-button" id="hidePanelButton" type="button" aria-label="Masquer le panneau" title="Masquer">×</button>
          </div>
        </header>
        <section class="sound-settings" aria-label="Son et tirs">
          <button class="audio-toggle" id="audioToggleButton" type="button" aria-pressed="true" title="Activer ou couper les effets sonores">🔊 Son activé</button>
          <label class="game-volume-control" title="Régler le volume général des effets sonores">
            <span>🔊 Volume du jeu</span>
            <input id="gameVolumeControl" type="range" min="0" max="2" step="0.1" value="1" aria-label="Volume du jeu" aria-valuetext="100%">
            <output id="gameVolumeValue" for="gameVolumeControl">100%</output>
          </label>
        </section>
        <div class="panel-tabs" role="tablist" aria-label="Choisir la partie à régler">
          <button class="panel-tab" type="button" role="tab" data-side="1">Partie 1</button>
          <button class="panel-tab" type="button" role="tab" data-side="2">Partie 2</button>
        </div>
        <div class="panel-pages" id="panelPages"></div>
      </aside>
      <button class="button restore-panel" id="restorePanelButton" type="button" aria-controls="settingsPanel" aria-expanded="false" aria-label="Afficher le direct et les réglages" title="Afficher le direct et les réglages" hidden>⚙ Réglages</button>
    </div>
  </main>


  <template id="gameTemplate">
    <span class="half-tag" aria-hidden="true"></span>
    <section class="arena" aria-label="Arène des ballons">
        <header class="arena-head">
          <div>
            <h2>La fête foraine</h2>
            <p>Clique sur un ballon ou envoie un cadeau : physique du vent, reflets latex et tirs de précision.</p>
          </div>
          <span class="pill" id="liveBadge">Mode démo</span>
        </header>
        <div class="scene" id="scene">
          <img class="scene-image" id="backgroundImage" alt="" hidden>
          <video class="scene-video" id="backgroundVideo" muted loop playsinline hidden></video>
          <canvas class="world-canvas" id="worldCanvas" aria-label="Arène interactive des ballons"></canvas>
        </div>
      </section>
    <div class="panel-page" id="settingsPage" hidden>
        <div class="connection" id="connectionStatus" data-state="demo"><span class="dot"></span><span>Mode démo · connecte ton direct ou clique dans l’arène.</span></div>

        <section class="stats-panel" aria-label="Résultats du jeu">
          <h3>Le Monde du Ballon</h3>
          <div class="game-stats">
            <div class="game-stat"><span>Étoiles gagnées</span><strong id="starsTotal">0</strong></div>
            <div class="game-stat"><span>Ballons éclatés</span><strong id="poppedTotal">0</strong></div>
            <div class="game-stat"><span>Tirs déclenchés</span><strong id="shotsTotal">0</strong></div>
            <div class="game-stat"><span>Bassin restant</span><strong id="poolRemaining">10 000</strong></div>
          </div>
          <p class="shot-line" id="starMessage" role="status" aria-live="polite">En attente du prochain tir.</p>
          <p class="player-limit" id="playerCount">Joueurs connectés : 0/30</p>
        </section>

        <div class="gift-form">
          <label for="demoUsername">Pseudo du joueur</label>
          <input id="demoUsername" type="text" maxlength="32" value="Spectateur">
          <label for="demoCoins">Tester un cadeau (pièces TikTok)</label>
          <input id="demoCoins" type="number" min="1" max="44000" value="1">
          <div class="demo-row">
            <button class="button secondary" id="demoButton" type="button">Envoyer cadeau</button>
            <button class="button" id="salvoDemoButton" type="button" title="Déclenche 25 tirs, un par un">🎆 Salve (25 tirs)</button>
          </div>
        </div>

        <form class="gift-form" id="liveForm">
          <label for="tiktokUsername">Pseudo TikTok du direct à rejoindre</label>
          <input id="tiktokUsername" name="username" autocomplete="off" placeholder="ex. griffonarcade" maxlength="64">
          <button class="button secondary" id="connectButton" type="submit">Connecter au direct</button>
          <p class="help">Tous les joueurs saisissent le même pseudo de créateur pour rejoindre la partie.</p>
        </form>

        <div class="rtp-wrap">
          <div class="rtp-heading"><span class="rtp-label">RTP réel du bassin</span><output id="rtpValue">—</output></div>
          <p class="help" id="rtpDescription">Calculé à partir des lots du bassin. Les ballons vides ne rapportent aucune étoile ; chaque lot rapporte exactement sa valeur.</p>
        </div>

        <section class="pool" aria-label="Image ou vidéo d’arrière-plan de l’arène">
          <h3>Fond du jeu</h3>
          <input id="backgroundMediaInput" type="file" accept="image/*,video/*" hidden>
          <div class="gift-form">
            <button class="button secondary" id="chooseBackgroundMediaButton" type="button">Choisir une image ou vidéo</button>
            <div class="demo-row">
              <button class="button" id="saveBackgroundMediaButton" type="button" disabled>Enregistrer</button>
              <button class="button secondary" id="removeBackgroundMediaButton" type="button" disabled>Retirer</button>
            </div>
          </div>
          <p class="help" id="backgroundMediaStatus" role="status" aria-live="polite">Ton image ou vidéo couvrira l’arène et sera enregistrée sur cet appareil.</p>
        </section>

        <section class="pool" aria-label="Modifier le bassin de ballons">
          <h3>Modifier le bassin</h3>
          <p class="pool-total" id="poolEditorTotal">10 000 ballons au total</p>
          <div class="prize-list" id="prizeList"></div>
          <div class="prize-actions">
            <button class="button secondary" id="addPrizeButton" type="button">＋ Ajouter un lot</button>
            <button class="button" id="savePoolButton" type="button">Enregistrer le bassin</button>
          </div>

  <script>
    'use strict';

    /* ============================================================================
       1. CONSTANTES ET CONFIGURATION GLOBALE
       ============================================================================ */
    const WEBSOCKET_URL = 'wss://jeu6boite.onrender.com';
    const BACKGROUND_VIDEO_DATABASE = 'monde-du-ballon-media';

    // Palettes riches de latex avec teinte claire, principale et ombre interne
    const LATEX_PALETTES = [
      { base: '#e53935', light: '#ff8a80', dark: '#7f0000', rim: '#ffcdd2' }, // Rouge cerise
      { base: '#43a047', light: '#a5d6a7', dark: '#1b5e20', rim: '#c8e6c9' }, // Vert émeraude
      { base: '#1e88e5', light: '#90caf9', dark: '#0d47a1', rim: '#bbdefb' }, // Bleu saphir
      { base: '#8e24aa', light: '#ce93d8', dark: '#4a148c', rim: '#e1bee7' }, // Violet améthyste
      { base: '#fb8c00', light: '#ffcc80', dark: '#e65100', rim: '#ffe0b2' }, // Orange mandarine
      { base: '#00897b', light: '#80cbc4', dark: '#004d40', rim: '#b2dfdb' }, // Turquoise lagon
      { base: '#d81b60', light: '#f48fb1', dark: '#880e4f', rim: '#f8bbd0' }, // Rose framboise
      { base: '#fdd835', light: '#fff9c4', dark: '#f57f17', rim: '#fffde7' }  // Or solaire
    ];
    const COLORS = LATEX_PALETTES.map(p => p.base);
    LATEX_PALETTES.forEach(palette => {
      ['base', 'light', 'dark', 'rim'].forEach(key => {
        const value = parseInt(palette[key].slice(1), 16);
        palette[`${key}Rgb`] = `${(value >> 16) & 255}, ${(value >> 8) & 255}, ${value & 255}`;
      });
    });


    /* ============================================================================
       2. MOTEUR AUDIO PROCÉDURAL (WEB AUDIO API)
       ============================================================================ */
    const SoundEngine = (() => {
      let audioCtx = null;
      let enabled = true;
      let gameVolume = 1;
      let lastPopTime = 0;
      let lastLaserTime = 0;

      function ensureContext() {
        if (!enabled) return null;
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function playBalloonPop(stars = 0) {
        if (gameVolume === 0) return;
        const ac = ensureContext();
        if (!ac) return;
        const now = ac.currentTime;
        if (now - lastPopTime < 0.025) return; // Anti-saturation sur salves massives
        lastPopTime = now;

        // 1. Claquement sec de membrane en latex (bruit blanc filtré très court)
        const bufferSize = Math.floor(ac.sampleRate * 0.09);
        const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.18));
        }
        const noise = ac.createBufferSource();
        noise.buffer = buffer;

        const filter = ac.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1100 + Math.random() * 600, now);
        filter.Q.setValueAtTime(1.4, now);

        const gain = ac.createGain();
        gain.gain.setValueAtTime(0.32 * gameVolume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ac.destination);
        noise.start(now);

        // 2. Onde de pression grave (thump)
        const osc = ac.createOscillator();
        const oscGain = ac.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(42, now + 0.08);
        oscGain.gain.setValueAtTime(0.28 * gameVolume, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(oscGain);
        oscGain.connect(ac.destination);
        osc.start(now);
        osc.stop(now + 0.085);

        // 3. Tintement cristallin si gain d'étoiles
        if (stars > 0) {
          playStarChime(stars);
        }
      }

      function playStarChime(stars) {
        if (gameVolume === 0) return;
        const ac = ensureContext();
        if (!ac) return;
        const now = ac.currentTime;
        const notes = stars >= 20 ? [587.33, 739.99, 880, 1174.66] : stars >= 5 ? [587.33, 880, 1174.66] : [659.25, 987.77];
        notes.forEach((freq, idx) => {
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.045);
          gain.gain.setValueAtTime(0.001, now + idx * 0.045);
          gain.gain.linearRampToValueAtTime(0.14 * gameVolume, now + idx * 0.045 + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + idx * 0.045 + 0.35);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(now + idx * 0.045);
          osc.stop(now + idx * 0.045 + 0.36);
        });
      }

      function playShotLaunch() {
        if (gameVolume === 0) return;
        const ac = ensureContext();
        if (!ac) return;
        const now = ac.currentTime;
        if (now - lastLaserTime < 0.035) return;
        lastLaserTime = now;

        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520 + Math.random() * 140, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.09);
        gain.gain.setValueAtTime(0.08 * gameVolume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start(now);
        osc.stop(now + 0.095);
      }

      return {
        isEnabled: () => enabled,
        setGameVolume: volume => {
          if (Number.isFinite(volume)) gameVolume = Math.min(2, Math.max(0, volume));
        },
        toggle: () => {
          enabled = !enabled;
          if (enabled) ensureContext();
          return enabled;
        },
        playBalloonPop,
        playShotLaunch
      };
    })();

    const audioToggleButton = document.getElementById('audioToggleButton');
    audioToggleButton.addEventListener('click', () => {
      const active = SoundEngine.toggle();
      audioToggleButton.setAttribute('aria-pressed', String(active));
      audioToggleButton.textContent = active ? '🔊 Son activé' : '🔇 Son coupé';
    });
    const gameVolumeControl = document.getElementById('gameVolumeControl');
    const gameVolumeValue = document.getElementById('gameVolumeValue');
    function updateGameVolume(value) {
      const volume = Number(value);
      if (!Number.isFinite(volume)) return;
      const normalizedVolume = Math.min(2, Math.max(0, volume));
      const percentage = Math.round(normalizedVolume * 100);
      SoundEngine.setGameVolume(normalizedVolume);
      gameVolumeControl.value = String(normalizedVolume);
      gameVolumeControl.setAttribute('aria-valuetext', `${percentage}%`);
      gameVolumeValue.value = `${percentage}%`;
    }
    gameVolumeControl.addEventListener('input', () => updateGameVolume(gameVolumeControl.value));
    updateGameVolume(gameVolumeControl.value);

    /* ============================================================================
       DEUX PARTIES INDÉPENDANTES : chaque moitié d'écran a son propre bassin,
       ses ballons, ses joueurs, son direct TikTok, ses réglages et sa sauvegarde.
       ============================================================================ */
    function createBalloonGame(side, root) {
      const suffix = `-${side}`;
      root.querySelectorAll('[id]').forEach(el => { el.id += suffix; });
      root.querySelectorAll('[for]').forEach(el => { el.setAttribute('for', el.getAttribute('for') + suffix); });
      root.querySelectorAll('[aria-controls]').forEach(el => { el.setAttribute('aria-controls', el.getAttribute('aria-controls') + suffix); });
      const $ = id => document.getElementById(id + suffix);
      root.querySelector('.half-tag').textContent = `Partie ${side}`;

      const STORAGE_KEY = side === 1 ? 'monde-du-ballon-v1' : `monde-du-ballon-v1-p${side}`;
      const BACKGROUND_VIDEO_KEY = side === 1 ? 'arena-background' : `arena-background-${side}`;

      let poolAverage = 1;
      const scene = $('scene');
      const worldCanvas = $('worldCanvas');
      const ctx = worldCanvas.getContext('2d');
      const statusLine = $('starMessage');
      const connection = $('connectionStatus');
      const usernameInput = $('tiktokUsername');
      const demoCoins = $('demoCoins');

      let socket = null;
      let closingPage = false;
      let reconnectTimer = 0;
      let pool = [];
      let poolIndex = 0;
      let poolSeed = 0;
      let balloons = [];
      let nextBalloonId = 0;
      let pendingShots = 0;
      let shotProcessingTimer = 0;
      let totalShots = 0;
      let totalPopped = 0;
      let totalStars = 0;
      let giftCount = 0;
      let pendingGifts = [];
      let players = {};
      let turnStarsByPlayer = {};
      let poolConfig = [];
      let isRoomOwner = true;
      let roomPlayers = 0;
      let avatars = new Map();
      let lastGameSync = 0;
      let lastFrameAt = 0;
      let shotEffects = [];
      let lastRemoteShotId = 0;
      let walletBannerTimer = 0;
      let shotResultBannerTimer = 0;
      let shotResultQueue = [];
      let remotePoolKey = '';
      let backgroundVideoObjectUrl = '';
      let pendingBackgroundMedia = null;
      let hasCustomBackground = false;

      /* ============================================================================
         3. GESTION DES MÉDIAS D'ARRIÈRE-PLAN (INDEXEDDB)
         ============================================================================ */
      function openBackgroundVideoDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(BACKGROUND_VIDEO_DATABASE, 1);
          request.onupgradeneeded = () => request.result.createObjectStore(BACKGROUND_VIDEO_STORE);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error('Base vidéo inaccessible.'));
        });
      }

      async function saveBackgroundMedia(blob) {
        const database = await openBackgroundVideoDatabase();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction(BACKGROUND_VIDEO_STORE, 'readwrite');
          transaction.objectStore(BACKGROUND_VIDEO_STORE).put(blob, BACKGROUND_VIDEO_KEY);
          transaction.oncomplete = () => { database.close(); resolve(); };
          transaction.onerror = () => { database.close(); reject(transaction.error || new Error('Enregistrement vidéo impossible.')); };
          transaction.onabort = () => { database.close(); reject(transaction.error || new Error('Enregistrement vidéo annulé.')); };
        });
      }

      async function loadBackgroundMedia() {
        const database = await openBackgroundVideoDatabase();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction(BACKGROUND_VIDEO_STORE, 'readonly');
          const request = transaction.objectStore(BACKGROUND_VIDEO_STORE).get(BACKGROUND_VIDEO_KEY);
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error || new Error('Lecture vidéo impossible.'));
          transaction.oncomplete = () => database.close();
          transaction.onerror = () => { database.close(); reject(transaction.error || new Error('Lecture vidéo impossible.')); };
        });
      }

      async function deleteBackgroundMedia() {
        const database = await openBackgroundVideoDatabase();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction(BACKGROUND_VIDEO_STORE, 'readwrite');
          transaction.objectStore(BACKGROUND_VIDEO_STORE).delete(BACKGROUND_VIDEO_KEY);
          transaction.oncomplete = () => { database.close(); resolve(); };
          transaction.onerror = () => { database.close(); reject(transaction.error || new Error('Suppression vidéo impossible.')); };
          transaction.onabort = () => { database.close(); reject(transaction.error || new Error('Suppression vidéo annulée.')); };
        });
      }

      function displayBackgroundMedia(blob) {
        const video = $('backgroundVideo');
        const image = $('backgroundImage');
        const removeButton = $('removeBackgroundMediaButton');
        if (backgroundVideoObjectUrl) URL.revokeObjectURL(backgroundVideoObjectUrl);
        backgroundVideoObjectUrl = '';
        if (!blob) {
          video.pause();
          video.removeAttribute('src');
          video.hidden = true;
          image.removeAttribute('src');
          image.hidden = true;
          scene.classList.remove('has-background-media');
          hasCustomBackground = false;
          removeButton.disabled = true;
          return;
        }
        backgroundVideoObjectUrl = URL.createObjectURL(blob);
        if (blob.type.startsWith('image/')) {
          video.pause();
          video.removeAttribute('src');
          video.hidden = true;
          image.src = backgroundVideoObjectUrl;
          image.hidden = false;
        } else if (blob.type.startsWith('video/')) {
          image.removeAttribute('src');
          image.hidden = true;
          video.src = backgroundVideoObjectUrl;
          video.hidden = false;
          video.play().catch(error => console.warn('Lecture automatique de la vidéo impossible :', error));
        } else {
          URL.revokeObjectURL(backgroundVideoObjectUrl);
          backgroundVideoObjectUrl = '';
          removeButton.disabled = true;
          return;
        }
        scene.classList.add('has-background-media');
        hasCustomBackground = true;
        removeButton.disabled = false;
      }

      async function restoreBackgroundMedia() {
        const status = $('backgroundMediaStatus');
        try {
          const blob = await loadBackgroundMedia();
          if (blob) {
            displayBackgroundMedia(blob);
            status.textContent = `${blob.type.startsWith('image/') ? 'Image' : 'Vidéo'} enregistrée et chargée.`;
          }
        } catch (error) {
          status.textContent = 'Impossible de restaurer le fond enregistré sur cet appareil.';
        }
      }

      /* ============================================================================
         4. LOGIQUE DU BASSIN DÉTERMINISTE ET DES JOUEURS
         ============================================================================ */
      function makeDefaultPoolConfig() {
        const prizes = [
          { stars: 0, count: DEFAULT_POOL_SIZE - 5671 },
          { stars: 1, count: 4000 },
          { stars: 2, count: 1000 },
          { stars: 3, count: 500 },
          { stars: 5, count: 150 },
          { stars: 10, count: 10 },
          { stars: 20, count: 5 },
          { stars: 30, count: 3 },
          { stars: 50, count: 2 },
          { stars: 100, count: 1 }
        ];
        return prizes.map((prize, index) => ({ id: `prize-${index + 1}`, ...prize }));
      }

      function isLegacyDefaultPoolConfig(rows) {
        if (!Array.isArray(rows)) return false;
        if (rows.length === 101 && rows[0].stars === 0 && rows[0].count === 9000 &&
            rows[1].stars === 100 && rows[1].count === 2) return true;
        return false;
      }

      function makeRandom(seed) {
        let state = seed >>> 0 || 1;
        return () => {
          state ^= state << 13;
          state ^= state >>> 17;
          state ^= state << 5;
          return (state >>> 0) / 4294967296;
        };
      }

      function createPool(seed, prizeRows = poolConfig) {
        const rewards = [];
        const random = makeRandom(seed);
        for (const row of prizeRows) {
          for (let index = 0; index < row.count; index++) rewards.push(row.stars);
        }
        if (!rewards.length || rewards.length > MAX_POOL_SIZE) {
          throw new RangeError('Le bassin doit contenir entre 1 et 100 000 ballons.');
        }
        for (let index = rewards.length - 1; index > 0; index--) {
          const target = Math.floor(random() * (index + 1));
          [rewards[index], rewards[target]] = [rewards[target], rewards[index]];
        }
        poolAverage = rewards.length
          ? rewards.reduce((total, reward) => total + reward, 0) / rewards.length
          : 0;
        return rewards;
      }

      function cleanPoolConfig(rows) {
        if (!Array.isArray(rows) || rows.length < 1 || rows.length > 200) return null;
        const cleaned = [];
        let total = 0;
        for (const row of rows) {
          const stars = Number(row?.stars);
          const count = Number(row?.count);
          if (!Number.isSafeInteger(stars) || stars < 0 || stars > 100000 ||
              !Number.isSafeInteger(count) || count < 0 || count > MAX_POOL_SIZE) return null;
          if (count === 0) continue;
          total += count;
          if (total > MAX_POOL_SIZE) return null;
          cleaned.push({
            id: typeof row.id === 'string' ? row.id.slice(0, 40) : `prize-${cleaned.length + 1}`,
            stars,
            count
          });
        }
        return total > 0 ? cleaned : null;
      }

      function newSeed() {
        const values = new Uint32Array(1);
        crypto.getRandomValues(values);
        return values[0] || 1;
      }

      function normalizePlayers(source) {
        if (!source || typeof source !== 'object' || Array.isArray(source)) return {};
        return Object.fromEntries(Object.entries(source).flatMap(([key, value]) => {
          if (!value || typeof value !== 'object' || typeof value.username !== 'string') return [];
          const stars = Number(value.stars);
          const shots = Number(value.shots);
          if (!Number.isFinite(stars) || stars < 0 ||
              !Number.isSafeInteger(shots) || shots < 0) return [];
          return [[key, {
            username: value.username.slice(0, 32),
            stars: Math.round(stars),
            shots
          }]];
        }));
      }

      function normalizeTurnResults(source) {
        if (!source || typeof source !== 'object' || Array.isArray(source)) return {};
        return Object.fromEntries(Object.values(source).flatMap(value => {
          if (!value || typeof value !== 'object' || typeof value.username !== 'string') return [];
          const username = value.username.trim().replace(/^@/, '').slice(0, 32);
          const stars = Number(value.stars);
          if (!username || !Number.isSafeInteger(stars) || stars < 0) return [];
          return [[playerKeyFor(username), { username, stars }]];
        }));
      }

      function sumPlayerStars(playerList) {
        return Object.values(playerList).reduce((total, player) => total + player.stars, 0);
      }

      function awardGlobalStars(username, amount) {
        if (amount > 0 && window.ArcadeStars) {
          window.ArcadeStars.award({ username, amount })
            .catch(error => console.error('Impossible d’ajouter les étoiles du Monde du Ballon au solde global :', error));
        }
      }

      function playerKeyFor(username) {
        return `user:${String(username || '').trim().replace(/^@/, '').toLocaleLowerCase('fr-FR')}`;
      }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (!saved || !Number.isSafeInteger(saved.seed) || !Number.isSafeInteger(saved.poolIndex)) return false;
          poolSeed = saved.seed;
          const savedPoolConfig = cleanPoolConfig(saved.poolConfig);
          const migrateDefaultPool = isLegacyDefaultPoolConfig(savedPoolConfig);
          poolConfig = migrateDefaultPool ? makeDefaultPoolConfig() : savedPoolConfig || makeDefaultPoolConfig();
          pool = createPool(poolSeed, poolConfig);
          if (!migrateDefaultPool && (saved.poolIndex < 0 || saved.poolIndex > pool.length)) return false;
          poolIndex = migrateDefaultPool ? 0 : saved.poolIndex;
          balloons = !migrateDefaultPool && Array.isArray(saved.balloons)
            ? saved.balloons.filter(item => Number.isSafeInteger(item.reward) && item.reward >= 0 &&
              item.reward <= 100000).slice(0, MAX_BALLOONS).map(item => createBalloonFromData(item))
            : [];
          pendingGifts = Array.isArray(saved.pendingGifts)
            ? saved.pendingGifts.filter(item => item && typeof item.username === 'string' &&
              typeof item.giftName === 'string' && Number.isSafeInteger(item.remaining) && item.remaining > 0)
              .slice(0, 5000)
            : [];
          pendingGifts.forEach(gift => storeAvatar(gift.username, gift.avatarUrl || ''));
          pendingShots = pendingGifts.reduce((total, item) => total + item.remaining, 0);
          totalShots = Number.isSafeInteger(saved.totalShots) && saved.totalShots >= 0 ? saved.totalShots : 0;
          totalPopped = Number.isSafeInteger(saved.totalPopped) && saved.totalPopped >= 0 ? saved.totalPopped : 0;
          giftCount = Number.isSafeInteger(saved.giftCount) && saved.giftCount >= 0 ? saved.giftCount : 0;
          players = normalizePlayers(saved.players);
          turnStarsByPlayer = normalizeTurnResults(saved.turnStarsByPlayer);
          totalStars = sumPlayerStars(players);
          return true;
        } catch (error) {
          return false;
        }
      }

      function startNewPool() {
        poolSeed = newSeed();
        poolConfig = cleanPoolConfig(poolConfig) || makeDefaultPoolConfig();
        pool = createPool(poolSeed, poolConfig);
        poolIndex = 0;
      }

      function takeReward() {
        if (poolIndex >= pool.length) return null;
        return pool[poolIndex++];
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            seed: poolSeed,
            poolIndex,
            poolConfig,
            balloons: balloons.map(balloon => ({
              reward: balloon.reward, x: balloon.x, y: balloon.y,
              speed: balloon.speed, drift: balloon.drift, phase: balloon.phase
            })),
            pendingGifts: pendingGifts.map(({ username, giftName, remaining, avatarUrl }) => ({
              username, giftName, remaining, avatarUrl
            })),
            totalShots,
            totalPopped,
            totalStars,
            giftCount,
            players,
            turnStarsByPlayer
          }));
        } catch (error) {
          statusLine.textContent = 'La sauvegarde locale est indisponible ; la partie continue.';
        }
      }

      function serializeGameState() {
        return {
          seed: poolSeed,
          poolIndex,
          poolConfig,
          balloons: balloons.map(balloon => ({
            id: balloon.id, reward: balloon.reward, x: balloon.x, y: balloon.y,
            speed: balloon.speed, drift: balloon.drift, phase: balloon.phase
          })),
          pendingGifts: pendingGifts.map(({ username, giftName, remaining, avatarUrl }) => ({
            username, giftName, remaining, avatarUrl
          })),
          totalShots,
          totalPopped,
          totalStars,
          giftCount,
          players,
          turnStarsByPlayer,
          message: statusLine.textContent,
          effects: shotEffects.slice(-MAX_SHOTS_PER_FRAME).map(({ shotId, username, x, y, earnedStars, color }) => ({
            shotId, username, x, y, earnedStars, color
          }))
        };
      }

      function synchronizeGameState(force = false) {
        if (!isRoomOwner || socket?.readyState !== WebSocket.OPEN) return;
        const now = performance.now();
        if (!force && now - lastGameSync < 500) return;
        lastGameSync = now;
        const state = serializeGameState();
        socket.send(JSON.stringify({ action: 'BALLOON_GAME_SYNC', state }));
      }

      function applySharedState(state) {
        if (!state || typeof state !== 'object' || !Number.isSafeInteger(state.seed) ||
            !Number.isSafeInteger(state.poolIndex)) return;
        const newPoolConfig = cleanPoolConfig(state.poolConfig);
        if (!newPoolConfig) return;
        const poolKey = `${state.seed}:${JSON.stringify(newPoolConfig)}`;
        if (poolKey !== remotePoolKey) {
          poolConfig = newPoolConfig;
          poolSeed = state.seed;
          pool = createPool(poolSeed, poolConfig);
          remotePoolKey = poolKey;
        }
        if (state.poolIndex < 0 || state.poolIndex > pool.length) return;
        poolIndex = state.poolIndex;
        balloons = Array.isArray(state.balloons)
          ? state.balloons.filter(balloon => Number.isSafeInteger(balloon.id) &&
            Number.isSafeInteger(balloon.reward) && Number.isFinite(balloon.x) &&
            Number.isFinite(balloon.y) && Number.isFinite(balloon.speed))
            .slice(0, MAX_BALLOONS).map(balloon => createBalloonFromData(balloon, balloon.id))
          : [];
        nextBalloonId = balloons.reduce((maximum, balloon) => Math.max(maximum, balloon.id), nextBalloonId);
        pendingGifts = Array.isArray(state.pendingGifts) ? state.pendingGifts
          .filter(gift => gift && typeof gift.username === 'string' &&
            typeof gift.giftName === 'string' && Number.isSafeInteger(gift.remaining) &&
            gift.remaining > 0).slice(0, 5000) : [];
        pendingGifts.forEach(gift => storeAvatar(gift.username, gift.avatarUrl || ''));
        pendingShots = pendingGifts.reduce((total, gift) => total + gift.remaining, 0);
        totalShots = Number.isSafeInteger(state.totalShots) ? Math.max(0, state.totalShots) : 0;
        totalPopped = Number.isSafeInteger(state.totalPopped) ? Math.max(0, state.totalPopped) : 0;
        giftCount = Number.isSafeInteger(state.giftCount) ? Math.max(0, state.giftCount) : 0;
        players = normalizePlayers(state.players);
        turnStarsByPlayer = normalizeTurnResults(state.turnStarsByPlayer);
        totalStars = sumPlayerStars(players);
        if (typeof state.message === 'string') statusLine.textContent = state.message.slice(0, 240);
        if (Array.isArray(state.effects)) {
          state.effects
            .filter(effect => effect && Number.isSafeInteger(effect.shotId) &&
              effect.shotId > lastRemoteShotId && Number.isFinite(effect.x) && Number.isFinite(effect.y))
            .slice(-MAX_SHOTS_PER_FRAME)
            .forEach(effect => {
              const pal = LATEX_PALETTES[effect.shotId % LATEX_PALETTES.length];
              shotEffects.push({
                shotId: effect.shotId,
                username: typeof effect.username === 'string' ? effect.username.slice(0, 32) : 'Spectateur',
                x: Math.max(1, Math.min(99, effect.x)),
                y: Math.max(-12, Math.min(100, effect.y)),
                earnedStars: Number.isSafeInteger(effect.earnedStars) ? Math.max(0, effect.earnedStars) : 0,
                color: pal.base,
                palette: pal,
                startedAt: performance.now()
              });
              lastRemoteShotId = Math.max(lastRemoteShotId, effect.shotId);
            });
          if (shotEffects.length > MAX_VISIBLE_SHOT_EFFECTS) {
            shotEffects.splice(0, shotEffects.length - MAX_VISIBLE_SHOT_EFFECTS);
          }
        }
        renderMetrics();
        renderPoolEditor();
        saveState();
      }

      /* ============================================================================
         5. PHYSIQUE DES BALLONS, SYSTÈME DE PARTICULES ET RENDU 3D VOLUMÉTRIQUE
         ============================================================================ */
      let latexShards = [];
      let shockwaves = [];
      let sparkles = [];
      let cameraShake = 0;


      function createBalloon(reward, y = -8) {
        const id = ++nextBalloonId;
        const palette = LATEX_PALETTES[id % LATEX_PALETTES.length];
        return {
          id,
          reward,
          x: 4 + Math.random() * 92,
          y,
          vx: 0,
          vy: 0,
          speed: 22 + Math.random() * 44,
          drift: (Math.random() - 0.5) * 9,
          phase: Math.random() * Math.PI * 2,
          tilt: 0,
          angularVel: 0,
          scalePulse: 0.94 + Math.random() * 0.14,
          palette,
          stringNodes: Array.from({ length: 6 }, (_, i) => ({ dx: 0, dy: i * 7 }))
        };
      }

      function createBalloonFromData(item, forcedId = null) {
        const id = forcedId ?? ++nextBalloonId;
        const palette = LATEX_PALETTES[id % LATEX_PALETTES.length];
        return {
          id,
          reward: item.reward,
          x: Number.isFinite(item.x) ? Math.max(2, Math.min(98, item.x)) : 4 + Math.random() * 92,
          y: Number.isFinite(item.y) ? Math.max(-14, Math.min(102, item.y)) : Math.random() * 95,
          vx: 0,
          vy: 0,
          speed: Number.isFinite(item.speed) ? Math.max(14, Math.min(130, item.speed)) : 25 + Math.random() * 42,
          drift: Number.isFinite(item.drift) ? Math.max(-10, Math.min(10, item.drift)) : (Math.random() - 0.5) * 8,
          phase: Number.isFinite(item.phase) ? item.phase : Math.random() * Math.PI * 2,
          tilt: 0,
          angularVel: 0,
          scalePulse: 0.96 + Math.random() * 0.1,
          palette,
          stringNodes: Array.from({ length: 6 }, (_, i) => ({ dx: 0, dy: i * 7 }))
        };
      }

      function fillBalloonField(initial = false, render = true, synchronize = true) {
        if (!isRoomOwner) return;
        let startedNewRound = false;
        if (poolIndex >= pool.length && balloons.length === 0) {
          const finishedPoolSize = pool.length;
          startNewPool();
          startedNewRound = true;
          statusLine.textContent =
            `🎈 Les ${formatNumber(finishedPoolSize)} ballons sont terminés : une nouvelle manche commence !`;
        }
        const target = initial ? INITIAL_BALLOONS : MAX_BALLOONS;
        while (balloons.length < target && poolIndex < pool.length) {
          const reward = takeReward();
          if (reward === null) break;
          balloons.push(createBalloon(reward, initial ? Math.random() * 82 + 4 : -8 - Math.random() * 16));
        }
        if (synchronize || startedNewRound) synchronizeGameState(startedNewRound);
      }

      function balloonPixels(balloon, width = worldCanvas.clientWidth, height = worldCanvas.clientHeight) {
        const fieldTop = height * 0.02;
        const fieldBottom = height * 0.86;
        const fieldLeft = width * 0.03;
        const fieldRight = width * 0.97;
        return {
          x: fieldLeft + (fieldRight - fieldLeft) * (balloon.x / 100),
          y: fieldTop + (fieldBottom - fieldTop) * (balloon.y / 100)
        };
      }

      function spawnBalloonDestruction(px, py, palette, stars = 0) {
        // 1. Onde de choc de décompression de l'air
        shockwaves.push({
          x: px,
          y: py,
          radius: 8,
          maxRadius: stars > 0 ? 85 : 58,
          alpha: 0.85,
          color: stars > 0 ? '#fff3a8' : '#ffffff',
          born: performance.now()
        });

        // 2. Lambeaux de latex en caoutchouc qui tombent avec gravité et traînée aérodynamique
        const shardCount = 12;
        for (let i = 0; i < shardCount; i++) {
          const angle = (Math.PI * 2 * i) / shardCount + (Math.random() - 0.5) * 0.4;
          const speed = 110 + Math.random() * 210;
          latexShards.push({
            x: px + Math.cos(angle) * 6,
            y: py + Math.sin(angle) * 6,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 60,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 18,
            w: 7 + Math.random() * 9,
            h: 4 + Math.random() * 6,
            color: i % 3 === 0 ? palette.light : (i % 2 === 0 ? palette.base : palette.dark),
            alpha: 1,
            life: 0,
            maxLife: 0.75 + Math.random() * 0.45
          });
        }

        // 3. Étincelles dorées et confettis si gain d'étoiles
        const sparkCount = stars > 0 ? Math.min(36, 12 + Math.ceil(Math.log2(stars + 1) * 5)) : 6;
        for (let i = 0; i < sparkCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 50 + Math.random() * (stars > 0 ? 240 : 120);
          sparkles.push({
            x: px,
            y: py,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 45,
            size: stars > 0 ? 2.5 + Math.random() * 3.5 : 1.5 + Math.random() * 2,
            color: stars > 0 ? (i % 2 === 0 ? '#ffe875' : '#ffffff') : '#ffffffaa',
            life: 0,
            maxLife: 0.55 + Math.random() * 0.55
          });
        }

        if (stars >= 10) {
          cameraShake = Math.min(12, cameraShake + 5);
        } else if (stars > 0) {
          cameraShake = Math.min(8, cameraShake + 2);
        }
      }

      function showBalloonReward(effect) {
        const pt = balloonPixels({ x: effect.x, y: effect.y });
        const label = document.createElement('div');
        label.className = 'pop-effect';
        label.setAttribute('aria-hidden', 'true');
        label.textContent = effect.earnedStars > 0 ? `+${formatNumber(effect.earnedStars)} ⭐` : '💥';
        label.style.left = `${pt.x}px`;
        label.style.top = `${pt.y}px`;
        const existingLabels = scene.querySelectorAll('.pop-effect');
        if (existingLabels.length >= 35) existingLabels[0].remove();
        label.addEventListener('animationend', () => label.remove(), { once: true });
        scene.append(label);
      }

      /* ============================================================================
         6. DESSIN DU DÉCOR FÊTE FORAINE, BALLONS LATEX
         ============================================================================ */
      /* Fond de la partie 2 : nuit étoilée, aurore boréale, ville illuminée et lampadaires */
      const nightRandom = makeRandom(20260722);
      const nightStars = Array.from({ length: 120 }, () => ({
        x: nightRandom(), y: nightRandom() * 0.78, r: 0.6 + nightRandom() * 1.5,
        phase: nightRandom() * Math.PI * 2, speed: 0.001 + nightRandom() * 0.003
      }));
      const nightBuildings = [0, 1].map(layer => {
        const list = [];
        let x = -0.02;
        while (x < 1.02) {
          const w = 0.035 + nightRandom() * 0.045;
          list.push({
            x, w,
            h: (layer === 0 ? 0.10 : 0.06) + nightRandom() * (layer === 0 ? 0.16 : 0.10),
            seed: Math.floor(nightRandom() * 1e6),
            roof: nightRandom()
          });
          x += w + (layer === 0 ? 0.004 : 0.002);
        }
        return list;
      });

      function drawNightEnvironment(width, height, timestamp) {
        const groundY = height * 0.88;

        if (!hasCustomBackground) {
          // Ciel nocturne
          const sky = ctx.createLinearGradient(0, 0, 0, groundY);
          sky.addColorStop(0, '#040920');
          sky.addColorStop(0.5, '#14245a');
          sky.addColorStop(0.85, '#3a2f72');
          sky.addColorStop(1, '#8a4f8c');
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, width, groundY);

          // Étoiles scintillantes
          nightStars.forEach(star => {
            const twinkle = Math.max(0, 0.5 + 0.5 * Math.sin(timestamp * star.speed + star.phase));
            ctx.fillStyle = `rgba(255, 255, 240, ${0.2 + 0.8 * twinkle})`;
            ctx.beginPath();
            ctx.arc(star.x * width, star.y * groundY, star.r, 0, Math.PI * 2);
            ctx.fill();
          });

          // Aurore boréale ondulante
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const auroraColors = ['80, 255, 170', '90, 200, 255', '190, 120, 255'];
          for (let band = 0; band < 3; band++) {
            const baseY = groundY * (0.22 + band * 0.10);
            const grad = ctx.createLinearGradient(0, baseY - height * 0.12, 0, baseY + height * 0.10);
            grad.addColorStop(0, `rgba(${auroraColors[band]}, 0)`);
            grad.addColorStop(0.5, `rgba(${auroraColors[band]}, 0.2)`);
            grad.addColorStop(1, `rgba(${auroraColors[band]}, 0)`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(0, baseY + height * 0.10);
            for (let x = 0; x <= width + 1; x += width / 24) {
              const y = baseY
                + Math.sin(x * 0.004 + timestamp * 0.0004 * (1 + band * 0.3) + band * 2) * height * 0.04
                + Math.sin(x * 0.011 - timestamp * 0.0006) * height * 0.015;
              ctx.lineTo(x, y);
            }
            ctx.lineTo(width, baseY + height * 0.10);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();

          // Pleine lune avec halo et cratères
          const moonX = width * 0.16;
          const moonY = height * 0.17;
          const moonR = Math.max(26, Math.min(width, height) * 0.07);
          const halo = ctx.createRadialGradient(moonX, moonY, moonR * 0.6, moonX, moonY, moonR * 4.2);
          halo.addColorStop(0, 'rgba(235, 240, 255, 0.55)');
          halo.addColorStop(0.35, 'rgba(190, 205, 255, 0.16)');
          halo.addColorStop(1, 'rgba(190, 205, 255, 0)');
          ctx.fillStyle = halo;
          ctx.fillRect(0, 0, width, groundY);
          const moonGrad = ctx.createRadialGradient(moonX - moonR * 0.3, moonY - moonR * 0.3, moonR * 0.1, moonX, moonY, moonR);
          moonGrad.addColorStop(0, '#fffdf0');
          moonGrad.addColorStop(1, '#d9d6bd');
          ctx.fillStyle = moonGrad;
          ctx.beginPath();
          ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(150, 150, 125, 0.22)';
          [[-0.35, -0.2, 0.2], [0.3, 0.25, 0.26], [0.1, -0.45, 0.12], [-0.25, 0.4, 0.14]].forEach(([cx, cy, cr]) => {
            ctx.beginPath();
            ctx.arc(moonX + cx * moonR, moonY + cy * moonR, cr * moonR, 0, Math.PI * 2);
            ctx.fill();
          });

          // Étoile filante périodique
          const cycle = 8000;
          const shootT = (timestamp % cycle) / cycle;
          if (shootT < 0.09) {
            const rand = makeRandom(Math.floor(timestamp / cycle) * 7919 + 13);
            const progress = shootT / 0.09;
            const headX = width * (0.35 + rand() * 0.6) - progress * width * 0.25;
            const headY = groundY * (0.05 + rand() * 0.25) + progress * height * 0.12;
            const trail = ctx.createLinearGradient(headX + width * 0.07, headY - height * 0.034, headX, headY);
            trail.addColorStop(0, 'rgba(255, 255, 255, 0)');
            trail.addColorStop(1, `rgba(255, 255, 255, ${1 - progress})`);
            ctx.save();
            ctx.strokeStyle = trail;
            ctx.lineWidth = 2.2;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(headX + width * 0.07, headY - height * 0.034);
            ctx.lineTo(headX, headY);
            ctx.stroke();
            ctx.restore();
          }

          // Skyline de ville : deux plans, fenêtres éclairées
          const layerColors = ['#080d2c', '#161e56'];
          for (let layer = 1; layer >= 0; layer--) {
            nightBuildings[layer].forEach(building => {
              const bx = building.x * width;
              const bw = building.w * width;
              const bh = building.h * height;
              const top = groundY - bh;
              ctx.fillStyle = layerColors[layer];
              ctx.fillRect(bx, top, bw, bh + 2);
              if (building.roof > 0.72) {
                ctx.fillRect(bx + bw * 0.48, top - bh * 0.18, 2, bh * 0.18);
                ctx.fillStyle = 'rgba(255, 70, 70, 0.9)';
                ctx.fillRect(bx + bw * 0.48 - 1, top - bh * 0.18 - 2, 4, 3);
              }
              const cols = Math.max(1, Math.floor((bw - 6) / 9));
              const rows = Math.max(1, Math.floor((bh - 8) / 11));
              for (let col = 0; col < cols; col++) {
                for (let row = 0; row < rows; row++) {
                  const hash = (Math.imul(building.seed + col * 31, 374761393) ^ Math.imul(row * 17 + 5, 668265263)) >>> 0;
                  if (hash % 100 < (layer === 0 ? 40 : 18)) {
                    ctx.fillStyle = layer === 0 ? 'rgba(255, 217, 138, 0.92)' : 'rgba(255, 217, 138, 0.45)';
                    ctx.fillRect(bx + 4 + col * 9, top + 6 + row * 11, 4, 6);
                  }
                }
              }
            });
          }
        }

        // Sol nocturne
        const groundGrad = ctx.createLinearGradient(0, groundY, 0, height);
        groundGrad.addColorStop(0, '#2b5a55');
        groundGrad.addColorStop(0.14, '#1c3f40');
        groundGrad.addColorStop(0.24, '#2c2a45');
        groundGrad.addColorStop(1, '#14121f');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, groundY, width, height - groundY);
        ctx.fillStyle = '#3f7a6a';
        ctx.fillRect(0, groundY, width, 4);

        // Lampadaires avec halo chaud
        [0.1, 0.3, 0.5, 0.7, 0.9].forEach((fraction, index) => {
          const lx = width * fraction;
          const postH = height * 0.10;
          const flicker = 0.9 + 0.1 * Math.sin(timestamp * 0.004 + index * 1.9);
          ctx.fillStyle = '#10142a';
          ctx.fillRect(lx - 1.5, groundY - postH, 3, postH + 3);
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const glow = ctx.createRadialGradient(lx, groundY - postH, 2, lx, groundY - postH, 78);
          glow.addColorStop(0, `rgba(255, 214, 130, ${0.75 * flicker})`);
          glow.addColorStop(0.3, `rgba(255, 190, 100, ${0.22 * flicker})`);
          glow.addColorStop(1, 'rgba(255, 190, 100, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(lx, groundY - postH, 78, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          ctx.fillStyle = '#fff2c4';
          ctx.beginPath();
          ctx.arc(lx, groundY - postH, 4, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      /* Fond de la partie 1 : paysage de campagne réaliste en plein jour
         (montagnes enneigées dans la brume, collines boisées, nuages ombrés,
         oiseaux, prairie avec herbes et fleurs au vent, clôture en bois) */
      const dayRandom = makeRandom(48151);
      const ridgePhases = Array.from({ length: 4 }, () => dayRandom() * Math.PI * 2);
      const ridgeWeights = [1, 0.5, 0.33, 0.25];
      const ridgeNorm = ridgeWeights.reduce((total, weight) => total + weight, 0);
      function ridgeValue(x, layer) {
        let sum = 0;
        for (let i = 0; i < 4; i++) {
          sum += ridgeWeights[i] * (1 - Math.abs(Math.sin((x * (2.2 + i * i * 1.9) + ridgePhases[i] + layer * 1.7) * Math.PI)));
        }
        return sum / ridgeNorm;
      }
      function hillValue(x, seed) {
        return 0.5 + 0.28 * Math.sin(x * 5.2 + seed) + 0.14 * Math.sin(x * 11.7 + seed * 2.3) + 0.08 * Math.sin(x * 23.1 + seed * 4.1);
      }
      const dayTrees = Array.from({ length: 30 }, () => ({ x: dayRandom(), scale: 0.7 + dayRandom() * 0.7, conifer: dayRandom() < 0.4 }));
      const dayBlades = Array.from({ length: 280 }, () => ({
        x: dayRandom(), t: Math.pow(dayRandom(), 0.8), h: 6 + dayRandom() * 14,
        phase: dayRandom() * Math.PI * 2, shade: Math.floor(dayRandom() * 4)
      }));
      const dayBladeGroups = [0, 1, 2, 3].map(shade => dayBlades.filter(blade => blade.shade === shade));
      const dayBladeColors = ['#4d7f32', '#5f9440', '#3a6a28', '#86b45a'];
      const dayFlowers = Array.from({ length: 40 }, () => ({
        x: dayRandom(), t: 0.1 + dayRandom() * 0.9, color: Math.floor(dayRandom() * 5),
        phase: dayRandom() * Math.PI * 2, size: 0.8 + dayRandom() * 0.6
      }));
      const dayFlowerColors = ['#fff6d8', '#ffd84a', '#ff8fb3', '#b49bff', '#ff7a5a'];
      const dayBirds = Array.from({ length: 7 }, () => ({
        x: dayRandom(), y: 0.1 + dayRandom() * 0.22, speed: 0.000012 + dayRandom() * 0.00001,
        size: 6 + dayRandom() * 5, phase: dayRandom() * Math.PI * 2
      }));
      const dayCloudDefs = [
        { x: 0.06, y: 0.10, scale: 1.15, speed: 0.45, seed: 11, alpha: 0.96 },
        { x: 0.40, y: 0.05, scale: 0.78, speed: 0.28, seed: 23, alpha: 0.88 },
        { x: 0.70, y: 0.17, scale: 0.95, speed: 0.36, seed: 37, alpha: 0.94 },
        { x: 0.28, y: 0.24, scale: 0.6, speed: 0.2, seed: 53, alpha: 0.8 },
        { x: 0.90, y: 0.07, scale: 0.7, speed: 0.32, seed: 71, alpha: 0.85 }
      ];
      let dayCloudSprites = null;

      function makeCloudSprite(seed) {
        const rand = makeRandom(seed);
        const sprite = document.createElement('canvas');
        sprite.width = 340;
        sprite.height = 150;
        const g = sprite.getContext('2d');
        const puffs = [];
        for (let i = 0; i < 9; i++) puffs.push({ x: 40 + i * 28 + rand() * 10, y: 100 + rand() * 8, r: 24 + rand() * 12 });
        for (let i = 0; i < 6; i++) puffs.push({ x: 70 + i * 34 + rand() * 12, y: 70 - rand() * 14 - (i > 1 && i < 4 ? 14 : 0), r: 28 + rand() * 16 });
        puffs.push({ x: 130 + rand() * 30, y: 46 + rand() * 8, r: 34 + rand() * 10 });
        puffs.forEach(puff => {
          const grad = g.createRadialGradient(puff.x + puff.r * 0.25, puff.y - puff.r * 0.35, puff.r * 0.1, puff.x, puff.y, puff.r);
          grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
          grad.addColorStop(0.6, 'rgba(244, 249, 252, 0.97)');
          grad.addColorStop(1, 'rgba(214, 228, 238, 0)');
          g.fillStyle = grad;
          g.beginPath();
          g.arc(puff.x, puff.y, puff.r, 0, Math.PI * 2);
          g.fill();
        });
        g.globalCompositeOperation = 'source-atop';
        const shade = g.createLinearGradient(0, 40, 0, 140);
        shade.addColorStop(0, 'rgba(170, 195, 220, 0)');
        shade.addColorStop(0.55, 'rgba(150, 175, 205, 0.18)');
        shade.addColorStop(1, 'rgba(110, 140, 175, 0.6)');
        g.fillStyle = shade;
        g.fillRect(0, 0, 340, 150);
        return sprite;
      }

      function drawFairgroundEnvironment(width, height, timestamp) {
        if (side === 2) { drawNightEnvironment(width, height, timestamp); return; }
        const groundY = height * 0.88;
        const sunX = width * 0.84;
        const sunY = height * 0.16;
        const wind = Math.sin(timestamp * 0.0007) * 0.6 + Math.sin(timestamp * 0.0017) * 0.3;
        const nearHillY = x => groundY - height * 0.03 - hillValue(x, 4.1) * height * 0.035;

        if (!hasCustomBackground) {
          // Ciel avec brume d'horizon
          const sky = ctx.createLinearGradient(0, 0, 0, groundY);
          sky.addColorStop(0, '#2d7cc0');
          sky.addColorStop(0.42, '#6db3de');
          sky.addColorStop(0.78, '#bddfea');
          sky.addColorStop(1, '#eef0dc');
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, width, groundY);

          // Soleil : halo, rayons très doux et disque
          const bloom = ctx.createRadialGradient(sunX, sunY, 6, sunX, sunY, Math.max(width, height) * 0.55);
          bloom.addColorStop(0, 'rgba(255, 252, 225, 0.95)');
          bloom.addColorStop(0.08, 'rgba(255, 240, 170, 0.6)');
          bloom.addColorStop(0.3, 'rgba(255, 230, 150, 0.16)');
          bloom.addColorStop(1, 'rgba(255, 230, 150, 0)');
          ctx.fillStyle = bloom;
          ctx.fillRect(0, 0, width, groundY);
          ctx.save();
          ctx.translate(sunX, sunY);
          for (let r = 0; r < 6; r++) {
            ctx.save();
            ctx.rotate((r * Math.PI) / 6 + Math.sin(timestamp * 0.00018 + r) * 0.06 + 0.4);
            const ray = ctx.createLinearGradient(0, 0, height * 0.9, 0);
            ray.addColorStop(0, 'rgba(255, 248, 200, 0.10)');
            ray.addColorStop(1, 'rgba(255, 248, 200, 0)');
            ctx.fillStyle = ray;
            ctx.beginPath();
            ctx.moveTo(0, -8);
            ctx.lineTo(height * 0.95, -60);
            ctx.lineTo(height * 0.95, 60);
            ctx.lineTo(0, 8);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
          ctx.restore();
          ctx.fillStyle = '#fffef0';
          ctx.beginPath();
          ctx.arc(sunX, sunY, 17, 0, Math.PI * 2);
          ctx.fill();

          // Nuages cumulus ombrés (sprites pré-calculés)
          if (!dayCloudSprites) dayCloudSprites = dayCloudDefs.map(def => makeCloudSprite(def.seed));
          const cloudScale = Math.min(1.4, Math.max(0.6, width / 900));
          dayCloudDefs.forEach((def, index) => {
            const cx = ((def.x + timestamp * 0.00001 * def.speed * 100) % 1.3 - 0.2) * width;
            ctx.globalAlpha = def.alpha;
            ctx.drawImage(dayCloudSprites[index], cx, def.y * height, 340 * def.scale * cloudScale, 150 * def.scale * cloudScale);
          });
          ctx.globalAlpha = 1;

          // Oiseaux en vol
          ctx.save();
          ctx.strokeStyle = '#26343e';
          ctx.lineWidth = 1.6;
          ctx.lineCap = 'round';
          dayBirds.forEach(bird => {
            const bx = ((bird.x + timestamp * bird.speed) % 1.2 - 0.1) * width;
            const by = (bird.y + Math.sin(timestamp * 0.0006 + bird.phase) * 0.012) * height;
            const flap = Math.sin(timestamp * 0.011 + bird.phase);
            const s = bird.size;
            ctx.beginPath();
            ctx.moveTo(bx - s, by - flap * s * 0.5);
            ctx.quadraticCurveTo(bx - s * 0.5, by - s * 0.45, bx, by);
            ctx.quadraticCurveTo(bx + s * 0.5, by - s * 0.45, bx + s, by - flap * s * 0.5);
            ctx.stroke();
          });
          ctx.restore();

          // Montagnes (perspective atmosphérique : plus loin = plus pâle et brumeux)
          const drawMountains = (layer, baseY, amp, colorTop, colorBottom, hazeAlpha, snow) => {
            const step = Math.max(4, width / 220);
            const points = [];
            let minY = baseY;
            for (let x = 0; x <= width + step; x += step) {
              const y = baseY - ridgeValue(x / width, layer) * amp;
              points.push([x, y]);
              if (y < minY) minY = y;
            }
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            points.forEach(([x, y]) => ctx.lineTo(x, y));
            ctx.lineTo(width, groundY);
            ctx.closePath();
            const grad = ctx.createLinearGradient(0, minY, 0, groundY);
            if (snow) {
              grad.addColorStop(0, '#ffffff');
              grad.addColorStop(0.09, '#eef3f7');
              grad.addColorStop(0.2, '#b4c6d6');
              grad.addColorStop(0.38, colorTop);
            } else {
              grad.addColorStop(0, colorTop);
            }
            grad.addColorStop(1, colorBottom);
            ctx.fillStyle = grad;
            ctx.fill();
            const haze = ctx.createLinearGradient(0, minY, 0, groundY);
            haze.addColorStop(0, 'rgba(232, 240, 228, 0)');
            haze.addColorStop(1, `rgba(232, 240, 228, ${hazeAlpha})`);
            ctx.fillStyle = haze;
            ctx.fill();
          };
          drawMountains(0, groundY * 0.80, height * 0.30, '#8ea7c0', '#a5bbc6', 0.55, true);
          drawMountains(1, groundY * 0.88, height * 0.16, '#6f9396', '#8fb09a', 0.45, false);

          // Collines lointaines
          const drawHills = (seed, baseY, amp, colorTop, colorBottom, hazeAlpha) => {
            const step = Math.max(4, width / 200);
            ctx.beginPath();
            ctx.moveTo(0, groundY + 2);
            for (let x = 0; x <= width + step; x += step) {
              ctx.lineTo(x, baseY - hillValue(x / width, seed) * amp);
            }
            ctx.lineTo(width, groundY + 2);
            ctx.closePath();
            const grad = ctx.createLinearGradient(0, baseY - amp, 0, groundY);
            grad.addColorStop(0, colorTop);
            grad.addColorStop(1, colorBottom);
            ctx.fillStyle = grad;
            ctx.fill();
            if (hazeAlpha > 0) {
              ctx.fillStyle = `rgba(232, 240, 228, ${hazeAlpha})`;
              ctx.fill();
            }
          };
          drawHills(1.3, groundY - height * 0.055, height * 0.05, '#86ab70', '#a1c283', 0.22);

          // Grande roue lointaine posée sur la colline
          const wheelX = width * 0.24;
          const wheelR = Math.min(width, height) * 0.085;
          const wheelY = groundY - height * 0.17;
          ctx.save();
          ctx.strokeStyle = 'rgba(60, 84, 96, 0.6)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(wheelX, wheelY, wheelR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(wheelX, wheelY, wheelR * 0.72, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(wheelX, wheelY);
          ctx.lineTo(wheelX - wheelR * 0.5, groundY - height * 0.05);
          ctx.moveTo(wheelX, wheelY);
          ctx.lineTo(wheelX + wheelR * 0.5, groundY - height * 0.05);
          ctx.stroke();
          const spin = timestamp * 0.00025;
          for (let spoke = 0; spoke < 12; spoke++) {
            const a = spin + (spoke * Math.PI * 2) / 12;
            const gx = wheelX + Math.cos(a) * wheelR;
            const gy = wheelY + Math.sin(a) * wheelR;
            ctx.beginPath();
            ctx.moveTo(wheelX, wheelY);
            ctx.lineTo(gx, gy);
            ctx.stroke();
            ctx.fillStyle = spoke % 2 === 0 ? 'rgba(240, 190, 80, 0.9)' : 'rgba(220, 100, 90, 0.9)';
            ctx.beginPath();
            ctx.arc(gx, gy, 3, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();

          // Collines proches, puis arbres
          ctx.beginPath();
          ctx.moveTo(0, groundY + 2);
          const hillStep = Math.max(4, width / 200);
          for (let x = 0; x <= width + hillStep; x += hillStep) ctx.lineTo(x, nearHillY(x / width));
          ctx.lineTo(width, groundY + 2);
          ctx.closePath();
          const nearGrad = ctx.createLinearGradient(0, groundY - height * 0.07, 0, groundY);
          nearGrad.addColorStop(0, '#5d9042');
          nearGrad.addColorStop(1, '#6fa24c');
          ctx.fillStyle = nearGrad;
          ctx.fill();

          dayTrees.forEach(tree => {
            const tx = tree.x * width;
            const ty = nearHillY(tree.x) + 2;
            const th = height * 0.075 * tree.scale;
            ctx.fillStyle = '#4a3524';
            ctx.fillRect(tx - 1.5 * tree.scale, ty - th * 0.3, 3 * tree.scale, th * 0.32);
            if (tree.conifer) {
              for (let k = 0; k < 3; k++) {
                const half = th * (0.42 - k * 0.09);
                const y0 = ty - th * 0.25 - k * th * 0.26;
                ctx.fillStyle = k % 2 ? '#2f5e33' : '#27522d';
                ctx.beginPath();
                ctx.moveTo(tx - half, y0);
                ctx.lineTo(tx, y0 - th * 0.42);
                ctx.lineTo(tx + half, y0);
                ctx.closePath();
                ctx.fill();
              }
            } else {
              const r = th * 0.34;
              const cy = ty - th * 0.62;
              ctx.fillStyle = '#2f6a2c';
              ctx.beginPath(); ctx.arc(tx, cy, r, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = '#3f8438';
              ctx.beginPath(); ctx.arc(tx - r * 0.35, cy - r * 0.1, r * 0.72, 0, Math.PI * 2); ctx.fill();
              ctx.beginPath(); ctx.arc(tx + r * 0.4, cy + r * 0.1, r * 0.6, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = '#69a850';
              ctx.beginPath(); ctx.arc(tx + r * 0.25, cy - r * 0.35, r * 0.42, 0, Math.PI * 2); ctx.fill();
            }
          });

          // Reflets d'objectif du soleil
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          [[0.22, 26, '255, 220, 150', 0.10], [0.38, 14, '160, 210, 255', 0.12], [0.55, 40, '255, 190, 120', 0.07],
           [0.78, 20, '200, 255, 200', 0.08], [1.0, 52, '255, 200, 230', 0.06]].forEach(([t, radius, color, alpha]) => {
            const fx = sunX + (width * 0.5 - sunX) * t * 2;
            const fy = sunY + (height * 0.5 - sunY) * t * 2;
            const flare = ctx.createRadialGradient(fx, fy, 0, fx, fy, radius);
            flare.addColorStop(0, `rgba(${color}, ${alpha * 2})`);
            flare.addColorStop(1, `rgba(${color}, 0)`);
            ctx.fillStyle = flare;
            ctx.beginPath();
            ctx.arc(fx, fy, radius, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
        }

        // Prairie
        const groundGrad = ctx.createLinearGradient(0, groundY, 0, height);
        groundGrad.addColorStop(0, '#79ab50');
        groundGrad.addColorStop(0.18, '#5f9440');
        groundGrad.addColorStop(0.55, '#41722f');
        groundGrad.addColorStop(1, '#26451f');
