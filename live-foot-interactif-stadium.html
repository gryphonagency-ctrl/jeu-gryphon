// JOUEURS V3 : proportions athlétiques, muscles, motifs de maillot par équipe,
// visage détaillé (regard vers le ballon), ombre portée dynamique, éclairage.
// ============================================================================
const PLAYER_SCALE = 1.3; // taille globale des joueurs (réduis à 1.18 pour des joueurs plus petits)
const BOOT_COLORS = ['#0b1220', '#f8fafc', '#f97316', '#2563eb', '#a3e635', '#ec4899', '#facc15', '#14b8a6'];
const EYE_COLORS = ['#3b2a1a', '#4a3622', '#2f4f6f', '#3d5a3a', '#262626', '#5b3a1e'];
const JERSEY_PATTERNS = {
    barcelona: 'stripes',
    ac_milan: 'stripes',
    inter_milan: 'stripes',
    juventus: 'stripes',
    argentina: 'stripes',
    psg: 'band',
    griffon_united: 'band'
};

// ============================================================================
// JOUEURS 3D (Three.js) : modèles articulés (membres musclés, maillot texturé,
// visage, coiffures, crampons) rendus dans un sprite puis collés dans le canvas 2D
// (le tri en profondeur avec le but et le ballon reste donc identique).
// Touche V : bascule entre le rendu 3D et l'ancien rendu 2D.
// Si Three.js ne se charge pas (hors-ligne / WebGL absent), le jeu retombe en 2D.
// ============================================================================
const Players3D = (() => {
    const SW = 240, SH = 208;            // taille du sprite (px)
    const PPM = 80;                      // pixels par mètre dans le sprite
    const ELEV = 12 * Math.PI / 180;     // plongée de la caméra de retransmission
    const GROUND_ROW = SH - 1.9;         // ligne du sprite où les crampons touchent le sol
    const ANKLE_H = 0.095;               // hauteur cheville / sol
    const L_THIGH = 0.44, L_SHIN = 0.42, L_UPPER = 0.30, L_FORE = 0.27;
    let R = null;
    let failed = false;
    let enabled = true;
    const rigs = {};
    const G = {};

    const KEYS = {
        thigh: [[0, 0.088], [0.3, 0.083], [0.6, 0.068], [0.9, 0.055], [1, 0.05]],
        shin: [[0, 0.052], [0.18, 0.06], [0.5, 0.048], [0.85, 0.036], [1, 0.034]],
        upper: [[0, 0.052], [0.3, 0.052], [0.7, 0.043], [1, 0.037]],
        fore: [[0, 0.038], [0.25, 0.041], [0.7, 0.031], [1, 0.026]],
        torso: [[0, 0.145], [0.15, 0.158], [0.4, 0.175], [0.7, 0.205], [0.88, 0.215], [0.95, 0.185], [1, 0.11]]
    };

    function lerpProfile(keys, t) {
        for (let i = 0; i < keys.length - 1; i++) {
            const a = keys[i], b = keys[i + 1];
            if (t <= b[0]) {
                const u = (t - a[0]) / Math.max(1e-6, b[0] - a[0]);
                const e = 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, u)));
                return a[1] + (b[1] - a[1]) * e;
            }
        }
        return keys[keys.length - 1][1];
    }

    // Membre effilé (révolution) : t0 = haut, t1 = bas ; l'origine est l'articulation du haut
    function limbGeometry(L, keys, t0, t1, grow) {
        const pts = [];
        const N = 12;
        pts.push(new THREE.Vector2(0.0001, -L * t1));
        for (let i = 0; i <= N; i++) {
            const t = t1 + (t0 - t1) * (i / N);
            pts.push(new THREE.Vector2(lerpProfile(keys, t) + grow, -L * t));
        }
        pts.push(new THREE.Vector2(0.0001, -L * t0));
        return new THREE.LatheGeometry(pts, 14);
    }

    function torsoGeometry() {
        const H = 0.52;
        const pts = [new THREE.Vector2(0.0001, 0)];
        const N = 16;
        for (let i = 0; i <= N; i++) {
            const t = i / N;
            pts.push(new THREE.Vector2(lerpProfile(KEYS.torso, t), H * t));
        }
        pts.push(new THREE.Vector2(0.0001, H));
        return new THREE.LatheGeometry(pts, 32);
    }

    function buildSharedGeometry() {
        G.thigh = limbGeometry(L_THIGH, KEYS.thigh, 0, 1, 0);
        G.thighShort = limbGeometry(L_THIGH, KEYS.thigh, 0, 0.58, 0.013);
        G.thighTrim = limbGeometry(L_THIGH, KEYS.thigh, 0.5, 0.6, 0.015);
        G.thighShortGK = limbGeometry(L_THIGH, KEYS.thigh, 0, 0.72, 0.02);
        G.thighTrimGK = limbGeometry(L_THIGH, KEYS.thigh, 0.64, 0.74, 0.023);
        G.shin = limbGeometry(L_SHIN, KEYS.shin, 0, 1, 0);
        G.sock = limbGeometry(L_SHIN, KEYS.shin, 0.12, 1, 0.004);
        G.sockBand = limbGeometry(L_SHIN, KEYS.shin, 0.12, 0.22, 0.007);
        G.upper = limbGeometry(L_UPPER, KEYS.upper, 0, 1, 0);
        G.sleeve = limbGeometry(L_UPPER, KEYS.upper, 0, 0.56, 0.011);
        G.sleeveTrim = limbGeometry(L_UPPER, KEYS.upper, 0.5, 0.6, 0.013);
        G.sleeveLong = limbGeometry(L_UPPER, KEYS.upper, 0, 1, 0.01);
        G.foreLong = limbGeometry(L_FORE, KEYS.fore, 0, 0.9, 0.009);
        G.armband = limbGeometry(L_UPPER, KEYS.upper, 0.64, 0.76, 0.016);
        G.fore = limbGeometry(L_FORE, KEYS.fore, 0, 1, 0);
        G.torso = torsoGeometry();
        G.sph = new THREE.SphereGeometry(1, 16, 12);
        G.sphHi = new THREE.SphereGeometry(1, 28, 20);
        G.box = new THREE.BoxGeometry(1, 1, 1);
        G.cyl = new THREE.CylinderGeometry(1, 1, 1, 14);
        G.collar = new THREE.TorusGeometry(0.066, 0.012, 8, 24);
        G.hairCap = new THREE.SphereGeometry(1, 28, 16, 0, Math.PI * 2, 0, Math.PI * 0.56);
        G.beard = new THREE.SphereGeometry(1, 20, 12, 0, Math.PI, 1.85, 1.05);
    }

    function init() {
        try {
            if (typeof THREE === 'undefined') throw new Error('Three.js non chargé');
            const cv = document.createElement('canvas');
            cv.width = SW;
            cv.height = SH;
            const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true });
            renderer.setPixelRatio(1);
            renderer.setSize(SW, SH, false);
            renderer.setClearColor(0x000000, 0);
            const scene = new THREE.Scene();
            const halfW = SW / PPM / 2;
            const cam = new THREE.OrthographicCamera(-halfW, halfW, 1.5, -1.1, 0.1, 30);
            cam.position.set(0, 1.1 + 10 * Math.sin(ELEV), 10 * Math.cos(ELEV));
            cam.lookAt(new THREE.Vector3(0, 1.1, 0));
            scene.add(new THREE.HemisphereLight(0xdfeaff, 0x2c4a2a, 0.78));
            const key = new THREE.DirectionalLight(0xfff4e0, 0.85);
            key.position.set(-3, 5, 4);
            scene.add(key);
            const rim = new THREE.DirectionalLight(0x9cc7ff, 0.45);
            rim.position.set(3, 3, -4);
            scene.add(rim);
            R = { renderer, scene, cam, canvas: cv };
            buildSharedGeometry();
            return true;
        } catch (err) {
            console.warn('Rendu 3D indisponible, retour au rendu 2D :', err);
            failed = true;
            R = null;
            return false;
        }
    }

    function ready() {
        if (!enabled || failed) return false;
        if (R) return true;
        return init();
    }

    function disable() { failed = true; }

    function mat(color, shin, spec) {
        return new THREE.MeshPhongMaterial({
            color: new THREE.Color(color),
            shininess: shin === undefined ? 20 : shin,
            specular: new THREE.Color(spec === undefined ? 0x222222 : spec)
        });
    }

    function mesh(geo, material, x, y, z, sx, sy, sz) {
        const m = new THREE.Mesh(geo, material);
        m.position.set(x || 0, y || 0, z || 0);
        m.scale.set(sx === undefined ? 1 : sx, sy === undefined ? 1 : sy, sz === undefined ? 1 : sz);
        return m;
    }

    function luminance(hex) {
        const c = new THREE.Color(hex);
        return c.r * 0.299 + c.g * 0.587 + c.b * 0.114;
    }

    // Texture du maillot : rayures / bande, écusson, sponsor devant, nom + numéro dans le dos
    function paintJersey(info, mainHex, trimHex, pattern) {
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 256;
        const g = c.getContext('2d');
        g.fillStyle = mainHex;
        g.fillRect(0, 0, 512, 256);
        if (info.isGK) {
            g.fillStyle = info.tc.gkJerseyDark || '#000000';
            g.globalAlpha = 0.5;
            [60, 190, 320, 450].forEach(x0 => {
                g.beginPath();
                g.moveTo(x0, 0);
                g.lineTo(x0 + 46, 0);
                g.lineTo(x0 - 18, 256);
                g.lineTo(x0 - 64, 256);
                g.closePath();
                g.fill();
            });
            g.globalAlpha = 1;
        }
        if (pattern === 'stripes') {
            const w = 512 / 12;
            g.fillStyle = trimHex;
            for (let i = 0; i <= 12; i += 2) g.fillRect(i * w - w / 2, 0, w, 256);
        } else if (pattern === 'band') {
            g.fillStyle = trimHex;
            g.fillRect(-34, 0, 68, 256);
            g.fillRect(512 - 34, 0, 68, 256);
        }
        // fines lignes de tissu
        g.fillStyle = 'rgba(0,0,0,0.045)';
        for (let y = 0; y < 256; y += 4) g.fillRect(0, y, 512, 1);

        const lightMain = luminance(mainHex) > 0.55;
        const txtCol = info.isGK ? '#0f172a' : info.tc.number;
        g.textAlign = 'center';
        g.textBaseline = 'middle';

        // Dos : nom + numéro
        g.lineJoin = 'round';
        g.font = '800 34px "Chakra Petch", sans-serif';
        g.lineWidth = 5;
        g.strokeStyle = lightMain ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.35)';
        const nm = String(info.displayName || '').toUpperCase().slice(0, 14);
        g.strokeText(nm, 256, 52);
        g.fillStyle = txtCol;
        g.fillText(nm, 256, 52);
        g.font = '800 130px "Chakra Petch", sans-serif';
        g.lineWidth = 8;
        g.strokeText(String(info.displayNum), 256, 150);
        g.fillText(String(info.displayNum), 256, 150);

        // Devant : sponsor au centre (de part et d'autre de la couture) + écusson
        g.font = '800 30px "Chakra Petch", sans-serif';
        g.lineWidth = 4;
        g.strokeStyle = lightMain ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.4)';
        g.fillStyle = lightMain ? '#0f172a' : '#f8fafc';
        [0, 512].forEach(x => {
            g.strokeText('GRYPHON', x, 112);
            g.fillText('GRYPHON', x, 112);
        });
        g.fillStyle = trimHex;
        g.strokeStyle = 'rgba(0,0,0,0.35)';
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(22, 52);
        g.lineTo(52, 52);
        g.lineTo(52, 72);
        g.quadraticCurveTo(37, 88, 22, 72);
        g.closePath();
        g.fill();
        g.stroke();
        g.fillStyle = 'rgba(255,255,255,0.7)';
        g.beginPath();
        g.arc(37, 62, 4, 0, Math.PI * 2);
        g.fill();

        const tex = new THREE.CanvasTexture(c);
        tex.anisotropy = 4;
        return tex;
    }

    function buildBoot(parent, bootMat, soleMat, studMat, stripeMat) {
        parent.add(mesh(G.sph, bootMat, 0, -0.035, 0.05, 0.046, 0.042, 0.125));
        parent.add(mesh(G.sph, bootMat, 0, -0.022, -0.03, 0.044, 0.05, 0.058));
        parent.add(mesh(G.box, soleMat, 0, -0.078, 0.045, 0.085, 0.016, 0.235));
        [-0.04, 0.02, 0.1, 0.16].forEach(z => {
            parent.add(mesh(G.box, studMat, -0.024, -0.09, z, 0.012, 0.014, 0.014));
            parent.add(mesh(G.box, studMat, 0.024, -0.09, z, 0.012, 0.014, 0.014));
        });
        parent.add(mesh(G.box, stripeMat, 0.047, -0.034, 0.03, 0.004, 0.014, 0.11));
        parent.add(mesh(G.box, stripeMat, -0.047, -0.034, 0.03, 0.004, 0.014, 0.11));
    }

    function buildRig(p, info) {
        const { tc, isGK, team } = info;
        const own = [];
        const M = (color, shin, spec) => { const m = mat(color, shin, spec); own.push(m); return m; };

        const jerseyMain = isGK ? tc.gkJersey : tc.primary;
        const trim = isGK ? tc.gkShorts : tc.secondary;
        const shortsCol = isGK ? tc.gkShorts : tc.shorts;
        const sockCol = isGK ? tc.gkShorts : tc.secondary;
        const bandCol = isGK ? tc.gkJersey : tc.primary;
        const bootCol = isGK ? BOOT_COLORS[2] : BOOT_COLORS[(p.id * 3 + 1) % BOOT_COLORS.length];
        const eyeCol = EYE_COLORS[(p.id * 5 + 2) % EYE_COLORS.length];
        const pattern = isGK ? 'plain' : (JERSEY_PATTERNS[team.id] || 'plain');

        const skinM = M(p.skin, 16, 0x1c1c1c);
        const jerseyM = M(jerseyMain, 14, 0x1a1a1a);
        const trimM = M(trim, 14, 0x1a1a1a);
        const shortsM = M(shortsCol, 12, 0x181818);
        const sockM = M(sockCol, 10, 0x101010);
        const bandM = M(bandCol, 10, 0x101010);
        const bootM = M(bootCol, 60, 0x555555);
        const soleM = M('#0b1220', 10, 0x111111);
        const studM = M('#cbd5e1', 40, 0x444444);
        const stripeM = M('#f8fafc', 10, 0x111111);
        const hairM = M(p.hair, 30, 0x2a2a2a);
        hairM.side = THREE.DoubleSide;
        const whiteM = M('#f4f4f5', 60, 0x666666);
        const irisM = M(eyeCol, 80, 0x888888);
        const darkM = M('#050505', 20, 0x000000);
        const lipM = M('#8a3b3b', 30, 0x222222);
        const mouthM = M('#3a0f0f', 10, 0x000000);
        const padM = M('#0f172a', 12, 0x111111);

        const tex = paintJersey(info, jerseyMain, trim, pattern);
        const torsoM = new THREE.MeshPhongMaterial({ color: 0xffffff, map: tex, shininess: 14, specular: new THREE.Color(0x1a1a1a) });
        own.push(torsoM);

        const root = new THREE.Group();
        const body = new THREE.Group();
        root.add(body);
        const hips = new THREE.Group();
        hips.position.y = 0.95;
        body.add(hips);

        // Bassin (short)
        hips.add(mesh(G.sphHi, shortsM, 0, 0.0, 0, 0.19, 0.125, 0.135));

        // Jambes
        const legs = [];
        [1, -1].forEach(sx => {
            const thigh = new THREE.Group();
            thigh.position.set(sx * 0.095, 0, 0);
            hips.add(thigh);
            thigh.add(mesh(G.thigh, skinM));
            thigh.add(mesh(isGK ? G.thighShortGK : G.thighShort, shortsM));
            thigh.add(mesh(isGK ? G.thighTrimGK : G.thighTrim, trimM));
            const knee = new THREE.Group();
            knee.position.y = -L_THIGH;
            thigh.add(knee);
            knee.add(mesh(G.sph, skinM, 0, 0, 0.004, 0.054, 0.054, 0.058));
            knee.add(mesh(G.shin, skinM));
            knee.add(mesh(G.sock, sockM));
            knee.add(mesh(G.sockBand, bandM));
            const ankle = new THREE.Group();
            ankle.position.y = -L_SHIN;
            knee.add(ankle);
            buildBoot(ankle, bootM, soleM, studM, stripeM);
            legs.push({ thigh, knee, ankle, sx });
        });

        // Buste
        const spine = new THREE.Group();
        spine.position.y = 0.02;
        hips.add(spine);
        spine.add(mesh(G.torso, torsoM, 0, 0, 0, 1, 1, 0.62));
        const collar = mesh(G.collar, trimM, 0, 0.512, 0.004, 1, 1, 1);
        collar.rotation.x = Math.PI / 2;
        spine.add(collar);
        spine.add(mesh(G.cyl, skinM, 0, 0.575, 0.004, 0.05, 0.14, 0.052));

        // Bras
        const arms = [];
        [1, -1].forEach((sx, i) => {
            const shoulder = new THREE.Group();
            shoulder.position.set(sx * 0.215, 0.445, 0);
            spine.add(shoulder);
            shoulder.add(mesh(G.upper, isGK ? jerseyM : skinM));
            shoulder.add(mesh(G.sph, jerseyM, 0, 0.005, 0, 0.064, 0.064, 0.062));
            if (isGK) {
                shoulder.add(mesh(G.sleeveLong, jerseyM));
            } else {
                shoulder.add(mesh(G.sleeve, jerseyM));
                shoulder.add(mesh(G.sleeveTrim, trimM));
                if (p.id === 8 && i === 0) shoulder.add(mesh(G.armband, M('#facc15', 20, 0x333333)));
            }
            const elbow = new THREE.Group();
            elbow.position.y = -L_UPPER;
            shoulder.add(elbow);
            elbow.add(mesh(G.sph, isGK ? jerseyM : skinM, 0, 0, 0, 0.042, 0.042, 0.042));
            elbow.add(mesh(G.fore, isGK ? jerseyM : skinM));
            if (isGK) elbow.add(mesh(G.foreLong, jerseyM));
            const hand = new THREE.Group();
            hand.position.y = -L_FORE;
            elbow.add(hand);
            const fingers = [];
            if (isGK) {
                elbow.add(mesh(G.sph, padM, 0, -0.005, -0.03, 0.048, 0.052, 0.032));
                const gloveBase = tc.gkGloves || '#22c55e';
                const gloveM = M(gloveBase, 30, 0x333333);
                const latexM = M(new THREE.Color(gloveBase).lerp(new THREE.Color('#ffffff'), 0.55), 40, 0x444444);
                hand.rotation.y = -sx * Math.PI / 2;
                hand.add(mesh(G.cyl, padM, 0, -0.008, 0, 0.036, 0.04, 0.036));
                hand.add(mesh(G.sph, gloveM, 0, -0.055, 0, 0.042, 0.048, 0.022));
                hand.add(mesh(G.sph, padM, 0, -0.055, -0.017, 0.043, 0.05, 0.012));
                hand.add(mesh(G.sph, latexM, 0, -0.055, 0.013, 0.037, 0.044, 0.01));
                for (let k = 0; k < 4; k++) {
                    const f = new THREE.Group();
                    f.position.set(-0.0285 + k * 0.019, -0.098, 0.004);
                    hand.add(f);
                    f.add(mesh(G.cyl, gloveM, 0, -0.025, 0, 0.0085, 0.05, 0.011));
                    f.add(mesh(G.cyl, latexM, 0, -0.025, 0.007, 0.006, 0.044, 0.004));
                    fingers.push(f);
                }
                const th = new THREE.Group();
                th.position.set(sx * 0.042, -0.06, 0.006);
                th.rotation.z = sx * 0.55;
                hand.add(th);
                th.add(mesh(G.cyl, gloveM, 0, -0.022, 0, 0.01, 0.045, 0.012));
                fingers.push(th);
            } else {
                hand.add(mesh(G.sph, skinM, 0, -0.035, 0.002, 0.032, 0.05, 0.024));
                hand.add(mesh(G.sph, skinM, sx * -0.026, -0.02, 0.012, 0.011, 0.026, 0.011));
            }
            arms.push({ shoulder, elbow, sx, fingers });
        });

        // Tête
        const head = new THREE.Group();
        head.position.y = 0.70;
        spine.add(head);
        head.add(mesh(G.sphHi, skinM, 0, 0, 0, 0.092, 0.118, 0.102));
        head.add(mesh(G.sph, skinM, 0, -0.078, 0.03, 0.068, 0.055, 0.068));
        [1, -1].forEach(sx => {
            head.add(mesh(G.sph, skinM, sx * 0.092, 0, -0.005, 0.014, 0.03, 0.02));
        });
        head.add(mesh(G.sph, skinM, 0, -0.015, 0.1, 0.016, 0.026, 0.02));
        head.add(mesh(G.sph, skinM, 0, 0.01, 0.094, 0.012, 0.03, 0.015));

        const irises = [];
        const brows = [];
        [1, -1].forEach(sx => {
            head.add(mesh(G.sph, whiteM, sx * 0.037, 0.02, 0.086, 0.0155, 0.0125, 0.0155));
            const iris = mesh(G.sph, irisM, sx * 0.037, 0.02, 0.098, 0.0085, 0.0085, 0.006);
            head.add(iris);
            const pupil = mesh(G.sph, darkM, sx * 0.037, 0.02, 0.1035, 0.0045, 0.0045, 0.003);
            head.add(pupil);
            irises.push({ iris, pupil, bx: sx * 0.037, by: 0.02 });
            const brow = mesh(G.box, hairM, sx * 0.037, 0.045, 0.093, 0.034, 0.0065, 0.008);
            brow.rotation.z = -sx * 0.14;
            head.add(brow);
            brows.push(brow);
        });
        const mouthClosed = mesh(G.box, lipM, 0, -0.06, 0.094, 0.042, 0.006, 0.01);
        const mouthOpen = mesh(G.box, mouthM, 0, -0.065, 0.094, 0.034, 0.02, 0.012);
        mouthOpen.visible = false;
        head.add(mouthClosed);
        head.add(mouthOpen);

        // Coiffure (5 styles, comme le rendu 2D)
        const hairStyle = (p.id * 7 + 3) % 5;
        if (hairStyle === 4) {
            const buzz = new THREE.Color(p.hair).lerp(new THREE.Color(p.skin), 0.6);
            const buzzM = new THREE.MeshPhongMaterial({ color: buzz, shininess: 8, specular: new THREE.Color(0x111111), side: THREE.DoubleSide });
            own.push(buzzM);
            const cap = mesh(G.hairCap, buzzM, 0, 0.004, -0.01, 0.0955, 0.1225, 0.1055);
            cap.rotation.x = -0.28;
            head.add(cap);
        } else {
            const cap = mesh(G.hairCap, hairM, 0, 0.006, -0.012, 0.097, 0.124, 0.108);
            cap.rotation.x = -0.28;
            head.add(cap);
            head.add(mesh(G.sph, hairM, 0, -0.03, -0.04, 0.085, 0.08, 0.07));
            if (hairStyle === 1) {
                const quiff = mesh(G.sph, hairM, 0, 0.115, 0.045, 0.07, 0.045, 0.085);
                quiff.rotation.x = 0.3;
                head.add(quiff);
            } else if (hairStyle === 2) {
                [0.5, 0.95, 1.3].forEach((th, row) => {
                    const n = 5 + row * 2;
                    for (let k = 0; k < n; k++) {
                        const ph = (k / n) * Math.PI * 2 + row * 0.4;
                        head.add(mesh(G.sph, hairM,
                            Math.sin(th) * Math.cos(ph) * 0.1,
                            0.01 + Math.cos(th) * 0.12,
                            Math.sin(th) * Math.sin(ph) * 0.105 - 0.01,
                            0.034, 0.034, 0.034));
                    }
                });
            } else if (hairStyle === 3) {
                head.add(mesh(G.sph, hairM, 0, -0.07, -0.07, 0.085, 0.13, 0.06));
                head.add(mesh(G.sph, hairM, 0, -0.14, -0.11, 0.035, 0.1, 0.035));
            }
        }
        // Barbe / barbe de trois jours
        if (p.hasBeard) {
            const beardM = new THREE.MeshPhongMaterial({ color: new THREE.Color(p.hair), shininess: 8, specular: new THREE.Color(0x111111), side: THREE.DoubleSide });
            own.push(beardM);
            head.add(mesh(G.beard, beardM, 0, 0, 0, 0.1, 0.126, 0.111));
        } else if (p.id % 4 === 0) {
            const stubM = new THREE.MeshPhongMaterial({ color: 0x1c140f, transparent: true, opacity: 0.28, side: THREE.DoubleSide });
            own.push(stubM);
            head.add(mesh(G.beard, stubM, 0, 0, 0, 0.099, 0.125, 0.11));
        }

        scene_add(root);
        root.visible = false;

        return {
            sig: info.sig, root, body, hips, spine, head, legs, arms, irises, brows, mouthClosed, mouthOpen,
            yaw: 0, init: false, lastT: 0, dive: 0,
            dispose() {
                R.scene.remove(root);
                own.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
            }
        };
    }

    function scene_add(obj) { R.scene.add(obj); }

    function wrapPi(a) {
        while (a > Math.PI) a -= Math.PI * 2;
        while (a < -Math.PI) a += Math.PI * 2;
        return a;
    }
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    function orient(rig, P) {
        const p = P.p;
        const now = performance.now();
        const dt = rig.lastT ? Math.min(0.1, (now - rig.lastT) / 1000) : 0.016;
        rig.lastT = now;

        // Plongeon lissé : montée rapide, retombée plus douce
        const dTarget = P.isGK ? (p.diveAnim || 0) : 0;
        rig.dive += (dTarget - rig.dive) * Math.min(1, (dTarget > rig.dive ? 18 : 5) * dt);
        if (rig.dive < 0.001) rig.dive = 0;

        let fx, fz;
        if (!P.isGK && p.speedMag > 18) { fx = p.vx; fz = p.vy; }
        else { fx = P.ball.x - p.x; fz = P.ball.y - p.y; }
        if (Math.hypot(fx, fz) < 1) { fx = p.facing || 1; fz = 0; }
        // compression de la profondeur + léger trois-quarts vers la caméra
        let target = Math.atan2(fx, fz * 0.6 + Math.abs(fx) * 0.3);
        // en plongeon, le gardien se présente de face pour que le plongeon se lise à l'écran
        if (P.isGK && rig.dive > 0.08) target = 0;
        if (!rig.init) { rig.yaw = target; rig.init = true; }
        rig.yaw += wrapPi(target - rig.yaw) * Math.min(1, (P.isGK ? 14 : 10) * dt);

        const bx = P.ball.x - p.x;
        const bz = (P.ball.y - p.y) * 0.6 + Math.abs(bx) * 0.3;
        const rel = clamp(wrapPi(Math.atan2(bx, bz) - rig.yaw), -1.0, 1.0);

        return { rel, lookY: clamp((P.ball.y - p.y) / 160, -1, 1), dive: rig.dive };
    }

    // Boucle de poses du gardien : détente, côté, ballon en main, but encaissé, plongeon
    const GK_LEAN = { dive: -0.1, slump: 0.3, hold: 0.1, set: 0.42, ready: 0.3, relax: 0.08, shuffle: 0.26 };
    const GK_CURL = { dive: 0.0, slump: 0.6, hold: 0.85, set: 0.05, ready: 0.15, relax: 0.5, shuffle: 0.2 };

    function pose(rig, P, look) {
        const p = P.p;
        const { isGK, isCelebrating, moveRatio, cyc, kickPhase } = P;
        const now = performance.now();
        const dive = isGK ? look.dive : 0;
        let mode = 'run';
        if (isGK) {
            if (dive > 0.05) mode = 'dive';
            else if (P.phase === 'GOAL_CELEBRATION') mode = 'slump';
            else if (P.isHolder) mode = 'hold';
            else if (P.phase === 'SHOOTING') mode = 'set';
            else if (moveRatio > 0.12) mode = 'shuffle';
            else if (Math.abs(P.ball.x - p.x) < 300) mode = 'ready';
            else mode = 'relax';
        }
        const A = 0.30 + 0.70 * moveRatio;
        const kneeK = 0.12 + 1.15 * moveRatio;

        let reachMax = 0;
        for (let i = 0; i < 2; i++) {
            const L = rig.legs[i];
            const phase = cyc + (i === 0 ? 0 : Math.PI);
            let swing = Math.sin(phase) * A;
            let knee = 0.08 + kneeK * Math.max(0, Math.cos(phase));
            let ank = 0.12 * Math.max(0, -Math.cos(phase)) * moveRatio - swing * 0.15;
            let spread = 0.03;
            if (mode === 'dive') {
                swing = i === 0 ? 0.4 : -0.3;
                knee = i === 0 ? 0.5 : 0.9;
                spread = 0.12;
            } else if (mode === 'slump') {
                swing = 0.05; knee = 0.1; spread = 0.08; ank = 0;
            } else if (mode === 'set') {
                swing = 0.35; knee = 0.85; spread = 0.3; ank = -0.1;
            } else if (mode === 'ready') {
                swing = i === 0 ? 0.2 : 0.05; knee = 0.55; spread = 0.2; ank = -0.05;
            } else if (mode === 'relax') {
                swing = i === 0 ? 0.06 : -0.03; knee = 0.15; spread = 0.1; ank = 0;
            } else if (mode === 'shuffle') {
                // pas chassés le long de la ligne de but
                spread = 0.2 + 0.18 * Math.sin(phase);
                swing = 0.1;
                knee = 0.45 + 0.25 * Math.max(0, Math.cos(phase));
                ank = 0;
            }
            if (!isGK && kickPhase > 0) {
                if (i === 1) {
                    swing = swing * (1 - kickPhase) + 1.2 * kickPhase;
                    knee = knee * (1 - kickPhase) + 0.15 * kickPhase;
                    ank = ank + 0.5 * kickPhase;
                } else {
                    knee += 0.2 * kickPhase;
                }
            }
            L.thigh.rotation.x = -swing;
            L.thigh.rotation.z = L.sx * spread;
            L.knee.rotation.x = knee;
            L.ankle.rotation.x = ank;
            const th1 = -swing;
            const th2 = th1 + knee;
            const reach = (L_THIGH * Math.cos(th1) + L_SHIN * Math.cos(th2)) * Math.cos(spread);
            if (reach > reachMax) reachMax = reach;
        }

        const bobM = (p.bobY || 0) * 0.045;
        const hop = isCelebrating ? Math.abs(Math.sin(cyc * 1.5)) * 0.12 : 0;
        const nervous = mode === 'set' ? Math.sin(now * 0.014) * 0.014 : (mode === 'ready' ? Math.sin(now * 0.006) * 0.008 : 0);
        rig.hips.position.y = ANKLE_H + reachMax + bobM + hop + nervous;
        rig.hips.position.x = (mode === 'ready' || mode === 'set') ? Math.sin(now * 0.004 + p.id) * 0.02 : 0;
        rig.hips.rotation.y = -Math.sin(cyc) * 0.14 * moveRatio;
        rig.hips.rotation.z = Math.sin(cyc) * 0.04 * moveRatio;

        let lean = 0.04 + 0.22 * moveRatio - kickPhase * 0.2;
        if (isGK) lean = GK_LEAN[mode] + (mode === 'hold' ? 0.2 * moveRatio : 0);
        rig.spine.rotation.x = lean;
        rig.spine.rotation.y = Math.sin(cyc) * 0.22 * moveRatio + kickPhase * 0.25;
        rig.spine.rotation.z = -Math.sin(cyc) * 0.03 * moveRatio;
        const br = 1 + P.breathN * 0.012;
        rig.spine.scale.set(br, br, br);

        const curlBase = isGK ? ((mode === 'dive' && P.isHolder) ? 0.8 : GK_CURL[mode]) : 0;
        for (let i = 0; i < 2; i++) {
            const A2 = rig.arms[i];
            const phase = cyc + (i === 0 ? Math.PI : 0);
            const sw = Math.sin(phase) * (0.25 + 0.7 * moveRatio);
            let rx = -sw;
            let rz = A2.sx * (0.12 + kickPhase * 0.5);
            let el = -(0.25 + 0.9 * moveRatio * (0.6 + 0.4 * Math.max(0, Math.sin(phase))));
            if (mode === 'dive') {
                if (P.isHolder) { rx = -1.15; rz = A2.sx * 0.3; el = -1.5; }   // serre le ballon contre lui
                else { rx = -0.1; rz = A2.sx * 2.95; el = -0.05; }
            }
            else if (mode === 'slump') { rx = 0.1; rz = A2.sx * 0.25; el = -0.3; }
            else if (mode === 'hold') { rx = -0.9; rz = -A2.sx * 0.15; el = -1.3; }
            else if (mode === 'set') { rx = -0.6; rz = A2.sx * 0.95; el = -1.05; }
            else if (mode === 'ready') { rx = -0.5; rz = A2.sx * 0.6; el = -1.1; }
            else if (mode === 'relax') { rx = -0.15; rz = A2.sx * 0.25; el = -0.55; }
            else if (mode === 'shuffle') { rx = -0.4; rz = A2.sx * 0.7; el = -0.9; }
            if (isCelebrating) {
                rx = 0;
                rz = A2.sx * (2.5 + 0.15 * Math.sin(cyc * 2 + i));
                el = -0.25;
            }
            A2.shoulder.rotation.x = rx;
            A2.shoulder.rotation.z = rz;
            A2.elbow.rotation.x = el;
            A2.fingers.forEach((f, k) => { f.rotation.x = -(curlBase + (k % 4) * 0.04); });
        }

        const headTurn = isGK ? 0.8 : 0.65;
        rig.head.rotation.y = look.rel * headTurn;
        let headX = (P.isHolder ? 0.28 : 0.08 * look.lookY) - (isCelebrating ? 0.25 : 0) - moveRatio * 0.05;
        if (mode === 'slump') headX = 0.5;
        else if (mode === 'dive') headX = -0.2;
        rig.head.rotation.x = headX;
        rig.head.rotation.z = (kickPhase > 0.2 ? 0.05 : 0);
        rig.irises.forEach(e => {
            const ox = clamp(look.rel * 0.004, -0.004, 0.004);
            const oy = look.lookY * -0.002;
            e.iris.position.x = e.bx + ox;
            e.iris.position.y = e.by + oy;
            e.pupil.position.x = e.bx + ox * 1.1;
            e.pupil.position.y = e.by + oy;
        });
        const mouthOpen = isCelebrating || kickPhase > 0.35 || mode === 'dive';
        rig.mouthOpen.visible = mouthOpen;
        rig.mouthClosed.visible = !mouthOpen;
        rig.brows.forEach(b => { b.position.y = 0.045 + (isCelebrating ? 0.008 : 0); });

        rig.body.rotation.y = rig.yaw;
        rig.body.scale.set(P.widthK, P.heightK, P.widthK);

        // Plongeon du gardien : rotation autour du bassin + décollage
        if (mode === 'dive') {
            const th = -(p.diveDir || 0) * dive * 1.35;
            const hy = rig.hips.position.y;
            let hipW = hy;
            if (P.isHolder) {
                hipW = hy + (0.5 - hy) * Math.min(1, dive * 1.3);          // couché, ballon serré
            } else if (P.handRelM != null) {
                // bassin placé pour que les gants rejoignent la hauteur du ballon
                const want = Math.max(0.45, Math.min(1.5, P.handRelM - 1.05 * Math.cos(th)));
                hipW = hy + (want - hy) * Math.min(1, dive * 1.6);
            }
            rig.root.rotation.z = th;
            rig.root.position.x = hy * Math.sin(th);
            rig.root.position.y = hipW - hy * Math.cos(th);
        } else {
            rig.root.position.x = 0;
            rig.root.position.y = 0;
            rig.root.rotation.z = 0;
        }
    }

    function getRig(P) {
        const p = P.p;
        const tc = P.tc;
        const sig = [P.team.id, tc.primary, tc.secondary, tc.shorts, tc.number, tc.gkJersey, tc.gkShorts, tc.gkGloves,
            P.displayNum, P.displayName, p.skin, p.hair, p.hasBeard ? 1 : 0].join('|');
        let rig = rigs[p.id];
        if (rig && rig.sig !== sig) {
            rig.dispose();
            rig = null;
            delete rigs[p.id];
        }
        if (!rig) {
            rig = buildRig(p, { tc, isGK: P.isGK, team: P.team, displayNum: P.displayNum, displayName: P.displayName, sig });
            rigs[p.id] = rig;
        }
        return rig;
    }

    function draw(P) {
        if (!ready()) return false;
        const rig = getRig(P);
        if (!rig) return false;
        const look = orient(rig, P);
        pose(rig, P, look);
        for (const id in rigs) rigs[id].root.visible = false;
        rig.root.visible = true;
        R.renderer.render(R.scene, R.cam);
        const k = (P.s * 22) / PPM;
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(R.canvas, -SW / 2 * k, -GROUND_ROW * k, SW * k, SH * k);
        return true;
    }

    function toggle() {
        if (failed) return;
        enabled = !enabled;
    }

    return { ready, draw, disable, toggle };
})();

document.addEventListener('keydown', (e) => {

    if (tag === 'INPUT' || tag === 'TEXTAREA' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'v' || e.key === 'V') Players3D.toggle();

// Segment de membre effilé avec volume
function limbSeg(x1, y1, x2, y2, w1, w2, fill, shade = true) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len;
    const ny = dx / len;
    const a = Math.atan2(ny, nx);

    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x1 + nx * w1 / 2, y1 + ny * w1 / 2);
    ctx.lineTo(x2 + nx * w2 / 2, y2 + ny * w2 / 2);
    ctx.arc(x2, y2, w2 / 2, a, a - Math.PI, true);
    ctx.lineTo(x1 - nx * w1 / 2, y1 - ny * w1 / 2);
    ctx.arc(x1, y1, w1 / 2, a + Math.PI, a, true);
    ctx.closePath();
    ctx.fill();

    if (shade && w1 > 1.4) {
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = Math.max(0.5, w1 * 0.26);
        ctx.beginPath();
        ctx.moveTo(x1 + nx * w1 * 0.16, y1 + ny * w1 * 0.16);
        ctx.lineTo(x2 + nx * w2 * 0.16, y2 + ny * w2 * 0.16);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(0,0,0,0.14)';
        ctx.lineWidth = Math.max(0.5, w1 * 0.22);
        ctx.beginPath();
        ctx.moveTo(x1 - nx * w1 * 0.36, y1 - ny * w1 * 0.36);
        ctx.lineTo(x2 - nx * w2 * 0.36, y2 - ny * w2 * 0.36);
        ctx.stroke();
    }
}

// Segment musclé : largeur w1 -> wm (au point tm) -> w2 (cuisse, mollet, biceps)
function muscleSeg(x1, y1, x2, y2, w1, wm, w2, tm, fill) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len;
    const ny = dx / len;
    const a = Math.atan2(ny, nx);
    const wAt = t => t < tm
        ? w1 + (wm - w1) * (0.5 - 0.5 * Math.cos(Math.PI * t / tm))
        : wm + (w2 - wm) * (0.5 - 0.5 * Math.cos(Math.PI * (t - tm) / (1 - tm)));
    const N = 10;

    ctx.fillStyle = fill;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
        const t = i / N;
        const w = wAt(t) / 2;
        const px = x1 + dx * t + nx * w;
        const py = y1 + dy * t + ny * w;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.arc(x2, y2, w2 / 2, a, a - Math.PI, true);
    for (let i = N; i >= 0; i--) {
        const t = i / N;
        const w = wAt(t) / 2;
        ctx.lineTo(x1 + dx * t - nx * w, y1 + dy * t - ny * w);
    }
    ctx.arc(x1, y1, w1 / 2, a + Math.PI, a, true);
    ctx.closePath();
    ctx.fill();

    // Volume : lumière côté avant, ombre côté arrière
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.17)';
    ctx.lineWidth = Math.max(0.5, wm * 0.22);
    ctx.beginPath();
    ctx.moveTo(x1 + nx * wm * 0.18, y1 + ny * wm * 0.18);
    ctx.lineTo(x1 + dx * tm + nx * wm * 0.2, y1 + dy * tm + ny * wm * 0.2);
    ctx.lineTo(x2 + nx * w2 * 0.16, y2 + ny * w2 * 0.16);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = Math.max(0.5, wm * 0.2);
    ctx.beginPath();
    ctx.moveTo(x1 - nx * wm * 0.36, y1 - ny * wm * 0.36);
    ctx.lineTo(x1 + dx * tm - nx * wm * 0.38, y1 + dy * tm - ny * wm * 0.38);
    ctx.lineTo(x2 - nx * w2 * 0.36, y2 - ny * w2 * 0.36);
    ctx.stroke();
}

// Crampon détaillé : coque, talon, lacets, semelle, crampons, reflet
function drawBoot(ax, ay, s, angle, color) {
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(angle);

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-1.9 * s, -1.9 * s);
    ctx.lineTo(0.8 * s, -2.2 * s);
    ctx.quadraticCurveTo(3.4 * s, -1.5 * s, 4.7 * s, 0.4 * s);
    ctx.lineTo(4.8 * s, 1.4 * s);
    ctx.lineTo(-2.3 * s, 1.4 * s);
    ctx.quadraticCurveTo(-2.9 * s, -0.2 * s, -1.9 * s, -1.9 * s);
    ctx.closePath();
    ctx.fill();

    // Talon renforcé
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.moveTo(-1.9 * s, -1.9 * s);
    ctx.quadraticCurveTo(-2.9 * s, -0.2 * s, -2.3 * s, 1.4 * s);
    ctx.lineTo(-1.0 * s, 1.4 * s);
    ctx.quadraticCurveTo(-1.5 * s, -0.2 * s, -0.9 * s, -1.95 * s);
    ctx.closePath();
    ctx.fill();

    // Lacets
    ctx.strokeStyle = 'rgba(255,255,255,0.75)';
    ctx.lineWidth = 0.35 * s;
    for (let i = 0; i < 3; i++) {
        const lx = (0.3 + i * 0.9) * s;
        ctx.beginPath();
        ctx.moveTo(lx, -2.0 * s + i * 0.12 * s);
        ctx.lineTo(lx + 0.5 * s, -1.0 * s + i * 0.2 * s);
        ctx.stroke();
    }

    // Semelle + crampons
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(-2.3 * s, 1.0 * s, 7.1 * s, 0.7 * s);
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(-1.6 * s, 1.5 * s, 0.7 * s, 0.55 * s);
    ctx.fillRect(1.3 * s, 1.5 * s, 0.7 * s, 0.55 * s);
    ctx.fillRect(3.6 * s, 1.5 * s, 0.7 * s, 0.55 * s);

    // Bande latérale de l'équipementier + coutures
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 0.5 * s;
    ctx.beginPath();
    ctx.moveTo(-0.9 * s, 0.7 * s);
    ctx.quadraticCurveTo(1.6 * s, -0.4 * s, 3.4 * s, 0.4 * s);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 0.3 * s;
    ctx.beginPath();
    ctx.moveTo(0.2 * s, -2.1 * s);
    ctx.quadraticCurveTo(1.2 * s, -0.8 * s, 0.8 * s, 1.0 * s);
    ctx.stroke();
    // Reflet de la coque
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.ellipse(2.2 * s, -0.9 * s, 1.5 * s, 0.35 * s, -0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawRealisticPlayer(p) {
    if (!ensureCanvasContext()) return;
    const pos = projectPoint(p.x, p.y, 0);
    const s = pos.scale * PLAYER_SCALE;
    const isGK = p.role === 'GK';
    const isHolder = ball.holderId === p.id;
    const isCelebrating = !isGK && STATE.phase === 'GOAL_CELEBRATION';
    const team = getCurrentTeam();
    const tc = getEffectiveTeamColors(team);
    const rosterEntry = team.roster && team.roster[p.id] ? team.roster[p.id] : null;
    const displayNum = rosterEntry ? rosterEntry.num : p.num;
    const displayName = rosterEntry ? rosterEntry.name : p.name;

    const facing = p.facing || 1;
    const moveRatio = Math.min(1, (p.speedMag || 0) / 120);
    const cyc = p.runCycle;
    const now = performance.now();

    const stride = Math.sin(cyc) * (2.4 + 4.6 * moveRatio) * s;
    const lift = Math.max(0, Math.cos(cyc)) * (1.4 + 2.8 * moveRatio) * s;
    const oStride = Math.sin(cyc + Math.PI) * (2.4 + 4.6 * moveRatio) * s;
    const oLift = Math.max(0, Math.cos(cyc + Math.PI)) * (1.4 + 2.8 * moveRatio) * s;

    const kickPhase = p.kickAnim > 0 ? Math.sin(p.kickAnim * Math.PI) : 0;
    const kickForward = kickPhase * 9 * s;
    const kickUp = kickPhase * 4.4 * s;
    const bob = (p.bobY || 0) * s;
    const breath = Math.sin(now * 0.0032 + p.id) * 0.22 * s * (1 - moveRatio);

    // Morphologie individuelle
    const heightK = 0.95 + ((p.id * 53) % 11) / 100;
    const widthK = 0.96 + ((p.id * 29) % 5) / 50;

    // Palette
    const skin = p.skin;
    const skinDark = adjustHexShade(skin, -30);
    const skinLight = adjustHexShade(skin, 16);
    const jerseyMain = isGK ? tc.gkJersey : tc.primary;
    const jerseyDark = isGK ? tc.gkJerseyDark : tc.primaryDark;
    const jerseyLight = adjustHexShade(jerseyMain, 24);
    const trim = isGK ? tc.gkShorts : tc.secondary;
    const shortsCol = isGK ? tc.gkShorts : tc.shorts;
    const sockCol = isGK ? tc.gkShorts : tc.secondary;
    const sockBand = isGK ? tc.gkJersey : tc.primary;
    const bootCol = BOOT_COLORS[(p.id * 3 + 1) % BOOT_COLORS.length];
    const eyeCol = EYE_COLORS[(p.id * 5 + 2) % EYE_COLORS.length];
    const pattern = isGK ? 'plain' : (JERSEY_PATTERNS[team.id] || 'plain');

    // Regard : le joueur suit le ballon des yeux
    const lookX = Math.max(-1, Math.min(1, ((ball.x - p.x) * facing) / 150));
    const lookY = Math.max(-1, Math.min(1, (ball.y - p.y) / 160));

    // Géométrie des jambes et des bras (calculée une fois, réutilisée par l'ombre)
    const legGeom = (hipX, st, lf, kF, kU) => ({
        hx: hipX,
        kx: hipX + 0.2 * s + st * 0.45 + kF * 0.55,
        ky: -7.9 * s - lf * 0.45 - kU * 0.5,
        ax: hipX + 0.7 * s + st * 0.85 + kF,
        ay: -2.1 * s - lf * 0.7 - kU
    });
    const hipY = -15.0 * s;
    const backLeg = legGeom(-1.7 * s, oStride, oLift, 0, 0);
    const frontLeg = legGeom(2.0 * s, stride, lift, kickForward, kickUp);

    const raised = isCelebrating || (isGK && p.diveAnim > 0.05);
    const swingAmp = 0.28 + 0.8 * moveRatio;
    const armBend = 0.35 + 0.75 * moveRatio;
    let backTheta, frontTheta, backBend, frontBend;
    if (isCelebrating) {
        const wave = Math.sin(cyc * 2) * 0.18;
        backTheta = Math.PI + 0.55 - wave;
        frontTheta = Math.PI - 0.5 + wave;
        backBend = -0.25;
        frontBend = 0.25;
    } else if (raised) {
        backTheta = Math.PI * 0.8;
        frontTheta = Math.PI * 0.84;
        backBend = 0.1;
        frontBend = 0.1;
    } else {
        backTheta = Math.sin(cyc) * swingAmp + kickPhase * 0.6;
        frontTheta = Math.sin(cyc + Math.PI) * swingAmp - kickPhase * 0.7;
        backBend = armBend;
        frontBend = armBend;
    }
    const shoulderY = -27.4 * s - breath;
    const armGeom = (shx, theta, bend) => {
        const L1 = 6.0 * s;
        const L2 = 5.6 * s;
        const ex = shx + L1 * Math.sin(theta);
        const ey = shoulderY + L1 * Math.cos(theta);
        const phi = theta + bend;
        return { sx: shx, sy: shoulderY, ex, ey, hx: ex + L2 * Math.sin(phi), hy: ey + L2 * Math.cos(phi) };
    };
    const backArm = armGeom(-4.7 * s, backTheta, backBend);
    const frontArm = armGeom(4.7 * s, frontTheta, frontBend);

    ctx.save();
    ctx.translate(pos.x, pos.groundY);
    ctx.textAlign = 'center';

    if (isHolder) {
        const pulse = 1 + Math.sin(now * 0.008) * 0.12;
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.85)';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.ellipse(0, 0, 15 * s * pulse, 6.8 * s * pulse, 0, 0, Math.PI * 2);
        ctx.stroke();
    }

    // Ombre de contact
    ctx.save();
    ctx.translate(1.5 * s, 0.8 * s);
    ctx.scale(1, 0.4);
    const aoG = ctx.createRadialGradient(0, 0, 0.5 * s, 0, 0, 9.5 * s);
    aoG.addColorStop(0, 'rgba(0,0,0,0.55)');
    aoG.addColorStop(0.55, 'rgba(0,0,0,0.28)');
    aoG.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = aoG;
    ctx.beginPath();
    ctx.arc(0, 0, 9.5 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Ombre portée dynamique (projecteurs du stade : projetée vers l'arrière-droite)
    ctx.save();
    ctx.transform(1, 0, -0.85, 0.2, 0, 0);
    ctx.scale(facing * widthK, heightK);
    ctx.globalAlpha = 0.17;
    ctx.strokeStyle = '#000';
    ctx.fillStyle = '#000';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4 * s;
    [backLeg, frontLeg].forEach(L => {
        ctx.beginPath();
        ctx.moveTo(L.hx, hipY);
        ctx.lineTo(L.kx, L.ky);
        ctx.lineTo(L.ax, L.ay);
        ctx.stroke();
    });
    ctx.lineWidth = 2.8 * s;
    [backArm, frontArm].forEach(A => {
        ctx.beginPath();
        ctx.moveTo(A.sx, A.sy);
        ctx.lineTo(A.ex, A.ey);
        ctx.lineTo(A.hx, A.hy);
        ctx.stroke();
    });
    ctx.beginPath();
    ctx.roundRect(-6 * s, -29.5 * s, 12 * s, 14.5 * s, 3 * s);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0.3 * s, -35 * s, 4 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // ---- Rendu 3D (Three.js) : remplace le corps dessiné en 2D si disponible ----
    if (Players3D.ready()) {
        let drawn3D = false;
        ctx.save();
        ctx.translate(0, -(p.z || 0) * pos.scale);
        try {
            drawn3D = Players3D.draw({
                p, s, tc, team, isGK, isHolder, isCelebrating, displayNum, displayName,
                moveRatio: (isGK && p.scripted) ? 0.1 : moveRatio,
                cyc, kickPhase, heightK, widthK, ball, phase: STATE.phase,
                handRelM: (isGK && p.sd) ? (p.sd.tz - (p.z || 0)) / 17 : null,
                breathN: Math.sin(now * 0.0032 + p.id) * (1 - moveRatio)
            });
        } catch (err) {
            console.error('Rendu 3D désactivé :', err);
            Players3D.disable();
            drawn3D = false;
        }
        ctx.restore();
        if (drawn3D) {
            if (isHolder || p.role === 'FWD' || isGK) {
                ctx.font = `600 ${Math.max(8, Math.round(7.2 * s))}px "Inter", sans-serif`;
                ctx.textAlign = 'center';
                ctx.lineWidth = 2.2;
                ctx.strokeStyle = 'rgba(0,0,0,0.55)';
                ctx.strokeText(displayName, 0, 10 * s);
                ctx.fillStyle = isHolder ? '#fde047' : 'rgba(255,255,255,0.88)';
                ctx.fillText(displayName, 0, 10 * s);
            }
            ctx.restore();
            return;
        }
    }

    // Plongeon du gardien
    ctx.translate(0, -(p.z || 0) * pos.scale);
    if (isGK && p.diveAnim > 0.05) {
        ctx.translate(0, -14 * s * p.diveAnim);
        ctx.rotate(p.diveDir * p.diveAnim * 1.15);
    }

    // ---- Corps (miroir selon la direction, inclinaison vers l'avant en course) ----
    ctx.save();
    ctx.translate(Math.sin(cyc * 2) * 0.28 * s * moveRatio, -bob);
    ctx.scale(facing * widthK, heightK);
    const leanF = Math.max(-0.2, Math.min(0.26, (p.leanX || 0) * facing));
    ctx.transform(1, 0, -leanF, 1, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // --- Jambe : cuisse musclée, genou, mollet, chaussette, crampon, jambe du short ---
    const drawLeg = (L, dark) => {
        const k = dark ? -26 : 0;
        const skinC = adjustHexShade(skin, k);
        const { hx, kx, ky, ax, ay } = L;

        muscleSeg(kx, ky, ax, ay, 3.7 * s, 4.0 * s, 2.5 * s, 0.26, skinC);
        muscleSeg(hx, hipY, kx, ky, 5.3 * s, 5.7 * s, 3.8 * s, 0.4, skinC);

        // Rotule
        ctx.fillStyle = dark ? 'rgba(0,0,0,0.10)' : 'rgba(255,255,255,0.14)';
        ctx.beginPath();
        ctx.arc(kx + 0.5 * s, ky, 1.25 * s, 0, Math.PI * 2);
        ctx.fill();

        // Définition musculaire : séparation des quadriceps + tendon du mollet
        ctx.lineCap = 'round';
        ctx.strokeStyle = dark ? 'rgba(0,0,0,0.08)' : 'rgba(0,0,0,0.14)';
        ctx.lineWidth = 0.55 * s;
        ctx.beginPath();
        ctx.moveTo(hx + (kx - hx) * 0.45 + 0.9 * s, hipY + (ky - hipY) * 0.45);
        ctx.quadraticCurveTo(hx + (kx - hx) * 0.75 + 1.3 * s, hipY + (ky - hipY) * 0.75, kx + 0.9 * s, ky - 0.9 * s);
        ctx.stroke();
        ctx.strokeStyle = dark ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.16)';
        ctx.lineWidth = 0.7 * s;
        ctx.beginPath();
        ctx.moveTo(hx + (kx - hx) * 0.4 - 0.6 * s, hipY + (ky - hipY) * 0.4);
        ctx.quadraticCurveTo(hx + (kx - hx) * 0.7 - 0.8 * s, hipY + (ky - hipY) * 0.7, kx - 0.4 * s, ky - 0.6 * s);
        ctx.stroke();

        // Chaussette montante + bandeau + protège-tibia visible sous le tissu
        const sx = kx + (ax - kx) * 0.3;
        const sy = ky + (ay - ky) * 0.3;
        muscleSeg(sx, sy, ax, ay, 3.9 * s, 3.7 * s, 2.9 * s, 0.3, adjustHexShade(sockCol, k));
        limbSeg(sx, sy, sx + (ax - kx) * 0.1, sy + (ay - ky) * 0.1, 4.0 * s, 3.9 * s, adjustHexShade(sockBand, k), false);
        ctx.strokeStyle = 'rgba(0,0,0,0.12)';
        ctx.lineWidth = 0.5 * s;
        ctx.beginPath();
        ctx.moveTo(ax + (kx - ax) * 0.55, ay + (ky - ay) * 0.55);
        ctx.lineTo(ax + (kx - ax) * 0.2, ay + (ky - ay) * 0.2);
        ctx.stroke();

        const footAngle = Math.max(-0.3, Math.min(0.55, -((ax - hx) / s) * 0.05 + (L === frontLeg ? kickPhase * 0.55 : 0)));
        drawBoot(ax, ay, s, footAngle, adjustHexShade(bootCol, k));

        // Jambe du short (plis + liseré)
        const ex2 = hx + (kx - hx) * 0.6;
        const ey2 = hipY + (ky - hipY) * 0.6;
        muscleSeg(hx, hipY, ex2, ey2, 6.0 * s, 6.1 * s, 5.7 * s, 0.5, adjustHexShade(shortsCol, k));
        limbSeg(hx + (kx - hx) * 0.52, hipY + (ky - hipY) * 0.52, ex2, ey2, 5.8 * s, 5.7 * s, adjustHexShade(trim, k), false);
        ctx.strokeStyle = 'rgba(0,0,0,0.16)';
        ctx.lineWidth = 0.5 * s;
        ctx.beginPath();
        ctx.moveTo(hx - 1.2 * s, hipY + 1.2 * s);
        ctx.lineTo(hx - 0.6 * s + (kx - hx) * 0.3, hipY + (ky - hipY) * 0.42);
        ctx.stroke();
    };

    // --- Bras : biceps / avant-bras, manche, main avec pouce ---
    const drawArm = (A, dark, armband) => {
        const k = dark ? -26 : 0;
        const skinC = adjustHexShade(skin, k);
        const jC = adjustHexShade(jerseyMain, k);
        const { sx, sy, ex, ey, hx, hy } = A;

        if (isGK) {
            muscleSeg(ex, ey, hx, hy, 3.6 * s, 3.6 * s, 2.8 * s, 0.3, jC);
            muscleSeg(sx, sy, ex, ey, 4.1 * s, 4.2 * s, 3.5 * s, 0.35, jC);
            // Poignet + gant rembourré
            limbSeg(hx + (ex - hx) * 0.2, hy + (ey - hy) * 0.2, hx, hy, 2.9 * s, 3.0 * s, adjustHexShade(tc.gkGloves, -50), false);
            ctx.fillStyle = tc.gkGloves;
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 0.7 * s;
            ctx.beginPath();
            ctx.ellipse(hx, hy, 2.9 * s, 2.7 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = 'rgba(15,23,42,0.45)';
            ctx.lineWidth = 0.45 * s;
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(hx + i * 0.9 * s, hy - 0.3 * s);
                ctx.lineTo(hx + i * 1.1 * s, hy - 2.4 * s);
                ctx.stroke();
            }
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.beginPath();
            ctx.ellipse(hx - 0.8 * s, hy + 0.7 * s, 1.1 * s, 0.6 * s, 0, 0, Math.PI * 2);
            ctx.fill();
        } else {
            muscleSeg(ex, ey, hx, hy, 3.1 * s, 3.3 * s, 2.2 * s, 0.3, skinC);
            muscleSeg(sx, sy, ex, ey, 3.5 * s, 3.9 * s, 2.9 * s, 0.35, skinC);

            // Manche courte évasée + bord de manche
            const mx = sx + (ex - sx) * 0.58;
            const my = sy + (ey - sy) * 0.58;
            muscleSeg(sx, sy, mx, my, 4.7 * s, 4.9 * s, 4.3 * s, 0.5, jC);
            limbSeg(sx + (ex - sx) * 0.52, sy + (ey - sy) * 0.52, mx, my, 4.4 * s, 4.3 * s, adjustHexShade(trim, k), false);

            // Brassard de capitaine
            if (armband) {
                const bx1 = sx + (ex - sx) * 0.72;
                const by1 = sy + (ey - sy) * 0.72;
                limbSeg(bx1, by1, bx1 + (ex - sx) * 0.1, by1 + (ey - sy) * 0.1, 3.9 * s, 3.8 * s, '#facc15', false);
            }

            // Main : paume + pouce
            ctx.fillStyle = skinC;
            ctx.beginPath();
            ctx.ellipse(hx, hy, 1.55 * s, 1.7 * s, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(hx + 0.9 * s, hy - 0.5 * s, 0.55 * s, 1.0 * s, 0.5, 0, Math.PI * 2);
            ctx.fill();
        }
    };

    // 1) Bras + jambe arrière (plus sombres pour la profondeur)
    drawArm(backArm, true, false);
    drawLeg(backLeg, true);

    // 2) Jambe avant (animation de frappe incluse)
    drawLeg(frontLeg, false);

    // 3) Bassin (short)
    ctx.fillStyle = shortsCol;
    ctx.beginPath();
    ctx.roundRect(-5.3 * s, -17.9 * s, 10.6 * s, 4.9 * s, 1.7 * s);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.fillRect(-5.3 * s, -17.9 * s, 10.6 * s, 1.0 * s);
    ctx.fillStyle = trim;
    ctx.fillRect(-5.3 * s, -17.4 * s, 10.6 * s, 0.45 * s);
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 0.5 * s;
    ctx.beginPath();
    ctx.moveTo(0, -17.0 * s);
    ctx.lineTo(0, -13.2 * s);
    ctx.stroke();

    // 4) Cou (trapèzes ombrés)
    const ng = ctx.createLinearGradient(0, -32.5 * s, 0, -27.5 * s);
    ng.addColorStop(0, skin);
    ng.addColorStop(1, skinDark);
    ctx.fillStyle = ng;
    ctx.beginPath();
    ctx.moveTo(-1.7 * s, -32.5 * s);
    ctx.lineTo(1.7 * s, -32.5 * s);
    ctx.lineTo(2.6 * s, -28.5 * s);
    ctx.lineTo(-2.6 * s, -28.5 * s);
    ctx.closePath();
    ctx.fill();

    // 5) Torse / maillot
    const torsoPath = () => {
        ctx.beginPath();
        ctx.moveTo(-3.0 * s, -29.6 * s - breath);
        ctx.quadraticCurveTo(-7.5 * s, -29.3 * s, -7.5 * s, -26.0 * s);
        ctx.lineTo(-5.3 * s, -15.8 * s);
        ctx.quadraticCurveTo(0, -14.5 * s, 5.3 * s, -15.8 * s);
        ctx.lineTo(7.5 * s, -26.0 * s);
        ctx.quadraticCurveTo(7.5 * s, -29.3 * s, 3.0 * s, -29.6 * s - breath);
        ctx.quadraticCurveTo(0, -28.2 * s, -3.0 * s, -29.6 * s - breath);
        ctx.closePath();
    };

    const jg = ctx.createLinearGradient(-7.5 * s, 0, 7.5 * s, 0);
    jg.addColorStop(0, jerseyDark);
    jg.addColorStop(0.42, jerseyMain);
    jg.addColorStop(1, jerseyLight);
    torsoPath();
    ctx.fillStyle = jg;
    ctx.fill();

    // Motif du maillot (rayures / bande centrale) découpé dans le torse
    ctx.save();
    torsoPath();
    ctx.clip();
    if (pattern === 'stripes') {
        ctx.fillStyle = trim;
        for (let i = -3; i <= 3; i++) {
            ctx.fillRect((i * 3.6 - 0.9) * s, -30 * s, 1.8 * s, 16 * s);
        }
        ctx.fillStyle = jg;
        ctx.globalAlpha = 0.0;
    } else if (pattern === 'band') {
        ctx.fillStyle = trim;
        ctx.fillRect(-1.9 * s, -30 * s, 3.8 * s, 16 * s);
    }
    ctx.globalAlpha = 1;

    // Texture du tissu (fines lignes horizontales)
    ctx.strokeStyle = 'rgba(0,0,0,0.045)';
    ctx.lineWidth = 0.4 * s;
    for (let y = -29; y < -15; y += 1.3) {
        ctx.beginPath();
        ctx.moveTo(-7 * s, y * s);
        ctx.lineTo(7 * s, y * s);
        ctx.stroke();
    }

    // Ombrage vertical + pectoraux
    const vg = ctx.createLinearGradient(0, -29.6 * s, 0, -14.5 * s);
    vg.addColorStop(0, 'rgba(255,255,255,0.10)');
    vg.addColorStop(0.5, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.22)');
    ctx.fillStyle = vg;
    ctx.fillRect(-7 * s, -30 * s, 14 * s, 16 * s);

    const pg = ctx.createRadialGradient(2.2 * s, -24.5 * s, 0.5 * s, 2.2 * s, -24.5 * s, 6 * s);
    pg.addColorStop(0, 'rgba(255,255,255,0.14)');
    pg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = pg;
    ctx.fillRect(-7 * s, -30 * s, 14 * s, 16 * s);
    ctx.restore();

    // Plis du tissu
    ctx.strokeStyle = 'rgba(0,0,0,0.14)';
    ctx.lineWidth = 0.6 * s;
    ctx.beginPath();
    ctx.moveTo(-3.8 * s, -20.5 * s);
    ctx.quadraticCurveTo(-1.5 * s, -19.4 * s, 0.8 * s, -20.2 * s);
    ctx.moveTo(1.5 * s, -23.5 * s);
    ctx.quadraticCurveTo(3.2 * s, -22.4 * s, 4.6 * s, -23.2 * s);
    ctx.moveTo(-4.6 * s, -25.0 * s);
    ctx.quadraticCurveTo(-3.2 * s, -24.0 * s, -2.0 * s, -24.6 * s);
    ctx.moveTo(3.4 * s, -18.4 * s);
    ctx.quadraticCurveTo(4.4 * s, -17.6 * s, 5.0 * s, -18.0 * s);
    ctx.stroke();

    // Liseré de lumière côté projecteur
    ctx.strokeStyle = 'rgba(255,255,255,0.24)';
    ctx.lineWidth = 0.7 * s;
    ctx.beginPath();
    ctx.moveTo(7.5 * s, -26.0 * s);
    ctx.lineTo(5.4 * s, -16.2 * s);
    ctx.stroke();

    // Bandes latérales + ourlet
    ctx.strokeStyle = trim;
    ctx.lineWidth = 1.2 * s;
    ctx.beginPath();
    ctx.moveTo(-6.0 * s, -26.0 * s);
    ctx.lineTo(-4.9 * s, -16.4 * s);
    ctx.moveTo(6.0 * s, -26.0 * s);
    ctx.lineTo(4.9 * s, -16.4 * s);
    ctx.stroke();
    ctx.lineWidth = 0.8 * s;
    ctx.beginPath();
    ctx.moveTo(-5.2 * s, -15.9 * s);
    ctx.quadraticCurveTo(0, -14.8 * s, 5.2 * s, -15.9 * s);
    ctx.stroke();

    // Col en V
    ctx.fillStyle = skin;
    ctx.beginPath();
    ctx.moveTo(-2.4 * s, -29.5 * s - breath);
    ctx.lineTo(0, -26.5 * s);
    ctx.lineTo(2.4 * s, -29.5 * s - breath);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.moveTo(-2.4 * s, -29.5 * s - breath);
    ctx.lineTo(0, -26.5 * s);
    ctx.lineTo(0.2 * s, -29.0 * s);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = trim;
    ctx.lineWidth = 0.95 * s;
    ctx.beginPath();
    ctx.moveTo(-2.7 * s, -29.6 * s - breath);
    ctx.lineTo(0, -26.3 * s);
    ctx.lineTo(2.7 * s, -29.6 * s - breath);
    ctx.stroke();

    // Écusson
    ctx.fillStyle = trim;
    ctx.beginPath();
    ctx.moveTo(2.2 * s, -26.2 * s);
    ctx.lineTo(3.9 * s, -26.2 * s);
    ctx.lineTo(3.9 * s, -24.7 * s);
    ctx.quadraticCurveTo(3.05 * s, -23.7 * s, 2.2 * s, -24.7 * s);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(3.05 * s, -25.4 * s, 0.45 * s, 0, Math.PI * 2);
    ctx.fill();

    // Tissu technique : reflet satiné, plis dynamiques, ombre d'aisselle, sueur
    ctx.save();
    torsoPath();
    ctx.clip();
    const sheen = ctx.createLinearGradient(-7.5 * s, -29 * s, 7.5 * s, -17 * s);
    sheen.addColorStop(0, 'rgba(255,255,255,0)');
    sheen.addColorStop(0.42, 'rgba(255,255,255,0.14)');
    sheen.addColorStop(0.6, 'rgba(255,255,255,0)');
    sheen.addColorStop(1, 'rgba(0,0,0,0.10)');
    ctx.fillStyle = sheen;
    ctx.fillRect(-8 * s, -31 * s, 16 * s, 18 * s);
    ctx.strokeStyle = `rgba(0,0,0,${0.07 + 0.11 * moveRatio})`;
    ctx.lineWidth = 0.5 * s;
    for (let i = 0; i < 3; i++) {
        const wy = -24.5 + i * 3.3;
        ctx.beginPath();
        ctx.moveTo(-6.8 * s, wy * s);
        ctx.quadraticCurveTo(-1 * s, (wy + 0.9 + Math.sin(cyc + i) * 0.6 * moveRatio) * s, 6.8 * s, (wy - 0.4) * s);
        ctx.stroke();
    }
    const aoArm = ctx.createLinearGradient(-8 * s, 0, -4.6 * s, 0);
    aoArm.addColorStop(0, 'rgba(0,0,0,0.30)');
    aoArm.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = aoArm;
    ctx.fillRect(-8 * s, -29.5 * s, 3.6 * s, 13 * s);
    if (moveRatio > 0.45) {
        ctx.fillStyle = `rgba(0,0,0,${0.12 * (moveRatio - 0.45)})`;
        ctx.beginPath();
        ctx.ellipse(-1 * s, -21.5 * s, 3.4 * s, 4.6 * s, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    // Logo équipementier (virgule stylisée) côté gauche de la poitrine
    ctx.strokeStyle = trim;
    ctx.lineWidth = 0.7 * s;
    ctx.beginPath();
    ctx.moveTo(-4.3 * s, -25.4 * s);
    ctx.quadraticCurveTo(-3.2 * s, -24.2 * s, -1.4 * s, -26.0 * s);
    ctx.stroke();
    // Col côtelé : double liseré
    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.lineWidth = 0.4 * s;
    ctx.beginPath();
    ctx.moveTo(-2.3 * s, -29.9 * s - breath);
    ctx.lineTo(0, -26.9 * s);
    ctx.lineTo(2.3 * s, -29.9 * s - breath);
    ctx.stroke();

    // Numéro (non inversé par le miroir, avec contour pour la lisibilité)
    ctx.save();
    ctx.scale(facing, 1);
    ctx.font = `800 ${Math.max(7, Math.round(6.6 * s))}px "Chakra Petch", sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 0.9 * s;
    ctx.strokeStyle = 'rgba(0,0,0,0.38)';
    ctx.strokeText(displayNum, 0, -19.5 * s);
    ctx.fillStyle = isGK ? '#0f172a' : tc.number;
    if (isGK) {
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.strokeText(displayNum, 0, -19.5 * s);
    }
    ctx.fillText(displayNum, 0, -19.5 * s);
    ctx.restore();

    // 6) Bras avant (capitaine = « Meneur » n°8 de la formation)
    drawArm(frontArm, false, p.id === 8);

    // 7) Tête détaillée (proportions réalistes : plus petite, inclinée selon l'effort)
    ctx.save();
    const headPivotY = -30.5 * s;
    ctx.translate(0.2 * s, headPivotY);
    ctx.rotate(Math.max(-0.1, Math.min(0.12, lookY * 0.05 + leanF * 0.45)) + moveRatio * 0.03);
    ctx.scale(0.88, 0.88);
    ctx.translate(-0.2 * s, -headPivotY);
    const hcx = 0.3 * s;
    const hcy = -35.0 * s - breath;
    const mouthOpen = isCelebrating || kickPhase > 0.35 || (isGK && p.diveAnim > 0.05);

    // Crâne / visage avec dégradé de volume
    const fg = ctx.createLinearGradient(hcx - 4 * s, 0, hcx + 4.5 * s, 0);
    fg.addColorStop(0, skinDark);
    fg.addColorStop(0.42, skin);
    fg.addColorStop(1, skinLight);
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.ellipse(hcx, hcy, 3.8 * s, 4.3 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // Menton / mâchoire
    ctx.beginPath();
    ctx.ellipse(hcx + 1.3 * s, hcy + 3.2 * s, 2.3 * s, 1.5 * s, 0.15, 0, Math.PI * 2);
    ctx.fill();

    // Pommette
    ctx.fillStyle = 'rgba(190, 70, 70, 0.12)';
    ctx.beginPath();
    ctx.ellipse(hcx + 1.7 * s, hcy + 1.3 * s, 1.6 * s, 1.0 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // Ombre sous le menton
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(hcx + 0.3 * s, hcy + 3.4 * s, 3.0 * s, 1.4 * s, 0, 0, Math.PI);
    ctx.fill();

    // Oreille
    ctx.fillStyle = skinDark;
    ctx.beginPath();
    ctx.ellipse(hcx - 1.4 * s, hcy + 0.3 * s, 0.95 * s, 1.4 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 0.35 * s;
    ctx.beginPath();
    ctx.arc(hcx - 1.4 * s, hcy + 0.3 * s, 0.45 * s, 0, Math.PI * 2);
    ctx.stroke();

    // Barbe ou barbe de trois jours
    if (p.hasBeard) {
        ctx.fillStyle = p.hair;
        ctx.globalAlpha = 0.92;
        ctx.beginPath();
        ctx.ellipse(hcx + 0.7 * s, hcy + 2.3 * s, 3.3 * s, 2.3 * s, 0, 0.02 * Math.PI, 0.98 * Math.PI);
        ctx.fill();
        ctx.fillRect(hcx - 0.4 * s, hcy + 1.4 * s, 3.2 * s, 0.5 * s);
        ctx.globalAlpha = 1;
    } else if (p.id % 4 === 0) {
        ctx.fillStyle = 'rgba(30,20,15,0.22)';
        ctx.beginPath();
        ctx.ellipse(hcx + 0.9 * s, hcy + 2.4 * s, 3.0 * s, 2.0 * s, 0, 0.05 * Math.PI, 0.95 * Math.PI);
        ctx.fill();
    }

    // Nez + narine
    ctx.fillStyle = skinDark;
    ctx.beginPath();
    ctx.moveTo(hcx + 3.5 * s, hcy - 0.7 * s);
    ctx.lineTo(hcx + 4.8 * s, hcy + 1.3 * s);
    ctx.lineTo(hcx + 3.4 * s, hcy + 1.6 * s);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(40,15,10,0.6)';
    ctx.beginPath();
    ctx.arc(hcx + 3.9 * s, hcy + 1.35 * s, 0.22 * s, 0, Math.PI * 2);
    ctx.fill();

    // Œil : blanc, iris, pupille, paupière, reflet (regarde le ballon)
    const ex0 = hcx + 1.9 * s;
    const ey0 = hcy - 0.3 * s;
    ctx.fillStyle = '#f4f4f5';
    ctx.beginPath();
    ctx.ellipse(ex0, ey0, 1.05 * s, 0.65 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    const ix = ex0 + lookX * 0.4 * s;
    const iy = ey0 + lookY * 0.18 * s;
    ctx.fillStyle = eyeCol;
    ctx.beginPath();
    ctx.arc(ix, iy, 0.5 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#050505';
    ctx.beginPath();
    ctx.arc(ix, iy, 0.26 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(ix + 0.15 * s, iy - 0.15 * s, 0.12 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(30,15,10,0.65)';
    ctx.lineWidth = 0.4 * s;
    ctx.beginPath();
    ctx.ellipse(ex0, ey0, 1.05 * s, 0.65 * s, 0, Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();

    // Sourcil (relevé en célébration)
    ctx.strokeStyle = p.hair;
    ctx.lineWidth = 0.7 * s;
    const browLift = isCelebrating ? -0.5 * s : 0;
    ctx.beginPath();
    ctx.moveTo(hcx + 0.8 * s, hcy - 1.4 * s + browLift);
    ctx.quadraticCurveTo(hcx + 1.9 * s, hcy - 1.9 * s + browLift, hcx + 3.0 * s, hcy - 1.3 * s + browLift * 0.6);
    ctx.stroke();

    // Paupière marquée + cerne léger
    ctx.strokeStyle = 'rgba(40,20,15,0.35)';
    ctx.lineWidth = 0.3 * s;
    ctx.beginPath();
    ctx.ellipse(ex0, ey0 - 0.1 * s, 1.15 * s, 0.8 * s, 0, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
    ctx.fillStyle = 'rgba(60,30,40,0.10)';
    ctx.beginPath();
    ctx.ellipse(ex0, ey0 + 0.85 * s, 1.0 * s, 0.35 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // Second œil (vue de trois quarts), à moitié caché par l'arête du nez
    const fx = hcx + 3.35 * s;
    ctx.fillStyle = '#e8e8ea';
    ctx.beginPath();
    ctx.ellipse(fx, ey0 + 0.05 * s, 0.5 * s, 0.5 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = eyeCol;
    ctx.beginPath();
    ctx.arc(fx + lookX * 0.2 * s, ey0 + 0.05 * s + lookY * 0.1 * s, 0.3 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#050505';
    ctx.beginPath();
    ctx.arc(fx + lookX * 0.2 * s, ey0 + 0.05 * s + lookY * 0.1 * s, 0.15 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(30,15,10,0.55)';
    ctx.lineWidth = 0.3 * s;
    ctx.beginPath();
    ctx.arc(fx, ey0 + 0.05 * s, 0.5 * s, Math.PI * 1.1, Math.PI * 1.9);
    ctx.stroke();
    // Arête du nez éclairée + contour de mâchoire
    ctx.strokeStyle = skinLight;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 0.4 * s;
    ctx.beginPath();
    ctx.moveTo(hcx + 3.1 * s, hcy - 1.1 * s);
    ctx.lineTo(hcx + 4.4 * s, hcy + 0.9 * s);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(0,0,0,0.14)';
    ctx.lineWidth = 0.45 * s;
    ctx.beginPath();
    ctx.ellipse(hcx + 0.9 * s, hcy + 1.4 * s, 3.2 * s, 2.9 * s, 0, Math.PI * 0.12, Math.PI * 0.62);
    ctx.stroke();
    // Lèvres
    if (!mouthOpen) {
        ctx.fillStyle = 'rgba(160,70,70,0.28)';
        ctx.beginPath();
        ctx.ellipse(hcx + 2.3 * s, hcy + 2.55 * s, 0.95 * s, 0.3 * s, -0.05, 0, Math.PI * 2);
        ctx.fill();
    }

    // Bouche (ouverte si cri / effort)
    if (mouthOpen) {
        ctx.fillStyle = '#4a1414';
        ctx.beginPath();
        ctx.ellipse(hcx + 2.3 * s, hcy + 2.3 * s, 1.0 * s, 0.75 * s, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f5f5f4';
        ctx.fillRect(hcx + 1.6 * s, hcy + 1.7 * s, 1.4 * s, 0.35 * s);
    } else {
        ctx.strokeStyle = 'rgba(70,20,20,0.65)';
        ctx.lineWidth = 0.5 * s;
        ctx.beginPath();
        ctx.moveTo(hcx + 1.5 * s, hcy + 2.3 * s);
        ctx.lineTo(hcx + 3.0 * s, hcy + 2.2 * s);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 0.35 * s;
        ctx.beginPath();
        ctx.moveTo(hcx + 1.8 * s, hcy + 2.7 * s);
        ctx.lineTo(hcx + 2.8 * s, hcy + 2.65 * s);
        ctx.stroke();
    }

    // Coiffure (5 styles) avec mèches et reflets
    ctx.fillStyle = p.hair;
    const hairStyle = (p.id * 7 + 3) % 5;
    const hairHi = adjustHexShade(p.hair, 34);
    if (hairStyle === 4) {
        // Crâne rasé
        ctx.globalAlpha = 0.55;
        ctx.beginPath();
        ctx.ellipse(hcx - 0.1 * s, hcy - 0.5 * s, 3.9 * s, 3.7 * s, 0, Math.PI * 1.02, Math.PI * 1.98);
        ctx.fill();
        ctx.globalAlpha = 1;
    } else {
        ctx.beginPath();
        ctx.ellipse(hcx - 0.2 * s, hcy - 0.7 * s, 4.0 * s, 3.8 * s, 0, Math.PI * 0.98, Math.PI * 2.04);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(hcx - 4.0 * s, hcy - 1.0 * s, 2.0 * s, 3.4 * s, 1.0 * s);
        ctx.fill();
        // Patte devant l'oreille
        ctx.beginPath();
        ctx.roundRect(hcx - 1.9 * s, hcy - 1.2 * s, 0.9 * s, 2.2 * s, 0.4 * s);
        ctx.fill();

        if (hairStyle === 1) {
            ctx.beginPath();
            ctx.ellipse(hcx + 1.4 * s, hcy - 4.2 * s, 2.7 * s, 1.5 * s, -0.15, 0, Math.PI * 2);
            ctx.fill();
        } else if (hairStyle === 2) {
            for (let i = 0; i < 8; i++) {
                const ang = Math.PI * (1.0 + i / 7);
                ctx.beginPath();
                ctx.arc(hcx + Math.cos(ang) * 3.8 * s, hcy - 0.6 * s + Math.sin(ang) * 3.8 * s, 1.5 * s, 0, Math.PI * 2);
                ctx.fill();
            }
        } else if (hairStyle === 3) {
            limbSeg(hcx - 3.4 * s, hcy - 1.5 * s, hcx - 6.4 * s, hcy + 3.5 * s, 2.4 * s, 1.6 * s, p.hair, false);
        }

        // Reflets / mèches
        ctx.strokeStyle = hairHi;
        ctx.globalAlpha = 0.45;
        ctx.lineWidth = 0.4 * s;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.ellipse(hcx - 0.2 * s, hcy - 0.9 * s, (3.4 - i * 0.7) * s, (3.2 - i * 0.6) * s, 0, Math.PI * (1.15 + i * 0.1), Math.PI * (1.7 - i * 0.05));
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }

    if (hairStyle !== 4) {
        // Brillance du cuir chevelu + mèches fines
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 0.9 * s;
        ctx.beginPath();
        ctx.ellipse(hcx + 0.4 * s, hcy - 1.2 * s, 3.1 * s, 2.7 * s, 0, Math.PI * 1.25, Math.PI * 1.6);
        ctx.stroke();
        ctx.strokeStyle = adjustHexShade(p.hair, -28);
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 0.3 * s;
        for (let i = 0; i < 9; i++) {
            const a = Math.PI * (1.08 + 0.9 * ((Math.sin(p.id * 12.9 + i * 4.1) + 1) / 2));
            ctx.beginPath();
            ctx.moveTo(hcx + Math.cos(a) * 1.6 * s, hcy - 0.8 * s + Math.sin(a) * 1.5 * s);
            ctx.lineTo(hcx + Math.cos(a) * 3.9 * s, hcy - 0.7 * s + Math.sin(a) * 3.7 * s);
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }

    ctx.restore(); // fin de la tête
    ctx.restore(); // fin du corps

    // Nom du joueur (non déformé, avec contour pour la lisibilité)
    if (isHolder || p.role === 'FWD' || isGK) {
        ctx.font = `600 ${Math.max(8, Math.round(7.2 * s))}px "Inter", sans-serif`;
        ctx.textAlign = 'center';
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = 'rgba(0,0,0,0.55)';
        ctx.strokeText(displayName, 0, 10 * s);
        ctx.fillStyle = isHolder ? '#fde047' : 'rgba(255,255,255,0.88)';
        ctx.fillText(displayName, 0, 10 * s);
    }

    ctx.restore();
}

function drawBall() {
    if (!ensureCanvasContext()) return;
    ball.trail.forEach((tr, idx) => {
        const tp = projectPoint(tr.x, tr.y, tr.z);
        const radius = (3.8 * tp.scale) * (idx / ball.trail.length);
        ctx.fillStyle = ball.isPowerShot
            ? `rgba(251, 191, 36, ${tr.alpha * 0.55})`
            : `rgba(255, 255, 255, ${tr.alpha * 0.35})`;
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, Math.max(1, radius), 0, Math.PI * 2);
        ctx.fill();
    });

    const bPos = projectPoint(ball.x, ball.y, ball.z);
    const r = Math.max(4.5, 4.6 * bPos.scale);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
    ctx.beginPath();
    ctx.ellipse(bPos.x + 2, bPos.groundY + 1, r * 1.15, r * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(bPos.x, bPos.y);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(ball.spin);
    ctx.fillStyle = '#0f172a';
    for (let i = 0; i < 3; i++) {
        const ang = (i * Math.PI * 2) / 3;
        ctx.beginPath();
        ctx.arc(Math.cos(ang) * r * 0.48, Math.sin(ang) * r * 0.48, r * 0.28, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function drawConfetti() {
    if (!ensureCanvasContext()) return;
    STATE.confetti.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.6);
        ctx.restore();
    });
}

function gameLoop(now) {
    const rawDt = (now - lastTime) / 1000;
    lastTime = now;

    updateSimulation(rawDt);

    if (ensureCanvasContext()) {
        ctx.save();
        if (STATE.cameraShake > 0) {
            const sx = (Math.random() - 0.5) * STATE.cameraShake;
            const sy = (Math.random() - 0.5) * STATE.cameraShake;
            ctx.translate(sx, sy);
        }
        if (STATE.zoom > 1.002) {
            // caméra "ralenti" : zoom dramatique sur la surface de but
            const zc = projectPoint(PITCH_NORM.goalX - 30, 300, 12);
            ctx.translate(zc.x, zc.y);
            ctx.scale(STATE.zoom, STATE.zoom);
            ctx.translate(-zc.x, -zc.y);
        }

        drawStadiumEnvironment();
        drawPitch();
        drawGoalBack();

        const renderList = [
            ...players.map(p => ({ type: 'PLAYER', y: p.y, data: p })),
            { type: 'BALL', y: ball.y, data: ball },
            { type: 'GOAL_FAR', y: PITCH_NORM.goalYTop - 2, data: null },
            { type: 'GOAL_NEAR', y: PITCH_NORM.goalYBottom + 3, data: null }
        ];
        renderList.sort((a, b) => a.y - b.y);

        renderList.forEach(item => {
            if (item.type === 'PLAYER') drawRealisticPlayer(item.data);
            else if (item.type === 'BALL') drawBall();
            else if (item.type === 'GOAL_FAR') drawGoalFarPost();
            else if (item.type === 'GOAL_NEAR') drawGoalNear();
        });

        drawConfetti();
        drawFx();
        ctx.restore();
    }

    rafId = requestAnimationFrame(gameLoop);
}

// ============================================================================
// GESTION DES ÉQUIPES & APERÇU VISUEL
