<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Foot Interactif - Stadium Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #060b14;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
        }
        .font-sport {
            font-family: 'Chakra Petch', sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 28px rgba(16, 185, 129, 0.85); }
        }
        .glow-emerald {
            animation: pulseGlow 2s infinite;
        }
        @keyframes bannerPop {
            0% { transform: translate(-50%, -60%) scale(0.4); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
            25% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            85% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -45%) scale(0.9); opacity: 0; }
        }
        .animate-banner {
            animation: bannerPop 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .goal-winner-avatar {
            width: 76px;
            height: 76px;
            border: 3px solid #fbbf24;
            border-radius: 9999px;
            object-fit: cover;
            box-shadow: 0 0 24px rgba(251, 191, 36, 0.45);
        }
        .glass-panel {
            background: rgba(10, 17, 30, 0.80);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
        }
    </style>
</head>
<body class="relative w-full h-full flex flex-col justify-between">

    <!-- Canvas Principal du Stade -->
    <canvas id="stadiumCanvas" class="absolute inset-0 z-0"></canvas>

    <!-- HUD Supérieur : Scoreboard TV Live & Jauge de Progression -->
    <div class="relative z-10 w-full px-3 pt-2.5 sm:px-6 sm:pt-4 flex flex-col gap-2 pointer-events-none">
        <div class="flex flex-wrap items-center justify-between gap-2">
            <!-- Tableau d'affichage TV -->
            <div class="glass-panel rounded-2xl px-3 py-2 sm:px-4 sm:py-2.5 flex items-center gap-2.5 sm:gap-4 shadow-2xl pointer-events-auto">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></span>
                    <span class="text-[10px] sm:text-xs font-extrabold uppercase tracking-wider text-rose-400">LIVE</span>
                </div>
                <div class="h-5 w-px bg-white/15"></div>
                <div class="flex items-center gap-2 sm:gap-3">
                    <div class="flex items-center gap-1.5">
                        <div id="scoreboard-team-badge" class="w-4 h-4 rounded-full bg-gradient-to-tr from-sky-500 to-blue-300 border border-white shadow-sm shrink-0"></div>
                        <span id="scoreboard-team-name" class="font-sport font-bold text-xs sm:text-sm tracking-wide text-sky-100 uppercase truncate max-w-[125px] sm:max-w-[180px]">ÉQUIPE LIVE</span>
                    </div>
                    <div class="bg-slate-950/90 border border-white/15 rounded-xl px-2.5 sm:px-3 py-0.5 flex items-center gap-1.5 sm:gap-2">
                        <span id="score-goals" class="font-sport font-bold text-lg sm:text-2xl text-emerald-400">0</span>
                        <span class="text-[10px] sm:text-xs text-slate-400 font-semibold">BUTS</span>
                    </div>
                    <div class="hidden md:flex items-center gap-1.5 text-xs text-amber-300 font-semibold bg-amber-500/10 border border-amber-400/20 px-2.5 py-1 rounded-xl">
                        <span>🪙</span>
                        <span id="total-coins">0</span>
                        <span class="text-amber-200/70">pièces</span>
                    </div>
                </div>
            </div>

            <!-- Jauge d'Attaque & Passes vers la Cage -->
            <div class="glass-panel rounded-2xl px-3 py-2 sm:px-4 sm:py-2.5 flex-1 max-w-md shadow-2xl pointer-events-auto">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[11px] sm:text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                        <span>⚽ Progression Attaque</span>
                        <span id="phase-badge" class="px-2 py-0.5 rounded-md text-[10px] font-extrabold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">CONSTRUCTION</span>
                    </span>
                    <span class="font-sport font-bold text-xs sm:text-sm text-amber-300">
                        <span id="pass-current">0</span> / <span id="pass-target">8</span> PASSES
                    </span>
                </div>
                <div class="w-full h-2.5 bg-slate-900/90 rounded-full overflow-hidden border border-white/10 p-0.5">
                    <div id="pass-progress-bar" class="h-full rounded-full bg-gradient-to-r from-sky-400 via-emerald-400 to-amber-400 transition-all duration-300" style="width: 0%;"></div>
                </div>
            </div>

            <!-- Boutons Rapides Audio & Mode Streamer -->
            <div class="flex items-center gap-2 pointer-events-auto">
                <button id="btn-sound" title="Activer/Couper le son du stade" class="glass-panel hover:bg-white/15 active:scale-95 transition rounded-xl p-2 sm:p-2.5 text-sm font-bold flex items-center gap-1.5 shadow-lg">
                    <span id="sound-icon">🔇</span>
                    <span class="hidden sm:inline text-xs">Son Stade</span>
                </button>
                <button id="btn-toggle-hud" title="Masquer/Afficher le panneau de contrôle" class="glass-panel hover:bg-white/15 active:scale-95 transition rounded-xl p-2 sm:p-2.5 text-xs font-bold flex items-center gap-1.5 shadow-lg">
                    <span>🎛️</span>
                    <span id="hud-toggle-text" class="hidden sm:inline">Masquer Panneau</span>
                </button>
            </div>
        </div>

        <!-- Flux des derniers cadeaux reçus -->
        <div id="gift-feed" class="flex flex-col items-start gap-1.5 mt-0.5 max-w-xs sm:max-w-sm"></div>
    </div>

    <!-- Bannière Centrale Événement (BUT ! / ARRÊT ! / SUPER FRAPPE !) -->
    <div id="event-banner-container" class="pointer-events-none fixed inset-0 z-20 flex items-center justify-center" aria-live="polite" aria-atomic="true"></div>

    <!-- Panneau de Contrôle Streamer (Équipes + Cadeaux + Config + Connexion Griffon Arcade / TikTok Studio) -->
    <div id="streamer-panel" class="relative z-10 w-full px-2.5 pb-2.5 sm:px-6 sm:pb-4 transition-all duration-300">
        <div class="glass-panel rounded-2xl p-2.5 sm:p-3.5 shadow-2xl max-w-7xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-12 gap-2.5 sm:gap-3 items-stretch">

                <!-- Section 1 : Choix d'Équipe (3 colonnes XL) -->
                <div class="xl:col-span-3 flex flex-col justify-between gap-1.5 bg-slate-950/45 border border-white/10 rounded-xl p-2 sm:p-2.5">
                    <div class="flex items-center justify-between gap-1">
                        <span class="text-[10px] sm:text-[11px] font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1">
                            <span>🛡️ Équipe Live</span>
                        </span>
                        <div class="flex items-center gap-1">
                            <select id="select-team-category" onchange="filterTeamsByCategory()" aria-label="Filtrer les équipes" class="bg-slate-900 border border-white/15 rounded-lg px-1.5 py-0.5 text-[10px] font-bold text-sky-300 focus:outline-none focus:border-sky-400">
                                <option value="ALL">Toutes (24)</option>
                                <option value="CLUB">Clubs</option>
                                <option value="NATIONAL">Sélections</option>
                                <option value="SPECIAL">Spéciales</option>
                            </select>
                            <button type="button" onclick="pickRandomTeam()" title="Choisir une équipe au hasard" class="bg-indigo-600/80 hover:bg-indigo-500 active:scale-95 text-white text-[10px] font-bold px-2 py-0.5 rounded-lg transition">
                                🎲 Aléatoire
                            </button>
                        </div>
                    </div>

                    <!-- Sélecteur d'équipe -->
                    <select id="select-team" onchange="changeTeam(this.value)" aria-label="Choisir une équipe" class="w-full bg-slate-900 border border-white/20 rounded-xl px-2.5 py-1.5 text-xs font-bold text-white focus:outline-none focus:border-emerald-400 cursor-pointer">
                    </select>

                    <!-- Aperçu visuel instantané des couleurs et du maillot -->
                    <div class="flex items-center justify-between gap-2 bg-slate-900/80 border border-white/10 rounded-xl px-2.5 py-1.5">
                        <div class="flex items-center gap-2 min-w-0">
                            <div id="team-preview-jersey" class="w-7 h-7 rounded-lg flex items-center justify-center font-sport font-extrabold text-[11px] border border-white/30 shadow shrink-0">
                                10
                            </div>
                            <div class="min-w-0">
                                <div id="team-preview-name" class="text-xs font-extrabold text-white truncate">Paris SG</div>
                                <div id="team-preview-meta" class="text-[10px] text-slate-400 truncate">Club • 16 Joueurs</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0" title="Couleurs Champ & Gardien">
                            <span id="swatch-primary" class="w-3.5 h-3.5 rounded-full border border-white/50"></span>
                            <span id="swatch-secondary" class="w-3.5 h-3.5 rounded-full border border-white/50"></span>
                            <span id="swatch-gk" class="w-3.5 h-3.5 rounded-full border border-white/50"></span>
                        </div>
                    </div>

                    <!-- Personnalisation libre des couleurs des maillots -->
                    <div class="flex flex-col gap-1.5 bg-slate-900/65 border border-white/10 rounded-xl px-2 py-1.5">
                        <div class="flex items-center justify-between gap-1">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-300">🎨 Couleurs Maillots & Shorts</span>
                            <div class="flex items-center gap-1">
                                <select id="select-color-target" onchange="syncPaletteWithTarget()" aria-label="Cible de couleur rapide" class="bg-slate-800 border border-white/15 rounded px-1.5 py-0.5 text-[9px] font-bold text-emerald-300 focus:outline-none">
                                    <option value="primary">Maillot</option>
                                    <option value="shorts">Short</option>
                                    <option value="secondary">Bandes</option>
                                    <option value="number">Numéro</option>
                                    <option value="gkJersey">Gardien</option>
                                </select>
                                <button id="btn-reset-team-colors" type="button" onclick="resetCurrentTeamColors()" title="Réinitialiser les couleurs officielles de cette équipe" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-white/10 transition active:scale-95">
                                    ↺ Officiel
                                </button>
                            </div>
                        </div>

                        <!-- Couleurs rapides : application directe au clic -->
                        <div id="quick-color-swatches" class="flex items-center justify-between gap-1 pt-0.5" title="Clique sur une couleur pour l'appliquer immédiatement"></div>

                        <!-- Palette complète + sélecteurs par zone (Maillot, Short, Bandes, Numéro, Gardien) -->
                        <div class="grid grid-cols-5 gap-1 pt-0.5 border-t border-white/10">
                            <label class="flex flex-col items-center gap-0.5 text-[9px] font-semibold text-slate-300 cursor-pointer" title="Couleur officielle / perso du maillot">
                                <span>Maillot</span>
                                <input id="color-picker-primary" type="color" oninput="updateCustomTeamColor('primary', this.value)" onchange="updateCustomTeamColor('primary', this.value)" class="w-full h-5 rounded cursor-pointer bg-transparent border border-white/20 p-0">
                            </label>
                            <label class="flex flex-col items-center gap-0.5 text-[9px] font-semibold text-slate-300 cursor-pointer" title="Couleur officielle / perso du short">
                                <span>Short</span>
                                <input id="color-picker-shorts" type="color" oninput="updateCustomTeamColor('shorts', this.value)" onchange="updateCustomTeamColor('shorts', this.value)" class="w-full h-5 rounded cursor-pointer bg-transparent border border-white/20 p-0">
                            </label>
                            <label class="flex flex-col items-center gap-0.5 text-[9px] font-semibold text-slate-300 cursor-pointer" title="Bandes et détails">
                                <span>Bandes</span>
                                <input id="color-picker-secondary" type="color" oninput="updateCustomTeamColor('secondary', this.value)" onchange="updateCustomTeamColor('secondary', this.value)" class="w-full h-5 rounded cursor-pointer bg-transparent border border-white/20 p-0">
                            </label>
                            <label class="flex flex-col items-center gap-0.5 text-[9px] font-semibold text-slate-300 cursor-pointer" title="Numéro sur le maillot">
                                <span>Numéro</span>
                                <input id="color-picker-number" type="color" oninput="updateCustomTeamColor('number', this.value)" onchange="updateCustomTeamColor('number', this.value)" class="w-full h-5 rounded cursor-pointer bg-transparent border border-white/20 p-0">
                            </label>
                            <label class="flex flex-col items-center gap-0.5 text-[9px] font-semibold text-slate-300 cursor-pointer" title="Maillot du gardien">
                                <span>Gardien</span>
                                <input id="color-picker-gk" type="color" oninput="updateCustomTeamColor('gkJersey', this.value)" onchange="updateCustomTeamColor('gkJersey', this.value)" class="w-full h-5 rounded cursor-pointer bg-transparent border border-white/20 p-0">
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Section 2 : Boutons Cadeaux Interactifs (4 colonnes XL) -->
                <div class="xl:col-span-4 flex flex-col justify-between gap-1.5 bg-slate-950/45 border border-white/10 rounded-xl p-2 sm:p-2.5">
                    <div class="flex items-center justify-between gap-1">
                        <span class="text-[10px] sm:text-[11px] font-bold uppercase tracking-wider text-slate-300">🎁 Simuler un Cadeau Live</span>
                        <button id="btn-auto-live" type="button" class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-indigo-500/25 text-indigo-300 border border-indigo-400/30 hover:bg-indigo-500/40 transition">
                            🤖 Auto-Live : OFF
                        </button>
                    </div>
                    <div class="grid grid-cols-4 gap-1.5">
                        <button type="button" onclick="triggerGift('🌹 Rose', 1, 1, false)" class="group bg-gradient-to-b from-rose-500/25 to-rose-600/10 hover:from-rose-500/40 hover:to-rose-600/25 border border-rose-400/30 rounded-xl p-1.5 sm:p-2 flex flex-col items-center justify-center transition active:scale-95">
                            <span class="text-base sm:text-lg group-hover:scale-110 transition-transform">🌹</span>
                            <span class="text-[10px] sm:text-[11px] font-bold text-white truncate w-full text-center">Rose</span>
                            <span class="text-[9px] font-semibold text-amber-300">1 🪙 • +1</span>
                        </button>
                        <button type="button" onclick="triggerGift('🔥 Flamme', 5, 2, false)" class="group bg-gradient-to-b from-orange-500/25 to-orange-600/10 hover:from-orange-500/40 hover:to-orange-600/25 border border-orange-400/30 rounded-xl p-1.5 sm:p-2 flex flex-col items-center justify-center transition active:scale-95">
                            <span class="text-base sm:text-lg group-hover:scale-110 transition-transform">🔥</span>
                            <span class="text-[10px] sm:text-[11px] font-bold text-white truncate w-full text-center">Flamme</span>
                            <span class="text-[9px] font-semibold text-amber-300">5 🪙 • +2</span>
                        </button>
                        <button type="button" onclick="triggerGift('💎 Diamant', 25, 4, false)" class="group bg-gradient-to-b from-cyan-500/25 to-cyan-600/10 hover:from-cyan-500/40 hover:to-cyan-600/25 border border-cyan-400/30 rounded-xl p-1.5 sm:p-2 flex flex-col items-center justify-center transition active:scale-95">
                            <span class="text-base sm:text-lg group-hover:scale-110 transition-transform">💎</span>
                            <span class="text-[10px] sm:text-[11px] font-bold text-white truncate w-full text-center">Diamant</span>
                            <span class="text-[9px] font-semibold text-amber-300">25 🪙 • +4</span>
                        </button>
                        <button type="button" onclick="triggerGift('🦁 LION (TIR!)', 500, 99, true)" class="glow-emerald group bg-gradient-to-b from-amber-500/35 to-emerald-600/25 hover:from-amber-500/50 hover:to-emerald-600/40 border border-amber-300/60 rounded-xl p-1.5 sm:p-2 flex flex-col items-center justify-center transition active:scale-95">
                            <span class="text-base sm:text-lg group-hover:scale-125 transition-transform">🦁</span>
                            <span class="text-[10px] sm:text-[11px] font-extrabold text-amber-200 truncate w-full text-center">GROS TIR</span>
                            <span class="text-[9px] font-bold text-emerald-300">FRAPPE !</span>
                        </button>
                    </div>
                </div>

                <!-- Section 3 : Paramètres de Difficulté & Passes (2 colonnes XL) -->
                <div class="xl:col-span-2 flex flex-col justify-between gap-2 bg-slate-950/45 border border-white/10 rounded-xl p-2 sm:p-2.5">
                <!-- Section 4 : Connexion Live (Compte TikTok, Griffon Arcade & TikTok Studio) (3 colonnes XL) -->
                <div class="xl:col-span-3 flex flex-col justify-between gap-1.5 bg-slate-950/45 border border-white/10 rounded-xl p-2 sm:p-2.5">
                    <div class="flex items-center justify-between gap-1">
                        <span class="text-[10px] sm:text-[11px] font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1">
                            <span>📱 Compte TikTok</span>
                        </span>
                        <span id="tiktok-account-badge" class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400 truncate max-w-[130px]">Non lié</span>
                    </div>

                    <!-- Champ @pseudo TikTok + Bouton Lier/Connecter le compte -->
                    <div class="flex gap-1.5">
                        <div class="relative flex-1 min-w-0">
                            <input id="tiktok-username-input" type="text" placeholder="@ton_pseudo_tiktok" onkeydown="if(event.key==='Enter') connectTikTokAccount()" class="w-full min-w-0 bg-slate-900 border border-white/15 rounded-xl px-2.5 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-pink-400">
                        </div>
                        <button id="btn-tiktok-connect" type="button" onclick="connectTikTokAccount()" class="bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl transition active:scale-95 whitespace-nowrap shadow">
                            Connecter
                        </button>
                    </div>

                    <!-- Passerelle / WebSocket (Griffon Arcade, TikTok Live Studio ou Bridge local) -->
                    <div class="flex items-center justify-between gap-1.5 pt-0.5 border-t border-white/10">
                        <div class="flex items-center gap-1 min-w-0 flex-1">
                            <span class="text-[10px] text-slate-400 shrink-0">🔌 Pont :</span>
                            <input id="ws-url" type="text" value="ws://localhost:21213/" title="URL WebSocket (Griffon Arcade / TikTok Bridge)" class="w-full min-w-0 bg-slate-900/90 border border-white/10 rounded-lg px-2 py-0.5 text-[10px] text-slate-300 focus:outline-none focus:border-sky-400">
                        </div>
                        <span id="ws-status" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 shrink-0">Déconnecté</span>
                        <button id="btn-ws-connect" type="button" onclick="toggleWebSocket()" class="bg-blue-600/90 hover:bg-blue-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-lg transition active:scale-95 whitespace-nowrap shrink-0">
                            Pont WS
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

<script>
/**
 * ============================================================================
 * LIVE FOOT INTERACTIF - MOTEUR 2.5D & PHYSIQUE DE STADE
 * - 24 Équipes complètes (Clubs, Sélections nationales, Équipes spéciales)
 * - 16 joueurs réalistes (15 joueurs de champ + 1 gardien de but)
 * - Une seule cage de but tout à droite du terrain
 * - Progression par cadeaux et tir au but cinématique
 * ============================================================================
 */

const STORAGE_TEAM_KEY = 'live_foot_selected_team_id_v1';
const STORAGE_TIKTOK_KEY = 'live_foot_tiktok_account_v1';
const STORAGE_CUSTOM_COLORS_KEY = 'live_foot_custom_team_colors_v1';

let canvas = document.getElementById('stadiumCanvas');
let ctx = canvas ? canvas.getContext('2d') : null;

function ensureCanvasContext() {
    if (!canvas) {
        canvas = document.getElementById('stadiumCanvas');
    }
    if (canvas && !ctx) {
        ctx = canvas.getContext('2d');
    }
    return Boolean(canvas && ctx);
}

// Catalogue complet de 24 équipes (15 noms de champ + 1 gardien par équipe)
const TEAMS_CATALOG = [
    {
        id: 'psg',
        name: 'Paris SG',
        shortName: 'PSG',
        category: 'CLUB',
        badge: '🔴🔵',
        colors: {
            primary: '#0f172a',
            primaryDark: '#020617',
            secondary: '#dc2626',
            shorts: '#0f172a',
            number: '#ffffff',
            gkJersey: '#a3e635',
            gkJerseyDark: '#65a30d',
            gkShorts: '#1e293b',
            gkGloves: '#ffffff'
        },
        roster: [
            { num: 5, role: 'DEF', name: 'Marquinhos' },
            { num: 21, role: 'DEF', name: 'L. Hernandez' },
            { num: 2, role: 'DEF', name: 'A. Hakimi' },
            { num: 17, role: 'MID', name: 'Vitinha' },
            { num: 8, role: 'MID', name: 'F. Ruiz' },
            { num: 33, role: 'MID', name: 'Zaïre-Emery' },
            { num: 25, role: 'MID', name: 'N. Mendes' },
            { num: 10, role: 'CAM', name: 'O. Dembélé' },
            { num: 19, role: 'CAM', name: 'Kang-In Lee' },
            { num: 87, role: 'CAM', name: 'J. Neves' },
            { num: 29, role: 'CAM', name: 'B. Barcola' },
            { num: 7, role: 'FWD', name: 'Kvaratskhelia' },
            { num: 9, role: 'FWD', name: 'G. Ramos' },
            { num: 14, role: 'FWD', name: 'D. Doué' },
            { num: 23, role: 'FWD', name: 'R. Kolo Muani' },
            { num: 1, role: 'GK', name: 'G. Donnarumma' }
        ]
    },
    {
        id: 'real_madrid',
        name: 'Real Madrid',
        shortName: 'RMA',
        category: 'CLUB',

        }
    } catch (e) {}
    return TEAMS_CATALOG[0].id;
}

function getSavedCustomColorsMap() {

function isValidHexColor(hex) {
    return typeof hex === 'string' && /^#[0-9a-fA-F]{6}$/.test(hex.trim());
}

function renderQuickColorSwatches() {
    const container = document.getElementById('quick-color-swatches');
    if (!container) return;

    const targetSelect = document.getElementById('select-color-target');
    const activeTarget = targetSelect ? targetSelect.value : 'primary';
    const team = getCurrentTeam();
    const effectiveColors = getEffectiveTeamColors(team);
    const currentTargetHex = (effectiveColors[activeTarget] || '').toLowerCase();

    container.innerHTML = '';
    QUICK_PALETTE_COLORS.forEach(item => {
        const isSelected = item.hex.toLowerCase() === currentTargetHex;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.title = `Appliquer ${item.label} (${item.hex})`;
        btn.setAttribute('aria-label', `Appliquer ${item.label}`);
        btn.style.backgroundColor = item.hex;
        btn.className = `w-5 h-5 rounded-full transition transform active:scale-90 hover:scale-110 shrink-0 ${
            isSelected
                ? 'ring-2 ring-emerald-400 ring-offset-1 ring-offset-slate-900 scale-105'
                : 'border border-white/40'
        }`;
        btn.onclick = () => applyQuickColor(item.hex);
        container.appendChild(btn);
    });
}

function applyQuickColor(hexValue) {
    if (!isValidHexColor(hexValue)) return;
    const targetSelect = document.getElementById('select-color-target');
    const targetKey = targetSelect ? targetSelect.value : 'primary';
    updateCustomTeamColor(targetKey, hexValue);
}

function syncPaletteWithTarget() {
    renderQuickColorSwatches();
    const targetSelect = document.getElementById('select-color-target');
    const targetKey = targetSelect ? targetSelect.value : 'primary';
    const team = getCurrentTeam();
    const colors = getEffectiveTeamColors(team);
    const pickerMap = {
        primary: document.getElementById('color-picker-primary'),
        shorts: document.getElementById('color-picker-shorts'),
        secondary: document.getElementById('color-picker-secondary'),
        number: document.getElementById('color-picker-number'),
        gkJersey: document.getElementById('color-picker-gk')
    };
    const activePicker = pickerMap[targetKey];
    if (activePicker && colors[targetKey]) {
        activePicker.value = colors[targetKey];
    }
}

function adjustHexShade(hex, delta) {
    const clean = (hex || '#1d4ed8').replace('#', '');
    const full = clean.length === 3
        ? clean.split('').map(ch => ch + ch).join('')
        : clean.padEnd(6, '0').slice(0, 6);
    const num = parseInt(full, 16);
    if (Number.isNaN(num)) return '#0f172a';
    const r = Math.min(255, Math.max(0, ((num >> 16) & 255) + delta));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 255) + delta));
    const b = Math.min(255, Math.max(0, (num & 255) + delta));
    return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
}

function getEffectiveTeamColors(team) {
    const base = team.colors;
    const custom = (STATE.customTeamColors && STATE.customTeamColors[team.id]) || {};

    const primary = isValidHexColor(custom.primary) ? custom.primary : base.primary;
    const primaryDark = isValidHexColor(custom.primary)
        ? adjustHexShade(custom.primary, -36)
        : base.primaryDark;
    const secondary = isValidHexColor(custom.secondary) ? custom.secondary : base.secondary;
    const shorts = isValidHexColor(custom.shorts) ? custom.shorts : base.shorts;
    const number = isValidHexColor(custom.number) ? custom.number : base.number;
    const gkJersey = isValidHexColor(custom.gkJersey) ? custom.gkJersey : base.gkJersey;
    const gkJerseyDark = isValidHexColor(custom.gkJersey)
        ? adjustHexShade(custom.gkJersey, -38)
        : base.gkJerseyDark;

    return {
        ...base,
        primary,
        primaryDark,
        secondary,
        shorts,
        number,
        gkJersey,
        gkJerseyDark
    };
}

function normalizeTikTokHandle(rawValue) {
    if (!rawValue || typeof rawValue !== 'string') return '';
    let cleaned = rawValue.trim();
    cleaned = cleaned.replace(/^https?:\/\/(www\.|vm\.|m\.)?tiktok\.com\/@?/i, '');
    cleaned = cleaned.split(/[/?#]/)[0];
    cleaned = cleaned.replace(/^@+/, '').replace(/[^a-zA-Z0-9._]/g, '');
    return cleaned ? `@${cleaned}` : '';
}

function getSavedTikTokAccount() {
    try {
        const raw = localStorage.getItem(STORAGE_TIKTOK_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.handle) {
                return {
                    handle: normalizeTikTokHandle(parsed.handle),
                    connected: Boolean(parsed.connected)
                };
            }
        }
    } catch (e) {}
    return { handle: '', connected: false };
}

function saveTikTokAccount(account) {
    try {
        localStorage.setItem(STORAGE_TIKTOK_KEY, JSON.stringify(account));
    } catch (e) {}
}

    if (!ensureCanvasContext()) return;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    STATE.width = window.innerWidth || canvas.clientWidth || 1280;
    STATE.height = window.innerHeight || canvas.clientHeight || 720;

    canvas.width = Math.max(1, Math.floor(STATE.width * dpr));
    canvas.height = Math.max(1, Math.floor(STATE.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const isMobile = STATE.width < 640;
    const topMargin = isMobile ? STATE.height * 0.20 : STATE.height * 0.17;
    const bottomMargin = STATE.hudVisible
        ? (isMobile ? STATE.height * 0.26 : STATE.height * 0.21)
        : STATE.height * 0.06;
    const sideMargin = isMobile ? STATE.width * 0.04 : STATE.width * 0.055;

    VIEW.top = topMargin;
    VIEW.bottom = Math.max(topMargin + 120, STATE.height - bottomMargin);
    VIEW.left = sideMargin;
    VIEW.right = Math.max(sideMargin + 200, STATE.width - sideMargin);
    VIEW.scaleX = (VIEW.right - VIEW.left) / PITCH_NORM.W;
    VIEW.scaleY = (VIEW.bottom - VIEW.top) / PITCH_NORM.H;
    VIEW.perspectiveSkew = isMobile ? 0.08 : 0.13;
}

function createGrassTexture() {

        off.width = 128;

        octx.fillStyle = 'rgba(255,255,255,0)';

        for (let i = 0; i < 650; i++) {

function playSound(type) {
    if (!STATE.soundEnabled || !audioReady) return;
    try {
        if (type === 'pass') {
            kickSynth.triggerAttackRelease('G2', '16n');
        } else if (type === 'shoot') {
            kickSynth.triggerAttackRelease('C2', '8n');
            if (crowdFilter) crowdFilter.frequency.rampTo(1400, 0.3);
        } else if (type === 'goal') {
            whistleSynth.triggerAttackRelease('B5', '8n');
            setTimeout(() => whistleSynth.triggerAttackRelease('E6', '4n'), 180);
            netSynth.triggerAttackRelease('16n');
            if (crowdNoise && crowdFilter) {
                crowdNoise.volume.rampTo(-8, 0.15);
                crowdFilter.frequency.rampTo(1800, 0.2);
                setTimeout(() => {
                    crowdNoise.volume.rampTo(-24, 1.8);
                    crowdFilter.frequency.rampTo(650, 1.8);
                }, 2200);
            }
        } else if (type === 'post') {
            kickSynth.triggerAttackRelease('C5', '32n');
            if (netSynth) netSynth.triggerAttackRelease('16n');
        } else if (type === 'wow') {
            if (crowdNoise && crowdFilter) {
                crowdNoise.volume.rampTo(-11, 0.12);
                crowdFilter.frequency.rampTo(1500, 0.15);
                setTimeout(() => {
                    crowdNoise.volume.rampTo(-24, 1.6);
                    crowdFilter.frequency.rampTo(650, 1.6);
                }, 1500);
            }
        } else if (type === 'save') {
            kickSynth.triggerAttackRelease('E2', '16n');
            if (netSynth) netSynth.triggerAttackRelease('32n');
            if (crowdFilter) {
                crowdFilter.frequency.rampTo(950, 0.15);
                setTimeout(() => crowdFilter.frequency.rampTo(650, 0.8), 600);
            }
        }
    } catch (e) {}
}

function projectPoint(nx, ny, nz = 0) {
    const u = nx / PITCH_NORM.W;
    const v = ny / PITCH_NORM.H;

    const topInset = (VIEW.right - VIEW.left) * VIEW.perspectiveSkew * (1 - v);
    const rowLeft = VIEW.left + topInset * 0.45;
    const rowRight = VIEW.right - topInset * 0.35;

    const sx = rowLeft + u * (rowRight - rowLeft);
    const sy = VIEW.top + v * (VIEW.bottom - VIEW.top);

    const depthScale = 0.78 + 0.28 * v;
    const baseScale = Math.min(
        (VIEW.right - VIEW.left) / PITCH_NORM.W,
        (VIEW.bottom - VIEW.top) / PITCH_NORM.H
    );
    const scale = Math.max(0.45, baseScale * depthScale * 1.15);

    return {
        x: sx,
        y: sy - nz * scale,
        groundY: sy,
        scale: scale
    };
}

function createGoalContributor(data, username) {
    const cleanUsername = String(username || '').trim().replace(/^@+/, '');
    if (!/^[a-zA-Z0-9._]{1,32}$/.test(cleanUsername)) return null;

    const avatarCandidates = [
        data?.avatarDataUri,
        data?.avatarUrl,
        data?.profilePictureUrl,
        data?.profilePictureUrls,
        data?.avatarUrls,
        data?.user?.profilePictureUrl,
        data?.user?.profilePictureUrls
    ];
    let avatarUrl = '';
    for (const candidate of avatarCandidates) {
        for (const url of Array.isArray(candidate) ? candidate : [candidate]) {
            if (typeof url === 'string' &&
                (/^https:\/\//i.test(url) || /^data:image\/(?:png|jpe?g|webp|gif);base64,/i.test(url))) {
                avatarUrl = url;
                break;
            }
        }
        if (avatarUrl) break;
    }
    return { username: cleanUsername, avatarUrl };
}

function handleLiveGiftEvent(payload) {
    const data = payload?.gift || payload?.data || payload;
    if (!data || typeof data !== 'object') return;
    const totalCoins = Number(data.coinCount);
    const coins = Number.isSafeInteger(totalCoins) && totalCoins > 0
        ? totalCoins
        : Number(data.diamondCount || data.coins || data.amount || data.coinValue || 1) *
            Number(data.repeatCount || data.count || 1);
    if (!Number.isSafeInteger(coins) || coins < 1) return;

    const username = data.uniqueId ? `@${data.uniqueId}` : (data.username || data.nickname || '@Viewer');
    const giftName = data.giftName || data.name || data.gift?.name || 'Cadeau Live';
    const isBigGift = coins >= 100 || Boolean(data.isBigGift || data.isBig);
    const passes = isBigGift
        ? STATE.passesRequired
        : Math.max(1, Math.min(5, Math.ceil(coins / 5)));
    const contributor = payload?.isSimulation === true || data.isSimulation === true
        ? null
        : createGoalContributor(data, data.uniqueId || data.username || '');
    triggerGift(`🎁 ${giftName}`, coins, passes, isBigGift, username, contributor);
}

function selectNextReceiver(currentHolder) {
    const progressRatio = Math.min(1, STATE.passesCount / STATE.passesRequired);
    const desiredX = 120 + progressRatio * 610;
    const candidates = players.filter(p => p.id !== currentHolder.id && p.role !== 'GK');
    let bestCandidates = candidates.filter(p => p.x >= currentHolder.x - 20 && Math.abs(p.x - desiredX) < 220);
    if (bestCandidates.length === 0) {
        bestCandidates = candidates.filter(p => p.role === 'FWD' || p.role === 'CAM');
    }
    bestCandidates.sort((a, b) => Math.abs(a.x - desiredX) - Math.abs(b.x - desiredX));
    const pool = bestCandidates.slice(0, 3);
    return pool[Math.floor(Math.random() * pool.length)] || players[12];
}

    playSound('pass');
}

            vy: -(50 + Math.random() * 190),
            life, max: life,
            size: (2 + Math.random() * 4) * Math.max(0.7, q.scale),
            color: cols[i % cols.length]
        });
    }
}

function updateFx(dt) {
    for (let i = STATE.fx.length - 1; i >= 0; i--) {
        const f = STATE.fx[i];
        f.life -= dt;
        if (f.life <= 0) { STATE.fx.splice(i, 1); continue; }
        if (f.kind === 'spark' || f.kind === 'dust') {
            f.x += f.vx * dt;
            f.y += f.vy * dt;
            f.vy += (f.kind === 'dust' ? 520 : 620) * dt;
            if (f.kind === 'dust') f.vx *= Math.pow(0.3, dt);
        } else if (f.kind === 'ring') {
            f.r += f.vr * dt;
        }
    }
}

function drawFx() {
    if (!ensureCanvasContext() || STATE.fx.length === 0) return;
    ctx.save();
    STATE.fx.forEach(f => {
        const a = Math.max(0, f.life / f.max);
        if (f.kind === 'flash') {
            ctx.globalCompositeOperation = 'lighter';
            const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size);
            g.addColorStop(0, `rgba(255,255,255,${0.95 * a})`);
            g.addColorStop(0.4, `rgba(255,236,160,${0.5 * a})`);
            g.addColorStop(1, 'rgba(255,220,120,0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
            ctx.fill();
        } else if (f.kind === 'ring') {
            ctx.globalCompositeOperation = 'lighter';
            ctx.strokeStyle = `rgba(255,255,255,${0.8 * a})`;
            ctx.lineWidth = 0.6 + 3 * a;
            ctx.beginPath();
            ctx.ellipse(f.x, f.y, f.r, f.r * 0.8, 0, 0, Math.PI * 2);
            ctx.stroke();
        } else if (f.kind === 'spark') {
            ctx.globalCompositeOperation = 'lighter';
            ctx.strokeStyle = `rgba(${f.color},${a})`;
            ctx.lineWidth = 1.8;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(f.x, f.y);
            ctx.lineTo(f.x - f.vx * 0.035, f.y - f.vy * 0.035);
            ctx.stroke();
        } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = `rgba(${f.color},${0.75 * a})`;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.size * (0.6 + 0.6 * (1 - a)), 0, Math.PI * 2);
            ctx.fill();
        }
    });
    ctx.restore();
}

// Après un arrêt : le gardien relance (balle en main) ou un défenseur dégage le ballon repoussé
function distributeAfterSave() {
    const gk = players[15];
    const caught = ball.holderId === gk.id;
    STATE.passesCount = 0;
    ball.isShot = false;
    ball.isPowerShot = false;
    ball.shotResult = null;
    ball.goalContributor = null;
    ball.goalRewardAwarded = false;
    ball.saveType = null;
    ball.spec = null;
    ball.barArmed = false;
    ball.doubleSave = false;
    STATE.spectacular = false;
    ball.trail = [];
    players.forEach(p => {
        p.targetX = p.baseX;
        p.targetY = p.baseY;
        p.diveAnim = 0;
        p.z = 0;
        p.zv = 0;
        p.sd = null;
        p.scripted = false;
    });
    const receiver = players[[0, 1, 2, 3, 6][Math.floor(Math.random() * 5)]];
    gk.kickAnim = 1.0;
    startPass(gk, receiver, false);
    ball.flightDuration = caught ? 0.85 : 0.75;
    ball.arcHeight = caught ? 70 : 55;
    updateHUD();
}

function startRebound() {
    ball.catchFrom = null;
    startShot(players[12], false, { second: true });
}

function handleShotArrival() {
    const gk = players[15];
    STATE.slowMo = 1.0;
    STATE.cameraShake = ball.isPowerShot ? 14 : 8;
    if (ball.shotResult === 'GOAL') {
        STATE.goals += 1;
        if (!ball.goalRewardAwarded) {
            ball.goalRewardAwarded = true;
            if (ball.goalContributor) void awardGoalStars(ball.goalContributor);
        }
        STATE.phase = 'GOAL_CELEBRATION';
        STATE.phaseTimer = 2.4;
        STATE.netDeform = 1.0;
        STATE.netImpactY = ball.y;
        gk.scripted = false;
        gk.zv = 0;
        spawnConfetti();
        playSound('goal');
        showCenterBanner(
            '⚽ BUUUUUUT !',
            getCurrentTeam().name,
            'border-emerald-400 text-emerald-300'
        );
    } else {
        const type = ball.saveType || 'PARRY';
        const spec = ball.spec;
        const big = Boolean(spec) && spec !== 'DOUBLE';
        STATE.phase = 'SAVE_RECOVERY';
        STATE.saveT = 0;
        STATE.phaseTimer = type === 'CATCH' ? 2.4 : 2.1;
        // Arrêt sur image : ralenti marqué à l'instant du contact gant / ballon
        STATE.slowMo = big ? 0.1 : 0.18;
        STATE.slowTimer = big ? 0.5 : 0.2;
        STATE.cameraShake = big ? 15 : (type === 'CATCH' ? 6 : (ball.isPowerShot ? 13 : 9));
        gk.scripted = false;
        gk.zv = 0;
        ball.catchFrom = { x: ball.x, y: ball.y, z: ball.z };
        spawnImpactFx(ball.x, ball.y, ball.z, type !== 'CATCH' || big);
        if (gk.diveAnim > 0.5 && (gk.z || 0) < 4) spawnDust(gk.x, gk.y, 9);

        const dir = Math.abs(ball.y - 300) > 10 ? Math.sign(ball.y - 300) : (Math.random() < 0.5 ? -1 : 1);
        const power = ball.isPowerShot ? 1.35 : 1;
        let sub;
        if (type === 'CATCH') {
            ball.holderId = gk.id;
            ball.vx = 0; ball.vy = 0; ball.vz = 0;
            sub = 'Le gardien bloque le ballon, main ferme !';
        } else if (type === 'TIP') {
            if (spec === 'SUPERMAN' && ball.barArmed) {
                // Le bout des doigts propulse le ballon pile sur la barre transversale
                ball.vx = 70 + Math.random() * 20;
                const tc = Math.max(0.05, (PITCH_NORM.goalX - ball.x) / ball.vx);
                ball.vy = dir * (10 + Math.random() * 20);
                ball.vz = (45 - ball.z + 165 * tc * tc) / tc;
            } else {
                ball.barArmed = false;
                ball.vx = -(30 + Math.random() * 50);
                ball.vy = dir * (40 + Math.random() * 70);
                ball.vz = 190 + Math.random() * 60;
            }
            sub = 'Détourné du bout des doigts !';
        } else if (spec === 'DOUBLE') {
            // Premier arrêt : le ballon revient dans l'axe pour un second tir à bout portant
            ball.vx = -(40 + Math.random() * 30);
            ball.vy = -dir * (50 + Math.random() * 40);
            ball.vz = 55 + Math.random() * 30;
            ball.doubleSave = true;
            ball.doubleFired = false;
            sub = 'Attention, le ballon revient dans la surface...';
        } else {
            ball.vx = -(60 + Math.random() * 170) * power;
            ball.vy = dir * (90 + Math.random() * 150);
            ball.vz = 70 + Math.random() * 90;
            sub = 'Repoussé des deux poings, quel réflexe !';
        }

        let title = '🧤 ARRÊT DU GARDIEN !';
        let cls = 'border-sky-400 text-sky-300';
        if (spec === 'SUPERMAN') {
            title = '🦸 ARRÊT ÉPOUSTOUFLANT !';
            sub = ball.barArmed ? 'Du bout des doigts sur la barre transversale !' : 'Détente horizontale, il va chercher la lucarne !';
            cls = 'border-amber-400 text-amber-300';
        } else if (spec === 'REFLEX') {
            title = '⚡ ARRÊT RÉFLEXE !';
            sub = 'À bout portant, réflexe pur !';
            cls = 'border-amber-400 text-amber-300';
        } else if (spec === 'DOUBLE') {
            title = '🧤 PREMIER ARRÊT !';
            cls = 'border-sky-300 text-sky-200';
        } else if (spec === 'DOUBLE2') {
            title = '🤯 DOUBLE ARRÊT INCROYABLE !';
            sub = 'Il se relève et repousse encore la frappe !';
            cls = 'border-amber-300 text-amber-200';
        }
        playSound('save');
        if (big) playSound('wow');
        showCenterBanner(title, sub, cls);
    }
    updateHUD();
}

function startShot(shooter, isPowerShot, opts) {
    opts = opts || {};
    STATE.phase = 'SHOOTING';
    ball.holderId = -1;
    ball.receiverId = -1;
    ball.startX = ball.x;
    ball.startY = ball.y;
    ball.startZ = ball.z;
    ball.isShot = true;
    ball.isPowerShot = isPowerShot;
    ball.catchFrom = null;
    ball.saveType = null;

    const gk = players[15];
    const effectiveGkSkill = isPowerShot ? STATE.gkSkill * 0.45 : STATE.gkSkill;
    const isGoal = opts.second ? false : Math.random() > effectiveGkSkill;

    // Arrêt spectaculaire ? (tirés au sort uniquement quand le gardien arrête le tir)
    let spec = null;
    if (opts.second) spec = 'DOUBLE2';
    else if (!isGoal) {
        const r = Math.random();
        if (r < 0.30) spec = 'SUPERMAN';
        else if (r < 0.52 && !isPowerShot) spec = 'DOUBLE';
        else if (r < 0.78) spec = 'REFLEX';
    }

    // Cible dans le but (position + hauteur)
    let tz, targetY;
    if (spec === 'SUPERMAN') {
        targetY = Math.random() > 0.5
            ? PITCH_NORM.goalYTop + 9 + Math.random() * 12
            : PITCH_NORM.goalYBottom - 9 - Math.random() * 12;
        tz = 31 + Math.random() * 8;
    } else if (spec === 'DOUBLE2') {
        const side = gk.y >= 300 ? -1 : 1;
        targetY = 300 + side * (30 + Math.random() * 25);
        tz = 8 + Math.random() * 16;
    } else if (spec === 'DOUBLE' || spec === 'REFLEX') {
        targetY = 300 + (Math.random() - 0.5) * 90;
        tz = spec === 'REFLEX' ? 6 + Math.random() * 16 : 10 + Math.random() * 16;
    } else {
        const hRoll = Math.random();
        tz = hRoll < 0.34 ? 6 + Math.random() * 7 : (hRoll < 0.68 ? 16 + Math.random() * 10 : 29 + Math.random() * 10);
        if (!isGoal && Math.random() < 0.38) {
            targetY = 300 + (Math.random() - 0.5) * 80;
            tz = 9 + Math.random() * 17;
        } else {
            const aimTop = Math.random() > 0.5;
            targetY = aimTop
                ? PITCH_NORM.goalYTop + 14 + Math.random() * 28
                : PITCH_NORM.goalYBottom - 14 - Math.random() * 28;
        }
    }

    // Type d'arrêt : bloqué, repoussé, ou détourné (balles hautes)
    let saveType = null;
    if (!isGoal) {
        if (spec === 'SUPERMAN') saveType = 'TIP';
        else if (spec === 'DOUBLE') saveType = 'PARRY';
        else if (spec === 'DOUBLE2') saveType = Math.random() < 0.6 ? 'CATCH' : 'PARRY';
        else if (spec === 'REFLEX') saveType = Math.random() < 0.5 ? 'CATCH' : 'PARRY';
        else {
            const central = Math.abs(targetY - 300) < 45 && tz < 28;
            if (isPowerShot) saveType = Math.random() < 0.85 ? 'PARRY' : 'CATCH';
            else if (tz > 30 && Math.random() < 0.6) saveType = 'TIP';
            else if (central) saveType = Math.random() < 0.7 ? 'CATCH' : 'PARRY';
            else saveType = Math.random() < 0.65 ? 'PARRY' : 'CATCH';
        }
    }

    ball.spec = spec;
    ball.barArmed = spec === 'SUPERMAN' && Math.random() < 0.5;
    ball.doubleSave = false;
    ball.doubleFired = false;
    STATE.spectacular = Boolean(spec);

    ball.shotResult = isGoal ? 'GOAL' : 'SAVE';
    ball.saveType = saveType;
    ball.targetX = isGoal ? PITCH_NORM.goalX + 18 : PITCH_NORM.goalX - 18;
    ball.targetY = targetY;
    ball.targetZ = tz;
    ball.flightProgress = 0;
    ball.arcHeight = 26 + Math.random() * 14;

    let flight = isPowerShot ? 0.48 : 0.58;
    let slow = isPowerShot ? 0.55 : 0.72;
    if (spec === 'SUPERMAN') { slow = 0.42; }
    else if (spec === 'REFLEX') { flight = isPowerShot ? 0.30 : 0.34; slow = 0.5; }
    else if (spec === 'DOUBLE') { slow = 0.6; }
    else if (spec === 'DOUBLE2') { flight = 0.32; slow = 0.45; }
    ball.flightDuration = flight;
    STATE.slowMo = slow;

    // Plan de plongeon du gardien : il rejoint le point d'interception (ou le rate de peu)
    const y0 = gk.y;
    let ty;
    if (!isGoal) ty = targetY;
    else if (Math.random() < 0.15) ty = y0 - (targetY - y0) * 0.7;   // pris à contre-pied
    else ty = y0 + (targetY - y0) * 0.65;                              // bout des doigts trop court
    ty = Math.max(PITCH_NORM.goalYTop + 8, Math.min(PITCH_NORM.goalYBottom - 8, ty));
    const dist = Math.abs(ty - y0);
    let strength = Math.max(0.3, Math.min(1, dist / 55 + (tz > 26 ? 0.2 : 0)));
    if (spec === 'SUPERMAN') strength = 1;
    else if (spec === 'REFLEX' || spec === 'DOUBLE2') strength = Math.max(0.6, strength);
    const thFinal = 1.35 * strength;
    const hz = isGoal ? tz * 0.85 : tz;
    let jump = Math.max(0, Math.min(22, (hz / 17 - 1.05 * Math.cos(thFinal) - 1.15) * 17));
    if (spec === 'SUPERMAN') jump = Math.min(26, jump + 6);
    let reaction = 0.18 + Math.random() * 0.1;
    if (spec === 'SUPERMAN') reaction = 0.1 + Math.random() * 0.05;
    else if (spec === 'REFLEX') reaction = 0.07;
    else if (spec === 'DOUBLE2') reaction = 0.06;

    const a0 = opts.second ? (gk.diveAnim || 0) : 0;
    const oldDir = gk.diveDir || 1;
    const newDir = dist < 4 ? (Math.random() < 0.5 ? 1 : -1) : (ty > y0 ? 1 : -1);
    gk.sd = {
        x0: gk.x + oldDir * 16 * Math.sin(1.35 * a0),
        y0,
        tx: isGoal ? PITCH_NORM.goalX - 16 : ball.targetX,
        ty,
        tz: hz,
        strength,
        jump,
        reaction,
        a0,
        dir: newDir
    };
    if (a0 < 0.05) gk.diveDir = newDir;
    gk.diveAnim = a0;
    gk.z = 0;
    gk.zv = 0;
    gk.scripted = true;

    if (isPowerShot && !opts.second) {
        showCenterBanner('🦁 SUPER FRAPPE !', `Déclenchée par ${STATE.lastGiftUser}`, 'border-amber-400 text-amber-300');
    }
    playSound('shoot');
    updateHUD();
}

function executeNextAction(action) {
    ball.goalContributor = action.contributor ? { ...action.contributor } : null;
    ball.goalRewardAwarded = false;
    const holder = players[ball.holderId] || players[1];
    holder.kickAnim = 1.0;

    if (action.type === 'BIG_SHOT') {
        STATE.passesCount = STATE.passesRequired;
        updateHUD();
        if (holder.role !== 'FWD' && holder.role !== 'CAM') {
            startPass(holder, players[12], true);
        } else {
            startShot(holder, true);
        }
        return;
    }

    STATE.passesCount += 1;
    updateHUD();

    if (STATE.passesCount >= STATE.passesRequired) {
        if (holder.x < 560) {
            const striker = players[12 + (Math.random() > 0.5 ? 1 : 0)];
            startPass(holder, striker, true);
        } else {
            startShot(holder, false);
        }
    } else {
        startPass(holder, selectNextReceiver(holder), false);
    }
}

function updateSimulation(rawDt) {
    if (STATE.slowTimer > 0) {
        STATE.slowTimer -= rawDt;
        if (STATE.slowTimer <= 0) STATE.slowMo = 1.0;
    }
    const dt = Math.min(rawDt, 0.05) * STATE.slowMo;

    if (STATE.autoLive) {
        STATE.autoLiveTimer -= rawDt;
        if (STATE.autoLiveTimer <= 0) {
            STATE.autoLiveTimer = 0.75 + Math.random() * 0.9;
            if (Math.random() < 0.14) {
                triggerGift('🦁 Lion Auto', 500, 99, true);
            } else {
                triggerGift('🌹 Rose Auto', 1, 1, false);
            }
        }
    }

    if (STATE.cameraShake > 0) STATE.cameraShake = Math.max(0, STATE.cameraShake - rawDt * 28);
    if (STATE.netDeform > 0) STATE.netDeform = Math.max(0, STATE.netDeform - rawDt * 1.6);

    STATE.crowdFlashes.forEach(f => {
        f.timer -= rawDt;
        if (f.timer <= 0) {
            f.timer = 1.5 + Math.random() * 4.5;
            f.rx = Math.random();
            f.ry = Math.random();
        }
    });

    for (let i = STATE.confetti.length - 1; i >= 0; i--) {
        const c = STATE.confetti[i];
        c.x += c.vx * rawDt;
        c.y += c.vy * rawDt;
        c.vy += 480 * rawDt;
        c.rot += c.vrot * rawDt;
        c.life -= rawDt;
        if (c.life <= 0) STATE.confetti.splice(i, 1);
    }

    updateFx(rawDt);
    const zoomFocus = STATE.spectacular && (STATE.phase === 'SHOOTING' || (STATE.phase === 'SAVE_RECOVERY' && STATE.saveT < 1.2));
    STATE.zoom += ((zoomFocus ? 1.26 : 1) - STATE.zoom) * Math.min(1, 5 * rawDt);

    if (STATE.phase === 'BUILDUP' && giftQueue.length > 0) {
        executeNextAction(giftQueue.shift());
    } else if (STATE.phase === 'GOAL_CELEBRATION') {
        STATE.phaseTimer -= rawDt;
        if (STATE.phaseTimer <= 0) resetAttackToDefense();
    } else if (STATE.phase === 'SAVE_RECOVERY') {
        STATE.phaseTimer -= rawDt;
        if (STATE.phaseTimer <= 0) distributeAfterSave();
    }

    const attackAdvance = Math.min(1, STATE.passesCount / STATE.passesRequired) * 145;
    const t = performance.now() * 0.002;

    players.forEach((p, idx) => {
        if (p.kickAnim > 0) p.kickAnim = Math.max(0, p.kickAnim - rawDt * 4.5);

        if (p.role === 'GK') {
            const sd = p.sd;
            if (STATE.phase === 'SHOOTING' && sd) {
                // Plongeon scripté : réaction, poussée d'appel, puis trajectoire vers le ballon
                const u = Math.min(1, ball.flightProgress);
                const w = Math.max(0, Math.min(1, (u - sd.reaction) / (1 - sd.reaction)));
                const e = 1 - Math.pow(1 - w, 1.8);
                p.scripted = true;
                if (u >= sd.reaction || sd.a0 < 0.05) p.diveDir = sd.dir;
                // second plongeon : il se relève d'abord, puis repart de l'autre côté
                p.diveAnim = u < sd.reaction ? sd.a0 * (1 - u / sd.reaction) : e * sd.strength;
                const sinTh = Math.sin(1.35 * p.diveAnim);
                // les gants sont décalés du corps : on compense pour qu'ils tombent sur le ballon
                p.targetX = sd.x0 + (sd.tx - sd.x0) * e - (p.diveDir || 1) * 16 * sinTh;
                p.targetY = sd.y0 + (sd.ty - sd.y0) * e;
                p.z = sd.jump * e;
            } else if (STATE.phase === 'GOAL_CELEBRATION' || STATE.phase === 'SAVE_RECOVERY') {
                p.targetX = p.x;
                p.targetY = p.y;
                if (STATE.phase === 'SAVE_RECOVERY') {
                    if (STATE.saveT > 0.55) p.diveAnim = Math.max(0, p.diveAnim - dt * 1.3);
                } else if (STATE.phaseTimer < 1.4) {
                    p.diveAnim = Math.max(0, p.diveAnim - dt * 0.9);
                }
            } else {
                p.scripted = false;
                const near = Math.max(0, Math.min(1, (ball.x - 520) / 360));
                const trackY = 300 + (ball.y - 300) * (0.25 + 0.35 * near) + Math.sin(t * 2.2) * (8 - 5 * near);
                p.targetY = Math.max(PITCH_NORM.goalYTop + 18, Math.min(PITCH_NORM.goalYBottom - 18, trackY));
                p.targetX = PITCH_NORM.goalX - 16 - near * 12;
                p.diveAnim = Math.max(0, p.diveAnim - rawDt * 2.5);
            }
        } else {
            if (STATE.phase === 'GOAL_CELEBRATION') {
                p.targetX = Math.min(890, p.baseX + 210);
                p.targetY = 300 + (p.baseY - 300) * 0.55;
            } else {
                const roleBoost = p.role === 'FWD' ? 1.15 : (p.role === 'CAM' ? 1.0 : 0.75);
                const swayX = Math.sin(t + idx * 1.3) * 14;
                const swayY = Math.cos(t * 0.9 + idx * 1.7) * 16;
                p.targetX = Math.min(785, p.baseX + attackAdvance * roleBoost + swayX);
                p.targetY = Math.max(55, Math.min(545, p.baseY + swayY));
            }
        }

        const dx = p.targetX - p.x;
        const dy = p.targetY - p.y;
        const dist = Math.hypot(dx, dy);
        const lerpRate = p.role === 'GK' && STATE.phase === 'SHOOTING' ? 11 : 4.2;
        const stepFactor = p.scripted ? 1 : Math.min(1, lerpRate * dt);

        const moveX = dx * stepFactor;
        const moveY = dy * stepFactor;

        if (dt > 0.0001) {
            const instVx = moveX / dt;
            const instVy = moveY / dt;
            p.vx += (instVx - p.vx) * Math.min(1, 14 * dt);
            p.vy += (instVy - p.vy) * Math.min(1, 14 * dt);
        } else {
            p.vx *= 0.85;
            p.vy *= 0.85;
        }

        p.speedMag = Math.hypot(p.vx, p.vy);
        if (Math.abs(p.vx) > 6) {
            p.facing = p.vx >= 0 ? 1 : -1;
        } else if (p.role === 'GK') {
            p.facing = -1;
        } else {
            p.facing = 1;
        }
        if (p.role === 'GK') p.facing = -1;

        const targetLean = Math.max(-0.22, Math.min(0.24, p.vx * 0.00085));
        p.leanX += (targetLean - p.leanX) * Math.min(1, 12 * dt);

        if (dist > 0.5) {
            p.x += moveX;
            p.y += moveY;
            const strideSpeed = Math.min(18, Math.max(5.5, p.speedMag * 0.065));
            p.runCycle += strideSpeed * dt;
        } else {
            p.runCycle += 2.4 * dt;
        }

        const activeMoveRatio = Math.min(1, p.speedMag / 130);
        p.bobY = Math.abs(Math.sin(p.runCycle)) * (1.4 + 2.1 * activeMoveRatio);

        // Gravité du gardien après le saut (retombée + poussière à l'atterrissage)
        if (p.role === 'GK' && STATE.phase !== 'SHOOTING' && ((p.z || 0) > 0 || (p.zv || 0) !== 0)) {
            p.zv = (p.zv || 0) - 300 * dt;
            p.z = (p.z || 0) + p.zv * dt;
            if (p.z <= 0) {
                if (p.zv < -45 && p.diveAnim > 0.3) {
                    spawnDust(p.x, p.y, 12);
                    STATE.cameraShake = Math.max(STATE.cameraShake, 5);
                }
                p.z = 0;
                p.zv = 0;
            }
        }
    });

    if (STATE.phase === 'PASSING' || STATE.phase === 'SHOOTING') {
        ball.flightProgress += dt / ball.flightDuration;
        const u = Math.min(1, ball.flightProgress);
        ball.x = ball.startX + (ball.targetX - ball.startX) * u;
        ball.y = ball.startY + (ball.targetY - ball.startY) * u;
        if (ball.isShot) {
            // Tir tendu : la hauteur monte vers le point visé dans le but
            const arcTerm = ball.arcHeight * 0.2 * (1 - ball.targetZ / 50);
            ball.z = ball.startZ * (1 - u) + ball.targetZ * u + Math.sin(u * Math.PI) * arcTerm;
        } else {
            ball.z = ball.startZ * (1 - u) + Math.sin(u * Math.PI) * ball.arcHeight;
        }
        ball.spin += dt * 18;

        ball.trail.push({ x: ball.x, y: ball.y, z: ball.z, alpha: 1 });
        if (ball.trail.length > 14) ball.trail.shift();

        if (u >= 1) {
            if (STATE.phase === 'PASSING') ball.z = 0;
            if (STATE.phase === 'PASSING') {
                ball.holderId = ball.receiverId;
                STATE.phase = 'BUILDUP';
                if (ball.shootOnReceive) {
                    startShot(players[ball.holderId], giftQueue.length === 0 && STATE.passesCount >= STATE.passesRequired);
                }
            } else {
                handleShotArrival();
            }
        }
    } else if (STATE.phase === 'SAVE_RECOVERY') {
        STATE.saveT += dt;
        const gk = players[15];
        if (ball.holderId === gk.id && ball.catchFrom) {
            // Ballon bloqué : il glisse dans les gants puis contre la poitrine du gardien
            const b = Math.min(1, STATE.saveT / 0.2);
            const e = 1 - Math.pow(1 - b, 2);
            const lie = Math.min(1, gk.diveAnim);
            const hx = gk.x - 8;
            const hy = gk.y + 2;
            const hz = (gk.z || 0) + 9 + 11 * (1 - lie);
            ball.x = ball.catchFrom.x + (hx - ball.catchFrom.x) * e;
            ball.y = ball.catchFrom.y + (hy - ball.catchFrom.y) * e;
            ball.z = ball.catchFrom.z + (hz - ball.catchFrom.z) * e;
            ball.spin += dt * 2;
        } else {
            // Ballon repoussé : rebonds, frottements, roulé
            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;
            ball.z += ball.vz * dt;
            ball.vz -= 330 * dt;
            if (ball.z <= 0) {
                ball.z = 0;
                if (ball.vz < -30) ball.vz = -ball.vz * 0.5; else ball.vz = 0;
                const f = Math.pow(0.25, dt);
                ball.vx *= f;
                ball.vy *= f;
            } else {
                const f = Math.pow(0.7, dt);
                ball.vx *= f;
                ball.vy *= f;
            }
            if (ball.barArmed && ball.vx > 0 && ball.x >= PITCH_NORM.goalX - 1) {
                // le ballon claque sur la barre transversale et repart vers le terrain
                ball.barArmed = false;
                ball.x = PITCH_NORM.goalX - 2;
                ball.z = Math.max(ball.z, 43);
                ball.vx = -(70 + Math.random() * 60);
                ball.vz = 20 + Math.random() * 40;
                ball.vy *= 0.6;
                spawnImpactFx(ball.x, ball.y, ball.z, true);
                STATE.cameraShake = Math.max(STATE.cameraShake, 13);
                STATE.slowMo = 0.3;
                STATE.slowTimer = 0.18;
                playSound('post');
            }
            ball.x = Math.min(990, ball.x);
            ball.y = Math.max(25, Math.min(575, ball.y));
            ball.spin += (Math.abs(ball.vx) + Math.abs(ball.vy)) * dt * 0.06;
        }
        if (ball.doubleSave && !ball.doubleFired && STATE.saveT > 0.42) {
            ball.doubleFired = true;
            ball.doubleSave = false;
            startRebound();
        }
    } else if (STATE.phase === 'GOAL_CELEBRATION') {
        ball.x = PITCH_NORM.goalX + 16;
        ball.z = Math.max(0, ball.z - 120 * dt);
    } else {
        const holder = players[ball.holderId] || players[1];
        const dribbleOffset = Math.sin(holder.runCycle) * 3.5;
        ball.x = holder.x + 11 + dribbleOffset;
        ball.y = holder.y + 3;
        ball.z = Math.abs(Math.cos(holder.runCycle)) * 2.2;
        ball.spin += Math.abs(dribbleOffset) * 0.2;
        if (ball.trail.length > 0) ball.trail.shift();
    }

    ball.trail.forEach(tr => tr.alpha *= 0.88);
}

function drawStadiumEnvironment() {
    if (!ensureCanvasContext()) return;
    const W = STATE.width;
    const H = STATE.height;

    const skyGrad = ctx.createLinearGradient(0, 0, 0, VIEW.top + 40);
    skyGrad.addColorStop(0, '#040811');
    skyGrad.addColorStop(0.55, '#0b182e');
    skyGrad.addColorStop(1, '#14294a');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    const standTop = Math.max(0, VIEW.top - 95);
    const standGrad = ctx.createLinearGradient(0, standTop, 0, VIEW.top);
    standGrad.addColorStop(0, '#09111f');
    standGrad.addColorStop(1, '#16243d');
    ctx.fillStyle = standGrad;
    ctx.fillRect(0, standTop, W, VIEW.top - standTop);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    for (let row = 0; row < 5; row++) {
        const ry = standTop + 14 + row * 14;
        for (let col = 0; col < W; col += 11) {
            const jitter = Math.sin(col * 0.3 + row * 2) * 2;
            ctx.beginPath();
            ctx.arc(col + (row % 2) * 5, ry + jitter, 3.2, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    STATE.crowdFlashes.forEach(f => {
        if (f.timer < f.duration) {
            const fx = f.rx * W;
            const fy = standTop + 10 + f.ry * Math.max(10, VIEW.top - standTop - 22);
            const flashGrad = ctx.createRadialGradient(fx, fy, 0, fx, fy, 18);
            flashGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            flashGrad.addColorStop(0.4, 'rgba(186, 230, 253, 0.45)');
            flashGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = flashGrad;
            ctx.beginPath();
            ctx.arc(fx, fy, 18, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    // Bandeau LED publicitaire : GRYPHON AGENCY FOOT (grand, lumineux, défilant)
    const boardH = Math.max(26, Math.min(40, Math.round(H * 0.045)));
    const boardY = VIEW.top - boardH;
    const bNow = performance.now();

    // Caisson sombre + cadre néon
    const boardBg = ctx.createLinearGradient(0, boardY, 0, boardY + boardH);
    boardBg.addColorStop(0, '#020617');
    boardBg.addColorStop(0.5, '#0a1a33');
    boardBg.addColorStop(1, '#020617');
    ctx.fillStyle = boardBg;
    ctx.fillRect(0, boardY, W, boardH);
    ctx.fillStyle = '#22d3ee';
    ctx.fillRect(0, boardY, W, 2);
    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(0, boardY + boardH - 2, W, 2);

    // Texte défilant sans coupure
    const fontPx = Math.round(boardH * 0.62);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, boardY + 2, W, boardH - 4);
    ctx.clip();
    ctx.font = `800 ${fontPx}px "Chakra Petch", sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    const adMain = 'GRYPHON AGENCY FOOT';
    const adSep = '   ★   ';
    const wMain = ctx.measureText(adMain).width;
    const wSep = ctx.measureText(adSep).width;
    const unitW = wMain + wSep;
    const scrollOffset = (bNow * 0.09) % unitW;
    const midY = boardY + boardH / 2 + 1;
    for (let x = -scrollOffset; x < W; x += unitW) {
        // Texte blanc avec halo cyan (très lisible)
        ctx.shadowColor = '#22d3ee';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(adMain, x, midY);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(2,132,199,0.9)';
        ctx.lineWidth = 1;
        ctx.strokeText(adMain, x, midY);
        // Étoile dorée
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#fbbf24';
        ctx.fillText(adSep, x + wMain, midY);
        ctx.shadowBlur = 0;
    }
    ctx.restore();

    // Trame de pixels LED + reflet de verre
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    for (let lx = 0; lx < W; lx += 3) ctx.fillRect(lx, boardY + 2, 1, boardH - 4);
    const glass = ctx.createLinearGradient(0, boardY, 0, boardY + boardH * 0.5);
    glass.addColorStop(0, 'rgba(255,255,255,0.18)');
    glass.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = glass;
    ctx.fillRect(0, boardY + 2, W, boardH * 0.5);

    // Lueur du panneau sur la pelouse / le public
    const glowG = ctx.createLinearGradient(0, boardY - 14, 0, boardY);
    glowG.addColorStop(0, 'rgba(34,211,238,0)');
    glowG.addColorStop(1, 'rgba(34,211,238,0.22)');
    ctx.fillStyle = glowG;
    ctx.fillRect(0, boardY - 14, W, 14);
}

function drawPitchQuad(x1, y1, x2, y2) {
    const p1 = projectPoint(x1, y1);
    const p2 = projectPoint(x2, y1);
    const p3 = projectPoint(x2, y2);
    const p4 = projectPoint(x1, y2);
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.lineTo(p4.x, p4.y);
    ctx.closePath();
    ctx.stroke();
}

function drawPitchCircle(cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i <= 48; i++) {
        const angle = (i / 48) * Math.PI * 2;
        const pt = projectPoint(cx + Math.cos(angle) * r, cy + Math.sin(angle) * r);
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
    }
    ctx.closePath();
    ctx.stroke();
}

function drawCornerArc(cx, cy, startA, endA) {
    ctx.beginPath();
    for (let i = 0; i <= 12; i++) {
        const a = startA + (i / 12) * (endA - startA);
        const pt = projectPoint(cx + Math.cos(a) * 14, cy + Math.sin(a) * 14);
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
    }
    ctx.stroke();
}

function drawPitch() {
    if (!ensureCanvasContext()) return;
    const tl = projectPoint(0, 0);
    const tr = projectPoint(PITCH_NORM.W, 0);
    const br = projectPoint(PITCH_NORM.W, PITCH_NORM.H);
    const bl = projectPoint(0, PITCH_NORM.H);

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(tl.x - 28, tl.y - 10);
    ctx.lineTo(tr.x + 42, tr.y - 10);
    ctx.lineTo(br.x + 52, br.y + 24);
    ctx.lineTo(bl.x - 35, bl.y + 24);
    ctx.closePath();
    ctx.fillStyle = '#144524';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(tl.x, tl.y);
    ctx.lineTo(tr.x, tr.y);
    ctx.lineTo(br.x, br.y);
    ctx.lineTo(bl.x, bl.y);
    ctx.closePath();
    ctx.clip();

    const numStripes = 14;
    const stripeW = PITCH_NORM.W / numStripes;
    for (let i = 0; i < numStripes; i++) {
        const p1 = projectPoint(i * stripeW, 0);
        const p2 = projectPoint((i + 1) * stripeW, 0);
        const p3 = projectPoint((i + 1) * stripeW, PITCH_NORM.H);
        const p4 = projectPoint(i * stripeW, PITCH_NORM.H);

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.closePath();
        ctx.fillStyle = i % 2 === 0 ? '#1f7a38' : '#268c42';
        ctx.fill();
    }

    if (STATE.grassPattern) {
        ctx.fillStyle = STATE.grassPattern;
        ctx.fillRect(0, 0, STATE.width, STATE.height);
    }
    ctx.restore();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.88)';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    drawPitchQuad(0, 0, PITCH_NORM.goalX, PITCH_NORM.H);
    const midTop = projectPoint(360, 0);
    const midBot = projectPoint(360, PITCH_NORM.H);
    ctx.beginPath();
    ctx.moveTo(midTop.x, midTop.y);
    ctx.lineTo(midBot.x, midBot.y);
    ctx.stroke();

    drawPitchCircle(360, 300, 78);
    drawPitchQuad(PITCH_NORM.boxX, PITCH_NORM.boxYTop, PITCH_NORM.goalX, PITCH_NORM.boxYBottom);
    drawPitchQuad(PITCH_NORM.sixYardX, PITCH_NORM.sixYardYTop, PITCH_NORM.goalX, PITCH_NORM.sixYardYBottom);

    const pSpot = projectPoint(PITCH_NORM.penaltySpotX, PITCH_NORM.penaltySpotY);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(pSpot.x, pSpot.y, 3.5 * pSpot.scale, 2.2 * pSpot.scale, 0, 0, Math.PI * 2);
    ctx.fill();

    drawCornerArc(0, 0, 0, Math.PI / 2);
    drawCornerArc(0, PITCH_NORM.H, -Math.PI / 2, 0);
    drawCornerArc(PITCH_NORM.goalX, 0, Math.PI / 2, Math.PI);
    drawCornerArc(PITCH_NORM.goalX, PITCH_NORM.H, Math.PI, Math.PI * 1.5);
}

// ============================================================================
// CAGE DE BUT RÉALISTE : armature cylindrique, filet à mailles, filets latéraux,
// toit, arceaux arrière, ombre au sol et déformation du filet à l'impact.
// ============================================================================
function goalGeom() {
    const gx = PITCH_NORM.goalX;
    const d = PITCH_NORM.goalDepth;
    return {
        gx,
        yt: PITCH_NORM.goalYTop,
        yb: PITCH_NORM.goalYBottom,
        gh: PITCH_NORM.goalHeight3D,
        hb: PITCH_NORM.goalHeight3D * 0.6,
        bx: gx + d,
        byt: PITCH_NORM.goalYTop + 6,
        byb: PITCH_NORM.goalYBottom - 6
    };
}

// Tube métallique avec volume (contour, corps, reflet, ombre)
function goalTube(a, b, w, main = '#eef2f7') {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len;
    const ny = dx / len;
    ctx.lineCap = 'round';

    ctx.strokeStyle = 'rgba(8, 15, 30, 0.55)';
    ctx.lineWidth = w + 1.6;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();

    ctx.strokeStyle = main;
    ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();

    ctx.strokeStyle = 'rgba(0, 0, 0, 0.22)';
    ctx.lineWidth = Math.max(0.8, w * 0.3);
    ctx.beginPath();
    ctx.moveTo(a.x + nx * w * 0.27, a.y + ny * w * 0.27);
    ctx.lineTo(b.x + nx * w * 0.27, b.y + ny * w * 0.27);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.lineWidth = Math.max(0.8, w * 0.28);
    ctx.beginPath();
    ctx.moveTo(a.x - nx * w * 0.2, a.y - ny * w * 0.2);
    ctx.lineTo(b.x - nx * w * 0.2, b.y - ny * w * 0.2);
    ctx.stroke();
}

// Panneau de filet : quadrilatère 3D maillé, avec gonflement à l'impact
function drawNetPanel(c00, c10, c11, c01, nu, nv, bulgeAmp, alpha, fillAlpha) {
    const bulge = STATE.netDeform * bulgeAmp;
    const pt = (u, v) => {
        const x = (1 - u) * (1 - v) * c00[0] + u * (1 - v) * c10[0] + u * v * c11[0] + (1 - u) * v * c01[0];
        const y = (1 - u) * (1 - v) * c00[1] + u * (1 - v) * c10[1] + u * v * c11[1] + (1 - u) * v * c01[1];
        let z = (1 - u) * (1 - v) * c00[2] + u * (1 - v) * c10[2] + u * v * c11[2] + (1 - u) * v * c01[2];
        const k = Math.sin(Math.PI * u) * Math.sin(Math.PI * v);
        const near = Math.exp(-Math.pow((y - STATE.netImpactY) / 55, 2));
        const push = bulge * k * (0.4 + 0.6 * near);
        z -= k * 0.8; // léger affaissement du tissu
        return projectPoint(x + push, y, z);
    };

    // Fond translucide
    const corners = [pt(0, 0), pt(1, 0), pt(1, 1), pt(0, 1)];
    ctx.fillStyle = `rgba(226, 238, 255, ${fillAlpha})`;
    ctx.beginPath();
    ctx.moveTo(corners[0].x, corners[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
    ctx.closePath();
    ctx.fill();

    // Mailles
    ctx.lineCap = 'butt';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
    ctx.lineWidth = 0.8;
    const seg = 6;
    for (let i = 0; i <= nu; i++) {
        const u = i / nu;
        ctx.beginPath();
        for (let j = 0; j <= seg; j++) {
            const p = pt(u, j / seg);
            if (j === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
    }
    for (let j = 0; j <= nv; j++) {
        const v = j / nv;
        ctx.beginPath();
        for (let i = 0; i <= seg; i++) {
            const p = pt(i / seg, v);
            if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
    }
}

// Partie arrière : ombre au sol, filet du fond, filet latéral lointain, arceaux arrière
function drawGoalBack() {
    if (!ensureCanvasContext()) return;
    const g = goalGeom();
    const P = projectPoint;
    const w = Math.max(3.4, 4.6 * P(g.gx, g.yb, 0).scale);

    // Ombre portée de la cage sur la pelouse
    const s1 = P(g.gx - 3, g.yt, 0), s2 = P(g.gx - 3, g.yb, 0);
    const s3 = P(g.bx + 12, g.byb + 4, 0), s4 = P(g.bx + 12, g.byt - 2, 0);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.26)';
    ctx.beginPath();
    ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.lineTo(s3.x, s3.y); ctx.lineTo(s4.x, s4.y);
    ctx.closePath();
    ctx.fill();

    // Filet du fond
    drawNetPanel(
        [g.bx, g.byt, 0], [g.bx, g.byb, 0], [g.bx, g.byb, g.hb], [g.bx, g.byt, g.hb],
        12, 6, 18, 0.38, 0.07
    );
    // Filet latéral lointain
    drawNetPanel(
        [g.gx, g.yt, 0], [g.bx, g.byt, 0], [g.bx, g.byt, g.hb], [g.gx, g.yt, g.gh],
        7, 6, 7, 0.3, 0.05
    );

    // Arceaux arrière (structure fine, plus sombre car plus loin)
    const thin = Math.max(1.6, w * 0.5);
    const bBotT = P(g.bx, g.byt, 0), bBotB = P(g.bx, g.byb, 0);
    const bTopT = P(g.bx, g.byt, g.hb), bTopB = P(g.bx, g.byb, g.hb);
    goalTube(bBotT, bTopT, thin, '#b6c2d1');
    goalTube(bBotB, bTopB, thin, '#b6c2d1');
    goalTube(bTopT, bTopB, thin, '#b6c2d1');
    goalTube(bBotT, bBotB, thin, '#9aa8ba');
    // Barre de sol et bras de toit côté lointain
    goalTube(P(g.gx, g.yt, 0), bBotT, thin, '#c3cedb');
    goalTube(P(g.gx, g.yt, g.gh), bTopT, thin, '#d7dfe9');
}

// Poteau lointain (se dessine avant les joueurs plus proches de la caméra)
function drawGoalFarPost() {
    if (!ensureCanvasContext()) return;
    const g = goalGeom();
    const w = Math.max(3.4, 4.6 * projectPoint(g.gx, g.yt, 0).scale);
    goalTube(projectPoint(g.gx, g.yt, 0), projectPoint(g.gx, g.yt, g.gh), w);
}

// Partie avant : filet latéral proche, toit, barre transversale, poteau proche
function drawGoalNear() {
    if (!ensureCanvasContext()) return;
    const g = goalGeom();
    const P = projectPoint;
    const w = Math.max(3.4, 4.6 * P(g.gx, g.yb, 0).scale);
    const thin = Math.max(1.6, w * 0.5);

    // Filet du toit
    drawNetPanel(
        [g.gx, g.yt, g.gh], [g.gx, g.yb, g.gh], [g.bx, g.byb, g.hb], [g.bx, g.byt, g.hb],
        12, 7, 5, 0.34, 0.06
    );
    // Filet latéral proche (devant le ballon et le gardien)
    drawNetPanel(
        [g.gx, g.yb, 0], [g.bx, g.byb, 0], [g.bx, g.byb, g.hb], [g.gx, g.yb, g.gh],
        7, 6, 7, 0.26, 0.04
    );

    // Bras de structure côté proche
    const fBotB = P(g.gx, g.yb, 0), fTopB = P(g.gx, g.yb, g.gh);
    goalTube(fBotB, P(g.bx, g.byb, 0), thin, '#dfe6ef');
    goalTube(fTopB, P(g.bx, g.byb, g.hb), thin, '#eef2f7');

    // Barre transversale + poteau proche
    const fTopT = P(g.gx, g.yt, g.gh);
    goalTube(fTopT, fTopB, w);
    goalTube(fBotB, fTopB, w);

    // Points d'attache blancs aux coins
    ctx.fillStyle = '#ffffff';
    [fTopT, fTopB].forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, w * 0.55, 0, Math.PI * 2);
        ctx.fill();
    });
}
