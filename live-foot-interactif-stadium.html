function getCategoryLabel(category) {
    if (category === 'CLUB') return 'Club';
    if (category === 'NATIONAL') return 'Sélection';
    if (category === 'SPECIAL') return 'Équipe Spéciale';
    return 'Équipe';
}

function updateTeamPreviewUI() {
    const team = getCurrentTeam();
    const colors = getEffectiveTeamColors(team);
    const badgeEl = document.getElementById('scoreboard-team-badge');
    const nameEl = document.getElementById('scoreboard-team-name');
    const jerseyEl = document.getElementById('team-preview-jersey');
    const previewNameEl = document.getElementById('team-preview-name');
    const previewMetaEl = document.getElementById('team-preview-meta');
    const swatchPrimaryEl = document.getElementById('swatch-primary');
    const swatchSecondaryEl = document.getElementById('swatch-secondary');
    const swatchGkEl = document.getElementById('swatch-gk');

    const pickerPrimary = document.getElementById('color-picker-primary');
    const pickerShorts = document.getElementById('color-picker-shorts');
    const pickerSecondary = document.getElementById('color-picker-secondary');
    const pickerNumber = document.getElementById('color-picker-number');
    const pickerGk = document.getElementById('color-picker-gk');

    if (badgeEl) {
        badgeEl.style.background = `linear-gradient(135deg, ${colors.primary}, ${colors.secondary})`;
    }
    if (nameEl) {
        nameEl.textContent = team.name;
    }
    if (jerseyEl) {
        jerseyEl.style.background = `linear-gradient(135deg, ${colors.primary}, ${colors.primaryDark})`;
        jerseyEl.style.borderBottom = `4px solid ${colors.shorts}`;
        jerseyEl.style.color = colors.number;
        jerseyEl.textContent = '10';
    }
    if (previewNameEl) {
        previewNameEl.textContent = `${team.badge} ${team.name}`;
    }
    if (previewMetaEl) {
        const hasCustom = Boolean(STATE.customTeamColors && STATE.customTeamColors[team.id]);
        const customSuffix = hasCustom ? ' • Couleurs modifiées' : ' • Couleurs officielles';
        previewMetaEl.textContent = `${getCategoryLabel(team.category)} • 16 Joueurs${customSuffix}`;
    }
    if (swatchPrimaryEl) {
        swatchPrimaryEl.style.backgroundColor = colors.primary;
    }
    if (swatchSecondaryEl) {
        swatchSecondaryEl.style.backgroundColor = colors.shorts;
    }
    if (swatchGkEl) {
        swatchGkEl.style.backgroundColor = colors.gkJersey;
    }

    if (pickerPrimary) pickerPrimary.value = colors.primary;
    if (pickerShorts) pickerShorts.value = colors.shorts;
    if (pickerSecondary) pickerSecondary.value = colors.secondary;
    if (pickerNumber) pickerNumber.value = colors.number;
    if (pickerGk) pickerGk.value = colors.gkJersey;

    renderQuickColorSwatches();
}

function updateCustomTeamColor(colorKey, hexValue) {
    if (!isValidHexColor(hexValue)) return;
    const team = getCurrentTeam();
    if (!STATE.customTeamColors || typeof STATE.customTeamColors !== 'object') {
        STATE.customTeamColors = {};
    }
    const existing = STATE.customTeamColors[team.id] || {};
    STATE.customTeamColors[team.id] = {
        ...existing,
        [colorKey]: hexValue.toLowerCase()
    };
    saveCustomColorsMap(STATE.customTeamColors);
    updateTeamPreviewUI();
}

function resetCurrentTeamColors() {
    const team = getCurrentTeam();
    if (STATE.customTeamColors && STATE.customTeamColors[team.id]) {
        delete STATE.customTeamColors[team.id];
        saveCustomColorsMap(STATE.customTeamColors);
    }
    updateTeamPreviewUI();
}

function populateTeamSelect(category = 'ALL') {
    const selectEl = document.getElementById('select-team');
    if (!selectEl) return;

    const filteredTeams = category === 'ALL'
        ? TEAMS_CATALOG
        : TEAMS_CATALOG.filter(t => t.category === category);

    selectEl.innerHTML = '';
    filteredTeams.forEach(team => {
        const option = document.createElement('option');
        option.value = team.id;
        option.textContent = `${team.badge} ${team.name} (${team.shortName})`;
        if (team.id === STATE.teamId) {
            option.selected = true;
        }
        selectEl.appendChild(option);
    });

    if (filteredTeams.length > 0 && !filteredTeams.some(t => t.id === STATE.teamId)) {
        STATE.teamId = filteredTeams[0].id;
        selectEl.value = STATE.teamId;
        saveTeamId(STATE.teamId);
    }

    updateTeamPreviewUI();
}

function filterTeamsByCategory() {
    const catSelect = document.getElementById('select-team-category');
    const category = catSelect ? catSelect.value : 'ALL';
    populateTeamSelect(category);
}

function changeTeam(teamId) {
    if (!teamId || !TEAMS_CATALOG.some(t => t.id === teamId)) return;
    STATE.teamId = teamId;
    saveTeamId(STATE.teamId);
    updateTeamPreviewUI();
}

function pickRandomTeam() {
    const catSelect = document.getElementById('select-team-category');
    const category = catSelect ? catSelect.value : 'ALL';
    const pool = category === 'ALL'
        ? TEAMS_CATALOG
        : TEAMS_CATALOG.filter(t => t.category === category);
    if (pool.length === 0) return;

    const candidates = pool.length > 1 ? pool.filter(t => t.id !== STATE.teamId) : pool;
    const chosen = candidates[Math.floor(Math.random() * candidates.length)];
    STATE.teamId = chosen.id;
    saveTeamId(STATE.teamId);

    const selectEl = document.getElementById('select-team');
    if (selectEl) {
        selectEl.value = chosen.id;
    }
    updateTeamPreviewUI();
}

// ============================================================================
// 12. CONTRÔLES DU STREAMER, COMPTE TIKTOK, AUTO-LIVE & CONNEXION GRIFFON ARCADE
// ============================================================================
let ws = null;

function updateTikTokAccountUI() {
    const inputEl = document.getElementById('tiktok-username-input');
    const badgeEl = document.getElementById('tiktok-account-badge');
    const btnEl = document.getElementById('btn-tiktok-connect');

    if (inputEl && STATE.tiktokHandle && !inputEl.value) {
        inputEl.value = STATE.tiktokHandle;
    }

    if (badgeEl) {
        if (STATE.tiktokConnected && STATE.tiktokHandle) {
            badgeEl.textContent = `🟢 ${STATE.tiktokHandle}`;
            badgeEl.className = 'text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 truncate max-w-[140px]';
        } else if (STATE.tiktokHandle) {
            badgeEl.textContent = `⏸ ${STATE.tiktokHandle}`;
            badgeEl.className = 'text-[10px] font-bold px-2 py-0.5 rounded bg-pink-500/20 text-pink-200 border border-pink-400/30 truncate max-w-[140px]';
        } else {
            badgeEl.textContent = 'Non lié';
            badgeEl.className = 'text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-400 truncate max-w-[130px]';
        }
    }

    if (btnEl) {
        if (STATE.tiktokConnected && STATE.tiktokHandle) {
            btnEl.textContent = 'Délier';
            btnEl.className = 'bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl transition active:scale-95 whitespace-nowrap';
        } else {
            btnEl.textContent = 'Connecter';
            btnEl.className = 'bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl transition active:scale-95 whitespace-nowrap shadow';
        }
    }
}

function sendTikTokSubscribeMessage() {
    if (!ws || ws.readyState !== WebSocket.OPEN || !STATE.tiktokHandle) return;
    const cleanUser = STATE.tiktokHandle.replace(/^@/, '');
    try {
        ws.send(JSON.stringify({
            event: 'subscribe',
            action: 'connect',
            platform: 'tiktok',
            uniqueId: cleanUser,
            username: cleanUser
        }));
    } catch (e) {}
}

function connectTikTokAccount() {
    const inputEl = document.getElementById('tiktok-username-input');

    // Si déjà connecté et que l'utilisateur clique sur "Délier"
    if (STATE.tiktokConnected && STATE.tiktokHandle) {
        STATE.tiktokConnected = false;
        saveTikTokAccount({ handle: STATE.tiktokHandle, connected: false });
        updateTikTokAccountUI();
        showCenterBanner(
            '📱 TIKTOK DÉLIÉ',
            `Compte ${STATE.tiktokHandle} mis en pause`,
            'border-slate-400 text-slate-200'
        );
        return;
    }

    const normalized = normalizeTikTokHandle(inputEl ? inputEl.value : STATE.tiktokHandle);
    if (!normalized) {
        showCenterBanner(
            '⚠️ PSEUDO TIKTOK REQUIS',
            'Entre un @pseudo TikTok valide (ex: @mon_pseudo)',
            'border-rose-400 text-rose-300'
        );
        if (inputEl) inputEl.focus();
        return;
    }

    STATE.tiktokHandle = normalized;
    STATE.tiktokConnected = true;
    if (inputEl) inputEl.value = normalized;
    saveTikTokAccount({ handle: STATE.tiktokHandle, connected: true });
    updateTikTokAccountUI();

    // Si le pont WebSocket n'est pas encore ouvert, tenter la connexion automatiquement
    if (!ws || ws.readyState === WebSocket.CLOSED) {
        toggleWebSocket(true);
    } else if (ws.readyState === WebSocket.OPEN) {
        sendTikTokSubscribeMessage();
    }

    showCenterBanner(
        '📱 TIKTOK CONNECTÉ !',
        `Live lié au compte ${STATE.tiktokHandle}`,
        'border-pink-400 text-pink-200'
    );
}

function toggleWebSocket(silentOnError = false) {
    const btn = document.getElementById('btn-ws-connect');
    const statusEl = document.getElementById('ws-status');
    const urlInput = document.getElementById('ws-url');
    const url = urlInput ? urlInput.value.trim() : 'ws://localhost:21213/';

    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.close();
        return;
    }

    try {
        statusEl.textContent = 'Connexion...';
        statusEl.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300';
        ws = new WebSocket(url);

        ws.onopen = () => {
            statusEl.textContent = 'Connecté';
            statusEl.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300';
            btn.textContent = 'Couper';
            btn.classList.replace('bg-blue-600/90', 'bg-rose-600');
            sendTikTokSubscribeMessage();
        };

        ws.onmessage = (event) => {
            try {
                const payload = JSON.parse(event.data);
                if (payload.event === 'gift' || payload.type === 'gift') handleLiveGiftEvent(payload);
            } catch (e) {
                // Ignorer les messages non-JSON
            }
        };

        ws.onclose = () => {
            statusEl.textContent = 'Déconnecté';
            statusEl.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-800 text-slate-400';
            btn.textContent = 'Pont WS';
            btn.classList.replace('bg-rose-600', 'bg-blue-600/90');
        };

        ws.onerror = () => {
            statusEl.textContent = silentOnError ? 'Bridge OFF' : 'Erreur WS';
            statusEl.className = 'text-[10px] font-bold px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300';
        };
    } catch (err) {
        statusEl.textContent = 'URL Invalide';
    }
}

// Écouteur natif postMessage pour l'intégration directe dans Griffon Arcade ou un bridge TikTok Live
window.addEventListener('message', (event) => {
    const payload = event.data;
    if (!payload || typeof payload !== 'object') return;
    if (payload.event === 'gift' || payload.type === 'gift' || payload.source === 'griffon-arcade' || payload.source === 'tiktok-live') {
        handleLiveGiftEvent(payload);
    }
});

// Boutons Son & Masquage du panneau (Mode Stream Overlay épuré)
const soundBtn = document.getElementById('btn-sound');
if (soundBtn) {
    soundBtn.addEventListener('click', async () => {
        STATE.soundEnabled = !STATE.soundEnabled;
        if (STATE.soundEnabled) await initAudio();
        const iconEl = document.getElementById('sound-icon');
        if (iconEl) iconEl.textContent = STATE.soundEnabled ? '🔊' : '🔇';
    });
}

const toggleHudBtn = document.getElementById('btn-toggle-hud');
if (toggleHudBtn) {
    toggleHudBtn.addEventListener('click', () => {
        STATE.hudVisible = !STATE.hudVisible;
        const panel = document.getElementById('streamer-panel');
        const txt = document.getElementById('hud-toggle-text');
        if (panel) {
            if (STATE.hudVisible) {
                panel.style.transform = 'translateY(0)';
                panel.style.opacity = '1';
                panel.style.pointerEvents = 'auto';
            } else {
                panel.style.transform = 'translateY(120%)';
                panel.style.opacity = '0';
                panel.style.pointerEvents = 'none';
            }
        }
        if (txt) {
            txt.textContent = STATE.hudVisible ? 'Masquer Panneau' : 'Afficher Panneau';
        }
        resizeCanvas();
    });
}

const autoLiveBtn = document.getElementById('btn-auto-live');
if (autoLiveBtn) {
    autoLiveBtn.addEventListener('click', () => {
        STATE.autoLive = !STATE.autoLive;
        if (STATE.autoLive) {
            autoLiveBtn.textContent = '🤖 Auto-Live : ON';
            autoLiveBtn.className = 'text-[10px] font-bold px-2 py-0.5 rounded-lg bg-emerald-500/30 text-emerald-200 border border-emerald-400/50 transition';
        } else {
            autoLiveBtn.textContent = '🤖 Auto-Live : OFF';
            autoLiveBtn.className = 'text-[10px] font-bold px-2 py-0.5 rounded-lg bg-indigo-500/25 text-indigo-300 border border-indigo-400/30 hover:bg-indigo-500/40 transition';
        }
    });
}

// Clic sur le canvas déclenche une passe test rapide (pratique sur mobile/desktop)
function bindCanvasInteractions() {
    if (!ensureCanvasContext()) return;
    if (canvas.dataset.boundClick === 'true') return;
    canvas.dataset.boundClick = 'true';
    canvas.addEventListener('click', () => {
        triggerGift('⚽ Passe Rapide', 1, 1, false);
    });
}

bindCanvasInteractions();
window.addEventListener('resize', resizeCanvas);

function initStadiumApp() {
    bindCanvasInteractions();
    populateTeamSelect('ALL');
    updateTikTokAccountUI();
    createGrassTexture();
    initCrowdFlashes();
    resizeCanvas();
    updateHUD();
    if (!rafId) {
        lastTime = performance.now();
        rafId = requestAnimationFrame(gameLoop);
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initStadiumApp);
} else {
    initStadiumApp();
}

window.onload = function () {
    initStadiumApp();
};
</script>
