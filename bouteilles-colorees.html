<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Le Jeu des Bouteilles Colorées — TikTok Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; overflow: hidden; background: #2a1158; font-family: Poppins, system-ui, sans-serif; color: #f5f0ff; user-select: none; }
        #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
        .panel { position: fixed; z-index: 10; top: 16px; right: 16px; width: 290px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,.2); border-radius: 14px; background: rgba(15,6,38,.94); box-shadow: 0 14px 40px rgba(0,0,0,.5); }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 11px; border-bottom: 1px solid rgba(255,255,255,.14); font: 900 11px Orbitron, sans-serif; letter-spacing: .06em; cursor: grab; touch-action: none; }
        .panel.dragging .panel-head { cursor: grabbing; }
        .eye { width: 32px; height: 28px; border: 1px solid rgba(0,243,255,.5); border-radius: 8px; background: rgba(0,70,92,.4); color: #9dfaff; font-size: 16px; cursor: pointer; }
        .panel-body { overflow-y: auto; padding: 11px; display: grid; gap: 10px; }
        .panel.hidden-panel { width: auto; background: rgba(15,6,38,.35); opacity: .4; border-color: transparent; box-shadow: none; }
        .panel.hidden-panel:hover { opacity: 1; }
        .panel.hidden-panel .panel-head { padding: 4px; border: 0; }
        .panel.hidden-panel .panel-title, .panel.hidden-panel .panel-body { display: none; }
        .box { display: grid; gap: 6px; padding: 9px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; background: rgba(255,255,255,.04); }
        .box h3 { margin: 0; color: #ffd36b; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
        .row { display: flex; gap: 6px; }
        .row > * { flex: 1; min-width: 0; }
        label { display: flex; justify-content: space-between; font-size: 11px; color: #cfc6ee; }
        input[type=text], input[type=number], input[type=url] { width: 100%; padding: 6px 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; background: rgba(0,0,0,.35); color: #fff; font: inherit; font-size: 12px; user-select: text; }
        input[type=range] { width: 100%; accent-color: #ff4fa3; }
        button.btn { min-height: 34px; padding: 6px 8px; border: 1px solid rgba(255,255,255,.25); border-radius: 9px; background: linear-gradient(135deg, #d6226f, #7b1fd1); color: #fff; font: 700 12px Poppins, sans-serif; cursor: pointer; }
        button.btn.alt { background: rgba(0,70,92,.7); border-color: #00f3ff; color: #aafaff; }
        button.btn.danger { background: #5a1b2b; border-color: #ff8d87; }
        button.btn:hover { filter: brightness(1.15); }
        .status { margin: 0; font-size: 11px; color: #b7ffcf; min-height: 15px; }
        .toast { position: fixed; z-index: 9; left: 16px; bottom: 16px; max-width: 70vw; padding: 8px 14px; border: 1px solid rgba(192,132,252,.6); border-radius: 12px; background: rgba(40,12,85,.88); font-size: 14px; opacity: 0; transform: translateY(14px); transition: .25s; pointer-events: none; }
        .toast.show { opacity: 1; transform: none; }
    </style>
</head>
<body>
    <canvas id="game" aria-label="Stand du jeu des bouteilles colorées"></canvas>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <aside id="panel" class="panel" aria-label="Panneau de contrôle du streamer">
        <header id="panel-head" class="panel-head">
            <span class="panel-title">PANNEAU DE CONTRÔLE</span>
            <button id="eye" class="eye" type="button" aria-expanded="true" title="Masquer / afficher le panneau" aria-label="Masquer le panneau">👁</button>
        </header>
        <div id="panel-body" class="panel-body">
            <section class="box"> 
                
                <h3>Connexion TikTok</h3>
                <input id="username" type="text" maxlength="32" placeholder="Pseudo TikTok" autocomplete="off">
                <input id="ws-url" type="url" value="wss://jeu6boite.onrender.com" aria-label="Adresse WebSocket">
                <button id="connect" class="btn" type="button">Connecter le live</button>
                <p id="live-status" class="status" role="status"></p>
            </section>
            <section class="box">
                <h3>Chance de touche (RTP)</h3>
                <label for="rtp">Probabilité <output id="rtp-out">85%</output></label>
                <input id="rtp" type="range" min="10" max="100" value="85">
            </section>
            <section class="box">
                <h3>Éditeur de récompenses ✏️</h3>
                <div class="row">
                    <label>Min<input id="star-min" type="number" min="1" max="50" value="1"></label>
                    <label>Max<input id="star-max" type="number" min="1" max="50" value="50"></label>
                </div>
                <button id="reset-pool" class="btn danger" type="button">Réinitialiser 1000 ⭐</button>
            </section>
            <section class="box">
                <h3>Voix IA</h3>
                <button id="voice" class="btn alt" type="button" aria-pressed="false">🔇 Activer l'accueil vocal</button>
            </section>
            <section class="box">
                <h3>Simulateur</h3>
                <input id="sim-name" type="text" value="Alex_TikTok 🚀" aria-label="Pseudo simulé">
                <div class="row">
                    <button id="sim-gift" class="btn" type="button">🎁 Tir cadeau</button>
                    <button id="sim-burst" class="btn" type="button">💥 Rafale ×10</button>
                </div>
                <div class="row">
                    <button id="sim-join" class="btn alt" type="button">👋 Arrivée</button>
                    <button id="sim-star" class="btn alt" type="button">!étoile</button>
                </div>
            </section>
            <section class="box">
                <h3>Sauvegarde</h3>
                <div class="row">
                    <button id="save" class="btn alt" type="button">💾 Enregistrer</button>
                    <button id="export" class="btn alt" type="button">📤 Exporter</button>
                </div>
            </section>
        </div>
    </aside>

    <script>
        'use strict';

        const W = 1408, H = 768;
        const SLOT_COUNT = 10;
        const TOTAL_STARS = 1000;
        const SAVE_KEY = 'bouteilles-colorees-save';
        const LAYOUT_KEY = 'bouteilles-colorees-panel';
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const $ = id => document.getElementById(id);

        const defs = [
            { kind: 'wine', c1: '#d63a3a', c2: '#ff9a9a' },
            { kind: 'soda', c1: '#ff4fa3', c2: '#ffb3d6' },
            { kind: 'flask', c1: '#2fc4f0', c2: '#aeeaff' },
            { kind: 'tall', c1: '#ffb62e', c2: '#ffe08a' },
            { kind: 'wine', c1: '#6bd44a', c2: '#c3f2a8' },
            { kind: 'soda', c1: '#a45cf0', c2: '#d6b3ff' },
            { kind: 'flask', c1: '#ff7a2e', c2: '#ffc79a' },
            { kind: 'tall', c1: '#3dd6b0', c2: '#aef2e0' },
            { kind: 'wine', c1: '#4a7bff', c2: '#a9c0ff' },
            { kind: 'soda', c1: '#ffe600', c2: '#fff6a0' }];

        const settings = { rtp: 85, min: 1, max: 50 };
        let queue = [];
        let queueIndex = 0;
        let starsGiven = 0;
        let knocked = 0;
        const slots = Array.from({ length: SLOT_COUNT }, () => ({ state: 'empty', plush: null, t: 0, wobble: 0 }));
        const viewers = new Map();
        const greeted = new Set();
        const balls = [];
        const particles = [];
        const floaters = [];
        const pendingShots = [];
        let shotTimer = 0;
        let banner = null;

        function rand(seed) {
            let s = seed;
            return () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
        }

        function slotX(i) { return 707 + ((i % 5) - 2) * 112; }
        function slotY(i) { return i < 5 ? 320 : 430; }

        /* ---------- Pool de bouteilles ---------- */
        function buildPool() {
            const lo = Math.max(1, Math.min(50, Math.floor(settings.min) || 1));
            const hi = Math.max(lo, Math.min(50, Math.floor(settings.max) || 50));
            const list = [];
            let left = TOTAL_STARS;
            while (left > 0) {
                const value = Math.min(left, lo + Math.floor(Math.pow(Math.random(), 2.2) * (hi - lo + 1)));
                list.push({ reward: value, def: Math.floor(Math.random() * defs.length) });
                left -= value;
            }
            return list;
        }

        function resetPool() {
            queue = buildPool();
            queueIndex = 0;
            starsGiven = 0;
            knocked = 0;
            viewers.forEach(v => { v.stars = 0; });
            balls.length = 0;
            pendingShots.length = 0;
            slots.forEach(slot => Object.assign(slot, { state: 'empty', plush: null, t: 0, wobble: 0 }));
            fillSlots(true);
            banner = null;
        }

        function spawnInto(slot, instant) {
            if (queueIndex >= queue.length) return false;
            slot.plush = queue[queueIndex++];
            slot.state = 'spawning';
            slot.t = instant ? 0.4 : 0;
            slot.wobble = 0;
            return true;
        }

        function fillSlots(instant) {
            slots.forEach(slot => { if (slot.state === 'empty') spawnInto(slot, instant); });
        }

        function remainingBottles() {
            return (queue.length - queueIndex) + slots.filter(s => s.plush && s.state !== 'falling').length;
        }

        /* ---------- Spectateurs ---------- */
        function safeUrl(url) {
            return typeof url === 'string' && /^(https?:|data:image\/)/i.test(url) ? url : '';
        }

        function getViewer(rawName, avatarUrl) {
            const username = String(rawName || 'Spectateur').trim().replace(/^@/, '') || 'Spectateur';
            const key = username.toLocaleLowerCase();
            let viewer = viewers.get(key);
            if (!viewer) {
                viewer = { username, stars: 0, img: null };
                viewers.set(key, viewer);
            }
            setAvatar(viewer, avatarUrl);
            welcome(viewer);
            return viewer;
        }

        function setAvatar(viewer, url) {
            const src = safeUrl(url);
            if (!src || viewer.src === src) return;
            viewer.src = src;
            const img = new Image();
            img.referrerPolicy = 'no-referrer';
            img.onload = () => { viewer.img = img; };
            img.src = src;
        }

        /* ---------- Voix IA ---------- */
        let voiceOn = false;
        const speechQueue = [];

        function cleanName(name) {
            const cleaned = String(name)
                .replace(/[\p{Extended_Pictographic}\p{Regional_Indicator}\u200d\ufe0f\u20e3\u{1F3FB}-\u{1F3FF}]/gu, '')
                .replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ').trim();
            return cleaned || 'nouveau spectateur';
        }

        function say(text) {
            if (!voiceOn || !('speechSynthesis' in window)) return;
            speechQueue.push(text);
            if (speechQueue.length > 4) speechQueue.shift();
            if (!speechSynthesis.speaking) nextSpeech();
        }

        function nextSpeech() {
            const text = speechQueue.shift();
            if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith('fr'));
            if (voice) utterance.voice = voice;
            utterance.onend = nextSpeech;
            utterance.onerror = nextSpeech;
            speechSynthesis.resume();
            speechSynthesis.speak(utterance);
        }

        function welcome(viewer) {
            const key = viewer.username.toLocaleLowerCase();
            if (greeted.has(key)) return;
            greeted.add(key);
            const spoken = cleanName(viewer.username);
            showToast(`🎙️ Bienvenue ${spoken} !`);
            say(`Bienvenue ${spoken}`);
        }

        function enableVoice() {
            if (!('speechSynthesis' in window)) {
                showToast('Synthèse vocale indisponible dans ce navigateur.');
                return;
            }
            voiceOn = true;
            $('voice').textContent = '🔊 Accueil vocal activé';
            $('voice').setAttribute('aria-pressed', 'true');
            say('Accueil vocal activé');
        }

        let toastTimer = null;
        function showToast(message) {
            const toast = $('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        /* ---------- Tirs ---------- */
        function queueShots(viewer, count) {
            for (let i = 0; i < count; i++) pendingShots.push(viewer);
        }

        function launchShot(viewer) {
            const idle = slots.map((s, i) => ({ s, i })).filter(o => o.s.state === 'idle');
            if (!idle.length) return false;
            const free = idle.filter(o => !o.s.targeted);
            const pick = (free.length ? free : idle)[Math.floor(Math.random() * (free.length || idle.length))];
            pick.s.targeted = true;
            balls.push({ viewer, slot: pick.i, plush: pick.s.plush, t: 0, dur: 0.85, x: 707, y: 540 });
            return true;
        }

        function resolveShot(ball) {
            const slot = slots[ball.slot];
            const x = slotX(ball.slot), y = slotY(ball.slot) - 40;
            slot.targeted = false;
            const valid = slot.state === 'idle' && slot.plush === ball.plush;
            if (valid && Math.random() * 100 < settings.rtp) {
                const reward = slot.plush.reward;
                ball.viewer.stars += reward;
                starsGiven += reward;
                knocked += 1;
                slot.state = 'falling';
                slot.t = 0;
                slot.vx = (Math.random() - 0.5) * 260;
                slot.vy = -320;
                slot.dy = 0;
                slot.dx = 0;
                slot.rot = 0;
                burst(x, y, 36);
                floaters.push({ text: `${reward} ⭐`, x, y: y - 40, t: 0, color: '#fff08c' });
                banner = { viewer: ball.viewer, kind: 'win', reward, until: performance.now() + 7000 };
                say(`${cleanName(ball.viewer.username)} gagne ${reward} étoile${reward > 1 ? 's' : ''}`);
            } else {
                if (valid) slot.wobble = 0.7;
                floaters.push({ text: 'RATÉ !', x, y: y - 20, t: 0, color: '#ff9bc9' });
                balls.push({ viewer: ball.viewer, out: true, t: 0, x, y, vx: (Math.random() - 0.5) * 500, vy: -260 });
            }
        }

        function burst(x, y, n) {
            const colors = ['#ffe600', '#ff4fa3', '#00f3ff', '#7cff6b', '#ffffff', '#ff9a3c'];
            for (let i = 0; i < n; i++) {
                const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 380;
                particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, t: 0, life: 0.8 + Math.random() * 0.7, c: colors[i % colors.length], star: i % 3 === 0 });
            }
        }

        function claimStars(viewer) {
            banner = { viewer, kind: 'total', until: performance.now() + 6000 };
            say(`${cleanName(viewer.username)}, tu as ${viewer.stars} étoile${viewer.stars > 1 ? 's' : ''}`);
        }

        /* ---------- Mise à jour ---------- */
        function update(dt) {
            shotTimer -= dt;
            if (pendingShots.length && shotTimer <= 0) {
                if (launchShot(pendingShots[0])) { pendingShots.shift(); shotTimer = 0.4; } else { shotTimer = 0.3; }
            }
            slots.forEach((slot, i) => {
                slot.t += dt;
                if (slot.state === 'spawning' && slot.t >= 0.4) slot.state = 'idle';
                if (slot.wobble > 0) slot.wobble = Math.max(0, slot.wobble - dt);
                if (slot.state === 'falling') {
                    slot.vy += 1500 * dt;
                    slot.dx += slot.vx * dt;
                    slot.dy += slot.vy * dt;
                    slot.rot += dt * 6;
                    if (slot.t > 1.1) {
                        slot.state = 'empty';
                        slot.plush = null;
                        spawnInto(slot, false);
                    }
                } else if (slot.state === 'empty') {
                    spawnInto(slot, false);
                }
            });
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];
                b.t += dt;
                if (b.out) {
                    b.vy += 1400 * dt;
                    b.x += b.vx * dt;
                    b.y += b.vy * dt;
                    if (b.t > 1.2) balls.splice(i, 1);
                } else if (b.t >= b.dur) {
                    resolveShot(b);
                    balls.splice(i, 1);
                }
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.t += dt;
                p.vy += 700 * dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                if (p.t > p.life) particles.splice(i, 1);
            }
            for (let i = floaters.length - 1; i >= 0; i--) {
                floaters[i].t += dt;
                if (floaters[i].t > 1.6) floaters.splice(i, 1);
            }
            if (banner && performance.now() > banner.until) banner = null;
        }

        /* ---------- Dessin des bouteilles ---------- */
        function ell(c, x, y, rx, ry, fill) {
            c.beginPath();
            c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
            c.fillStyle = fill;
            c.fill();
        }

        function tri(c, x1, y1, x2, y2, x3, y3, fill) {
            c.beginPath();
            c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineTo(x3, y3);
            c.closePath();
            c.fillStyle = fill;
            c.fill();
        }

        function bottlePath(c, kind) {
            c.beginPath();
            if (kind === 'wine') {
                c.moveTo(-26, -2); c.lineTo(-26, -70); c.quadraticCurveTo(-26, -86, -9, -92); c.lineTo(-9, -118);
                c.lineTo(9, -118); c.lineTo(9, -92); c.quadraticCurveTo(26, -86, 26, -70); c.lineTo(26, -2);
            } else if (kind === 'flask') {
                c.moveTo(-9, -118); c.lineTo(9, -118); c.lineTo(9, -90); c.quadraticCurveTo(34, -70, 34, -30);
                c.quadraticCurveTo(34, -2, 18, -2); c.lineTo(-18, -2); c.quadraticCurveTo(-34, -2, -34, -30);
                c.quadraticCurveTo(-34, -70, -9, -90);
            } else if (kind === 'soda') {
                c.moveTo(-24, -2); c.lineTo(-24, -62); c.quadraticCurveTo(-24, -78, -12, -88); c.lineTo(-10, -112);
                c.lineTo(10, -112); c.lineTo(12, -88); c.quadraticCurveTo(24, -78, 24, -62); c.lineTo(24, -2);
            } else {
                c.moveTo(-20, -2); c.lineTo(-20, -96); c.quadraticCurveTo(-20, -104, -12, -106); c.lineTo(-8, -120);
                c.lineTo(8, -120); c.lineTo(12, -106); c.quadraticCurveTo(20, -104, 20, -96); c.lineTo(20, -2);
            }
            c.closePath();
        }

        function drawBottle(c, def) {
            const { kind, c1, c2 } = def;
            ell(c, 0, 0, 34, 7, 'rgba(0,0,0,.3)');
            c.save();
            bottlePath(c, kind);
            const body = c.createLinearGradient(-34, 0, 34, 0);
            body.addColorStop(0, c1);
            body.addColorStop(0.45, c2);
            body.addColorStop(1, c1);
            c.fillStyle = body;
            c.globalAlpha = 0.92;
            c.fill();
            c.globalAlpha = 1;
            c.lineWidth = 3;
            c.strokeStyle = 'rgba(255,255,255,.75)';
            c.stroke();
            c.clip();
            // Liquide et étiquette
            c.fillStyle = 'rgba(255,255,255,.28)';
            c.fillRect(-40, -50, 80, 6);
            c.fillStyle = 'rgba(255,255,255,.85)';
            c.fillRect(-40, -44, 80, 26);
            c.restore();
            c.fillStyle = c1;
            c.font = '900 13px Orbitron, Poppins, sans-serif';
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            c.fillText('★', 0, -31);
            // Reflet
            c.fillStyle = 'rgba(255,255,255,.55)';
            c.beginPath(); c.roundRect(-18, -84, 5, 36, 3); c.fill();
            // Bouchon
            const top = kind === 'flask' || kind === 'wine' ? -118 : kind === 'soda' ? -112 : -120;
            c.fillStyle = '#ffd36b';
            c.beginPath(); c.roundRect(-9, top - 8, 18, 10, 3); c.fill();
            c.strokeStyle = 'rgba(0,0,0,.35)';
            c.lineWidth = 1.5;
            c.stroke();
        }
        function drawAvatar(c, viewer, x, y, r) {
            c.save();
            c.beginPath();
            c.arc(x, y, r, 0, Math.PI * 2);
            c.closePath();
            c.clip();
            if (viewer.img) {
                c.drawImage(viewer.img, x - r, y - r, r * 2, r * 2);
            } else {
                c.fillStyle = '#7b1fd1';
                c.fillRect(x - r, y - r, r * 2, r * 2);
                c.fillStyle = '#fff';
                c.font = `800 ${r * 1.1}px Poppins, sans-serif`;
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText(cleanName(viewer.username).charAt(0).toUpperCase(), x, y + 1);
            }
            c.restore();
            c.beginPath();
            c.arc(x, y, r, 0, Math.PI * 2);
            c.lineWidth = Math.max(2, r / 9);
            c.strokeStyle = '#fff';
            c.stroke();
        }

        /* ---------- Décor statique (hors-écran) ---------- */
        const scene = document.createElement('canvas');
        scene.width = W; scene.height = H;

        function neonText(c, text, x, y, color, size, glow) {
            c.save();
            c.font = `900 ${size}px Orbitron, Poppins, sans-serif`;
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            c.shadowColor = glow || color;
            c.shadowBlur = 16;
            c.fillStyle = color;
            c.fillText(text, x, y);
            c.shadowBlur = 0;
            c.fillStyle = 'rgba(255,255,255,.55)';
            c.fillText(text, x, y - 1);
            c.restore();
        }

        function ledStrip(c, x1, x2, y, color) {
            c.save();
            c.shadowColor = color;
            c.shadowBlur = 14;
            c.fillStyle = color;
            c.fillRect(x1, y, x2 - x1, 5);
            c.restore();
        }

        function buildScene() {
            const c = scene.getContext('2d');
            const rnd = rand(7);

            // Fond violet uni
            const bg = c.createLinearGradient(0, 0, 0, 480);
            bg.addColorStop(0, '#1f0d45');
            bg.addColorStop(1, '#4a1d8f');
            c.fillStyle = bg;
            c.fillRect(0, 0, W, H);

            // Sol pavé
            const floor = c.createLinearGradient(0, 470, 0, H);
            floor.addColorStop(0, '#3a2a68');

            // Stand en bois

            c.fillStyle = '#3b1d10';

            c.fillStyle = '#5b2e1b';
            c.fillRect(365, 158, 685, 34);
            c.fillStyle = '#7a4128';

            // Guirlandes LED verticales
            for (let yy = 205; yy < 500; yy += 12) {

            // Étagères néon (3 étages)
            [[322, '#ff4fa3', 0], [432, '#00d9ff', 1]].forEach(([sy, color]) => {
                c.fillStyle = '#3a1c10';

            ledStrip(c, 425, 990, 466, '#ffd400');

            neonText(c, 'LE JEU DES', 710, 66, '#aef2ff', 44, '#00d9ff');

        /* ---------- Rendu dynamique ---------- */
        function fitText(c, text, maxWidth, size, weight) {
            let s = size;
            c.font = `${weight} ${s}px Poppins, sans-serif`;
            while (c.measureText(text).width > maxWidth && s > 9) {
                s -= 1;
                c.font = `${weight} ${s}px Poppins, sans-serif`;
            }
        }

        function drawBanner(c, time) {
            const sway = Math.sin(time * 1.3) * 0.012;
            c.save();
            c.translate(290, 205);
            c.rotate(sway);
            // Tringle
            c.fillStyle = '#6a3822';
            c.fillRect(-105, -8, 210, 10);
            c.fillStyle = '#ffd36b';
            c.beginPath(); c.arc(-105, -3, 7, 0, Math.PI * 2); c.arc(105, -3, 7, 0, Math.PI * 2); c.fill();
            // Étoffe
            const g = c.createLinearGradient(0, 0, 0, 280);
            g.addColorStop(0, '#5a2a9d');
            g.addColorStop(1, '#3a1773');
            c.fillStyle = g;
            c.beginPath();
            c.moveTo(-92, 2); c.lineTo(92, 2); c.lineTo(92, 262); c.lineTo(0, 232); c.lineTo(-92, 262);
            c.closePath();
            c.fill();
            c.lineWidth = 3;
            c.strokeStyle = '#d9b6ff';
            c.stroke();
            c.strokeStyle = 'rgba(255,211,107,.8)';
            c.lineWidth = 1.5;
            c.beginPath();
            c.moveTo(-80, 12); c.lineTo(80, 12); c.lineTo(80, 244); c.lineTo(0, 218); c.lineTo(-80, 244);
            c.closePath();
            c.stroke();
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            if (banner) {
                const pulse = 1 + Math.sin(time * 6) * 0.03;
                c.fillStyle = banner.kind === 'win' ? '#ff4fa3' : '#00d9ff';
                c.beginPath(); c.roundRect(-60, 18, 120, 20, 10); c.fill();
                c.fillStyle = '#fff';
                c.font = '900 12px Poppins, sans-serif';
                c.fillText(banner.kind === 'win' ? 'GAGNANT !' : 'TES ÉTOILES', 0, 28);
                drawAvatar(c, banner.viewer, 0, 84, 40);
                c.fillStyle = '#fff08c';
                fitText(c, cleanName(banner.viewer.username), 150, 18, 800);
                c.fillText(cleanName(banner.viewer.username), 0, 146);
                c.save();
                c.scale(pulse, pulse);
                c.fillStyle = '#7fe9ff';
                c.font = '900 34px Orbitron, Poppins, sans-serif';
                const value = banner.kind === 'win' ? `+${banner.reward}` : String(banner.viewer.stars);
                c.shadowColor = '#00f3ff';
                c.shadowBlur = 12;
                c.fillText(value, 0, 182);
                c.restore();
                c.fillStyle = '#ffd36b';
                c.font = '800 12px Poppins, sans-serif';
                c.fillText(banner.kind === 'win' ? '⭐ ÉTOILES' : '⭐ AU TOTAL', 0, 214);
            } else {
                const glow = 0.75 + Math.sin(time * 2.2) * 0.25;
                [['GRYPHON', 100, '#aef2ff', '#00d9ff'], ['AGENCY', 150, '#ff9ed0', '#ff4fa3']].forEach(([text, y, color, shadow]) => {
                    c.save();
                    c.font = '900 24px Orbitron, Poppins, sans-serif';
                    c.shadowColor = shadow;
                    c.shadowBlur = 16 * glow;
                    c.fillStyle = color;
                    c.fillText(text, 0, y);
                    c.shadowBlur = 0;
                    c.fillStyle = 'rgba(255,255,255,.55)';
                    c.fillText(text, 0, y - 1);
                    c.restore();
                });
            }
            c.restore();
        }

        function render(time) {
            const scale = Math.min(canvas.width / W, canvas.height / H);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#2a1158';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.setTransform(scale, 0, 0, scale, (canvas.width - W * scale) / 2, (canvas.height - H * scale) / 2);
            ctx.drawImage(scene, 0, 0);

            slots.forEach((slot, i) => {
                if (!slot.plush) return;
                const x = slotX(i), y = slotY(i);
                ctx.save();
                if (slot.state === 'falling') {
                    ctx.translate(x + slot.dx, y + slot.dy);
                    ctx.rotate(slot.rot);
                    ctx.globalAlpha = Math.max(0, 1 - slot.t / 1.1);
                } else {
                    ctx.translate(x + Math.sin(time * 1.1 + i * 1.7) * 9, y);
                    ctx.rotate(Math.sin(time * 1.1 + i * 1.7 + 1) * 0.04);
                    if (slot.state === 'spawning') {
                        const k = Math.min(1, slot.t / 0.4);
                        const pop = k < 1 ? 1 + Math.sin(k * Math.PI) * 0.15 : 1;
                        ctx.scale(k * pop, k * pop);
                    }
                    if (slot.wobble > 0) ctx.rotate(Math.sin(slot.wobble * 30) * 0.12 * (slot.wobble / 0.7));
                }
                ctx.scale(0.8, 0.8);
                drawBottle(ctx, defs[slot.plush.def]);
                ctx.restore();
            });

            balls.forEach(b => {
                if (b.out) {
                    drawAvatar(ctx, b.viewer, b.x, b.y, 16);
                    return;
                }
                const k = b.t / b.dur;
                const tx = slotX(b.slot), ty = slotY(b.slot) - 40;
                const x = 707 + (tx - 707) * k;
                const y = 540 + (ty - 540) * k - Math.sin(k * Math.PI) * 90;
                const r = 26 - 10 * k;
                ctx.save();
                ctx.shadowColor = '#00f3ff';
                ctx.shadowBlur = 14;
                drawAvatar(ctx, b.viewer, x, y, r);
                ctx.restore();
            });

            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
                ctx.fillStyle = p.c;
                if (p.star) {
                    ctx.font = '16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('★', p.x, p.y);
                } else {
                    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
                }
            });
            ctx.globalAlpha = 1;

            floaters.forEach(f => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, 1 - f.t / 1.6);
                ctx.textAlign = 'center';
                ctx.font = '900 30px Orbitron, Poppins, sans-serif';
                ctx.shadowColor = f.color;
                ctx.shadowBlur = 14;
                ctx.fillStyle = f.color;
                ctx.fillText(f.text, f.x, f.y - f.t * 50);
                ctx.restore();
            });

            drawBanner(ctx, time);

            if (!queue.length || (queueIndex >= queue.length && slots.every(s => !s.plush))) {
                ctx.fillStyle = 'rgba(15,5,40,.75)';
                ctx.fillRect(405, 230, 605, 90);
                neonText(ctx, 'TOUTES LES ÉTOILES SONT DISTRIBUÉES !', 707, 275, '#ffe600', 24, '#ff9a3c');
            }
        }

        function resize() {
            const ratio = window.devicePixelRatio || 1;
            canvas.width = Math.round(innerWidth * ratio);
            canvas.height = Math.round(innerHeight * ratio);
        }
        addEventListener('resize', resize);

        let last = performance.now();
        function frame(now) {
            const dt = Math.min(0.05, (now - last) / 1000);
            last = now;
            update(dt);
            render(now / 1000);
            requestAnimationFrame(frame);
        }

        /* ---------- TikTok ---------- */
        let socket = null;
        let reconnectTimer = null;

        function setStatus(message) { $('live-status').textContent = message; }

        function handleMessage(data) {
            if (data.type === 'STATUS') {
                setStatus(data.message || 'Statut TikTok reçu.');
            } else if (data.type === 'viewer') {
                const v = data.viewer || {};
                const viewer = getViewer(v.username || v.nickname);
                setAvatar(viewer, v.avatarDataUri || v.profilePictureUrl);
            } else if (data.type === 'gift' || data.type === 'tiktok-gift') {
                const gift = data.gift ?? data;
                const viewer = getViewer(gift.username || gift.nickname, gift.profilePictureUrl || gift.avatarDataUri);
                queueShots(viewer, Math.min(10, Math.max(1, Math.floor(Number(gift.repeatCount) || 1))));
            } else if (data.type === 'comment' || data.type === 'tiktok-comment' || data.type === 'chat') {
                const c = data.commentData ?? data;
                const viewer = getViewer(c.username || c.nickname, c.profilePictureUrl || c.avatarDataUri);
                if (/^\s*(?:!\s*)?(?:étoile|etoile|star|⭐)s?\s*$|^\s*\*\s*$/iu.test(String(c.comment ?? c.text ?? ''))) claimStars(viewer);
            } else if (data.type === 'join' || data.type === 'member') {
                const v = data.viewer ?? data.user ?? data;
                getViewer(v.username || v.nickname, v.profilePictureUrl || v.avatarDataUri);
            }
        }

        function connect() {
            const name = $('username').value.trim().replace(/^@/, '');
            const url = $('ws-url').value.trim();
            if (!name || !url) { setStatus('Pseudo TikTok et adresse requis.'); return; }
            clearTimeout(reconnectTimer);
            if (socket) { socket.onclose = null; socket.close(); }
            try { socket = new WebSocket(url); } catch (error) { setStatus('Adresse invalide.'); return; }
            const active = socket;
            setStatus(`Connexion au live de @${name}…`);
            active.addEventListener('open', () => active.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username: name })));
            active.addEventListener('message', event => {
                try { handleMessage(JSON.parse(event.data)); } catch (error) { console.warn('Message invalide', error); }
            });
            active.addEventListener('error', () => setStatus('Connexion impossible.'));
            active.addEventListener('close', () => {
                if (socket !== active) return;
                setStatus('Reconnexion…');
                reconnectTimer = setTimeout(connect, 3000);
            });
        }

        /* ---------- Sauvegarde ---------- */
        function snapshot() {
            return {
                settings,
                username: $('username').value,
                wsUrl: $('ws-url').value,
                queue,
                queueIndex,
                starsGiven,
                knocked,
                slots: slots.map(s => (s.plush && s.state !== 'falling' ? s.plush : null)),
                viewers: [...viewers.values()].map(v => ({ username: v.username, stars: v.stars }))
            };
        }

        function saveGame() {
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot()));
                showToast('💾 Partie enregistrée');
            } catch (error) {
                showToast('Enregistrement impossible sur cet appareil.');
            }
        }

        function exportGame() {
            const blob = new Blob([JSON.stringify(snapshot(), null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'bouteilles-colorees.json';
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function loadGame() {
            try {
                const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
                if (!saved || !Array.isArray(saved.queue)) return false;
                Object.assign(settings, saved.settings || {});
                queue = saved.queue;
                queueIndex = Math.min(queue.length, Math.max(0, saved.queueIndex | 0));
                starsGiven = saved.starsGiven | 0;
                knocked = saved.knocked | 0;
                (saved.viewers || []).forEach(v => {
                    if (v && typeof v.username === 'string') {
                        viewers.set(v.username.toLocaleLowerCase(), { username: v.username, stars: v.stars | 0, img: null });
                    }
                });
                slots.forEach((slot, i) => {
                    const plush = saved.slots?.[i];
                    if (plush && defs[plush.def]) Object.assign(slot, { plush, state: 'idle', t: 1 });
                });
                $('username').value = saved.username || '';
                if (saved.wsUrl) $('ws-url').value = saved.wsUrl;
                return true;
            } catch (error) {
                return false;
            }
        }

        /* ---------- Panneau flottant ---------- */
        const panel = $('panel');
        const panelState = { x: null, y: 16, hidden: false };

        function applyPanel() {
            panel.classList.toggle('hidden-panel', panelState.hidden);
            $('eye').textContent = panelState.hidden ? '🙈' : '👁';
            $('eye').setAttribute('aria-expanded', String(!panelState.hidden));
            panel.style.top = `${panelState.y}px`;
            if (panelState.x === null) {
                panel.style.left = 'auto';
                panel.style.right = '16px';
            } else {
                const maxX = Math.max(0, innerWidth - panel.offsetWidth);
                panelState.x = Math.min(Math.max(0, panelState.x), maxX);
                panel.style.left = `${panelState.x}px`;
                panel.style.right = 'auto';
            }
        }

        function savePanel() {
            try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(panelState)); } catch (error) { /* ignoré */ }
        }

        try {
            Object.assign(panelState, JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}'));
        } catch (error) { /* ignoré */ }

        let drag = null;
        $('panel-head').addEventListener('pointerdown', event => {
            if (event.target.closest('button') && !panelState.hidden) return;
            if (event.target === $('eye')) return;
            const rect = panel.getBoundingClientRect();
            drag = { id: event.pointerId, dx: event.clientX - rect.left, dy: event.clientY - rect.top };
            $('panel-head').setPointerCapture(event.pointerId);
            panel.classList.add('dragging');
        });
        $('panel-head').addEventListener('pointermove', event => {
            if (!drag || event.pointerId !== drag.id) return;
            panelState.x = event.clientX - drag.dx;
            panelState.y = Math.min(Math.max(0, event.clientY - drag.dy), innerHeight - 40);
            applyPanel();
        });
        const endDrag = () => { if (drag) { drag = null; panel.classList.remove('dragging'); savePanel(); } };
        $('panel-head').addEventListener('pointerup', endDrag);
        $('panel-head').addEventListener('pointercancel', endDrag);
        $('eye').addEventListener('click', () => {
            panelState.hidden = !panelState.hidden;
            applyPanel();
            savePanel();
        });
        addEventListener('resize', applyPanel);

        /* ---------- Contrôles ---------- */
        $('rtp').addEventListener('input', () => {
            settings.rtp = Number($('rtp').value);
            $('rtp-out').textContent = `${settings.rtp}%`;
        });
        $('star-min').addEventListener('change', () => { settings.min = Number($('star-min').value) || 1; });
        $('star-max').addEventListener('change', () => { settings.max = Number($('star-max').value) || 50; });
        $('reset-pool').addEventListener('click', () => {
            settings.min = Number($('star-min').value) || 1;
            settings.max = Number($('star-max').value) || 50;
            resetPool();
            showToast('Pool de 1000 ⭐ réinitialisé');
        });
        $('voice').addEventListener('click', enableVoice);
        $('connect').addEventListener('click', connect);
        $('save').addEventListener('click', saveGame);
        $('export').addEventListener('click', exportGame);
        const simViewer = () => getViewer($('sim-name').value || 'Spectateur');
        $('sim-gift').addEventListener('click', () => queueShots(simViewer(), 1));
        $('sim-burst').addEventListener('click', () => queueShots(simViewer(), 10));
        $('sim-join').addEventListener('click', () => {
            const name = $('sim-name').value || 'Spectateur';
            greeted.delete(name.trim().replace(/^@/, '').toLocaleLowerCase());
            getViewer(name);
        });
        $('sim-star').addEventListener('click', () => claimStars(simViewer()));
        if ('speechSynthesis' in window) speechSynthesis.getVoices();

        /* ---------- Démarrage ---------- */
        buildScene();
        if (!loadGame()) resetPool();
        $('rtp').value = settings.rtp;
        $('rtp-out').textContent = `${settings.rtp}%`;
        $('star-min').value = settings.min;
        $('star-max').value = settings.max;
        fillSlots(true);
        applyPanel();
        resize();
        (document.fonts?.ready ?? Promise.resolve()).then(() => { buildScene(); });
        requestAnimationFrame(frame);
    </script>
</body>
</html>
