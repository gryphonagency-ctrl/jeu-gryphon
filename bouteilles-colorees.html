<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Le Jeu des Bouteilles Colorées — TikTok Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; overflow: hidden; background: #2a1158; font-family: Poppins, system-ui, sans-serif; color: #f5f0ff; user-select: none; }
        #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
        .panel { position: fixed; z-index: 10; top: 16px; right: 16px; width: 290px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,.2); border-radius: 14px; background: rgba(15,6,38,.94); box-shadow: 0 14px 40px rgba(0,0,0,.5); }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 11px; border-bottom: 1px solid rgba(255,255,255,.14); font: 900 11px Orbitron, sans-serif; letter-spacing: .06em; cursor: grab; touch-action: none; }
        .panel.dragging .panel-head { cursor: grabbing; }
        .eye { width: 32px; height: 28px; border: 1px solid rgba(0,243,255,.5); border-radius: 8px; background: rgba(0,70,92,.4); color: #9dfaff; font-size: 16px; cursor: pointer; }
        .panel-body { overflow-y: auto; padding: 11px; display: grid; gap: 10px; }
        .panel.hidden-panel { width: auto; background: rgba(15,6,38,.35); opacity: .4; border-color: transparent; box-shadow: none; }
        .panel.hidden-panel:hover { opacity: 1; }
        .panel.hidden-panel .panel-head { padding: 4px; border: 0; }
        .panel.hidden-panel .panel-title, .panel.hidden-panel .panel-body { display: none; }
        .queue-detached { position: fixed; z-index: 12; top: 16px; left: 16px; width: 240px; }
        .queue-detached .queue-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .queue-detached #queue-status { margin: 0; font-size: 11px; color: #cfc6ee; overflow-wrap: anywhere; }
        .box { display: grid; gap: 6px; padding: 9px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; background: rgba(255,255,255,.04); }
        .box h3 { margin: 0; color: #ffd36b; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
        .row { display: flex; gap: 6px; }
        .row > * { flex: 1; min-width: 0; }
        label { display: flex; justify-content: space-between; font-size: 11px; color: #cfc6ee; }
        input[type=text], input[type=number], input[type=url] { width: 100%; padding: 6px 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; background: rgba(0,0,0,.35); color: #fff; font: inherit; font-size: 12px; user-select: text; }
        input[type=range] { width: 100%; accent-color: #ff4fa3; }
        button.btn { min-height: 34px; padding: 6px 8px; border: 1px solid rgba(255,255,255,.25); border-radius: 9px; background: linear-gradient(135deg, #d6226f, #7b1fd1); color: #fff; font: 700 12px Poppins, sans-serif; cursor: pointer; }
        button.btn.alt { background: rgba(0,70,92,.7); border-color: #00f3ff; color: #aafaff; }
        button.btn.danger { background: #5a1b2b; border-color: #ff8d87; }
        button.btn:hover { filter: brightness(1.15); }
        .status { margin: 0; font-size: 11px; color: #b7ffcf; min-height: 15px; }
        .toast { position: fixed; z-index: 9; left: 16px; bottom: 16px; max-width: 70vw; padding: 8px 14px; border: 1px solid rgba(192,132,252,.6); border-radius: 12px; background: rgba(40,12,85,.88); font-size: 14px; opacity: 0; transform: translateY(14px); transition: .25s; pointer-events: none; }
        .toast.show { opacity: 1; transform: none; }
    </style>
</head>
<body>
    <canvas id="game" aria-label="Stand du jeu des bouteilles colorées"></canvas>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <aside id="panel" class="panel" aria-label="Panneau de contrôle du streamer">
        <header id="panel-head" class="panel-head">
            <span class="panel-title">PANNEAU DE CONTRÔLE</span>
            <button id="eye" class="eye" type="button" aria-expanded="true" title="Masquer / afficher le panneau" aria-label="Masquer le panneau">👁</button>
        </header>
        <div id="panel-body" class="panel-body">
            <section class="box">

                <h3>Connexion TikTok</h3>
                <input id="username" type="text" maxlength="32" placeholder="Pseudo TikTok" autocomplete="off">
                <input id="ws-url" type="hidden" value="wss://jeu6boite.onrender.com" aria-label="Adresse WebSocket">
                <button id="connect" class="btn" type="button">Connecter le live</button>
                <p id="live-status" class="status" role="status"></p>
            </section>
            <section class="box">
                <h3>Chance de touche (RTP)</h3>
                <label for="rtp">Probabilité <output id="rtp-out">85%</output></label>
                <input id="rtp" type="range" min="10" max="100" value="85">
                <label for="speed">Vitesse <output id="speed-out">100%</output></label>
                <input id="speed" type="range" min="50" max="200" value="100">
            </section>
            <section id="queue-box" class="box">
                <div class="queue-head"><h3>File des tirs</h3><button id="queue-detach" class="btn alt" type="button">Détacher</button></div>
                <p id="queue-status" role="status">Aucun tir en attente</p>
            </section>
            <section class="box">
                <h3>Éditeur de récompenses ✏️</h3>
                <div class="row">
                    <label>Min<input id="star-min" type="number" min="1" max="50" value="1"></label>
                    <label>Max<input id="star-max" type="number" min="1" max="50" value="50"></label>
                </div>
                <button id="reset-pool" class="btn danger" type="button">Réinitialiser 1000 ⭐</button>
            </section>
            <section class="box">
                <h3>Voix IA</h3>
                <button id="voice" class="btn alt" type="button" aria-pressed="false">🔇 Activer l'accueil vocal</button>
            </section>
            <section class="box">
                <h3>Sons du live</h3>
                <label for="effects-sound">Activer les effets sonores <input id="effects-sound" type="checkbox" checked></label>
                <label for="effects-volume">Volume <output id="effects-volume-out">70%</output></label>
                <input id="effects-volume" type="range" min="0" max="100" value="70">
            </section>
            <section class="box">
                <h3>Simulateur</h3>
                <input id="sim-name" type="text" value="Alex_TikTok 🚀" aria-label="Pseudo simulé">
                <div class="row">
                    <button id="sim-gift" class="btn" type="button">🎁 Tir cadeau</button>
                    <button id="sim-burst" class="btn" type="button">💥 Rafale ×10</button>
                </div>
                <div class="row">
                    <button id="sim-join" class="btn alt" type="button">👋 Arrivée</button>
                    <button id="sim-star" class="btn alt" type="button">!étoile</button>
                </div>
                <div class="row">
                    <button id="sim-big-gift" class="btn" type="button">🎆 Gros cadeau</button>
                    <button id="sim-share" class="btn alt" type="button">✈️ Partage</button>
                </div>
            </section>
            <section class="box">
                <h3>Partie</h3>
                <div data-save-key="bouteilles-colorees-save"></div>
            </section>
        </div>
    </aside>

    <script>
        'use strict';

        const W = 1408, H = 768;
        const SLOT_COUNT = 10;
        const TOTAL_STARS = 1000;
        const SAVE_KEY = 'bouteilles-colorees-save';
        const LAYOUT_KEY = 'bouteilles-colorees-panel';
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const $ = id => document.getElementById(id);

        const defs = [
            { kind: 'wine', c1: '#d63a3a', c2: '#ff9a9a', label: 'band' },
            { kind: 'soda', c1: '#ff4fa3', c2: '#ffb3d6', label: 'wrap' },
            { kind: 'flask', c1: '#2fc4f0', c2: '#aeeaff', label: 'badge' },
            { kind: 'beer', c1: '#ffb62e', c2: '#ffe08a', label: 'band' },
            { kind: 'champagne', c1: '#6bd44a', c2: '#c3f2a8', label: 'badge' },
            { kind: 'carafe', c1: '#a45cf0', c2: '#d6b3ff', label: 'diag' },
            { kind: 'soda', c1: '#ff7a2e', c2: '#ffc79a', label: 'wrap' },
            { kind: 'tall', c1: '#3dd6b0', c2: '#aef2e0', label: 'band' },
            { kind: 'wine', c1: '#4a7bff', c2: '#a9c0ff', label: 'diag' },
            { kind: 'beer', c1: '#ffe600', c2: '#fff6a0', label: 'badge' }];

        const settings = { rtp: 85, min: 1, max: 50, speed: 100 };
        let queue = [];
        let queueIndex = 0;
        let starsGiven = 0;
        let knocked = 0;
        const slots = Array.from({ length: SLOT_COUNT }, () => ({ state: 'empty', plush: null, t: 0, wobble: 0 }));
        const viewers = new Map();
        const greeted = new Set();
        const balls = [];
        const particles = [];
        const floaters = [];
        const pendingShots = [];
        let shotTimer = 0;
        let banner = null;

        function rand(seed) {
            let s = seed;
            return () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
        }

        function slotX(i) { return 707 + ((i % 5) - 2) * 112; }
        function slotY(i) { return i < 5 ? 320 : 430; }

        /* ---------- Pool de bouteilles ---------- */
        function buildPool() {
            const lo = Math.max(1, Math.min(50, Math.floor(settings.min) || 1));
            const hi = Math.max(lo, Math.min(50, Math.floor(settings.max) || 50));
            const list = [];
            let left = TOTAL_STARS;
            while (left > 0) {
                const value = Math.min(left, lo + Math.floor(Math.pow(Math.random(), 2.2) * (hi - lo + 1)));
                list.push({ reward: value, def: Math.floor(Math.random() * defs.length) });
                left -= value;
            }
            return list;
        }

        function resetPool() {
            queue = buildPool();
            queueIndex = 0;
            starsGiven = 0;
            knocked = 0;
            viewers.forEach(v => { v.stars = 0; });
            balls.length = 0;
            pendingShots.length = 0;
            slots.forEach(slot => Object.assign(slot, { state: 'empty', plush: null, t: 0, wobble: 0 }));
            fillSlots(true);
            renderQueue();
            banner = null;
        }

        function spawnInto(slot, instant) {
            if (queueIndex >= queue.length) return false;
            slot.plush = queue[queueIndex++];
            slot.state = 'spawning';
            slot.t = instant ? 0.4 : 0;
            slot.wobble = 0;
            return true;
        }

        function fillSlots(instant) {
            slots.forEach(slot => { if (slot.state === 'empty') spawnInto(slot, instant); });
        }

        function remainingBottles() {
            return (queue.length - queueIndex) + slots.filter(s => s.plush && s.state !== 'falling').length;
        }

        /* ---------- Spectateurs ---------- */
        function safeUrl(url) {
            return typeof url === 'string' && /^(https?:|data:image\/)/i.test(url) ? url : '';
        }

        function getViewer(rawName, avatarUrl) {
            const username = String(rawName || 'Spectateur').trim().replace(/^@/, '') || 'Spectateur';
            const key = username.toLocaleLowerCase();
            let viewer = viewers.get(key);
            if (!viewer) {
                viewer = { username, stars: 0, img: null };
                viewers.set(key, viewer);
            }
            setAvatar(viewer, avatarUrl);
            welcome(viewer);
            return viewer;
        }

        function setAvatar(viewer, url) {
            const src = safeUrl(url);
            if (!src || viewer.src === src) return;
            viewer.src = src;
            const img = new Image();
            img.referrerPolicy = 'no-referrer';
            img.onload = () => { viewer.img = img; };
            img.src = src;
        }

        /* ---------- Voix IA ---------- */
        let voiceOn = false;
        const speechQueue = [];

        function cleanName(name) {
            const cleaned = String(name)
                .replace(/[\p{Extended_Pictographic}\p{Regional_Indicator}\u200d\ufe0f\u20e3\u{1F3FB}-\u{1F3FF}]/gu, '')
                .replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ').trim();
            return cleaned || 'nouveau spectateur';
        }

        function say(text) {
            if (!voiceOn || !('speechSynthesis' in window)) return;
            speechQueue.push(text);
            if (speechQueue.length > 4) speechQueue.shift();
            if (!speechSynthesis.speaking) nextSpeech();
        }

        function nextSpeech() {
            const text = speechQueue.shift();
            if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith('fr'));
            if (voice) utterance.voice = voice;
            utterance.onend = nextSpeech;
            utterance.onerror = nextSpeech;
            speechSynthesis.resume();
            speechSynthesis.speak(utterance);
        }

        function welcome(viewer) {
            const key = viewer.username.toLocaleLowerCase();
            if (greeted.has(key)) return;
            greeted.add(key);
            const spoken = cleanName(viewer.username);
            showToast(`🎙️ Bienvenue ${spoken} !`);
            say(`Bienvenue ${spoken}`);
        }

        function enableVoice() {
            if (!('speechSynthesis' in window)) {
                showToast('Synthèse vocale indisponible dans ce navigateur.');
                return;
            }
            voiceOn = true;
            $('voice').textContent = '🔊 Accueil vocal activé';
            $('voice').setAttribute('aria-pressed', 'true');
            say('Accueil vocal activé');
        }

        let toastTimer = null;
        function showToast(message) {
            const toast = $('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        /* ---------- Tirs ---------- */
        function renderQueue() {
            const names = pendingShots.slice(0, 4).map(shot => cleanName(shot.viewer.username));
            const remainder = pendingShots.length > names.length ? ` +${pendingShots.length - names.length}` : '';
            $('queue-status').textContent = pendingShots.length
                ? `${pendingShots.length} tir${pendingShots.length > 1 ? 's' : ''} en attente : ${names.join(', ')}${remainder}`
                : 'Aucun tir en attente';
        }

        function queueShots(viewer, count, simulated) {
            for (let i = 0; i < count; i++) pendingShots.push({ viewer, simulated: Boolean(simulated) });
            renderQueue();
        }

        function launchShot(shot) {
            const idle = slots.map((s, i) => ({ s, i })).filter(o => o.s.state === 'idle');
            if (!idle.length) return false;
            const free = idle.filter(o => !o.s.targeted);
            const pick = (free.length ? free : idle)[Math.floor(Math.random() * (free.length || idle.length))];
            pick.s.targeted = true;
            balls.push({ ...shot, slot: pick.i, plush: pick.s.plush, t: 0, dur: 0.85, x: 707, y: 540 });
            return true;
        }

        function resolveShot(ball) {
            const slot = slots[ball.slot];
            const x = slotX(ball.slot), y = slotY(ball.slot) - 40;
            slot.targeted = false;
            const valid = slot.state === 'idle' && slot.plush === ball.plush;
            if (valid && Math.random() * 100 < settings.rtp) {
                const reward = slot.plush.reward;
                ball.viewer.stars += reward;
                if (!ball.simulated) {
                    const award = window.ArcadeStars?.award;
                    if (typeof award !== 'function') {
                        console.error('Le portefeuille ArcadeStars est indisponible.');
                        showToast('Impossible de créditer le portefeuille : service indisponible.');
                    } else {
                        Promise.resolve(award.call(window.ArcadeStars, { username: ball.viewer.username, amount: reward }))
                            .catch(error => {
                                console.error('Étoiles non créditées :', error);
                                showToast(`Erreur de crédit pour ${cleanName(ball.viewer.username)}.`);
                            });
                    }
                }
                starsGiven += reward;
                knocked += 1;
                slot.state = 'falling';
                slot.t = 0;
                slot.vx = (Math.random() - 0.5) * 260;
                slot.vy = -320;
                slot.dy = 0;
                slot.dx = 0;
                slot.rot = 0;
                burst(x, y, 36);
                floaters.push({ text: `${reward} ⭐`, x, y: y - 40, t: 0, color: '#fff08c' });
                banner = { viewer: ball.viewer, kind: 'win', reward, until: performance.now() + 7000 };
                say(`${cleanName(ball.viewer.username)} gagne ${reward} étoile${reward > 1 ? 's' : ''}`);
            } else {
                if (valid) slot.wobble = 0.7;
                floaters.push({ text: 'RATÉ !', x, y: y - 20, t: 0, color: '#ff9bc9' });
                balls.push({ viewer: ball.viewer, out: true, t: 0, x, y, vx: (Math.random() - 0.5) * 500, vy: -260 });
            }
        }

        function burst(x, y, n) {
            const colors = ['#ffe600', '#ff4fa3', '#00f3ff', '#7cff6b', '#ffffff', '#ff9a3c'];
            for (let i = 0; i < n; i++) {
                const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 380;
                particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, t: 0, life: 0.8 + Math.random() * 0.7, c: colors[i % colors.length], star: i % 3 === 0 });
            }
        }

        function claimStars(viewer) {
            banner = { viewer, kind: 'total', until: performance.now() + 6000 };
            say(`${cleanName(viewer.username)}, tu as ${viewer.stars} étoile${viewer.stars > 1 ? 's' : ''}`);
        }

        /* ---------- Mise à jour ---------- */
        function update(dt) {
            shotTimer -= dt;
            if (pendingShots.length && shotTimer <= 0) {
                if (launchShot(pendingShots[0])) {
                    pendingShots.shift();
                    renderQueue();
                    shotTimer = 0.4;
                } else { shotTimer = 0.3; }
            }
            slots.forEach((slot, i) => {
                slot.t += dt;
                if (slot.state === 'spawning' && slot.t >= 0.4) slot.state = 'idle';
                if (slot.wobble > 0) slot.wobble = Math.max(0, slot.wobble - dt);
                if (slot.state === 'falling') {
                    slot.vy += 1500 * dt;
                    slot.dx += slot.vx * dt;
                    slot.dy += slot.vy * dt;
                    slot.rot += dt * 6;
                    if (slot.t > 1.1) {
                        slot.state = 'empty';
                        slot.plush = null;
                        spawnInto(slot, false);
                    }
                } else if (slot.state === 'empty') {
                    spawnInto(slot, false);
                }
            });
            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];
                b.t += dt;
                if (b.out) {
                    b.vy += 1400 * dt;
                    b.x += b.vx * dt;
                    b.y += b.vy * dt;
                    if (b.t > 1.2) balls.splice(i, 1);
                } else if (b.t >= b.dur) {
                    resolveShot(b);
                    balls.splice(i, 1);
                }
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.t += dt;
                p.vy += 700 * dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                if (p.t > p.life) particles.splice(i, 1);
            }
            for (let i = floaters.length - 1; i >= 0; i--) {
                floaters[i].t += dt;
                if (floaters[i].t > 1.6) floaters.splice(i, 1);
            }
            if (banner && performance.now() > banner.until) banner = null;
        }

        /* ---------- Dessin des bouteilles ---------- */
        function ell(c, x, y, rx, ry, fill) {
            c.beginPath();
            c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
            c.fillStyle = fill;
            c.fill();
        }

        function tri(c, x1, y1, x2, y2, x3, y3, fill) {
            c.beginPath();
            c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineTo(x3, y3);
            c.closePath();
            c.fillStyle = fill;
            c.fill();
        }

        /* Profils (y, demi-largeur) du bas vers le haut, pour chaque style de bouteille */
        const BOTTLES = {
            wine: { pts: [[0, 19], [-1.5, 23], [-4, 25], [-62, 25], [-72, 24], [-82, 18], [-90, 11], [-97, 7.8], [-112, 7.2], [-119, 7.8], [-121, 9.4], [-125, 9.4]], level: -104, label: [-58, -22], fizz: false, punt: true },
            champagne: { pts: [[0, 22], [-1.5, 26], [-4, 28.5], [-60, 29], [-68, 28], [-80, 22], [-92, 14], [-103, 10.5], [-117, 9.8], [-121, 11.2], [-124, 11.2]], level: -98, label: [-60, -24], fizz: true, punt: true },
            soda: { pts: [[0, 17], [-1.5, 20], [-4, 22], [-14, 24], [-26, 22], [-36, 17.5], [-46, 18.5], [-60, 23], [-76, 25], [-88, 22], [-96, 14], [-104, 8.5], [-112, 8.2], [-115, 9.8], [-117, 9.8]], level: -92, label: [-74, -20], fizz: true },
            beer: { pts: [[0, 17], [-1.5, 20.5], [-4, 22], [-58, 22], [-68, 21.4], [-80, 17], [-92, 10], [-100, 8.2], [-122, 7.8], [-126, 9.2], [-128, 9.2]], level: -100, label: [-56, -18], fizz: true, neckLabel: [-114, -100] },
            flask: { pts: [[0, 13], [-2, 20], [-7, 28], [-16, 33.5], [-30, 36], [-44, 34.5], [-56, 29], [-65, 21], [-71, 13], [-77, 8.6], [-92, 8], [-96, 9.6], [-99, 9.6]], level: -54, label: [-46, -14], fizz: false },
            carafe: { pts: [[0, 27], [-2, 31], [-6, 33], [-24, 33], [-42, 29], [-58, 20], [-68, 12], [-80, 8.5], [-96, 8.8], [-104, 12], [-108, 13.2], [-110, 13.2]], level: -66, label: [-52, -12], fizz: false },
            tall: { pts: [[0, 17], [-1.5, 19.5], [-4, 20.5], [-86, 20.5], [-90, 20], [-96, 15], [-101, 9.5], [-104, 8.5], [-108, 8.5]], level: -90, label: [-70, -26], fizz: false, facets: true }
        };

        const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
        function shade(h, amt, alpha = 1) {
            const [r, g, b] = hexRgb(h), t = amt < 0 ? 0 : 255, k = Math.abs(amt);
            return `rgba(${Math.round(r + (t - r) * k)},${Math.round(g + (t - g) * k)},${Math.round(b + (t - b) * k)},${alpha})`;
        }

        function smoothProfile(pts) {
            const out = [], P = [pts[0], ...pts, pts[pts.length - 1]];
            for (let i = 1; i < P.length - 2; i++) {
                const p0 = P[i - 1], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
                for (let s = 0; s < 8; s++) {
                    const t = s / 8, t2 = t * t, t3 = t2 * t;
                    const f = k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
                    out.push([Math.min(0, f(0)), Math.max(1, f(1))]);
                }
            }
            out.push(pts[pts.length - 1].slice());
            return out;
        }

        function widthAt(dense, y) {
            if (y >= dense[0][0]) return dense[0][1];
            for (let i = 1; i < dense.length; i++) {
                if (y >= dense[i][0]) {
                    const a = dense[i - 1], b = dense[i], t = (y - a[0]) / ((b[0] - a[0]) || 1);
                    return a[1] + (b[1] - a[1]) * t;
                }
            }
            return dense[dense.length - 1][1];
        }

        function starAt(g, x, y, R, fill) {
            g.beginPath();
            for (let i = 0; i < 10; i++) {
                const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * 0.45 : R;
                g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
            }
            g.closePath(); g.fillStyle = fill; g.fill();
        }

        function metalGradient(g, x0, x1, base) {
            const m = g.createLinearGradient(x0, 0, x1, 0);
            m.addColorStop(0, shade(base, -0.55)); m.addColorStop(0.25, shade(base, 0.45));
            m.addColorStop(0.5, shade(base, 0.1)); m.addColorStop(0.8, shade(base, -0.4)); m.addColorStop(1, shade(base, -0.65));
            return m;
        }

        function drawLabel(g, def, S, dense) {
            const [y1, y2] = S.label, mid = (y1 + y2) / 2, hgt = y2 - y1, c1 = def.c1;
            const paper = g.createLinearGradient(0, y1, 0, y2);
            paper.addColorStop(0, '#fffaf0'); paper.addColorStop(1, '#eddcb8');
            g.save();
            if (def.label === 'band') {
                g.fillStyle = paper; g.fillRect(-40, y1, 80, hgt);
                g.fillStyle = shade(c1, -0.4); g.fillRect(-40, y1 + 2.2, 80, 2.4); g.fillRect(-40, y2 - 4.6, 80, 2.4);
                starAt(g, 0, mid - 1, Math.min(7, hgt * 0.24), shade(c1, -0.15));
                g.fillStyle = 'rgba(60,35,20,.55)'; g.fillRect(-9, mid + hgt * 0.2, 18, 1.5); g.fillRect(-6, mid + hgt * 0.2 + 3.4, 12, 1.2);
            } else if (def.label === 'badge') {
                g.fillStyle = paper; g.fillRect(-40, y1, 80, hgt);
                g.fillStyle = shade(c1, -0.35); g.fillRect(-40, y1, 80, 2.2); g.fillRect(-40, y2 - 2.2, 80, 2.2);
                const R = Math.min(hgt * 0.34, 12);
                g.beginPath(); g.arc(0, mid, R, 0, 7); g.fillStyle = shade(c1, -0.1); g.fill();
                g.lineWidth = 1.4; g.strokeStyle = '#ffd36b'; g.stroke();
                starAt(g, 0, mid, R * 0.68, '#fff6d6');
            } else if (def.label === 'diag') {
                g.fillStyle = shade(c1, -0.35); g.fillRect(-40, y1, 80, hgt);
                for (let i = -6; i < 8; i++) {
                    g.beginPath(); g.moveTo(i * 12, y2); g.lineTo(i * 12 + 7, y2); g.lineTo(i * 12 + 7 + hgt * 0.7, y1); g.lineTo(i * 12 + hgt * 0.7, y1); g.closePath();
                    g.fillStyle = i % 2 ? 'rgba(255,255,255,.88)' : shade(c1, 0.15); g.fill();
                }
                g.fillStyle = '#ffd36b'; g.fillRect(-40, y1, 80, 1.8); g.fillRect(-40, y2 - 1.8, 80, 1.8);
            } else {
                // étiquette plastique enveloppante
                g.fillStyle = shade(c1, -0.05); g.fillRect(-40, y1, 80, hgt);
                g.beginPath(); g.moveTo(-40, mid + 4);
                for (let x = -40; x <= 40; x += 4) g.lineTo(x, mid + Math.sin(x * 0.17) * 5 + 4);
                g.lineTo(40, y2); g.lineTo(-40, y2); g.closePath(); g.fillStyle = 'rgba(255,255,255,.9)'; g.fill();
                g.beginPath(); g.moveTo(-40, mid - 6);
                for (let x = -40; x <= 40; x += 4) g.lineTo(x, mid - 6 + Math.sin(x * 0.17) * 5);
                g.lineWidth = 2.2; g.strokeStyle = shade(c1, 0.5); g.stroke();
                starAt(g, 0, mid - 12, 7, '#fff6d6');
            }
            // légères fibres de papier
            g.globalAlpha = 0.07; g.fillStyle = '#000';
            for (let i = 0; i < 26; i++) g.fillRect(-30 + ((i * 37) % 60), y1 + ((i * 53) % Math.max(1, Math.floor(hgt))), 2.5, 0.7);
            g.restore();
        }

        function drawCap(g, def, S, dense) {
            const top = S.pts[S.pts.length - 1][0], c1 = def.c1, hw = S.pts[S.pts.length - 1][1];
            const kind = def.kind;
            if (kind === 'soda' || kind === 'beer') {
                const w = hw + 3.4, y0 = top - 1, base = kind === 'soda' ? '#ffd36b' : '#d9a21a';
                g.beginPath(); g.moveTo(-w + 1, y0 - 7); g.quadraticCurveTo(0, y0 - 9.5, w - 1, y0 - 7);
                for (let i = 0; i <= 12; i++) g.lineTo(w - i * (2 * w / 12), y0 + (i % 2 ? 0 : 2.4));
                g.closePath();
                g.fillStyle = metalGradient(g, -w, w, base); g.fill();
                g.lineWidth = 1; g.strokeStyle = 'rgba(40,20,0,.6)'; g.stroke();
                g.strokeStyle = 'rgba(80,40,0,.35)'; g.lineWidth = 0.7;
                for (let i = 1; i < 12; i++) { g.beginPath(); g.moveTo(-w + i * (2 * w / 12), y0 - 6); g.lineTo(-w + i * (2 * w / 12), y0 + (i % 2 ? 0 : 1.5)); g.stroke(); }
                g.fillStyle = 'rgba(255,255,255,.6)'; g.fillRect(-w + 3, y0 - 6.8, w * 0.8, 1.3);
            } else if (kind === 'wine') {
                // capsule en feuille
                const foil = [];
                for (const d of dense) if (d[0] <= top + 27) foil.push(d);
                g.beginPath(); g.moveTo(-foil[0][1] - 1.4, foil[0][0]);
                for (const d of foil) g.lineTo(-d[1] - 1.4, d[0]);
                g.lineTo(foil[foil.length - 1][1] + 1.4, foil[foil.length - 1][0]);
                for (let i = foil.length - 1; i >= 0; i--) g.lineTo(foil[i][1] + 1.4, foil[i][0]);
                g.closePath();
                g.fillStyle = metalGradient(g, -hw - 2, hw + 2, shade(c1, -0.35).replace(/rgba\((\d+),(\d+),(\d+),1\)/, (m, r, gg, b) => '#' + [r, gg, b].map(v => (+v).toString(16).padStart(2, '0')).join('')));
                g.fill(); g.lineWidth = 1; g.strokeStyle = 'rgba(0,0,0,.5)'; g.stroke();
                g.beginPath(); g.ellipse(0, top - 0.6, hw + 1.4, 2.6, 0, 0, 7); g.fillStyle = shade(c1, -0.2); g.fill(); g.stroke();
                g.fillStyle = 'rgba(255,255,255,.45)'; g.fillRect(-hw + 1.5, top + 3, 1.8, 20);
            } else if (kind === 'champagne') {
                const foil = [];
                for (const d of dense) if (d[0] <= -88) foil.push(d);
                g.beginPath(); g.moveTo(-foil[0][1] - 1.6, foil[0][0]);
                for (const d of foil) g.lineTo(-d[1] - 1.6, d[0]);
                g.quadraticCurveTo(-hw - 4, top - 6, 0, top - 8.5); g.quadraticCurveTo(hw + 4, top - 6, foil[foil.length - 1][1] + 1.6, foil[foil.length - 1][0]);
                for (let i = foil.length - 1; i >= 0; i--) g.lineTo(foil[i][1] + 1.6, foil[i][0]);
                g.closePath();
                g.fillStyle = metalGradient(g, -hw - 3, hw + 3, '#e6b93c'); g.fill();
                g.lineWidth = 1; g.strokeStyle = 'rgba(70,40,0,.6)'; g.stroke();
                // muselet (cage métallique)
                g.strokeStyle = 'rgba(70,70,80,.85)'; g.lineWidth = 1.1;
                for (const yy of [-104, -112, -120]) { g.beginPath(); g.moveTo(-widthAt(dense, yy) - 1.7, yy); g.lineTo(widthAt(dense, yy) + 1.7, yy); g.stroke(); }
                g.beginPath(); g.moveTo(-hw, top + 1); g.quadraticCurveTo(-hw - 2, top - 6, 0, top - 6); g.quadraticCurveTo(hw + 2, top - 6, hw, top + 1); g.stroke();
                g.beginPath(); g.moveTo(0, top - 6); g.lineTo(0, -92); g.stroke();
                g.beginPath(); g.arc(0, -92.5, 2.4, 0, 7); g.stroke();
                g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect(-hw + 1.5, top + 4, 1.6, 22);
            } else if (kind === 'flask') {
                const y0 = top + 1, y1 = y0 - 15;
                g.beginPath(); g.moveTo(-hw - 0.4, y0); g.lineTo(-hw - 2.8, y1); g.quadraticCurveTo(0, y1 - 3, hw + 2.8, y1); g.lineTo(hw + 0.4, y0); g.closePath();
                const cg = g.createLinearGradient(-hw - 3, 0, hw + 3, 0);
                cg.addColorStop(0, '#6b4220'); cg.addColorStop(0.3, '#c8935a'); cg.addColorStop(0.6, '#a8713c'); cg.addColorStop(1, '#5a3517');
                g.fillStyle = cg; g.fill(); g.lineWidth = 1; g.strokeStyle = 'rgba(30,15,0,.65)'; g.stroke();
                g.fillStyle = 'rgba(50,25,5,.35)';
                for (let i = 0; i < 14; i++) g.fillRect(-hw + ((i * 29) % (hw * 2)), y1 + 2 + ((i * 17) % 11), 1.6, 0.8);
                g.fillStyle = 'rgba(255,230,190,.4)'; g.fillRect(-hw, y1 + 1, 1.8, 12);
            } else if (kind === 'carafe') {
                const cy = top - 8, R = 11.5;
                const gr = g.createRadialGradient(-R * 0.4, cy - R * 0.4, 1, 0, cy, R);
                gr.addColorStop(0, shade(c1, 0.7, 0.95)); gr.addColorStop(0.55, shade(c1, -0.05, 0.92)); gr.addColorStop(1, shade(c1, -0.6, 0.95));
                g.beginPath(); g.arc(0, cy, R, 0, 7); g.fillStyle = gr; g.fill();
                g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,.5)'; g.stroke();
                g.beginPath(); g.ellipse(-R * 0.35, cy - R * 0.4, 3.2, 1.8, -0.6, 0, 7); g.fillStyle = 'rgba(255,255,255,.85)'; g.fill();
                g.beginPath(); g.moveTo(-hw * 0.7, top); g.lineTo(-4, top - 3.5); g.lineTo(4, top - 3.5); g.lineTo(hw * 0.7, top); g.closePath(); g.fillStyle = shade(c1, -0.3, 0.95); g.fill();
            } else {
                // bouchon à vis en métal
                const y0 = top + 1, y1 = y0 - 20, w = hw + 2.2;
                g.beginPath(); g.moveTo(-w, y0); g.lineTo(-w, y1 + 3); g.quadraticCurveTo(-w, y1, -w + 3, y1); g.lineTo(w - 3, y1); g.quadraticCurveTo(w, y1, w, y1 + 3); g.lineTo(w, y0); g.closePath();
                g.fillStyle = metalGradient(g, -w, w, '#e9c24a'); g.fill();
                g.lineWidth = 1; g.strokeStyle = 'rgba(60,35,0,.65)'; g.stroke();
                g.strokeStyle = 'rgba(70,40,0,.4)'; g.lineWidth = 0.7;
                for (let i = 1; i < 10; i++) { g.beginPath(); g.moveTo(-w + i * (2 * w / 10), y1 + 2); g.lineTo(-w + i * (2 * w / 10), y0 - 6); g.stroke(); }
                g.fillStyle = shade(c1, -0.25); g.fillRect(-w, y0 - 5, w * 2, 5);
                g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(-w + 1.8, y1 + 2, 1.8, 13);
            }
        }

        function buildBottleSprite(def) {
            const S = BOTTLES[def.kind], k = 4, w = 110, h = 170, ox = 55, oy = 152;
            const cv = document.createElement('canvas');
            cv.width = w * k; cv.height = h * k;
            const g = cv.getContext('2d');
            g.setTransform(k, 0, 0, k, ox * k, oy * k);
            const dense = smoothProfile(S.pts);
            const top = S.pts[S.pts.length - 1][0];
            const maxW = Math.max(...dense.map(d => d[1]));
            const { c1, c2 } = def;
            g.lineJoin = 'round';
            const body = () => {
                g.beginPath(); g.moveTo(-dense[0][1], dense[0][0]);
                for (const d of dense) g.lineTo(-d[1], d[0]);
                const t = dense[dense.length - 1]; g.lineTo(t[1], t[0]);
                for (let i = dense.length - 1; i >= 0; i--) g.lineTo(dense[i][1], dense[i][0]);
                g.closePath();
            };
            // ombre portée
            const sh = g.createRadialGradient(0, 1, 2, 0, 1, maxW + 10);
            sh.addColorStop(0, 'rgba(0,0,0,.5)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
            g.save(); g.translate(4, 0); g.scale(1, 0.22); g.fillStyle = sh; g.beginPath(); g.arc(0, 4, maxW + 10, 0, 7); g.fill(); g.restore();

            // verre coloré, plus sombre sur les bords (épaisseur)
            g.save(); body(); g.clip();
            const glass = g.createLinearGradient(-maxW, 0, maxW, 0);
            glass.addColorStop(0, shade(c1, -0.62, 0.97)); glass.addColorStop(0.14, shade(c1, -0.3, 0.93));
            glass.addColorStop(0.42, shade(c1, 0.22, 0.88)); glass.addColorStop(0.75, shade(c1, -0.12, 0.92)); glass.addColorStop(1, shade(c1, -0.6, 0.97));
            g.fillStyle = glass; g.fillRect(-maxW - 2, top - 4, maxW * 2 + 4, -top + 8);
            g.fillStyle = 'rgba(255,255,255,.1)'; g.fillRect(-maxW - 2, top - 4, maxW * 2 + 4, S.level - top + 4);

            // liquide
            const liq = g.createLinearGradient(-maxW, 0, maxW, 0);
            liq.addColorStop(0, shade(c1, -0.35, 0.97)); liq.addColorStop(0.3, shade(c1, 0.05, 0.97));
            liq.addColorStop(0.5, shade(c2, 0.05, 0.97)); liq.addColorStop(0.8, shade(c1, -0.15, 0.97)); liq.addColorStop(1, shade(c1, -0.45, 0.97));
            g.fillStyle = liq; g.fillRect(-maxW - 2, S.level, maxW * 2 + 4, -S.level + 4);
            const lv = g.createLinearGradient(0, S.level, 0, 0);
            lv.addColorStop(0, 'rgba(255,255,255,.22)'); lv.addColorStop(0.5, 'rgba(255,255,255,0)'); lv.addColorStop(1, 'rgba(0,0,0,.3)');
            g.fillStyle = lv; g.fillRect(-maxW - 2, S.level, maxW * 2 + 4, -S.level + 4);
            const lw = widthAt(dense, S.level);
            g.beginPath(); g.ellipse(0, S.level, lw, 2.6, 0, 0, 7); g.fillStyle = shade(c2, 0.35, 0.75); g.fill();
            g.beginPath(); g.ellipse(0, S.level + 0.8, lw - 1, 1.6, 0, 0, Math.PI); g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 0.8; g.stroke();
            // bulles
            if (S.fizz) {
                let seed = Math.floor(c1.charCodeAt(2) * 31 + c1.charCodeAt(4));
                const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
                for (let i = 0; i < 34; i++) {
                    const y = S.level + 6 + rnd() * (-S.level - 12), ww = widthAt(dense, y) - 4, x = (rnd() * 2 - 1) * ww, r = 0.5 + rnd() * 1.4;
                    g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = 'rgba(255,255,255,.18)'; g.fill();
                    g.lineWidth = 0.5; g.strokeStyle = 'rgba(255,255,255,.55)'; g.stroke();
                }
            }
            // facettes du flacon rectangulaire
            if (S.facets) {
                g.lineWidth = 0.9;
                for (const fx of [-0.45, 0.45]) { g.strokeStyle = fx < 0 ? 'rgba(255,255,255,.35)' : 'rgba(0,0,0,.3)'; g.beginPath(); g.moveTo(fx * maxW, -4); g.lineTo(fx * maxW, -88); g.stroke(); }
            }
            // étiquettes
            drawLabel(g, def, S, dense);
            if (S.neckLabel) {
                const [n1, n2] = S.neckLabel;
                g.fillStyle = '#fffaf0'; g.beginPath(); g.moveTo(-widthAt(dense, n1) - 1, n1); g.lineTo(widthAt(dense, n1) + 1, n1); g.lineTo(widthAt(dense, n2) + 1, n2); g.lineTo(-widthAt(dense, n2) - 1, n2); g.closePath(); g.fill();
                g.fillStyle = shade(c1, -0.4); g.fillRect(-12, n1 + 1.5, 24, 1.4);
            }
            // ombrage cylindrique par-dessus tout
            const cyl = g.createLinearGradient(-maxW, 0, maxW, 0);
            cyl.addColorStop(0, 'rgba(0,0,0,.4)'); cyl.addColorStop(0.2, 'rgba(0,0,0,0)'); cyl.addColorStop(0.34, 'rgba(255,255,255,.14)');
            cyl.addColorStop(0.5, 'rgba(255,255,255,0)'); cyl.addColorStop(0.82, 'rgba(0,0,0,0)'); cyl.addColorStop(1, 'rgba(0,0,0,.42)');
            g.fillStyle = cyl; g.fillRect(-maxW - 2, top - 4, maxW * 2 + 4, -top + 8);
            // épaisseur du verre sur les bords
            body(); g.lineWidth = 8; g.strokeStyle = 'rgba(0,0,0,.28)'; g.stroke();
            g.lineWidth = 3; g.strokeStyle = shade(c1, 0.6, 0.3); g.stroke();
            g.restore();

            // contour fin
            body(); g.lineWidth = 2.2; g.strokeStyle = 'rgba(10,0,30,.4)'; g.stroke();
            g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,.45)'; g.stroke();

            // reflets
            const streak = (frac, ya, yb, lw, alpha) => {
                g.beginPath(); let first = true;
                for (const d of dense) {
                    if (d[0] > ya || d[0] < yb) continue;
                    const x = frac * d[1];
                    if (first) { g.moveTo(x, d[0]); first = false; } else g.lineTo(x, d[0]);
                }
                const gr = g.createLinearGradient(0, ya, 0, yb);
                gr.addColorStop(0, `rgba(255,255,255,${alpha * 0.2})`); gr.addColorStop(0.2, `rgba(255,255,255,${alpha})`);
                gr.addColorStop(0.8, `rgba(255,255,255,${alpha * 0.85})`); gr.addColorStop(1, `rgba(255,255,255,${alpha * 0.2})`);
                g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = lw; g.strokeStyle = gr; g.stroke();
            };
            streak(-0.62, -8, top + 14, 4.4, 0.8);
            streak(-0.8, -10, top + 20, 1.4, 0.45);
            streak(0.74, -12, top + 24, 1.6, 0.32);
            g.beginPath(); g.ellipse(-maxW * 0.36, -2.5, maxW * 0.4, 1.3, 0, 0, 7); g.fillStyle = 'rgba(255,255,255,.28)'; g.fill();
            // fond du verre
            if (S.punt) {
                g.beginPath(); g.ellipse(0, -0.5, widthAt(dense, 0) * 0.55, 2.2, 0, Math.PI, 2 * Math.PI); g.fillStyle = shade(c1, -0.7, 0.35); g.fill();
            }
            drawCap(g, def, S, dense);
            return { cv, ox, oy, w, h };
        }

        const bottleSprites = new Map();
        function drawBottle(c, def) {
            let spr = bottleSprites.get(def);
            if (!spr) { spr = buildBottleSprite(def); bottleSprites.set(def, spr); }
            c.drawImage(spr.cv, -spr.ox, -spr.oy, spr.w, spr.h);
        }

        function drawAvatar(c, viewer, x, y, r) {
            c.save();
            c.beginPath();
            c.arc(x, y, r, 0, Math.PI * 2);
            c.closePath();
            c.clip();
            if (viewer.img) {
                c.drawImage(viewer.img, x - r, y - r, r * 2, r * 2);
            } else {
                c.fillStyle = '#7b1fd1';
                c.fillRect(x - r, y - r, r * 2, r * 2);
                c.fillStyle = '#fff';
                c.font = `800 ${r * 1.1}px Poppins, sans-serif`;
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText(cleanName(viewer.username).charAt(0).toUpperCase(), x, y + 1);
            }
            c.restore();
            c.beginPath();
            c.arc(x, y, r, 0, Math.PI * 2);
            c.lineWidth = Math.max(2, r / 9);
            c.strokeStyle = '#fff';
            c.stroke();
        }

        /* ---------- Décor statique (hors-écran) ---------- */
        const scene = document.createElement('canvas');
        scene.width = W; scene.height = H;

        function neonText(c, text, x, y, color, size, glow) {
            c.save();
            c.font = `900 ${size}px Orbitron, Poppins, sans-serif`;
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            c.shadowColor = glow || color;
            c.shadowBlur = 16;
            c.fillStyle = color;
            c.fillText(text, x, y);
            c.shadowBlur = 0;
            c.fillStyle = 'rgba(255,255,255,.55)';
            c.fillText(text, x, y - 1);
            c.restore();
        }

        function ledStrip(c, x1, x2, y, color) {
            c.save();
            c.shadowColor = color;
            c.shadowBlur = 14;
            c.fillStyle = color;
            c.fillRect(x1, y, x2 - x1, 5);
            c.restore();
        }

        function buildScene() {
            const c = scene.getContext('2d');
            const rnd = rand(7);

            // Fond violet uni
            const bg = c.createLinearGradient(0, 0, 0, 480);
            bg.addColorStop(0, '#1f0d45');
            bg.addColorStop(1, '#4a1d8f');
            c.fillStyle = bg;
            c.fillRect(0, 0, W, H);

            // Sol pavé
            const floor = c.createLinearGradient(0, 470, 0, H);
            floor.addColorStop(0, '#3a2a68');
            floor.addColorStop(1, '#1c1238');
            c.fillStyle = floor;
            c.fillRect(0, 470, W, H - 470);
            const rows = 15;
            let y = 470;
            for (let r = 0; r < rows; r++) {
                const next = 470 + (H - 470) * Math.pow((r + 1) / rows, 1.35);
                const h = next - y;
                const bw = 46 + r * 9;
                const off = (r % 2) * bw / 2;
                for (let x = -bw + off; x < W; x += bw) {

                    c.fillRect(x + 1.5, y + 1, bw - 3, h - 2);

                y = next;
            }
            const glow = c.createRadialGradient(707, 600, 40, 707, 600, 520);
            glow.addColorStop(0, 'rgba(236,72,200,.28)');

            // Confettis au sol
            const palette = ['#ffe600', '#ff4fa3', '#00f3ff', '#7cff6b', '#ff9a3c', '#a45cf0'];
            for (let i = 0; i < 150; i++) {
                const cy = 540 + Math.pow(rnd(), 0.8) * 210;
                const cx = rnd() * W;
                if (cx > 270 && cx < 1150 && cy < 660) continue;
                c.save();
                c.translate(cx, cy);
                c.rotate(rnd() * Math.PI);
                c.fillStyle = palette[i % palette.length];
                c.shadowColor = c.fillStyle;
                c.shadowBlur = 5;
                c.fillRect(-4, -2, 8, 3.5);
                c.restore();
            }

            // Stand en bois
            const wood = c.createLinearGradient(0, 190, 0, 505);
            wood.addColorStop(0, '#6a3822');
            wood.addColorStop(1, '#4a2616');
            c.fillStyle = wood;
            c.fillRect(405, 190, 605, 315);
            c.strokeStyle = 'rgba(0,0,0,.25)';
            c.lineWidth = 2;
            for (let x = 440; x < 1010; x += 52) {
                c.beginPath(); c.moveTo(x, 190); c.lineTo(x, 505); c.stroke();
            }
            c.fillStyle = '#3b1d10';
            c.fillRect(405, 190, 605, 14);
            for (let i = 0; i < 5; i++) {
                c.fillStyle = ['#ff4fa3', '#ffe600', '#00f3ff', '#7cff6b', '#a45cf0'][i];
                c.beginPath();

            // Toit
            c.fillStyle = '#5b2e1b';
            c.fillRect(365, 158, 685, 34);
            c.fillStyle = '#7a4128';
            c.fillRect(365, 158, 685, 8);
            // Guirlandes LED verticales
            for (let yy = 205; yy < 500; yy += 12) {
                c.fillStyle = '#ff4fa3';
                c.shadowColor = '#ff4fa3'; c.shadowBlur = 8;
                c.fillRect(406, yy, 5, 6);
                c.fillStyle = '#ff9ed0';
                c.fillRect(1003, yy, 5, 6);

            c.shadowBlur = 0;

            // Étagères néon (3 étages)
            [[322, '#ff4fa3', 0], [432, '#00d9ff', 1]].forEach(([sy, color]) => {
                c.fillStyle = '#3a1c10';
                c.fillRect(412, sy, 590, 14);
                ledStrip(c, 414, 1000, sy + 5, color);
                c.fillStyle = 'rgba(0,0,0,.28)';
                c.fillRect(412, sy + 14, 590, 8);
            });
            ledStrip(c, 425, 990, 466, '#ffd400');
            c.fillStyle = '#3a1c10';
            c.fillRect(412, 474, 590, 31);
            c.strokeStyle = 'rgba(0,0,0,.35)';
            for (let x = 412; x < 1002; x += 118) c.strokeRect(x, 474, 118, 31);

            // Numéros
            for (let i = 0; i < SLOT_COUNT; i++) {
                const nx = slotX(i), ny = slotY(i) + 28;
                c.beginPath();
                c.arc(nx, ny, 10, 0, Math.PI * 2);

                c.fill();
                c.strokeStyle = '#ffd36b';
                c.lineWidth = 2;
                c.stroke();
                c.fillStyle = '#fff';
                c.font = '800 11px Poppins, sans-serif';
                c.textAlign = 'center';
                c.textBaseline = 'middle';
                c.fillText(String(i + 1), nx, ny + 1);
            }

            // Enseigne néon
            c.save();
            c.shadowColor = '#d84dff';
            c.shadowBlur = 22;
            c.lineWidth = 5;
            c.strokeStyle = '#d070ff';
            c.fillStyle = 'rgba(14,5,40,.92)';
            c.beginPath();
            c.roundRect(430, 28, 560, 128, 22);
            c.fill();
            c.stroke();
            c.restore();
            neonText(c, 'LE JEU DES', 710, 66, '#aef2ff', 44, '#00d9ff');
            const letters = [...'BOUTEILLES COLORÉES'];
            const colors = ['#ff4fa3', '#ff9a3c', '#ffe600', '#7cff6b', '#00f3ff', '#c27bff'];
            c.font = '900 31px Orbitron, Poppins, sans-serif';
            const total = letters.reduce((s, l) => s + c.measureText(l).width, 0);
            let lx = 710 - total / 2;

                c.font = '900 31px Orbitron, Poppins, sans-serif';

                c.textBaseline = 'middle';
                c.shadowColor = colors[i % colors.length];
                c.shadowBlur = 14;
                c.fillStyle = colors[i % colors.length];
                c.fillText(l, lx, 118);
                c.restore();
                lx += lw;
            });
            // Éclairs
            [[470, 30, 1], [950, 30, -1]].forEach(([bx, by, dir]) => {
                c.save();
                c.translate(bx, by);
                c.scale(dir, 1);
                c.shadowColor = '#ffe600';
                c.shadowBlur = 16;
                c.fillStyle = '#ffd400';
                c.beginPath();
                c.moveTo(0, 0); c.lineTo(34, 0); c.lineTo(18, 34); c.lineTo(38, 34); c.lineTo(-6, 90); c.lineTo(8, 46); c.lineTo(-10, 46);
                c.closePath();
                c.fill();
                c.restore();
            });
            // Sous-bandeau
            c.save();
            c.shadowColor = '#00f3ff';
            c.shadowBlur = 14;
            c.fillStyle = 'rgba(12,8,50,.95)';
            c.strokeStyle = '#00f3ff';
            c.lineWidth = 3;
            c.beginPath();
            c.roundRect(510, 168, 395, 44, 10);
            c.fill();
            c.stroke();
            c.restore();
            c.font = '900 15px Orbitron, Poppins, sans-serif';
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            c.fillStyle = '#ffe600';
            c.fillText('STRIKE !', 568, 191);
            c.fillStyle = '#7fe9ff';
            c.fillText('GAGNEZ DES ÉTOILES !', 765, 191);

            // Comptoir
            const top = c.createLinearGradient(0, 505, 0, 556);
            top.addColorStop(0, '#d56bd6');
            top.addColorStop(1, '#8a3fc4');
            c.fillStyle = top;
            c.beginPath();
            c.moveTo(335, 505); c.lineTo(1080, 505); c.lineTo(1160, 556); c.lineTo(252, 556);
            c.closePath();
            c.fill();
            c.fillStyle = 'rgba(255,255,255,.22)';
            c.fillRect(252, 556, 908, 4);
            const front = c.createLinearGradient(0, 560, 0, 655);
            front.addColorStop(0, '#5a2f1e');
            front.addColorStop(1, '#3a1c12');
            c.fillStyle = front;
            c.fillRect(265, 560, 885, 95);
            c.strokeStyle = 'rgba(0,0,0,.35)';
            c.lineWidth = 2;
            for (let x = 265; x <= 1150; x += 63) {
                c.beginPath(); c.moveTo(x, 560); c.lineTo(x, 655); c.stroke();
            }
            c.fillStyle = 'rgba(0,0,0,.4)';
            c.fillRect(265, 650, 885, 8);
        }

        /* ---------- Rendu dynamique ---------- */
        function fitText(c, text, maxWidth, size, weight) {
            let s = size;
            c.font = `${weight} ${s}px Poppins, sans-serif`;
            while (c.measureText(text).width > maxWidth && s > 9) {
                s -= 1;
                c.font = `${weight} ${s}px Poppins, sans-serif`;
            }
        }

        function drawBanner(c, time) {
            const sway = Math.sin(time * 1.3) * 0.012;
            c.save();
            c.translate(290, 205);
            c.rotate(sway);
            // Tringle
            c.fillStyle = '#6a3822';
            c.fillRect(-105, -8, 210, 10);
            c.fillStyle = '#ffd36b';
            c.beginPath(); c.arc(-105, -3, 7, 0, Math.PI * 2); c.arc(105, -3, 7, 0, Math.PI * 2); c.fill();
            // Étoffe
            const g = c.createLinearGradient(0, 0, 0, 280);
            g.addColorStop(0, '#5a2a9d');
            g.addColorStop(1, '#3a1773');
            c.fillStyle = g;
            c.beginPath();
            c.moveTo(-92, 2); c.lineTo(92, 2); c.lineTo(92, 262); c.lineTo(0, 232); c.lineTo(-92, 262);
            c.closePath();
            c.fill();
            c.lineWidth = 3;
            c.strokeStyle = '#d9b6ff';
            c.stroke();
            c.strokeStyle = 'rgba(255,211,107,.8)';
            c.lineWidth = 1.5;
            c.beginPath();
            c.moveTo(-80, 12); c.lineTo(80, 12); c.lineTo(80, 244); c.lineTo(0, 218); c.lineTo(-80, 244);
            c.closePath();
            c.stroke();
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            if (banner) {
                const pulse = 1 + Math.sin(time * 6) * 0.03;
                c.fillStyle = banner.kind === 'win' ? '#ff4fa3' : '#00d9ff';
                c.beginPath(); c.roundRect(-60, 18, 120, 20, 10); c.fill();
                c.fillStyle = '#fff';
                c.font = '900 12px Poppins, sans-serif';
                c.fillText(banner.kind === 'win' ? 'GAGNANT !' : 'TES ÉTOILES', 0, 28);
                drawAvatar(c, banner.viewer, 0, 84, 40);
                c.fillStyle = '#fff08c';
                fitText(c, cleanName(banner.viewer.username), 150, 18, 800);
                c.fillText(cleanName(banner.viewer.username), 0, 146);
                c.save();
                c.scale(pulse, pulse);
                c.fillStyle = '#7fe9ff';
                c.font = '900 34px Orbitron, Poppins, sans-serif';
                const value = banner.kind === 'win' ? `+${banner.reward}` : String(banner.viewer.stars);
                c.shadowColor = '#00f3ff';
                c.shadowBlur = 12;
                c.fillText(value, 0, 182);
                c.restore();
                c.fillStyle = '#ffd36b';
                c.font = '800 12px Poppins, sans-serif';
                c.fillText(banner.kind === 'win' ? '⭐ ÉTOILES' : '⭐ AU TOTAL', 0, 214);
            } else {
                const glow = 0.75 + Math.sin(time * 2.2) * 0.25;
                [['GRYPHON', 100, '#aef2ff', '#00d9ff'], ['AGENCY', 150, '#ff9ed0', '#ff4fa3']].forEach(([text, y, color, shadow]) => {
                    c.save();
                    c.font = '900 24px Orbitron, Poppins, sans-serif';
                    c.shadowColor = shadow;
                    c.shadowBlur = 16 * glow;
                    c.fillStyle = color;
                    c.fillText(text, 0, y);
                    c.shadowBlur = 0;
                    c.fillStyle = 'rgba(255,255,255,.55)';
                    c.fillText(text, 0, y - 1);
                    c.restore();
                });
            }
            c.restore();
        }

        function render(time) {
            const scale = Math.min(canvas.width / W, canvas.height / H);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#2a1158';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.setTransform(scale, 0, 0, scale, (canvas.width - W * scale) / 2, (canvas.height - H * scale) / 2);
            ctx.drawImage(scene, 0, 0);

            slots.forEach((slot, i) => {
                if (!slot.plush) return;
                const x = slotX(i), y = slotY(i);
                ctx.save();
                if (slot.state === 'falling') {
                    ctx.translate(x + slot.dx, y + slot.dy);
                    ctx.rotate(slot.rot);
                    ctx.globalAlpha = Math.max(0, 1 - slot.t / 1.1);
                } else {
                    ctx.translate(x, y);
                    if (slot.state === 'spawning') {
                        const k = Math.min(1, slot.t / 0.4);
                        const pop = k < 1 ? 1 + Math.sin(k * Math.PI) * 0.15 : 1;
                        ctx.scale(k * pop, k * pop);
                    }
                    if (slot.wobble > 0) ctx.rotate(Math.sin(slot.wobble * 30) * 0.12 * (slot.wobble / 0.7));
                }
                ctx.scale(0.8, 0.8);
                drawBottle(ctx, defs[slot.plush.def]);
                ctx.restore();
            });

            balls.forEach(b => {
                if (b.out) {
                    drawAvatar(ctx, b.viewer, b.x, b.y, 16);
                    return;
                }
                const k = b.t / b.dur;
                const tx = slotX(b.slot), ty = slotY(b.slot) - 40;
                const x = 707 + (tx - 707) * k;
                const y = 540 + (ty - 540) * k - Math.sin(k * Math.PI) * 90;
                const r = 26 - 10 * k;
                ctx.save();
                ctx.shadowColor = '#00f3ff';
                ctx.shadowBlur = 14;
                drawAvatar(ctx, b.viewer, x, y, r);
                ctx.restore();
            });

            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
                ctx.fillStyle = p.c;
                if (p.star) {
                    ctx.font = '16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('★', p.x, p.y);
                } else {
                    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
                }
            });
            ctx.globalAlpha = 1;

            floaters.forEach(f => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, 1 - f.t / 1.6);
                ctx.textAlign = 'center';
                ctx.font = '900 30px Orbitron, Poppins, sans-serif';
                ctx.shadowColor = f.color;
                ctx.shadowBlur = 14;
                ctx.fillStyle = f.color;
                ctx.fillText(f.text, f.x, f.y - f.t * 50);
                ctx.restore();
            });

            drawBanner(ctx, time);

            if (!queue.length || (queueIndex >= queue.length && slots.every(s => !s.plush))) {
                ctx.fillStyle = 'rgba(15,5,40,.75)';
                ctx.fillRect(405, 230, 605, 90);
                neonText(ctx, 'TOUTES LES ÉTOILES SONT DISTRIBUÉES !', 707, 275, '#ffe600', 24, '#ff9a3c');
            }
        }

        function resize() {
            const ratio = window.devicePixelRatio || 1;
            canvas.width = Math.round(innerWidth * ratio);
            canvas.height = Math.round(innerHeight * ratio);
        }
        addEventListener('resize', resize);

        let last = performance.now();
        function frame(now) {
            const dt = Math.min(0.05, (now - last) / 1000) * settings.speed / 100;
            last = now;
            update(dt);
            render(now / 1000);
            requestAnimationFrame(frame);
        }

        /* ---------- TikTok ---------- */
        let socket = null;
        let reconnectTimer = null;

        function setStatus(message) { $('live-status').textContent = message; }

        function handleMessage(data) {
            if (data.type === 'STATUS') {
                setStatus(data.message || 'Statut TikTok reçu.');
            } else if (data.type === 'viewer') {
                const v = data.viewer || {};
                const viewer = getViewer(v.username || v.nickname);
                setAvatar(viewer, v.avatarDataUri || v.profilePictureUrl);
            } else if (data.type === 'gift' || data.type === 'tiktok-gift') {
                const gift = data.gift ?? data;
                const viewer = getViewer(gift.username || gift.nickname, gift.profilePictureUrl || gift.avatarDataUri);
                queueShots(viewer, Math.min(10, Math.max(1, Math.floor(Number(gift.repeatCount) || 1))));
            } else if (data.type === 'comment' || data.type === 'tiktok-comment' || data.type === 'chat') {
                const c = data.commentData ?? data;
                const viewer = getViewer(c.username || c.nickname, c.profilePictureUrl || c.avatarDataUri);
                if (/^\s*(?:!\s*)?(?:étoile|etoile|star|⭐)s?\s*$|^\s*\*\s*$/iu.test(String(c.comment ?? c.text ?? ''))) claimStars(viewer);
            } else if (data.type === 'join' || data.type === 'member') {
                const v = data.viewer ?? data.user ?? data;
                getViewer(v.username || v.nickname, v.profilePictureUrl || v.avatarDataUri);
            }
        }

        function connect() {
            const name = $('username').value.trim().replace(/^@/, '');
            const url = $('ws-url').value.trim();
            if (!name || !url) { setStatus('Pseudo TikTok et adresse requis.'); return; }
            clearTimeout(reconnectTimer);
            if (socket) { socket.onclose = null; socket.close(); }
            try { socket = new WebSocket(url); } catch (error) { setStatus('Adresse invalide.'); return; }
            const active = socket;
            setStatus(`Connexion au live de @${name}…`);
            active.addEventListener('open', () => active.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username: name })));
            active.addEventListener('message', event => {
                try { handleMessage(JSON.parse(event.data)); } catch (error) { console.warn('Message invalide', error); }
            });
            active.addEventListener('error', () => setStatus('Connexion impossible.'));
            active.addEventListener('close', () => {
                if (socket !== active) return;
                setStatus('Reconnexion…');
                reconnectTimer = setTimeout(connect, 3000);
            });
        }

        /* RUN du live : le serveur a déjà débité le portefeuille global, une étoile = un tir */
        window.addEventListener('arcade:wallet-run', event => {
            const p = event.detail && event.detail.player, spent = Math.floor(Number(event.detail && event.detail.spent) || 0);
            const name = p && (p.username || p.uniqueId || p.nickname);
            if (name && spent > 0) queueShots(getViewer(name), spent);
        });

        /* ---------- Sauvegarde ---------- */
        function snapshot() {
            return {
                settings,
                username: $('username').value,
                wsUrl: $('ws-url').value,
                queue,
                queueIndex,
                starsGiven,
                knocked,
                slots: slots.map(s => (s.plush && s.state !== 'falling' ? s.plush : null)),
                viewers: [...viewers.values()].map(v => ({ username: v.username, stars: v.stars }))
            };
        }

        function loadGame() {
            try {
                const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
                if (!saved || !Array.isArray(saved.queue)) return false;
                Object.assign(settings, saved.settings || {});
                queue = saved.queue;
                queueIndex = Math.min(queue.length, Math.max(0, saved.queueIndex | 0));
                starsGiven = saved.starsGiven | 0;
                knocked = saved.knocked | 0;
                (saved.viewers || []).forEach(v => {
                    if (v && typeof v.username === 'string') {
                        viewers.set(v.username.toLocaleLowerCase(), { username: v.username, stars: v.stars | 0, img: null });
                    }
                });
                slots.forEach((slot, i) => {
                    const plush = saved.slots?.[i];
                    if (plush && defs[plush.def]) Object.assign(slot, { plush, state: 'idle', t: 1 });
                });
                $('username').value = saved.username || '';
                if (saved.wsUrl) $('ws-url').value = saved.wsUrl;
                return true;
            } catch (error) {
                return false;
            }
        }

        /* ---------- Panneau flottant ---------- */
        const panel = $('panel');
        const panelState = { x: null, y: 16, hidden: false };

        function applyPanel() {
            panel.classList.toggle('hidden-panel', panelState.hidden);
            $('eye').textContent = panelState.hidden ? '🙈' : '👁';
            $('eye').setAttribute('aria-expanded', String(!panelState.hidden));
            panel.style.top = `${panelState.y}px`;
            if (panelState.x === null) {
                panel.style.left = 'auto';
                panel.style.right = '16px';
            } else {
                const maxX = Math.max(0, innerWidth - panel.offsetWidth);
                panelState.x = Math.min(Math.max(0, panelState.x), maxX);
                panel.style.left = `${panelState.x}px`;
                panel.style.right = 'auto';
            }
        }

        function savePanel() {
            try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(panelState)); } catch (error) { /* ignoré */ }
        }

        try {
            Object.assign(panelState, JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}'));
        } catch (error) { /* ignoré */ }

        let drag = null;
        $('panel-head').addEventListener('pointerdown', event => {
            if (event.target.closest('button') && !panelState.hidden) return;
            if (event.target === $('eye')) return;
            const rect = panel.getBoundingClientRect();
            drag = { id: event.pointerId, dx: event.clientX - rect.left, dy: event.clientY - rect.top };
            $('panel-head').setPointerCapture(event.pointerId);
            panel.classList.add('dragging');
        });
        $('panel-head').addEventListener('pointermove', event => {
            if (!drag || event.pointerId !== drag.id) return;
            panelState.x = event.clientX - drag.dx;
            panelState.y = Math.min(Math.max(0, event.clientY - drag.dy), innerHeight - 40);
            applyPanel();
        });
        const endDrag = () => { if (drag) { drag = null; panel.classList.remove('dragging'); savePanel(); } };
        $('panel-head').addEventListener('pointerup', endDrag);
        $('panel-head').addEventListener('pointercancel', endDrag);
        $('eye').addEventListener('click', () => {
            panelState.hidden = !panelState.hidden;
            applyPanel();
            savePanel();
        });
        addEventListener('resize', applyPanel);

        /* ---------- Contrôles ---------- */

        const syncEffectsSound = () => {

        };
        $('effects-sound').addEventListener('change', syncEffectsSound);

        addEventListener('load', syncEffectsSound, { once: true });
        const simViewer = () => getViewer($('sim-name').value || 'Spectateur');
        $('sim-gift').addEventListener('click', () => queueShots(simViewer(), 1, true));
        $('sim-burst').addEventListener('click', () => queueShots(simViewer(), 10, true));
        $('sim-big-gift').addEventListener('click', () => {
            const effects = window.ArcadeEffects;
            if (typeof effects?.simulateBigGift !== 'function') {
                showToast('Simulateur d’effets Arcade indisponible.');
                return;
            }
            const viewer = simViewer();
            const coins = Math.max(100, Number(effects.config?.bigGiftCoins) || 100);
            queueShots(viewer, 10, true);
            effects.simulateBigGift(viewer.username, coins);
        });
        $('sim-share').addEventListener('click', () => {
            const simulateShare = window.ArcadeEffects?.simulateShare;
            if (typeof simulateShare !== 'function') {
                showToast('Simulateur de partage Arcade indisponible.');
                return;
            }
            simulateShare.call(window.ArcadeEffects);
        });
        $('sim-join').addEventListener('click', () => {
            const name = $('sim-name').value || 'Spectateur';
            greeted.delete(name.trim().replace(/^@/, '').toLocaleLowerCase());
            getViewer(name);
        });
        $('sim-star').addEventListener('click', () => claimStars(simViewer()));
        if ('speechSynthesis' in window) speechSynthesis.getVoices();

        /* ---------- Démarrage ---------- */
        buildScene();
        if (!loadGame()) resetPool();
        $('rtp').value = settings.rtp;
        $('rtp-out').textContent = `${settings.rtp}%`;
        $('speed').value = settings.speed;
        $('speed-out').textContent = `${settings.speed}%`;
        $('star-min').value = settings.min;
        $('star-max').value = settings.max;
        fillSlots(true);
        renderQueue();
        applyPanel();
        resize();
        (document.fonts?.ready ?? Promise.resolve()).then(() => { buildScene(); });
        requestAnimationFrame(frame);
    </script>
</body>
</html>
