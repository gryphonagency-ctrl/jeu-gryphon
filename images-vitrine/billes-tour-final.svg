      <stop offset=".25" stop-color="#bffbff"/>
      <stop offset=".7" stop-color="#25dcff"/>
      <stop offset="1" stop-color="#1768ff"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
