<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-labelledby="title desc">
  <title id="title">Billes Tour — parcours vers trois arrivées</title>
  <desc id="desc">Trois billes suivent des tubes lumineux cyan, rose et or jusqu'aux lignes d'arrivée.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="44%" r="75%">
      <stop stop-color="#28105c"/>
      <stop offset="1" stop-color="#080316"/>
    </radialGradient>
    <linearGradient id="cyan" x2="0" y2="1">
