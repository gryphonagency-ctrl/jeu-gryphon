<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title description">
  <title id="title">1, 2, 3 Soleil LIVE</title>
  <desc id="description">La poupée se retourne devant un mur Gryphon Agency, au-dessus d’un terrain de terre.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1">
      <stop stop-color="#a7a69d"/>
      <stop offset="1" stop-color="#77786f"/>
    </linearGradient>
    <linearGradient id="field" x2="0" y2="1">
      <stop stop-color="#ad8656"/>
      <stop offset="1" stop-color="#61452d"/>
    </linearGradient>
    <filter id="soil" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".035 .07" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" values=".65 0 0 0 .18 0 .47 0 0 .11 0 0 .29 0 .035 0 0 0 1 0" result="earth"/>
      <feBlend in="SourceGraphic" in2="earth" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="7"/>
      <feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="300" fill="#121827"/>
  <rect x="18" y="18" width="684" height="83" rx="15" fill="url(#wall)"/>
  <path d="M18 60h684M130 18v42m115 0V18m115 42V18m115 0v42m115-42v42m112-42v42" stroke="#42433d" stroke-opacity=".28" stroke-width="2"/>
  <path d="M18 100h684v162H18z" fill="url(#field)" filter="url(#soil)"/>
  <text x="54" y="67" fill="#292c30" font-family="Arial,sans-serif" font-size="24" font-weight="900" letter-spacing="2">GRYPHON</text>
  <text x="666" y="67" text-anchor="end" fill="#292c30" font-family="Arial,sans-serif" font-size="24" font-weight="900" letter-spacing="2">.AGENCY</text>
  <g opacity=".32" fill="#37271a">
    <ellipse cx="92" cy="197" rx="10" ry="4"/><ellipse cx="287" cy="230" rx="8" ry="3"/>
    <ellipse cx="492" cy="190" rx="9" ry="4"/><ellipse cx="634" cy="236" rx="11" ry="4"/>
  </g>
  <path d="M18 258h684" stroke="#fff" stroke-opacity=".95" stroke-width="4" stroke-dasharray="18 13"/>
  <path d="M18 143h684" stroke="#f8f3ea" stroke-width="5"/>
  <path d="M18 143h342" stroke="#f34855" stroke-width="5" stroke-dasharray="18 13"/>
  <g filter="url(#shadow)">
    <path d="M348 39q1-29 13-29 14 0 15 29l-7 11h-15z" fill="#28252b"/>
    <path d="M348 33q-8 9-5 17l-7 4 10 5 4-10m23-16q9 9 5 17l7 4-10 5-4-10" fill="#252329"/>
    <path d="M342 52q19-15 38 0l14 42h-66z" fill="#df7540"/>
    <path d="M346 53v39m11-42v44m11-43v43m11-38v38" stroke="#ffac68" stroke-opacity=".6" stroke-width="3"/>
    <path d="M338 55l-13 30 7 3 16-28m33-5 14 30-7 3-17-28" fill="#e7bc49"/>
    <path d="M350 91h11v35h-11zm15 0h11v35h-11z" fill="#eadfc8"/>
    <path d="M348 122h14v8h-14zm15 0h14v8h-14z" fill="#34404a"/>
  </g>
  <g filter="url(#shadow)" stroke="#fff" stroke-width="3">
    <g transform="translate(145 174)">
      <circle cy="0" r="18" fill="#63c7e9"/><path d="M-17 24q17-15 34 0l5 27h-44z" fill="#4a69af"/>
      <path d="M-9 50v20m18-20v20" stroke-linecap="round"/>
    </g>
