<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title description">
  <title id="title">Puissance 4 TikTok Live</title>
  <desc id="description">Plateau de Puissance 4 en bois avec des jetons colorés, un alignement gagnant et quatre étoiles.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#50301f"/>
      <stop offset="1" stop-color="#160f0c"/>
    </linearGradient>
    <linearGradient id="wood" x2="0" y2="1">
      <stop stop-color="#bd7a3d"/>
      <stop offset="1" stop-color="#653819"/>
    </linearGradient>
    <linearGradient id="blue" x2="0" y2="1">
      <stop stop-color="#4288ed"/>
      <stop offset="1" stop-color="#123f84"/>
    </linearGradient>
    <radialGradient id="red">
      <stop stop-color="#ff9a79"/>
      <stop offset="1" stop-color="#c83240"/>
    </radialGradient>
    <radialGradient id="gold">
      <stop stop-color="#fff5a8"/>
      <stop offset="1" stop-color="#eaa72e"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="300" fill="url(#background)"/>
  <path d="M0 49h720M0 54h720M0 263h720M0 268h720" stroke="#f6ca83" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="82" cy="72" r="52" fill="#ffcc66" opacity=".06"/>
  <circle cx="645" cy="210" r="80" fill="#588fff" opacity=".08"/>
  <g transform="translate(165 34)">
    <rect x="-15" y="-13" width="370" height="255" rx="28" fill="#160f0c" opacity=".58"/>
    <rect width="340" height="226" rx="23" fill="url(#wood)" stroke="#e6b16b" stroke-width="6"/>
    <rect x="14" y="13" width="312" height="197" rx="17" fill="url(#blue)" stroke="#8ac4ff" stroke-width="4"/>
    <g fill="#101a2b" stroke="#87baff" stroke-opacity=".28" stroke-width="2">
      <circle cx="41" cy="42" r="17"/><circle cx="84" cy="42" r="17"/><circle cx="127" cy="42" r="17"/><circle cx="170" cy="42" r="17"/><circle cx="213" cy="42" r="17"/><circle cx="256" cy="42" r="17"/><circle cx="299" cy="42" r="17"/>
      <circle cx="41" cy="83" r="17"/><circle cx="84" cy="83" r="17"/><circle cx="127" cy="83" r="17"/><circle cx="170" cy="83" r="17"/><circle cx="213" cy="83" r="17"/><circle cx="256" cy="83" r="17"/><circle cx="299" cy="83" r="17"/>
      <circle cx="41" cy="124" r="17"/><circle cx="84" cy="124" r="17"/><circle cx="127" cy="124" r="17"/><circle cx="170" cy="124" r="17"/><circle cx="213" cy="124" r="17"/><circle cx="256" cy="124" r="17"/><circle cx="299" cy="124" r="17"/>
      <circle cx="41" cy="165" r="17"/><circle cx="84" cy="165" r="17"/><circle cx="127" cy="165" r="17"/><circle cx="170" cy="165" r="17"/><circle cx="213" cy="165" r="17"/><circle cx="256" cy="165" r="17"/><circle cx="299" cy="165" r="17"/>
    </g>
    <g fill="url(#red)" stroke="#ffd0b4" stroke-width="2">
      <circle cx="41" cy="165" r="15"/><circle cx="84" cy="165" r="15"/><circle cx="127" cy="165" r="15"/><circle cx="170" cy="165" r="15"/>
    </g>
    <g fill="url(#gold)" stroke="#fff1b1" stroke-width="2">
      <circle cx="84" cy="124" r="15"/><circle cx="127" cy="124" r="15"/><circle cx="213" cy="124" r="15"/>
      <circle cx="41" cy="124" r="15"/><circle cx="213" cy="165" r="15"/>
    </g>
    <g fill="#fff2b1" font-family="Segoe UI, sans-serif" font-size="12" font-weight="800" text-anchor="middle">
      <text x="41" y="215">1</text><text x="84" y="215">2</text><text x="127" y="215">3</text><text x="170" y="215">4</text><text x="213" y="215">5</text><text x="256" y="215">6</text><text x="299" y="215">7</text>
    </g>
  </g>
  <g fill="url(#gold)" filter="url(#glow)" font-family="Segoe UI Symbol,Segoe UI,sans-serif" font-size="30" text-anchor="middle">
    <text x="565" y="96">★</text><text x="610" y="96">★</text><text x="655" y="96">★</text><text x="700" y="96">★</text>
  </g>
  <text x="35" y="224" fill="#ffe2aa" font-family="Segoe UI,sans-serif" font-size="20" font-weight="900">PUISSANCE 4</text>
  <text x="37" y="251" fill="#e1c49d" font-family="Segoe UI,sans-serif" font-size="13">TikTok Live · 4 alignés = VIP + 4 étoiles</text>
</svg>
