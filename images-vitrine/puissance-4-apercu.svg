    <text x="77" y="97" fill="#35553c" font-family="Segoe UI,sans-serif" font-size="9" font-weight="900" letter-spacing="1">GRYPHON</text>
    <text x="77" y="111" fill="#6b542d" font-family="Segoe UI,sans-serif" font-size="8" font-weight="900" letter-spacing="2">AGENCY</text>
