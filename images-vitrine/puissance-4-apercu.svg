<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title description">
  <title id="title">Puissance 4 TikTok Live</title>
  <desc id="description">Plateau de Puissance 4 en bois avec des jetons colorés, un alignement gagnant et quatre étoiles.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#286a53"/>
      <stop offset="1" stop-color="#103b40"/>
    </linearGradient>
    <linearGradient id="wood" x2="0" y2="1">
      <stop stop-color="#f3c66e"/>
      <stop offset="1" stop-color="#995126"/>
    </linearGradient>
    <linearGradient id="blue" x2="0" y2="1">
      <stop stop-color="#32b9cb"/>
      <stop offset="1" stop-color="#1777a5"/>
    </linearGradient>
    <radialGradient id="red">
      <stop stop-color="#ff9a79"/>
      <stop offset="1" stop-color="#c83240"/>
    </radialGradient>
    <radialGradient id="gold">
      <stop stop-color="#fff5a8"/>
      <stop offset="1" stop-color="#eaa72e"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="300" fill="url(#background)"/>
  <circle cx="92" cy="96" r="52" fill="#ffe19a" opacity=".1"/>
