    <rect x="14" y="13" width="312" height="197" rx="17" fill="url(#blue)" stroke="#b3f2e7" stroke-width="4"/>
    <g fill="#194e5a" stroke="#c3f6ed" stroke-opacity=".3" stroke-width="2">
      <circle cx="41" cy="42" r="17"/><circle cx="84" cy="42" r="17"/><circle cx="127" cy="42" r="17"/><circle cx="170" cy="42" r="17"/><circle cx="213" cy="42" r="17"/><circle cx="256" cy="42" r="17"/><circle cx="299" cy="42" r="17"/>
      <circle cx="41" cy="83" r="17"/><circle cx="84" cy="83" r="17"/><circle cx="127" cy="83" r="17"/><circle cx="170" cy="83" r="17"/><circle cx="213" cy="83" r="17"/><circle cx="256" cy="83" r="17"/><circle cx="299" cy="83" r="17"/>
      <circle cx="41" cy="124" r="17"/><circle cx="84" cy="124" r="17"/><circle cx="127" cy="124" r="17"/><circle cx="170" cy="124" r="17"/><circle cx="213" cy="124" r="17"/><circle cx="256" cy="124" r="17"/><circle cx="299" cy="124" r="17"/>
      <circle cx="41" cy="165" r="17"/><circle cx="84" cy="165" r="17"/><circle cx="127" cy="165" r="17"/><circle cx="170" cy="165" r="17"/><circle cx="213" cy="165" r="17"/><circle cx="256" cy="165" r="17"/><circle cx="299" cy="165" r="17"/>
    </g>
    <g fill="url(#red)" stroke="#ffd0b4" stroke-width="2">
