<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-labelledby="title desc">
  <title id="title">Le Mot du Live</title>
  <desc id="desc">Mots croisés et roue de lettres dans un univers néon.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#08152b"/>
      <stop offset="1" stop-color="#30205a"/>
    </linearGradient>
    <linearGradient id="tile" x2="0" y2="1">
      <stop stop-color="#f8ffff"/>
      <stop offset="1" stop-color="#8deaff"/>
    </linearGradient>
    <radialGradient id="wheel">
      <stop stop-color="#13375b"/>
      <stop offset="1" stop-color="#091226"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="360" height="150" rx="14" fill="url(#background)"/>
  <circle cx="266" cy="69" r="77" fill="#13cfff" opacity=".08"/>
  <circle cx="78" cy="141" r="80" fill="#ff43af" opacity=".08"/>
  <g opacity=".18" stroke="#8beaff">
    <path d="M0 35h360M0 115h360M40 0v150M320 0v150"/>
  </g>
  <g transform="translate(30 30)" filter="url(#glow)">
    <rect x="0" y="0" width="36" height="36" rx="6" fill="url(#tile)"/>
    <rect x="42" y="0" width="36" height="36" rx="6" fill="url(#tile)"/>
    <rect x="84" y="0" width="36" height="36" rx="6" fill="url(#tile)"/>
    <rect x="42" y="42" width="36" height="36" rx="6" fill="url(#tile)"/>
    <rect x="42" y="84" width="36" height="36" rx="6" fill="url(#tile)"/>
    <g fill="#10223d" font-family="Arial,sans-serif" font-size="21" font-weight="900" text-anchor="middle">
      <text x="18" y="25">S</text><text x="60" y="25">O</text><text x="102" y="25">L</text>
      <text x="60" y="67">L</text><text x="60" y="109">A</text>
    </g>
    <path d="M18 18h42m0 0v84m0-42h42" fill="none" stroke="#16d7ff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(235 75)">
    <circle r="49" fill="url(#wheel)" stroke="#57e7ff" stroke-width="2"/>
    <circle r="31" fill="none" stroke="#ff65bd" stroke-opacity=".6" stroke-width="2" stroke-dasharray="4 5"/>
    <g fill="#fff" stroke="#76eaff" stroke-width="2">
      <circle cx="0" cy="-38" r="13"/><circle cx="33" cy="-19" r="13"/>
      <circle cx="33" cy="19" r="13"/><circle cx="0" cy="38" r="13"/>
      <circle cx="-33" cy="19" r="13"/><circle cx="-33" cy="-19" r="13"/>
    </g>
    <g fill="#182744" font-family="Arial,sans-serif" font-size="13" font-weight="900" text-anchor="middle">
      <text x="0" y="-33">L</text><text x="33" y="-14">I</text>
      <text x="33" y="24">V</text><text x="0" y="43">E</text>
      <text x="-33" y="24">A</text><text x="-33" y="-14">T</text>
    </g>
    <circle r="12" fill="#ff4db4"/>
    <path d="m-4 0 3 3 6-7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="300" y="137" fill="#8cecff" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="2">GRIFFON LIVE</text>
</svg>
