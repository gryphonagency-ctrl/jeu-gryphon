<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" role="img" aria-labelledby="title desc">
  <title id="title">Montgolfières Tour</title>
  <desc id="desc">Montgolfières colorées s’élèvent au-dessus des nuages dans un ciel nocturne.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#08051e"/>
      <stop offset=".62" stop-color="#21104c"/>
      <stop offset="1" stop-color="#52317d"/>
    </linearGradient>
    <radialGradient id="horizon">
      <stop stop-color="#ffb331" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ae5dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffec8a"/>
      <stop offset=".3" stop-color="#f8a42a"/>
      <stop offset=".68" stop-color="#db4a22"/>
      <stop offset="1" stop-color="#73285e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c5ffff"/>
      <stop offset=".34" stop-color="#33d6ea"/>
      <stop offset=".72" stop-color="#315db9"/>
      <stop offset="1" stop-color="#31245d"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd1ed"/>
      <stop offset=".38" stop-color="#ec55b8"/>
      <stop offset=".78" stop-color="#792c91"/>
      <stop offset="1" stop-color="#33215d"/>
    </linearGradient>
    <filter id="light" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="balloon">
      <path d="M0-41C-21-41-34-24-32-5c1 15 11 26 19 34h26c8-8 18-19 19-34C34-24 21-41 0-41Z" fill="url(#amber)" stroke="#ffe0a2" stroke-opacity=".85" stroke-width="1.5"/>
      <path d="M0-40C-4-22-5 10 0 29M-16-34C-13-15-9 10-7 29M16-34C13-15 9 10 7 29" fill="none" stroke="#fff4c2" stroke-opacity=".55" stroke-width="1.5"/>
      <path d="M-25-27C-12-34 12-34 25-27M-31-8C-13-14 13-14 31-8M-26 12C-13 9 13 9 26 12" fill="none" stroke="#5d2557" stroke-opacity=".42" stroke-width="2"/>
      <path d="M-13 28-8 38M13 28 8 38" stroke="#f8d59e" stroke-width="1.4"/>
      <path d="M-10 38h20l-2 10h-16z" fill="#6d3c32" stroke="#ffd99d" stroke-width="1.2"/>
      <path d="M-7 41h14" stroke="#f7ad5d" stroke-opacity=".7"/>
    </g>
  </defs>
  <rect width="360" height="150" fill="url(#sky)"/>
  <ellipse cx="187" cy="118" rx="200" ry="83" fill="url(#horizon)"/>
  <g fill="#e4dcff" opacity=".8">
    <circle cx="18" cy="19" r="1"/><circle cx="47" cy="36" r=".8"/><circle cx="74" cy="13" r="1.2"/>
    <circle cx="111" cy="28" r=".8"/><circle cx="150" cy="16" r="1"/><circle cx="198" cy="30" r=".8"/>
    <circle cx="243" cy="15" r="1.1"/><circle cx="279" cy="33" r=".8"/><circle cx="333" cy="19" r="1.1"/>
    <circle cx="28" cy="76" r=".8"/><circle cx="324" cy="68" r="1"/><circle cx="297" cy="45" r=".7"/>
  </g>
  <path d="M0 123c24-13 38-9 57-3 19-20 45-19 61-4 18-17 42-14 55 3 19-14 40-12 55 1 17-17 42-18 60-2 21-12 46-9 72 3v32H0Z" fill="#574279" opacity=".78"/>
  <path d="M0 136c29-11 47-8 65 2 22-13 44-12 62 1 22-15 49-13 68 0 22-11 43-10 64 1 29-13 60-12 101 0v10H0Z" fill="#23143f"/>
  <path d="M92 124C91 91 116 71 145 50m84 73c2-37 18-60 39-82m-143 85c2-22 8-37 20-52" fill="none" stroke="#d7aaff" stroke-opacity=".42" stroke-width="1.3" stroke-dasharray="3 5"/>
  <g transform="translate(145 65) scale(.8)" opacity=".96">
    <use href="#balloon"/>
  </g>
  <g transform="translate(254 54) scale(.56)" opacity=".9">
    <path d="M0-41C-21-41-34-24-32-5c1 15 11 26 19 34h26c8-8 18-19 19-34C34-24 21-41 0-41Z" fill="url(#cyan)" stroke="#d6ffff" stroke-opacity=".9" stroke-width="1.5"/>
    <path d="M0-40C-4-22-5 10 0 29M-16-34C-13-15-9 10-7 29M16-34C13-15 9 10 7 29" fill="none" stroke="#e0ffff" stroke-opacity=".58" stroke-width="1.5"/>
    <path d="M-13 28-8 38M13 28 8 38" stroke="#f8d59e" stroke-width="1.4"/>
    <path d="M-10 38h20l-2 10h-16z" fill="#59404b" stroke="#d1fbff" stroke-width="1.2"/>
  </g>
  <g transform="translate(73 91) scale(.43)" opacity=".88">
    <path d="M0-41C-21-41-34-24-32-5c1 15 11 26 19 34h26c8-8 18-19 19-34C34-24 21-41 0-41Z" fill="url(#rose)" stroke="#ffe0f4" stroke-opacity=".9" stroke-width="1.5"/>
    <path d="M0-40C-4-22-5 10 0 29M-16-34C-13-15-9 10-7 29M16-34C13-15 9 10 7 29" fill="none" stroke="#ffe7f6" stroke-opacity=".6" stroke-width="1.5"/>
    <path d="M-13 28-8 38M13 28 8 38" stroke="#f8d59e" stroke-width="1.4"/>
    <path d="M-10 38h20l-2 10h-16z" fill="#593748" stroke="#ffd5ed" stroke-width="1.2"/>
  </g>
  <g fill="none" stroke="#fff0b0" stroke-linecap="round" filter="url(#light)">
    <path d="M147 108v5m-2.5-2.5h5" stroke-width="1.5"/>
    <path d="M257 81v4m-2-2h4" stroke-width="1.2"/>
    <path d="M74 111v4m-2-2h4" stroke-width="1.2"/>
  </g>
</svg>
