<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gryphon Agency — Mémoire du Cirque — TikTok Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Orbitron:wght@700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; overflow: hidden; background: #1a0033; font-family: Poppins, system-ui, sans-serif; color: #f5f0ff; user-select: none; }
        body { display: flex; }
        #stage { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh;
            background: radial-gradient(ellipse at 50% 35%, #ff3d8f 0%, #8a1a8f 45%, #2a0650 100%); }
        .tent { position: absolute; inset: 0 0 auto 0; height: 16vh; background: repeating-linear-gradient(90deg, #ffd23f 0 4vw, #e8312f 4vw 8vw); clip-path: polygon(0 0, 100% 0, 100% 70%, 97% 100%, 94% 70%, 91% 100%, 88% 70%, 85% 100%, 82% 70%, 79% 100%, 76% 70%, 73% 100%, 70% 70%, 67% 100%, 64% 70%, 61% 100%, 58% 70%, 55% 100%, 52% 70%, 49% 100%, 46% 70%, 43% 100%, 40% 70%, 37% 100%, 34% 70%, 31% 100%, 28% 70%, 25% 100%, 22% 70%, 19% 100%, 16% 70%, 13% 100%, 10% 70%, 7% 100%, 4% 70%, 1% 100%, 0 70%); filter: drop-shadow(0 6px 8px rgba(0,0,0,.5)); animation: sway 6s ease-in-out infinite alternate; transform-origin: top; }
        @keyframes sway { to { transform: skewX(.6deg); } }
        .beam { position: absolute; top: 0; width: 22vw; height: 100%; background: linear-gradient(180deg, rgba(255,255,200,.35), transparent 80%); clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); mix-blend-mode: screen; animation: beam 7s ease-in-out infinite alternate; transform-origin: 50% 0; }
        .beam.b1 { left: 4vw; } .beam.b2 { right: 4vw; animation-delay: -3s; animation-direction: alternate-reverse; }
        @keyframes beam { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
        .bulbs { position: absolute; top: 14.5vh; left: 0; right: 0; height: 12px; background: radial-gradient(circle, #fff7b0 0 3px, transparent 4px) 0 0 / 28px 12px repeat-x; animation: blink 1s steps(2) infinite; }
        @keyframes blink { 50% { filter: hue-rotate(160deg) brightness(.6); } }
        .title { position: relative; z-index: 2; margin-top: 11vh; font: 400 clamp(22px, 4.2vw, 56px) Rye, serif; color: #ffe27a; text-shadow: 0 3px 0 #a1141b, 0 0 18px rgba(255,200,60,.7); text-align: center; }
        #scoreboard { position: relative; z-index: 2; padding: 6px 18px; border: 2px solid #ffd36b; border-radius: 999px; background: rgba(20,0,45,.7); font: 800 clamp(13px, 1.7vw, 22px) Poppins, sans-serif; text-shadow: 2px 2px #000; }
        #scoreboard b { color: #ffd36b; }
        .grid { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(6, var(--cw)); gap: calc(var(--cw) * .12); --cw: min(11vw, 15vh, 130px); perspective: 900px; }
        .card { width: var(--cw); height: calc(var(--cw) * 1.25); position: relative; transform-style: preserve-3d; transition: transform .55s; }
        .card.up { transform: rotateY(180deg); }
        .card .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border: 4px solid #1a0033; border-radius: 12px; backface-visibility: hidden; font-size: calc(var(--cw) * .5); box-shadow: 0 6px 14px rgba(0,0,0,.45); }
        .card .back { background: repeating-linear-gradient(45deg, #e8312f 0 10px, #ffd23f 10px 20px); color: #1a0033; font: 400 calc(var(--cw) * .55) Rye, serif; }
        .card .front { background: #fff3c4; transform: rotateY(180deg); }
        .card.done .front { background: #b6ffcf; animation: pop .7s; }
        @keyframes pop { 40% { transform: rotateY(180deg) scale(1.2); } }
        .card.hint .back { filter: brightness(1.3); }
        .clowns { position: absolute; left: 0; right: 0; bottom: 1vh; height: 12vh; pointer-events: none; z-index: 3; }
        .clown { position: absolute; bottom: 0; font-size: clamp(36px, 8vh, 80px); animation: walk 16s linear infinite, hop .6s ease-in-out infinite alternate; }
        .clown:nth-child(2) { animation-duration: 22s, .5s; animation-delay: -8s, 0s; }
        .clown:nth-child(3) { animation-duration: 28s, .7s; animation-delay: -15s, 0s; }
        @keyframes walk { from { left: -10vw; } to { left: 110vw; } }
        @keyframes hop { to { margin-bottom: 14px; rotate: 8deg; } }
        .float { position: absolute; z-index: 6; font: 900 clamp(22px, 3vw, 44px) Orbitron, sans-serif; color: #ffe27a; text-shadow: 0 0 14px #ff9d00, 0 3px 0 #000; pointer-events: none; animation: rise 1.8s ease-out forwards; }
        @keyframes rise { to { transform: translateY(-90px) scale(1.3); opacity: 0; } }
        #board { position: absolute; z-index: 4; left: 10px; top: 20vh; width: 190px; padding: 8px 10px; border: 1px solid rgba(255,255,255,.25); border-radius: 12px; background: rgba(15,0,40,.7); font-size: 12px; }
        #board h4 { margin: 0 0 4px; color: #ffd36b; font: 900 11px Orbitron, sans-serif; }
        #board ol { margin: 0; padding-left: 20px; } #board li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .toast { position: fixed; z-index: 9; left: 16px; bottom: 16px; max-width: 70vw; padding: 8px 14px; border: 1px solid rgba(255,200,80,.6); border-radius: 12px; background: rgba(40,12,85,.88); font-size: 14px; opacity: 0; transform: translateY(14px); transition: .25s; pointer-events: none; }
        .toast.show { opacity: 1; transform: none; }
        .panel { flex: 0 0 300px; width: 300px; height: 100%; display: flex; flex-direction: column; border-left: 1px solid rgba(255,255,255,.2); background: rgba(15,6,38,.97); z-index: 5; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 11px; border-bottom: 1px solid rgba(255,255,255,.14); font: 900 11px Orbitron, sans-serif; letter-spacing: .06em; }
        .eye { width: 32px; height: 28px; border: 1px solid rgba(0,243,255,.5); border-radius: 8px; background: rgba(0,70,92,.4); color: #9dfaff; font-size: 16px; cursor: pointer; }
        .panel-body { overflow-y: auto; padding: 11px; display: grid; gap: 10px; align-content: start; }
        .panel.hidden-panel { flex-basis: 48px; width: 48px; }
        .panel.hidden-panel .panel-head { padding: 4px; border: 0; }
        .panel.hidden-panel .panel-title, .panel.hidden-panel .panel-body { display: none; }
        .box { display: grid; gap: 6px; padding: 9px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; background: rgba(255,255,255,.04); }
        .box h3 { margin: 0; color: #ffd36b; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
        .row { display: flex; gap: 6px; } .row > * { flex: 1; min-width: 0; }
        label { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11px; color: #cfc6ee; }
        label.check { justify-content: flex-start; cursor: pointer; } label.check input { width: auto; }
        input[type=text], input[type=number], input[type=url] { width: 100%; padding: 6px 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; background: rgba(0,0,0,.35); color: #fff; font: inherit; font-size: 12px; user-select: text; }
        input[type=range] { width: 100%; accent-color: #ff4fa3; }
        button.btn { min-height: 34px; padding: 6px 8px; border: 1px solid rgba(255,255,255,.25); border-radius: 9px; background: linear-gradient(135deg, #d6226f, #7b1fd1); color: #fff; font: 700 12px Poppins, sans-serif; cursor: pointer; }
        button.btn.alt { background: rgba(0,70,92,.7); border-color: #00f3ff; color: #aafaff; }
        button.btn.danger { background: #5a1b2b; border-color: #ff8d87; }
        .status { margin: 0; font-size: 11px; color: #b7ffcf; min-height: 15px; }
        .private-board { margin: 0; padding: 6px 8px 6px 26px; border-radius: 8px; background: rgba(0,0,0,.35); font-size: 12px; color: #ffe9a0; }
        .private-board[hidden] { display: none; }
        .qwin { container-type: inline-size; display: flex; flex-direction: column; border: 1px solid rgba(255,211,107,.45); border-radius: 12px; background: rgba(15,6,38,.96); overflow: hidden; }
        .qwin.docked { height: 220px; resize: vertical; min-height: 120px; }
        .qwin.floating { position: fixed; z-index: 30; resize: both; min-width: 200px; min-height: 140px; max-width: 95vw; max-height: 95vh; box-shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 18px rgba(255,211,107,.25); }
        .qhead { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: rgba(255,211,107,.12); font: 900 11px Orbitron, sans-serif; color: #ffd36b; letter-spacing: .06em; }
        .qwin.floating .qhead { cursor: move; touch-action: none; }
        .qhead span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .qhead button { border: 1px solid rgba(255,255,255,.25); border-radius: 7px; background: rgba(0,70,92,.5); color: #aafaff; font-size: 12px; padding: 3px 8px; cursor: pointer; }
        .qlist { flex: 1; margin: 0; padding: 6px 8px; list-style: none; overflow-y: auto; font-size: clamp(11px, 4.2cqw, 40px); }
        .qlist li { display: flex; align-items: center; gap: .5em; padding: .3em .5em; margin-bottom: .25em; border-radius: .6em; background: rgba(255,255,255,.06); }
        .qlist li.now { background: rgba(255,79,163,.28); border: 1px solid #ff4fa3; }
        .qlist .rank { color: #ffd36b; font-weight: 900; min-width: 1.6em; }
        .qlist .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
        .qlist .cnt { color: #b7ffcf; font-weight: 900; }
        .qempty { color: #cfc6ee; text-align: center; padding: 1em; }
    </style>
</head>
<body>
    <main id="stage" aria-label="Jeu de mémoire du cirque Gryphon Agency">
        <div class="tent"></div><div class="beam b1"></div><div class="beam b2"></div><div class="bulbs"></div>
        <h1 class="title">Mémoire du Cirque</h1>
        <div id="scoreboard" role="status">En attente d'un cadeau TikTok…</div>
        <div id="grid" class="grid"></div>
        <aside id="board" aria-label="Classement"><h4>🏆 CLASSEMENT</h4><ol id="board-list"></ol></aside>
        <div class="clowns" aria-hidden="true"><span class="clown">🤡</span><span class="clown">🎪</span><span class="clown">🤹</span></div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <aside id="panel" class="panel" aria-label="Panneau de contrôle du streamer">
        <header class="panel-head">
            <span class="panel-title">PANNEAU DE CONTRÔLE</span>
            <button id="eye" class="eye" type="button" aria-expanded="true" aria-label="Masquer le panneau">👁</button>
        </header>
        <div id="panel-body" class="panel-body">
            <section class="box">
                <h3>Vitesse du jeu</h3>
                <label for="speed">Retournement des cartes <output id="speed-out">1×</output></label>
                <input id="speed" type="range" min="0.5" max="4" step="0.25" value="1">
                <button id="speed-reset" class="btn alt" type="button">↺ Vitesse normale</button>
            </section>
            <div id="qwin" class="qwin docked" aria-label="File d'attente des joueurs">
                <div id="qhead" class="qhead"><span id="qtitle">⏳ FILE D'ATTENTE (0)</span><button id="qdock" type="button" aria-label="Détacher la file d'attente">⧉ Détacher</button></div>
                <ul id="qlist" class="qlist" aria-live="polite"></ul>
            </div>
            <section class="box">
                <h3>Connexion TikTok</h3>
                <input id="username" type="text" maxlength="32" placeholder="Pseudo TikTok" autocomplete="off">
                <input id="ws-url" type="url" value="wss://jeu6boite.onrender.com" aria-label="Adresse WebSocket">
                <button id="connect" class="btn" type="button">Connecter le live</button>
                <p id="live-status" class="status" role="status"></p>
            </section>
            <section class="box">
                <h3>Réglages</h3>
                <label for="chance">Chance de paire <output id="chance-out">50%</output></label>
                <input id="chance" type="range" min="0" max="100" step="1" value="50">
                <div class="row">
                    <label>Min ⭐<input id="star-min" type="number" min="1" max="30" value="1"></label>
                    <label>Max ⭐<input id="star-max" type="number" min="1" max="30" value="30"></label>
                </div>
                <label>Gros cadeau dès (pièces)<input id="big-gift" type="number" min="2" max="9999" value="100"></label>
                <button id="reshuffle" class="btn alt" type="button">🎲 Nouvelle donne</button>
            </section>
            <section class="box">
                <h3>Simulateur (sans étoiles réelles)</h3>
                <input id="sim-name" type="text" maxlength="24" value="Alex_TikTok 🚀" aria-label="Pseudo simulé">
                <div class="row"><button id="sim-gift" class="btn" type="button">🎁 1 pièce</button><button id="sim-burst" class="btn" type="button">💥 ×5</button></div>
                <button id="sim-big" class="btn" type="button">💎 Gros cadeau</button>
            </section>
            <section class="box">
                <h3>Partie</h3>
                <label class="check"><input id="hide-board" type="checkbox"> Masquer le classement à l'écran</label>
                <ol id="private-board" class="private-board" hidden></ol>
                <button id="reset-board" class="btn danger" type="button">Remettre à zéro le classement</button>
            </section>
        </div>
    </aside>

    <script>
        'use strict';
        const $ = id => document.getElementById(id);
        const SAVE_KEY = 'memoire-du-cirque-save';
        const ICONS = ['🎪', '🎩', '🍿', '💪', '🦁', '🐯', '🤹', '🎟️', '🚲'];
        const PAIRS = ICONS.length, TURNS_PER_SESSION = 15;
        const settings = { chance: 50, min: 1, max: 30, bigGift: 100, speed: 1, hideBoard: false };
        const viewers = new Map();
        const queue = [];
        let session = null, running = false, cards = [], rewards = [], jackpotPair = 0, matched = 0, current = null;

        const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
        const shuffle = list => { for (let i = list.length - 1; i > 0; i--) { const j = rand(0, i); [list[i], list[j]] = [list[j], list[i]]; } return list; };
        const sleep = ms => new Promise(r => setTimeout(r, ms / settings.speed));
        let toastTimer;
        function say(text) { const t = $('toast'); t.textContent = text; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

        function getViewer(raw) {
            const username = String(raw || 'Spectateur').replace(/^@/, '').trim().slice(0, 32) || 'Spectateur';
            const key = username.toLowerCase();
            if (!viewers.has(key)) viewers.set(key, { username, stars: 0 });
            return viewers.get(key);
        }

        /* 90 % des paires valent le minimum, une seule paire (≈10 %) est un jackpot réservé aux gros cadeaux */
        function assignRewards() {
            const lo = Math.max(1, Math.min(settings.min, settings.max)), hi = Math.max(lo, settings.max);
            jackpotPair = rand(0, PAIRS - 1);
            rewards = Array.from({ length: PAIRS }, (_, i) => i === jackpotPair && hi > lo ? rand(lo + 1, hi) : lo);
        }

        function deal() {
            const grid = $('grid');
            grid.textContent = '';
            matched = 0;
            assignRewards();
            const deck = shuffle(ICONS.flatMap((icon, pair) => [{ icon, pair }, { icon, pair }]));
            cards = deck.map((d, i) => {
                const el = document.createElement('div');
                el.className = 'card';
                el.innerHTML = '<div class="face back">?</div><div class="face front"></div>';
                el.querySelector('.front').textContent = d.icon;
                grid.appendChild(el);
                return { el, icon: d.icon, pair: d.pair, done: false, index: i };
            });
        }

        function enqueue(viewer, coins, sim) {
            coins = Math.min(500, Math.max(1, Math.floor(coins)));
            let entry = queue.find(q => q.viewer === viewer && q.sim === sim) || (session && session.entry.viewer === viewer && session.entry.sim === sim ? session.entry : null);
            if (!entry) {
                if (queue.length >= 80) return;
                entry = { viewer, sim, credits: 0, jackpots: 0 };
                queue.push(entry);
            }
            entry.credits += coins;
            if (coins >= settings.bigGift) entry.jackpots++;
            runLoop();
        }

        async function runLoop() {
            if (running) return;
            running = true;
            try {
                while (queue.length || (session && session.left > 0)) {
                    if (!session || session.left <= 0) {
                        const entry = queue.shift();
                        session = { entry, size: Math.min(TURNS_PER_SESSION, entry.credits), left: Math.min(TURNS_PER_SESSION, entry.credits), k: 0 };
                    }
                    const { entry } = session;
                    session.k++; session.left--; entry.credits--;
                    const jackpot = entry.jackpots > 0;
                    if (jackpot) entry.jackpots--;
                    current = entry.viewer;
                    updateScoreboard();
                    await playTurn(entry, jackpot);
                    if (session.left <= 0) {
                        if (entry.credits > 0) queue.push(entry);
                        session = null;
                    }
                }
            } finally {
                running = false; current = null; session = null;
                updateScoreboard();
            }
        }

        function flip(card, up) { card.el.classList.toggle('up', up); }

        async function playTurn(entry, jackpot) {
            const open = cards.filter(c => !c.done);
            if (open.length < 2) { deal(); return playTurn(entry, jackpot); }
            const target = jackpot ? open.find(c => c.pair === jackpotPair) : null;
            const normal = open.filter(c => c.pair !== jackpotPair);
            const a = target || shuffle((normal.length >= 2 ? normal : open).slice())[0];
            const partner = open.find(c => c.pair === a.pair && c !== a);
            const others = open.filter(c => c !== a && c !== partner);
            const win = !others.length || Math.random() * 100 < settings.chance;
            const b = win ? partner : others[rand(0, others.length - 1)];

            flip(a, true); await sleep(650);
            flip(b, true); await sleep(1100);

            if (win) {
                a.done = b.done = true;
                a.el.classList.add('done'); b.el.classList.add('done');
                matched++;
                const reward = rewards[a.pair];
                entry.viewer.stars += reward;
                if (!entry.sim && window.ArcadeStars) {
                    window.ArcadeStars.award({ username: entry.viewer.username, amount: reward })
                        .catch(error => { console.error('Étoiles non enregistrées :', error); say('Étoiles non enregistrées : ' + error.message); });
                }
                floatText(`+${reward} ⭐`, b.el);
                say(`🎉 ${entry.viewer.username} trouve une paire : ${reward} ⭐`);
                updateScoreboard(); saveGame();
                await sleep(900);
                if (matched >= PAIRS) {
                    say('🎪 Toutes les paires sont trouvées ! Nouvelle donne…');
                    await sleep(1800);
                    cards.forEach(c => flip(c, false));
                    await sleep(700);
                    deal();
                }
            } else {
                flip(a, false); flip(b, false);
                await sleep(700);
            }
        }

        function floatText(text, anchor) {
            const r = anchor.getBoundingClientRect(), s = $('stage').getBoundingClientRect();
            const el = document.createElement('div');
            el.className = 'float'; el.textContent = text;
            el.style.left = (r.left - s.left) + 'px'; el.style.top = (r.top - s.top) + 'px';
            $('stage').appendChild(el);
            setTimeout(() => el.remove(), 1900);
        }

        function updateScoreboard() {
            const sb = $('scoreboard');
            if (current && session) sb.innerHTML = `Joueur : <b></b> | Paires : ${matched}/${PAIRS} | Tour ${session.k}/${session.size}`;
            else sb.innerHTML = `En attente d'un cadeau TikTok… | Paires : ${matched}/${PAIRS}`;
            if (current && session) sb.querySelector('b').textContent = '@' + current.username;
        }

        function topViewers(n) { return [...viewers.values()].filter(v => v.stars > 0).sort((a, b) => b.stars - a.stars).slice(0, n); }
        function fillList(ol, list) {
            ol.textContent = '';
            for (const v of list) { const li = document.createElement('li'); li.textContent = `@${v.username} — ${v.stars} ⭐`; ol.appendChild(li); }
        }
        function refreshBoards() {
            $('board').hidden = settings.hideBoard;
            $('private-board').hidden = !settings.hideBoard;
            if (settings.hideBoard) fillList($('private-board'), topViewers(10));
            else fillList($('board-list'), topViewers(5));
        }

        /* ---------- TikTok ---------- */
        let socket = null, reconnectTimer = null;
        const setStatus = m => { $('live-status').textContent = m; };
        function coinsOf(g) {
            const d = Math.max(1, Math.floor(Number(g.diamondCount ?? g.diamonds) || 1));
            const r = Math.max(1, Math.floor(Number(g.repeatCount) || 1));
            return d * r;
        }
        function handleMessage(data) {
            if (data.type === 'STATUS') setStatus(data.message || 'Statut TikTok reçu.');
            else if (data.type === 'gift' || data.type === 'tiktok-gift') {
                const g = data.gift ?? data;
                enqueue(getViewer(g.username || g.nickname), coinsOf(g), false);
            }
        }
        function connect() {
            const name = $('username').value.trim().replace(/^@/, ''), url = $('ws-url').value.trim();
            if (!name || !url) { setStatus('Pseudo TikTok et adresse requis.'); return; }
            clearTimeout(reconnectTimer);
            if (socket) { socket.onclose = null; socket.close(); }
            try { socket = new WebSocket(url); } catch (e) { setStatus('Adresse invalide.'); return; }
            const active = socket;
            setStatus(`Connexion au live de @${name}…`);
            active.addEventListener('open', () => active.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username: name })));
            active.addEventListener('message', ev => { try { handleMessage(JSON.parse(ev.data)); } catch (e) { console.warn('Message invalide', e); } });
            active.addEventListener('error', () => setStatus('Connexion impossible.'));
            active.addEventListener('close', () => { if (socket !== active) return; setStatus('Reconnexion…'); reconnectTimer = setTimeout(connect, 3000); });
        }
        /* RUN : le serveur a déjà débité le portefeuille global, une étoile = un essai */
        window.addEventListener('arcade:wallet-run', e => {
            const p = e.detail && e.detail.player, spent = Math.floor(Number(e.detail && e.detail.spent) || 0);
            const name = p && (p.username || p.uniqueId || p.nickname);
            if (name && spent > 0) enqueue(getViewer(name), spent, false);
        });

        /* ---------- Sauvegarde ---------- */
        function saveGame() {
            try { localStorage.setItem(SAVE_KEY, JSON.stringify({ settings, username: $('username').value, wsUrl: $('ws-url').value, viewers: [...viewers.values()] })); } catch (e) { }
        }
        function loadGame() {
            try {
                const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
                if (!s) return;
                Object.assign(settings, s.settings || {});
                if (s.username) $('username').value = s.username;
                if (s.wsUrl) $('ws-url').value = s.wsUrl;
                for (const v of s.viewers || []) getViewer(v.username).stars = Number(v.stars) || 0;
            } catch (e) { }
        }

        /* ---------- Interface ---------- */
        function syncControls() {
            $('speed').value = settings.speed; $('speed-out').textContent = settings.speed + '×';
            $('chance').value = settings.chance; $('chance-out').textContent = settings.chance + '%';
            $('star-min').value = settings.min; $('star-max').value = settings.max; $('big-gift').value = settings.bigGift;
            $('hide-board').checked = settings.hideBoard;
        }
        function bindUi() {
            $('connect').addEventListener('click', () => { connect(); saveGame(); });
            const sim = n => enqueue(getViewer($('sim-name').value.trim() || 'Spectateur démo'), n, true);
            $('sim-gift').addEventListener('click', () => sim(1));
            $('sim-burst').addEventListener('click', () => sim(5));
            $('sim-big').addEventListener('click', () => sim(Math.max(1, settings.bigGift)));
            $('speed').addEventListener('input', e => { settings.speed = Number(e.target.value) || 1; syncControls(); saveGame(); });
            $('speed-reset').addEventListener('click', () => { settings.speed = 1; syncControls(); saveGame(); });
            $('chance').addEventListener('input', e => { settings.chance = Math.min(100, Math.max(0, Number(e.target.value) || 0)); syncControls(); saveGame(); });
            const stars = () => {
                settings.min = Math.min(30, Math.max(1, Math.floor(Number($('star-min').value) || 1)));
                settings.max = Math.min(30, Math.max(settings.min, Math.floor(Number($('star-max').value) || settings.min)));
                if (!cards.some(c => c.done)) assignRewards();
                else rewards = rewards.map((r, i) => i === jackpotPair && settings.max > settings.min ? rand(settings.min + 1, settings.max) : settings.min);
                saveGame();
            };
            $('star-min').addEventListener('input', stars); $('star-max').addEventListener('input', stars);
            $('big-gift').addEventListener('input', e => { settings.bigGift = Math.max(2, Math.floor(Number(e.target.value) || 100)); saveGame(); });
            $('reshuffle').addEventListener('click', () => { if (!running) deal(); else say('Une partie est en cours.'); });
            $('hide-board').addEventListener('change', e => { settings.hideBoard = e.target.checked; refreshBoards(); saveGame(); });
            $('reset-board').addEventListener('click', () => { if (confirm('Remettre le classement à zéro ?')) { viewers.forEach(v => { v.stars = 0; }); refreshBoards(); saveGame(); } });
            $('eye').addEventListener('click', () => {
                const hidden = $('panel').classList.toggle('hidden-panel');
                $('eye').setAttribute('aria-expanded', String(!hidden));
            });
            document.addEventListener('keydown', e => { if (e.code === 'Space' && !/INPUT|BUTTON/.test(e.target.tagName)) { e.preventDefault(); sim(1); } });
        }

        function bindQueueWindow() {
            const win = $('qwin'), head = $('qhead'), list = $('qlist'), btn = $('qdock'), home = $('panel-body');
            const KEY = 'memoire-du-cirque-queue-win';
            const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));
            let geo = { floating: false, x: 40, y: 80, w: 320, h: 380 };
            try { geo = Object.assign(geo, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { }
            const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(geo)); } catch (e) { } };
            function applyGeo() {
                geo.w = clamp(geo.w, 200, innerWidth - 10); geo.h = clamp(geo.h, 140, innerHeight - 10);
                geo.x = clamp(geo.x, 0, innerWidth - geo.w); geo.y = clamp(geo.y, 0, innerHeight - 40);
                Object.assign(win.style, { left: geo.x + 'px', top: geo.y + 'px', width: geo.w + 'px', height: geo.h + 'px' });
            }
            function setFloating(on) {
                geo.floating = on;
                win.classList.toggle('floating', on); win.classList.toggle('docked', !on);
                if (on) { document.body.appendChild(win); applyGeo(); btn.textContent = '⇲ Rattacher'; }
                else { home.children[0] ? home.children[0].after(win) : home.prepend(win); Object.assign(win.style, { left: '', top: '', width: '', height: '' }); btn.textContent = '⧉ Détacher'; }
                persist();
            }
            btn.addEventListener('click', () => setFloating(!geo.floating));
            head.addEventListener('pointerdown', e => {
                if (!geo.floating || e.target === btn) return;
                const dx = e.clientX - geo.x, dy = e.clientY - geo.y;
                head.setPointerCapture(e.pointerId);
                const move = ev => { geo.x = ev.clientX - dx; geo.y = ev.clientY - dy; applyGeo(); };
                const up = () => { head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up); persist(); };
                head.addEventListener('pointermove', move); head.addEventListener('pointerup', up);
            });
            new ResizeObserver(() => {
                if (!geo.floating) return;
                const r = win.getBoundingClientRect();
                if (Math.abs(r.width - geo.w) > 1 || Math.abs(r.height - geo.h) > 1) { geo.w = r.width; geo.h = r.height; persist(); }
            }).observe(win);
            addEventListener('resize', () => geo.floating && applyGeo());

            let lastSig = null;
            function refresh() {
                const rows = [];
                if (session && current) rows.push({ now: true, viewer: session.entry.viewer, tag: `${session.k}/${session.size}` });
                for (const q of queue) rows.push({ viewer: q.viewer, tag: '×' + q.credits, n: q.credits });
                const sig = rows.map(r => (r.now ? '*' : '') + r.viewer.username + r.tag).join('|');
                if (sig === lastSig) return;
                lastSig = sig;
                $('qtitle').textContent = `⏳ FILE D'ATTENTE (${queue.length})`;
                list.textContent = '';
                if (!rows.length) { const li = document.createElement('li'); li.className = 'qempty'; li.textContent = 'Aucun joueur en attente'; list.appendChild(li); return; }
                let rank = 0;
                for (const r of rows) {
                    const li = document.createElement('li');
                    if (r.now) li.className = 'now';
                    const a = document.createElement('span'); a.className = 'rank'; a.textContent = r.now ? '▶' : '#' + (++rank);
                    const b = document.createElement('span'); b.className = 'name'; b.textContent = '@' + r.viewer.username;
                    li.append(a, b);
                    if (r.now || r.n > 1) { const c = document.createElement('span'); c.className = 'cnt'; c.textContent = r.tag; li.appendChild(c); }
                    list.appendChild(li);
                }
            }
            setInterval(refresh, 200); refresh();
            if (geo.floating) setFloating(true);
        }

        loadGame();
        syncControls();
        deal();
        bindUi();
        bindQueueWindow();
        refreshBoards();
        setInterval(refreshBoards, 500);
        updateScoreboard();
    </script>
</body>
</html>
