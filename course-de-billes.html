<style>

#banner h2 { margin: 0; font: 900 clamp(40px, 12vh, 140px) Impact, Arial; color: #fbbf24; text-shadow: 0 0 4vh rgba(251,191,36,.7); }
#banner img, #banner .ph { width: 26vh; height: 26vh; border-radius: 50%; border: 1vh solid #fbbf24; object-fit: cover; box-shadow: 0 0 5vh rgba(251,191,36,.8); margin: 1vh auto; display: grid; place-items: center; font: 900 12vh Arial; }
#banner .name { font: 900 clamp(26px, 7vh, 80px) Arial; }
#banner .podium { margin-top: 1.5vh; font-size: 3vh; color: #cbd5e1; }
.tk { grid-column: 1 / -1; background: rgba(15,23,42,.9); border: .2vh solid #334c7a; border-radius: 1vh; padding: 1vh .8vw; font-size: 1.8vh; }
.tk header { display: flex; align-items: center; gap: .8vw; margin-bottom: .8vh; font-weight: 800; }
.dot { width: 1.4vh; height: 1.4vh; border-radius: 50%; background: #10b981; box-shadow: 0 0 1vh #10b981; flex: none; }
.dot.off { background: #6b7280; box-shadow: none; } .dot.wait { background: #f59e0b; box-shadow: 0 0 1vh #f59e0b; }
.tk .row { display: flex; gap: .5vw; }
.tk input { flex: 1; min-width: 0; padding: .9vh .6vw; border-radius: .8vh; border: .2vh solid #475569; background: #0f172a; color: #fff; font-size: 2vh; font-weight: 700; }
.tk small { display: block; margin-top: .6vh; color: #94a3b8; }
button { cursor: pointer; border: none; border-radius: .8vh; padding: 1vh 1.2vw; font: 800 2vh Arial; background: #38bdf8; color: #06202e; }
button.alt { background: #334155; color: #fff; }
button:active { transform: scale(.96); }
#panel { position: fixed; z-index: 10; right: 1.2vw; bottom: 6vh; width: min(380px, 80vw); background: rgba(10,16,32,.94); border: .25vh solid #334c7a; border-radius: 1.4vh; padding: 1.2vh 1vw; display: grid; grid-template-columns: 1fr 1fr; gap: .8vh; }
#panel h5 { grid-column: 1 / -1; margin: 0; color: #fbbf24; font-size: 2vh; cursor: move; user-select: none; }
#panel button { font-size: 1.8vh; }
#panel .wide { grid-column: 1 / -1; }

#start button { font-size: 4vh; padding: 2.4vh 4vw; background: #f43f5e; color: #fff; }

<body>

<div class="hud" id="board"><h4>🏆 CLASSEMENT</h4><div id="board-list"></div></div>

<div id="panel">
    <h5 id="panel-handle">⚙ Contrôle (déplaçable)</h5>

<div id="start"><div style="text-align:center"><h1 style="font:900 7vh Impact;color:#38bdf8;margin:0 0 2vh">COURSE DE BILLES</h1><p>1 pièce = la bille accélère · 5 pièces = la bille en tête est éjectée.<br>La voix de l'IA annonce le départ et l'arrivée.</p><button id="start-btn" type="button">▶ LANCER</button></div></div>

<script src="/matter.min.js"></script>
<script>
if (typeof Matter === 'undefined') {
    document.write('<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"><\/script>');
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if (typeof THREE === 'undefined') {
    document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');
}
</script>
<script>
const { Engine, Bodies, Body, Composite, Events } = Matter;
const $ = id => document.getElementById(id);
const WS_URL = 'wss://jeu6boite.onrender.com';

/* ---------- Parcours ---------- */
const W = 2000, WALL_TOP = -1800;
let FINISH = 9300;
const R = 26;

/* Réglages modifiables depuis le panneau de commande (course-de-billes-controle.html) */
const DEFAULTS = {
    gravity: 2.2, maxSpeed: 50, levels: 28, spacing: 520, rampAngle: 0.11,
    mud: true, mudSlow: 0.9, pegs: true, spinners: true, spinSpeed: 0.04,
    likePower: 1, likesJoin: true, giftBoost: 14, videoUrl: '', videoDim: 0.35, bgFx: true
};
let CFG = { ...DEFAULTS };
try { Object.assign(CFG, JSON.parse(localStorage.getItem('cb-config') || '{}')); } catch (e) { /* réglages ignorés */ }

const engine = Engine.create();
engine.gravity.y = CFG.gravity;
const world = engine.world;
const statics = [];   // { body, kind, seg }
const segs = [];      // segments indépendants : { y0, y1, items, on }
let curSeg = -1;
const spinners = [];
const mudZones = [];
let track3dDirty = true;

function addStatic(body, kind, opts = {}) {
    body.isStatic = true;
    Body.set(body, { restitution: opts.restitution ?? 0.3, friction: 0.02, frictionStatic: 0 });
    Composite.add(world, body);
    const s = { body, kind, seg: curSeg };
    statics.push(s);
    if (curSeg >= 0) segs[curSeg].items.push(s);
    return body;
}
/* Seuls les segments proches des billes sont actifs dans le moteur physique (et affichés en 3D) */
function updateSegments() {
    let lo = Infinity, hi = -Infinity;
    for (const m of marbles.values()) if (!m.ejected) { lo = Math.min(lo, m.body.position.y); hi = Math.max(hi, m.body.position.y); }
    if (lo === Infinity) { lo = 0; hi = 0; }
    lo -= 1500; hi += 2400;
    for (const sg of segs) {
        const on = sg.y1 > lo && sg.y0 < hi;
        if (on === sg.on) continue;
        for (const it of sg.items) on ? Composite.add(world, it.body) : Composite.remove(world, it.body);
        sg.on = on;
    }
}
const boostZones = [];
function rail(x1, y1, x2, y2, kind = 'rail', thick = 24, ext = 0) {
    const len = Math.hypot(x2 - x1, y2 - y1) + ext;
    return addStatic(Bodies.rectangle((x1 + x2) / 2, (y1 + y2) / 2, len, thick, { angle: Math.atan2(y2 - y1, x2 - x1) }), kind, { restitution: 0.1 });
}
/* Surface lisse : courbe en U (pente forte au départ qui s'adoucit jusqu'à l'horizontale), faite de petits segments jointifs */
function swoop(x1, y1, x2, H, n = 14) {
    let px = x1, py = y1;
    for (let i = 1; i <= n; i++) {
        const t = i / n, x = x1 + (x2 - x1) * t, y = y1 + H * (0.25 * t + 0.75 * (1 - (1 - t) * (1 - t)));
        rail(px, py, x, y, 'ramp', 26, 6);
        px = x; py = y;
    }
}
const loopZones = [];
function prop(x, y, speed, r = 34) {
    const b = addStatic(Bodies.circle(x, y, r), 'prop', { restitution: 0.9 });
    b.label = 'prop'; b.propDir = speed > 0 ? 1 : -1;
    spinners.push({ body: b, speed });
    return b;
}
function bumper(x, y, r = 40) {
    const b = addStatic(Bodies.circle(x, y, r), 'bumper', { restitution: 1 });
    b.label = 'bumper';
    return b;
}
Events.on(engine, 'collisionStart', ev => {
    for (const p of ev.pairs) {
        const isB = x => x.label === 'bumper' || x.label === 'prop';
        const bump = isB(p.bodyA) ? p.bodyA : isB(p.bodyB) ? p.bodyB : null;
        const ball = bump === p.bodyA ? p.bodyB : p.bodyA;
        if (!bump || ball.label !== 'marble') continue;
        const dx = ball.position.x - bump.position.x, dy = ball.position.y - bump.position.y, l = Math.hypot(dx, dy) || 1;
        if (bump.label === 'prop') {
            // hélice : pousse selon le côté touché et le sens de rotation, donc en avant ou en arrière
            const dir = bump.propDir || 1;
            Body.setVelocity(ball, { x: ball.velocity.x + dx / l * 5 - dy / l * 7 * dir, y: ball.velocity.y + dy / l * 5 + dx / l * 7 * dir + 1.5 });
        } else Body.setVelocity(ball, { x: ball.velocity.x + dx / l * 7, y: ball.velocity.y + dy / l * 7 });
    }
});
/* Toboggan principal tout droit, avec bifurcations latérales qui se rejoignent plus bas.
   Un module = 4 × spacing : sortie vers un couloir latéral, virages lisses dans le couloir central, bumpers, pale, retour, zone d'accélération. */
function buildTrack() {
    for (const s of statics) Composite.remove(world, s.body);
    statics.length = 0; segs.length = 0; curSeg = -1; spinners.length = 0; loopZones.length = 0; mudZones.length = 0; boostZones.length = 0; track3dDirty = true;
    const qm = parseInt(new URLSearchParams(location.search).get('modules'), 10);
    const mods = qm > 0 ? Math.min(qm, 14) : Math.max(1, Math.min(14, Math.round(CFG.levels / 4)));
    const S = Math.max(480, CFG.spacing), TOP = 700, CW = 360, MID = W / 2;
    FINISH = TOP + mods * 4 * S + 300;
    const wallH = FINISH + 700 - WALL_TOP;
    const wallY = WALL_TOP + wallH / 2;
    addStatic(Bodies.rectangle(-20, wallY, 40, wallH), 'wall');
    addStatic(Bodies.rectangle(W + 20, wallY, 40, wallH), 'wall');
    addStatic(Bodies.rectangle(W / 2, FINISH + 700, W + 80, 60), 'wall');
    // entonnoirs de départ vers le toboggan central
    swoop(0, 330, MID - 330, 360);
    swoop(W, 330, MID + 330, 360);
    const LH = 170;
    for (let m = 0; m < mods; m++) {
        const y0 = TOP + m * 4 * S;
        segs.push({ y0, y1: y0 + 4 * S + 300, items: [], on: true }); curSeg = m;
        for (const sx of [-1, 1]) {
            const px = d => MID + sx * d;
            // parois du couloir central, avec une sortie (0.5–1.2) et un retour (2.7–3.4)
            for (const [a, b] of [[0, 0.5], [1.2, 2.7], [3.4, 4]]) rail(px(CW + 12), y0 + a * S, px(CW + 12), y0 + b * S);
            // aiguillage lisse qui pousse une partie des billes vers la sortie
            rail(px(250), y0 + 0.5 * S, px(CW), y0 + 1.1 * S, 'ramp', 20);
            // couloir latéral : toboggans A (vers l'extérieur), B (vers l'intérieur), C, puis D qui ramène dans le couloir central
            swoop(px(CW + 20), y0 + 1.45 * S, px(930), LH);
            swoop(px(990), y0 + 2.9 * S, px(250), 200);
            for (const y1 of [y0 + 1.45 * S]) {
                boostZones.push({ x: px(655) - 150, y: y1 + LH * 0.75 - 110, w: 300, h: 140, dx: sx * 0.9, dy: 0.35, ang: sx * 0.31, len: 300, cx: px(655), cy: y1 + LH * 0.75 - 14 });
            }
            if (CFG.spinners) prop(px(780), y0 + 1.95 * S, sx * 0.07);
            if (CFG.pegs) { bumper(px(700), y0 + 1.2 * S, 34); bumper(px(640), y0 + 3.2 * S, 34); bumper(px(560), y0 + 1.75 * S, 30); bumper(px(800), y0 + 2.25 * S, 30); bumper(px(560), y0 + 2.7 * S, 30); }
        }
        if (CFG.pegs) { bumper(MID - 110, y0 + 0.8 * S, 30); bumper(MID + 110, y0 + 0.8 * S, 30); }
        // diviseur en V en haut du module : les billes partent à gauche ou à droite selon l'impact
        rail(MID, y0 + 0.12 * S, MID - 140, y0 + 0.32 * S, 'ramp', 22);
        rail(MID, y0 + 0.12 * S, MID + 140, y0 + 0.32 * S, 'ramp', 22);
        // rouleau (looping) : entonnoir puis tube dans lequel les billes tournent et repartent en avant
        {
            const zy = y0 + 1.25 * S, TW = 200;
            rail(MID - CW + 12, zy, MID - TW, zy + 120, 'ramp', 20);
            rail(MID + CW - 12, zy, MID + TW, zy + 120, 'ramp', 20);
            rail(MID - TW, zy + 100, MID - TW, zy + 440, 'wall', 20);
            rail(MID + TW, zy + 100, MID + TW, zy + 440, 'wall', 20);
            loopZones.push({ x: MID - TW, y: zy + 120, w: TW * 2, h: 320, seg: curSeg });
        }
        if (CFG.spinners) { prop(MID, y0 + 0.65 * S, m % 2 ? 0.08 : -0.08); prop(MID - 215, y0 + 2.75 * S, 0.08, 30); prop(MID + 215, y0 + 2.75 * S, -0.08, 30); }
        if (CFG.pegs) { bumper(MID - 90, y0 + 0.95 * S, 26); bumper(MID + 90, y0 + 0.95 * S, 26); bumper(MID - 260, y0 + 2.95 * S, 26); bumper(MID + 260, y0 + 2.95 * S, 26); }
        if (CFG.pegs) {
            bumper(MID - 150, y0 + 2.45 * S, 36); bumper(MID + 150, y0 + 2.45 * S, 36);
            bumper(MID, y0 + 3.0 * S, 46);
        }
        if (CFG.spinners) {
            const sp = addStatic(Bodies.rectangle(MID, y0 + 2.15 * S, 300, 18), 'spinner');
            spinners.push({ body: sp, speed: m % 2 ? -CFG.spinSpeed : CFG.spinSpeed });
        }
        // zone d'accélération dans le couloir principal
        boostZones.push({ x: MID - CW, y: y0 + 3.45 * S, w: CW * 2, h: 0.45 * S, dx: 0, dy: 1, ang: Math.PI / 2, len: 0.45 * S, cx: MID, cy: y0 + 3.675 * S });
    }
    curSeg = -1;
}
buildTrack();
const gate = Bodies.rectangle(W / 2, 20, W, 30, { isStatic: true });
Composite.add(world, gate);
let gateOn = true;

/* ---------- Voix ---------- */
let muted = false;
function say(text) {
    if (muted || !('speechSynthesis' in window)) return;
    try {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'fr-FR'; u.rate = 1.05;
        const v = speechSynthesis.getVoices().find(v => /^fr/i.test(v.lang));
        if (v) u.voice = v;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
    } catch (e) { /* voix indisponible */ }
}
function setMuted(m) { muted = m; $('b-mute').textContent = muted ? '🔇 Voix coupée (M)' : '🔊 Voix (M)'; if (muted && 'speechSynthesis' in window) speechSynthesis.cancel(); }

/* ---------- Billes ---------- */
const marbles = new Map(); // id -> marble
const avatarCache = new Map(); // id -> Image
let finishedList = [];
function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function loadAvatar(id, src) {
    if (!src) return;
    const img = new Image();
    img.onload = () => avatarCache.set(id, img);
    img.src = src;
}
function toast(text, cls = '') {
    const d = document.createElement('div');
    d.className = cls; d.textContent = text;
    $('feed').appendChild(d);
    while ($('feed').children.length > 4) $('feed').firstChild.remove();
    setTimeout(() => d.remove(), 6000);
}
function addMarble(id, name, pic) {
    if (pic) loadAvatar(id, pic);
    let m = marbles.get(id);
    if (m && !m.ejected) return m;
    const body = Bodies.circle(40 + Math.random() * (W - 80), -50 - Math.random() * 300, R, {
        restitution: 0.2, friction: 0.01, frictionStatic: 0, frictionAir: 0.0012, density: 0.0012, label: 'marble'
    });
    m = { id, name, body, h: hue(id), boostUntil: 0, finished: false, ejected: false, ejectedAt: 0, rank: 0, stuck: 0, trail: [], like: 0 };
    marbles.set(id, m);
    Composite.add(world, body);
    toast(`${name} entre en piste`);
    scheduleAutoStart();
    return m;
}
function removeMarble(m) {
    Composite.remove(world, m.body);
    marbles.delete(m.id);
}
const racers = () => [...marbles.values()].filter(m => !m.ejected && !m.finished);
function allActive() { return [...marbles.values()].filter(m => !m.ejected); }

/* ---------- Cadeaux ---------- */
function boost(m, times = 1) {
    if (!m || m.ejected || m.finished) return;
    m.boostUntil = Math.max(performance.now(), m.boostUntil) + 2500 * Math.min(times, 5);
    if (phase === 'race') Body.setVelocity(m.body, { x: m.body.velocity.x, y: m.body.velocity.y + CFG.giftBoost });
    toast(`🚀 ${m.name} accélère !`, 'boost');
}
function eject(by) {
    const cand = racers().filter(m => m !== by).sort((a, b) => b.body.position.y - a.body.position.y);
    const t = cand[0];
    if (!t) return;
    t.ejected = true; t.ejectedAt = performance.now();
    t.body.collisionFilter.mask = 0;
    const dir = t.body.position.x < W / 2 ? -1 : 1;
    Body.setVelocity(t.body, { x: dir * 26, y: -24 });
    Body.setAngularVelocity(t.body, dir * 0.5);
    toast(`💥 ${t.name} est éjecté${by ? ' par ' + by.name : ''} !`, 'eject');
    say(`${t.name} est éjecté !`);
}
function onGift(info, coins, repeat) {
    const m = addMarble(info.id, info.name, info.pic);
    if (coins >= 5) { for (let i = 0; i < Math.min(repeat, 3); i++) eject(m); }
    else boost(m, repeat);
}
// Chaque tapotement (like) charge l'énergie de la bille ; elle se vide progressivement
let lastLikeToast = 0;
function onLike(id, name, count) {
    let m = marbles.get(id);
    if (!m || m.ejected) {
        if (!CFG.likesJoin || phase === 'race' || phase === 'done') return;
        m = addMarble(id, name, '');
    }
    if (m.finished) return;
    m.like = Math.min(60, m.like + count * CFG.likePower);
    fxPulse = Math.min(1, fxPulse + 0.15);

/* ---------- Phases ---------- */
let phase = 'lobby';       // lobby | count | race | done
let trackDirty = false;
let autoStartAt = 0, winnerTimer = 0, raceStartedAt = 0;
function scheduleAutoStart() {
    if (phase !== 'lobby' || autoStartAt || marbles.size < 2) return;
    autoStartAt = performance.now() + 30000;
}

    if (phase !== 'lobby' || marbles.size < 1) { toast('Il faut au moins 1 bille.'); return; }
    phase = 'count'; autoStartAt = 0;
    let n = 3;
    const step = () => {
        if (phase !== 'count') return;
        if (n > 0) { showBig(String(n)); say(String(n)); n--; setTimeout(step, 1000); }
        else { showBig('GO !'); say('Go !'); Composite.remove(world, gate); gateOn = false; phase = 'race'; raceStartedAt = performance.now(); }
    };
    step();
}
function showBig(t) { const b = $('big'); b.textContent = t; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); setTimeout(() => b.classList.remove('show'), 900); }
function finishMarble(m) {
    m.finished = true; m.rank = finishedList.length + 1; finishedList.push(m);
    if (m.rank === 1) {
        phase = 'done'; winnerTimer = performance.now() + 14000;
        say(`Finish ! Bravo ${m.name} !`);
    }
    updateBanner();
}
function avatarHtml(m) {
    const img = avatarCache.get(m.id);
    return img ? `<img src="${img.src}" alt="">` : `<div class="ph" style="background:hsl(${m.h} 70% 45%)">${(m.name[0] || '?').toUpperCase()}</div>`;
}
function updateBanner() {

    $('banner-name').textContent = '@' + w.name;
    $('banner-podium').textContent = finishedList.slice(0, 3).map((m, i) => ['🥇', '🥈', '🥉'][i] + ' ' + m.name).join('   ');
}
function resetRace() {

    for (const m of [...marbles.values()]) removeMarble(m);
    finishedList = [];
    if (!gateOn) { Composite.add(world, gate); gateOn = true; }
    phase = 'lobby'; autoStartAt = 0;
    $('banner').classList.remove('show');
}

/* ---------- Boucle physique ---------- */
function physicsStep(now) {
    updateSegments();
    for (const s of spinners) Body.setAngle(s.body, s.body.angle + s.speed);
    for (const m of marbles.values()) {
        const b = m.body;
        if (m.ejected) { if (now - m.ejectedAt > 3500) removeMarble(m); continue; }
        const boosted = now < m.boostUntil;
        if (boosted) Body.setVelocity(b, { x: b.velocity.x * 1.01, y: b.velocity.y * 1.03 + 0.3 });
        if (m.like > 0.05) {
            if (phase === 'race') Body.setVelocity(b, { x: b.velocity.x, y: b.velocity.y + Math.min(m.like, 30) * 0.02 });
            m.like *= 0.992;
        } else m.like = 0;
        if (phase === 'race' && b.velocity.y > 0.5 && !boosted) Body.setVelocity(b, { x: b.velocity.x * 1.004, y: b.velocity.y * 1.008 });
        if (phase !== 'lobby' || b.position.y > 0) for (const z of mudZones) {
            if (b.position.y > z.y && b.position.y < z.y + z.h && b.position.x > z.x && b.position.x < z.x + z.w) Body.setVelocity(b, { x: b.velocity.x * (1 - (1 - CFG.mudSlow) * 0.2), y: b.velocity.y * (1 - (1 - CFG.mudSlow) * 0.2) });
        }
        if (phase === 'race') for (const z of boostZones) {
            if (b.position.y > z.y && b.position.y < z.y + z.h && b.position.x > z.x && b.position.x < z.x + z.w) Body.setVelocity(b, { x: b.velocity.x + z.dx * 0.3, y: b.velocity.y + z.dy * 0.3 });
        }
        b.looping = -1;
        if (phase === 'race') for (const z of loopZones) {
            if (b.position.y > z.y && b.position.y < z.y + z.h && b.position.x > z.x && b.position.x < z.x + z.w) {
                b.looping = (b.position.y - z.y) / z.h;
                Body.setVelocity(b, { x: b.velocity.x * 0.94, y: Math.max(b.velocity.y + 0.35, 9) });
            }
        }
        const cap = (boosted ? CFG.maxSpeed * 1.4 : CFG.maxSpeed) + Math.min(m.like, 30) * 0.4;
        const sp = Math.hypot(b.velocity.x, b.velocity.y);
        if (sp > cap) Body.setVelocity(b, { x: b.velocity.x * cap / sp, y: b.velocity.y * cap / sp });
        if (phase === 'race' && !m.finished) {
            m.stuck = sp < 0.25 ? m.stuck + 1 : 0;
            if (m.stuck > 150) { Body.applyForce(b, b.position, { x: (Math.random() - .5) * 0.05, y: -0.03 }); m.stuck = 0; }
            if (b.position.y > FINISH) finishMarble(m);
        }
    }
    Engine.update(engine, 1000 / 120); Engine.update(engine, 1000 / 120);
}

/* ---------- Rendu ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
let vw = 0, vh = 0, dpr = 1;
function resize() { dpr = Math.min(2, window.devicePixelRatio || 1); vw = innerWidth; vh = innerHeight; cv.width = vw * dpr; cv.height = vh * dpr; }
addEventListener('resize', resize); resize();
const cam = { y: -200, z: 0.8 };
let topView = false;
function setView() { topView = false; }
function updateCamera() {
    if (topView) { cam.y += (FINISH / 2 + 100 - cam.y) * 0.15; cam.z += (Math.min(vh / (FINISH + 500), 1) - cam.z) * 0.15; return; }
    const list = phase === 'lobby' || phase === 'count' ? [] : allActive().filter(m => !m.finished || phase === 'done');
    let ty = -250, tz = Math.min(vw / (W + 120), 1.2) || 0.8;
    if (phase === 'done' && finishedList[0]) { ty = finishedList[0].body.position.y - 100; tz = 1; }

    const zMin = Math.min(vw / (W + 120), 1.2), zMax = zMin;
    tz = Math.max(zMin, Math.min(zMax, tz));

}
function poly(body) {

}
/* ---------- Fond dynamique (animation générée, ou vidéo choisie dans le panneau) ---------- */
let fxPulse = 0, fxSpeed = 0;

const bgVideo = document.createElement('video');
Object.assign(bgVideo, { muted: true, loop: true, playsInline: true, autoplay: true });
bgVideo.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:none';
document.body.prepend(bgVideo);
cv.style.position = 'fixed'; cv.style.zIndex = '1';
function bgVideoOn() { return !!CFG.videoUrl && bgVideo.style.display !== 'none' && !bgVideo.error; }
function applyVideo() {

    if (bgVideo.getAttribute('src') !== CFG.videoUrl) { bgVideo.src = CFG.videoUrl; }

}
function drawBackground(now) {

function drawWorld(now) {
    const z = cam.z;

    const left = -(vw / 2 - W / 2 * z) / z - 50, right = left + vw / z + 100;

    const fa = bgVideoOn() ? 0.55 : 0.8;
    const fl = ctx.createLinearGradient(0, 0, W, 0); fl.addColorStop(0, `rgba(10,17,38,${fa})`); fl.addColorStop(.5, `rgba(19,32,68,${fa})`); fl.addColorStop(1, `rgba(10,17,38,${fa})`); ctx.fillStyle = fl; ctx.fillRect(0, top, W, bottom - top);

    ctx.fillStyle = 'rgba(7,11,23,.35)'; ctx.fillRect(left, top, -left, bottom - top); ctx.fillRect(W, top, right - W, bottom - top);

    ctx.font = '900 40px Arial'; ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.textAlign = 'left';

        ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '800 30px Arial'; ctx.textAlign = 'center'; ctx.fillText('BOUE', z2.x + z2.w / 2, z2.y + z2.h / 2 + 10);
    }

        ctx.fillStyle = '#fbbf24'; ctx.font = '900 70px Impact'; ctx.fillText('ARRIVÉE', W / 2, FINISH - 20);

/* ---------- HUD ---------- */

let socket = null, wantLive = false, reconnectTimer = null;
function setLive(state) { $('dot').className = 'dot ' + (state === 'on' ? '' : state === 'wait' ? 'wait' : 'off'); }
function setStatus(m) { $('ttstatus').textContent = m; }
function pickPic(g) { return g.profilePictureUrl || (Array.isArray(g.avatarUrls) ? g.avatarUrls.find(Boolean) : '') || g.avatarDataUri || ''; }
function handleMessage(data) {
    if (data.type === 'STATUS') { setStatus(data.message || 'Statut reçu.'); return; }
    if (data.type === 'gift' || data.type === 'tiktok-gift') {
        const g = data.gift ?? data;
        const id = String(g.uniqueId || g.userId || g.username || g.nickname || 'inconnu');
        const coins = Number(g.coinValue ?? g.diamondCount ?? 1) || 1;
        const repeat = Math.max(1, Math.floor(Number(g.repeatCount) || 1));
        onGift({ id, name: g.nickname || g.username || id, pic: pickPic(g) }, coins, repeat);
    } else if (data.type === 'like' && data.likeData) {
        const l = data.likeData;
        const id = String(l.username || l.nickname || '');
        if (id) onLike(id, l.nickname || l.username || id, Math.max(1, Math.floor(Number(l.likeCount) || 1)));
    } else if (data.type === 'viewer' && data.viewer) {
        const v = data.viewer;
        const id = String(v.uniqueId || v.userId || v.username || '');
        if (id && v.avatarDataUri) loadAvatar(id, v.avatarDataUri);
    }
}
function connect() {
    const name = $('username').value.trim().replace(/^@/, '');
    if (!name) { setStatus('Entre un pseudo TikTok.'); return; }
    localStorage.setItem('cb-user', name);
    wantLive = true; clearTimeout(reconnectTimer);
    if (socket) { socket.onclose = null; socket.close(); }
    try { socket = new WebSocket(WS_URL); } catch (e) { setStatus('Connexion impossible.'); return; }
    const active = socket;
    setLive('wait'); setStatus(`Connexion au live de @${name}…`);
    active.addEventListener('open', () => active.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username: name })));
    active.addEventListener('message', ev => {
        try {
            const data = JSON.parse(ev.data);
            if (data.type === 'STATUS' && /connect|live|rejoint|en direct/i.test(data.message || '') && !/impossible|erreur|invalide|pas en direct|hors/i.test(data.message || '')) setLive('on');
            if (data.type === 'comment' || data.type === 'gift') setLive('on');
            handleMessage(data);
        } catch (e) { /* message ignoré */ }
    });
    active.addEventListener('error', () => { setLive('off'); setStatus('Connexion impossible.'); });
    active.addEventListener('close', () => {
        if (socket !== active) return;
        setLive('off');
        if (!wantLive) return;
        setStatus('Connexion perdue, nouvelle tentative…');
        reconnectTimer = setTimeout(connect, 4000);
    });
}
function disconnect() {
    wantLive = false; clearTimeout(reconnectTimer);
    if (socket) { socket.onclose = null; socket.close(); socket = null; }
    setLive('off'); setStatus('Déconnecté du live.');
}

        const ci = ((Math.floor(p.y / 260) + (p.x > W / 2 ? 3 : 0)) % NEON.length + NEON.length) % NEON.length;
        if (s.kind === 'ramp' || s.kind === 'rail') {
            const v = b.vertices, w = Math.hypot(v[1].x - v[0].x, v[1].y - v[0].y), h = Math.hypot(v[2].x - v[1].x, v[2].y - v[1].y);
            const bh = 0.45;
            const slab = new THREE.Mesh(new THREE.BoxGeometry(w * S3, h * S3, bh), neonStd[ci]);
            slab.position.set(X(p.x), Y(p.y), bh / 2); slab.rotation.z = -b.angle; track3.add(slab);
            const gl = new THREE.Mesh(new THREE.BoxGeometry(w * S3 + 0.2, h * S3 + 0.3, bh + 0.3), glowMats[ci]);
            gl.position.copy(slab.position); gl.rotation.z = -b.angle; track3.add(gl);
        } else if (s.kind === 'bumper') {
            const r = b.circleRadius * S3, g = new THREE.Group(); g.position.set(X(p.x), Y(p.y), 0);
            const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.9, 32), rubberMat); body.rotation.x = Math.PI / 2; body.position.z = 0.45; g.add(body);
            const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 0.88, 0.07, 10, 36), neonBasic[ci]); ring.position.z = 0.92; g.add(ring);
            const cap = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.55, r * 0.55, 0.12, 28), neonStd[(ci + 2) % NEON.length]); cap.rotation.x = Math.PI / 2; cap.position.z = 0.95; g.add(cap);
            const halo = new THREE.Mesh(new THREE.TorusGeometry(r * 0.88, 0.3, 8, 36), glowMats[ci]); halo.position.z = 0.92; g.add(halo);
            track3.add(g);
        } else if (s.kind === 'prop') {
            const r = b.circleRadius * S3, g = new THREE.Group(); g.position.set(X(p.x), Y(p.y), 0);
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.9, 12), pegMat); pole.rotation.x = Math.PI / 2; pole.position.z = 0.45; g.add(pole);
            const rot = new THREE.Group(); rot.position.z = 0.9; g.add(rot);
            for (let k = 0; k < 3; k++) {
                const bl = new THREE.Mesh(new THREE.BoxGeometry(r * 2.2, 0.16, 0.12), neonStd[(ci + k) % NEON.length]); bl.rotation.z = k * Math.PI / 3; rot.add(bl);
                const bg = new THREE.Mesh(new THREE.BoxGeometry(r * 2.2, 0.5, 0.3), glowMats[(ci + k) % NEON.length]); bg.rotation.z = k * Math.PI / 3; rot.add(bg);
            }
            const hub = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 8), neonBasic[(ci + 3) % NEON.length]); rot.add(hub);
            const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.05, 8, 40), neonBasic[ci]); ring.position.z = 0.06; g.add(ring);
            track3.add(g); spinner3.push({ g: rot, body: b });
        } else if (s.kind === 'spinner') {
            const v = b.vertices, w = Math.hypot(v[1].x - v[0].x, v[1].y - v[0].y), h = Math.hypot(v[2].x - v[1].x, v[2].y - v[1].y);
            const g = new THREE.Group(); g.position.set(X(p.x), Y(p.y), DEPTH / 2);
            g.add(new THREE.Mesh(new THREE.BoxGeometry(w * S3, h * S3, DEPTH * 0.7), neonStd[1]));
            g.add(new THREE.Mesh(new THREE.BoxGeometry(w * S3 + 0.2, h * S3 + 0.3, DEPTH * 0.7 + 0.3), glowMats[1]));
            const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, DEPTH * 1.05, 20), neonStd[0]);
            hub.rotation.x = Math.PI / 2; g.add(hub);
            track3.add(g); spinner3.push({ g, body: b });
        }
    }
    for (const z of mudZones) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(z.w * S3, z.h * S3, DEPTH * 0.9), new THREE.MeshStandardMaterial({ color: 0x7a2cff, transparent: true, opacity: 0.4, roughness: 0.95 }));
        m.position.set(X(z.x + z.w / 2), Y(z.y + z.h / 2), DEPTH * 0.45); m.rotation.z = z.tilt || 0; track3.add(m);
    }
    const chevTex = canvasTex(128, 128, (g, w, h) => {
        g.clearRect(0, 0, w, h); g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 12; g.lineCap = 'round'; g.lineJoin = 'round';
        for (const y of [20, 62, 104]) { g.beginPath(); g.moveTo(24, y - 14); g.lineTo(64, y + 10); g.lineTo(104, y - 14); g.stroke(); }
    });
    chevTex.wrapS = chevTex.wrapT = THREE.RepeatWrapping;
    for (const z of boostZones) {
        const len = z.len * S3, wid = (z.dy === 1 && z.dx === 0 ? z.w : 140) * S3;
        const t = chevTex.clone(); t.needsUpdate = true; t.repeat.set(Math.max(1, Math.round(wid / 1.2)), Math.max(1, Math.round(len / 1.2)));
        const m = new THREE.Mesh(new THREE.PlaneGeometry(wid, len), new THREE.MeshBasicMaterial({ map: t, color: 0x00ffb3, transparent: true, opacity: 0.9, depthWrite: false }));
        m.rotation.z = Math.atan2(z.dx, z.dy);
        m.position.set(X(z.cx), Y(z.cy), 0.03);
        track3.add(m);
    }
    // départ : barrière, damier et bannière
    gateMesh3 = new THREE.Mesh(new THREE.BoxGeometry(W * S3, 0.22, DEPTH), new THREE.MeshStandardMaterial({ color: 0x66707f, transparent: true, opacity: 0.85, metalness: 0.8, roughness: 0.3 }));
    gateMesh3.position.set(0, Y(20), DEPTH / 2); track3.add(gateMesh3);
    const checker = () => canvasTex(256, 32, (g, w, h) => { for (let i = 0; i < 32; i++) for (let j = 0; j < 4; j++) { g.fillStyle = (i + j) % 2 ? '#fff' : '#1f2937'; g.fillRect(i * 8, j * 8, 8, 8); } });
    const startLine = new THREE.Mesh(new THREE.PlaneGeometry(W * S3, 0.6), new THREE.MeshBasicMaterial({ map: checker() }));
    startLine.position.set(0, Y(60), 0.01); track3.add(startLine);
    const sb = textPlane('DÉPART', 7, 1.6, '#ffffff'); sb.position.set(0, Y(-240), DEPTH + 0.05); track3.add(sb);
    const fl = new THREE.Mesh(new THREE.PlaneGeometry(W * S3, 0.9), new THREE.MeshBasicMaterial({ map: checker() }));
    fl.position.set(0, Y(FINISH), 0.01); track3.add(fl);
    const fb = textPlane('ARRIVÉE', 7, 1.6, '#ffffff'); fb.position.set(0, Y(FINISH - 380), DEPTH + 0.05); track3.add(fb);
    for (let y = 1000; y < FINISH - 200; y += 1000) {
        const t = textPlane(`${Math.round((FINISH - y) / 10)} m`, 3, 0.7, '#ffffff', 'Arial', 0.1, '#4b5668'); t.position.set(X(150), Y(y), DEPTH + 0.03); track3.add(t);
    }
    track3.updateMatrixWorld(true);

    if (ground3) scene3.remove(ground3);
    const gy = new THREE.Vector3(0, Y(bottom), 0); track3.localToWorld(gy);
    ground3 = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x05060d, roughness: 1, metalness: 0, envMapIntensity: 0.1 }));
    ground3.rotation.x = -Math.PI / 2; ground3.position.set(0, gy.y - 0.5, gy.z); scene3.add(ground3);
}
const labelCache = new Map();
function makeMarbleTex(m) {
    return canvasTex(512, 256, (g, w, h) => {
        g.fillStyle = '#101214'; g.fillRect(0, 0, w, h);
        const col = `hsl(${m.h} 95% 52%)`;
        for (const cx of [128, 384]) {
            g.fillStyle = '#ddd'; g.fillRect(cx - 100, 0, 5, h); g.fillRect(cx + 95, 0, 5, h);
            g.strokeStyle = col; g.lineWidth = 26; g.lineJoin = 'miter'; g.lineCap = 'butt';
            for (const y of [60, 128, 196]) { g.beginPath(); g.moveTo(cx - 62, y - 26); g.lineTo(cx, y + 16); g.lineTo(cx + 62, y - 26); g.stroke(); }
        }
    });
}
function makeLabel(name, gold) {
    const t = canvasTex(512, 128, (g, w, h) => {
        g.font = '700 60px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
        const s = (gold ? '👑 ' : '') + name.slice(0, 14), tw = Math.min(w - 8, g.measureText(s).width + 56);
        g.fillStyle = 'rgba(24,32,46,.72)'; g.beginPath();
        if (g.roundRect) g.roundRect((w - tw) / 2, 22, tw, 84, 42); else g.rect((w - tw) / 2, 22, tw, 84);
        g.fill();
        g.fillStyle = gold ? '#fbbf24' : '#fff'; g.fillText(s, w / 2, h / 2 + 2);
    });
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false }));
    sp.scale.set(3.4, 0.85, 1); sp.renderOrder = 10;
    return sp;
}
function marbleObj(m) {
    let o = marbleObjs.get(m.id);
    if (o && o.m === m) return o;
    if (o) { track3.remove(o.g); }
    const g = new THREE.Group(), r = R * S3 * 1.25;
    const mat = new THREE.MeshPhysicalMaterial({ map: makeMarbleTex(m), roughness: 0.1, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.05, transparent: true });
    const core = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), mat);
    const shell = new THREE.Mesh(new THREE.SphereGeometry(r * 1.07, 24, 16), new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.16, shininess: 140, specular: 0xffffff, depthWrite: false }));
    const halo = new THREE.Mesh(new THREE.SphereGeometry(r * 1.6, 16, 12), new THREE.MeshBasicMaterial({ color: 0xfb923c, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    g.add(core, shell, halo);
    o = { m, g, core, mat, shell, halo, hasImg: avatarCache.has(m.id), label: null, gold: null };
    marbleObjs.set(m.id, o); track3.add(g);
    return o;
}
function updateMarbles3D(now) {
    const ranked = allActive().sort((a, b) => b.body.position.y - a.body.position.y);
    const showNames = ranked.length <= 12;
    for (const [id, o] of marbleObjs) if (marbles.get(id) !== o.m) { track3.remove(o.g); o.mat.map.dispose(); marbleObjs.delete(id); }
    for (const m of marbles.values()) {
        const o = marbleObj(m), p = m.body.position;
        if (!o.hasImg && avatarCache.has(m.id)) { o.hasImg = true; o.mat.map.dispose(); o.mat.map = makeMarbleTex(m); o.mat.needsUpdate = true; }
        o.g.position.set((p.x - W / 2) * S3, -p.y * S3, R * S3 * 1.25 * 1.8);
        const lp = m.body.looping;
        if (lp >= 0) { const a = lp * Math.PI * 2, orb = 2 - R * S3 * 1.25 * 1.8; o.g.position.x += Math.sin(a) * orb; o.g.position.z = 2 - Math.cos(a) * orb; }
        o.g.scale.setScalar(topView ? 2.4 : 1.8);
        o.core.rotation.z = -m.body.angle;
        const boosted = now < m.boostUntil && !m.ejected;
        o.halo.material.opacity = boosted ? 0.35 : m.like > 2 && !m.ejected ? Math.min(0.3, m.like / 60) : 0;
        o.halo.material.color.set(boosted ? 0xfb923c : 0xf43f5e);
        const fade = m.ejected ? Math.max(0.15, 1 - (now - m.ejectedAt) / 3500) : 1;
        o.mat.opacity = fade; o.shell.material.opacity = 0.16 * fade;
        const lead = ranked[0] === m, wantLabel = !topView && !m.ejected && (showNames || ranked.indexOf(m) < 6);
        if (wantLabel && (!o.label || o.gold !== lead)) {
            if (o.label) { o.g.remove(o.label); o.label.material.map.dispose(); }
            o.label = makeLabel(m.name, lead); o.gold = lead; o.label.position.set(0, R * S3 + 0.55, 0.3); o.g.add(o.label);
        }
        if (o.label) o.label.visible = wantLabel;
    }
}
function render3D(now) {
    if (!renderer3) { init3D(); if (!view3d) return; }
    if (glW !== vw || glH !== vh) { glW = vw; glH = vh; renderer3.setSize(vw, vh); camera3.aspect = vw / vh; camera3.updateProjectionMatrix(); }
    if (track3dDirty || !track3) buildTrack3D();
    const vid = bgVideoOn();
    document.documentElement.style.background = document.body.style.background = vid ? 'transparent' : BG3;
    bgVideo.style.opacity = vid ? String(Math.max(0.2, 1 - CFG.videoDim)) : '';
    scene3.fog.color.set(vid ? 0x000000 : FOG3); scene3.fog.near = vid ? 1e5 : 70; scene3.fog.far = vid ? 2e5 : 260;
    gateMesh3.visible = gateOn;
    for (const s of spinner3) s.g.rotation.z = -s.body.angle;
    if (track3.userData.flow) track3.userData.flow.visible = topView;
    for (const [i, o] of track3.userData.segMeshes || []) o.visible = topView || !segs[i] || segs[i].on;
    for (const d of track3.userData.traffic || []) {
        const t = (now / 1000 * d.v + d.off) % track3.userData.trafficLen;
        d.m.position.y = d.dir > 0 ? track3.userData.trafficTop - t : track3.userData.trafficTop - track3.userData.trafficLen + t;
    }
    updateMarbles3D(now);

    // caméra : sous les billes, qui regarde le toboggan monter vers le départ
    ov3 += ((topView ? 1 : 0) - ov3) * 0.08;
    const vf = -cam.y * S3, asp = vw / vh, tanV = Math.tan(FOV3 * Math.PI / 360);
    const dist = Math.max(11, (W * S3 * 0.36) / (tanV * Math.min(asp, 1.6)));
    const minV = -(FINISH + 500) * S3;
    const fPos = new THREE.Vector3(0, Math.min(0, vf + dist * 0.8), dist * 0.5), fLook = new THREE.Vector3(0, vf - dist * 0.6, 0.2);
    const H = (FINISH + 800) * S3, fit = Math.max(H / 2 / tanV, (W * S3 / 2 + 1) / (tanV * asp)) * 1.08;
    const oPos = new THREE.Vector3(0, -(FINISH / 2) * S3, fit), oLook = new THREE.Vector3(0, -(FINISH / 2) * S3, 0);
    const pos = fPos.lerp(oPos, ov3), look = fLook.lerp(oLook, ov3);
    track3.localToWorld(pos); track3.localToWorld(look);
    camera3.position.copy(pos); camera3.lookAt(look);
    // inclinaison dans les virages : la piste bascule du côté où les billes tournent, comme une voiture
    let lvx = 0, ln = 0;
    if (phase === 'race') { const lead = [...marbles.values()].filter(m => !m.ejected).sort((a, b) => b.body.position.y - a.body.position.y).slice(0, 5); for (const m of lead) { lvx += m.body.velocity.x; ln++; } }
    bank3 += ((ln ? Math.max(-0.22, Math.min(0.22, lvx / ln * 0.035)) : 0) - bank3) * 0.04;
    camera3.rotateZ(bank3 * (1 - ov3));
    renderer3.render(scene3, camera3);
}

/* ---------- Démarrage ---------- */
let last = performance.now(), acc = 0;
function frame(now) {
    acc += Math.min(100, now - last); last = now;
    let n = 0;
    while (acc >= 1000 / 60 && n < 4) { physicsStep(now); acc -= 1000 / 60; n++; }
    if (n === 4) acc = 0;
    if (phase === 'lobby' && autoStartAt && now >= autoStartAt) startCountdown();
    if (phase === 'done' && now >= winnerTimer) resetRace();
    updateCamera(); if (view3d) render3D(now); else drawWorld(now); updateHud(now);
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* ---------- Panneau de commande (fenêtre séparée, invisible sur l'écran de jeu) ---------- */
const TRACK_KEYS = ['levels', 'spacing', 'rampAngle', 'mud', 'pegs', 'spinners', 'spinSpeed'];
const trackSig = c => TRACK_KEYS.map(k => c[k]).join('|');
function applyConfig(next) {
    const before = trackSig(CFG);
    CFG = { ...DEFAULTS, ...next };
    try { localStorage.setItem('cb-config', JSON.stringify(CFG)); } catch (e) { /* stockage indisponible */ }
    engine.gravity.y = CFG.gravity;
    applyVideo();
    if (trackSig(CFG) !== before) {
        if (phase === 'lobby') buildTrack();
        else { trackDirty = true; toast('Nouveau parcours à la prochaine course'); }
    }
}
const control = 'BroadcastChannel' in window ? new BroadcastChannel('cb-control') : null;
function runCommand(cmd, extra) {
    if (cmd === 'start') startCountdown();
    else if (cmd === 'reset') resetRace();
    else if (cmd === 'add10') for (let i = 0; i < 10; i++) testMarble();
    else if (cmd === 'gift1') $('b-g1').click();
    else if (cmd === 'gift5') $('b-g5').click();
    else if (cmd === 'like') { const m = randomMarble(); onLike(m.id, m.name, 20); }
    else if (cmd === 'view') setView(!topView);
    else if (cmd === 'mute') setMuted(!muted);
    else if (cmd === 'connect') { if (extra && extra.username) $('username').value = extra.username; connect(); }
    else if (cmd === 'disconnect') disconnect();
}
if (control) {
    control.onmessage = ev => {
        const d = ev.data || {};
        if (d.type === 'config') applyConfig(d.cfg);
        else if (d.type === 'cmd') runCommand(d.cmd, d);
        else if (d.type === 'hello') control.postMessage({ type: 'config', cfg: CFG, state: true });
    };
    setInterval(() => control.postMessage({ type: 'state', phase, marbles: marbles.size, racers: racers().length, topView, muted, live: $('ttstatus').textContent, user: $('username').value, on: $('dot').className === 'dot ' }), 1000);
}
applyVideo();
$('b-like').onclick = () => runCommand('like');
function openControl() { try { window.open('course-de-billes-controle.html', 'cb-control', 'width=480,height=820'); } catch (e) { /* popup bloqué */ } }
$('b-ctrl').onclick = openControl;

window.__game = { onLike, applyConfig, get CFG() { return CFG; }, get FINISH() { return FINISH; }, marbles, onGift, startCountdown, resetRace, step(n) { for (let i = 0; i < n; i++) physicsStep(performance.now()); }, render() { for (let i = 0; i < 60; i++) updateCamera(); if (view3d) render3D(performance.now()); else drawWorld(performance.now()); updateHud(performance.now()); }, get view3d() { return view3d; }, get phase() { return phase; }, cam };
</script>
