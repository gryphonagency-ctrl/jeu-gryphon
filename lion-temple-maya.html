<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gryphon Agency — Lion dans la Savane : Ascension du Temple Maya — TikTok Live</title>
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Orbitron:wght@700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; overflow: hidden; background: #1a0000; font-family: Poppins, system-ui, sans-serif; color: #f5f0ff; user-select: none; }
        body { display: flex; }
        #stage { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 1.2vh;
            background: linear-gradient(180deg, #1a0000 0%, #5a1a00 45%, #d48800 100%); }
        #scene { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
        #bgvideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        #bgvideo[hidden] { display: none; }
        .title { position: relative; z-index: 2; margin: 2.5vh 0 0; font: 400 clamp(20px, 3.4vw, 46px) Rye, serif; color: #ffe27a; text-shadow: 0 3px 0 #7a2a00, 0 0 18px rgba(255,200,60,.7); text-align: center; }
        #scoreboard { position: relative; z-index: 2; padding: 6px 18px; border: 2px solid #ffd36b; border-radius: 999px; background: rgba(30,6,0,.75); font: 800 clamp(13px, 1.6vw, 22px) Poppins, sans-serif; text-shadow: 2px 2px #000; text-align: center; }
        #scoreboard b { color: #ffd36b; }
        .float { position: absolute; z-index: 6; font: 900 clamp(22px, 3vw, 44px) Orbitron, sans-serif; color: #ffe27a; text-shadow: 0 0 14px #ff9d00, 0 3px 0 #000; pointer-events: none; animation: rise 1.6s ease-out forwards; transform: translate(-50%, 0); }
        @keyframes rise { to { transform: translate(-50%, -90px) scale(1.3); opacity: 0; } }
        #board { position: absolute; z-index: 4; left: 10px; top: 20vh; width: 190px; padding: 8px 10px; border: 1px solid rgba(255,255,255,.25); border-radius: 12px; background: rgba(30,6,0,.7); font-size: 12px; }
        #board h4 { margin: 0 0 4px; color: #ffd36b; font: 900 11px Orbitron, sans-serif; }
        #board ol { margin: 0; padding-left: 20px; } #board li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #vip { position: absolute; z-index: 8; left: 50%; top: 24%; display: flex; align-items: center; gap: 16px; padding: 14px 28px 14px 16px; border: 3px solid #ffd36b; border-radius: 22px; background: linear-gradient(135deg, #7a2a00, #c28a00); box-shadow: 0 0 30px rgba(255,211,107,.8), 0 10px 40px rgba(0,0,0,.6); transform: translate(-50%, -30px) scale(.7); opacity: 0; pointer-events: none; transition: .45s cubic-bezier(.2,1.4,.4,1); }
        #vip.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
        #vip img, #vip .vip-ph { width: 84px; height: 84px; border-radius: 50%; border: 4px solid #ffd36b; object-fit: cover; background: #3a1a0a; display: grid; place-items: center; font-size: 40px; }
        #vip .vip-tag { font: 900 13px Orbitron, sans-serif; letter-spacing: 3px; color: #ffe9a0; }
        #vip .vip-name { font: 900 clamp(22px, 3vw, 38px) Orbitron, sans-serif; color: #fff; text-shadow: 0 2px 0 #000; }
        #vip .vip-score { font: 900 clamp(18px, 2.2vw, 28px) Orbitron, sans-serif; color: #fff2a8; }
        .toast { position: fixed; z-index: 9; left: 16px; bottom: 16px; max-width: 70vw; padding: 8px 14px; border: 1px solid rgba(255,200,80,.6); border-radius: 12px; background: rgba(60,20,0,.9); font-size: 14px; opacity: 0; transform: translateY(14px); transition: .25s; pointer-events: none; }
        .toast.show { opacity: 1; transform: none; }
        .panel { flex: 0 0 300px; width: 300px; height: 100%; display: flex; flex-direction: column; border-left: 1px solid rgba(255,255,255,.2); background: rgba(15,6,38,.97); z-index: 5; }
        .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 11px; border-bottom: 1px solid rgba(255,255,255,.14); font: 900 11px Orbitron, sans-serif; letter-spacing: .06em; }
        .eye { width: 32px; height: 28px; border: 1px solid rgba(0,243,255,.5); border-radius: 8px; background: rgba(0,70,92,.4); color: #9dfaff; font-size: 16px; cursor: pointer; }
        .panel-body { overflow-y: auto; padding: 11px; display: grid; gap: 10px; align-content: start; }
        .panel.hidden-panel { flex-basis: 48px; width: 48px; }
        .panel.hidden-panel .panel-head { padding: 4px; border: 0; }
        .panel.hidden-panel .panel-title, .panel.hidden-panel .panel-body { display: none; }
        .box { display: grid; gap: 6px; padding: 9px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; background: rgba(255,255,255,.04); }
        .box h3 { margin: 0; color: #ffd36b; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
        .row { display: flex; gap: 6px; } .row > * { flex: 1; min-width: 0; }
        label { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 11px; color: #cfc6ee; }
        label.check { justify-content: flex-start; cursor: pointer; } label.check input { width: auto; }
        input[type=text], input[type=number], input[type=url] { width: 100%; padding: 6px 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; background: rgba(0,0,0,.35); color: #fff; font: inherit; font-size: 12px; user-select: text; }
        input[type=range] { width: 100%; accent-color: #ff9d00; }
        button.btn { min-height: 34px; padding: 6px 8px; border: 1px solid rgba(255,255,255,.25); border-radius: 9px; background: linear-gradient(135deg, #d6226f, #7b1fd1); color: #fff; font: 700 12px Poppins, sans-serif; cursor: pointer; }
        button.btn.alt { background: rgba(0,70,92,.5); border-color: rgba(0,243,255,.4); color: #aafaff; }
        button.btn.danger { background: #5a1b2b; border-color: #ff8d87; }
        .status { margin: 0; font-size: 11px; color: #b7ffcf; min-height: 15px; }
        .private-board { margin: 0; padding: 6px 8px 6px 26px; border-radius: 8px; background: rgba(0,0,0,.35); font-size: 12px; color: #ffe9a0; }
        .private-board[hidden] { display: none; }
        .qwin { container-type: inline-size; display: flex; flex-direction: column; border: 1px solid rgba(255,211,107,.45); border-radius: 12px; background: rgba(15,6,38,.96); overflow: hidden; }
        .qwin.docked { height: 220px; resize: vertical; min-height: 120px; }
        .qwin.floating { position: fixed; z-index: 30; resize: both; min-width: 200px; min-height: 140px; max-width: 95vw; max-height: 95vh; box-shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 18px rgba(255,211,107,.25); }
        .qhead { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: rgba(255,211,107,.12); font: 900 11px Orbitron, sans-serif; color: #ffd36b; letter-spacing: .06em; }
        .qwin.floating .qhead { cursor: move; touch-action: none; }
        .qhead span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .qhead button { border: 1px solid rgba(255,255,255,.25); border-radius: 7px; background: rgba(0,70,92,.5); color: #aafaff; font-size: 12px; padding: 3px 8px; cursor: pointer; }
        .qlist { flex: 1; margin: 0; padding: 6px 8px; list-style: none; overflow-y: auto; font-size: clamp(11px, 4.2cqw, 40px); }
        .qlist li { display: flex; align-items: center; gap: .5em; padding: .3em .5em; margin-bottom: .25em; border-radius: .6em; background: rgba(255,255,255,.06); }
        .qlist li.now { background: rgba(255,157,0,.28); border: 1px solid #ff9d00; }
        .qlist .rank { color: #ffd36b; font-weight: 900; min-width: 1.6em; }
        .qlist .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
        .qlist .cnt { color: #b7ffcf; font-weight: 900; }
        .qempty { color: #cfc6ee; text-align: center; padding: 1em; }
    </style>
</head>
<body>
    <main id="stage" aria-label="Lion dans la Savane, ascension du temple maya, Gryphon Agency">
        <video id="bgvideo" hidden muted loop playsinline autoplay></video>
        <canvas id="scene"></canvas>
        <h1 class="title">Lion dans la Savane · Temple Maya</h1>
        <div id="scoreboard" role="status">En attente d'un joueur…</div>
        <aside id="board" aria-label="Classement"><h4>🏆 CLASSEMENT</h4><ol id="board-list"></ol></aside>
    </main>
    <div id="vip" role="status" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <aside id="panel" class="panel" aria-label="Panneau de contrôle du streamer">
        <header class="panel-head">
            <span class="panel-title">PANNEAU DE CONTRÔLE</span>
            <button id="eye" class="eye" type="button" aria-expanded="true" aria-label="Masquer le panneau">👁</button>
        </header>
        <div id="panel-body" class="panel-body">
            <section class="box">
                <h3>Vitesse du jeu</h3>
                <label for="speed">Montée du lion <output id="speed-out">1×</output></label>
                <input id="speed" type="range" min="0.5" max="4" step="0.25" value="1">
                <button id="speed-reset" class="btn alt" type="button">↺ Vitesse normale</button>
            </section>
            <div id="qwin" class="qwin docked" aria-label="File d'attente des marches">
                <div id="qhead" class="qhead"><span id="qtitle">⏳ MARCHES EN ATTENTE (0)</span><button id="qdock" type="button" aria-label="Détacher la file d'attente">⧉ Détacher</button></div>
                <ul id="qlist" class="qlist" aria-live="polite"></ul>
            </div>
            <section class="box">
                <h3>Connexion TikTok</h3>
                <input id="username" type="text" maxlength="32" placeholder="Pseudo TikTok" autocomplete="off">
                <input id="ws-url" type="url" value="wss://jeu6boite.onrender.com" aria-label="Adresse WebSocket">
                <button id="connect" class="btn" type="button">Connecter le live</button>
                <p id="live-status" class="status" role="status"></p>
            </section>
            <section class="box">
                <h3>Réglages</h3>
                <div class="row">
                    <label>🎳 étoiles pour lâcher une boule<input id="snake" type="number" min="2" max="1000" value="2"></label>
                </div>
                <label>Recul du lion sur une boule (marches)<input id="back" type="number" min="0" max="99" value="2"></label>
                <div class="row">
                    <label>🚌 étoiles pour lancer le bus<input id="bus" type="number" min="2" max="1000" value="5"></label>
                </div>
                <label>Recul du lion sur le bus (marches)<input id="busback" type="number" min="0" max="99" value="10"></label>
                <div class="row">
                    <label>🪨 étoiles pour le rocher<input id="rock" type="number" min="2" max="1000" value="20"></label>
                </div>
                <label>Recul du lion sur le rocher (marches)<input id="rockback" type="number" min="0" max="99" value="15"></label>
                <div class="row">
                    <label>🚀 étoiles pour le jetpack<input id="jet" type="number" min="2" max="1000" value="30"></label>
                </div>
                <label>Montée du jetpack (marches)<input id="jetup" type="number" min="1" max="99" value="30"></label>
                <label>🏆 étoiles gagnées au sommet (marche 100)<input id="winstars" type="number" min="0" max="100000" value="100"></label>
                <div class="row">
                    <label>🏍️ étoiles pour la motocross<input id="moto" type="number" min="2" max="1000" value="100"></label>
                </div>
                <label>Montée de la motocross (marches)<input id="motoup" type="number" min="1" max="99" value="50"></label>
                <div class="row">
                    <label>🦅 étoiles pour l'aigle géant<input id="eagle" type="number" min="2" max="1000" value="300"></label>
                </div>
                <label>Montée de l'aigle (marches)<input id="eagleup" type="number" min="1" max="99" value="80"></label>
                <div class="row">
                    <label>🦖 étoiles pour le dinosaure<input id="dino" type="number" min="2" max="1000" value="199"></label>
                </div>
                <div class="row">
                    <label>🐺 étoiles pour les hyènes<input id="hyena" type="number" min="2" max="1000" value="500"></label>
                </div>
            </section>
            <section class="box">
                <h3>Simulateur (sans étoiles réelles)</h3>
                <input id="sim-name" type="text" maxlength="32" value="Alex_TikTok 🚀" aria-label="Pseudo simulé">
                <div class="row">
                    <button id="sim-gift" class="btn" type="button">🎁 1 pièce</button>
                    <button id="sim-burst" class="btn" type="button">💥 ×10</button>
                </div>
                <button id="sim-snake" class="btn" type="button">🎳 2 étoiles = boule</button>
                <button id="sim-bus" class="btn" type="button">🚌 5 étoiles = bus</button>
                <button id="sim-rock" class="btn" type="button">🪨 20 étoiles = rocher</button>
                <button id="sim-jet" class="btn" type="button">🚀 30 étoiles = jetpack</button>
                <button id="sim-moto" class="btn" type="button">🏍️ 100 étoiles = motocross</button>
                <button id="sim-eagle" class="btn" type="button">🦅 300 étoiles = aigle géant</button>
                <button id="sim-dino" class="btn" type="button">🦖 199 étoiles = dinosaure</button>
                <button id="sim-hyena" class="btn" type="button">🐺 500 étoiles = hyènes</button>
                <button id="sim-share" class="btn" type="button">✈️ Partage du live</button>
            </section>
            <section class="box">
                <h3>Partie</h3>
                <label class="btn alt" style="text-align:center;cursor:pointer">🎬 Vidéo d'arrière-plan<input id="bgvideo-input" type="file" accept="video/*" hidden></label>
                <button id="bgvideo-clear" class="btn alt" type="button" hidden>🗑️ Retirer la vidéo</button>
                <label class="check"><input id="hide-board" type="checkbox"> Masquer le classement à l'écran</label>
                <ol id="private-board" class="private-board" hidden></ol>
                <button id="reset-climb" class="btn alt" type="button">🦁 Recommencer la montée</button>
                <button id="reset-board" class="btn danger" type="button">Remettre à zéro le classement</button>
                <div data-save-key="lion-temple-maya-save"></div>
            </section>
        </div>
    </aside>

    <script src="/arcade-effects.js"></script>
    <script>
        'use strict';
        const $ = id => document.getElementById(id);
        const SAVE_KEY = 'lion-temple-maya-save';
        const TOP = 100, VIS = 14;
        const settings = { snake: 2, back: 2, bus: 5, busBack: 10, jet: 30, jetUp: 30, moto: 100, motoUp: 50, eagle: 300, eagleUp: 80, dino: 199, hyena: 500, rock: 20, rockBack: 15, winStars: 100, speed: 1, hideBoard: false };
        let cam = 0;
        const viewers = new Map();
        const queue = [];
        let pos = 0, posDisp = 0, seg = null, moves = [], obst = new Set(), victories = 0, bgVideoOn = false;
        let clock = 0, nextAt = 0, resetAt = 0, current = null;

        const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
        let toastTimer;
        function say(text) { const t = $('toast'); t.textContent = text; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

        function getViewer(raw) {
            const username = String(raw || 'Spectateur').replace(/^@/, '').trim().slice(0, 32) || 'Spectateur';
            const key = username.toLowerCase();
            if (!viewers.has(key)) viewers.set(key, { username, stars: 0, avatar: '' });
            return viewers.get(key);
        }

        let vipTimer;
        function showVip(viewer, gained) {
            const el = $('vip');
            el.textContent = '';
            const pic = viewer.avatar ? document.createElement('img') : document.createElement('div');
            if (viewer.avatar) { pic.src = viewer.avatar; pic.alt = ''; pic.referrerPolicy = 'no-referrer'; } else { pic.className = 'vip-ph'; pic.textContent = '🦁'; }
            const box = document.createElement('div');
            const tag = document.createElement('div'); tag.className = 'vip-tag'; tag.textContent = '👑 VIP — SOMMET DU TEMPLE';
            const name = document.createElement('div'); name.className = 'vip-name'; name.textContent = '@' + viewer.username;
            const score = document.createElement('div'); score.className = 'vip-score'; score.textContent = gained > 0 ? `+${gained} ⭐ gagnées — ${viewer.stars} ⭐ au total` : `${viewer.stars} ⭐ au total`;
            box.append(tag, name, score); el.append(pic, box);
            el.classList.add('show');
            clearTimeout(vipTimer); vipTimer = setTimeout(() => el.classList.remove('show'), 6000);
        }

        /* ---------- sons simples ---------- */
        let actx = null;
        function beep(freq, to, dur, type, gain, delay) {
            try {
                actx = actx || new (window.AudioContext || window.webkitAudioContext)();
                if (actx.state === 'suspended') actx.resume();
                const t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
                o.type = type || 'sine';
                o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(to, t + dur);
                g.gain.setValueAtTime(gain || 0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
            } catch (e) { }
        }
        const sndUp = () => beep(300, 600, 0.2, 'triangle', 0.14);
        const sndDown = () => beep(520, 160, 0.4, 'sawtooth', 0.09);
        const sndHit = () => beep(140, 70, 0.25, 'square', 0.1);
        const sndHorn = () => { beep(220, 220, 0.45, 'sawtooth', 0.1); beep(277, 277, 0.45, 'sawtooth', 0.08); };
        const sndRoar = () => { beep(110, 60, 1.4, 'sawtooth', 0.14); beep(160, 70, 1.4, 'square', 0.06); };
        const sndMoto = () => { beep(70, 300, 2.4, 'sawtooth', 0.06); beep(140, 600, 2.4, 'square', 0.03); };
        const sndJet = () => { beep(90, 380, 2, 'sawtooth', 0.07); beep(140, 520, 2, 'square', 0.04); };
        const sndWin = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => beep(f, f, 0.3, 'triangle', 0.18, i * 0.12));

        /* ---------- temple ---------- */
        const canvas = $('scene'), ctx = canvas.getContext('2d');
        function resize() { const s = $('stage'); canvas.width = s.clientWidth; canvas.height = s.clientHeight; }
        addEventListener('resize', resize);

        function geo() {
            const w = canvas.width, h = canvas.height;
            return { w, h, top: h * 0.3, th: h * 0.09, SW: h * 0.27, SH: h * 0.085, ax: w * 0.32, ay: h * 0.68, cx: w * 0.32 };
        }
        const smooth = t => t * t * (3 - 2 * t);
        const jumpT = f => Math.min(1, Math.max(0, (f - 0.4) / 0.6));
        function heightOf(p) {
            const n = Math.min(TOP, Math.max(0, Math.floor(p)));
            return n >= TOP ? TOP : n + smooth(jumpT(p - n));
        }
        const stepX = (g, s) => g.ax + (s - cam) * g.SW;
        const stepY = (g, s) => g.ay - (s - heightOf(cam)) * g.SH;

        function buildObstacles() { obst = new Set(); rolls.length = 0; }

        /* un cadeau du bon nombre d'étoiles lâche une boule qui dévale les marches, heurte le lion puis sort du décor */
        const rolls = [], ROLL_STEPS = 7, ROLL_SPEED = 5, BUS_STEPS = 9, BUS_SPEED = 4;
        const ROCK_STEPS = 8, ROCK_SPEED = 4.5, DINO_STEPS = 11,         DINO_SPEED = 3.2, HYENA_STEPS = 10, HYENA_SPEED = 5.5;
                const rollPos = b => b.start - (clock - b.t) * (b.bus ? BUS_SPEED : b.rock ? ROCK_SPEED : b.dino ? DINO_SPEED : b.hyena ? HYENA_SPEED : ROLL_SPEED);
                // kind : true = bus, 'rock' = rocher, 'dino' = dinosaure, 'hyena' = horde de hyènes, sinon boule de bowling
        function dropSnake(viewer, kind) {
            if (resetAt) return false;
                    const bus = kind === true, rock = kind === 'rock', dino = kind === 'dino', hyena = kind === 'hyena';
                    rolls.push({ t: clock, start: Math.ceil(posDisp) + (bus ? BUS_STEPS : rock ? ROCK_STEPS : dino ? DINO_STEPS : hyena ? HYENA_STEPS : ROLL_STEPS), who: viewer, hit: false, bus, rock, dino, hyena, seed: Math.random() * 100 });
                    if (hyena) { say(`🐺 @${viewer.username} lâche une horde de hyènes !`); sndRoar(); }
                    else if (bus) { say(`🚌 @${viewer.username} lance le bus !`); sndHorn(); }
            else if (rock) { say(`🪨 @${viewer.username} fait dégringoler un rocher !`); beep(80, 40, 0.8, 'sawtooth', 0.12); }
            else if (dino) { say(`🦖 @${viewer.username} réveille un dinosaure géant !`); sndRoar(); }
            else say(`🎳 @${viewer.username} lâche une boule de bowling !`);
            return true;
        }
        function updateRolls() {
            for (let i = rolls.length - 1; i >= 0; i--) {
                const b = rolls[i], p = rollPos(b);
                if (!b.hit && p <= posDisp + (b.dino ? 1.6 : b.hyena ? 1.2 : b.bus ? 0.65 : b.rock ? 0.5 : 0.3)) {
                    b.hit = true; sndHit();
                    if (b.bus || b.rock || b.dino || b.hyena) setTimeout(sndHit, 110);
                    if (b.hyena) { victories = 0; refreshBoards(); saveGame(); }
                    const back = b.dino || b.hyena ? 999 : b.bus ? settings.busBack : b.rock ? settings.rockBack : settings.back;
                    const base = Math.floor(posDisp + 0.5), target = Math.max(0, base - Math.max(0, back));
                    if (target < base) {
                        pos = target; seg = null; moves = [{ to: target, kind: 'fall', dur: b.dino || b.hyena ? 1.8 : b.bus ? 1.2 : b.rock ? 1.0 : 0.7 }];
                        sndDown();
                        const n = base - target, what = b.dino ? 'le dinosaure' : b.bus ? 'le bus' : b.rock ? 'le rocher' : 'la boule de bowling';
                        say(b.hyena ? `🐺 @${b.who.username} : la horde renvoie le lion à la marche 0 et remet ses victoires à zéro !` : b.dino ? `🦖 @${b.who.username} : le dinosaure renvoie le lion à la marche 0 !` : `${b.bus ? '🚌' : b.rock ? '🪨' : '🎳'} @${b.who.username} : ${what} fait reculer le lion de ${n} marche${n > 1 ? 's' : ''} !`);

        /* temples mayas en silhouette qui défilent sans fin (deux plans) + braises et lueur pulsante */

        /* boule de bowling : résine bleu nuit marbrée, trous de doigts, reflet net, ombre portée */

        /* bus urbain jaune de profil : carrosserie vernie, vitres avec passagers, roues qui tournent, phare allumé, roule le long des marches */
        function drawBus(g, b) {

            ctx.strokeStyle = 'rgba(80,50,0,.5)'; ctx.lineWidth = 0.02; ctx.beginPath(); ctx.moveTo(2.25, -2.62); ctx.lineTo(2.25, -1.08); ctx.stroke();
            ctx.restore();
            ctx.strokeStyle = '#6b4600'; ctx.lineWidth = 0.035; body(); ctx.stroke();
            // phare, calandre, pare-chocs, rétroviseur, feux arrière

            ctx.fillStyle = '#fffbe0'; ctx.beginPath(); ctx.ellipse(0.08, -1.0, 0.12, 0.2, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#555'; ctx.lineWidth = 0.025; ctx.stroke();
            ctx.fillStyle = '#222'; ctx.fillRect(0.0, -1.58, 0.1, 0.4);
            ctx.fillStyle = '#4a4a4a'; ctx.beginPath(); ctx.roundRect(-0.12, -0.8, 0.34, 0.2, 0.05); ctx.fill();

            ctx.strokeStyle = '#111'; ctx.lineWidth = 0.03; ctx.beginPath(); ctx.moveTo(0.2, -2.5); ctx.lineTo(-0.12, -2.28); ctx.stroke();
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.roundRect(-0.24, -2.45, 0.14, 0.3, 0.04); ctx.fill();
            const tl = ctx.createLinearGradient(9.5, 0, 9.7, 0); tl.addColorStop(0, '#ff3a2a'); tl.addColorStop(1, '#8a0a0a');
            ctx.fillStyle = tl; ctx.beginPath(); ctx.roundRect(9.5, -1.55, 0.16, 0.42, 0.04); ctx.fill();

                ctx.save(); ctx.translate(cx, -0.5);
                const tr = ctx.createRadialGradient(0, 0, 0.3, 0, 0, 0.5); tr.addColorStop(0, '#3a3a3a'); tr.addColorStop(0.7, '#141414'); tr.addColorStop(1, '#050505');
                ctx.fillStyle = tr; ctx.beginPath(); ctx.arc(0, 0, 0.5, 0, Math.PI * 2); ctx.fill();
                ctx.rotate(rot);
                const rg = ctx.createRadialGradient(-0.08, -0.08, 0.02, 0, 0, 0.32); rg.addColorStop(0, '#f4f4f4'); rg.addColorStop(1, '#8a8f96');
                ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(0, 0, 0.32, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#555'; ctx.lineWidth = 0.035;
                for (let k = 0; k < 5; k++) { const a = k * Math.PI * 2 / 5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 0.28, Math.sin(a) * 0.28); ctx.stroke(); }
                ctx.fillStyle = '#2a2a2a'; ctx.beginPath(); ctx.arc(0, 0, 0.08, 0, Math.PI * 2); ctx.fill();

        }

        /* rocher : bloc de granit irrégulier, facettes et fissures qui tournent, éclairage fixe venant du soleil, mousse, ombre portée */
        function drawRock(x, y, r, rot, seed) {
            const N = 13, pts = [];
            for (let i = 0; i < N; i++) {
                const a = i / N * Math.PI * 2, k = 0.82 + 0.3 * hash(seed + i * 3.7);
                pts.push([Math.cos(a) * r * k, Math.sin(a) * r * k * 0.94]);
            }
            const path = () => {
                ctx.beginPath();
                pts.forEach(([px, py], i) => {
                    const c = Math.cos(rot), s = Math.sin(rot), X = x + px * c - py * s, Y = y + px * s + py * c;
                    i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
                });
                ctx.closePath();
            };
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,.38)'; ctx.beginPath(); ctx.ellipse(x, y + r * 0.95, r * 0.95, r * 0.17, 0, 0, Math.PI * 2); ctx.fill();
            const bg = ctx.createRadialGradient(x - r * 0.4, y - r * 0.5, r * 0.1, x, y, r * 1.2);
            bg.addColorStop(0, '#d8d1c3'); bg.addColorStop(0.35, '#a39c8f'); bg.addColorStop(0.75, '#6d655a'); bg.addColorStop(1, '#3a332b');
            ctx.fillStyle = bg; path(); ctx.fill();
            ctx.save(); path(); ctx.clip();
            ctx.translate(x, y); ctx.rotate(rot);
            // facettes : plans clairs et sombres selon leur orientation
            for (let i = 0; i < N; i++) {
                const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % N], m = hash(seed + i * 1.9 + 40);
                ctx.fillStyle = m > 0.5 ? 'rgba(255,248,230,.16)' : 'rgba(0,0,0,.1)';
                ctx.beginPath(); ctx.moveTo(ax * 0.15, ay * 0.15); ctx.lineTo(ax, ay); ctx.lineTo(bx, by); ctx.closePath(); ctx.fill();
                ctx.strokeStyle = 'rgba(20,14,8,.45)'; ctx.lineWidth = r * 0.025;
                ctx.beginPath(); ctx.moveTo(ax * 0.15, ay * 0.15); ctx.lineTo(ax * 0.8, ay * 0.8); ctx.stroke();
            }
            // fissures et grain de la pierre
            ctx.strokeStyle = 'rgba(15,10,5,.6)'; ctx.lineWidth = r * 0.02;
            for (let k = 0; k < 3; k++) {
                let cx = (hash(seed + k * 5) - 0.5) * r, cy = (hash(seed + k * 5 + 1) - 0.5) * r;
                ctx.beginPath(); ctx.moveTo(cx, cy);
                for (let j = 0; j < 4; j++) { cx += (hash(seed + k * 9 + j) - 0.4) * r * 0.3; cy += (hash(seed + k * 9 + j + 20) - 0.3) * r * 0.25; ctx.lineTo(cx, cy); }
                ctx.stroke();
            }
            for (let i = 0; i < 60; i++) {
                ctx.fillStyle = hash(seed + i * 2.3) > 0.5 ? 'rgba(255,245,220,.25)' : 'rgba(0,0,0,.3)';
                ctx.beginPath(); ctx.arc((hash(seed + i) - 0.5) * r * 1.8, (hash(seed + i + 80) - 0.5) * r * 1.8, r * (0.01 + 0.02 * hash(seed + i + 9)), 0, Math.PI * 2); ctx.fill();
            }
            // taches de mousse
            for (let k = 0; k < 3; k++) {
                const mx = (hash(seed + k * 11 + 3) - 0.5) * r * 1.4, my = (hash(seed + k * 11 + 4) - 0.5) * r * 1.4;
                const mg = ctx.createRadialGradient(mx, my, 0, mx, my, r * 0.28); mg.addColorStop(0, 'rgba(84,120,40,.75)'); mg.addColorStop(1, 'rgba(84,120,40,0)');
                ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, r * 0.28, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
            // ombrage de volume (éclairage fixe) et reflet
            ctx.save(); path(); ctx.clip();
            const sh = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.3, x + r * 0.25, y + r * 0.3, r * 1.2);
            sh.addColorStop(0, 'rgba(255,230,180,.18)');             sh.addColorStop(0.5, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,.4)');
            ctx.fillStyle = sh; ctx.fillRect(x - r * 1.3, y - r * 1.3, r * 2.6, r * 2.6);
            ctx.restore();
            ctx.strokeStyle = 'rgba(15,10,5,.75)'; ctx.lineWidth = r * 0.04; path(); ctx.stroke();
            ctx.restore();
        }

        /* tyrannosaure géant de profil (il marche vers la gauche, donc descend les marches) : peau écailleuse olive, ventre clair, rayures,
           mâchoire ouverte avec dents, œil jaune à pupille fendue, pattes qui piétinent en cadence, queue qui balance */
        function drawDino(g, b) {
            const p = rollPos(b), el = clock - b.t, u = g.SH * 0.62, ang = Math.atan2(g.SH, g.SW);
            let x = stepX(g, p) + g.SW * 0.3, y = stepY(g, p), tilt = -ang;
            if (p < 0) { const t = -p / DINO_SPEED; y += t * t * g.h * 0.6; tilt -= t * 0.25; }
            if (x > g.w + u * 8 || x < -u * 8 || y > g.h + u * 6) return;
            const ph = el * 4.2 * Math.PI / 1.6, roar = Math.max(0, Math.sin(el * 2.1)) * 0.5 + (b.hit ? 0.45 : 0);
            ctx.save();
            ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(u, u); ctx.translate(-5, p > 0 ? -Math.abs(Math.sin(ph)) * 0.08 : 0);
            ctx.lineJoin = 'round'; ctx.lineCap = 'round';

            skin.addColorStop(0, '#6f7a34'); skin.addColorStop(0.45, '#58632a'); skin.addColorStop(0.75, '#8c9144'); skin.addColorStop(1, '#cdbf86');
            const dark = ctx.createLinearGradient(0, -3, 0, 0); dark.addColorStop(0, '#46501f'); dark.addColorStop(1, '#262c10');
            const sway = Math.sin(ph * 0.5) * 0.25;

                ctx.lineWidth = 0.85; ctx.beginPath(); ctx.moveTo(K[0], K[1]); ctx.lineTo(A[0], A[1]); ctx.stroke();
                ctx.lineWidth = 0.5; ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(F[0], F[1] - 0.1); ctx.stroke();
                ctx.lineWidth = 0.4; ctx.beginPath(); ctx.moveTo(F[0], F[1] - 0.15); ctx.lineTo(F[0] - 0.75, F[1] - 0.12); ctx.stroke();
                ctx.fillStyle = '#e8dcc0';
                for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(F[0] - 0.95 - 0, F[1] - 0.26 + k * 0.1); ctx.lineTo(F[0] - 1.22, F[1] - 0.12 + k * 0.08); ctx.lineTo(F[0] - 0.95, F[1] - 0.04 + k * 0.08); ctx.fill(); }
            };
            leg(5.0, ph + Math.PI, true);
            // queue
            ctx.fillStyle = skin; ctx.beginPath(); ctx.moveTo(6.4, -4.1); ctx.bezierCurveTo(8, -3.9 + sway, 9.6, -3.3 + sway, 11.2, -2.7 + sway * 2);
            ctx.bezierCurveTo(9.6, -2.55 + sway, 8, -2.5, 6.8, -2.1); ctx.closePath(); ctx.fill();
            // corps
            const body = () => {
                ctx.beginPath(); ctx.moveTo(1.8, -5.05);
                ctx.bezierCurveTo(3.0, -5.15, 4.8, -4.95, 6.5, -4.15);
                ctx.bezierCurveTo(7.2, -3.8, 7.2, -2.6, 6.6, -2.2);
                ctx.bezierCurveTo(6, -1.85, 5.4, -1.75, 5.0, -1.7);
                ctx.bezierCurveTo(3.8, -1.55, 2.8, -2.0, 2.25, -2.8);
                ctx.bezierCurveTo(1.9, -3.15, 1.7, -3.5, 1.7, -3.95); ctx.closePath();
            };
            ctx.fillStyle = skin; body(); ctx.fill();
            ctx.save(); body(); ctx.clip();
            // rayures dorsales sombres et écailles
            ctx.fillStyle = 'rgba(25,30,8,.38)';
            for (let k = 0; k < 7; k++) { ctx.beginPath(); ctx.moveTo(2.6 + k * 0.62, -5.3); ctx.quadraticCurveTo(2.9 + k * 0.62, -4.3, 2.5 + k * 0.62 + 0.4, -3.4); ctx.lineTo(2.85 + k * 0.62 + 0.4, -3.4); ctx.quadraticCurveTo(3.4 + k * 0.62, -4.3, 3.05 + k * 0.62, -5.3); ctx.fill(); }
            for (let k = 0; k < 110; k++) {

            const vol = ctx.createLinearGradient(0, -5.2, 0, -1.6); vol.addColorStop(0, 'rgba(255,240,170,.28)'); vol.addColorStop(0.4, 'rgba(0,0,0,0)'); vol.addColorStop(1, 'rgba(0,0,0,.25)');
            ctx.fillStyle = vol; ctx.fillRect(1.5, -5.4, 6, 4);

            // petits bras griffus

            ctx.beginPath(); ctx.moveTo(2.5, -3.3); ctx.lineTo(1.85, -2.75); ctx.lineTo(1.5, -2.95 + Math.sin(ph) * 0.12); ctx.stroke();
            ctx.fillStyle = '#efe6cc'; ctx.beginPath(); ctx.moveTo(1.5, -3.1); ctx.lineTo(1.2, -2.9); ctx.lineTo(1.5, -2.82); ctx.fill();

            ctx.moveTo(-1.55, -4.5); ctx.bezierCurveTo(-1.5, -5.25, -0.7, -5.65, 0.4, -5.55); ctx.bezierCurveTo(1.2, -5.45, 1.9, -5.1, 2.0, -4.6);

            for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.moveTo(-2.4 + k * 0.38, 0.08); ctx.lineTo(-2.3 + k * 0.38, -0.3); ctx.lineTo(-2.15 + k * 0.38, 0.08); ctx.fill(); }

        /* horde de hyènes tachetées qui chargent en galopant vers la gauche (donc en dévalant les marches) : dos oblique, crinière hérissée,

        function drawHyenas(g, b) {
            const ang = Math.atan2(g.SH, g.SW), el = clock - b.t, u0 = g.SH * 0.5;
            const pack = [[0, 1, 0], [0.7, 0.92, 1.7], [1.35, 1.06, 3.1], [2.0, 0.88, 4.4], [2.7, 1, 0.9], [3.3, 0.94, 2.6]];

            pack.slice().reverse().forEach(([off, sc, ph0], idx) => {
                const p = rollPos(b) + off, u = u0 * sc, i = pack.length - 1 - idx;
                let x = stepX(g, p) + g.SW * 0.3, y = stepY(g, p), tilt = -ang;
                if (p < 0) { const t = -p / HYENA_SPEED; y += t * t * g.h * 0.6; tilt -= t * 0.3; }
                if (x > g.w + u * 6 || x < -u * 6 || y > g.h + u * 4) return;
                const ph = el * 11 + ph0, bob = p > 0 ? -Math.abs(Math.sin(ph)) * 0.12 : 0, gape = 0.12 + Math.max(0, Math.sin(el * 5 + ph0)) * 0.14 + (b.hit ? 0.12 : 0);
                ctx.save();

                ctx.lineJoin = 'round'; ctx.lineCap = 'round';
                ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 0.04 - bob, 1.4, 0.1, 0, 0, Math.PI * 2); ctx.fill();
                const coat = ctx.createLinearGradient(0, -1.9, 0, -0.6);
                coat.addColorStop(0, '#6d5634'); coat.addColorStop(0.35, fur[i % 3]); coat.addColorStop(1, '#d9c08c');
                const leg = (hx, phase, front, shade) => {
                    const s = Math.sin(phase), c = Math.cos(phase), lift = Math.max(0, c) * 0.28;
                    const top = front ? -1.0 : -0.95, fx = hx + s * 0.5, fy = -lift;
                    ctx.strokeStyle = shade ? '#7a6038' : '#a98a58'; ctx.lineWidth = front ? 0.2 : 0.22;
                    ctx.beginPath(); ctx.moveTo(hx, top); ctx.quadraticCurveTo(hx + s * 0.28 + (front ? 0 : 0.18), -0.5, fx, fy - 0.08); ctx.stroke();
                    ctx.strokeStyle = '#2b2118'; ctx.lineWidth = 0.17;
                    ctx.beginPath(); ctx.moveTo(fx, fy - 0.16); ctx.lineTo(fx - 0.12, fy); ctx.stroke();
                };
                leg(0.75, ph + Math.PI * 0.9, false, true); leg(-0.7, ph + Math.PI, true, true);

                ctx.beginPath(); ctx.moveTo(1.05, -1.1); ctx.quadraticCurveTo(1.45, -1.0 + Math.sin(ph) * 0.06, 1.55, -0.7); ctx.stroke();
                ctx.strokeStyle = '#1f1710'; ctx.lineWidth = 0.17; ctx.beginPath(); ctx.moveTo(1.5, -0.8); ctx.lineTo(1.56, -0.58); ctx.stroke();
                // corps : épaules hautes, croupe basse
                ctx.fillStyle = coat; ctx.strokeStyle = '#3a2c18'; ctx.lineWidth = 0.035;
                ctx.beginPath();
                ctx.moveTo(-0.95, -1.3); ctx.quadraticCurveTo(-0.6, -1.78, -0.2, -1.72);
                ctx.quadraticCurveTo(0.5, -1.55, 1.05, -1.25); ctx.quadraticCurveTo(1.25, -1.0, 1.0, -0.82);
                ctx.quadraticCurveTo(0.4, -0.7, -0.2, -0.72); ctx.quadraticCurveTo(-0.85, -0.78, -0.95, -1.3);
                ctx.fill(); ctx.stroke();
                // taches
                ctx.fillStyle = 'rgba(52,36,20,.7)';
                [[-0.3, -1.25, 0.09], [0.1, -1.05, 0.1], [0.5, -1.2, 0.08], [0.75, -0.98, 0.09], [-0.05, -1.5, 0.07], [0.35, -0.85, 0.07], [0.9, -1.15, 0.06]].forEach(([sx, sy, sr]) => {
                    ctx.beginPath(); ctx.ellipse(sx, sy, sr * 1.3, sr, 0.4, 0, Math.PI * 2); ctx.fill();
                });
                // crinière hérissée
                ctx.fillStyle = '#35271a'; ctx.beginPath(); ctx.moveTo(-0.85, -1.4);
                for (let k = 0; k < 9; k++) { const mx = -0.8 + k * 0.17; ctx.lineTo(mx + 0.05, -1.82 + k * 0.045 - 0.1 - (k % 2) * 0.08); ctx.lineTo(mx + 0.11, -1.74 + k * 0.045); }
                ctx.lineTo(0.7, -1.5); ctx.lineTo(-0.2, -1.5); ctx.closePath(); ctx.fill();
                leg(0.55, ph, false, false); leg(-0.5, ph + Math.PI * 0.12, true, false);
                // cou et tête
                ctx.fillStyle = coat; ctx.beginPath();
                ctx.moveTo(-0.8, -1.65); ctx.quadraticCurveTo(-1.15, -1.7, -1.4, -1.45); ctx.lineTo(-1.4, -1.0);
                ctx.quadraticCurveTo(-1.0, -0.95, -0.75, -1.0); ctx.closePath(); ctx.fill(); ctx.stroke();
                // mâchoire inférieure
                ctx.fillStyle = '#4a2f2a'; ctx.beginPath();
                ctx.moveTo(-1.3, -1.12); ctx.lineTo(-1.78, -1.12 + gape * 1.6); ctx.quadraticCurveTo(-1.8, -0.98 + gape * 1.6, -1.55, -0.95 + gape); ctx.lineTo(-1.05, -1.0); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#f6eede';
                for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(-1.68 + k * 0.17, -1.1 + gape * 1.5); ctx.lineTo(-1.62 + k * 0.17, -1.25 + gape * 0.6); ctx.lineTo(-1.56 + k * 0.17, -1.1 + gape * 1.5); ctx.fill(); }
                // museau noir
                const sn = ctx.createLinearGradient(-1.85, -1.45, -1.3, -1.15);

                ctx.moveTo(-1.25, -1.62); ctx.quadraticCurveTo(-1.65, -1.52, -1.82, -1.3); ctx.quadraticCurveTo(-1.84, -1.16, -1.68, -1.14);
                ctx.lineTo(-1.25, -1.15); ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#f6eede';
                for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(-1.7 + k * 0.17, -1.15); ctx.lineTo(-1.64 + k * 0.17, -1.15 - 0.1 - (k === 0 ? 0.06 : 0)); ctx.lineTo(-1.58 + k * 0.17, -1.15); ctx.fill(); }
                // oreille ronde, œil ambré
                ctx.fillStyle = '#4a3a22'; ctx.beginPath(); ctx.arc(-1.0, -1.72, 0.17, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#c99a8a'; ctx.beginPath(); ctx.arc(-1.0, -1.72, 0.09, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#f2b640'; ctx.beginPath(); ctx.ellipse(-1.38, -1.45, 0.075, 0.05, -0.3, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#0a0806'; ctx.beginPath(); ctx.arc(-1.4, -1.45, 0.03, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            });
        }

        function drawActors(g) {
            const fs = Math.max(18, g.SH * 0.9);
            ctx.font = `${fs}px "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
            rolls.forEach((b, i) => {
                if (b.bus || b.dino || b.hyena) return;
                const r = g.SH * (b.rock ? 0.8 : 0.42), el = clock - b.t, p = rollPos(b);
                let x, y, rot = el * (b.rock ? 4 : 9);
                if (p > 0) {
                    const k = Math.floor(p), q = 1 - (p - k);
                    const top = stepY(g, k + 1) - r, low = stepY(g, k) - r;
                    x = stepX(g, p) + g.SW * 0.3;
                    y = top + (low - top) * q * q - Math.sin(Math.PI * q) * r * (b.rock ? 0.4 : 0.25);
                } else {
                    // au-delà de la marche 0 : l'objet quitte la plate-forme et tombe hors du décor
                    const t = -p / (b.rock ? ROCK_SPEED : ROLL_SPEED);
                    x = stepX(g, p) + g.SW * 0.3;
                    y = stepY(g, 0) - r + t * t * g.h * 2.2;
                }
                if (x < -g.SW || x > g.w + g.SW * 2 || y > g.h + r * 2) return;
                if (b.rock) drawRock(x, y, r, rot, b.seed); else drawBowlingBall(x, y, r, rot);
            });
            ctx.font = `${fs}px "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
            const flying = !!(seg && seg.kind === 'jet'), jk = flying ? Math.min(1, seg.t / seg.dur) : 0;
            const carried = !!(seg && seg.kind === 'eagle'), ek = carried ? Math.min(1, seg.t / seg.dur) : 0, ea = clock - eagleEnd;
            const n = Math.min(TOP, Math.floor(posDisp)), f = posDisp - n;
            const hang = carried ? g.SH * 1.1 * Math.min(1, Math.max(0, (ek - 0.2) / 0.06)) * Math.min(1, (1 - ek) / 0.08) : 0;
            const lift = flying ? Math.sin(Math.PI * Math.min(1, jk * 1.15)) * g.SH * 1.5 : hang;
            const lx = stepX(g, posDisp), ly = (flying || carried ? stepY(g, posDisp) : stepY(g, heightOf(posDisp)) - Math.sin(Math.PI * jumpT(f)) * g.SH * 0.8) - lift;
            const jet = flying ? { fl: 1 } : (clock < jetUntil ? { fl: Math.max(0, (jetUntil - clock) / 0.7) } : null);
            // halo de lumière sur le lion
            const halo = ctx.createRadialGradient(lx, ly - g.SH, 10, lx, ly - g.SH, g.SW * 1.2);
            halo.addColorStop(0, 'rgba(255,230,150,.35)'); halo.addColorStop(1, 'rgba(255,200,80,0)');
            ctx.fillStyle = halo; ctx.fillRect(lx - g.SW * 1.2, ly - g.SW * 1.4, g.SW * 2.4, g.SW * 2.4);
            const riding = !!(seg && seg.kind === 'moto'), mo = clock - motoEnd;
            const motoU = g.SH * 1.25, motoAng = Math.atan2(g.SH, g.SW);
            if (riding) {
                const mk = Math.min(1, seg.t / seg.dur), wheelie = 0.42 * Math.max(0, 1 - mk * 5) + 0.05 * Math.sin(clock * 18);
                drawMoto(g, lx - motoU * 0.85, stepY(g, posDisp) - motoU * 0.06 + Math.sin(clock * 40) * motoU * 0.03, motoU, motoAng, wheelie, true, 1, posDisp * Math.PI * 4 + Math.PI / 2);
            } else {
                drawLion(lx - g.SW * 0.05, ly, g.SW * 0.6, posDisp * Math.PI * 4 + Math.PI / 2, flying ? 0.22 : (jumpT(f) > 0 && jumpT(f) < 1 ? 0.3 : 0), jet);
                if (mo >= 0 && mo < 0.9) drawMoto(g, lx - motoU * 0.85 + mo * mo * g.SW * 9 + mo * g.SW, stepY(g, posDisp) - motoU * 0.06, motoU, motoAng, 0, false, 1 - mo / 0.9, 0);
            }
            rolls.forEach(b => { if (b.bus) drawBus(g, b); else if (b.dino) drawDino(g, b); else if (b.hyena) drawHyenas(g, b); });
            // aigle : plonge vers le lion, l'emporte dans ses serres, puis repart vers le ciel
            const eu = g.SW * 0.3, gripY = ly - g.SW * 0.6 * 1.15, bodyY = gripY - eu * 1.05, ex = lx - g.SW * 0.05;
            if (carried) {
                if (ek < 0.22) {
                    const t = ek / 0.22, r = 1 - t * t * (3 - 2 * t);
                    drawEagle(ex + r * g.SW * 5, bodyY - r * g.h * 0.55 + Math.sin(clock * 9) * eu * 0.08, eu, clock * 9, 0.35 * r, false);
                } else drawEagle(ex, bodyY + Math.sin(clock * 5) * eu * 0.05, eu, clock * 6, 0, true);
            } else if (ea >= 0 && ea < 1.6) {
                const t = ea / 1.6;
                drawEagle(ex + t * g.SW * 5, bodyY - t * t * g.h * 0.9, eu, clock * 8, -0.3 * t, false, 1 - t * t);
            }
        }

        /* aigle royal de profil (il regarde vers la gauche) : tête blanche, bec crochu doré, ailes à longues rémiges qui battent, queue en éventail,
           serres jaunes qui agrippent le lion quand grip = true */
        function drawEagle(x, y, u, ph, tilt, grip, alpha) {
            const flap = Math.sin(ph) * 0.75;
            ctx.save();
            ctx.globalAlpha = alpha == null ? 1 : alpha;
            ctx.translate(x, y); ctx.rotate(tilt); ctx.scale(u, u);
            ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            const wing = (ang, dark) => {
                ctx.save(); ctx.translate(0.15, -0.3); ctx.rotate(ang);
                const wg = ctx.createLinearGradient(0, 0, 3.3, 0.6);
                wg.addColorStop(0, dark ? '#2a1a0e' : '#4a2f18'); wg.addColorStop(0.6, dark ? '#3a2512' : '#6b4524'); wg.addColorStop(1, '#1b1109');
                ctx.fillStyle = wg; ctx.strokeStyle = '#1a0f07'; ctx.lineWidth = 0.03;
                ctx.beginPath(); ctx.moveTo(0, 0.25);
                ctx.bezierCurveTo(0.8, -0.35, 2.2, -0.45, 3.5, -0.05);
                ctx.lineTo(3.25, 0.25); ctx.lineTo(3.4, 0.55); ctx.lineTo(3.0, 0.45); ctx.lineTo(3.0, 0.85);
                ctx.lineTo(2.6, 0.65); ctx.lineTo(2.55, 1.05); ctx.lineTo(2.1, 0.8); ctx.lineTo(2.0, 1.15);
                ctx.lineTo(1.5, 0.9); ctx.lineTo(1.3, 1.1); ctx.lineTo(0.7, 0.85); ctx.lineTo(0, 0.7);
                ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 0.025;
                for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.moveTo(0.6 + k * 0.45, 0.1); ctx.lineTo(0.75 + k * 0.45, 0.85 + (k % 2) * 0.12); ctx.stroke(); }
                ctx.fillStyle = 'rgba(210,170,110,.45)';
                for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.ellipse(0.55 + k * 0.5, 0.05, 0.3, 0.1, 0.1, 0, Math.PI * 2); ctx.fill(); }
                ctx.restore();
            };
            wing(-Math.PI / 2 - flap + 0.35, true);
            // queue en éventail blanche à bout sombre
            ctx.fillStyle = '#f2ede2'; ctx.strokeStyle = '#8a7f6a'; ctx.lineWidth = 0.025;
            ctx.beginPath(); ctx.moveTo(0.7, 0); ctx.lineTo(2.0, -0.18 + flap * 0.05); ctx.lineTo(2.1, 0.12); ctx.lineTo(1.95, 0.4); ctx.lineTo(0.8, 0.35); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.strokeStyle = 'rgba(120,110,90,.5)';
            for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.moveTo(0.9, 0.03 + k * 0.08); ctx.lineTo(2.0, -0.1 + k * 0.17); ctx.stroke(); }
            // corps
            const body = ctx.createLinearGradient(0, -0.6, 0, 0.6);
            body.addColorStop(0, '#6b4524'); body.addColorStop(0.55, '#4a2f18'); body.addColorStop(1, '#2a190c');
            ctx.fillStyle = body; ctx.strokeStyle = '#1a0f07'; ctx.lineWidth = 0.03;
            ctx.beginPath(); ctx.moveTo(-0.85, -0.2); ctx.bezierCurveTo(-0.6, -0.65, 0.5, -0.62, 1.0, -0.12);
            ctx.bezierCurveTo(1.05, 0.3, 0.3, 0.6, -0.3, 0.55); ctx.bezierCurveTo(-0.8, 0.45, -0.95, 0.1, -0.85, -0.2); ctx.fill(); ctx.stroke();
            ctx.strokeStyle = 'rgba(210,170,110,.35)'; ctx.lineWidth = 0.03;
            for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.arc(-0.35 + k * 0.2, 0.05 + (k % 2) * 0.12, 0.13, 0.2, Math.PI - 0.2); ctx.stroke(); }
            // pattes à plumes (culottes) et serres
            const thigh = ctx.createLinearGradient(0, 0.2, 0, 0.7); thigh.addColorStop(0, '#d9c8a0'); thigh.addColorStop(1, '#8c6a3a');
            [[0.1, 0.12], [-0.28, 0]].forEach(([lx2, dx]) => {
                const spread = grip ? 0.1 : 0.25;
                ctx.fillStyle = thigh; ctx.strokeStyle = '#4a2f18'; ctx.lineWidth = 0.025;
                ctx.beginPath(); ctx.ellipse(lx2, 0.4, 0.2, 0.28, 0.1, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                const fx = lx2 - spread * 0.4 + dx * 0.2, fy = grip ? 1.1 : 0.95;
                ctx.strokeStyle = '#e8b82a'; ctx.lineWidth = 0.13;
                ctx.beginPath(); ctx.moveTo(lx2, 0.6); ctx.lineTo(fx, fy); ctx.stroke();
                ctx.lineWidth = 0.09;
                [-0.26, -0.08, 0.1].forEach(o => {
                    ctx.beginPath(); ctx.moveTo(fx, fy); ctx.quadraticCurveTo(fx + o * 1.2, fy + 0.2, fx + o * (grip ? 0.5 : 0.9), fy + (grip ? 0.3 : 0.38)); ctx.stroke();
                    ctx.strokeStyle = '#1b1109'; ctx.lineWidth = 0.05; ctx.beginPath(); ctx.moveTo(fx + o * (grip ? 0.5 : 0.9), fy + (grip ? 0.3 : 0.38)); ctx.lineTo(fx + o * 0.6, fy + 0.46); ctx.stroke();
                    ctx.strokeStyle = '#e8b82a'; ctx.lineWidth = 0.09;
                });
            });
            // cou et tête blancs
            ctx.fillStyle = '#f5f0e4'; ctx.strokeStyle = '#a89c84'; ctx.lineWidth = 0.025;
            ctx.beginPath(); ctx.moveTo(-0.6, -0.4); ctx.bezierCurveTo(-0.75, -0.75, -1.1, -0.8, -1.25, -0.58);
            ctx.bezierCurveTo(-1.35, -0.4, -1.2, -0.2, -1.0, -0.12); ctx.lineTo(-0.7, 0.1); ctx.closePath(); ctx.fill(); ctx.stroke();
            // bec crochu
            const bk = ctx.createLinearGradient(-1.8, -0.5, -1.2, -0.2); bk.addColorStop(0, '#f5c93a'); bk.addColorStop(1, '#c8901a');
            ctx.fillStyle = bk; ctx.strokeStyle = '#7a5410'; ctx.lineWidth = 0.025;
            ctx.beginPath(); ctx.moveTo(-1.22, -0.68); ctx.bezierCurveTo(-1.6, -0.72, -1.85, -0.55, -1.8, -0.32);
            ctx.bezierCurveTo(-1.74, -0.38, -1.7, -0.36, -1.66, -0.28); ctx.lineTo(-1.25, -0.3); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.strokeStyle = '#3a2808'; ctx.beginPath(); ctx.moveTo(-1.25, -0.4); ctx.lineTo(-1.62, -0.36); ctx.stroke();
            // œil jaune, arcade sourcilière sévère
            ctx.fillStyle = '#ffd21c'; ctx.beginPath(); ctx.arc(-1.12, -0.56, 0.065, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-1.14, -0.56, 0.035, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#7a6d55'; ctx.lineWidth = 0.04; ctx.beginPath(); ctx.moveTo(-1.02, -0.66); ctx.lineTo(-1.3, -0.58); ctx.stroke();
            wing(-Math.PI / 2 - flap, false);
            ctx.restore();
        }

        function floatText(text, x, y) {
            const el = document.createElement('div');
            el.className = 'float'; el.textContent = text;
            el.style.left = x + 'px'; el.style.top = y + 'px';

        /* ---------- logique : 1 pièce = 1 marche, tous poussent le même lion ---------- */
        function award(viewer, amount, sim) {
            viewer.stars += amount;
            if (!sim && amount > 0 && window.ArcadeStars) {
                window.ArcadeStars.award({ username: viewer.username, amount })
                    .catch(error => { console.error('Étoiles non enregistrées :', error); say('Étoiles non enregistrées : ' + error.message); });
            }
            saveGame(); refreshBoards();
        }

        function enqueue(viewer, coins, sim) {
            coins = Math.min(500, Math.max(1, Math.floor(coins)));
            let entry = queue.find(q => q.viewer === viewer && q.sim === sim);
            if (!entry) {
                if (queue.length >= 80) return;
                entry = { viewer, sim, credits: 0 };
                queue.push(entry);
            }
            entry.credits += coins;
        }

        function planStep() {
            const entry = queue[0];
            entry.credits--;
            queue.shift();
            if (entry.credits > 0) queue.push(entry);
            current = entry.viewer;
            const target = pos + 1;
            if (target >= TOP) {
                moves.push({ to: TOP, kind: 'up', win: entry });
                pos = TOP;
            } else {
                moves.push({ to: target, kind: 'up' });
                pos = target;
            }
        }

        function victory(entry) {
            victories++;
            const winner = entry.viewer, gained = Math.max(0, Math.floor(settings.winStars) || 0);
            if (gained > 0) award(winner, gained, !!entry.sim);
            say(`🏆 @${winner.username} mène le lion au sommet et gagne ${gained} ⭐ !`);
            showVip(winner, gained);
            const g = geo();
            sndWin();
            if (window.ArcadeEffects) ArcadeEffects.fireworks(g.cx, g.top, true);
            resetAt = clock + 4;
        }

        function climbReset() {
            pos = 0; posDisp = 0; seg = null; moves = []; resetAt = 0; nextAt = clock + 0.3;
            buildObstacles();
        }

        function stepSeg(dt) {
            if (!seg) return;
            seg.t += dt;
            const k = Math.min(1, seg.t / seg.dur);
            let e = seg.kind === 'up' ? k : k * k * (3 - 2 * k);
            if (seg.kind === 'eagle') { const q = Math.min(1, Math.max(0, (k - 0.22) / 0.78)); e = q * q * (3 - 2 * q); }
            posDisp = seg.from + (seg.to - seg.from) * e;
            if (k < 1) return;
            const done = seg; seg = null; posDisp = done.to; nextAt = clock + (done.kind === 'fall' ? 0.5 : 0.18);
            if (done.kind === 'up') sndUp();
            if (done.kind === 'jet') jetUntil = clock + 0.7;
            if (done.kind === 'moto') motoEnd = clock;
            if (done.kind === 'eagle') eagleEnd = clock;
            if (done.win) victory(done.win);
        }

        function updateScoreboard() {
            const sb = $('scoreboard'), who = queue[0] ? '@' + queue[0].viewer.username : (current ? '@' + (current.username || current) : '');
            sb.textContent = '';
            const text = `Marche ${Math.round(posDisp)}/${TOP} | Victoires : ${victories}`;
            if (who && (queue.length || seg)) {
                sb.append('Au tour de ');
                const b = document.createElement('b'); b.textContent = who; sb.append(b, ' | ' + text);
            } else sb.textContent = `En attente d'un joueur | ${text}`;
        }

        let last = performance.now();
        function frame(now) {
            const dt = Math.min(0.05, (now - last) / 1000) * settings.speed;
            last = now;
            clock += dt;
            if (resetAt && clock >= resetAt) climbReset();
            if (!seg && moves.length) {
                const m = moves.shift();
                seg = Object.assign({ from: posDisp, t: 0, dur: m.kind === 'up' ? 0.45 : 0.7 }, m);
            } else if (!seg && !moves.length && !resetAt && queue.length && clock >= nextAt) planStep();
            stepSeg(dt);
            updateRolls();
            const g = geo();
            cam += (posDisp - cam) * Math.min(1, dt * (seg && (seg.kind === 'jet' || seg.kind === 'moto') ? 18 : seg && seg.kind === 'eagle' ? 9 : 6));
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawSavanna(g); drawTemple(g); drawActors(g);
            updateScoreboard();
            requestAnimationFrame(frame);
        }

        /* ---------- TikTok ---------- */
        let socket = null, reconnectTimer = null;
        const setStatus = m => { $('live-status').textContent = m; };
        /* 1 pièce = 1 marche ; un gros cadeau vaut autant de marches que de pièces */
        function coinsOf(g) {
            if (Number.isFinite(Number(g.coinCount)) && Number(g.coinCount) >= 1) return Math.floor(Number(g.coinCount));
            const d = Math.max(1, Math.floor(Number(g.diamondCount ?? g.diamonds ?? g.coinValue) || 1));
            const r = Math.max(1, Math.floor(Number(g.repeatCount) || 1));
            return d * r;
        }
        function handleMessage(data) {
            if (data.type === 'STATUS') setStatus(data.message || 'Statut TikTok reçu.');
            else if (data.type === 'gift' || data.type === 'tiktok-gift') {
                const g = data.gift ?? data;
                const v = getViewer(g.uniqueId || g.username || g.nickname);
                const pic = g.avatarUrl || (Array.isArray(g.avatarUrls) && g.avatarUrls[0]) || '';
                if (/^https?:\/\//i.test(pic)) v.avatar = pic;
                gift(v, coinsOf(g), false);
            }
        }
        function connect() {
            const name = $('username').value.trim().replace(/^@/, ''), url = $('ws-url').value.trim();
            if (!name || !url) { setStatus('Pseudo TikTok et adresse requis.'); return; }
            clearTimeout(reconnectTimer);
            if (socket) { socket.onclose = null; socket.close(); }
            try { socket = new WebSocket(url); } catch (e) { setStatus('Adresse invalide.'); return; }
            const active = socket;
            setStatus(`Connexion au live de @${name}…`);
            active.addEventListener('open', () => active.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username: name })));
            active.addEventListener('message', ev => { try { handleMessage(JSON.parse(ev.data)); } catch (e) { console.warn('Message invalide', e); } });
            active.addEventListener('error', () => setStatus('Connexion impossible.'));
            active.addEventListener('close', () => { if (socket !== active) return; setStatus('Reconnexion…'); reconnectTimer = setTimeout(connect, 3000); });
        }
        /* RUN : le serveur a déjà débité le portefeuille global, une étoile = une marche */
        window.addEventListener('arcade:wallet-run', e => {
            const p = e.detail && e.detail.player, spent = Math.floor(Number(e.detail && e.detail.spent) || 0);
            const name = p && (p.username || p.uniqueId || p.nickname);
            if (name && spent > 0) gift(getViewer(name), spent, false);
        });

                geoW.floating = on;
                win.classList.toggle('floating', on); win.classList.toggle('docked', !on);
                if (on) { document.body.appendChild(win); applyGeo(); btn.textContent = '⇲ Rattacher'; }
                else { home.children[0] ? home.children[0].after(win) : home.prepend(win); Object.assign(win.style, { left: '', top: '', width: '', height: '' }); btn.textContent = '⧉ Détacher'; }
                persist();
            }
            btn.addEventListener('click', () => setFloating(!geoW.floating));
            head.addEventListener('pointerdown', e => {
                if (!geoW.floating || e.target === btn) return;
                const dx = e.clientX - geoW.x, dy = e.clientY - geoW.y;
                head.setPointerCapture(e.pointerId);
                const move = ev => { geoW.x = ev.clientX - dx; geoW.y = ev.clientY - dy; applyGeo(); };
                const up = () => { head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up); persist(); };
                head.addEventListener('pointermove', move); head.addEventListener('pointerup', up);
            });
            new ResizeObserver(() => {
                if (!geoW.floating) return;
                const r = win.getBoundingClientRect();
                if (Math.abs(r.width - geoW.w) > 1 || Math.abs(r.height - geoW.h) > 1) { geoW.w = r.width; geoW.h = r.height; persist(); }
            }).observe(win);
            addEventListener('resize', () => geoW.floating && applyGeo());

            let lastSig = null;
            function refresh() {
                const sig = queue.map(q => q.viewer.username + q.credits).join('|');
                if (sig === lastSig) return;
                lastSig = sig;
                $('qtitle').textContent = `⏳ MARCHES EN ATTENTE (${queue.reduce((n, q) => n + q.credits, 0)})`;
                list.textContent = '';
                if (!queue.length) { const li = document.createElement('li'); li.className = 'qempty'; li.textContent = 'Aucune marche en attente'; list.appendChild(li); return; }
                queue.forEach((q, i) => {
                    const li = document.createElement('li');
                    if (i === 0) li.className = 'now';
                    const a = document.createElement('span'); a.className = 'rank'; a.textContent = i === 0 ? '▶' : '#' + i;
                    const b = document.createElement('span'); b.className = 'name'; b.textContent = '@' + q.viewer.username;
                    const c = document.createElement('span'); c.className = 'cnt'; c.textContent = '×' + q.credits;
                    li.append(a, b, c);
                    list.appendChild(li);
                });
            }
            setInterval(refresh, 200); refresh();
            if (geoW.floating) setFloating(true);
        }

        loadGame();
        syncControls();
        resize();
        buildObstacles();
        bindUi();
        bindQueueWindow();
        refreshBoards();
        requestAnimationFrame(frame);
    </script>
</body>
</html>
