            c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 1.2; c.lineCap = 'round';
            c.beginPath(); c.moveTo(x - rx * .25, y - ry * .2); c.lineTo(x + rx * .1, y - ry * .25); c.stroke();
        }

        function boneShape(c, x, y, len, ang, th) {
            c.save();
            c.translate(x, y); c.rotate(ang);
            const g = c.createLinearGradient(0, -th, 0, th);
            g.addColorStop(0, 'rgb(232,222,194)'); g.addColorStop(1, 'rgb(150,136,110)');
            c.fillStyle = g; c.strokeStyle = 'rgba(30,14,10,.8)'; c.lineWidth = .8;
            c.beginPath(); c.roundRect(-len / 2, -th * .55, len, th * 1.1, th * .5); c.fill(); c.stroke();
            [-1, 1].forEach(s => [-1, 1].forEach(t => {
                c.beginPath(); c.arc(s * len / 2, t * th * .55, th * .75, 0, TAU); c.fill(); c.stroke();
            }));
            c.restore();
        }

        function holeTear(c, rnd, x, y, w, h, eyes, glow, meta) {
            const n = 18, pts = [];
            for (let i = 0; i < n; i++) {
                const a = i / n * TAU, k = (i % 2 ? .66 : 1) * (.85 + rnd() * .3);
                pts.push([x + Math.cos(a) * w * k, y + Math.sin(a) * h * k]);
            }
            const trace = () => {
                c.beginPath();
                pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]));
                c.closePath();
            };
            c.save();
            c.shadowColor = 'rgba(0,0,0,.7)'; c.shadowBlur = 8;
            trace();
            const g = c.createRadialGradient(x, y, 2, x, y, w);
            g.addColorStop(0, 'rgb(2,0,2)'); g.addColorStop(1, 'rgb(70,6,16)');
            c.fillStyle = g; c.fill();
            c.restore();
            eyes.forEach(([ex, ey, er]) => glowEye(c, rnd, DECOR_P, x + ex, y + ey, er, { glow }, meta));
            trace();
            c.lineJoin = 'round';
            c.strokeStyle = 'rgba(160,110,76,.85)'; c.lineWidth = 2.6; c.stroke();
            c.strokeStyle = 'rgba(20,8,6,.95)'; c.lineWidth = 1; c.stroke();
            for (let i = 0; i < 4; i++) cotton(c, rnd, x + (rnd() - .5) * w * 1.3, y + h * .7 + rnd() * 6, 3 + rnd() * 4);
        }

        function buildScene() {
            const c = scene.getContext('2d');
            const rnd = rand(7);
            const meta = { glows: [] };
            c.save();
            c.clearRect(0, 0, W, H);

            // --- Ciel de nuit, lune de sang, chauves-souris ---
            const sky = c.createLinearGradient(0, 0, 0, 480);
            sky.addColorStop(0, '#07020f'); sky.addColorStop(.55, '#1d0838'); sky.addColorStop(1, '#4b1156');
            c.fillStyle = sky;
            c.fillRect(0, 0, W, 480);
            for (let i = 0; i < 130; i++) {
                c.fillStyle = `rgba(255,240,255,${.25 + rnd() * .6})`;
                c.beginPath(); c.arc(rnd() * W, rnd() * 330, .4 + rnd() * 1.1, 0, TAU); c.fill();
            }
            const mx = 1180, my = 108;
            let g = c.createRadialGradient(mx, my, 20, mx, my, 190);
            g.addColorStop(0, 'rgba(255,110,110,.38)'); g.addColorStop(1, 'rgba(255,110,110,0)');
            c.fillStyle = g; c.fillRect(mx - 190, my - 190, 380, 380);
            g = c.createRadialGradient(mx - 12, my - 10, 4, mx, my, 46);
            g.addColorStop(0, '#f6e6dc'); g.addColorStop(1, '#bf9a90');
            c.fillStyle = g; c.beginPath(); c.arc(mx, my, 46, 0, TAU); c.fill();
            c.fillStyle = 'rgba(120,80,90,.35)';
            [[-14, -12, 10], [12, 8, 13], [-6, 20, 6], [20, -18, 5]].forEach(([dx, dy, r]) => { c.beginPath(); c.arc(mx + dx, my + dy, r, 0, TAU); c.fill(); });
            c.fillStyle = 'rgba(150,20,40,.18)'; c.beginPath(); c.arc(mx, my, 46, 0, TAU); c.fill();
            [[1150, 118, 170, 9], [1215, 96, 120, 6], [1160, 140, 200, 8]].forEach(([cx, cy, w, h]) => {
                c.fillStyle = 'rgba(20,6,40,.55)';
                c.beginPath(); c.ellipse(cx, cy, w, h, 0, 0, TAU); c.fill();
            });
            bat(c, 1090, 70, 1, -.3); bat(c, 1260, 160, .8, .2); bat(c, 1000, 40, .7, .4); bat(c, 150, 100, .9, -.2); bat(c, 90, 150, .6, .3);

            // --- Silhouettes : chapiteau, grande roue, arbres morts, grille ---
            c.fillStyle = 'rgb(18,7,30)';
            c.beginPath();
            c.moveTo(10, 470); c.lineTo(10, 350); c.lineTo(130, 238); c.lineTo(250, 350); c.lineTo(250, 470);
            c.closePath(); c.fill();
            c.strokeStyle = 'rgb(18,7,30)'; c.lineWidth = 2;
            c.beginPath(); c.moveTo(130, 238); c.lineTo(130, 205); c.stroke();
            c.beginPath(); c.moveTo(130, 205); c.lineTo(160, 212); c.lineTo(146, 219); c.lineTo(160, 228); c.lineTo(130, 222); c.closePath(); c.fill();
            ferrisWheel(c, rnd, 1255, 300, 175);
            c.strokeStyle = 'rgb(13,5,24)'; c.lineCap = 'round';
            deadTree(c, rnd, 60, 470, 105, -Math.PI / 2 + .08, 9, 5);
            deadTree(c, rnd, 1105, 470, 95, -Math.PI / 2 - .1, 8, 5);
            deadTree(c, rnd, 1345, 470, 80, -Math.PI / 2 + .15, 7, 4);
            c.fillStyle = 'rgb(10,4,18)'; c.strokeStyle = 'rgb(10,4,18)'; c.lineWidth = 2;
            for (let x = 0; x < W; x += 22) {
                if (rnd() < .08) continue;
                const hh = 44 + rnd() * 8 - (rnd() < .15 ? 22 : 0), lean = (rnd() - .5) * 3;
                c.beginPath();
                c.moveTo(x, 470); c.lineTo(x + lean, 470 - hh); c.lineTo(x + 5 + lean, 470 - hh - 8); c.lineTo(x + 10 + lean, 470 - hh); c.lineTo(x + 10, 470);
                c.closePath(); c.fill();
            }
            c.fillRect(0, 450, W, 3); c.fillRect(0, 466, W, 3);
            g = c.createLinearGradient(0, 360, 0, 480);
            g.addColorStop(0, 'rgba(150,90,190,0)'); g.addColorStop(.7, 'rgba(150,90,190,.3)'); g.addColorStop(1, 'rgba(120,60,150,.05)');
            c.fillStyle = g; c.fillRect(0, 360, W, 120);

            while (c.measureText(text).width > maxWidth && s > 9) {
                s -= 1;
                c.font = `${weight} ${s}px Poppins, sans-serif`;
            }
        }

        function drawBanner(c, time) {
            const sway = Math.sin(time * 1.3) * 0.012;
            c.save();
            c.translate(290, 205);
            c.rotate(sway);
            // Tringle
            c.fillStyle = '#3b2418';
            c.fillRect(-105, -8, 210, 10);
            c.fillStyle = '#8a7a5a';
            c.beginPath(); c.arc(-105, -3, 7, 0, Math.PI * 2); c.arc(105, -3, 7, 0, Math.PI * 2); c.fill();
            // Étoffe usée au bord déchiré
            const g = c.createLinearGradient(0, 0, 0, 280);
            g.addColorStop(0, '#3a1860');
            g.addColorStop(1, '#1c0a38');
            c.fillStyle = g;
            c.beginPath();
            c.moveTo(-92, 2); c.lineTo(92, 2); c.lineTo(92, 252);
            [[70, 266], [52, 246], [30, 268], [8, 244], [-14, 270], [-36, 248], [-58, 268], [-78, 246], [-92, 260]].forEach(p => c.lineTo(p[0], p[1]));
            c.closePath();
            c.fill();
            c.lineWidth = 3;
            c.strokeStyle = '#6a4a8a';
            c.stroke();
            c.save();
            c.setLineDash([5, 4]);
            c.strokeStyle = 'rgba(225,215,180,.7)';
            c.lineWidth = 1.5;
            c.strokeRect(-80, 12, 160, 226);
            c.strokeRect(46, 196, 34, 32);
            c.restore();
            c.fillStyle = 'rgba(96,30,60,.85)';
            c.fillRect(47, 197, 32, 30);
            c.strokeStyle = 'rgba(0,0,0,.35)';
            c.lineWidth = 1.5;
            for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(56 + k * 8, 18); c.lineTo(66 + k * 8, 72); c.stroke(); }
            c.strokeStyle = 'rgba(100,6,20,.85)';
            c.lineWidth = 3;
            c.lineCap = 'round';
            [[-60, 22], [-20, 14], [50, 28]].forEach(([dx, len]) => { c.beginPath(); c.moveTo(dx, 4); c.lineTo(dx, 4 + len); c.stroke(); c.beginPath(); c.arc(dx, 6 + len, 2.4, 0, Math.PI * 2); c.fillStyle = 'rgba(100,6,20,.9)'; c.fill(); });
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            if (banner) {
                const pulse = 1 + Math.sin(time * 6) * 0.03;
                c.fillStyle = banner.kind === 'win' ? '#ff4fa3' : '#00d9ff';
                c.beginPath(); c.roundRect(-60, 18, 120, 20, 10); c.fill();
                c.fillStyle = '#fff';
                c.font = '900 12px Poppins, sans-serif';
                c.fillText(banner.kind === 'win' ? 'GAGNANT !' : 'TES ÉTOILES', 0, 28);
                drawAvatar(c, banner.viewer, 0, 84, 40);
                c.fillStyle = '#fff08c';
                fitText(c, cleanName(banner.viewer.username), 150, 18, 800);
                c.fillText(cleanName(banner.viewer.username), 0, 146);
                c.save();
                c.scale(pulse, pulse);
                c.fillStyle = '#7fe9ff';
                c.font = '900 34px Orbitron, Poppins, sans-serif';
                const value = banner.kind === 'win' ? `+${banner.reward}` : String(banner.viewer.stars);
                c.shadowColor = '#00f3ff';
                c.shadowBlur = 12;
                c.fillText(value, 0, 182);
                c.restore();
                c.fillStyle = '#ffd36b';
                c.font = '800 12px Poppins, sans-serif';
                c.fillText(banner.kind === 'win' ? '⭐ ÉTOILES' : '⭐ AU TOTAL', 0, 214);
            } else {
                const glow = 0.75 + Math.sin(time * 2.2) * 0.25;
                [['GRYPHON', 100, '#aef2ff', '#00d9ff'], ['AGENCY', 150, '#ff9ed0', '#ff4fa3']].forEach(([text, y, color, shadow]) => {
                    c.save();
                    c.font = '900 24px Orbitron, Poppins, sans-serif';
                    c.shadowColor = shadow;
                    c.shadowBlur = 16 * glow;
                    c.fillStyle = color;
                    c.fillText(text, 0, y);
                    c.shadowBlur = 0;
                    c.fillStyle = 'rgba(255,255,255,.55)';
                    c.fillText(text, 0, y - 1);
                    c.restore();
                });
            }
            c.restore();
        }

        function render(time) {
            const scale = Math.min(canvas.width / W, canvas.height / H);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#0b0418';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.setTransform(scale, 0, 0, scale, (canvas.width - W * scale) / 2, (canvas.height - H * scale) / 2);
            ctx.drawImage(scene, 0, 0);
            drawFogBack(ctx, time);

            slots.forEach((slot, i) => {
                if (!slot.plush) return;
                const x = slotX(i), y = slotY(i);
                ctx.save();
                if (slot.state === 'falling') {
                    ctx.translate(x + slot.dx, y + slot.dy);
                    ctx.rotate(slot.rot);
                    ctx.globalAlpha = Math.max(0, 1 - slot.t / 1.1);
                } else {
                    ctx.translate(x + Math.sin(time * 1.1 + i * 1.7) * 9, y);
                    ctx.rotate(Math.sin(time * 1.1 + i * 1.7 + 1) * 0.04);
                    if (slot.state === 'spawning') {
                        const k = Math.min(1, slot.t / 0.4);
                        const pop = k < 1 ? 1 + Math.sin(k * Math.PI) * 0.15 : 1;
                        ctx.scale(k * pop, k * pop);
                    }
                    if (slot.wobble > 0) ctx.rotate(Math.sin(slot.wobble * 30) * 0.12 * (slot.wobble / 0.7));
                }
                ctx.scale(0.8, 0.8);
                drawPlush(ctx, slot.plush, time, i);
                ctx.restore();
            });

            balls.forEach(b => {
                if (b.out) {
                    drawAvatar(ctx, b.viewer, b.x, b.y, 16);
                    return;
                }
                const k = b.t / b.dur;
                const tx = slotX(b.slot), ty = slotY(b.slot) - 40;
                const x = 707 + (tx - 707) * k;
                const y = 540 + (ty - 540) * k - Math.sin(k * Math.PI) * 90;
                const r = 26 - 10 * k;
                ctx.save();
                ctx.shadowColor = '#00f3ff';
                ctx.shadowBlur = 14;
                drawAvatar(ctx, b.viewer, x, y, r);
                ctx.restore();
            });

            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
                ctx.fillStyle = p.c;
                if (p.star) {
                    ctx.font = '16px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('★', p.x, p.y);
                } else {
                    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
                }
            });
            ctx.globalAlpha = 1;

            floaters.forEach(f => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, 1 - f.t / 1.6);
                ctx.textAlign = 'center';
                ctx.font = '900 30px Orbitron, Poppins, sans-serif';
                ctx.shadowColor = f.color;
                ctx.shadowBlur = 14;
                ctx.fillStyle = f.color;
                ctx.fillText(f.text, f.x, f.y - f.t * 50);
                ctx.restore();
            });

            drawBanner(ctx, time);
            drawVignette(ctx, time);

        }

        function resize() {
            const ratio = window.devicePixelRatio || 1;
            canvas.width = Math.round(innerWidth * ratio);
            canvas.height = Math.round(innerHeight * ratio);
        }
        addEventListener('resize', resize);

        let last = performance.now();
        function frame(now) {
            const dt = Math.min(0.05, (now - last) / 1000);
            last = now;
            update(dt);
            render(now / 1000);
            requestAnimationFrame(frame);
        }

        /* ---------- TikTok ---------- */
        let socket = null;
        let reconnectTimer = null;

        function setStatus(message) { $('live-status').textContent = message; }

        function handleMessage(data) {
            if (data.type === 'STATUS') {
                setStatus(data.message || 'Statut TikTok reçu.');
            } else if (data.type === 'viewer') {
                const v = data.viewer || {};
                const viewer = getViewer(v.username || v.nickname);
                setAvatar(viewer, v.avatarDataUri || v.profilePictureUrl);
            } else if (data.type === 'gift' || data.type === 'tiktok-gift') {
                const gift = data.gift ?? data;
                const viewer = getViewer(gift.username || gift.nickname, gift.profilePictureUrl || gift.avatarDataUri);
                recordContribution(viewer, 'coins', giftCoinCount(gift));
                queueShots(viewer, Math.min(10, Math.max(1, Math.floor(Number(gift.repeatCount) || 1))));
            } else if (data.type === 'comment' || data.type === 'tiktok-comment' || data.type === 'chat') {
                const c = data.commentData ?? data;
                const viewer = getViewer(c.username || c.nickname, c.profilePictureUrl || c.avatarDataUri);
                if (/^\s*(?:!\s*)?(?:étoile|etoile|star|⭐)s?\s*$|^\s*\*\s*$/iu.test(String(c.comment ?? c.text ?? ''))) claimStars(viewer);
            } else if (data.type === 'join' || data.type === 'member') {
                const v = data.viewer ?? data.user ?? data;
                getViewer(v.username || v.nickname, v.profilePictureUrl || v.avatarDataUri);
            }
        }

        function connect() {
            const name = $('username').value.trim().replace(/^@/, '');
            const url = $('ws-url').value.trim();
            if (!name || !url) { setStatus('Pseudo TikTok et adresse requis.'); return; }
            clearTimeout(reconnectTimer);
            if (socket) { socket.onclose = null; socket.close(); }
            try { socket = new WebSocket(url); } catch (error) { setStatus('Adresse invalide.'); return; }
            const active = socket;
            setStatus(`Connexion au live de @${name}…`);
            active.addEventListener('open', () => active.send(JSON.stringify({ action: 'CONNECT_TIKTOK', username: name })));
            active.addEventListener('message', event => {
                try { handleMessage(JSON.parse(event.data)); } catch (error) { console.warn('Message invalide', error); }
            });
            active.addEventListener('error', () => setStatus('Connexion impossible.'));
            active.addEventListener('close', () => {
                if (socket !== active) return;
                setStatus('Reconnexion…');
                reconnectTimer = setTimeout(connect, 3000);
            });
        }

        /* RUN du live : le serveur a déjà débité le portefeuille global, une étoile = un tir */
        window.addEventListener('arcade:wallet-run', event => {
            const p = event.detail && event.detail.player, spent = Math.floor(Number(event.detail && event.detail.spent) || 0);
            const name = p && (p.username || p.uniqueId || p.nickname);
            if (name && spent > 0) {
                const viewer = getViewer(name);
                recordContribution(viewer, 'runs', spent);
                queueShots(viewer, spent);
            }
        });

        /* ---------- Sauvegarde ---------- */
        function snapshot() {
            return {
                poolVersion: POOL_VERSION,
                settings,
                username: $('username').value,
                wsUrl: $('ws-url').value,
                queue,
                queueIndex,
                starsGiven,
                knocked,
                slots: slots.map(s => (s.plush && s.state !== 'falling' ? s.plush : null)),
                viewers: [...viewers.values()].map(v => ({ username: v.username, stars: v.stars })),
                contributions: [...contributions.values()],
                contributionTotals
            };
        }

        function saveGame() {
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot()));
                showToast('💾 Partie enregistrée');
            } catch (error) {
                showToast('Enregistrement impossible sur cet appareil.');
            }
        }

        function exportGame() {
            const blob = new Blob([JSON.stringify(snapshot(), null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'peluches-mutantes.json';
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function loadGame() {
            try {
                const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
                if (!saved || !Array.isArray(saved.queue)) return false;
                const savedSettings = saved.settings || {};
                settings.rtp = Math.max(0, Math.min(100, Number(savedSettings.rtp) || 0));
                settings.min = Math.max(1, Math.min(MAX_BASE_REWARD, Math.floor(Number(savedSettings.min) || 1)));
                settings.max = Math.max(settings.min, Math.min(MAX_BASE_REWARD, Math.floor(Number(savedSettings.max) || MAX_BASE_REWARD)));
                const hasCurrentPool = saved.poolVersion === POOL_VERSION &&
                    saved.queue.every(plush => Number.isInteger(plush.reward) && plush.reward > 0 && plush.reward <= MAX_REWARD) &&
                    saved.queue.reduce((sum, plush) => sum + plush.reward, 0) === TOTAL_STARS * PLUSHES_PER_REWARD * REWARD_MULTIPLIER;
                if (hasCurrentPool) {
                    queue = saved.queue;
                    queueIndex = Math.min(queue.length, Math.max(0, saved.queueIndex | 0));
                    starsGiven = saved.starsGiven | 0;
                    knocked = saved.knocked | 0;
                } else {
                    queue = buildPool();
                    queueIndex = 0;
                    starsGiven = 0;
                    knocked = 0;
                }
                (saved.viewers || []).forEach(v => {
                    if (v && typeof v.username === 'string') {
                        viewers.set(v.username.toLocaleLowerCase(), { username: v.username, stars: v.stars | 0, img: null });
                    }
                });
                (saved.contributions || []).forEach(entry => {
                    if (!entry || typeof entry.username !== 'string') return;
                    contributions.set(entry.username.toLocaleLowerCase(), {
                        username: entry.username,
                        coins: Math.max(0, Number(entry.coins) || 0),
                        runs: Math.max(0, Number(entry.runs) || 0),
                        updatedAt: Math.max(0, Number(entry.updatedAt) || 0)
                    });
                    contributionSequence = Math.max(contributionSequence, Number(entry.updatedAt) || 0);
                });
                if (saved.contributionTotals) {
                    contributionTotals.coins = Math.max(0, Number(saved.contributionTotals.coins) || 0);
                    contributionTotals.runs = Math.max(0, Number(saved.contributionTotals.runs) || 0);
                } else {
                    contributions.forEach(entry => {
                        contributionTotals.coins += entry.coins;
                        contributionTotals.runs += entry.runs;
                    });
                }
                if (hasCurrentPool) {
                    slots.forEach((slot, i) => {
                        const plush = saved.slots?.[i];
                        if (plush && Number.isInteger(plush.reward) && plush.reward > 0 && plush.reward <= MAX_REWARD && defs[plush.def]) {
                            Object.assign(slot, { plush, state: 'idle', t: 1 });
                        }
                    });
                }
                $('username').value = saved.username || '';
                if (saved.wsUrl) $('ws-url').value = saved.wsUrl;
                return true;
            } catch (error) {
                return false;
            }
        }

        /* ---------- Panneau flottant ---------- */
        const panel = $('panel');
        const panelState = { x: null, y: 16, hidden: false };
        const liveQueuePanel = $('live-queue');
        const liveQueueState = { x: 16, y: 16, visible: true, positioned: false };

        function applyPanel() {
            panel.classList.toggle('hidden-panel', panelState.hidden);
            $('eye').textContent = panelState.hidden ? '🙈' : '👁';
            $('eye').setAttribute('aria-expanded', String(!panelState.hidden));
            panel.style.top = `${panelState.y}px`;
            if (panelState.x === null) {
                panel.style.left = 'auto';
                panel.style.right = '16px';
            } else {
                const maxX = Math.max(0, innerWidth - panel.offsetWidth);
                panelState.x = Math.min(Math.max(0, panelState.x), maxX);
                panel.style.left = `${panelState.x}px`;
                panel.style.right = 'auto';
            }
        }

        function applyLiveQueuePanel() {
            liveQueuePanel.hidden = !liveQueueState.visible;
            if (!liveQueueState.positioned && innerWidth <= 600) {
                liveQueueState.y = Math.max(16, innerHeight - liveQueuePanel.offsetHeight - 16);
            }
            liveQueuePanel.style.left = `${Math.max(0, Math.min(innerWidth - liveQueuePanel.offsetWidth, liveQueueState.x))}px`;
            liveQueuePanel.style.top = `${Math.max(0, Math.min(innerHeight - 40, liveQueueState.y))}px`;
            $('show-live-queue').textContent = liveQueueState.visible ? 'Masquer la file publique' : 'Afficher la file publique';
            $('show-live-queue').setAttribute('aria-expanded', String(liveQueueState.visible));
            $('live-queue-status').textContent = liveQueueState.visible ? 'La file est visible sur le jeu.' : 'La file est masquée.';
        }

        function savePanel() {
            try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(panelState)); } catch (error) { /* ignoré */ }
        }

        function saveLiveQueuePanel() {
            try { localStorage.setItem(QUEUE_LAYOUT_KEY, JSON.stringify(liveQueueState)); } catch (error) { /* ignoré */ }
        }

        try {
            Object.assign(panelState, JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}'));
        } catch (error) { /* ignoré */ }

        try {
            Object.assign(liveQueueState, JSON.parse(localStorage.getItem(QUEUE_LAYOUT_KEY) || '{}'));
        } catch (error) { /* ignoré */ }
        liveQueueState.x = Number.isFinite(Number(liveQueueState.x)) ? Number(liveQueueState.x) : 16;
        liveQueueState.y = Number.isFinite(Number(liveQueueState.y)) ? Number(liveQueueState.y) : 16;
        liveQueueState.visible = liveQueueState.visible !== false;
        liveQueueState.positioned = liveQueueState.positioned === true;

        let drag = null;
        $('panel-head').addEventListener('pointerdown', event => {
            if (event.target.closest('button') && !panelState.hidden) return;
            if (event.target === $('eye')) return;
            const rect = panel.getBoundingClientRect();
            drag = { id: event.pointerId, dx: event.clientX - rect.left, dy: event.clientY - rect.top };
            $('panel-head').setPointerCapture(event.pointerId);
            panel.classList.add('dragging');
        });
        $('panel-head').addEventListener('pointermove', event => {
            if (!drag || event.pointerId !== drag.id) return;
            panelState.x = event.clientX - drag.dx;
            panelState.y = Math.min(Math.max(0, event.clientY - drag.dy), innerHeight - 40);
            applyPanel();
        });
        const endDrag = () => { if (drag) { drag = null; panel.classList.remove('dragging'); savePanel(); } };
        $('panel-head').addEventListener('pointerup', endDrag);
        $('panel-head').addEventListener('pointercancel', endDrag);
        $('eye').addEventListener('click', () => {
            panelState.hidden = !panelState.hidden;
            applyPanel();
            savePanel();
        });
        addEventListener('resize', applyPanel);
        addEventListener('resize', applyLiveQueuePanel);

        let queueDrag = null;
        $('live-queue-head').addEventListener('pointerdown', event => {
            if (event.target.closest('button')) return;
            const rect = liveQueuePanel.getBoundingClientRect();
            queueDrag = { id: event.pointerId, dx: event.clientX - rect.left, dy: event.clientY - rect.top };
            $('live-queue-head').setPointerCapture(event.pointerId);
            liveQueuePanel.classList.add('dragging');
        });
        $('live-queue-head').addEventListener('pointermove', event => {
            if (!queueDrag || event.pointerId !== queueDrag.id) return;
            liveQueueState.x = event.clientX - queueDrag.dx;
            liveQueueState.y = event.clientY - queueDrag.dy;
            liveQueueState.positioned = true;
            applyLiveQueuePanel();
        });
        const endQueueDrag = () => {
            if (!queueDrag) return;
            queueDrag = null;
            liveQueuePanel.classList.remove('dragging');
            saveLiveQueuePanel();
        };
        $('live-queue-head').addEventListener('pointerup', endQueueDrag);
        $('live-queue-head').addEventListener('pointercancel', endQueueDrag);
        const toggleLiveQueue = () => {
            liveQueueState.visible = !liveQueueState.visible;
            applyLiveQueuePanel();
            saveLiveQueuePanel();
        };
        $('hide-live-queue').addEventListener('click', toggleLiveQueue);
        $('show-live-queue').addEventListener('click', toggleLiveQueue);

        /* ---------- Contrôles ---------- */
        $('rtp').addEventListener('input', () => {
            settings.rtp = Math.max(0, Math.min(100, Number($('rtp').value) || 0));
            $('rtp-out').textContent = `${settings.rtp}%`;
        });
        $('star-min').addEventListener('change', () => {
            settings.min = Math.max(1, Math.min(MAX_BASE_REWARD, Math.floor(Number($('star-min').value) || 1)));
            $('star-min').value = settings.min;
        });
        $('star-max').addEventListener('change', () => {
            settings.max = Math.max(settings.min, Math.min(MAX_BASE_REWARD, Math.floor(Number($('star-max').value) || MAX_BASE_REWARD)));
            $('star-max').value = settings.max;
        });
        $('reset-pool').addEventListener('click', () => {
            settings.min = Math.max(1, Math.min(MAX_BASE_REWARD, Math.floor(Number($('star-min').value) || 1)));
            settings.max = Math.max(settings.min, Math.min(MAX_BASE_REWARD, Math.floor(Number($('star-max').value) || MAX_BASE_REWARD)));
            $('star-min').value = settings.min;
            $('star-max').value = settings.max;
            resetPool();
            showToast('Nouveau cycle de 6000 ⭐ lancé');
        });
        $('voice').addEventListener('click', enableVoice);
        $('connect').addEventListener('click', connect);
        $('save').addEventListener('click', saveGame);
        $('export').addEventListener('click', exportGame);
        const simViewer = () => getViewer($('sim-name').value || 'Spectateur');
        $('sim-gift').addEventListener('click', () => queueShots(simViewer(), 1, true));
        $('sim-burst').addEventListener('click', () => queueShots(simViewer(), 10, true));
        $('sim-join').addEventListener('click', () => {
            const name = $('sim-name').value || 'Spectateur';
            greeted.delete(name.trim().replace(/^@/, '').toLocaleLowerCase());
            getViewer(name);
        });
        $('sim-star').addEventListener('click', () => claimStars(simViewer()));
        $('sim-big-gift').addEventListener('click', () => {
            const viewer = simViewer();
            const coins = Math.max(100, Number(window.ArcadeEffects?.config?.bigGiftCoins) || 100);
            if (typeof window.ArcadeEffects?.simulateBigGift !== 'function') {
                console.error('ArcadeEffects.simulateBigGift est indisponible.');
                showToast('⚠️ Simulation de gros cadeau indisponible.');
                return;
            }
            window.ArcadeEffects.simulateBigGift(viewer.username, coins);
            queueShots(viewer, Math.min(10, coins), true);
        });
        $('sim-share').addEventListener('click', () => {
            if (typeof window.ArcadeEffects?.simulateShare !== 'function') {
                console.error('ArcadeEffects.simulateShare est indisponible.');
                showToast('⚠️ Simulation de partage indisponible.');
                return;
            }
            window.ArcadeEffects.simulateShare();
        });
        if ('speechSynthesis' in window) speechSynthesis.getVoices();

        /* ---------- Démarrage ---------- */
        buildScene();
        if (!loadGame()) resetPool();
        $('rtp').value = settings.rtp;
        $('rtp-out').textContent = `${settings.rtp}%`;
        $('star-min').value = settings.min;
        $('star-max').value = settings.max;
        renderContributionQueue();
        fillSlots(true);
        applyPanel();
        applyLiveQueuePanel();
        resize();
        (document.fonts?.ready ?? Promise.resolve()).then(() => { buildScene(); });
        requestAnimationFrame(frame);
    </script>
</body>
</html>
